和互动来构建知识","d":"（2）①相关的学习理论：根据建构主义学习理论，学生是积极主动的学习者，他们通过参与和互动来构建知识。观察、记录和分析学习过程可以更好地了解学生的学习方式和策略，从而提供有针对性的指导和支持。根据人本主义学习理论，学习是学生知情统一的过程。加强对话交流和倡导协商式评价可以促进师生之间的互动和合作，建立积极的学习氛围，使评价过程更加综合和全面。这样的评价方式能够更好地满足学生的学习需求，促进他们的全面发展。"},{"t":"观察、记录和分析学习过程可以更好地了解学生的学习方式和策略","d":"（2）①相关的学习理论：根据建构主义学习理论，学生是积极主动的学习者，他们通过参与和互动来构建知识。观察、记录和分析学习过程可以更好地了解学生的学习方式和策略，从而提供有针对性的指导和支持。根据人本主义学习理论，学习是学生知情统一的过程。加强对话交流和倡导协商式评价可以促进师生之间的互动和合作，建立积极的学习氛围，使评价过程更加综合和全面。这样的评价方式能够更好地满足学生的学习需求，促进他们的全面发展。"},{"t":"根据人本主义学习理论，学习是学生知情统一的过程","d":"（2）①相关的学习理论：根据建构主义学习理论，学生是积极主动的学习者，他们通过参与和互动来构建知识。观察、记录和分析学习过程可以更好地了解学生的学习方式和策略，从而提供有针对性的指导和支持。根据人本主义学习理论，学习是学生知情统一的过程。加强对话交流和倡导协商式评价可以促进师生之间的互动和合作，建立积极的学习氛围，使评价过程更加综合和全面。这样的评价方式能够更好地满足学生的学习需求，促进他们的全面发展。"},{"t":"相关的学习动机维纳归因理论认为，引导学生正确归因可以进一步激发学生的学习动机","d":"因理论认为，引导学生正确归因可以进一步激发学生的学习动机。基于证据的评价关注学生真实发生的进步，这可以激发学生的学习动机。当学生看到自己的努力和进步得到认可时，他们更有动力继续学习和成长。马斯洛需要层次理论认为，学生的需要分为缺失性需要和成长性需要。关注学生的进步避免单一依靠纸笔测验对学生进行评价，有利于满足学生尊重的需要，进一步激发学生的学习动机。"}]}],"id":"柯虎2-34"},{"num":35,"title":"35 对于教师劳动的知识","subject":"教原","blocks":[{"t":"（1）从教师劳动特点的角度，评析材料中张老师的做法。","items":[{"t":"首先，张老师的做法可以说“事出有因”","d":"（1）教师劳动具有示范性、复杂性、创造性、合作性、长期性和长效性的特点。首先，张老师的做法可以说“事出有因”。教师劳动具有复杂性，教育过程本身就是一个复杂的活动过程。张老师一开始的委屈是由学生家长不理解教师劳动工作的复杂性导致的。家长总是把目光关注在自己孩子身上，然而班级授课制这一教学组织形式下，在短时间的课堂上，老师容易无意识忽略一些孩子，这是难以避免的。张老师被误解，学校也没有很好处理，没有照顾老师的情绪。但是，无论如何，张老师后续的处理方式是不合理的。教师劳动具有示范性、合作性和长期性。从示范性的角度来说，张老师后来有意无意忽略王小明同学，这不符合。"},{"t":"教师劳动具有复杂性，教育过程本身就是一个复杂的活动过程","d":"（1）教师劳动具有示范性、复杂性、创造性、合作性、长期性和长效性的特点。首先，张老师的做法可以说“事出有因”。教师劳动具有复杂性，教育过程本身就是一个复杂的活动过程。张老师一开始的委屈是由学生家长不理解教师劳动工作的复杂性导致的。家长总是把目光关注在自己孩子身上，然而班级授课制这一教学组织形式下，在短时间的课堂上，老师容易无意识忽略一些孩子，这是难以避免的。张老师被误解，学校也没有很好处理，没有照顾老师的情绪。但是，无论如何，张老师后续的处理方式是不合理的。教师劳动具有示范性、合作性和长期性。从示范性的角度来说，张老师后来有意无意忽略王小明同学，这不符合。"},{"t":"但是，无论如何，张老师后续的处理方式是不合理的","d":"（1）教师劳动具有示范性、复杂性、创造性、合作性、长期性和长效性的特点。首先，张老师的做法可以说“事出有因”。教师劳动具有复杂性，教育过程本身就是一个复杂的活动过程。张老师一开始的委屈是由学生家长不理解教师劳动工作的复杂性导致的。家长总是把目光关注在自己孩子身上，然而班级授课制这一教学组织形式下，在短时间的课堂上，老师容易无意识忽略一些孩子，这是难以避免的。张老师被误解，学校也没有很好处理，没有照顾老师的情绪。但是，无论如何，张老师后续的处理方式是不合理的。教师劳动具有示范性、合作性和长期性。从示范性的角度来说，张老师后来有意无意忽略王小明同学，这不符合。"},{"t":"教师劳动具有示范性、合作性和长期性","d":"复杂性、创造性、合作性、长期性和长效性的特点。首先，张老师的做法可以说“事出有因”。教师劳动具有复杂性，教育过程本身就是一个复杂的活动过程。张老师一开始的委屈是由学生家长不理解教师劳动工作的复杂性导致的。家长总是把目光关注在自己孩子身上，然而班级授课制这一教学组织形式下，在短时间的课堂上，老师容易无意识忽略一些孩子，这是难以避免的。张老师被误解，学校也没有很好处理，没有照顾老师的情绪。但是，无论如何，张老师后续的处理方式是不合理的。教师劳动具有示范性、合作性和长期性。从示范性的角度来说，张老师后来有意无意忽略王小明同学，这不符合教师职业道德规范，也违背育。"}]},{"t":"（2）如果你是张老师，面对这种情况，你会怎么做？","items":[{"t":"和家长积极沟通交流：培养孩子，是一项复杂的工作，也要求家长、学校的支持","d":"（2）如果我是张老师，我会：和家长积极沟通交流：培养孩子，是一项复杂的工作，也要求家长、学校的支持。我会在收到家长的投诉后，先和校方、家长说清楚，自己并不是有意忽略王小明同学。而是课堂互动时间有限，也会和家长分析王小明同学平时的表现、成绩等，体谅到家长或许是因为觉得自己孩子成绩不好，会被老师忽略。我会耐心告诉家长，王小明同学不会因为成绩而被忽略，同时在家长面前，赞扬王小明的优点，客观分析其缺点，做到一分为二的看学生，能与家长形成家校合力。通过改进教学组织形式的方式，促进教育过程中的公平；我会客观分析，班级授课制下，的确有时会无意识忽略一些孩子。我会配合分。"},{"t":"通过改进教学组织形式的方式，促进教育过程中的公平","d":"（2）如果我是张老师，我会：和家长积极沟通交流：培养孩子，是一项复杂的工作，也要求家长、学校的支持。我会在收到家长的投诉后，先和校方、家长说清楚，自己并不是有意忽略王小明同学。而是课堂互动时间有限，也会和家长分析王小明同学平时的表现、成绩等，体谅到家长或许是因为觉得自己孩子成绩不好，会被老师忽略。我会耐心告诉家长，王小明同学不会因为成绩而被忽略，同时在家长面前，赞扬王小明的优点，客观分析其缺点，做到一分为二的看学生，能与家长形成家校合力。通过改进教学组织形式的方式，促进教育过程中的公平；我会客观分析，班级授课制下，的确有时会无意识忽略一些孩子。我会配合分。"},{"t":"努力提高自我修养，同时关注自身的心理健康，以合适的方式疏解工作中的压力","d":"（2）如果我是张老师，我会：和家长积极沟通交流：培养孩子，是一项复杂的工作，也要求家长、学校的支持。我会在收到家长的投诉后，先和校方、家长说清楚，自己并不是有意忽略王小明同学。而是课堂互动时间有限，也会和家长分析王小明同学平时的表现、成绩等，体谅到家长或许是因为觉得自己孩子成绩不好，会被老师忽略。我会耐心告诉家长，王小明同学不会因为成绩而被忽略，同时在家长面前，赞扬王小明的优点，客观分析其缺点，做到一分为二的看学生，能与家长形成家校合力。通过改进教学组织形式的方式，促进教育过程中的公平；我会客观分析，班级授课制下，的确有时会无意识忽略一些孩子。我会配合分。"}]}],"id":"柯虎2-35"},{"num":36,"title":"36 行为主义教育理论·中频","subject":"教心","blocks":[{"t":"情境2中，教师的做法依据的是负惩罚","items":[{"t":"材料中老师宣布取消小明去春游的活动资格，属于负惩罚的运用","d":"（2）情境2中，教师的做法依据的是负惩罚。负惩罚是终止愉快刺激，以降低行为的频率。材料中老师宣布取消小明去春游的活动资格，属于负惩罚的运用。"}]}],"id":"柯虎2-36"}],"id":"柯虎2"},{"name":"柯虎3","questions":[{"num":31,"title":"31 陶行知的教育实践及教育思想·高频","subject":"中教史","blocks":[{"t":"“生活教育”实践","items":[{"t":"晓庄学校：陶行知为改造乡村培育乡村教师，在南京创办试验乡村师范学校，后改名晓庄学校。","d":"31.【解析】本题考查《中国教育史》中近代教育家陶行知的教育实践及教育思想，属于高频考点，难度适中。陶行知的教育实践活动可以从：中华平民教育会、晓庄学校、科学下嫁、山海工学团、小先生制、艺友制、育才学校中进行举例回答；陶行知的教育思想则从：生活即教育、社会即学校、教学做合一进行论述即可。对于教育家精神的看法，要有教育家精神+自己的看法，教育家精神要表述完整。【参考答案】陶行知是中国现代杰出的人民教育家、思想家。他毕生奉献给教育，勇于批判和改革旧教育，为中国探索民族教育的新路。他的教育思想具有创造性并不断发展、不断进步而其“生活教育”思想则贯穿始终。"},{"t":"山海工学团：陶行知在上海郊区大场创办山海工学团","d":"31.【解析】本题考查《中国教育史》中近代教育家陶行知的教育实践及教育思想，属于高频考点，难度适中。陶行知的教育实践活动可以从：中华平民教育会、晓庄学校、科学下嫁、山海工学团、小先生制、艺友制、育才学校中进行举例回答；陶行知的教育思想则从：生活即教育、社会即学校、教学做合一进行论述即可。对于教育家精神的看法，要有教育家精神+自己的看法，教育家精神要表述完整。【参考答案】陶行知是中国现代杰出的人民教育家、思想家。他毕生奉献给教育，勇于批判和改革旧教育，为中国探索民族教育的新路。他的教育思想具有创造性并不断发展、不断进步而其“生活教育”思想则贯穿始终。"},{"t":"“小先生制”：为了解决普及教育中师资缺乏、经费匮乏、女子教育困难等问题","d":"为了解决普及教育中师资缺乏、经费匮乏、女子教育困难等问题，陶行知提出儿童是中国实现普及教育的重要力量，并提出“小先生制”。"},{"t":"育才学校：抗战期间","d":"31.【解析】本题考查《中国教育史》中近代教育家陶行知的教育实践及教育思想，属于高频考点，难度适中。陶行知的教育实践活动可以从：中华平民教育会、晓庄学校、科学下嫁、山海工学团、小先生制、艺友制、育才学校中进行举例回答；陶行知的教育思想则从：生活即教育、社会即学校、教学做合一进行论述即可。对于教育家精神的看法，要有教育家精神+自己的看法，教育家精神要表述完整。【参考答案】陶行知是中国现代杰出的人民教育家、思想家。他毕生奉献给教育，勇于批判和改革旧教育，为中国探索民族教育的新路。他的教育思想具有创造性并不断发展、不断进步而其“生活教育”思想则贯穿始终。"}]},{"t":"“生活教育”理论体系“生活即教育”是生活教育理论的核心","items":[{"t":"生活含有教育的意义。陶行知认为，“教育的根本意义是生活之变化”。","d":"陶行知认为，“教育的根本意义是生活之变化”。"},{"t":"实际生活是教育的中心","d":"陶行知认为生活与教育是一回事，是同一个过程，教育不能脱离生活。教育要通过生活来进行。"},{"t":"生活决定教育，教育改造生活","d":"造生活。一方面，生活决定教育，表现为教育的目的、原则、内容和方法都由生活决定；另一方面，教育又能改造生活，推动生活进步。教育不仅改造着社会生活也改造着每个人的生活。“社会即学校”“生活教育”理论的另一主张是“社会即学校”，它是“生活即教育”思想在学校与社会关系问题上的具体化。"},{"t":"“社会即学校”“生活教育”理论的另一主张是“社会即学校”","d":"③生活决定教育，教育改造生活。一方面，生活决定教育，表现为教育的目的、原则、内容和方法都由生活决定；另一方面，教育又能改造生活，推动生活进步。教育不仅改造着社会生活也改造着每个人的生活。“社会即学校”“生活教育”理论的另一主张是“社会即学校”，它是“生活即教育”思想在学校与社会关系问题上的具体化。"},{"t":"“社会含有学校的意味”。因为到处是生活，所以到处是教育，整个社会就像一个教育的场所。","d":"因为到处是生活，所以到处是教育，整个社会就像一个教育的场所。"}]},{"t":"基于陶行知的教育思想和实践，我对教育家精神的理解：","items":[{"t":"无私奉献精神","d":"捧着一颗心来，不带半根草去”，是陶先生的名言，他的一生忠实地履行了这一名言。我们要学习陶行知，首先就要学习他这种精神，学习他的为人。"},{"t":"艰韧不拔的奋斗精神","d":"陶先生是在当时的反动派统治之下办教育，帮助劳苦大众与苦难现实作斗争，引导人民向着解放与幸福的道路前进。具有战胜一切困难的勇气和百折不挠的毅力。正如马克思所讲：“在科学的道路上，是没有平坦的大道可走的”，要想在理论上和实践中都取得较好的成绩，仍必须学习和发扬陶先生的奋斗精神。"},{"t":"一切从实际出发的求真务实精神","d":"务实精神。陶先生的“生活教育理论”，是从实践中来，又到实践中去的十分重视社会实践的理论。他讲“千教万教，教人求真；千学万学，学做真人”，在教育方法上特别重视“教学做合一”，所体现的就是一切从实际出发的求真务实精神。"},{"t":"勇于开拓进取的创造精神","d":"神。陶先生是最具有开拓创新精神的教育家，是我国创造教育理论的奠基人。教育在培育民族创新精神和培养创造性人才方面，肩负着特殊的使命。每一个学校，都要爱护和培养学生的好奇心、求知欲，帮助学生自主学习、独立思考，保护学生的探索精神、创新思维，营造崇尚真知、追求真理的氛围，为学生的禀赋和潜能的充分开发创造一种宽松的环境。教育家精神：。"},{"t":"心有大我、至诚报国的理想信念；"}]}],"id":"柯虎3-31"},{"num":32,"title":"32 进步教育运动发展历程·低频","subject":"外教史","blocks":[{"t":"成型（1918-1929年）","items":[{"t":"自然发展的自由","d":"②兴趣是所有作业的动机；③教师是引导者而不是监督者；④科学研究儿童；⑤重视影响儿童身体发展的一切因素；⑥为满足儿童生活的需要，学校与家庭应进行合作；⑦进步主义学校应当成为教育运动的领导者。"},{"t":"3.形成研究阵地","d":"这一时期，进步教育日益专业化，哥伦比亚大学师范学院成为进步教育运动的中心，杜威担任协会的名誉主席。"}]},{"t":"转折（1929-1943年）","items":[{"t":"由于进步教育运动的专业化倾向，失去了公众的理解和支持","d":"（三）转折（1929-1943年）由于进步教育运动的专业化倾向，失去了公众的理解和支持。同时，1929年开始的大萧条引起的青年就业困难，使人们怀疑进步教育运动下的学校教育质量，这严重影响了美国进步教育运动的发展。"},{"t":"发生转向","d":"一是从强调儿童中心和个人的自由转向强调学校的社会职能，二是教育中心从初等教育转向中等教育。"},{"t":"分裂阵营。进步教育运动内部出现分化。"},{"t":"受到攻击","d":"新保守主义针对进步教育中废除传统教育的课程计划、班级授课制等合理性的措施进行了批判，也针对他们过度地放纵儿童进行了猛烈的攻击。"}]},{"t":"衰落（1944-1957年）","items":[{"t":"难以同步","d":"进步教育运动不能与美国的社会变化始终一致，未能较好地适应美国社会发展对教育提出的新要求。"},{"t":"自身局限","d":"进步教育理论和实践本身存在许多矛盾和局限，如过分强调儿童个人的自由，忽视社会和文化对个人发展的决定作用，过分否定学校工作的一些基本规律，导致教学质量的下降。"},{"t":"受到抨击","d":"改造主义和保守主义等教育流派的抨击与批判，击中了进步教育的要害加速了进步教育的衰落。"},{"t":"内部决裂","d":"进步教育运动在理论上的分化，导致运动内部的决裂。同时，进步教育运动对教师提出过高的要求，使教师难以完成和达到进步教育家所期望的教育效果。对我国教育改革的启示：。"},{"t":"对儿童教育的反思：从传统教育忽视儿童转向发扬儿童中心论","d":"从传统教育忽视儿童转向发扬儿童中心论，进步主义提出了“整体儿童”的概念，关注儿童的一切能力或力量。"}]}],"id":"柯虎3-32"},{"num":33,"title":"33 科技与教育之间的关系","subject":"教原","blocks":[{"t":"（1）阐述科技与教育之间的关系。","items":[{"t":"科学技术对教育具有重要的影响，表现在：","d":"（1）教育与科技的关系科学技术对教育具有重要的影响，同时教育对科学技术具有重要的反作用，具体表现在：科学技术对教育具有重要的影响，表现在：。"},{"t":"科学技术影响教育观念：教育的各种观念都会受到科学技术的影响。","d":"教育的各种观念都会受到科学技术的影响。"},{"t":"科学技术影响教育结构：教育结构随着科技的发展发生了变化，受科学技术的影响。","d":"教育结构随着科技的发展发生了变化，受科学技术的影响。"},{"t":"科学技术影响教育的目的、内容和技术","d":"的、内容和技术：科学技术的快速发展使得人工智能技术在教育领域得到广泛应用，在一定程度上也影响着教育的目的、内容和技术。教育对科学技术具有反作用，表现在：。"},{"t":"教育为科学技术的发展提供知识积累：科学技术的发展需要相应的专业知识、能力作理论基础","d":"提供知识积累：科学技术的发展需要相应的专业知识、能力作理论基础，因此科技的发展离不开教育，教育为其提供了必要的知识积累。"}]},{"t":"（2）阅读上述材料，分析人工智能可能为教育带来哪些挑战。","items":[{"t":"过度关注个性化学习和考试成绩","d":"考试成绩，偏离教育本质人工智能在教育场景中，常把“个性化学习”理解成根据学生答题数据推送知识点，把提升考试分数当作主要目标。这种做法会让教育变得片面：只看重学生对知识点的掌握程度，却忽略了学生在尝试、犯错、思考中培养的独立思考能力、创新想法，在小组学习里锻炼的沟通和合作能力，这些对学生成长很关键的部分，都容易被人工智能所忽视。学生会慢慢只在意分数高低，对学习本身的兴趣和热情会减少，变成被动应付考试的人，不再是能全面发展的个体。"},{"t":"影响教学质量人工智能会影响教学质量","d":"会影响教学质量。从教学内容和方式来看，人工智能的算法更倾向于按照固定的流程传递知识，没办法像老师那样，根据班里学生的理解能力、生活经历灵活调整上课节奏，也很难补充贴近学生例子，导致教学内容变得死板，没办法真正做到根据每个学生的情况调整教学，最终让整体教学质量下降。"},{"t":"导致不确定性和过度依赖技术一方面，人工智能在教育中的应用存在很多不确定的地方","d":"赖技术一方面，人工智能在教育中的应用存在很多不确定的地方。人工智能的运行依靠大量数据，但在教育里，学生的学习动力、情绪状态、家庭环境等复杂因素，没办法全部用数据衡量。这就导致人工智能判断学生的学习需求时可能出错，推荐的学习计划、给出的评价结果，也可能和学生的实际情况不一样。另一方面，如果过度依赖人工智能技术，老师把备课、上课、批改作业这些重要的教学工作都交给人工智能，慢慢就会失去设计优质教学内容、掌控课堂、敏锐发现学生需求的能力，从原本主导教学的人，变成只是操作人工智能的人。同时，学生也可能习惯从人工智能那里直接获取答案，不再主动思考、自己解决问题，形成。"}]},{"t":"（3）结合所学知识","items":[{"t":"利用人工智能变革学习方式人工智能为实现个性化学习和培养创新思维注入了新的活力","d":"方式人工智能为实现个性化学习和培养创新思维注入了新的活力，教育工作者可以根据学生特点、学习需求、身心发展规律，生成一个个性化、定制化的学习方案为学生提供良好的沉浸式学习体验。"},{"t":"利用人工智能变革教学方式教育可利用人工智能改变传统讲授法等教学方式","d":"方式教育可利用人工智能改变传统讲授法等教学方式，为教学注入新鲜形式，激发学生的学习兴趣，调动其学习动机，改善教学设计。"},{"t":"利用人工智能变革教学内容教育工作者要明确人工智能进入课堂是为了拓宽教育的内容边界","d":"方式教育可利用人工智能改变传统讲授法等教学方式，为教学注入新鲜形式，激发学生的学习兴趣，调动其学习动机，改善教学设计。"},{"t":"利用人工智能变革评价方式教育工作者可借助人工智能技术评价的多元化、过程化手段","d":"方式教育工作者可借助人工智能技术评价的多元化、过程化手段，以评价结果的准确性正确评价学生发展、成绩方面等，优化教学评价。"},{"t":"利用人工智能变革师生关系教育工作者应利用人工智能做到因材施教","d":"关系教育工作者应利用人工智能做到因材施教，与学生建立民主平等，和谐相处，教学相长的师生关系。教育工作者要警惕过度依赖技术造成的负面影响，让技术服务教育，而不是被技术主导。"}]}],"id":"柯虎3-33"},{"num":34,"title":"34 对于迁移理论的理解","subject":"教原","blocks":[{"t":"（1）结合所学知识，请简述至少三种迁移理论。","items":[{"t":"相同元素说：桑代克、伍德沃斯认为只有在原先的学习情境与新的学习情境有相同要素时","d":"桑代克、伍德沃斯认为只有在原先的学习情境与新的学习情境有相同要素时，原先的学习才有可能迁移到新的学习中去。并且，迁移的程度取决于这两种情境相同要素的多少。"},{"t":"概括化理论：贾德认为迁移产生的关键在于学习者能够概括出两组活动之间的共同原理。","d":"贾德认为迁移产生的关键在于学习者能够概括出两组活动之间的共同原理。学习者的概括水平越高，迁移的可能性就越大。"},{"t":"学习者的概括水平越高，迁移的可能性就越大","d":"③概括化理论：贾德认为迁移产生的关键在于学习者能够概括出两组活动之间的共同原理。学习者的概括水平越高，迁移的可能性就越大。"},{"t":"关系理论：格式塔心理学家重视学习者对学习情境内部关系的顿悟在迁移中的作用","d":"格式塔心理学家重视学习者对学习情境内部关系的顿悟在迁移中的作用，他们认为，迁移的关键不在于有多少共同因素，而是学习者是否发现了两个学习经验之间存在的共同关系。"},{"t":"认知结构迁移理论：奥苏伯尔认为","d":"奥苏伯尔认为，在有意义学习中，学生积极主动地将新知识与认知结构中有关的旧知识发生相互作用，旧知识得到充实和改造，新知识获得了实际意义。这个过程就是陈述性知识迁移的过程，而其中的关键因素是认知结构本身的可利用性、可辨别性与清晰稳定性。"}]},{"t":"（2）结合所学知识","items":[{"t":"个体加工学习材料过程的相似性","d":"的相似性。个体加工信息的方法、习惯和风格各有不同，个体善于将自己习惯的加工信息的过程迁移到其他问题和情境中去。"},{"t":"已有经验的概括水平","d":"学习迁移实际上是已有经验的具体化或新旧经验的协调过程。因此已有经验的概括水平对迁移的效果有很大影响。"},{"t":"学习态度和定势","d":"在学习态度上，个体是否具有主动迁移的意识、能否进行自我调控是学习迁移的关键。一般来说，定势对学习能够起促进作用，但是有时也会起阻碍作用。"},{"t":"年龄、智力水平。学习者的年龄、智力水平等方面都在不同程度上影响迁移的产生。","d":"者的年龄、智力水平等方面都在不同程度上影响迁移的产生。客观因素：。"},{"t":"学习材料、情境的相似性。越是相似的材料、问题和情境，迁移越容易发生。","d":"性。越是相似的材料、问题和情境，迁移越容易发生。"}]},{"t":"（3）请说明，教师应如何促进学生的学习迁移？","items":[{"t":"加强知识联系","d":"教师应重视新旧知识技能之间的联系，要促使学生把已学过的内容迁移到新知识上去，可以通过提问、提示等方式，使学生利用已有知识来理解新知识，促进纵向迁移。"},{"t":"重视学习策略","d":"教师要有意识地教学生学会如何学习，帮助他们掌握概括化的认知策略和元认知策略。认知策略和元认知策略是可教的，教授学习策略就会促进学习迁移。"},{"t":"强调概括总结","d":"教师要有意识地启发学生对所学内容进行概括总结。教师可以引导学生提高概括总结的能力，充分利用原理、原则的迁移。在讲解原理、原则时要尽可能用丰富的举例说明，帮助学生将理论应用于实践之中。"},{"t":"培养迁移意识","d":"教师通过反馈和归因控制等方式使学生形成关于学习的积极态度，鼓励学生大胆地进行迁移，将知识灵活应用。"}]}],"id":"柯虎3-34"},{"num":35,"title":"35 教师对于德育的理解","subject":"教原","blocks":[{"t":"不正确。教师的教育观念只停留在知识的讲授上","items":[{"t":"全方位德育指德育应当普遍存在于学校的一切教育活动之中","d":"（1）不正确。教师的教育观念只停留在知识的讲授上，忽视学生情感价值观的需要。全方位德育指德育应当普遍存在于学校的一切教育活动之中。每一个教师都应该是德育教师。教师以自己的教学活动与日常生活全方位地影响着学生的道德成长。教师的德育活动并不仅仅存在于课堂之中，更存在于日常生活之中，即直接德育和间接德育相结合，全方位地促进学生品德的发展。"}]},{"t":"针对张老师：改进德育授课方式。","items":[{"t":"用生活案例讲概念：讲“责任”时","d":"讲“责任”时，别只说定义，先提“值日生打扫卫生”“帮同学讲题”“家里分担家务”这些学生熟悉的事，再问“没这些责任会怎样”，让学生从具体场景懂道理。"},{"t":"换种方式提问：将“你怎么理解责任”","d":"将“你怎么理解责任”，改成“班级搞公益活动，你想做什么任务？为什么？”“看到同学忘做集体任务，你会怎么做？”，让学生结合自己的行动回答。"},{"t":"加实践环节：让学生分组写“班级责任公约”","d":"让学生分组写“班级责任公约”，或模拟“班级管理者”处理小事，让学生在做事中体会责任，不是光听道理。"}]},{"t":"针对王老师：挖掘数学学科的育人性。","items":[{"t":"找数学里的思政点：讲统计时，让学生统计校园垃圾分类数据，聊“数据准了对环保有啥用”","d":"讲统计时，让学生统计校园垃圾分类数据，聊“数据准了对环保有啥用”；讲几何时，看故宫的对称美，聊传统文化，把价值观融入知识点。"},{"t":"写教案时明确小目标：比如教解方程","d":"比如教解方程，就写“鼓励学生解题不放弃”“让学生学会听同学的解题思路”，上课多夸坚持解题、帮同学的学生，把引导落到实处。还可以让王老师带学生算资源使用数据，让思政和数学结合起来。"}]}],"id":"柯虎3-35"},{"num":36,"title":"36 《教育心理学》","subject":"教心","blocks":[{"t":"加德纳多元智能理论指出","items":[{"t":"加德纳多元智能理论指出","d":"36.【解析】本题结合材料考查《教育心理学》，可以从加德纳多元智力、班杜拉观察学习、马斯洛需要层次、罗杰斯人本理论进行分析。能言之有理答出一个理论，结合案例分析即可。【参考答案】加德纳多元智能理论指出，人的智能包括语言、逻辑-数学、运动、人际等多种类型，无高低之分。王老师发现有特长（运动智能）的王大明、善交际（人际智能）的顾小丹未被推荐，且察觉两人沮丧情绪，说明她跳出“成绩=唯一优秀标准”的局限，关注到学生不同维度的优势，契合该理论对“多元发展”的倡导，能避免学生因单一评价陷入自我否定。"}]}],"id":"柯虎3-36"}],"id":"柯虎3"},{"name":"柯虎4","questions":[{"num":31,"title":"31 《中国教育史》近代教育家蔡元培的…·高频","subject":"中教史","blocks":[{"t":"提出“五育并举”的教育方针","items":[{"t":"在实利主义教育上，蔡元培主张“以人民生计为普通教育之中坚”，加强职业技能的培训；","d":"（1）提出“五育并举”的教育方针。蔡元培在《对于教育方针之意见》中提出“五育并举”的教育方针，包括军国民教育、实利主义教育、公民道德教育、世界观教育和美感教育，主张“五育”不可偏废。在军国民教育上，蔡元培主张将军事教育引入学校和社会教育中，强调学生生活的军事化，特别是体育的军事化；在实利主义教育上，蔡元培主张“以人民生计为普通教育之中坚”，加强职业技能的培训；在公民道德教育上，蔡元培主张从儒家传统文化入手进行公民道德教育，其内涵和资产阶级追求的自由、平等、博爱的精神是相通的；在世界观教育上，将世界分为“现象世界”和“实体世界”，主张人们立足于现象世界而追。"},{"t":"在公民道德教育上","d":"（1）提出“五育并举”的教育方针。蔡元培在《对于教育方针之意见》中提出“五育并举”的教育方针，包括军国民教育、实利主义教育、公民道德教育、世界观教育和美感教育，主张“五育”不可偏废。在军国民教育上，蔡元培主张将军事教育引入学校和社会教育中，强调学生生活的军事化，特别是体育的军事化；在实利主义教育上，蔡元培主张“以人民生计为普通教育之中坚”，加强职业技能的培训；在公民道德教育上，蔡元培主张从儒家传统文化入手进行公民道德教育，其内涵和资产阶级追求的自由、平等、博爱的精神是相通的；在世界观教育上，将世界分为“现象世界”和“实体世界”，主张人们立足于现象世界而追。"},{"t":"在美感教育上，蔡元培认为美育是世界观教育的主要途径，主张以美育代替宗教","d":"（1）提出“五育并举”的教育方针。蔡元培在《对于教育方针之意见》中提出“五育并举”的教育方针，包括军国民教育、实利主义教育、公民道德教育、世界观教育和美感教育，主张“五育”不可偏废。在军国民教育上，蔡元培主张将军事教育引入学校和社会教育中，强调学生生活的军事化，特别是体育的军事化；在实利主义教育上，蔡元培主张“以人民生计为普通教育之中坚”，加强职业技能的培训；在公民道德教育上，蔡元培主张从儒家传统文化入手进行公民道德教育，其内涵和资产阶级追求的自由、平等、博爱的精神是相通的；在世界观教育上，将世界分为“现象世界”和“实体世界”，主张人们立足于现象世界而追。"}]},{"t":"提出教育独立思想","items":[{"t":"教育独立思想的内容包括：教育经费独立：政府指定固定的款项，专作教育经费，不能移作他用","d":"括：教育经费独立：政府指定固定的款项，专作教育经费，不能移作他用；教育行政独立：设立专管教育的行政机构，不附设于政府部门；教育学术和内容独立；教育方针应保持稳定、能自由编辑、出版、选用教科书；教育脱离宗教独立。"},{"t":"教育独立思想的实践设想：蔡元培主张将全国分为若干个大学区","d":"想：蔡元培主张将全国分为若干个大学区，每区设立一所大学，管理所有教育事务，但大学区制度没有完全建立。"},{"t":"对教育独立思想的评价：教育活动必须接受社会的物质支持并传播一定的政治和社会价值体系","d":"教育活动必须接受社会的物质支持并传播一定的政治和社会价值体系，它因此依附于一定的政治和社会力量，不可能也不应该完全独立。但是不完全独立不等于不能相对独立，教育主体的能动性决定了它在教育活动中有自主选择的能力和自由。"}]},{"t":"蔡元培的教育实践。蔡元培的教育实践集中体现在对北京大学的改革上。","items":[{"t":"抱定宗旨，改变校风。","d":"蔡元培认为，大学应是“研究高尚学问之地”，改革北京大学的第一步是明确大学的宗旨，并为师生创造研究高深学问的条件和氛围。第一，改变学生观念，让学生抱定为求学而来的宗旨；第二，整顿教师队伍，延聘积学热心的教员；第三，发展研究所，广积图书，引导师生研究兴趣；第四，砥砺德行，培养正当兴趣。"},{"t":"第一，改变学生观念，让学生抱定为求学而来的宗旨；","d":"①抱定宗旨，改变校风。蔡元培认为，大学应是“研究高尚学问之地”，改革北京大学的第一步是明确大学的宗旨，并为师生创造研究高深学问的条件和氛围。第一，改变学生观念，让学生抱定为求学而来的宗旨；第二，整顿教师队伍，延聘积学热心的教员；第三，发展研究所，广积图书，引导师生研究兴趣；第四，砥砺德行，培养正当兴趣。"},{"t":"第二，整顿教师队伍，延聘积学热心的教员；","d":"①抱定宗旨，改变校风。蔡元培认为，大学应是“研究高尚学问之地”，改革北京大学的第一步是明确大学的宗旨，并为师生创造研究高深学问的条件和氛围。第一，改变学生观念，让学生抱定为求学而来的宗旨；第二，整顿教师队伍，延聘积学热心的教员；第三，发展研究所，广积图书，引导师生研究兴趣；第四，砥砺德行，培养正当兴趣。"},{"t":"第三，发展研究所，广积图书，引导师生研究兴趣；","d":"①抱定宗旨，改变校风。蔡元培认为，大学应是“研究高尚学问之地”，改革北京大学的第一步是明确大学的宗旨，并为师生创造研究高深学问的条件和氛围。第一，改变学生观念，让学生抱定为求学而来的宗旨；第二，整顿教师队伍，延聘积学热心的教员；第三，发展研究所，广积图书，引导师生研究兴趣；第四，砥砺德行，培养正当兴趣。"},{"t":"贯彻“思想自由，兼容并包”的办学原则。","d":"并包”的办学原则。蔡元培认为，“大学者，‘囊括大典，网罗众家’之学府也”。在学术上“循‘思想自由’原则，取兼容并包主义”。在教师的聘任上，罗致各类学术人才，使北京大学的教师队伍呈现出流派纷呈的局面。"}]}],"id":"柯虎4-31"},{"num":32,"title":"32 《外国教育史》卢梭的自然主义教育·高频","subject":"外教史","blocks":[{"t":"自然主义教育思想的实施","items":[{"t":"卢梭的自然主义教育思想是教育界一场哥白尼式的革命","d":"32.【解析】本题考查《外国教育史》卢梭的自然主义教育，属于高频考点，难度较低。答题者可从卢梭的著作或教育背景入题，按照讲义与课程内容对自然主义教育进行简述即可。【参考答案】卢梭的自然主义教育思想集中表现在他的著作《爱弥儿》中。"}]}],"id":"柯虎4-32"},{"num":33,"title":"33 劳动教育的理解与重要意义","subject":"教原","blocks":[{"t":"（1）简述劳动教育的含义及开展劳动教育的必要性。","items":[{"t":"开展劳动教育的必要性：大中小学实施劳动教育","d":"（1）劳动教育的含义：劳动教育与德育、智育、体育、美育并列，作为全面发展教育的组成部分，是指学校通过学生亲身参与实践，特别是参与劳动技术生产过程，培养学生形成正确的劳动观念和劳动习惯，使学生获得有关劳动技术的基本知识和技能。开展劳动教育的必要性：大中小学实施劳动教育，实现教育与生产劳动相结合，是培养全面发展的人的重要途径，具有多方面的深远意义：。"},{"t":"实施劳动教育能更好地促进学生的全面发展。","d":"促进学生的全面发展。教育与生产劳动相结合，是造就全面发展的人的基本途径。通过劳动技术实践过程，将所学知识与实际生产劳动联系起来，有助于促进学生智力的发展，有助于学生体质的增强。此外，劳动实践过程以及劳动成果所包含的美的因素，也有助于学生审美意识的培养。"},{"t":"教育与生产劳动相结合，是造就全面发展的人的基本途径","d":"（1）劳动教育的含义：劳动教育与德育、智育、体育、美育并列，作为全面发展教育的组成部分，是指学校通过学生亲身参与实践，特别是参与劳动技术生产过程，培养学生形成正确的劳动观念和劳动习惯，使学生获得有关劳动技术的基本知识和技能。开展劳动教育的必要性：大中小学实施劳动教育，实现教育与生产劳动相结合，是培养全面发展的人的重要途径，具有多方面的深远意义：。"},{"t":"此外，劳动实践过程以及劳动成果所包含的美的因素，也有助于学生审美意识的培养","d":"①实施劳动教育能更好地促进学生的全面发展。教育与生产劳动相结合，是造就全面发展的人的基本途径。通过劳动技术实践过程，将所学知识与实际生产劳动联系起来，有助于促进学生智力的发展，有助于学生体质的增强。此外，劳动实践过程以及劳动成果所包含的美的因素，也有助于学生审美意识的培养。"},{"t":"实施劳动教育能更好地促进社会发展。","d":"促进学生的全面发展。教育与生产劳动相结合，是造就全面发展的人的基本途径。通过劳动技术实践过程，将所学知识与实际生产劳动联系起来，有助于促进学生智力的发展，有助于学生体质的增强。此外，劳动实践过程以及劳动成果所包含的美的因素，也有助于学生审美意识的培养。"}]},{"t":"（2）从家庭、学校和社会三方面","items":[{"t":"第一，对于学校来说：","d":"（2）全面加强新时代大中小学劳动教育需要社会、学校、家庭多方面的努力。第一，对于学校来说：劳动课程是学校实施劳动教育的重要途径，在劳动教育中发挥主导作用，要有目的、有计划地组织学生参加日常生活劳动、生产劳动和服务性劳动，培养学生正确的劳动价值观和良好的劳动品质。第二，对于家长来说：。"},{"t":"劳动课程是学校实施劳动教育的重要途径","d":"33.【解析】本题结合材料，考查《教育学原理》中劳动教育的理解与重要意义。第一问属于常规考题，对于劳动教育的内容定义与必要性可以从全面发展教育的角度进行回答。第二问从三个角度加强劳动教育，对学校来说劳动课程是学校实施劳动教育的重要途径；对家庭来说，可以将劳动教育融合进日常生活；对社会来说可以与学校一起开展一些体验活动。第三问答案不唯一，从课程主题、课程目标、课程内容、课程评价进行回答即可。【参考答案】。"},{"t":"第二，对于家长来说：","d":"（2）全面加强新时代大中小学劳动教育需要社会、学校、家庭多方面的努力。第一，对于学校来说：劳动课程是学校实施劳动教育的重要途径，在劳动教育中发挥主导作用，要有目的、有计划地组织学生参加日常生活劳动、生产劳动和服务性劳动，培养学生正确的劳动价值观和良好的劳动品质。第二，对于家长来说：。"},{"t":"引导家长树立劳动教育观念。","d":"观念。学校要通过家长会、家长学校、家长开放日、给家长的一封信等方式，向家长宣传劳动对学生身心发展的价值，促进家长对劳动教育形成正确认知。"},{"t":"指导家长把劳动教育有机融入家庭日常生活。","d":"机融入家庭日常生活。学校要根据本地、本校实际，设计不同学段学生家庭劳动清单，根据家庭日常生活实际，鼓励家长利用整理房间、打扫卫生、器具维护、美化家庭、养护绿植、烹饪帮厨等机会，把劳动教育融入日常生活中，让学生坚持不懈地完成，从而养成居家生活劳动的好习惯。"}]},{"t":"（3）如果你是某小学的劳动教师，你会如何设计一堂劳动课？","items":[{"t":"劳动课程主题：收纳整理","d":"（3）设计一堂劳动课。劳动课程主题：收纳整理。课程目标：通过对学习用品、生活用品、厨房用具、家中杂物等物品的收纳整理，培养学生的思考能力、逻辑能力、统筹能力等综合能力；使学生体验整齐有序、条理做事的过程，从而形成良好的思维基础、培养其自控和掌管人生的能力。课程内容：对教室内学习用品和教学用品进行收纳整理。课程评价：总分100分，主要包括三个方面组成：①学生参与活动的出勤记录，占成绩的20%；②劳动课程过程中的记录，占成绩的20%；③学生活动中或活动后完成任务的情况和活动的成果，占成绩的60%。"},{"t":"课程目标：通过对学习用品、生活用品、厨房用具、家中杂物等物品的收纳整理","d":"5.B解析：本题考查《教育学原理》课程。B选项：课程计划又称课程方案，是课程安排的具体形式，是根据教育目的和培养目标制定的有关学校教育教学的指导性文件。A选项：课程目标是课程实施应达到的学生身心素质发展的预期结果，是对培养目标的具体化。C选项：课程标准又称课程大纲，是确定学校教育一定阶段的课程水准、课程结构与课程模式的纲领性文件，课程标准是针对具体某门课制定的。D选项：教科书是依据课程标准和学生的接受能力编写的、系统反映学科内容的教学用书。故本题选B。"},{"t":"课程内容：对教室内学习用品和教学用品进行收纳整理","d":"32.【解析】本题考查《外国教育史》卢梭的自然主义教育，属于高频考点，难度较低。答题者可从卢梭的著作或教育背景入题，按照讲义与课程内容对自然主义教育进行简述即可。【参考答案】卢梭的自然主义教育思想集中表现在他的著作《爱弥儿》中。"},{"t":"课程评价：总分100分","d":"33.【解析】本题结合材料，考查《教育学原理》中劳动教育的理解与重要意义。第一问属于常规考题，对于劳动教育的内容定义与必要性可以从全面发展教育的角度进行回答。第二问从三个角度加强劳动教育，对学校来说劳动课程是学校实施劳动教育的重要途径；对家庭来说，可以将劳动教育融合进日常生活；对社会来说可以与学校一起开展一些体验活动。第三问答案不唯一，从课程主题、课程目标、课程内容、课程评价进行回答即可。【参考答案】。"}]}],"id":"柯虎4-33"},{"num":34,"title":"34 《教育心理学》记忆规律与记忆力·中频","subject":"教心","blocks":[{"t":"（1）结合材料和所学知识，阐述记忆的规律。","items":[{"t":"记忆的时间和容量是有限的","d":"限的。根据加涅的理论，记忆是由短时记忆经过编码进入长时记忆的。短时记忆只能容纳5~9个组块。"}]},{"t":"（2）结合认知策略，谈谈如何培养学生的记忆力？","items":[{"t":"整体学习和部分学习相结合","d":"结合。在学习过程中可以先进行分块部分学习，然后再进行整体学习。还可以进行过度学习，过度学习150%的效果最好。"},{"t":"掌握精加工策略","d":"比如运用位置记忆、首字连词和关键词等记忆术策略，还可以在学习过程中采用做笔记、联系实际生活、充分利用背景知识等策略。"},{"t":"注意复习","d":"学习之后及时复习可延长记忆时间，防止遗忘。还可以进行集中复习和分散复习，或者可以采用自问自答和尝试背诵的方式来保持记忆。"}]}],"id":"柯虎4-34"},{"num":35,"title":"35 《教育心理学》维果茨基的最近发展…·高频","subject":"教心","blocks":[{"t":"王老师所面临的困境是班上学生学业水平差异大","items":[{"t":"（1）个性化教学：采用个性化教学方法","d":"采用个性化教学方法，根据学生的学习水平和需求，为不同水平的学生提供定制化的教学内容和支持。"},{"t":"（2）分层教学：将学生分成不同层次的小组","d":"将学生分成不同层次的小组，每个小组根据学生的学习水平设置相应的教学内容和任务，以确保每个学生都能在适合自己水平的环境中学习。"},{"t":"（3）小组合作学习：鼓励学生之间进行小组合作学习","d":"鼓励学生之间进行小组合作学习，让学生相互学习和支持，帮助学生在不同水平的情况下共同成长。"},{"t":"（4）利用混合教学资源：提供多样化的教学资源","d":"源：提供多样化的教学资源，包括视频、练习题、小组讨论等，以满足不同学生的学习风格和需求。"}]}],"id":"柯虎4-35"},{"num":36,"title":"36 《教育心理学》学习动机理论·高频","subject":"教心","blocks":[{"t":"（1）请用学习动机理论分析上述案例。","items":[{"t":"韦纳的归因理论提出了“三维度六因素”，认为人们常将成败归因于能力、努力、任务难度和运气","d":"三维度六因素”，认为人们常将成败归因于能力、努力、任务难度和运气。小米总是以“太笨了，不会写”为借口不写作业，不做练习，体现出她将自己的失败归因于内部的、稳定的、不可控的能力，这会使她形成习得性无助，从而导致学习动机低下。"},{"t":"自我价值理论关注人们如何评价自身价值，自我价值是认为自己是优秀、有能力个体的一种信念","d":"如何评价自身价值，自我价值是认为自己是优秀、有能力个体的一种信念。小米属于“低趋低避型”，亦即“失败接受者”，她认为自己“写上去也是错的”，所以她不期待成功，并且对失败也不感到恐惧或羞愧。"}]},{"t":"（2）面对这种情况，请你给王老师提几条建议。","items":[{"t":"要帮助小米建立积极的自我概念","d":"自我概念。王老师要慎重地评价小米，尤其不能训斥，要引导她建立积极的自我概念，如此才能进一步激发她的学习动机。"},{"t":"要合理设置任务","d":"为了提升小米的自我价值的需要，同时促进她努力学习，王老师要合理设置任务，采取相应的措施帮助小米学习，比如为其设定中等难度，即成功概率为50%的任务。"},{"t":"要关心、爱护小米","d":"王老师大声呵斥会让小米感受到自己不被尊重，缺乏关爱，所以王老师既要在学习上关心和帮助小米，也要在生活与情感方面积极地关心她、爱护她，让她感受到教师的尊重和爱护。"}]}],"id":"柯虎4-36"}],"id":"柯虎4"},{"name":"柯虎5","questions":[{"num":31,"title":"31 《中国教育史》近代职业教育家黄炎…·中频","subject":"中教史","blocks":[{"t":"职业教育的方针","items":[{"t":"社会化。第一","d":"办学宗旨的社会化：以教育为方法，以职业为目的。第二，培养目标的社会化：培养在知识技能和道德方面适合社会生产和社会合作的各行业人才。第三，办学组织的社会化：学校的专业、程度、年限、课时、教学安排均根据社会需要和学员的志愿与实际条件。第四，办学方式的社会化：充分依靠教育界、职业界的各种力量，尤其是校长要联络、发挥社会各方面的力量。"},{"t":"科学化。物质方面","d":"包括农业、工业、商业、家事等专业课程的设置、教材的选编、教学训练原则的确定、实习设施的配置等，事前要经过调查和实验，事后要勤于总结，逐步推广。人事方面：包括教育管理的组织、机构自身的建设等，都要运用科学管理方法。"},{"t":"人事方面：包括教育管理的组织、机构自身的建设等，都要运用科学管理方法","d":"②科学化。物质方面：包括农业、工业、商业、家事等专业课程的设置、教材的选编、教学训练原则的确定、实习设施的配置等，事前要经过调查和实验，事后要勤于总结，逐步推广。人事方面：包括教育管理的组织、机构自身的建设等，都要运用科学管理方法。"}]},{"t":"职业教育作用","items":[{"t":"黄炎培将职业教育的理论价值概括为：第一，谋个性之发展；第二，为个人谋生之准备；","d":"论价值概括为：第一，谋个性之发展；第二，为个人谋生之准备；第三，为个人服务社会之准备；第四，为国家及世界增进生产力之准备。"},{"t":"第三，为个人服务社会之准备；第四，为国家及世界增进生产力之准备","d":"①黄炎培将职业教育的理论价值概括为：第一，谋个性之发展；第二，为个人谋生之准备；第三，为个人服务社会之准备；第四，为国家及世界增进生产力之准备。"},{"t":"对教育和社会的影响：“国无不教之民，民无不乐之生。”","d":"国无不教之民，民无不乐之生。”"},{"t":"对当时中国社会的作用：职业教育有助于解决中国最大、最急需解决的生计问题","d":"职业教育有助于解决中国最大、最急需解决的生计问题，消灭贫困，进而使国家每一个公民享受到最基本的自由权利。"}]},{"t":"职业教育的地位","items":[{"t":"一贯的。②整个的。③正统的。"}]},{"t":"职业教育的目的。","items":[{"t":"他将职业教育的目的概括为“使无业者有业，使有业者乐业”","d":"（四）职业教育的目的。他将职业教育的目的概括为“使无业者有业，使有业者乐业”。"},{"t":"“使无业者有业”","d":"是指通过职业教育为国家工商业发展造就适用人才，同时解决社会失业问题，使人才不至浪费，使生计得以保障。"},{"t":"“使有业者乐业”","d":"是指通过职业教育形成人的道德智能，使之能胜任所职、热爱所职，进而能有所创造发明，造福于社会和人类。"}]},{"t":"职业教育的教学原则。","items":[{"t":"职业教育必须遵循“手脑并用”“做学合一”的原则","d":"（五）职业教育的教学原则。职业教育必须遵循“手脑并用”“做学合一”的原则，做到“理论与实际并行”“知识与技能并重”。作为中国近现代职业教育的先行者，黄炎培及其职业教育思想开创和推进了中国的职业教育事业；其平民化、实用化、科学化和社会化特征，也丰富了中国的教育理论，并对20世纪二三十年代中国教育改革产生了巨大的影响。"},{"t":"作为中国近现代职业教育的先行者","d":"（五）职业教育的教学原则。职业教育必须遵循“手脑并用”“做学合一”的原则，做到“理论与实际并行”“知识与技能并重”。作为中国近现代职业教育的先行者，黄炎培及其职业教育思想开创和推进了中国的职业教育事业；其平民化、实用化、科学化和社会化特征，也丰富了中国的教育理论，并对20世纪二三十年代中国教育改革产生了巨大的影响。"}]}],"id":"柯虎5-31"},{"num":32,"title":"32 外教史·高频","subject":"外教史","blocks":[{"t":"杜威的“教育无目的”内涵","items":[{"t":"教育无目的论：杜威提出了“教育无目的论”","d":"32.【解析】本题考查《外国教育史》近代实用主义教育家杜威的教育无目的论及其对当代教育的启示，属于高频考点，难度适中。这里注意，题目询问杜威的教育无目的论，只需回答此思想内涵即可，不需要叙述杜威的其它实用主义教育思想。对当代教育的启示可以从注重个体发展、强调教育的社会属性、平衡个体与社会关系三个角度进行回答。【参考答案】。"},{"t":"注重内在目的：所谓“教育无目的论”，并不是说教育真的没有目的","d":"所谓“教育无目的论”，并不是说教育真的没有目的。杜威反对的是外在的、固定的、终极的教育目的。他认为，外在的教育目的不能顾及儿童的兴趣和需要，杜威所希求的是教育过程内的目的，这个目的就是“生长”。杜威主张以生长为教育的目的，其主要意图在于反对外在因素对儿童发展的压制，要求教育尊重儿童的愿望和要求，使儿童从教育本身、生长过程中得到乐趣。"},{"t":"教育目的所具有的社会性：杜威强调以儿童为中心，注重儿童的经验，强调教育过程内的目的","d":"性：杜威强调以儿童为中心，注重儿童的经验，强调教育过程内的目的。杜威注重尊重儿童，促进儿童内在的发展，将民主的精神传递给儿童，认为最终还是要建设一个民主主义的社会。所以杜威不是个人本位论者，也不是社会本位论者，而是力求在个体和社会之间寻求平衡。"}]},{"t":"对当代教育的启示","items":[{"t":"注重个体发展：杜威强调教育应以个体的内在需求和成长为出发点","d":"32.【解析】本题考查《外国教育史》近代实用主义教育家杜威的教育无目的论及其对当代教育的启示，属于高频考点，难度适中。这里注意，题目询问杜威的教育无目的论，只需回答此思想内涵即可，不需要叙述杜威的其它实用主义教育思想。对当代教育的启示可以从注重个体发展、强调教育的社会属性、平衡个体与社会关系三个角度进行回答。【参考答案】。"},{"t":"强调教育的社会性：杜威认为教育目的具有社会性","d":"杜威认为教育目的具有社会性，教育应当促进个体的内在发展，并为建设民主社会奠定基础。教育不仅仅是为了个体发展，更应当培养学生的社会责任感和民主意识，促进社会的和谐发展。"},{"t":"平衡个体与社会：杜威在个体与社会之间寻求平衡，既重视个体的成长，又注重社会的发展","d":"32.【解析】本题考查《外国教育史》近代实用主义教育家杜威的教育无目的论及其对当代教育的启示，属于高频考点，难度适中。这里注意，题目询问杜威的教育无目的论，只需回答此思想内涵即可，不需要叙述杜威的其它实用主义教育思想。对当代教育的启示可以从注重个体发展、强调教育的社会属性、平衡个体与社会关系三个角度进行回答。【参考答案】。"},{"t":"杜威的教育理念为我国教育体系提供了重要的启示","d":"③平衡个体与社会：杜威在个体与社会之间寻求平衡，既重视个体的成长，又注重社会的发展。这对我国教育体系提出了平衡个体发展和社会需求的要求，教育应当既关注学生个体发展，又培养学生为社会发展作出贡献的能力。杜威的教育理念为我国教育体系提供了重要的启示，促使我们更加关注学生个体发展、社会责任感的培养以及个体与社会之间的平衡，从而推动我国教育朝着更加全面、平衡和可持续的方向发展。"}]}],"id":"柯虎5-32"},{"num":33,"title":"33 教育热点问题课改与“双减”政策·高频","subject":"教原","blocks":[{"t":"（1）简述德育、智育、体育的相互联系。","items":[{"t":"德育与智育的关系。","d":"正如苏格拉底所指出，美德即知识，道德可教。行善必知善，道德不仅仅是培养学生的具体道德规则，还要培养学生的道德思维能力。根据教育性教学原则，德育应当存在于一切教学之中。智育同样离不开德育。一些美德，如不迷信、不盲从、崇尚真理等，对于学生的知识和智力的发展极为重要。"},{"t":"正如苏格拉底所指出，美德即知识，道德可教","d":"①德育与智育的关系。正如苏格拉底所指出，美德即知识，道德可教。行善必知善，道德不仅仅是培养学生的具体道德规则，还要培养学生的道德思维能力。根据教育性教学原则，德育应当存在于一切教学之中。智育同样离不开德育。一些美德，如不迷信、不盲从、崇尚真理等，对于学生的知识和智力的发展极为重要。"},{"t":"智育同样离不开德育","d":"①德育与智育的关系。正如苏格拉底所指出，美德即知识，道德可教。行善必知善，道德不仅仅是培养学生的具体道德规则，还要培养学生的道德思维能力。根据教育性教学原则，德育应当存在于一切教学之中。智育同样离不开德育。一些美德，如不迷信、不盲从、崇尚真理等，对于学生的知识和智力的发展极为重要。"},{"t":"智育和体育的关系。","d":"体育是智育的物质基础。学校教育所要培养的学生首先要求有强健的身体，只有身体强健、精力充沛的人才能高效地学习。智育对于体育也必不可少。教授一些程序性知识也是进行体育教学必不可少的环节。"},{"t":"德育与体育的关系。","d":"体育对于德育的影响，正如洛克所说“健康之精神寓于健康之身体”。只有拥有健康的身体，个体才能有精力运用知识和技能去服务社会、帮助他人。德育对于体育的影响也是显著的。在体育竞技中，团结协作、公平竞争等体育精神都离不开道德教育。"}]},{"t":"（2）结合教育功能相关的知识点，谈谈“双减”政策的必要性。","items":[{"t":"对个体的功能。","d":"正向功能：减轻学生校内作业和校外培训负担有助于保障学生的身心健康，提高学习效率，促进学生的全面发展。负向功能：过多的作业和培训可能导致学生焦虑、压力过大，甚至影响学生的心理健康和学习动力。因此，减轻这些负担是确保学生健康成长的必要举措。"},{"t":"正向功能：减轻学生校内作业和校外培训负担有助于保障学生的身心健康","d":"33.【解析】本题结合材料考查教育热点问题课改与“双减”政策。属于高频考点，难度较高。首先第一问，关于德育智育体育的相互联系，可以从全面教育的组成部分进行回答，分别解释其互相的关系。第二问，从教育功能解释“双减”政策的必要性，从教育功能上讲，教育分为个体功能与社会功能，教育也有正向功能与负向功能，教育还有显性功能与隐形功能。从这三个角度，解答“双减”政策的必要性，强调其能保障学生身心健康、促进全面发展、缓解家庭压力、提升教育公平等多个方面，有助于个体和社会的健康发展，推动教育体系朝着更加平衡、可持续的方向发展。第三问，从课改角度，还少年儿童“一个幸福美好。"},{"t":"负向功能：过多的作业和培训可能导致学生焦虑、压力过大","d":"33.【解析】本题结合材料考查教育热点问题课改与“双减”政策。属于高频考点，难度较高。首先第一问，关于德育智育体育的相互联系，可以从全面教育的组成部分进行回答，分别解释其互相的关系。第二问，从教育功能解释“双减”政策的必要性，从教育功能上讲，教育分为个体功能与社会功能，教育也有正向功能与负向功能，教育还有显性功能与隐形功能。从这三个角度，解答“双减”政策的必要性，强调其能保障学生身心健康、促进全面发展、缓解家庭压力、提升教育公平等多个方面，有助于个体和社会的健康发展，推动教育体系朝着更加平衡、可持续的方向发展。第三问，从课改角度，还少年儿童“一个幸福美好。"},{"t":"对社会的功能。","d":"正向功能：减轻学生负担有助于缓解家长的焦虑和压力，促进家庭和谐，减少家庭教育投入，有利于社会资源的合理利用。此外，减轻学生负担也有助于提升教育公平，减少学生间的竞争压力。负向功能：过多的作业和培训可能导致家长过度投入，加重家庭负担，甚至影响家庭和社会稳定。因此，减轻这些负担是维护社会稳定和促进社会发展的必要举措。"},{"t":"显性功能和隐性功能。","d":"显性功能：“双减”政策的显性功能是直接减轻学生作业和培训负担，提高学生的学习效率和生活质量。隐性功能：如对于建设更加公正、稳定的社会具有重要意义。综合来看，“双减”政策的必要性体现在保障学生身心健康、促进全面发展、缓解家庭压力、提升教育公平等多个方面，有助于个体和社会的健康发展，推动教育体系朝着更加平衡、可持续的方向发展。"}]},{"t":"（3）结合材料","items":[{"t":"课程结构：由分科为主向分科和综合课程结合转变","d":"33.【解析】本题结合材料考查教育热点问题课改与“双减”政策。属于高频考点，难度较高。首先第一问，关于德育智育体育的相互联系，可以从全面教育的组成部分进行回答，分别解释其互相的关系。第二问，从教育功能解释“双减”政策的必要性，从教育功能上讲，教育分为个体功能与社会功能，教育也有正向功能与负向功能，教育还有显性功能与隐形功能。从这三个角度，解答“双减”政策的必要性，强调其能保障学生身心健康、促进全面发展、缓解家庭压力、提升教育公平等多个方面，有助于个体和社会的健康发展，推动教育体系朝着更加平衡、可持续的方向发展。第三问，从课改角度，还少年儿童“一个幸福美好。"},{"t":"课程内容：由“难、繁、偏、旧”向注重兴趣和经验转变","d":"31.【解析】本题考查《中国教育史》近代职业教育家黄炎培的大职业教育思想，属于中频考点，难度较低。答题者可以从黄炎培的教育背景入题，其教育思想按照讲义与课程内容按点论述即可。【参考答案】黄炎培是中国近现代著名的爱国主义者和民主主义教育家，是我国近代职业教育的创始人和理论家。他将毕生精力奉献于中国的职业教育事业，为改革脱离社会生活和生产的传统教育，建设中国的职业教育，作出了重要的贡献。其大职业教育思想体现在“社会化、科学化”的职业教育方针上。"},{"t":"课程实施：由死记硬背、机械训练向自主、合作、探究学习转变","d":"33.【解析】本题结合材料考查教育热点问题课改与“双减”政策。属于高频考点，难度较高。首先第一问，关于德育智育体育的相互联系，可以从全面教育的组成部分进行回答，分别解释其互相的关系。第二问，从教育功能解释“双减”政策的必要性，从教育功能上讲，教育分为个体功能与社会功能，教育也有正向功能与负向功能，教育还有显性功能与隐形功能。从这三个角度，解答“双减”政策的必要性，强调其能保障学生身心健康、促进全面发展、缓解家庭压力、提升教育公平等多个方面，有助于个体和社会的健康发展，推动教育体系朝着更加平衡、可持续的方向发展。第三问，从课改角度，还少年儿童“一个幸福美好。"}]}],"id":"柯虎5-33"},{"num":34,"title":"34 教原·高频","subject":"教原","blocks":[{"t":"（1）根据上述材料概括过度炒作状元会带来至少哪4方面的不利…","items":[{"t":"首先，对“状元”自身有不利影响","d":"（1）过度炒作状元带来的不利影响。首先，对“状元”自身有不利影响：过于强调和渲染之前数年学业的成就，可能短时间能提升其成就感，但也在无形中“强化”了“成功者”的身份，不利于其关注学业本身的内部成就和动机，也不利于形成抗压能力。其次，对其他考生带来不利影响：传递状元“成功者”的身份，隐喻其他同学为“失败者”，在某种程度上是对其他学生自我价值的否定，不利于其树立积极的自我概念和自我意识。再次，对教育资源分配造成不利影响：会造成学校之间的攀比，出了状元的学校更能吸引优质的师资，造成教育资源的分配不均。最后，对社会风气的不利影响：在社会上形成利益链条，媒体的渲染。"},{"t":"其次，对其他考生带来不利影响","d":"（1）过度炒作状元带来的不利影响。首先，对“状元”自身有不利影响：过于强调和渲染之前数年学业的成就，可能短时间能提升其成就感，但也在无形中“强化”了“成功者”的身份，不利于其关注学业本身的内部成就和动机，也不利于形成抗压能力。其次，对其他考生带来不利影响：传递状元“成功者”的身份，隐喻其他同学为“失败者”，在某种程度上是对其他学生自我价值的否定，不利于其树立积极的自我概念和自我意识。再次，对教育资源分配造成不利影响：会造成学校之间的攀比，出了状元的学校更能吸引优质的师资，造成教育资源的分配不均。最后，对社会风气的不利影响：在社会上形成利益链条，媒体的渲染。"},{"t":"再次，对教育资源分配造成不利影响","d":"（1）过度炒作状元带来的不利影响。首先，对“状元”自身有不利影响：过于强调和渲染之前数年学业的成就，可能短时间能提升其成就感，但也在无形中“强化”了“成功者”的身份，不利于其关注学业本身的内部成就和动机，也不利于形成抗压能力。其次，对其他考生带来不利影响：传递状元“成功者”的身份，隐喻其他同学为“失败者”，在某种程度上是对其他学生自我价值的否定，不利于其树立积极的自我概念和自我意识。再次，对教育资源分配造成不利影响：会造成学校之间的攀比，出了状元的学校更能吸引优质的师资，造成教育资源的分配不均。最后，对社会风气的不利影响：在社会上形成利益链条，媒体的渲染。"},{"t":"最后，对社会风气的不利影响：在社会上形成利益链条，媒体的渲染和炒作引起教育焦虑","d":"（1）过度炒作状元带来的不利影响。首先，对“状元”自身有不利影响：过于强调和渲染之前数年学业的成就，可能短时间能提升其成就感，但也在无形中“强化”了“成功者”的身份，不利于其关注学业本身的内部成就和动机，也不利于形成抗压能力。其次，对其他考生带来不利影响：传递状元“成功者”的身份，隐喻其他同学为“失败者”，在某种程度上是对其他学生自我价值的否定，不利于其树立积极的自我概念和自我意识。再次，对教育资源分配造成不利影响：会造成学校之间的攀比，出了状元的学校更能吸引优质的师资，造成教育资源的分配不均。最后，对社会风气的不利影响：在社会上形成利益链条，媒体的渲染。"}]},{"t":"（2）2020年10月","items":[{"t":"人本理论认为学习应促进学生知情方面的统一，不能只关注和评价学生的成绩","d":"（2）①从学习理论的角度看评价改革的必要性。人本理论认为学习应促进学生知情方面的统一，不能只关注和评价学生的成绩。不过度渲染“高考状元”，提倡综合性的评价方式，避免使学生产生“失败者”的焦虑情绪，有利于促进立德树人，培养完人。观察学习理论强调榜样的重要性，但是榜样应和观察者之间有较多的相似性，在差距较大时，反而不利于学生自身的期待。在全社会形成尊重知识、尊重创造的良好风气，而不是渲染“高考状元”的成功，对社会风气有更好的影响。"},{"t":"观察学习理论强调榜样的重要性","d":"（2）①从学习理论的角度看评价改革的必要性。人本理论认为学习应促进学生知情方面的统一，不能只关注和评价学生的成绩。不过度渲染“高考状元”，提倡综合性的评价方式，避免使学生产生“失败者”的焦虑情绪，有利于促进立德树人，培养完人。观察学习理论强调榜样的重要性，但是榜样应和观察者之间有较多的相似性，在差距较大时，反而不利于学生自身的期待。在全社会形成尊重知识、尊重创造的良好风气，而不是渲染“高考状元”的成功，对社会风气有更好的影响。"},{"t":"从学习动机的角度看评价改革的必要性。","d":"价改革的必要性。不以学生中高考成绩为标准对学生进行奖励，从学习动机的角度来看，有利于激发学生的内部学习动机。归因理论认为教育应引导学生对成败进行正确的归因，过度渲染高考状元，可能会使“成功者”更倾向于将自己的“成功”归因于能力，而失败者也会将失败归因于自己的能力，觉得自己“天生不是学习的料”。不过度渲染“高考状元”，可以不过度把学习和自我概念、自尊联系在一起，有利于树立学生积极的自我概念，帮助学生形成良好的自我同一性。从学习习惯、学习态度等方面引导学生归因。目标定向理论认为，任务卷入的学习者比个体卷入的学习者有更高的认知水平。评价方式由结果导向的评价转变。"},{"t":"不以学生中高考成绩为标准对学生进行奖励","d":"34.【解析】本题结合材料，考查现实教育问题，属于高频考点，难度较高。第一问，总结社会过度曝光所带来的不利因素，可根据材料内容进行概括。第二问，从学习理论上讲，可以答：提倡综合性的评价方式，避免过度宣传，使其他学生产生失败者的情绪，还可以强调榜样的重要性，榜样应和观察者之间有较多的相似性，不应过度区别化。从学习动机理论上讲，不以学生中高考成绩为标准对学生进行奖励，有利于激发学生的内部学习动机。还可以从归因理论、目标定向理论进行分析。第三问，对应第一问与第二问的问题，举出针对性的措施。【参考答案】。"}]},{"t":"（3）假定你是一名班主任","items":[{"t":"首先，我会更关注和发掘学生的学习兴趣，引导学生把关注点放在学习过程中，而不是放在…","d":"（3）作为班主任，我会对学生进行以下引导：首先，我会更关注和发掘学生的学习兴趣，引导学生把关注点放在学习过程中，而不是放在学习结果上。其次，我会努力促进学生之间的合作，可以通过分组、对话的方式，帮助学生明白集体合作的重要性。最后，作为班主任，我会避免注重结果性评价，更多地关注过程性评价。"},{"t":"其次，我会努力促进学生之间的合作，可以通过分组","d":"（3）作为班主任，我会对学生进行以下引导：首先，我会更关注和发掘学生的学习兴趣，引导学生把关注点放在学习过程中，而不是放在学习结果上。其次，我会努力促进学生之间的合作，可以通过分组、对话的方式，帮助学生明白集体合作的重要性。最后，作为班主任，我会避免注重结果性评价，更多地关注过程性评价。"},{"t":"最后，作为班主任，我会避免注重结果性评价，更多地关注过程性评价","d":"（3）作为班主任，我会对学生进行以下引导：首先，我会更关注和发掘学生的学习兴趣，引导学生把关注点放在学习过程中，而不是放在学习结果上。其次，我会努力促进学生之间的合作，可以通过分组、对话的方式，帮助学生明白集体合作的重要性。最后，作为班主任，我会避免注重结果性评价，更多地关注过程性评价。"}]}],"id":"柯虎5-34"},{"num":35,"title":"35 教育实际问题","subject":"教原","blocks":[{"t":"（1）阅读上述案例","items":[{"t":"材料中反映出由于学校超负荷招生且学生学习水平差异大","d":"超负荷招生且学生学习水平差异大，导致教育资源分配不均，特别是对学习水平较低的学生，他们未能获得足够的关注和支持，违背了教育公平的原则。学校为了生存发展，让老师高负荷工作，也没有做到对老师的关心和爱护。"},{"t":"柯老师重点关注的问题只是如何在有限的时间内","d":"只是如何在有限的时间内，完成教学任务，她选择忽视学习水平较低的学生，对他们采取放任的态度，这是柯老师缺乏专业素养、违背专业标准的表现。"},{"t":"柯老师过分重视优等生的成绩和升学率","d":"的成绩和升学率，而忽视后进生的学习情况，这本身就是柯老师教育目的缺失，以及教学目标不清晰的表现。教育本质是促人向善的，育人根本在育德，学校与柯老师都忽略了这一点。"}]},{"t":"（2）假如你是柯老师，面对这种情况你会如何处理？","items":[{"t":"确保每个学生都能获得公平的教育机会","d":"公平的教育机会。我会重新评估座位安排，确保所有学生都能在课堂上得到适当的关注，而不是仅仅将学习水平较低的学生安排在教室后面。"},{"t":"采用小组学习和合作学习的组织形式","d":"习的组织形式。我会根据学生的不同能力和需求，设计差异化的教学计划和活动，确保每个学生都能在自己的水平上得到提升。并鼓励学生进行合作，通过小组讨论和项目展开，让不同水平的学生互相帮助，共同进步。此外，我还会定期反思教学方法的有效性，根据学生的学习反馈进行调整，以满足不同学生的需求。"},{"t":"情感上激励、尊重、关爱学生","d":"爱学生。尊重每个学生的个性和差异，通过个别辅导和鼓励，帮助他们建立自信，激发学习兴趣。通过表扬和奖励，正面激励学生的学习行为，即使是小的进步也应给予认可。此外，我还会与家长建立良好的沟通机制，共同关注学生的学习进展，为学生提供更多的支持和资源。"},{"t":"建立良好的师生关系","d":"即尊师爱生，相互配合；民主平等、和谐亲密；教学相长，心理相容的师生关系。"}]}],"id":"柯虎5-35"},{"num":36,"title":"36 教心·高频","subject":"教心","blocks":[{"t":"（1）结合维果茨基的最近发展区理论","items":[{"t":"前者由独立解决问题的能力而定","d":"（1）最近发展区是由维果茨基提出的，指现在的发展水平与潜在的发展水平之间的差距。前者由独立解决问题的能力而定，后者则是指在成人的指导下或是与更有能力的同伴合作时解决问题的能力。小A、小B和小C这三个学生处在不同的发展水平：小A的能力在百分数问题的最近发展区之上，她不需要额外的帮助就能完成任务。小B的能力恰好处在最近发展区之内，在教师的帮助下，他成功地完成了学习任务。小C的能力在最近发展区之下，所以教师不得不改变他的教学以便适应并找到小C的最近发展区。例如，小C一开始并不知道该问题可以通过首先得到一个分数，然后是一个小数，最后是一个百分数来解决。然而，小C。"},{"t":"小A、小B和小C这三个学生处在不同的发展水平：","d":"（1）最近发展区是由维果茨基提出的，指现在的发展水平与潜在的发展水平之间的差距。前者由独立解决问题的能力而定，后者则是指在成人的指导下或是与更有能力的同伴合作时解决问题的能力。小A、小B和小C这三个学生处在不同的发展水平：小A的能力在百分数问题的最近发展区之上，她不需要额外的帮助就能完成任务。小B的能力恰好处在最近发展区之内，在教师的帮助下，他成功地完成了学习任务。小C的能力在最近发展区之下，所以教师不得不改变他的教学以便适应并找到小C的最近发展区。例如，小C一开始并不知道该问题可以通过首先得到一个分数，然后是一个小数，最后是一个百分数来解决。然而，小C。"},{"t":"小A的能力在百分数问题的最近发展区之上，她不需要额外的帮助就能完成任务","d":"（1）最近发展区是由维果茨基提出的，指现在的发展水平与潜在的发展水平之间的差距。前者由独立解决问题的能力而定，后者则是指在成人的指导下或是与更有能力的同伴合作时解决问题的能力。小A、小B和小C这三个学生处在不同的发展水平：小A的能力在百分数问题的最近发展区之上，她不需要额外的帮助就能完成任务。小B的能力恰好处在最近发展区之内，在教师的帮助下，他成功地完成了学习任务。小C的能力在最近发展区之下，所以教师不得不改变他的教学以便适应并找到小C的最近发展区。例如，小C一开始并不知道该问题可以通过首先得到一个分数，然后是一个小数，最后是一个百分数来解决。然而，小C。"},{"t":"小B的能力恰好处在最近发展区之内，在教师的帮助下，他成功地完成了学习任务","d":"（1）最近发展区是由维果茨基提出的，指现在的发展水平与潜在的发展水平之间的差距。前者由独立解决问题的能力而定，后者则是指在成人的指导下或是与更有能力的同伴合作时解决问题的能力。小A、小B和小C这三个学生处在不同的发展水平：小A的能力在百分数问题的最近发展区之上，她不需要额外的帮助就能完成任务。小B的能力恰好处在最近发展区之内，在教师的帮助下，他成功地完成了学习任务。小C的能力在最近发展区之下，所以教师不得不改变他的教学以便适应并找到小C的最近发展区。例如，小C一开始并不知道该问题可以通过首先得到一个分数，然后是一个小数，最后是一个百分数来解决。然而，小C。"}]},{"t":"（2）结合认知发展理论，谈谈如何在实际教学中促进学生发展？","items":[{"t":"利用支架式教学：在学生的最近发展区内给学生提供适当的支持和指导","d":"在学生的最近发展区内给学生提供适当的支持和指导，而且要随着儿童认知发展的变化进行调整。"},{"t":"进行交互式教学：最近发展区内的相互作用实质是教师和学生共同协作的认知活动","d":"最近发展区内的相互作用实质是教师和学生共同协作的认知活动，因此在教学中，教师可以运用交互式教学，和学生轮流充当教师角色加强学生对知识的理解与运用。"},{"t":"开展合作学习：教师应当在课堂中引导学生有意识地模仿专家或同伴的行为来思考和完成具体任务","d":"教师应当在课堂中引导学生有意识地模仿专家或同伴的行为来思考和完成具体任务，使学生从旁观者逐渐转变为教学活动的参与者，在合作中获得知识和技能。"}]}],"id":"柯虎5-36"}],"id":"柯虎5"},{"name":"柯虎6","questions":[{"num":31,"title":"31 《中国教育史》古代儒家教育著作《…·高频","subject":"中教史","blocks":[{"t":"为学之序：《中庸》提出“博学之","items":[{"t":"《中庸》与《大学》互为阐发","d":"④为学之序：《中庸》提出“博学之，审问之，慎思之，明辨之，笃行之”的学习顺序，把学习过程具体概括为学、问、思、辨、行五个前后相继的步骤，高度概括了知识获得过程的基本环节与顺序。《中庸》与《大学》互为阐发，具有较强的理论色彩和思辨性，对后世知识分子、一般民众的个人修养、精神生活和为人处世均有影响。中庸的准则要求人们行事最大限度中正适度，恰到好处，但它体现的保守性和缺乏锐气也是明显的。"}]}],"id":"柯虎6-31"},{"num":32,"title":"32 《外国教育史》赫尔巴特的课程论·高频","subject":"外教史","blocks":[{"t":"经验、兴趣与课程","items":[{"t":"经验的兴趣。经验的兴趣具体包括经验的、思辨的、审美的兴趣。经验的兴趣对应的课程：","d":"趣具体包括经验的、思辨的、审美的兴趣。经验的兴趣对应的课程：自然、物理、化学、地理等；思辨的兴趣对应的课程：数学、逻辑、文法等；审美的兴趣对应的课程：文学、绘画等。"},{"t":"自然、物理、化学、地理等","d":"①经验的兴趣。经验的兴趣具体包括经验的、思辨的、审美的兴趣。经验的兴趣对应的课程：自然、物理、化学、地理等；思辨的兴趣对应的课程：数学、逻辑、文法等；审美的兴趣对应的课程：文学、绘画等。"},{"t":"同情的兴趣。同情的兴趣具体包括同情的、社会的、宗教的兴趣；同情的兴趣对应的课程：","d":"趣具体包括同情的、社会的、宗教的兴趣；同情的兴趣对应的课程：外国语、本国语等；社会的兴趣对应的课程：历史、政治、法律等；宗教的兴趣对应的课程：神学等。"},{"t":"外国语、本国语等","d":"②同情的兴趣。同情的兴趣具体包括同情的、社会的、宗教的兴趣；同情的兴趣对应的课程：外国语、本国语等；社会的兴趣对应的课程：历史、政治、法律等；宗教的兴趣对应的课程：神学等。"}]},{"t":"统觉与课程。","items":[{"t":"相关原则：学校不同课程的安排应当相互影响、相互联系。","d":"学校不同课程的安排应当相互影响、相互联系。"},{"t":"集中原则：在学校的所有课程中","d":"32.【解析】本题考查《外国教育史》赫尔巴特的课程论，属于高频考点，难度适中。对于赫尔巴特的课程论，只需要按照讲义与课程内容进行复述即可。对于教育的启示，着重强调在课程设置时要注意儿童兴趣、课程改革要以间接经验为主、课程安排要遵循相关与集中原则。【参考答案】赫尔巴特认为课程的设置要考虑以下几方面的因素：。"}]},{"t":"儿童发展与课程","items":[{"t":"婴儿期：0~3岁，相当于人类历史的早期，对身体的养护大于一切；","d":"当于人类历史的早期，对身体的养护大于一切；。"},{"t":"幼儿期：4~8岁，相当于人类历史的想象期，教学内容以《荷马史诗》为主；","d":"当于人类历史的想象期，教学内容以《荷马史诗》为主；。"},{"t":"童年期：主要学习任务是学习数学；"},{"t":"青年期：主要学习任务是学习历史。"}]},{"t":"赫尔巴特课程论的启示。","items":[{"t":"根据兴趣设置广泛的课程内容","d":"程内容。课程内容的选择必须与儿童的经验和兴趣相一致，只有与儿童经验相联系的内容，才能引起儿童的兴趣。"},{"t":"在进行课程改革的过程中，必须以间接经验的学习为主，以学生的直接经验为基础。","d":"中，必须以间接经验的学习为主，以学生的直接经验为基础。"},{"t":"学校在进行课程安排时必须遵循相关与集中原则","d":"必须遵循相关与集中原则。学校不同课程的安排应当相互影响、相互联系。在学校的所有课程中，选择一门科目作为学习的中心，其他科目作为学习和理解它的手段。"},{"t":"以儿童发展以及文化发展为课程设计的基础，有的放矢地进行教育，提高课程内容的时效性。","d":"展为课程设计的基础，有的放矢地进行教育，提高课程内容的时效性。三、材料分析题。"}]}],"id":"柯虎6-32"},{"num":33,"title":"33 教育对社会的作用·高频","subject":"教原","blocks":[{"t":"（1）从教育对社会的功能角度","items":[{"t":"在经济方面：教育是使可能的劳动力转变为现实的劳动力的基本途径","d":"教育是使可能的劳动力转变为现实的劳动力的基本途径。教育是使知识形态的生产力转化为直接生产力的一种重要途径。教育是提高劳动生产率的重要因素。"},{"t":"在政治方面：教育通过传播一定的社会政治意识形态，完成年轻一代的政治社会化","d":"教育通过传播一定的社会政治意识形态，完成年轻一代的政治社会化。教育通过培养政治管理人才，促进政治体制的变革与完善。教育通过提高全民文化素质，推动国家的民主政治建设。教育是形成社会舆论、影响政治时局的重要力量。"},{"t":"在文化方面：教育可以传递文化、选择文化、发展文化。","d":"教育可以传递文化、选择文化、发展文化。"},{"t":"在科技方面：教育可以为科学技术的发展提供知识积累","d":"教育可以为科学技术的发展提供知识积累，为科学技术的发展培养所需人才，为科学技术转化为生产力创造条件。教育通过发挥这些社会功能，可以促进科技创新，培养相应人才。科技创新是现代化的重要推动力量，能够提高生产效率、改善生活质量，推动经济社会发展。科技的进步对于国家的现代化进程至关重要。人才是国家的宝贵资源，是推动现代化发展的重要力量。培养和吸引高素质人才，提高人才的创新能力和竞争力，对于国家的现代化建设至关重要。"}]},{"t":"（2）从学校教育变革的角度","items":[{"t":"教育内容方面科技教育：加强科技教育","d":"加强科技教育，将科技创新理念和方法融入教育内容中，培养学生的科学素养和创新意识。实践能力培养：注重培养学生的实践能力，通过实践性教学和项目实践，提升学生的创新能力和解决问题的能力。"},{"t":"实践能力培养：注重培养学生的实践能力","d":"②教育内容方面科技教育：加强科技教育，将科技创新理念和方法融入教育内容中，培养学生的科学素养和创新意识。实践能力培养：注重培养学生的实践能力，通过实践性教学和项目实践，提升学生的创新能力和解决问题的能力。"},{"t":"教育方法方面项目化学习：推行项目化学习","d":"习：推行项目化学习，让学生参与实际项目，培养他们的团队合作能力和解决问题的能力。跨学科教育：推动跨学科教育，打破学科壁垒，促进不同学科之间的交叉融合，培养学生的综合素质和创新思维。"},{"t":"跨学科教育：推动跨学科教育","d":"③教育方法方面项目化学习：推行项目化学习，让学生参与实际项目，培养他们的团队合作能力和解决问题的能力。跨学科教育：推动跨学科教育，打破学科壁垒，促进不同学科之间的交叉融合，培养学生的综合素质和创新思维。"},{"t":"教育评价方面综合评价体系：建立综合评价体系","d":"体系：建立综合评价体系，不仅注重学生的学习成绩，还要评价学生的创新能力、实践能力和团队合作能力。激励创新：通过奖励制度和激励机制，鼓励学生参与科技创新活动，促进学生创新意识和实践能力的提升。"}]}],"id":"柯虎6-33"},{"num":34,"title":"34 教原·高频","subject":"教原","blocks":[{"t":"（1）根据上述材料的描述","items":[{"t":"微观系统指的是个体活动和交往的直接环境","d":"动和交往的直接环境。一开始，学生作为独立个体，其发展的微观系统主要为家庭，后随着学生的发展，活动范围不断扩展，学校、社会被不断纳入个体的微观系统。"},{"t":"中间系统指的是各微观系统之间的联系","d":"系统之间的联系。对学生而言，家庭、学校都是他所处的微观系统，微观系统之间会相互作用，这也代表着学生的家庭和学校需要共同努力作用于学生的发展。"},{"t":"外层系统指的是学生并未直接参与却对学生的发展起到影响的系统","d":"未直接参与却对学生的发展起到影响的系统。在学校中，学生有大量的同伴群体，他们每个人都受到各自家庭的影响，又在不断地影响他人。这代表着家庭教育的影响不仅仅局限于个体的家庭。"},{"t":"宏观系统指的是整个社会环境，包括主流价值观、文化、亚文化等","d":"会环境，包括主流价值观、文化、亚文化等。这代表整个社会都应明确育人的职责。综上，学校是教书育人的主阵地，要认真履行教育教学职责，全面掌握并向家长及时沟通学生在校期间的情况。家长要强化家庭是第一个课堂、家长是第一任老师的责任意识，注重家庭建设，坚持以身作则、言传身教，为子女健康成长创造良好家庭环境。社会应有效支持、服务全面育人。教育的责任不能只留给学校。"}]}],"id":"柯虎6-34"},{"num":35,"title":"35 教原·高频","subject":"教原","blocks":[{"t":"（1）上述案例中体现了什么德育原则和方法？","items":[{"t":"集体教育和个别教育相结合的原则：上述案例中王老师在一次照相活动中发现米琦的孤单","d":"35.【解析】本题结合材料例子，考查《教育学原理》德育教育。属于高频考点，难度较低。第一问材料体现了集体教育和个别教育相结合的原则、发挥积极因素和克服消极因素相结合的原则、榜样示范法和实践锻炼法，注意回答时要结合材料分析德育原则。第二问答案不唯一，王老师的做法产生的效果只要是积极向上的，有助于米琦的，言之有理即可。【参考答案】。"},{"t":"发挥积极因素和克服消极因素相结合的原则：该原则指在德育过程中","d":"35.【解析】本题结合材料例子，考查《教育学原理》德育教育。属于高频考点，难度较低。第一问材料体现了集体教育和个别教育相结合的原则、发挥积极因素和克服消极因素相结合的原则、榜样示范法和实践锻炼法，注意回答时要结合材料分析德育原则。第二问答案不唯一，王老师的做法产生的效果只要是积极向上的，有助于米琦的，言之有理即可。【参考答案】。"},{"t":"榜样示范法：所有同学都在拍照，只有米琦同学看到并捡起了被弄掉的文具盒","d":"35.【解析】本题结合材料例子，考查《教育学原理》德育教育。属于高频考点，难度较低。第一问材料体现了集体教育和个别教育相结合的原则、发挥积极因素和克服消极因素相结合的原则、榜样示范法和实践锻炼法，注意回答时要结合材料分析德育原则。第二问答案不唯一，王老师的做法产生的效果只要是积极向上的，有助于米琦的，言之有理即可。【参考答案】。"},{"t":"实践锻炼法：王老师发现米琦同学身上的闪光点","d":"35.【解析】本题结合材料例子，考查《教育学原理》德育教育。属于高频考点，难度较低。第一问材料体现了集体教育和个别教育相结合的原则、发挥积极因素和克服消极因素相结合的原则、榜样示范法和实践锻炼法，注意回答时要结合材料分析德育原则。第二问答案不唯一，王老师的做法产生的效果只要是积极向上的，有助于米琦的，言之有理即可。【参考答案】。"}]},{"t":"（2）请你评析一下王老师的做法有什么效果？","items":[{"t":"对米琦来说","d":"他有了更多与同学们相处的机会，也多了很多朋友，能够更好地融入班集体，他不再孤单，变得更加乐观、开朗、自信。"},{"t":"对于班级里的其他同学来说","d":"来说，大家有了榜样，日后都会变得像米琦一样主动做好事，主动为班级做一些力所能及的事，也会变得更加有责任和担当。"},{"t":"对王老师来说","d":"一次偶然的照相活动，让她关注到了米琦同学，而后又开展了一系列主题班会活动，达到了王老师对米琦、对其他同学的教育目的，有利于整个班集体形成良好的氛围。"}]}],"id":"柯虎6-35"},{"num":36,"title":"36 教原·高频","subject":"教原","blocks":[{"t":"（1）依据艾里克森的发展理论","items":[{"t":"案例中反映了青少年的自我同一性（或自我认同）发展问题","d":"（1）艾里克森提出，人的一生发展主要经历的阶段有：信任对怀疑（0~1.5岁）、自主对羞怯（1.5~3岁）、主动对内疚（3~6岁）、勤奋感对自卑感（6~12岁）、角色同一性对角色混乱（12~18岁）、亲密对孤独（18~30岁）、繁殖对停滞（30~60岁）、完美无憾对悲观绝望（60岁以后）。案例中反映了青少年的自我同一性（或自我认同）发展问题。艾里克森认为青少年阶段的发展冲突是角色同一性对角色混乱，发展任务是建立同一性。青少年在复杂的社会条件下经历同一性危机，这是青少年在确立自己的价值观和目标之前进行尝试的一段痛苦的时期。"}]},{"t":"（2）结合案例","items":[{"t":"个体方面的因素包括个体的认知水平、人格特点等","d":"（2）青少年在这一发展阶段的发展问题容易受到家庭、社会环境、个人特点等多方面因素的影响。个体方面的因素包括个体的认知水平、人格特点等，而环境方面的因素则包括同伴互动、亲子关系（教养方式）、学校和社区提供的探索机会，以及社会文化等因素。这些因素共同影响着青少年的自我认同发展，塑造着他们对未来道路的思考和选择。在案例中，乙受父母设计的大学专业和职业规划影响，缺乏自主选择意识；丙通过自我探索和咨询表哥选择专业，展现了积极的自我认同探索；而丁则表现出对未来迷茫和不愿意思考的态度，可能受到环境中缺乏引导和支持的影响。"},{"t":"在案例中，乙受父母设计的大学专业和职业规划影响，缺乏自主选择意识","d":"（2）青少年在这一发展阶段的发展问题容易受到家庭、社会环境、个人特点等多方面因素的影响。个体方面的因素包括个体的认知水平、人格特点等，而环境方面的因素则包括同伴互动、亲子关系（教养方式）、学校和社区提供的探索机会，以及社会文化等因素。这些因素共同影响着青少年的自我认同发展，塑造着他们对未来道路的思考和选择。在案例中，乙受父母设计的大学专业和职业规划影响，缺乏自主选择意识；丙通过自我探索和咨询表哥选择专业，展现了积极的自我认同探索；而丁则表现出对未来迷茫和不愿意思考的态度，可能受到环境中缺乏引导和支持的影响。"}]}],"id":"柯虎6-36"}],"id":"柯虎6"},{"name":"柯虎7","questions":[{"num":31,"title":"31 《中国教育史》近代癸卯学制·高频","subject":"中教史","blocks":[{"t":"新的部分","items":[{"t":"学制的系统：仿照三级学制系统模式分为初等、中等、高等三级。","d":"仿照三级学制系统模式分为初等、中等、高等三级。"},{"t":"学制的目的：规划了义务教育的目标，确立了德、智、体三方面协调发展的“三育”模式。","d":"规划了义务教育的目标，确立了德、智、体三方面协调发展的“三育”模式。"},{"t":"学制内容：设置了众多实业学堂，以适应和推动近代资本主义工商业的发展，重视师范教育。","d":"设置了众多实业学堂，以适应和推动近代资本主义工商业的发展，重视师范教育。"},{"t":"学制的组织管理：将分年课程规划、班级授课制作为基本的教学管理和教学组织形式。","d":"将分年课程规划、班级授课制作为基本的教学管理和教学组织形式。"},{"t":"对待儿童：要求尊重儿童个性，禁止体罚。","d":"要求尊重儿童个性，禁止体罚。"}]},{"t":"旧的部分","items":[{"t":"学制的指导思想：仍然是洋务教育“中学为体","d":"仍然是洋务教育“中学为体，西学为用”的延续，首要任务是培养学生效忠封建王朝。"},{"t":"学制的课程内容：“读经讲经”课比重大。"},{"t":"学制的等级性：进入学堂需要有保人，客观上限制了普通民众进入高等教育","d":"进入学堂需要有保人，客观上限制了普通民众进入高等教育；广大妇女被排斥在学校教育之外。"},{"t":"学制的管理：规定了许多旨在维护封建统治秩序的禁令","d":"规定了许多旨在维护封建统治秩序的禁令，并根据学生的表现和学业程度奖励相应的功名。癸卯学制包含了资本主义因素和封建性因素，是传统性和近代性的综合产物，具有新旧杂糅的特点。"}]}],"id":"柯虎7-31"},{"num":32,"title":"32 《外国教育学》新教主义思潮·低频","subject":"教原","blocks":[{"t":"新传统主义教育思潮的主要观点","items":[{"t":"要素主义教育思潮主张把人类文化的“共同要素”传给下一代","d":"（1）新传统主义教育思潮的主要观点。新传统主义教育思潮的代表人物有巴格莱、里科弗、科南特、赫钦斯、马里坦。代表学派有要素主义教育、永恒主义教育、新托马斯主义教育。要素主义教育思潮主张把人类文化的“共同要素”传给下一代、教学过程必须是一个训练智慧的过程、强调教师在教育和教学中的核心地位、强调学生在学习上必须努力和专心、重视学业考核和天才教育。必须划定标准，对学生予以考核。永恒主义教育主张教育的性质永恒不变，教育的目的是要引出人类天性中共同的要素——理性，永恒的古典学科应在学校课程中占有中心地位，学生通过教师的教学进行学习。新托马斯主义教育是以托马斯主义为理。"},{"t":"永恒主义教育主张教育的性质永恒不变","d":"（1）新传统主义教育思潮的主要观点。新传统主义教育思潮的代表人物有巴格莱、里科弗、科南特、赫钦斯、马里坦。代表学派有要素主义教育、永恒主义教育、新托马斯主义教育。要素主义教育思潮主张把人类文化的“共同要素”传给下一代、教学过程必须是一个训练智慧的过程、强调教师在教育和教学中的核心地位、强调学生在学习上必须努力和专心、重视学业考核和天才教育。必须划定标准，对学生予以考核。永恒主义教育主张教育的性质永恒不变，教育的目的是要引出人类天性中共同的要素——理性，永恒的古典学科应在学校课程中占有中心地位，学生通过教师的教学进行学习。新托马斯主义教育是以托马斯主义为理。"},{"t":"新托马斯主义教育是以托马斯主义为理论基础，大力主张宗教教育的一种教育理论","d":"（1）新传统主义教育思潮的主要观点。新传统主义教育思潮的代表人物有巴格莱、里科弗、科南特、赫钦斯、马里坦。代表学派有要素主义教育、永恒主义教育、新托马斯主义教育。要素主义教育思潮主张把人类文化的“共同要素”传给下一代、教学过程必须是一个训练智慧的过程、强调教师在教育和教学中的核心地位、强调学生在学习上必须努力和专心、重视学业考核和天才教育。必须划定标准，对学生予以考核。永恒主义教育主张教育的性质永恒不变，教育的目的是要引出人类天性中共同的要素——理性，永恒的古典学科应在学校课程中占有中心地位，学生通过教师的教学进行学习。新托马斯主义教育是以托马斯主义为理。"},{"t":"新传统主义教育思潮重视学科知识的系统性和内在联系","d":"（1）新传统主义教育思潮的主要观点。新传统主义教育思潮的代表人物有巴格莱、里科弗、科南特、赫钦斯、马里坦。代表学派有要素主义教育、永恒主义教育、新托马斯主义教育。要素主义教育思潮主张把人类文化的“共同要素”传给下一代、教学过程必须是一个训练智慧的过程、强调教师在教育和教学中的核心地位、强调学生在学习上必须努力和专心、重视学业考核和天才教育。必须划定标准，对学生予以考核。永恒主义教育主张教育的性质永恒不变，教育的目的是要引出人类天性中共同的要素——理性，永恒的古典学科应在学校课程中占有中心地位，学生通过教师的教学进行学习。新托马斯主义教育是以托马斯主义为理。"}]},{"t":"新传统主义教育思潮对教育的影响主要体现在以下几个方面：","items":[{"t":"把教育放在了更广泛的社会背景下进行研究","d":"社会背景下进行研究，这对于强化教育与社会之间的联系，推进教育社会化具有重要意义。"},{"t":"建立了教师的权威性","d":"新传统主义教育思潮加强了教师在教育活动中的地位，使教师成为占主导地位的教育者，从而增强了教育的效果。"},{"t":"重视传统文化的传承","d":"新传统主义教育思潮的出现和传播对于弘扬传统文化、恢复传统文化对教育价值的探讨都起到了积极的促进作用。总的来说，新传统主义教育思潮通过回归传统，使得教育更加贴近现实生活和社会问题，对于适应当时的教育需求起到了积极的作用。"}]}],"id":"柯虎7-32"},{"num":33,"title":"33 教学评价的相关知识·高频","subject":"教原","blocks":[{"t":"（1）阐述教学评价在教学中的作用。","items":[{"t":"诊断教学问题：通过评价教学目标的达成程度","d":"通过评价教学目标的达成程度，教师可以得知教学目标的设置是否合理，教学方法与手段的运用是否得当，教学的重难点是否解决，也可以了解学生在知识技能、过程方法和情感态度价值观等方面的现有水平与存在的问题。"},{"t":"提供反馈信息：教学评价的结果可以为教师判定教学现状并及时作出调整提供大量的反馈信息","d":"教学评价的结果可以为教师判定教学现状并及时作出调整提供大量的反馈信息，也可以为学生了解自己学习效果的优劣提供直接的反馈信息。"},{"t":"调控教学方向：如果教学评价的标准和内容能够全面地反映人才培养的需要","d":"如果教学评价的标准和内容能够全面地反映人才培养的需要，充分体现全面发展的发展方向，那么，教学评价便能够发挥积极的导向作用，有利于学生的学习。反之，则有可能使得教学活动偏离正确的方向。"},{"t":"检验教学效果：在教学活动中","d":"在教学活动中，教师的教学水平和教学效果如何，学生是否掌握了必备的基础知识和基本技能，预定的教学目标是否实现，这些都必须通过教学评价加以检查和验证。"}]},{"t":"（2）结合材料","items":[{"t":"宏观层面：我国的教育目的在于培养德、智、体、美、劳全面发展的社会主义建设者和接班人","d":"我国的教育目的在于培养德、智、体、美、劳全面发展的社会主义建设者和接班人。不当的教学评价会使我国教育偏离立德树人的根本目标。基础教育中会存在“五育缺失”疏德、偏智、弱体、抑美、缺劳）的问题，“唯分数、唯升学”的指挥棒使得素质教育的推进陷入困境。“唯分数”的量化评价方式不变，造成了校内减负校外增负的结果，导致“影子教育”的盛行，不利于培养当代社会所需的人才。"},{"t":"微观层面：","d":"（2）不当的教学评价会使得教学活动的实施与开展偏离正确的方向，影响人才培养的质量与效果，在宏观与微观层面上的负面影响具体表现为：。"},{"t":"加剧人与人之间的竞争","d":"减少合作机会：过于标准化与高利害的评价方式会使得班级同学将彼此视作“假想敌”，加剧班级中的紧张竞争氛围，不利于小组讨论等合作学习形式的开展；千人一面，不利于学生独立个性的培养与身心的全面发展。限制教师的教学选择：僵化的教学评价会使得教师不得不为适应现有评价方式而选择知识性教学内容，这在一定程度上限制了教师的教学选择。事实上，教师的教学自主性和自由应该获得支持，只有保障专业自主权，才能激励有能力的教育工作者继续从事这一职业，并吸纳有能力和积极性的个人进入这一行业。"},{"t":"千人一面，不利于学生独立个性的培养与身心的全面发展","d":"②微观层面：加剧人与人之间的竞争，减少合作机会：过于标准化与高利害的评价方式会使得班级同学将彼此视作“假想敌”，加剧班级中的紧张竞争氛围，不利于小组讨论等合作学习形式的开展；千人一面，不利于学生独立个性的培养与身心的全面发展。限制教师的教学选择：僵化的教学评价会使得教师不得不为适应现有评价方式而选择知识性教学内容，这在一定程度上限制了教师的教学选择。事实上，教师的教学自主性和自由应该获得支持，只有保障专业自主权，才能激励有能力的教育工作者继续从事这一职业，并吸纳有能力和积极性的个人进入这一行业。"}]},{"t":"（3）为使教学评价正确发挥效用，现代教育应该怎么做？","items":[{"t":"由过去主要评价教师的“教”向重点评价学生的“学”转变。","d":"教”向重点评价学生的“学”转变。"},{"t":"由过去注重“双基”和“学科能力”目标落实的评价","d":"学科能力”目标落实的评价，向既注重“双基”和“学科能力”的形成，也注重学生在学习过程中情感、态度的发展的评价转变。"},{"t":"由注重教师对教材的使用和教学方法的选择的评价","d":"用和教学方法的选择的评价，向注重学生学习方法的指导和教学媒体的有效利用的评价转变。"},{"t":"注重发挥教学评价的发展性功能","d":"展性功能，即淡化评比和奖惩，突出其发展性价值，发挥其提高课堂教学质量和促进任课教师专业成长的功能。"},{"t":"构建新的课堂教学评价标准","d":"标准。体现在：关注学生的全面发展；注重教师角色的转变，发展新型的师生关系；倡导自主、探究、合作的学习方式；关注个体差异，满足不同学生的需要等。"}]}],"id":"柯虎7-33"},{"num":34,"title":"34 教原·高频","subject":"教原","blocks":[{"t":"（1）阅读材料，概括心理健康问题带来的危害。","items":[{"t":"信任对怀疑（0~1.5岁）：如果婴儿得到了较好的抚养并与父母建立了良好的亲子关系","d":"（2）①艾里克森把人格发展划分为相应的阶段，可能出现的心理问题如下：信任对怀疑（0~1.5岁）：如果婴儿得到了较好的抚养并与父母建立了良好的亲子关系，婴儿将对周围世界产生信任感，否则将产生怀疑和不安的心理问题。自主对羞怯（1.5~3岁）：这一阶段的儿童开始表现出自我控制的需要与倾向，渴望自主，如果无法顺利过渡的话，可能出现容易羞怯的心理问题。主动对内疚（3~6岁）：这一阶段儿童的活动范围逐渐超出家庭的圈子，他们想象自己正在扮演成年人的角色，并因能从事成年人的活动和胜任这些活动而体验一种愉快的情绪。如果无法顺利过渡的话，可能出现容易内疚的心理问题。勤奋感对。"},{"t":"自主对羞怯（1.5~3岁）：这一阶段的儿童开始表现出自我控制的需要与倾向","d":"（2）①艾里克森把人格发展划分为相应的阶段，可能出现的心理问题如下：信任对怀疑（0~1.5岁）：如果婴儿得到了较好的抚养并与父母建立了良好的亲子关系，婴儿将对周围世界产生信任感，否则将产生怀疑和不安的心理问题。自主对羞怯（1.5~3岁）：这一阶段的儿童开始表现出自我控制的需要与倾向，渴望自主，如果无法顺利过渡的话，可能出现容易羞怯的心理问题。主动对内疚（3~6岁）：这一阶段儿童的活动范围逐渐超出家庭的圈子，他们想象自己正在扮演成年人的角色，并因能从事成年人的活动和胜任这些活动而体验一种愉快的情绪。如果无法顺利过渡的话，可能出现容易内疚的心理问题。勤奋感对。"},{"t":"主动对内疚（3~6岁）：这一阶段儿童的活动范围逐渐超出家庭的圈子","d":"（2）①艾里克森把人格发展划分为相应的阶段，可能出现的心理问题如下：信任对怀疑（0~1.5岁）：如果婴儿得到了较好的抚养并与父母建立了良好的亲子关系，婴儿将对周围世界产生信任感，否则将产生怀疑和不安的心理问题。自主对羞怯（1.5~3岁）：这一阶段的儿童开始表现出自我控制的需要与倾向，渴望自主，如果无法顺利过渡的话，可能出现容易羞怯的心理问题。主动对内疚（3~6岁）：这一阶段儿童的活动范围逐渐超出家庭的圈子，他们想象自己正在扮演成年人的角色，并因能从事成年人的活动和胜任这些活动而体验一种愉快的情绪。如果无法顺利过渡的话，可能出现容易内疚的心理问题。勤奋感对。"},{"t":"如果无法顺利过渡的话，可能出现容易内疚的心理问题","d":"（2）①艾里克森把人格发展划分为相应的阶段，可能出现的心理问题如下：信任对怀疑（0~1.5岁）：如果婴儿得到了较好的抚养并与父母建立了良好的亲子关系，婴儿将对周围世界产生信任感，否则将产生怀疑和不安的心理问题。自主对羞怯（1.5~3岁）：这一阶段的儿童开始表现出自我控制的需要与倾向，渴望自主，如果无法顺利过渡的话，可能出现容易羞怯的心理问题。主动对内疚（3~6岁）：这一阶段儿童的活动范围逐渐超出家庭的圈子，他们想象自己正在扮演成年人的角色，并因能从事成年人的活动和胜任这些活动而体验一种愉快的情绪。如果无法顺利过渡的话，可能出现容易内疚的心理问题。勤奋感对。"},{"t":"在信任对怀疑、自主对羞怯、主动对内疚的阶段，儿童的成长环境主要是家庭","d":"羞怯、主动对内疚的阶段，儿童的成长环境主要是家庭。这一时期，家长应明确家庭教育的职责，关注孩子心理健康，树立科学养育观念，尊重孩子心理发展规律，理性确定孩子成长预期，积极开展亲子活动，保障孩子充足睡眠。在勤奋感对自卑感、角色同一性对角色混乱的阶段，个体的成长环境主要是学校和家庭，也在逐步接触社会。教育应该培养个体应对危机并且提高发展的能力，尊重不同年龄阶段儿童的心理特征，提倡学生的自主性。小学阶段充分地给予儿童尊重。初高中阶段侧重于维护学生的自尊，家校、社会应共同关注个体的心理健康，建立协同育人的新育人格局。"}]}],"id":"柯虎7-34"},{"num":35,"title":"35 德育问题·高频","subject":"教原","blocks":[{"t":"（1）上述案例反映了德育中的什么问题？","items":[{"t":"虽然学生在课堂上能够正确回答老师的问题","d":"（1）品德由道德认知、道德情感、道德意志、道德行为组成。上述案例反映了德育中的“知行不一”问题。虽然学生在课堂上能够正确回答老师的问题，并且在讨论中能够找出符合道德规范的答案，但在实际生活中，他们并没有将这些道德知识付诸实践。例如，学生在回答分享梨的问题时表现出慷慨精神，但在实际生活中却为争抢皮球而吵架；学生在讨论教室用电问题时能够发现错误，但在实际生活中却没有意识到教室里不需要开灯。这反映出学生在道德教育中存在认知和行为脱节的问题。"}]},{"t":"（2）结合德育方法，谈谈如何尽量避免上述问题的出现？","items":[{"t":"在实际德育过程中还应运用实践锻炼","d":"（2）材料中教师主要运用了说服教育法对学生进行道德教育，主要培养了学生的道德认知。在实际德育过程中还应运用实践锻炼、情感陶冶、品德评价等方法帮助学生将道德认知转化为道德行为。"},{"t":"实践锻炼法是有目的、有计划地组织学生参加各种实践活动","d":"有计划地组织学生参加各种实践活动，以培养他们形成良好品德、良好行为习惯的德育方法。教师可以向学生布置具体的任务，在过程中适当指导，调动学生的主动性和积极性，帮助学生形成良好的行为习惯。"},{"t":"情感陶冶法是通过创设良好的环境","d":"良好的环境，对学生进行积极感化和熏陶，潜移默化地培养学生品德的德育方法。教师可以创设良好的情景，引导学生积极参与情境创设，帮助学生树立正确的道德情感。"},{"t":"品德评价法是根据德育目标的要求","d":"目标的要求，对学生的品德水平给予肯定或否定的评价，以促进学生发扬优点、克服缺点，逐步培养其良好品德的德育方法。教师可以根据学生的日常行为表现设置奖赏制度，激励学生将道德认知转化为实际的道德行为。"},{"t":"榜样示范法是以他人的高尚思想","d":"高尚思想、模范行为和卓越成就来影响和引导学生以培养其良好品德的德育方法。教师可通过设置“进步之星”“模范之星”的方式，为学生树立榜样，引导学生用榜样提高自身修养。"}]}],"id":"柯虎7-35"},{"num":36,"title":"36 《教育心理学》的道德行为发展理论·中频","subject":"教心","blocks":[{"t":"班杜拉提出观察学习的理论","items":[{"t":"材料可见，平平通过母亲的教导，得知了抢夺别人的东西是不对的","d":"（1）班杜拉提出观察学习的理论，指通过观察他人所表现的行为及其结果而进行的学习，观察学习包括注意过程、保持过程、动作再现和动机过程。材料可见，平平通过母亲的教导，得知了抢夺别人的东西是不对的。然后在下一次见到丽丽吃石榴时，他也就没有做出任何行为。但是通过观察丽丽的母亲呈现出的亲社会行为（分享），从而产生了这一经验，而这一经验又反过来影响了他之后的行为，所以产生了后面将自己存的零花钱买了玩具，捐给福利院的小朋友这一事件。这说明他已经习得了“分享”这一概念。"}]}],"id":"柯虎7-36"}],"id":"柯虎7"},{"id":"紫薯1","name":"紫薯1","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 新文化运动的教育变革","subject":"中教史","blocks":[{"t":"教育观念的变革","items":[{"t":"个性化：强调个人价值，主张人人都有受教育机会","d":"强调个人价值，主张人人都有接受教育的机会；要求在教育中尊重个人，“以儿童为中心”；发挥每个人的长处，替社会做最有效率的事业；学校教育忌“随便教育”，教师要因材施教，学生要主动学习。"},{"t":"平民化：坚持庶民方向，打破贵贱上下与劳心劳力的阶级教育","d":"教育必须坚持“庶民”方向，打破以往社会有贵贱上下、劳心与劳力、治人与被治种种差别的阶级教育；既然以平民为教育对象，这种教育就不应限于学校范围，无论是形式还是内容都要考虑其生产、生活和环境改造的需要。"},{"t":"实用化：注重生活能力培养，解决生计问题，学校与社会相联系","d":"一方面，教育要注重对个人生活能力的培养，解决生计问题，促进社会生产的发展；另一方面，学校内部必须进行全面改革，强调教育与生活、学校与社会相联系。"},{"t":"科学化：崇尚科学知识、科学方法与科学精神，三者相辅相成","d":"提倡学习科学的知识，追求科学的方法和坚持科学的精神。科学方法的运用重于科学知识的获得，而科学方法的运用又是为了科学精神的养成，三者是相辅相成的。"}]},{"t":"教育实践的变革","items":[{"t":"废除读经，恢复民国初年教育宗旨：1919年恢复国民教育宗旨","d":"恢复民国初年的教育宗旨。1916年，袁世凯倒台，其所颁布的教育纲要和教育要旨被撤销；1919年，教育部恢复了“养成健全人格，发展共和精神”的国民教育宗旨。"},{"t":"教育普及有所发展：提倡义务教育，办学规模与学生数量迅速增加","d":"在民主思想的推动下，平民教育呼声强烈，义务教育得到提倡，办学规模迅速扩大，学生数量迅速增加。中等教育在此时期也有所发展。"},{"t":"改革学校教学内容：推行白话文和国语，中等教育注意实用","d":"在学校教育中大力推行白话文和国语；中等教育开始注意“实用”，教学内容更加贴近社会实际需求。"},{"t":"改革师范教育和大学：筹划六大师范区，蔡元培改革北大","d":"1912年，教育部调整全国师范教育布局，筹划了六大师范区，于每区中心城市设一所高等师范学校。蔡元培对北大的改革是民国高等教育的一场革命，这场改革突破封建教育的束缚，高扬民主与科学精神，成为大学改革的先导和示范。先是北京专门以上学校纷纷仿效这一改革，其后全国各大学也逐渐参照北大制度推行改革。【答案要点】中世纪大学是12世纪前后在西欧城市兴起的新型教育机构，以意大利的萨莱诺大学和波隆那大学、法国的巴黎大学、英国的牛津大学和剑桥大学等为代表，是近代大学的直接源头。"}]}],"id":"紫薯1-31"},{"num":32,"title":"32 中世纪大学的兴起与特征","subject":"外教史","blocks":[{"t":"中世纪大学的兴起","items":[{"t":"12世纪前后在西欧城市兴起的新型教育机构","d":"欧城市兴起的新型教育机构，以意大利的萨莱诺大学和波隆那大学、法国的巴黎大学、英国的牛津大学和剑桥大学等为代表，是近代大学的直接源头。"},{"t":"以萨莱诺、波隆那、巴黎、牛津和剑桥为代表，是近代大学直接源头","d":"大学、法国的巴黎大学、英国的牛津大学和剑桥大学等为代表，是近代大学的直接源头。"}]},{"t":"产生原因","items":[{"t":"政治经济条件：王权日渐强固，社会趋于稳定，手工业成为专门职业","d":"西欧封建制度进入发展的鼎盛时期，王权日渐强固，社会趋于稳定，农业生产稳定上升，手工业逐渐成为专门的职业。"},{"t":"阶级条件：新兴城市市民阶层提出新的政治、经济和文化要求","d":"新兴的城市市民阶层成为推动社会向前发展的主要力量，他们提出了新的政治、经济和文化要求。"},{"t":"文化条件：古希腊、古罗马经典著作重新被发现，加强文化交流","d":"战争使许多已经销声匿迹的古希腊、古罗马时期的经典著作重新被发现，加强了不同文化的交流。在这种情况下，传统的宫廷学校和骑士教育已经不能满足大众崇尚文化的需要，新的教育机构和形式开始出现。"}]},{"t":"性质与体制","items":[{"t":"性质：一种自治的教授和学习中心"},{"t":"目的：进行职业训练，培养社会所需要的专业人才"},{"t":"体制：按领导体制分为‘学生’大学和‘先生’大学两种"}]},{"t":"课程、学位与教学","items":[{"t":"课程：应社会需要分文、法、神、医四科"},{"t":"制度：已有学位制度，考试合格可得‘硕士’‘博士’学位","d":"学生修毕大学课程，经考试合格，可得“硕士”“博士”学位。"},{"t":"教学方法：演讲和辩论","d":"演讲和辩论。⑦享有的一些特权：大学自治，大学师生免税、免服兵役，大学有权设立特别法庭处理大学师生与外人之间发生的诉讼，大学有集体迁移的自由、有颁发教师许可证的特权，等等。综上所述，中世纪大学是西欧社会经济、政治和文化发展到特定阶段的产物。它以培养专业人才为目标，以自治为核心特征，以分科课程和学位制度为基本框架，形成了近代高等教育制度的雏形。"}]},{"t":"享有的特权","items":[{"t":"大学自治，大学师生免税、免服兵役","d":"大学师生免税、免服兵役，大学有权设立特别法庭处理大学师生与外人之间发生的诉讼，大学有集体迁移的自由、有颁发教师许可证的特权，等等。综上所述，中世纪大学是西欧社会经济、政治和文化发展到特定阶段的产物。它以培养专业人才为目标，以自治为核心特征，以分科课程和学位制度为基本框架，形成了近代高等教育制度的雏形。"},{"t":"设立特别法庭，处理大学师生与外人之间发生的诉讼","d":"处理大学师生与外人之间发生的诉讼，大学有集体迁移的自由、有颁发教师许可证的特权，等等。综上所述，中世纪大学是西欧社会经济、政治和文化发展到特定阶段的产物。它以培养专业人才为目标，以自治为核心特征，以分科课程和学位制度为基本框架，形成了近代高等教育制度的雏形。"},{"t":"有集体迁移的自由，享有颁发教师资格证的特权","d":"有颁发教师许可证的特权，等等。综上所述，中世纪大学是西欧社会经济、政治和文化发展到特定阶段的产物。它以培养专业人才为目标，以自治为核心特征，以分科课程和学位制度为基本框架，形成了近代高等教育制度的雏形。"}]}],"id":"紫薯1-32"},{"num":33,"title":"33 学校消亡论与AI时代教师角色","subject":"教原","blocks":[{"t":"‘学校消亡论’评析","items":[{"t":"合理之处：AI拓宽学习渠道，可替代部分基础性教学工作","d":"人工智能拓宽了学习者的学习渠道，在一定程度上可以替代知识讲授、作业批改等部分基础性教学工作，并催生了泛在学习、个性化学习等新型教育形态，客观反映了技术驱动教育变革的发展趋势。"},{"t":"催生泛在学习、个性化学习等新型形态，反映技术驱动趋势"},{"t":"不可替代性：学校保障教育质量与公平，是学生社会化重要场所","d":"学校是有目的、有计划、有组织地培养人的专门机构，能够系统保障教育质量与教育公平；学校是学生社会化的重要场所，班级集体生活、同伴互动交往是学生健全人格发展的必要环节；学校还承担着立德树人、价值引领、品德培育的核心教育功能，这是人工智能技术无法替代的。"},{"t":"核心功能：承担立德树人、价值引领、品德培育，AI无法替代","d":"品德培育的核心教育功能，这是人工智能技术无法替代的。"}]},{"t":"教师角色的‘变’","items":[{"t":"AI承担作业批改、学情统计等重复性事务，教师转向学习设计者"},{"t":"教师需熟练运用智能教育工具，聚焦创新思维、批判性思维培养"}]},{"t":"教师角色的‘不变’","items":[{"t":"教书育人的根本任务不变，立德树人始终是教师的主要职责","d":"立德树人始终是教师的主要职责；以情育人、以理服人的教育内核不变，情感关怀与价值引领是人工智能无法替代的；因材施教的基本原则不变，教师基于对学生的深入了解开展个性化指导，是单纯的数据统计难以实现的。"},{"t":"以情育人、以理服人的教育内核不变，情感关怀不可替代","d":"以理服人的教育内核不变，情感关怀与价值引领是人工智能无法替代的；因材施教的基本原则不变，教师基于对学生的深入了解开展个性化指导，是单纯的数据统计难以实现的。"},{"t":"因材施教原则不变，个性化指导难以由数据统计实现"}]},{"t":"教师始终‘在场’的原因","items":[{"t":"教育本质的要求：教育是人与人之间的精神交往与价值引导","d":"教育是有目的地培养人的社会活动，其本质是人与人之间的精神交往与价值引导。人工智能不具备真实情感和自主价值判断能力，只能作为辅助工具，无法独立承担育人使命。"},{"t":"学生成长的需要：品德养成、心理发展与社会性发展需针对性引导","d":"学生成长涵盖品德养成、心理发展和社会性发展。学生在面对成长过程中的困惑与价值选择时，需要教师依托专业经验和人文关怀给予针对性引导。"},{"t":"时代发展的需要：信息纷繁、价值多元，更需教师做好价值引领","d":"人工智能时代信息纷繁复杂、价值多元，学生更需要教师做好价值引领，帮助其树立正确的世界观、人生观、价值观，落实立德树人的根本任务。【答案要点】（1）从材料中可以看出：。"}]}],"id":"紫薯1-33"},{"num":34,"title":"34 儿童认知发展规律与教学启示","subject":"教心","blocks":[{"t":"前运算阶段（3~6岁）","items":[{"t":"思维具有不可逆性和刻板性，尚未获得守恒概念","d":"该阶段儿童尚未获得守恒概念，因而处于前运算阶段。材料中，3～6岁的儿童仅依据水位高低这一单一维度做出判断，得出“细高杯子中的水更多”的结论，体现其不具备守恒概念。该阶段的主要特点有：a.开始能够运用表象、语言或较为抽象的符号来代表自己经历过的事物；b.言语和概念快速发展，但还不能很好地掌握概念的概括性和一般性；c.具有泛灵论倾向；d.出现集体独白现象；e.思维具有不可逆性、刻板性，存在自我中心主义（集中化），尚未获得守恒概念。"},{"t":"能运用表象、语言或抽象符号代表自己经历过的事物"},{"t":"言语和概念快速发展，但概括性和一般性掌握不足","d":"但还不能很好地掌握概念的概括性和一般性；c.具有泛灵论倾向；d.出现集体独白现象；e.思维具有不可逆性、刻板性，存在自我中心主义（集中化），尚未获得守恒概念。"},{"t":"具有泛灵论倾向，出现集体独白现象","d":"d.出现集体独白现象；e.思维具有不可逆性、刻板性，存在自我中心主义（集中化），尚未获得守恒概念。"},{"t":"存在自我中心主义（集中化），思维刻板"}]},{"t":"具体运算阶段（7岁以上）","items":[{"t":"思维具有可逆性，已获得守恒概念","d":"该阶段儿童获得了守恒概念，因而处于具体运算阶段。材料中，7岁以上的儿童能够同时关注杯子的高度和粗细两个维度，正确判断出水量没有发生改变，说明其已经掌握守恒概念。该阶段的主要特点有：a.可以进行逻辑思维，但仍需具体事物的支持；b.已能理解原则和规则，但在实际生活中只能刻板地遵守规则；c.思维具有可逆性、去自我中心主义（去集中化）；d.越来越以社会为中心，日益关注别人的看法。"},{"t":"可进行逻辑思维，但仍需具体事物的支持","d":"b.已能理解原则和规则，但在实际生活中只能刻板地遵守规则；c.思维具有可逆性、去自我中心主义（去集中化）；d.越来越以社会为中心，日益关注别人的看法。"},{"t":"能理解原则和规则，但在实际生活中只能刻板遵守","d":"但在实际生活中只能刻板地遵守规则；c.思维具有可逆性、去自我中心主义（去集中化）；d.越来越以社会为中心，日益关注别人的看法。"},{"t":"思维具有可逆性，去自我中心主义（去集中化）","d":"该阶段儿童获得了守恒概念，因而处于具体运算阶段。材料中，7岁以上的儿童能够同时关注杯子的高度和粗细两个维度，正确判断出水量没有发生改变，说明其已经掌握守恒概念。该阶段的主要特点有：a.可以进行逻辑思维，但仍需具体事物的支持；b.已能理解原则和规则，但在实际生活中只能刻板地遵守规则；c.思维具有可逆性、去自我中心主义（去集中化）；d.越来越以社会为中心，日益关注别人的看法。"},{"t":"越来越以社会为中心，日益关注别人的看法"}]},{"t":"对教学的启示","items":[{"t":"遵循儿童认知发展的阶段性规律，切忌超前施教","d":"切忌超前施教。前运算阶段的儿童尚未掌握守恒概念、难以理解抽象逻辑，教学应采用实物、模型等直观教学手段，避免生硬灌输抽象知识；进入具体运算阶段后，学生可依托具体事物开展逻辑学习与思维训练，促进认知循序渐进发展。教师需根据学生所处的认知发展阶段，匹配适宜的教学内容与教学方法，开展与学生认知水平相适配的教学。"},{"t":"依托同化与顺应机制，引导学生主动建构认知结构","d":"引导学生主动建构认知结构。同化是将新信息纳入已有认知结构，顺应是调整原有认知结构以适配新情境，二者是学生建构认知结构的两种方式。教学应立足学生已有生活经验，设计动手操作类探究任务，引导学生在实践中完成认知的同化或顺应，主动建立守恒、分类等核心概念。"},{"t":"创设认知冲突情境，通过平衡化推动认知发展","d":"通过平衡化推动认知发展。平衡化是认知发展的内在动力。当已有认知无法解释新现象时，个体会产生认知不平衡，进而推动认知结构优化升级。在教学中，教师可参照守恒实验创设问题情境，引发学生的认知冲突，引导其主动思考、修正原有认知，实现认知水平的自主提升。【答案要点】（1）该课程属于典型的活动课程，主要特点如下：。"}]}],"id":"紫薯1-34"},{"num":35,"title":"35 活动课程的特点与评价原则","subject":"教原","blocks":[{"t":"活动课程的主要特点","items":[{"t":"以直接经验为核心载体，通过实践活动获取直接经验","d":"活动课程强调通过实践活动获取直接经验，以弥补学科课程偏重间接知识传授的局限。案例中，该课程以校园科技节的真实活动筹备为载体，引导学生完整经历调研策划、组织准备、实践执行、反思总结的全过程，使学生在亲身参与中获得直接经验。"},{"t":"突出学生的主体性，学生自主主导活动全流程","d":"活动课程主张以学生的活动为中心，强调学生在学习过程中的主体地位。案例中，学生兼具设计者、组织者、参与者三重身份，自主主导活动全流程，分工协作完成方案设计、场地布置、活动运营等各项任务，充分发挥了主观能动性。"},{"t":"具有综合性与开放性，打破学科壁垒，强调知识综合运用","d":"活动课程打破学科壁垒，强调知识的综合运用与开放探究。案例中，学生综合运用语文、数学、美术、信息技术等多学科知识解决实际问题，在真实的问题解决中激发自身的探究意识与创新思维。"},{"t":"聚焦实践能力的培养，在真实情境中提升解决问题能力","d":"活动课程注重在真实情境中提升学生解决实际问题的能力。案例中，该课程立足真实的校园活动场景，让学生在方案设计、场地布置、活动运营等实践过程中同步提升问题解决能力、协作能力，增强责任意识，最终实现价值体认、责任担当、问题解决、创意物化的育人目标。"}]},{"t":"直接经验与间接经验相统一","items":[{"t":"教学以间接经验为主，为实践提供理论支撑","d":"该课程要求学生综合运用已学的多学科知识来解决实际问题，为实践提供理论支撑，有效避免了活动因脱离知识体系而沦为无意义的玩乐。"},{"t":"教学以直接经验为辅，抽象知识需依托实践体验才能真正理解","d":"抽象的书本知识需要依托实践体验才能真正被学生理解和掌握。该课程以校园科技节的真实活动筹备为载体，引导学生完整经历调研策划、组织准备、实践执行、反思总结的全过程，使学生在实践中将知识转化为解决问题的能力，深化了对知识的理解。"},{"t":"将学科知识与实践活动有机结合，实现二者互补统一","d":"实现了间接经验与直接经验的互补统一，有效避免了理论与实践相脱节。"}]},{"t":"实施该课程的评价原则","items":[{"t":"发展性评价原则：以促进学生全面发展为核心目的","d":"发展性评价以促进学生全面发展为核心目的，弱化甄别选拔功能，聚焦学生在活动中的成长与进步，充分发挥评价的激励与引导作用。案例中，该课程旨在实现价值体认、责任担当、问题解决、创意物化的综合育人目标，契合发展性评价关注学生综合素养提升的导向。"},{"t":"过程性评价原则：覆盖活动全流程，关注参与度与思维成长","d":"过程性评价强调覆盖活动全流程，既关注最终成果，也重视学生在过程中的参与度、协作表现与思维成长。案例中，该课程引导学生完整经历调研策划、组织准备、实践执行、反思总结的全过程，因此评价应当贯穿活动始终，以全面反映学生在各环节的实践表现与能力发展。"},{"t":"多元化评价原则：学生自评、组内互评、教师评价相结合","d":"多元化评价主张采用学生自评、组内互评、教师评价等多种评价方式，结合质性描述与量化记录，全面评估学生的综合素养发展。案例中，学生兼具设计者、组织者、参与者三重身份，分工协作完成各项任务，对此评价应综合多方视角，全面衡量学生的责任担当、协作能力与创意物化水平。【答案要点】（1）案例中，教师的教学行为契合创造性培养的规律，具有正向教育价值。具体评析如下：。"}]}],"id":"紫薯1-35"},{"num":36,"title":"36 创造性培养的教学策略","subject":"教心","blocks":[{"t":"教学行为的积极价值","items":[{"t":"营造安全、包容的课堂心理环境，消除创造性表达的心理顾虑","d":"教师并未否定“方苹果”这一非常规创作，而是耐心倾听学生对创意的阐述。此举避免了学生因标新立异遭受批评，消除了学生进行创造性表达的心理顾虑。"},{"t":"保护并强化学生的创造动机，通过激励性评价激发创新意愿"},{"t":"尊重学生的个性化思维成果，不设标准答案","d":"教师创设“苹果园”展示区，接纳学生形态各异的苹果作品，不设标准答案，认可学生的差异化表达，为学生创造性思维的发展提供了充足空间。"}]},{"t":"有效培养创造性的途径","items":[{"t":"创设支持创造性发展的课堂环境：宽松、民主、包容","d":"教师应构建宽松、民主、包容的课堂氛围，不轻易否定学生的非常规想法，消除学生怕出错的心理顾虑。案例中，教师不仅没有批评“方形苹果”这一非常规画法，反而主动追问学生这样画的原因，体现了教师对学生独特想法的接纳与尊重。同时，教师应给予学生自主探索的空间，减少统一标准的束缚，鼓励多元表达，正如案例中的教师让学生自由创作并展示所有作品，为创造性思维的萌发提供了安全、开放的环境。"},{"t":"培养学生的创造性个性品质：保护好奇心与求知欲，鼓励独立思考","d":"教师首先要保护学生的好奇心与求知欲，对于学生的奇思妙想给予及时、正向的反馈，以激发其内在创造动力。案例中，教师听完男孩的解释后给予肯定和鼓励，正是对其创新动机的强化。其次，教师要鼓励学生独立思考、发扬创新精神，尊重学生的个性化见解，避免用标准化答案限制学生的思维。最重要的是，教师要引导学生将想象与生活经验相结合，培养学生将创意转化为实际价值的意识。案例中的男孩正是基于“苹果易滚落、装箱占空间”的生活痛点，才萌生了“方苹果”的创意，这种从生活中发现问题的能力正是创造性思维的重要源泉。"},{"t":"教授创造性思维训练策略：发散思维、头脑风暴、探究式学习","d":"教师可通过多种方法系统训练学生的创造性思维：一是开展发散思维训练，引导学生突破常规，从多角度、多方向思考问题，寻求多种可能的解决方案；二是运用头脑风暴法等集体讨论形式，激发观点碰撞，集思广益，在交流中拓展思路；三是结合真实问题开展探究式学习，引导学生运用创意解决实际问题，在实践中提升学生的创造性思维。"}]}],"id":"紫薯1-36"}]},{"id":"紫薯2","name":"紫薯2","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 《学记》的教育贡献","subject":"中教史","blocks":[{"t":"教育管理方面的贡献","items":[{"t":"重视大学开学和入学教育：天子率百官亲临学宫，定期视察学宫","d":"开学这天，天子率百官亲临学宫，参加开学典礼，祭祀“先圣先师”。天子还定期视察学宫，体现国家对教育的重视。"},{"t":"重视学业的训诫仪式：使学生明确‘为日后从政而学习’的目的","d":"为了使学生明确“为日后从政而学习”的目的，学校设立了一系列学业训诫仪式。"},{"t":"重视考核：每隔一年考查一次，内容包括学业成绩和道德品行","d":"学习过程中，规定每隔一年考查一次，以表示这一阶段学业的完成。考查常由主管学校的官员亲临主持。考查内容包括学业成绩和道德品行，不同的年级有不同的要求。"}]},{"t":"教育教学原则","items":[{"t":"启发诱导：‘道而弗牵，强而弗抑，开而弗达’，倡导自主思考","d":"原则方面，它提出“道而弗牵，强而弗抑，开而弗达”，倡导启发学生自主思考，避免强制灌输。同时，它系统概括了预防性原则、及时施教原则、循序渐进原则、学习观摩原则、长善救失原则、藏息相辅原则。这些教育教学原则源自先秦教育实践，揭示了教学的普遍规律，对今天的教学活动仍有重要的借鉴价值。"},{"t":"系统概括预防性、及时施教、循序渐进、学习观摩等原则","d":"原则、循序渐进原则、学习观摩原则、长善救失原则、藏息相辅原则。这些教育教学原则源自先秦教育实践，揭示了教学的普遍规律，对今天的教学活动仍有重要的借鉴价值。"},{"t":"长善救失、藏息相辅，揭示教学的普遍规律","d":"原则、藏息相辅原则。这些教育教学原则源自先秦教育实践，揭示了教学的普遍规律，对今天的教学活动仍有重要的借鉴价值。"}]},{"t":"教学方法的阐述","items":[{"t":"对讲解法、问答法、练习法等做出精当阐述","d":"问答法、练习法等教学方法做出了精当阐述。书中点明各类教学方法的运用要点，提醒教师要结合学生情况灵活施教，切忌机械固化地开展教学。这些教学方法契合教学规律，经过长期实践检验并沿用至今，可见《学记》具有十分重要的价值。【答案要点】20世纪30年代欧美新传统教育派教育思潮主要包括要素主义教育、永恒主义教育和新托马斯主义教育。"},{"t":"提醒教师结合学生情况灵活施教，切忌机械固化","d":"地开展教学。这些教学方法契合教学规律，经过长期实践检验并沿用至今，可见《学记》具有十分重要的价值。【答案要点】20世纪30年代欧美新传统教育派教育思潮主要包括要素主义教育、永恒主义教育和新托马斯主义教育。"}]}],"id":"紫薯2-31"},{"num":32,"title":"32 新传统教育派教育思潮","subject":"外教史","blocks":[{"t":"要素主义教育","items":[{"t":"1938年《要素主义者促进美国教育的纲领》发表，代表人物巴格莱"},{"t":"课程核心是人类文化遗产的共同要素，教材按知识逻辑系统编写"},{"t":"教学过程是严格的训练智慧的过程，学生必须刻苦和专心"},{"t":"教师应是整个教育过程中的权威人物"}]},{"t":"永恒主义教育","items":[{"t":"提倡复古，代表人物赫钦斯、艾德勒、利文斯通、阿兰","d":"的教育理论，其代表人物为美国的赫钦斯、艾德勒，英国的利文斯通和法国的阿兰。主要观点：教育的性质是永恒不变的；教育的主要目的是培养永恒的理性；永恒的古典学科应该在学校课程中占有中心地位；学生通过教师的教学进行学习；倡导实施全民的自由教育。"},{"t":"教育的性质永恒不变，主要目的是培养永恒的理性","d":"永恒的古典学科应该在学校课程中占有中心地位；学生通过教师的教学进行学习；倡导实施全民的自由教育。"},{"t":"永恒的古典学科应在学校课程中占中心地位","d":"该在学校课程中占有中心地位；学生通过教师的教学进行学习；倡导实施全民的自由教育。"},{"t":"倡导实施全民的自由教育"}]},{"t":"新托马斯主义教育","items":[{"t":"提倡宗教教育，代表人物为法国神学家、教育家马利坦","d":"的理论，20世纪30年代产生于意大利、法国等国家，第二次世界大战后也曾在美国流行，其代表人物为法国神学家、教育家马利坦。主要观点：教育应以宗教为基础；教育的目的是培养真正的基督教徒和有用的公民；学校课程应以基督教精神为基础；教育应处在教会的严密控制之下。"},{"t":"教育应以宗教为基础，培养真正的基督教徒和有用的公民","d":"教育的目的是培养真正的基督教徒和有用的公民；学校课程应以基督教精神为基础；教育应处在教会的严密控制之下。"},{"t":"学校课程应以基督教精神为基础，教育处于教会控制之下","d":"教精神为基础；教育应处在教会的严密控制之下。"}]},{"t":"三种思潮的影响","items":[{"t":"要素主义影响美国20世纪50—60年代教育改革，主张被纳入政策"},{"t":"永恒主义在教育理论上有影响，实践影响限于大学和上层知识界"},{"t":"新托马斯主义曾在欧美教会学校产生影响，但存在内在矛盾"}]}],"id":"紫薯2-32"},{"num":33,"title":"33 立德树人与德育贯穿五育","subject":"教原","blocks":[{"t":"立德树人是根本任务的原因","items":[{"t":"遵循人才成长规律：德是首要、是方向，德行统领才干","d":"材料指出，德是首要、是方向，德行统领才干。育人重在立德，只有引导人明大德、守公德、严私德，方能使人尽其才、服务社会。"},{"t":"契合我国教育本质：坚持德育为先，坚守正确政治方向","d":"我国教育坚持以习近平新时代中国特色社会主义思想铸魂育人，坚持德育为先，坚守正确政治方向，落实为党育人、为国育才的使命。"},{"t":"顺应民族复兴需求：需要大量德才兼备、堪当重任的时代新人","d":"强国建设、民族复兴需要大量德才兼备、堪担重任的时代新人，立德树人是培育栋梁之材的核心抓手。"}]},{"t":"德育贯穿五育全过程","items":[{"t":"核心内涵：德育并非独立的育人环节，应有机融入五育全过程","d":"是德育并非独立的育人环节，应当有机融入智育、体育、美育、劳动教育全过程，坚持“五育”并举，实现全程、全方位铸魂育人。"},{"t":"智育为德育提供认知基础，二者相辅相成","d":"二者相辅相成。教师在教学中深挖学科德育元素，推动思政课程与课程思政协同发力；教师将德育融入课堂各个环节，实现知识传授与价值引领相统一，引导学生在实践探究中提升道德实践能力。"},{"t":"体育兼具强身与塑德价值，锤炼意志品质与拼搏精神","d":"体育活动与赛事训练既能够帮助学生掌握运动技能、养成体育锻炼习惯，也能锤炼学生的意志品质与拼搏精神。"},{"t":"美育以美润德，提升审美与艺术修养，陶冶道德情操","d":"开设美育课程，提升学生的审美与艺术修养，陶冶学生的道德情操。"},{"t":"劳动教育以劳树德，树立正确劳动观，涵养社会责任感","d":"学校通过开设劳动课程、组织实践活动，引导学生树立正确的劳动观，掌握一定的劳动技能，涵养道德品质与社会责任感。"}]},{"t":"当好‘大先生’的路径","items":[{"t":"教师要有大情怀：以理想信念为根基，兼具家国情怀与教育情怀","d":"教师需以理想信念为根基，兼具家国情怀与教育情怀，将个人教育理想融入民族复兴事业，扛起培育时代新人的重任。"},{"t":"教师要有大学问：扎实精深的专业学识是教书育人的基础","d":"扎实精深的专业学识是教书育人的基础。教师既要精通本学科知识，也要拓宽综合视野，主动适应数字化教育发展需求。"},{"t":"教师要有大格局：立足时代大局，拓宽育人视野，怀揣仁爱之心","d":"教师应立足时代大局，拓宽育人视野，怀揣仁爱之心对待每一位学生；同时，教师还应以言传身教的方式潜移默化地影响学生，引导学生树立社会主义核心价值观，成长为担当民族复兴大任的时代新人。【答案要点】（1）实验中，影响问题解决的因素是功能固着。功能固着是指个体熟知某个物品的惯常用途后，往往很难想到它的其他用途。上述实验中，被试只意识到钳子剪断铁丝的常用功能，未能结合问题情境意识到钳子还可以充当重物使用，这正是功能固着阻碍问题解决的体现。"}]}],"id":"紫薯2-33"},{"num":34,"title":"34 功能固着与问题解决教学策略","subject":"教心","blocks":[{"t":"功能固着","items":[{"t":"功能固着指个体熟知物品惯常用途后，很难想到它的其他用途","d":"上述实验中，被试只意识到钳子剪断铁丝的常用功能，未能结合问题情境意识到钳子还可以充当重物使用，这正是功能固着阻碍问题解决的体现。"},{"t":"实验中被试只意识到钳子剪铁丝的常用功能，未想到可当重物使用"}]},{"t":"培养问题解决能力的策略","items":[{"t":"充分利用已有经验，形成知识结构体系","d":"形成知识结构体系。系统化、结构化的知识储备是问题解决的认知基础。教师要帮助学生梳理知识逻辑，强化知识的可迁移性，引导学生灵活调用已有经验，突破思维局限，克服功能固着。"},{"t":"分析问题的构成，把握问题解决的规律","d":"把握问题解决规律。教师要引导学生拆解问题的条件与目标，掌握问题解决的通用逻辑与步骤。如材料中的“两绳问题”，学生需先明确核心矛盾，挖掘可用工具的多重属性，再推导解法，逐步形成分析问题的稳定思路。"},{"t":"开展研究性学习，发挥学生的主动性","d":"发挥学生的主动性。教师可设计类似“两绳问题”的探究性任务，创设真实的问题情境，引导学生自主尝试、探寻解法，在独立思考与实践操作中积累问题解决经验。"},{"t":"教授问题解决策略，灵活变换问题","d":"灵活变换问题。教师向学生传授算法式、启发式等问题解决策略，通过一题多解、一物多用、情境变式等训练拓宽学生思路，打破思维定势，提升学生灵活应对不同问题的能力。"},{"t":"允许学生大胆猜想，鼓励开展实践验证","d":"鼓励开展实践验证。教师应尊重学生的非常规思路，鼓励学生跳出事物的惯有属性展开猜想，如材料中部分被试想到钳子可充当重物的非常规用法；同时，教师还应引导学生通过动手实践验证想法，在试错与探究中提升其问题解决能力。【答案要点】（1）1.0版和2.0版家校合作模式存在的主要问题：。"}]}],"id":"紫薯2-34"},{"num":35,"title":"35 家校合作问题与协同育人","subject":"教原","blocks":[{"t":"家校合作模式的问题","items":[{"t":"沟通单向化：以学校单向输出要求为主，家长处于被动接收地位","d":"1.0版家校合作模式以学校单向输出要求为主，家长处于被动接收地位，双方仅存在形式层面的联系，未形成真正的双向互动与共育关系。"},{"t":"地位不对等：话语权仍由学校掌握，缺乏平等的对话机制","d":"2.0版家校合作模式虽优化了合作形式、丰富了活动环节，但话语权仍由学校掌握，家校之间缺乏平等的对话机制，家校沟通流于表面，难以形成情感共鸣与育人共识。"},{"t":"合作浅层化：停留在事务传达、经验分享层面，未形成长效机制","d":"1.0版和2.0版家校合作模式均停留在事务传达、经验分享层面，尚未构建系统化、长效化的协同育人机制，难以形成稳定的教育合力。"}]},{"t":"家校协同育人的意义","items":[{"t":"统一育人方向：形成教育共识，避免教育导向相互冲突","d":"家庭和学校形成教育共识，避免教育导向相互冲突，为学生品行养成、习惯培育提供连贯、稳定的教育引导，落实教育影响的一致性与连续性原则。"},{"t":"整合育人资源：学校发挥专业教育优势，家庭发挥情感与生活优势","d":"学校发挥专业教育优势，家庭发挥情感与生活育人优势，二者优势互补，拓展育人的广度与深度。"},{"t":"提升育人实效：学校提供专业指导，家庭反馈学生成长细节","d":"学校能够为家长提供专业育人指导，弥补家庭教育的不足；家庭能反馈学生成长细节，助力学校实施因材施教，共同促进学生全面发展。"}]},{"t":"推动家校良性互动的措施","items":[{"t":"构建系统化家长成长课程体系，帮助家长提升育人能力","d":"学校应开设校本家长课程，统一家校育人理念，帮助家长提升育人能力。"},{"t":"建立平等双向的沟通机制，打破学校单向主导的沟通格局","d":"教师应在入学初期摸排学生与家庭情况，搭建家校对等对话平台，打破学校单向主导的沟通格局。"},{"t":"丰富多元共育实践形式，推动家校资源互通、双向赋能","d":"学校可通过育人主题活动、“家长进课堂”活动等，推动家校资源互通、双向赋能，构建有温度的协同育人关系。【答案要点】（1）这位学生存在的主要问题是自我效能感低下，具体表现为自信心不足、怀疑自身学习能力、面对考试产生心理压力等。依据班杜拉的自我效能感理论，其问题成因如下：。"}]}],"id":"紫薯2-35"},{"num":36,"title":"36 自我效能感低下的成因与辅导","subject":"教心","blocks":[{"t":"自我效能感低下的成因","items":[{"t":"直接经验的影响：近期多次考试失利，导致自信心下降","d":"直接经验是影响自我效能感最重要的因素。该学生近期多次考试失利，受负面的直接经验影响，怀疑自身学习能力，片面依据考试结果否定自我、忽视自身学习优势，导致自信心下降，自我效能感降低。"},{"t":"情绪唤起的影响：一提到考试就紧张、沮丧，降低自我效能感","d":"个体面对任务时的情绪状态会影响自我效能感。该学生一提到考试就浑身不自在，产生紧张、沮丧等消极情绪，由此带来的高度情绪唤起进一步降低其自我效能感。"},{"t":"言语说服的影响：持续消极的自我言语暗示，造成自信心受挫","d":"该学生不断自我怀疑，持续进行消极的自我言语暗示，认为自身能力不足，造成自信心受挫，降低其自我效能感。"}]},{"t":"提高自我效能感的辅导","items":[{"t":"帮助学生建立清晰的自我认知，全面了解自己，避免妄自菲薄","d":"使其更全面地了解自己。我会引导该学生客观看待自身不足，同时也要看到自己的长处，避免妄自菲薄。"},{"t":"为学生创设获得成功经验的机会，设置递进式学习任务","d":"针对该学生因多次考试失利导致自信心受挫的情况，我会为其设置分层练习、阶段性小测以及可达成的递进式学习任务，帮助其在日常练习中获得成就感。"},{"t":"开展积极的言语劝说，给予正向鼓励与客观评价","d":"给予正向鼓励。我会充分相信该学生的发展潜力，通过口头交流、书面反馈等方式给予其客观评价与正向激励。"},{"t":"提供针对性学业指导，帮助其查漏补缺，补齐学习短板","d":"我会了解该学生的学习困境，有针对性地帮助其查漏补缺，补齐学习短板。"}]}],"id":"紫薯2-36"}]},{"id":"紫薯3","name":"紫薯3","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 壬子癸丑学制的进步","subject":"中教史","blocks":[{"t":"两种学制概况","items":[{"t":"癸卯学制：首个全国性法定学制系统，三段七级，总年限20~21年","d":"是中国近代由中央政府颁布并首次得到施行的全国性法定学制系统。该学制参照日本学制，将主系列划分为三段七级。从小学堂到大学堂，学制总年限为20～21年，其中，初等小学堂5年为强迫教育阶段。此外，该学制还将幼儿教育机构——蒙养院纳入学制系统。“壬子癸丑学制”，即“1912—1913年学制”，是中国近代第一个资产阶级性质的学制。垓学制参照日本学制，将主系列划分为三段四级，总年限为17～18年，实施4年义务教育；小学实行男女同校，中学设置女子中学；以“小学一大学”教育为骨干，兼重师范教育和实业教育。与“癸卯学制”相比，“壬子癸丑学制”的进步之处体现在以下几个方面：。"},{"t":"壬子癸丑学制：首个资产阶级性质学制，三段四级，17~18年","d":"即“1912—1913年学制”，是中国近代第一个资产阶级性质的学制。垓学制参照日本学制，将主系列划分为三段四级，总年限为17～18年，实施4年义务教育；小学实行男女同校，中学设置女子中学；以“小学一大学”教育为骨干，兼重师范教育和实业教育。与“癸卯学制”相比，“壬子癸丑学制”的进步之处体现在以下几个方面：。"}]},{"t":"性质与学校系统","items":[{"t":"性质：实现由封建性质向资产阶级性质学制的转变"},{"t":"取消奖励科举出身，废止保人制度，大学不设经科","d":"有利于消除教育中的封建等级性、科举名位思想和复古气息。"},{"t":"学校系统：基础教育、高等教育、实业教育、师范教育均有雏形","d":"对学校体系做了相对完整的设计。从学制的结构及内容来看，“壬子癸丑学制”的基础教育、高等教育、实业教育、师范教育等教育类别都有了雏形，且小学、中学、大学各个阶段也有了清晰的划分。中学废除文、实分科，取消高等学堂，只设大学预科。"},{"t":"中学废文、实分科，取消高等学堂，只设大学预科"}]},{"t":"学制年限的缩短","items":[{"t":"与癸卯学制相比缩短了3年，加快人才培养速度"},{"t":"有利于普通教育的普及和平民化发展"}]},{"t":"课程内容和教学方法","items":[{"t":"取消‘忠君’‘尊孔’课程，不再局限于传统经典著作"},{"t":"增加自然科学课程和生产技能训练，知识体系开放化、实用化","d":"在教学方法方面，“壬子癸丑学制”反对体罚，改进教学方法，使教育更加联系学生实际，适合学生身心发展。"},{"t":"反对体罚，改进教学方法，使教育更加联系学生实际","d":"改进教学方法，使教育更加联系学生实际，适合学生身心发展。"}]},{"t":"教育对象","items":[{"t":"女子享有与男子平等的法定教育权","d":"等的法定教育权。“壬子癸丑学制”改变先前学制排斥女子教育的传统，提倡不分男女儿童，都应接受义务教育；初等教育阶段可以男女同校；设立专门的女子中学、女子师范学校等。这突破了封建礼教对女性的限制，体现了资本主义文化的男女平等观点。【答案要点】马克思、恩格斯所讲的人的发展，实际上是指在人的劳动能力全面发展的基础上，包括人的社会关系、体力、智力、道德精神面貌、意志、情感、个性、审美意识和实践能力等各方面的和谐统一发展。"},{"t":"初等教育阶段男女同校，设立女子中学、女子师范学校","d":"等。这突破了封建礼教对女性的限制，体现了资本主义文化的男女平等观点。【答案要点】马克思、恩格斯所讲的人的发展，实际上是指在人的劳动能力全面发展的基础上，包括人的社会关系、体力、智力、道德精神面貌、意志、情感、个性、审美意识和实践能力等各方面的和谐统一发展。"}]}],"id":"紫薯3-31"},{"num":32,"title":"32 马克思人的全面发展学说","subject":"外教史","blocks":[{"t":"人的全面发展的内涵","items":[{"t":"以人的劳动能力全面发展为基础，各方面和谐统一发展"},{"t":"包括社会关系、体力、智力、道德精神面貌、意志、情感、个性等","d":"意志、情感、个性、审美意识和实践能力等各方面的和谐统一发展。"}]},{"t":"社会条件与根本途径","items":[{"t":"人的发展由整个社会的发展决定，大工业社会提供物质基础"},{"t":"教育与生产劳动相结合是实现人的全面发展的根本途径","d":"结合。教育与生产劳动相结合，不是机械的教育与劳动的相加，它的内涵十分丰富，包括理论与实践的结合、学与用的结合、知识分子与劳动人民的结合等。"}]},{"t":"在教育学上的意义","items":[{"t":"确立了科学的人的发展观","d":"马克思、恩格斯关于人的全面发展学说把人的发展历史归结为生产方式发展的历史，确定了“人怎样表现自己的生活，他们自己也就怎样”的科学发展观，从而在人的发展问题上提供了一种全新的方法论的指导。"},{"t":"指明了人的全面发展的历史必然性","d":"展的历史必然性。马克思、恩格斯关于人的全面发展学说所揭示的人的发展方向，是一种建立在生产发展普遍规律基础之上的自然历史过程。这种发展方向不仅符合人类的利益，而且符合历史发展的客观规律，它的合理性与它的必然性是一致的。"},{"t":"为我国教育目的的制定奠定了理论基础","d":"制定奠定了理论基础。马克思、恩格斯关于人的全面发展学说是在继承和发展历史上相关理论基础上的新的探索和科学概括，是我们选择社会主义教育目的价值取向的理论基础。"}]},{"t":"现实意义","items":[{"t":"社会主义制度的建立为人的全面发展拓宽了道路","d":"立为人的全面发展拓宽了道路。从总体上看，社会主义属于“第三种形态”的共产主义社会的初级阶段，我国的情况正是这样，既然资本主义的基本矛盾在社会主义阶段被克服了，那么，社会主义制度的建立便为实现人的自由而全面发展的理想目的拓宽了道路，开始了新的进程。"},{"t":"要依据我国的特点尽可能地促进人的全面发展","d":"尽可能地促进人的全面发展。要依据我国的现实条件，积极采取各种切实举措，尽可能地全面提高人的素质，促进人的个性全面发展，并以此作为现阶段我国教育目的的基本价值取向。"},{"t":"人的全面发展是构建社会主义和谐社会的基本内涵","d":"建社会主义和谐社会的基本内涵。没有人的自由而全面发展，就不可能有社会的全面进步。人的自由而全面发展与坚持科学发展观、建设社会主义和谐社会是相互依存、相互促进、相得益彰的。"},{"t":"追求人的全面发展与实现人的自由发展必须和谐统一","d":"与实现人的自由发展必须和谐统一。我国当前的教育改革与发展应该在引导学生全面发展的同时，关注学生个性的自由发展，着重培养学生的创新精神、批判意识与独立个性。不仅实现学生在知识、智力、技能发展上达到全面发展的要求，而且使他们在精神上不断追求自由与解放，提升实践智慧与行动能力，并通过精神和个性的自由发展带动和促进更高层次的人的全面发展。"}]}],"id":"紫薯3-32"},{"num":33,"title":"33 杜威内在目的论及其启示","subject":"教原","blocks":[{"t":"杜威的内在目的论","items":[{"t":"教育不能脱离儿童身心发展规律、兴趣与内在需要预设外在目的","d":"的身心发展规律、兴趣与内在需要，强行预设外在、功利的教育目标。教育的根本目的在于立足儿童自身发展、促进其自然生长，这正是杜威内在目的论的核心主张。杜威的内在目的论从全新的角度诠释了教育目的，突出了儿童的主体地位，有利于调动学生学习的积极性和主动性。但该理论片面强调教育的内在目的，否定了外在目的与内在目的的联系，理论过于理想化，现实可行性不足。"},{"t":"教育的根本目的在于立足儿童自身发展、促进其自然生长","d":"促进其自然生长，这正是杜威内在目的论的核心主张。杜威的内在目的论从全新的角度诠释了教育目的，突出了儿童的主体地位，有利于调动学生学习的积极性和主动性。但该理论片面强调教育的内在目的，否定了外在目的与内在目的的联系，理论过于理想化，现实可行性不足。"},{"t":"评价：突出儿童主体地位，但片面强调内在目的，过于理想化"}]},{"t":"确立教育目的的基本依据","items":[{"t":"个体的身心发展规律：尊重受教育者的主体地位","d":"教育目的应当符合受教育者的身心发展水平、兴趣与内在需要，尊重受教育者的主体地位，这是确立教育目的的内在依据，正如农事生产必须遵循植物生长的客观规律。"},{"t":"社会发展的客观需要：受社会政治、经济、文化条件制约","d":"教育目的受一定社会政治、经济、文化等现实条件的制约，不能脱离社会发展的客观要求，正如农事生产受土壤、气候等外部环境约束。"},{"t":"科学的教育理论指引：以马克思主义人的全面发展学说为指导","d":"确立教育目的还应当以科学的教育理论为指导，平衡个体发展与社会发展的现实需求，防止片面侧重某一方面。马克思主义关于人的全面发展学说是我国制定教育目的的重要理论依据。"}]},{"t":"对教育改革的启示","items":[{"t":"理论层面：坚持教育的内在目的与外在目的辩证统一","d":"坚持教育的内在目的与外在目的辩证统一。教育的内在目的与外在目的相辅相成、不可割裂。我国教育目的的制定，既要尊重学生的身心发展规律、兴趣与内在需要，也要契合社会发展的客观需求，实现个体发展与社会发展的协调统一。"},{"t":"实践层面：遵循身心发展规律，优化教育教学与课程体系","d":"遵循学生身心发展规律，优化教育教学与课程体系。教育教学要立足学生的兴趣与内在需要，科学选择与组织教育内容。在课程设置上，学校应坚持综合性、均衡性与选择性原则，优化课程结构，既要开设学科课程，也要设置活动课程、综合课程、选修课程等。【答案要点】（1）上述实验体现了班杜拉的社会（观察）学习理论。观察学习是一种间接学习，人类的大多数行为是通过观察习得的。个体通过观察他人的行为及其后果，可获得榜样行为的符号表征与行为规则，进而指导自身今后的行为。"}]}],"id":"紫薯3-33"},{"num":34,"title":"34 观察学习理论及教学应用","subject":"教心","blocks":[{"t":"社会（观察）学习理论","items":[{"t":"观察学习是一种间接学习，人类大多数行为通过观察习得","d":"人类的大多数行为是通过观察习得的。个体通过观察他人的行为及其后果，可获得榜样行为的符号表征与行为规则，进而指导自身今后的行为。"},{"t":"通过观察他人行为及其后果，获得符号表征与行为规则"}]},{"t":"观察学习的基本过程","items":[{"t":"注意过程：调节对示范活动的探索与知觉","d":"观察学习的首要阶段，调节观察者对示范活动的探索与知觉，决定着观察者在大量的榜样中选择什么作为观察对象。影响注意过程的因素有榜样行为的特性、榜样的特征、观察者的特点等。"},{"t":"保持过程：所观察的行为在记忆中以符号形式表征","d":"观察者所观察的行为在记忆中以符号的形式表征。"},{"t":"复制过程：又称动作再现过程，即观察后的模仿过程","d":"又称动作再现过程，就是学习者观察后的模仿过程。"},{"t":"动机过程：因表现所观察到的行为而受到激励","d":"学习者因表现所观察到的行为而受到激励。这一过程中有三种强化方式，包括直接强化、替代强化和自我强化。"}]},{"t":"教师的教学应用","items":[{"t":"发挥替代强化的作用，帮助学生树立良好的榜样","d":"教师要帮助学生树立良好的榜样，发挥替代强化的作用。"},{"t":"教授新行为、技能、态度和情感，并予以示范与强化","d":"技能、态度和情感。教师需要将所期望的行为、技能、态度和情感以明确外显的方式进行示范或者树立理想的榜样，让学生得以观察，并对学生的模仿行为予以强化。"},{"t":"注意发挥自身的榜样作用，以好奇心与热情感染学生","d":"教师对世界的好奇心、对本学科的热爱以及对学习的热情等将感染学生。"},{"t":"监控学生习得行为的表现：去抑制、抑制、社会促进效应","d":"教师要利用三种效应来监控学生习得行为的表现：a.去抑制效应。当学生看到榜样因做出自己原来抑制的行为而受到奖励时，教师要顺势引导学生加强这种反应的倾向。b.抑制效应。当学生观察到榜样的不良行为受到惩罚时，教师要及时强化引导，帮助学生弱化这类不良行为的反应倾向。c.社会促进效应。教师可通过展示适宜的榜样行为，激活学生自身行为库中已有的正向反应，推动学生主动践行。【答案要点】（1）案例中“苹果树”平台的运用体现的教学评价功能：。"}]}],"id":"紫薯3-34"},{"num":35,"title":"35 教学评价功能与新时代评价观","subject":"教原","blocks":[{"t":"教学评价的功能","items":[{"t":"诊断功能：多维度数据绘制全息画像，诊断优势与短板","d":"苹果树”平台采集学生的体质健康、学业质量、特长发展、课外读书等多维度数据，为学生绘制全息画像，能够精准诊断学生的优势与短板，弥补传统评价过度依赖教师主观经验的不足，为教师因材施教提供科学依据。"},{"t":"导向功能：扭转‘唯分数论’倾向，引导重视综合素质","d":"苹果树”平台扭转“唯分数论”的评价倾向，引导师生、家长重视学生的综合素质与成长过程。该平台不只将学生学业测试分数作为评价依据，还纳入学生的作业、作品等，引导各方跳出单一分数的局限，充分发挥评价的导向作用，引领学生全面发展。"},{"t":"激励与促进功能：关注过程兴趣、态度、习惯，激发内驱力","d":"苹果树”平台关注学生活动过程中的兴趣、态度、习惯，尊重学生的个体特征，顺应学生的生长节律，丰盈学生的生命意义。这种动态化、过程性的评价模式能够直观呈现学生的成长轨迹，肯定学生的进步与付出，激发学生自我提升的内驱力，促进学生主动发展。该平台吸纳教师、家长、学生多方主体协同参与评价，凝聚育人合力，多角度看待学生发展，共同促进学生成长。"}]},{"t":"教学评价的类型","items":[{"t":"按评价时间划分：以过程性评价为主，兼顾终结性评价","d":"以过程性评价为主，兼顾终结性评价。案例中，“苹果树”平台持续采集学生作业、课堂表现、兴趣习惯等过程性数据，关注学生成长动态；同时，该平台整合学生学业测试分数等结果数据，实现了过程评价与结果评价的统一。"},{"t":"按评价主体划分：多元主体评价，教师、家长、学生协同参与","d":"多元主体评价。案例中，“苹果树”平台打破传统单一教师评价的局限，吸纳教师、家长、学生等多方主体协同参与评价过程，凝聚评价合力，使评价结果更加全面客观。"}]},{"t":"新时代应树立的评价观","items":[{"t":"评价目的聚焦发展：弱化甄别选拔，促进全面成长","d":"弱化评价的甄别选拔功能，以促进学生全面成长为核心目标。如案例中“苹果树”平台立足学生个性成长，以评价赋能学生发展。"},{"t":"评价内容综合多元：破除‘唯分数论’，兼顾学业与综合素质","d":"破除“唯分数论”导向，兼顾学业水平与综合素质，关注学生品德、能力、习惯等多维度发展。如案例中“苹果树”平台对学生进行多维数据采集。"},{"t":"评价方式动态立体：过程性与终结性、量化与质性相结合","d":"坚持过程性评价与终结性评价相结合、量化评价与质性评价相结合，实现对学生成长的全息追踪。如案例中“苹果树”平台兼顾学生的过程表现与作品成果。"},{"t":"评价主体多元协同：教师、家长、学生共同参与","d":"推动教师、家长、学生共同参与评价，构建多方协同的育人评价体系。如案例中“苹果树”平台吸纳各方主体协同参与评价。"},{"t":"评价手段科学精准：依托信息技术实现数据驱动评价","d":"依托信息技术实现数据驱动评价，提升评价的客观性、科学性与说服力。如案例中“苹果树”平台推动评价从经验主导走向数据驱动。【答案要点】（1）影响小泽品德发展的主要外部因素及其影响：。"}]}],"id":"紫薯3-35"},{"num":36,"title":"36 影响品德发展的外部因素","subject":"教心","blocks":[{"t":"外部因素及影响","items":[{"t":"家庭环境：起奠基作用，小泽长期与父母分离，缺乏情感交流","d":"家庭环境对学生品德的形成和发展起奠基作用。小泽长期与父母分离，缺乏情感交流和有效的道德指导。祖父母文化水平较低，对小泽放任不管，使其在成长的关键阶段缺乏正确的是非观和价值观引导。"},{"t":"学校环境：学风建设不足，学业压力过大，部分学生存在作弊","d":"班级学风建设不足，学业压力过大，部分学生存在作弊行为，易催生作弊可接受的错误道德判断，这也促使小泽产生“只要能拿高分，怎么做都行”的想法。"},{"t":"同伴影响：性格孤僻，人际交往匮乏，缺乏正面同伴榜样","d":"小泽性格孤僻，人际关系差，与同龄人交流匮乏，缺乏正面的社会互动与同伴榜样。班级部分同学存在作弊等不良行为，不良的同伴风气会对小泽的品德发展产生消极影响。"},{"t":"社会文化影响：沉迷网络暴力、功利主义视频，规则意识缺失","d":"小泽经常在网络中接触涉及暴力、功利主义的视频，并沉迷其中，造成其道德同理心与规则意识缺失。"}]},{"t":"教育建议","items":[{"t":"加强家庭教育指导，发挥家庭在品德发展中的奠基作用","d":"发挥家庭在品德发展中的奠基作用。学校应依托家校沟通平台，对祖辈监护人开展家庭教育培训，提升其教育意识与教育能力；同时建议小泽的父母通过电话、视频等方式给予小泽更多情感陪伴，弥补亲子互动的缺失。"},{"t":"创设积极的学校氛围，利用学校环境促进学生品德养成","d":"利用学校环境促进学生品德养成。班主任应建立公平、正向的班级管理制度，强化对小泽不良行为（如作弊）的纪律约束；同时开展以诚信、合作为主题的德育活动，引导小泽内化道德规范，改善人际关系，形成正确的是非观和价值观。"},{"t":"引导社会健康接触，削弱不良社会文化的消极影响","d":"教师可引导小泽参与有意义的课外活动，如志愿服务、小组合作项目、心理辅导小组等，丰富其社会经验，减轻网络带来的负面影响；引导小泽正确使用网络，指导其掌握网络信息鉴别技巧，从而培养良好的媒介素养和自我调节能力。"}]}],"id":"紫薯3-36"}]},{"id":"紫薯4","name":"紫薯4","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 蔡元培改革北京大学","subject":"中教史","blocks":[{"t":"抱定宗旨，改变校风","items":[{"t":"改变学生观念：抱定宗旨、砥砺德行、敬爱师长","d":"改变校风：大学应该成为“研究高尚学问之地”。"},{"t":"整顿教师队伍，延聘积学热心教员，聘任取“学诣”第一原则","d":"延聘积学热心的教员。在教师聘任上采取“学诣”第一的原则。"},{"t":"发展研究所、广积图书，引导师生研究兴趣","d":"广积图书，引导师生的研究兴趣。大学不仅要传授知识，而且要创新知识，推动学术进步。"},{"t":"砥砺德行，培养正当兴趣，倡导成立各种学会","d":"培养正当兴趣。蔡元培在师生中提倡道德修养，倡导成立了各种学会，培养学生正当的兴趣。"}]},{"t":"思想自由，兼容并包","items":[{"t":"学术循“思想自由”原则、取“兼容并包”主义，各学问自由讲授","d":"各种学问都可以在大学里被自由地研究和讲授，这样大学才能对学术的发展起到促进作用。"},{"t":"以“学诣”为主罗致各类学术人才，教师队伍流派纷呈"}]},{"t":"教授治校，民主管理","items":[{"t":"《大学令》确立教授治校、民主管理的校务管理原则"},{"t":"把推动学校发展的权利交给教授，由懂学术者管理学校","d":"权利交给教授，让真正懂得学术的人来管理学校。"}]},{"t":"学科与教学体制改革","items":[{"t":"扩充文理，改变“轻学而重术”：工科停办、商科并入法科","d":"的思想。蔡元培认为，大学要偏重于纯粹学理研究的文、理两科。在这一思想指导下，他将北京大学工科停办，商科改为商业学，并入法科；同时扩充文、理两科的专业门类，加强两科的建设。"},{"t":"沟通文理，废科设系，避免文、理科学生相互隔绝","d":"废科设系。蔡元培认为，传统文、理分科的做法不适应近代科学相互联系、相互渗透的发展趋势。为了避免文、理科学生相互隔绝，互不沟通，蔡元培采取了“沟通文理，废科设系”的措施。"},{"t":"改年级制为选科制（学分制），体现尚自然、展个性","d":"的教育思想，同时也是落实他“沟通文理”思想的一个具体措施，为文、理科学生相互选修课程提供了方便。【答案要点】1919年，法国议员阿斯蒂埃提出的关于职业技术教育的《阿斯蒂埃法》被议会通过。"}]}],"id":"紫薯4-31"},{"num":32,"title":"32 阿斯蒂埃法与职业教育","subject":"外教史","blocks":[{"t":"《阿斯蒂埃法》主要内容","items":[{"t":"国家设相关部门管理职业教育，中央由教育部设主管部门"},{"t":"每市镇设一所职业学校，经费由国家与雇主各负一半"},{"t":"18岁以下青年有免费职业教育义务，雇主保证每周4小时"},{"t":"内容包括补充初等教育的普通教育、职业基础学科、劳动学习","d":"教育的普通教育、作为职业基础的各门学科、获得劳动技能的劳动学习这三个部分。"}]},{"t":"对职业教育发展的启示","items":[{"t":"提高重视程度：置于与普通教育同等重要地位，培养职业人才"},{"t":"完善专门管理与立法保障：设专门管理机构，健全法律法规"},{"t":"拓宽经费筹措渠道：统筹国家、企业及社会多方力量筹集资金","d":"保障职业教育经费供给。统筹国家、企业及社会多方力量，多渠道筹集资金，推动职业教育持续发展。"},{"t":"注重普通教育与职业教育融合：不忽视普通文化课程教学","d":"业教育的融合。职业教育机构在传授职业技能的同时，不应忽视普通文化课程的教学，以促进学生综合素养的提升。《阿斯蒂埃法》的颁布，使法国的职业技术教育第一次获得了有组织的形式，成为一种由国家管理的事业。该法在法国历史上有“技术教育宪章”之称。"}]},{"t":"历史地位与影响","items":[{"t":"使法国职业技术教育首次获得有组织形式，成国家管理事业"},{"t":"在法国历史上有“技术教育宪章”之称"}]}],"id":"紫薯4-32"},{"num":33,"title":"33 教师职业与教育家精神","subject":"教原","blocks":[{"t":"教师职业的社会作用","items":[{"t":"文化传承：传播优秀文化，承担传承、创新、发展文明使命","d":"作用：教师是人类优秀文化的传播者，承担着传承、创新和发展人类文明的使命。"},{"t":"人才培养：落实立德树人根本任务，培养各类合格人才","d":"作用：教师作为育人主体，落实立德树人的根本任务，通过为社会培养各级各类合格人才，为社会发展提供人才支撑。"},{"t":"社会赋能：推动教育高质量发展，促进教育公平与强国建设","d":"作用：教师推动教育高质量发展，促进教育公平，服务教育强国建设，助力社会进步与中国式现代化。"}]},{"t":"弘扬教育家精神的现实意义","items":[{"t":"助力教育强国建设：引领教师队伍建设，夯实强国根基","d":"教育家精神是新时代教师队伍建设的重要价值引领，能够锻造高素质专业化教师队伍，夯实教育强国建设根基。"},{"t":"落实立德树人：提供价值遵循，以德立身、以德施教","d":"的根本任务，通过为社会培养各级各类合格人才，为社会发展提供人才支撑。"},{"t":"推动教育高质量发展：更新理念、创新育人方式，破解难题","d":"促进教育公平，服务教育强国建设，助力社会进步与中国式现代化。"}]},{"t":"践行教育家精神：理想与道德","items":[{"t":"筑牢心有大我、至诚报国的理想信念，立足岗位履职","d":"至诚报国的理想信念。坚守教育初心，心怀家国使命，把教书育人事业融入教育强国建设与民族复兴的时代大局，立足岗位履行育人职责。"},{"t":"恪守言为士则、行为世范的道德情操，以身作则、为人师表","d":"行为世范的道德情操。坚持以德立身、以德立学、以德施教，以身作则、为人师表，以高尚的师德师风引领学生健康成长。"}]},{"t":"践行教育家精神：智慧·躬耕·仁爱·弘道","items":[{"t":"涵养启智润心、因材施教的育人智慧，尊重个体差异","d":"因材施教的育人智慧。尊重学生身心发展规律与个体差异，深耕课堂教学，促进学生全面发展，切实提升育人质量。"},{"t":"秉持勤学笃行、求是创新的躬耕态度，破解教学难题","d":"求是创新的躬耕态度。坚持勤学钻研、求真务实，主动顺应科技革命与教育变革趋势，积极创新教学方法与育人模式，破解教育教学中的现实难题。"},{"t":"厚植乐教爱生、甘于奉献的仁爱之心，做好成长引路人","d":"甘于奉献的仁爱之心。坚守教育情怀，充分尊重、关爱每一位学生，竭诚守护，做好学生成长路上的陪伴者与引路人。"},{"t":"树立胸怀天下、以文化人的弘道追求，夯实文化底色","d":"以文化人的弘道追求。立足时代发展，传承优秀文化、传播先进理念，夯实文化底色，为中国式现代化培养合格的人才。【答案要点】（1）教师运用的行为矫正技术：。"}]}],"id":"紫薯4-33"},{"num":34,"title":"34 行为矫正技术与强化策略","subject":"教心","blocks":[{"t":"教师运用的行为矫正技术","items":[{"t":"正强化：当场肯定并公开表扬守纪学生，提高行为概率","d":"教师对自觉维持纪律并提醒他人遵守课堂规范的学生当场予以肯定并在家校群公开表扬。这一做法属于正强化，即通过提供愉快刺激，提高良好行为的发生概率。"},{"t":"负惩罚：取消违规学生当日课外活动资格，降低行为概率","d":"对于出现违规行为的学生，教师取消其当日参与课外活动的资格。这是通过消除愉快刺激以降低不当行为发生的概率，属于负惩罚。"},{"t":"代币制：小红花即代币，积分前五名可兑换小礼品","d":"教师通过观察学生的课堂表现，给予专注听讲、遵守纪律的学生小红花作为积分奖励，小红花就是一种代币；每周累计积分前五名的学生可兑换小礼品。该技术通过代币及其交换系统对个体行为进行强化。"}]},{"t":"强化效果减弱的原因","items":[{"t":"强化物饱和：长期积分兑换礼品，学生对奖励失去兴趣","d":"教师长期使用“积分兑换礼品”这一奖励方式，使得学生逐渐对礼品这一强化物失去兴趣，强化物的强化价值随之下降，导致对课堂行为的干预效果逐渐减弱。b.连续强化的局限性。教师采用连续强化，即学生每出现一次良好行为，教师便给予奖励。在连续强化作用下，强化效应容易衰减，不利于学生课堂良好行为的长期维持。c.过度依赖外部动机。学生课堂良好行为主要依赖外部物质奖励，学生自身缺乏内在动机支持，因此该行为的稳定性和持续性不强。"},{"t":"连续强化的局限：每次良好行为均奖励，强化效应易衰减","d":"性。教师采用连续强化，即学生每出现一次良好行为，教师便给予奖励。在连续强化作用下，强化效应容易衰减，不利于学生课堂良好行为的长期维持。c.过度依赖外部动机。学生课堂良好行为主要依赖外部物质奖励，学生自身缺乏内在动机支持，因此该行为的稳定性和持续性不强。"},{"t":"过度依赖外部动机：缺乏内在动机支持，行为稳定性差","d":"学生课堂良好行为主要依赖外部物质奖励，学生自身缺乏内在动机支持，因此该行为的稳定性和持续性不强。"}]},{"t":"相应的改进策略","items":[{"t":"丰富奖励形式：增加口头肯定、公开表彰与个性化奖励","d":"除“积分兑换礼品”的物质奖励之外，增加口头肯定、公开表彰等非物质奖励，同时根据学生特点设置个性化奖励，改善单一物质奖励造成的强化效果下降问题。b.调整强化程序。改变材料中学生每次表现良好，教师就发放小红花的连续强化模式，引入变比强化或变时强化，以此增强学生课堂良好行为的持久性与抗消退能力。c.激发学生的内在动机。教师要引导学生理解良好课堂行为的内在价值，逐步实现从外部强化到自我激励的转变。【答案要点】（1）作业的作用：。"},{"t":"调整强化程序：以变比强化或变时强化取代连续强化","d":"改变材料中学生每次表现良好，教师就发放小红花的连续强化模式，引入变比强化或变时强化，以此增强学生课堂良好行为的持久性与抗消退能力。c.激发学生的内在动机。教师要引导学生理解良好课堂行为的内在价值，逐步实现从外部强化到自我激励的转变。【答案要点】（1）作业的作用：。"},{"t":"激发内在动机：理解良好行为的内在价值，转向自我激励"}]}],"id":"紫薯4-34"},{"num":35,"title":"35 作业的作用与变革趋势","subject":"教原","blocks":[{"t":"作业的作用","items":[{"t":"对学生：巩固课堂所学，深化知识理解，掌握技能技巧","d":"提出三点要求：一是抱定宗旨，二是砥砺德行，三是敬爱师长。"},{"t":"对教师：了解学生知识技能不足，提供针对性指导建议","d":"而言，通过布置和批改作业，教师可以及时了解和发现学生在知识或技能方面存在的不足；同时还能根据学生的作业完成情况，为学生提供针对性的学习指导与改进建议。"}]},{"t":"教师布置作业的要求","items":[{"t":"控制作业总量，减轻学生负担，避免作业量过大","d":"减轻学生负担。教师应合理控制作业数量，避免作业量过大。案例中，学校规定各科所留作业量都不许超过一页B5纸，体现了对作业总量的严格控制。"},{"t":"精选作业内容，提高作业质量，避免机械重复","d":"提高作业质量。教师应从大量习题中筛选出典型、精要的题目，避免机械重复。案例中，学校为教师挑选多本练习册，要求教师去粗取精、精简习题，体现了对作业质量的重视。"},{"t":"设计分层作业：分必做、选做、自选题和错题纠正四部分","d":"满足不同学生需求。作业应体现层次性与差异性，适配不同学生的学业水平。案例中，学校将作业分为必做题、选做题、自选题和错题纠正四个部分，体现了分层设计的要求。"},{"t":"丰富作业类型：布置体育、劳动与社会实践作业","d":"促进学生全面发展。作业形式应多样化，不应局限于书面学科作业。案例中，学校布置体育作业、劳动作业和社会实践作业，体现了作业类型的创新与拓展。"}]},{"t":"中小学作业变革的主要趋势","items":[{"t":"目标定位：从知识本位转向素养导向，对标核心素养","d":"方面，从知识本位转向素养导向。在新课标的要求下，作业设计应直接对标学科核心素养，不能仅关注静态的知识掌握，还应当兼顾学生动态成长，关注作业中内嵌的正确价值观、必备品格和关键能力的培养。"},{"t":"任务设计：从碎片化习题转向整体性、综合性作业","d":"方面，从碎片化习题转向整体性、综合性作业。作业应突破单一学科的局限，改变零散机械刷题的模式，注重综合性、实践性，提倡跨学科作业、劳动作业、体育作业、社会实践作业等类型，促进学生综合能力发展。"},{"t":"难度设计：从同质化转向个性化，分层、弹性、可选","d":"方面，从同质化转向个性化。教师要摒弃“一刀切”的作业模式，尊重学生的个体差异，推行分层、弹性、可选的作业设计，适配不同学生的学习水平，调动学生学习的主动性。【答案要点】（1）加涅根据学习的繁简水平不同，将学习分为信号学习、刺激一反应学习、连锁学习、言语联想学习、辨别学习、概念学习、规则（原理）的学习、解决问题的学习。同时，他指出每类学习都以前一层级的学习为基础。案例中，小亮虽然能够识别见过的图形，但当图形的颜色、大小、方向发生变化时就会产生困惑。他在学习中主要存在如下问题：。"}]}],"id":"紫薯4-35"},{"num":36,"title":"36 加涅学习层次与图形概念","subject":"教心","blocks":[{"t":"加涅的学习层次分类","items":[{"t":"学习分八类：信号、刺激—反应、连锁、言语联想、辨别、概念、规则、解决问题","d":"学习、辨别学习、概念学习、规则（原理）的学习、解决问题的学习。同时，他指出每类学习都以前一层级的学习为基础。案例中，小亮虽然能够识别见过的图形，但当图形的颜色、大小、方向发生变化时就会产生困惑。他在学习中主要存在如下问题：。"},{"t":"每类学习都以前一层级的学习为基础，逐级递进","d":"层级的学习为基础。案例中，小亮虽然能够识别见过的图形，但当图形的颜色、大小、方向发生变化时就会产生困惑。他在学习中主要存在如下问题：。"}]},{"t":"学生学习中存在的问题","items":[{"t":"辨别学习未达成：无法区分本质与非本质属性，受知觉干扰"},{"t":"概念学习未达成：仅机械记忆图形名称与定义，未掌握概念"},{"t":"未能迁移应用：只能识别典型例子，无法迁移到新情境"}]},{"t":"促进概念学习的教学策略","items":[{"t":"加强变式教学：提供颜色、大小、角度不同的图形卡","d":"教师提供颜色、大小、摆放角度各不相同的三角形和正方形图卡，引导学生观察这些图形的共同特征，从而掌握图形的本质属性。"},{"t":"引导比较与归类：按边数分类，强化名称与结构属性联系"},{"t":"鼓励表达判断依据：说出“因为有三条边”，转隐性为显性"},{"t":"设计动手操作：拼摆、旋转、绘制图形，促进概念迁移","d":"活动。教师组织学生动手拼摆、旋转图形或绘制图形，借助实际操作加深概念理解，促进概念迁移。对概念教学的启示：。"}]},{"t":"对概念教学的启示","items":[{"t":"概念掌握非一蹴而就，需评估任务难度与学习水平，分层递进","d":"开展引导。教师应当对学习任务的难度及学生的学习水平进行评估，实施分层有效的教学。"},{"t":"关注实际理解水平，勿被表面“会了”迷惑，引导深层思维"}]}],"id":"紫薯4-36"}]},{"id":"紫薯5","name":"紫薯5","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 宋代科举制度的变化","subject":"中教史","blocks":[{"t":"科举制度概况","items":[{"t":"以考试为主、举荐为辅，产生于隋、发展于唐，延续1300年","d":"举荐为辅的人才选拔制度，它产生于隋朝，发展于唐朝，延续了1300年，是我国封建社会中持续时间最长、影响范围最广的选士制度。科举制度的特点是个人自愿报名，集中考试，以文艺才能为标准，限量择优录取。相较于唐制，宋朝科举制度的变化和发展，主要表现在以下方面：。"},{"t":"特点：个人自愿报名，集中考试，以文艺才能为标准，择优录取","d":"集中考试，以文艺才能为标准，限量择优录取。相较于唐制，宋朝科举制度的变化和发展，主要表现在以下方面：。"}]},{"t":"扩大科举名额","items":[{"t":"唐进士科每榜录取人数少，宋增设特奏名，录取规模大幅扩大","d":"在扩张录取名额的同时，宋朝还提高科举及第后的地位和待遇。"},{"t":"扩张录取名额的同时，提高科举及第后的地位和待遇"}]},{"t":"确定“三年一贡举”","items":[{"t":"宋英宗治平三年正式确定科举考试时间为“三年一贡举”"},{"t":"三年一科举成为定制，延续至清末科举制度被废除"}]},{"t":"殿试成为定制","items":[{"t":"殿试始于唐武则天，宋太祖讲武殿亲自主持，遂为常制","d":"从此形成三级科举考试制度：州试（由地方官主持）一省试（由尚书省礼部主持）一殿试（由皇帝主持）。"},{"t":"形成州试（地方官）—省试（尚书省礼部）—殿试三级制度"}]},{"t":"建立新制，防止科场作弊","items":[{"t":"为维护考试客观性与公平性，防止作弊而建立新制度"},{"t":"内容有锁院制、别头试、糊名法、誊录制等","d":"采用糊名法、创立誉录制等。【答案要点】裴斯泰洛齐是享有世界盛誉的瑞士教育家，也是世界教育史上第一个明确提出“教育心理学化”口号的教育家。该思想贯穿于他全部的教育探索与教学实践之中，深刻推动了近代教育的科学化发展。"}]}],"id":"紫薯5-31"},{"num":32,"title":"32 裴斯泰洛齐教育心理学化","subject":"外教史","blocks":[{"t":"教育心理学化的含义","items":[{"t":"人的心理活动存在固有基本规律，教育要找到这种规律","d":"把教育提高到科学的水平，将教育科学建立在人的心理活动规律的基础上。"},{"t":"把教育提高到科学水平，建立在心理活动规律的基础上","d":"的水平，将教育科学建立在人的心理活动规律的基础上。"}]},{"t":"教育心理学化的基本要求","items":[{"t":"教育目的心理学化：置于儿童本性发展的自然法则基础上"},{"t":"教育内容心理学化：选择编制适合儿童学习心理规律"},{"t":"教学原则方法心理学化：遵循直观性与循序渐进原则"},{"t":"让儿童成为自己的教育者：调动能动性，使其懂得自我教育"}]},{"t":"教育心理学化的实践体现","items":[{"t":"系统落地于初等教育实践，形成要素教育理论与各科教学法","d":"形成了要素教育理论与初等学校各科教学法，也因此被誉为“现代初等学校各科教学法的奠基人”。"},{"t":"被誉为“现代初等学校各科教学法的奠基人”"},{"t":"要素教育：教育内容心理学化的载体，从最基本要素开始","d":"理论与初等学校各科教学法，也因此被誉为“现代初等学校各科教学法的奠基人”。"},{"t":"各科教学法：从直观性、循序渐进出发构建学科教学法","d":"也因此被誉为“现代初等学校各科教学法的奠基人”。"},{"t":"教育与生产劳动相结合：斯坦兹孤儿院学习为主、手工劳动为辅","d":"儿童教育主体性的实践体现。在斯坦兹孤儿院的教育实践中，裴斯泰洛齐明确将学习与手工劳动相联系，以安排学习为主、参加手工劳动为辅，让儿童在动手实践中主动获得知识与谋生能力。这一模式尊重儿童的能动性，让儿童在真实活动中实现主动发展，是“要让儿童成为他自己的教育者”这一心理学化要求的现实体现。"}]}],"id":"紫薯5-32"},{"num":33,"title":"33 人口变化与教育资源配置","subject":"教原","blocks":[{"t":"人口变化对教育的影响","items":[{"t":"人口数量制约教育发展的规模与速度，学龄人口减少致规模缩减","d":"发展的规模与速度。材料中的少子化趋势导致基础教育学龄人口规模缩减，直接改变了基础教育的办学规模与发展节奏。"},{"t":"人口质量影响教育发展的质量，推动育人质量更高标准","d":"国民整体素质的不断提升，推动了社会对人才培养要求的持续提高，进而对基础教育育人质量提出了更高标准。"},{"t":"人口结构制约教育的结构与布局，推动层级与区域调整","d":"材料中的人口老龄化、区域人口增减分化趋势，推动教育层级结构与区域教育布局的调整优化。"}]},{"t":"教育高质量发展的契机","items":[{"t":"少子化提升生均教育资源占有水平，更易推行小班化教学","d":"教师能够兼顾学生的个体差异、开展针对性教学，为教育由规模扩张转向质量提升创造了现实条件。"},{"t":"老龄化催生多元学习需求，推动终身教育体系完善","d":"推动终身教育体系进一步完善。老年群体对继续教育、文化生活的需求增长，带动老年大学、社区教育发展，丰富教育高质量发展的内涵。"},{"t":"区域人口增减分化推动教育资源统筹调整，优化教育布局","d":"共享优质教育资源，为缩小城乡教育差距、推进教育优质均衡发展提供改革动力。"}]},{"t":"优化教育资源配置的策略","items":[{"t":"推进托幼一体化建设，化解幼儿园招生困难","d":"受学前教育学龄人口减少的影响，部分幼儿园面临招生困难，政府可通过托幼一体化建设化解办学困境。"},{"t":"做好长期教育资源配置规划，改造利用乡村闲置校舍","d":"在少子化与城镇化背景下，乡村学校生源进一步缩减。对此，政府可以优化乡村基础教育资源布局，充分利用乡村闲置校舍，将其改造为乡村社区文化中心、老年活动场所或青少年宫等，实现教育资源功能转型。"},{"t":"促进学段、区域之间教育资源共享，避免重复建设","d":"区域之间的教育资源共享。各地教育主管部门推动跨学段、跨区域教育资源共建共享，提升教育资源的统筹使用效率，避免重复建设与资源浪费。"},{"t":"推动教师校长交流轮岗，均衡配置城乡教师资源","d":"为化解教师资源供需矛盾，各地教育主管部门通过教师校长交流轮岗，统筹推进城乡教师在数量、质量、结构上的均衡配置。【答案要点】（1）材料中四类主要归因因素所具有的特征：。"}]}],"id":"紫薯5-33"},{"num":34,"title":"34 韦纳归因理论与积极归因","subject":"教心","blocks":[{"t":"四类归因因素的特征","items":[{"t":"能力：内部的、稳定的、不可控","d":"激动状态，产生焦急、渴求等心理体验，并最终引发一定的学习行为。"},{"t":"努力：内部的、不稳定的、可控","d":"激动状态，产生焦急、渴求等心理体验，并最终引发一定的学习行为。"},{"t":"任务难度：外部的、稳定的、不可控","d":"会通过影响成功概率与诱因值间接作用于动机，并非成就动机的核心构成因素。所以，本题答案选D。【答案】A【解析】编码与组织策略侧重整合知识间的内在联系，可通过归类、列提纲、构建框架等方式形成清晰的知识结构，与题干梳理知识脉络、列写提纲、理清知识逻辑关系的做法一致。B选项，精细加工策略侧重为信息赋予意义、深化理解；C选项，复述策略侧重重复识记；D选项，监控策略侧重监察认知过程。B、C、D选项均不符合题意。所以，本题答案选A。【答案】C【解析】尊重的需要是个体希望获得他人认可、赞许，维护个人自尊心与价值感的需要。题干中，追求赏识认可、维护自身价值感的诉求与之相符。A选项，生理需要是维持生存的基础需求；。"},{"t":"运气：外部的、不稳定的、不可控"}]},{"t":"不同归因产生的效果","items":[{"t":"归因于能力：消极或羞耻，自我效能感低，预期再次失败、逃避","d":"学生可能产生的情绪反应是消极或羞耻，自我效能感低下；对未来的期待是预判自己会再次遭遇失败；对未来行为的影响是逃避类似情境。"},{"t":"归因于努力：消极或愧疚，相信努力可改善，愿付出更多努力","d":"学生可能产生的情绪反应是消极或愧疚；对未来的期待是相信通过努力能够改善结果；对未来行为的影响是在类似情境中付出更多的努力。"},{"t":"归因于任务难度：挫败感，预判再次失败，逃避类似情境","d":"学生可能产生的情绪反应是消极、生气、挫败感；对未来的期待是预判自己再次遇到同类任务仍会失败；对未来行为的影响是逃避类似情境。"},{"t":"归因于运气：沮丧或懊恼，难以形成成功预期，抱有侥幸心理","d":"学生可能产生的情绪反应是沮丧或懊恼；对未来的期待是难以形成稳定的成功预期；对未来行为的影响是容易抱有侥幸心理，不会主动付出更多努力。"}]},{"t":"促进学生积极归因的方式","items":[{"t":"引导积极归因：多归因于努力，减少归因于能力、难度、运气","d":"这类可控因素，将失败归因于策略不当、努力不足等可调节因素，尽量避免将失败归因于能力不足，从而帮助学生保持积极的学习心态，避免习得性无助。"},{"t":"引导建立积极自我概念：任务难度与能力相适应，提升效能感"},{"t":"通过归因训练形成辩证归因模式，避
