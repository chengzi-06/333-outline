色社会主义思想铸魂育人，坚持德育为先，坚守正确政治方向，落实为党育人、为国育才的使命。③。"},{"t":"顺应民族复兴需求：需要大量德才兼备、堪当重任的时代新人","d":"强国建设、民族复兴需要大量德才兼备、堪担重任的时代新人，立德树人是培育栋梁之材的核心抓手。（2）对“德育贯穿于智育、体育、美育、劳动教育全过程”这句话的理解：这句话的核心内涵是德育并非独立的育人环节，应当有机融入智育、体育、美育、劳动教育全过程，坚持“五育”并举，实现全程、全方位铸魂育人。①智育为德育提供认知基础，二者相辅相成。教师在教学中深挖学科德育元素，推动思政课程与课程思政协同发力；教师将德育融入课堂各个环节，实现知识传授与价值引领相统一，引导学生在实践探究中提升道德实践能力。②体育兼具强身与塑德价值。体育活动与赛事训练既能够帮助学生掌握运动技能、养成体育锻炼习惯，也能锤炼学生的意志品。"}]},{"t":"德育贯穿五育全过程","items":[{"t":"核心内涵：德育并非独立的育人环节，应有机融入五育全过程","d":"是德育并非独立的育人环节，应当有机融入智育、体育、美育、劳动教育全过程，坚持“五育”并举，实现全程、全方位铸魂育人。①。"},{"t":"智育为德育提供认知基础，二者相辅相成","d":"础，二者相辅相成。教师在教学中深挖学科德育元素，推动思政课程与课程思政协同发力；教师将德育融入课堂各个环节，实现知识传授与价值引领相统一，引导学生在实践探究中提升道德实践能力。②。"},{"t":"体育兼具强身与塑德价值，锤炼意志品质与拼搏精神","d":"值。体育活动与赛事训练既能够帮助学生掌握运动技能、养成体育锻炼习惯，也能锤炼学生的意志品质与拼搏精神。③美育以美润德。开设美育课程，提升学生的审美与艺术修养，陶冶学生的道德情操。④劳动教育以劳树德。学校通过开设劳动课程、组织实践活动，引导学生树立正确的劳动观，掌握一定的劳动技能，涵养道德品质与社会责任感。（3）新时代教师践行立德树人使命，当好“大先生”的路径：①教师要有大情怀。教师需以理想信念为根基，兼具家国情怀与教育情怀，将个人教育理想融入民族复兴事业，扛起培育时代新人的重任。②教师要有大学问。扎实精深的专业学识是教书育人的基础。教师既要精通本学科知识，也要拓宽综合视野，主动适应数字化教育发。"},{"t":"美育以美润德，提升审美与艺术修养，陶冶道德情操","d":"开设美育课程，提升学生的审美与艺术修养，陶冶学生的道德情操。"},{"t":"劳动教育以劳树德，树立正确劳动观，涵养社会责任感","d":"学校通过开设劳动课程、组织实践活动，引导学生树立正确的劳动观，掌握一定的劳动技能，涵养道德品质与社会责任感。"}]},{"t":"当好‘大先生’的路径","items":[{"t":"教师要有大情怀：以理想信念为根基，兼具家国情怀与教育情怀","d":"教师需以理想信念为根基，兼具家国情怀与教育情怀，将个人教育理想融入民族复兴事业，扛起培育时代新人的重任。②。"},{"t":"教师要有大学问：扎实精深的专业学识是教书育人的基础","d":"扎实精深的专业学识是教书育人的基础。教师既要精通本学科知识，也要拓宽综合视野，主动适应数字化教育发展需求。③。"},{"t":"教师要有大格局：立足时代大局，拓宽育人视野，怀揣仁爱之心","d":"教师应立足时代大局，拓宽育人视野，怀揣仁爱之心对待每一位学生；同时，教师还应以言传身教的方式潜移默化地影响学生，引导学生树立社会主义核心价值观，成长为担当民族复兴大任的时代新人。34.。"}]}],"id":"紫薯2-33"},{"num":34,"title":"34 功能固着与问题解决教学策略","subject":"教心","blocks":[{"t":"功能固着","items":[{"t":"功能固着指个体熟知物品惯常用途后，很难想到它的其他用途","d":"上述实验中，被试只意识到钳子剪断铁丝的常用功能，未能结合问题情境意识到钳子还可以充当重物使用，这正是功能固着阻碍问题解决的体现。"},{"t":"实验中被试只意识到钳子剪铁丝的常用功能，未想到可当重物使用"}]},{"t":"培养问题解决能力的策略","items":[{"t":"充分利用已有经验，形成知识结构体系","d":"成知识结构体系。系统化、结构化的知识储备是问题解决的认知基础。教师要帮助学生梳理知识逻辑，强化知识的可迁移性，引导学生灵活调用已有经验，突破思维局限，克服功能固着。②。"},{"t":"分析问题的构成，把握问题解决的规律","d":"问题解决规律。教师要引导学生拆解问题的条件与目标，掌握问题解决的通用逻辑与步骤。如材料中的“两绳问题”，学生需先明确核心矛盾，挖掘可用工具的多重属性，再推导解法，逐步形成分析问题的稳定思路。③。"},{"t":"开展研究性学习，发挥学生的主动性","d":"学生的主动性。教师可设计类似“两绳问题”的探究性任务，创设真实的问题情境，引导学生自主尝试、探寻解法，在独立思考与实践操作中积累问题解决经验。④。"},{"t":"教授问题解决策略，灵活变换问题","d":"活变换问题。教师向学生传授算法式、启发式等问题解决策略，通过一题多解、一物多用、情境变式等训练拓宽学生思路，打破思维定势，提升学生灵活应对不同问题的能力。⑤。"},{"t":"允许学生大胆猜想，鼓励开展实践验证","d":"励开展实践验证。教师应尊重学生的非常规思路，鼓励学生跳出事物的惯有属性展开猜想，如材料中部分被试想到钳子可充当重物的非常规用法；同时，教师还应引导学生通过动手实践验证想法，在试错与探究中提升其问题解决能力。35.。"}]}],"id":"紫薯2-34"},{"num":35,"title":"35 家校合作问题与协同育人","subject":"教原","blocks":[{"t":"家校合作模式的问题","items":[{"t":"沟通单向化：以学校单向输出要求为主，家长处于被动接收地位","d":"1.0版家校合作模式以学校单向输出要求为主，家长处于被动接收地位，双方仅存在形式层面的联系，未形成真正的双向互动与共育关系。②。"},{"t":"地位不对等：话语权仍由学校掌握，缺乏平等的对话机制","d":"2.0版家校合作模式虽优化了合作形式、丰富了活动环节，但话语权仍由学校掌握，家校之间缺乏平等的对话机制，家校沟通流于表面，难以形成情感共鸣与育人共识。③。"},{"t":"合作浅层化：停留在事务传达、经验分享层面，未形成长效机制","d":"1.0版和2.0版家校合作模式均停留在事务传达、经验分享层面，尚未构建系统化、长效化的协同育人机制，难以形成稳定的教育合力。（2）家校协同育人的重要意义：①统一育人方向。家庭和学校形成教育共识，避免教育导向相互冲突，为学生品行养成、习惯培育提供连贯、稳定的教育引导，落实教育影响的一致性与连续性原则。②整合育人资源。学校发挥专业教育优势，家庭发挥情感与生活育人优势，二者优势互补，拓展育人的广度与深度。③提升育人实效。学校能够为家长提供专业育人指导，弥补家庭教育的不足；家庭能反馈学生成长细节，助力学校实施因材施教，共同促进学生全面发展。（3）推动家校良性互动的措施：①构建系统化家长成长课程体系。"}]},{"t":"家校协同育人的意义","items":[{"t":"统一育人方向：形成教育共识，避免教育导向相互冲突","d":"家庭和学校形成教育共识，避免教育导向相互冲突，为学生品行养成、习惯培育提供连贯、稳定的教育引导，落实教育影响的一致性与连续性原则。②。"},{"t":"整合育人资源：学校发挥专业教育优势，家庭发挥情感与生活优势","d":"学校发挥专业教育优势，家庭发挥情感与生活育人优势，二者优势互补，拓展育人的广度与深度。③。"},{"t":"提升育人实效：学校提供专业指导，家庭反馈学生成长细节","d":"学校能够为家长提供专业育人指导，弥补家庭教育的不足；家庭能反馈学生成长细节，助力学校实施因材施教，共同促进学生全面发展。（3）推动家校良性互动的措施：①构建系统化家长成长课程体系。学校应开设校本家长课程，统一家校育人理念，帮助家长提升育人能力。②建立平等双向的沟通机制。教师应在入学初期摸排学生与家庭情况，搭建家校对等对话平台，打破学校单向主导的沟通格局。③丰富多元共育实践形式。学校可通过育人主题活动、“家长进课堂”活动等，推动家校资源互通、双向赋能，构建有温度的协同育人关系。36.。"}]},{"t":"推动家校良性互动的措施","items":[{"t":"构建系统化家长成长课程体系，帮助家长提升育人能力","d":"程体系。学校应开设校本家长课程，统一家校育人理念，帮助家长提升育人能力。②。"},{"t":"建立平等双向的沟通机制，打破学校单向主导的沟通格局","d":"制。教师应在入学初期摸排学生与家庭情况，搭建家校对等对话平台，打破学校单向主导的沟通格局。③。"},{"t":"丰富多元共育实践形式，推动家校资源互通、双向赋能","d":"学校可通过育人主题活动、“家长进课堂”活动等，推动家校资源互通、双向赋能，构建有温度的协同育人关系。36.。"}]}],"id":"紫薯2-35"},{"num":36,"title":"36 自我效能感低下的成因与辅导","subject":"教心","blocks":[{"t":"自我效能感低下的成因","items":[{"t":"直接经验的影响：近期多次考试失利，导致自信心下降","d":"直接经验是影响自我效能感最重要的因素。该学生近期多次考试失利，受负面的直接经验影响，怀疑自身学习能力，片面依据考试结果否定自我、忽视自身学习优势，导致自信心下降，自我效能感降低。②。"},{"t":"情绪唤起的影响：一提到考试就紧张、沮丧，降低自我效能感","d":"个体面对任务时的情绪状态会影响自我效能感。该学生一提到考试就浑身不自在，产生紧张、沮丧等消极情绪，由此带来的高度情绪唤起进一步降低其自我效能感。③。"},{"t":"言语说服的影响：持续消极的自我言语暗示，造成自信心受挫","d":"该学生不断自我怀疑，持续进行消极的自我言语暗示，认为自身能力不足，造成自信心受挫，降低其自我效能感。（2）如果我是许老师，我会从提高自我效能感的角度帮助这位学生，主要从以下几个方面进行：①帮助学生建立清晰的自我认知，使其更全面地了解自己。我会引导该学生客观看待自身不足，同时也要看到自己的长处，避免妄自菲薄。②为学生创设获得成功经验的机会。针对该学生因多次考试失利导致自信心受挫的情况，我会为其设置分层练习、阶段性小测以及可达成的递进式学习任务，帮助其在日常练习中获得成就感。③开展积极的言语劝说，给予正向鼓励。我会充分相信该学生的发展潜力，通过口头交流、书面反馈等方式给予其客观评价与正向激励。④。"}]},{"t":"提高自我效能感的辅导","items":[{"t":"帮助学生建立清晰的自我认知，全面了解自己，避免妄自菲薄","d":"我认知，使其更全面地了解自己。我会引导该学生客观看待自身不足，同时也要看到自己的长处，避免妄自菲薄。②。"},{"t":"为学生创设获得成功经验的机会，设置递进式学习任务","d":"验的机会。针对该学生因多次考试失利导致自信心受挫的情况，我会为其设置分层练习、阶段性小测以及可达成的递进式学习任务，帮助其在日常练习中获得成就感。③。"},{"t":"开展积极的言语劝说，给予正向鼓励与客观评价","d":"给予正向鼓励。我会充分相信该学生的发展潜力，通过口头交流、书面反馈等方式给予其客观评价与正向激励。④提供针对性学业指导。我会了解该学生的学习困境，有针对性地帮助其查漏补缺，补齐学习短板。"},{"t":"提供针对性学业指导，帮助其查漏补缺，补齐学习短板","d":"我会了解该学生的学习困境，有针对性地帮助其查漏补缺，补齐学习短板。"}]}],"id":"紫薯2-36"}]},{"id":"紫薯3","name":"紫薯3","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 壬子癸丑学制的进步","subject":"中教史","blocks":[{"t":"两种学制概况","items":[{"t":"癸卯学制：首个全国性法定学制系统，三段七级，总年限20~21年","d":"是中国近代由中央政府颁布并首次得到施行的全国性法定学制系统。该学制参照日本学制，将主系列划分为三段七级。从小学堂到大学堂，学制总年限为20～21年，其中，初等小学堂5年为强迫教育阶段。此外，该学制还将幼儿教育机构——蒙养院纳入学制系统。“。"},{"t":"壬子癸丑学制：首个资产阶级性质学制，三段四级，17~18年","d":"即“1912—1913年学制”，是中国近代第一个资产阶级性质的学制。垓学制参照日本学制，将主系列划分为三段四级，总年限为17～18年，实施4年义务教育；小学实行男女同校，中学设置女子中学；以“小学一大学”教育为骨干，兼重师范教育和实业教育。与“癸卯学制”相比，“壬子癸丑学制”的进步之处体现在以下几个方面：（1）性质：实现了封建性质向资产阶级性质学制的转变。“壬子癸丑学制”是中国近代第一个资产阶级性质的学制，该学制取消对毕业生奖励科举出身，废止清末高等教育中的保人制度，大学不设经科，有利于消除教育中的封建等级性、科举名位思想和复古气息。（2）学校系统：对学校体系做了相对完整的设计。从学制的结。"}]},{"t":"性质与学校系统","items":[{"t":"性质：实现由封建性质向资产阶级性质学制的转变","d":"的学制。垓学制参照日本学制，将主系列划分为三段四级，总年限为17～18年，实施4年义务教育；小学实行男女同校，中学设置女子中学；以“小学一大学”教育为骨干，兼重师范教育和实业教育。与“癸卯学制”相比，“壬子癸丑学制”的进步之处体现在以下几个方面：（1）性质：实现了封建性质向资产阶级性质学制的转变。“壬子癸丑学制”是中国近代第一个资产阶级性质的学制，该学制取消对毕业生奖励科举出身，废止清末高等教育中的保人制度，大学不设经科，有利于消除教育中的封建等级性、科举名位思想和复古气息。（2）。"},{"t":"取消奖励科举出身，废止保人制度，大学不设经科","d":"有利于消除教育中的封建等级性、科举名位思想和复古气息。"},{"t":"学校系统：基础教育、高等教育、实业教育、师范教育均有雏形","d":"对学校体系做了相对完整的设计。从学制的结构及内容来看，“壬子癸丑学制”的基础教育、高等教育、实业教育、师范教育等教育类别都有了雏形，且小学、中学、大学各个阶段也有了清晰的划分。中学废除文、实分科，取消高等学堂，只设大学预科。（3）学制年限：缩短了3年，易于普及教育，使普通教育向平民化发展。与“癸卯学制”相比，“壬子癸丑学制”的教育周期缩短了3年，这加快了人才培养的速度，有利于普通教育的普及和平民化发展。（4）课程内容和教学方法：突出实用性与科学性。在课程内容方面，“壬子癸丑学制”取消了“忠君”“尊孔”课程，不再局限于传统的经典著作，还增加了自然科学课程和生产技能的训练，知识体系进一步开放化和。"},{"t":"中学废文、实分科，取消高等学堂，只设大学预科"}]},{"t":"学制年限的缩短","items":[{"t":"与癸卯学制相比缩短了3年，加快人才培养速度"},{"t":"有利于普通教育的普及和平民化发展","d":"和平民化发展。（4）课程内容和教学方法：突出实用性与科学性。在课程内容方面，“壬子癸丑学制”取消了“忠君”“尊孔”课程，不再局限于传统的经典著作，还增加了自然科学课程和生产技能的训练，知识体系进一步开放化和实用化。在教学方法方面，“壬子癸丑学制”反对体罚，改进教学方法，使教育更加联系学生实际，适合学生身心发展。（5）教育对象：女子享有与男子平等的法定教育权。“壬子癸丑学制”改变先前学制排斥女子教育的传统，提倡不分男女儿童，都应接受义务教育；初等教育阶段可以男女同校；设立专门的女子中学、女子师范学校等。这突破了封建礼教对女性的限制，体现了资本主义文化的男女平等观点。32.。"}]},{"t":"课程内容和教学方法","items":[{"t":"取消‘忠君’‘尊孔’课程，不再局限于传统经典著作"},{"t":"增加自然科学课程和生产技能训练，知识体系开放化、实用化","d":"在教学方法方面，“壬子癸丑学制”反对体罚，改进教学方法，使教育更加联系学生实际，适合学生身心发展。"},{"t":"反对体罚，改进教学方法，使教育更加联系学生实际","d":"法，使教育更加联系学生实际，适合学生身心发展。（5）教育对象：女子享有与男子平等的法定教育权。“壬子癸丑学制”改变先前学制排斥女子教育的传统，提倡不分男女儿童，都应接受义务教育；初等教育阶段可以男女同校；设立专门的女子中学、女子师范学校等。这突破了封建礼教对女性的限制，体现了资本主义文化的男女平等观点。32.。"}]},{"t":"教育对象","items":[{"t":"女子享有与男子平等的法定教育权","d":"法定教育权。“壬子癸丑学制”改变先前学制排斥女子教育的传统，提倡不分男女儿童，都应接受义务教育；初等教育阶段可以男女同校；设立专门的女子中学、女子师范学校等。这突破了封建礼教对女性的限制，体现了资本主义文化的男女平等观点。32.。"},{"t":"初等教育阶段男女同校，设立女子中学、女子师范学校","d":"等。这突破了封建礼教对女性的限制，体现了资本主义文化的男女平等观点。【答案要点】马克思、恩格斯所讲的人的发展，实际上是指在人的劳动能力全面发展的基础上，包括人的社会关系、体力、智力、道德精神面貌、意志、情感、个性、审美意识和实践能力等各方面的和谐统一发展。"}]}],"id":"紫薯3-31"},{"num":32,"title":"32 马克思人的全面发展学说","subject":"外教史","blocks":[{"t":"人的全面发展的内涵","items":[{"t":"以人的劳动能力全面发展为基础，各方面和谐统一发展"},{"t":"包括社会关系、体力、智力、道德精神面貌、意志、情感、个性等","d":"意志、情感、个性、审美意识和实践能力等各方面的和谐统一发展。"}]},{"t":"社会条件与根本途径","items":[{"t":"人的发展由整个社会的发展决定，大工业社会提供物质基础"},{"t":"教育与生产劳动相结合是实现人的全面发展的根本途径","d":"教育与生产劳动相结合，不是机械的教育与劳动的相加，它的内涵十分丰富，包括理论与实践的结合、学与用的结合、知识分子与劳动人民的结合等。（2）马克思、恩格斯关于人的全面发展学说在教育学上的意义。①确立了科学的人的发展观。马克思、恩格斯关于人的全面发展学说把人的发展历史归结为生产方式发展的历史，确定了“人怎样表现自己的生活，他们自己也就怎样”的科学发展观，从而在人的发展问题上提供了一种全新的方法论的指导。②指明了人的全面发展的历史必然性。马克思、恩格斯关于人的全面发展学说所揭示的人的发展方向，是一种建立在生产发展普遍规律基础之上的自然历史过程。这种发展方向不仅符合人类的利益，而且符合历史发展的客观。"}]},{"t":"在教育学上的意义","items":[{"t":"确立了科学的人的发展观","d":"观。马克思、恩格斯关于人的全面发展学说把人的发展历史归结为生产方式发展的历史，确定了“人怎样表现自己的生活，他们自己也就怎样”的科学发展观，从而在人的发展问题上提供了一种全新的方法论的指导。②。"},{"t":"指明了人的全面发展的历史必然性","d":"历史必然性。马克思、恩格斯关于人的全面发展学说所揭示的人的发展方向，是一种建立在生产发展普遍规律基础之上的自然历史过程。这种发展方向不仅符合人类的利益，而且符合历史发展的客观规律，它的合理性与它的必然性是一致的。③。"},{"t":"为我国教育目的的制定奠定了理论基础","d":"奠定了理论基础。马克思、恩格斯关于人的全面发展学说是在继承和发展历史上相关理论基础上的新的探索和科学概括，是我们选择社会主义教育目的价值取向的理论基础。（3）马克思、恩格斯关于人的全面发展学说的现实意义。①社会主义制度的建立为人的全面发展拓宽了道路。从总体上看，社会主义属于“第三种形态”的共产主义社会的初级阶段，我国的情况正是这样，既然资本主义的基本矛盾在社会主义阶段被克服了，那么，社会主义制度的建立便为实现人的自由而全面发展的理想目的拓宽了道路，开始了新的进程。②要依据我国的特点尽可能地促进人的全面发展。要依据我国的现实条件，积极采取各种切实举措，尽可能地全面提高人的素质，促进人的个性全面发。"}]},{"t":"现实意义","items":[{"t":"社会主义制度的建立为人的全面发展拓宽了道路","d":"人的全面发展拓宽了道路。从总体上看，社会主义属于“第三种形态”的共产主义社会的初级阶段，我国的情况正是这样，既然资本主义的基本矛盾在社会主义阶段被克服了，那么，社会主义制度的建立便为实现人的自由而全面发展的理想目的拓宽了道路，开始了新的进程。②。"},{"t":"要依据我国的特点尽可能地促进人的全面发展","d":"能地促进人的全面发展。要依据我国的现实条件，积极采取各种切实举措，尽可能地全面提高人的素质，促进人的个性全面发展，并以此作为现阶段我国教育目的的基本价值取向。③。"},{"t":"人的全面发展是构建社会主义和谐社会的基本内涵","d":"会主义和谐社会的基本内涵。没有人的自由而全面发展，就不可能有社会的全面进步。人的自由而全面发展与坚持科学发展观、建设社会主义和谐社会是相互依存、相互促进、相得益彰的。④。"},{"t":"追求人的全面发展与实现人的自由发展必须和谐统一","d":"现人的自由发展必须和谐统一。我国当前的教育改革与发展应该在引导学生全面发展的同时，关注学生个性的自由发展，着重培养学生的创新精神、批判意识与独立个性。不仅实现学生在知识、智力、技能发展上达到全面发展的要求，而且使他们在精神上不断追求自由与解放，提升实践智慧与行动能力，并通过精神和个性的自由发展带动和促进更高层次的人的全面发展。"}]}],"id":"紫薯3-32"},{"num":33,"title":"33 杜威内在目的论及其启示","subject":"教原","blocks":[{"t":"杜威的内在目的论","items":[{"t":"教育不能脱离儿童身心发展规律、兴趣与内在需要预设外在目的","d":"的身心发展规律、兴趣与内在需要，强行预设外在、功利的教育目标。教育的根本目的在于立足儿童自身发展、促进其自然生长，这正是杜威内在目的论的核心主张。杜威的内在目的论从全新的角度诠释了教育目的，突出了儿童的主体地位，有利于调动学生学习的积极性和主动性。但该理论片面强调教育的内在目的，否定了外在目的与内在目的的联系，理论过于理想化，现实可行性不足。"},{"t":"教育的根本目的在于立足儿童自身发展、促进其自然生长","d":"足儿童自身发展、促进其自然生长，这正是杜威内在目的论的核心主张。杜威的内在目的论从全新的角度诠释了教育目的，突出了儿童的主体地位，有利于调动学生学习的积极性和主动性。但该理论片面强调教育的内在目的，否定了外在目的与内在目的的联系，理论过于理想化，现实可行性不足。（2）材料借农民开展农事需顺应客观条件的事例，指出教育目的不可由人主观设定。确立教育目的的基本依据包括：①个体的身心发展规律。教育目的应当符合受教育者的身心发展水平、兴趣与内在需要，尊重受教育者的主体地位，这是确立教育目的的内在依据，正如农事生产必须遵循植物生长的客观规律。②社会发展的客观需要。"},{"t":"评价：突出儿童主体地位，但片面强调内在目的，过于理想化","d":"功能：①诊断功能：“苹果树”平台采集学生的体质健康、学业质量、特长发展、课外读书等多维度数据，为学生绘制全息画像，能够精准诊断学生的优势与短板，弥补传统评价过度依赖教师主观经验的不足，为教师因材施教提供科学依据。②导向功能：“苹果树”平台扭转“唯分数论”的评价倾向，引导师生、家长重视学生的综合素质与成长过程。该平台不只将学生学业测试分数作为评价依据，还纳入学生的作业、作品等，引导各方跳出单一分数的局限，充分发挥评价的导向作用，引领学生全面发展。③激励与促进功能：“苹果树”平台关注学生活动过程中的兴趣、态度、习惯，尊重学生的个体特征，顺应学生的生长节律，丰盈学生的生命意义。这种动态化、过程性的评。"}]},{"t":"确立教育目的的基本依据","items":[{"t":"个体的身心发展规律：尊重受教育者的主体地位","d":"教育目的应当符合受教育者的身心发展水平、兴趣与内在需要，尊重受教育者的主体地位，这是确立教育目的的内在依据，正如农事生产必须遵循植物生长的客观规律。②。"},{"t":"社会发展的客观需要：受社会政治、经济、文化条件制约","d":"教育目的受一定社会政治、经济、文化等现实条件的制约，不能脱离社会发展的客观要求，正如农事生产受土壤、气候等外部环境约束。③。"},{"t":"科学的教育理论指引：以马克思主义人的全面发展学说为指导","d":"确立教育目的还应当以科学的教育理论为指导，平衡个体发展与社会发展的现实需求，防止片面侧重某一方面。马克思主义关于人的全面发展学说是我国制定教育目的的重要理论依据。（3）材料中的观点对我国当前教育改革的启示：①在教育理论层面，坚持教育的内在目的与外在目的辩证统一。教育的内在目的与外在目的相辅相成、不可割裂。我国教育目的的制定，既要尊重学生的身心发展规律、兴趣与内在需要，也要契合社会发展的客观需求，实现个体发展与社会发展的协调统一。②在教育实践层面，遵循学生身心发展规律，优化教育教学与课程体系。教育教学要立足学生的兴趣与内在需要，科学选择与组织教育内容。在课程设置上，学校应坚持综合性、均衡性与选。"}]},{"t":"对教育改革的启示","items":[{"t":"理论层面：坚持教育的内在目的与外在目的辩证统一","d":"坚持教育的内在目的与外在目的辩证统一。教育的内在目的与外在目的相辅相成、不可割裂。我国教育目的的制定，既要尊重学生的身心发展规律、兴趣与内在需要，也要契合社会发展的客观需求，实现个体发展与社会发展的协调统一。②在教育。"},{"t":"实践层面：遵循身心发展规律，优化教育教学与课程体系","d":"遵循学生身心发展规律，优化教育教学与课程体系。教育教学要立足学生的兴趣与内在需要，科学选择与组织教育内容。在课程设置上，学校应坚持综合性、均衡性与选择性原则，优化课程结构，既要开设学科课程，也要设置活动课程、综合课程、选修课程等。34.。"}]}],"id":"紫薯3-33"},{"num":34,"title":"34 观察学习理论及教学应用","subject":"教心","blocks":[{"t":"社会（观察）学习理论","items":[{"t":"观察学习是一种间接学习，人类大多数行为通过观察习得","d":"习，人类的大多数行为是通过观察习得的。个体通过观察他人的行为及其后果，可获得榜样行为的符号表征与行为规则，进而指导自身今后的行为。（2）观察学习的基本过程：①注意过程：观察学习的首要阶段，调节观察者对示范活动的探索与知觉，决定着观察者在大量的榜样中选择什么作为观察对象。影响注意过程的因素有榜样行为的特性、榜样的特征、观察者的特点等。②保持过程：观察者所观察的行为在记忆中以符号的形式表征。③复制过程：又称动作再现过程，就是学习者观察后的模仿过程。④动机过程：学习者因表现所观察到的行为而受到激励。这一过程中有三种强化方式，包括直接强化、替代强化和自我强化。（3）根据社会（观察）学习理论，教师在教育。"},{"t":"通过观察他人行为及其后果，获得符号表征与行为规则"}]},{"t":"观察学习的基本过程","items":[{"t":"注意过程：调节对示范活动的探索与知觉","d":"观察学习的首要阶段，调节观察者对示范活动的探索与知觉，决定着观察者在大量的榜样中选择什么作为观察对象。影响注意过程的因素有榜样行为的特性、榜样的特征、观察者的特点等。②。"},{"t":"保持过程：所观察的行为在记忆中以符号形式表征","d":"观察者所观察的行为在记忆中以符号的形式表征。③。"},{"t":"复制过程：又称动作再现过程，即观察后的模仿过程","d":"又称动作再现过程，就是学习者观察后的模仿过程。④。"},{"t":"动机过程：因表现所观察到的行为而受到激励","d":"学习者因表现所观察到的行为而受到激励。这一过程中有三种强化方式，包括直接强化、替代强化和自我强化。（3）根据社会（观察）学习理论，教师在教育教学中应做到以下几点：①发挥替代强化的作用。教师要帮助学生树立良好的榜样，发挥替代强化的作用。②教授新行为、技能、态度和情感。教师需要将所期望的行为、技能、态度和情感以明确外显的方式进行示范或者树立理想的榜样，让学生得以观察，并对学生的模仿行为予以强化。③注意发挥自身的榜样作用。教师对世界的好奇心、对本学科的热爱以及对学习的热情等将感染学生。④监控学生习得行为的表现。教师要利用三种效应来监控学生习得行为的表现：a.去抑制效应。当学生看到榜样因做出自己原来。"}]},{"t":"教师的教学应用","items":[{"t":"发挥替代强化的作用，帮助学生树立良好的榜样","d":"教师要帮助学生树立良好的榜样，发挥替代强化的作用。"},{"t":"教授新行为、技能、态度和情感，并予以示范与强化","d":"度和情感。教师需要将所期望的行为、技能、态度和情感以明确外显的方式进行示范或者树立理想的榜样，让学生得以观察，并对学生的模仿行为予以强化。③。"},{"t":"注意发挥自身的榜样作用，以好奇心与热情感染学生","d":"用。教师对世界的好奇心、对本学科的热爱以及对学习的热情等将感染学生。④。"},{"t":"监控学生习得行为的表现：去抑制、抑制、社会促进效应","d":"现。教师要利用三种效应来监控学生习得行为的表现：a.去抑制效应。当学生看到榜样因做出自己原来抑制的行为而受到奖励时，教师要顺势引导学生加强这种反应的倾向。b.抑制效应。当学生观察到榜样的不良行为受到惩罚时，教师要及时强化引导，帮助学生弱化这类不良行为的反应倾向。c.社会促进效应。教师可通过展示适宜的榜样行为，激活学生自身行为库中已有的正向反应，推动学生主动践行。35.。"}]}],"id":"紫薯3-34"},{"num":35,"title":"35 教学评价功能与新时代评价观","subject":"教原","blocks":[{"t":"教学评价的功能","items":[{"t":"诊断功能：多维度数据绘制全息画像，诊断优势与短板","d":"苹果树”平台采集学生的体质健康、学业质量、特长发展、课外读书等多维度数据，为学生绘制全息画像，能够精准诊断学生的优势与短板，弥补传统评价过度依赖教师主观经验的不足，为教师因材施教提供科学依据。②。"},{"t":"导向功能：扭转‘唯分数论’倾向，引导重视综合素质","d":"苹果树”平台扭转“唯分数论”的评价倾向，引导师生、家长重视学生的综合素质与成长过程。该平台不只将学生学业测试分数作为评价依据，还纳入学生的作业、作品等，引导各方跳出单一分数的局限，充分发挥评价的导向作用，引领学生全面发展。③。"},{"t":"激励与促进功能：关注过程兴趣、态度、习惯，激发内驱力","d":"苹果树”平台关注学生活动过程中的兴趣、态度、习惯，尊重学生的个体特征，顺应学生的生长节律，丰盈学生的生命意义。这种动态化、过程性的评价模式能够直观呈现学生的成长轨迹，肯定学生的进步与付出，激发学生自我提升的内驱力，促进学生主动发展。该平台吸纳教师、家长、学生多方主体协同参与评价，凝聚育人合力，多角度看待学生发展，共同促进学生成长。（2）案例中所体现的教学评价类型：①按评价时间划分：以过程性评价为主，兼顾终结性评价。案例中，“苹果树”平台持续采集学生作业、课堂表现、兴趣习惯等过程性数据，关注学生成长动态；同时，该平台整合学生学业测试分数等结果数据，实现了过程评价与结果评价的统一。②按评价主体。"}]},{"t":"教学评价的类型","items":[{"t":"按评价时间划分：以过程性评价为主，兼顾终结性评价","d":"以过程性评价为主，兼顾终结性评价。案例中，“苹果树”平台持续采集学生作业、课堂表现、兴趣习惯等过程性数据，关注学生成长动态；同时，该平台整合学生学业测试分数等结果数据，实现了过程评价与结果评价的统一。②。"},{"t":"按评价主体划分：多元主体评价，教师、家长、学生协同参与","d":"多元主体评价。案例中，“苹果树”平台打破传统单一教师评价的局限，吸纳教师、家长、学生等多方主体协同参与评价过程，凝聚评价合力，使评价结果更加全面客观。（3）新时代应树立的评价观：新时代应树立发展性评价观，转变传统甄别筛选的评价思路，立足育人本位，促进学生全面发展。①评价目的聚焦发展：弱化评价的甄别选拔功能，以促进学生全面成长为核心目标。如案例中“苹果树”平台立足学生个性成长，以评价赋能学生发展。②评价内容综合多元：破除“唯分数论”导向，兼顾学业水平与综合素质，关注学生品德、能力、习惯等多维度发展。如案例中“苹果树”平台对学生进行多维数据采集。③评价方式动态立体：坚持过程性评价与终结性评价相结。"}]},{"t":"新时代应树立的评价观","items":[{"t":"评价目的聚焦发展：弱化甄别选拔，促进全面成长","d":"弱化评价的甄别选拔功能，以促进学生全面成长为核心目标。如案例中“苹果树”平台立足学生个性成长，以评价赋能学生发展。②。"},{"t":"评价内容综合多元：破除‘唯分数论’，兼顾学业与综合素质","d":"破除“唯分数论”导向，兼顾学业水平与综合素质，关注学生品德、能力、习惯等多维度发展。如案例中“苹果树”平台对学生进行多维数据采集。③。"},{"t":"评价方式动态立体：过程性与终结性、量化与质性相结合","d":"坚持过程性评价与终结性评价相结合、量化评价与质性评价相结合，实现对学生成长的全息追踪。如案例中“苹果树”平台兼顾学生的过程表现与作品成果。④。"},{"t":"评价主体多元协同：教师、家长、学生共同参与","d":"推动教师、家长、学生共同参与评价，构建多方协同的育人评价体系。如案例中“苹果树”平台吸纳各方主体协同参与评价。⑤。"},{"t":"评价手段科学精准：依托信息技术实现数据驱动评价","d":"依托信息技术实现数据驱动评价，提升评价的客观性、科学性与说服力。如案例中“苹果树”平台推动评价从经验主导走向数据驱动。36.。"}]}],"id":"紫薯3-35"},{"num":36,"title":"36 影响品德发展的外部因素","subject":"教心","blocks":[{"t":"外部因素及影响","items":[{"t":"家庭环境：起奠基作用，小泽长期与父母分离，缺乏情感交流","d":"家庭环境对学生品德的形成和发展起奠基作用。小泽长期与父母分离，缺乏情感交流和有效的道德指导。祖父母文化水平较低，对小泽放任不管，使其在成长的关键阶段缺乏正确的是非观和价值观引导。②。"},{"t":"学校环境：学风建设不足，学业压力过大，部分学生存在作弊","d":"班级学风建设不足，学业压力过大，部分学生存在作弊行为，易催生作弊可接受的错误道德判断，这也促使小泽产生“只要能拿高分，怎么做都行”的想法。③。"},{"t":"同伴影响：性格孤僻，人际交往匮乏，缺乏正面同伴榜样","d":"小泽性格孤僻，人际关系差，与同龄人交流匮乏，缺乏正面的社会互动与同伴榜样。班级部分同学存在作弊等不良行为，不良的同伴风气会对小泽的品德发展产生消极影响。④。"},{"t":"社会文化影响：沉迷网络暴力、功利主义视频，规则意识缺失","d":"小泽经常在网络中接触涉及暴力、功利主义的视频，并沉迷其中，造成其道德同理心与规则意识缺失。（2）教育建议：①加强家庭教育指导，发挥家庭在品德发展中的奠基作用。学校应依托家校沟通平台，对祖辈监护人开展家庭教育培训，提升其教育意识与教育能力；同时建议小泽的父母通过电话、视频等方式给予小泽更多情感陪伴，弥补亲子互动的缺失。②创设积极的学校氛围，利用学校环境促进学生品德养成。班主任应建立公平、正向的班级管理制度，强化对小泽不良行为（如作弊）的纪律约束；同时开展以诚信、合作为主题的德育活动，引导小泽内化道德规范，改善人际关系，形成正确的是非观和价值观。③引导健康的社会接触，削弱不良社会文化的消极影响。"}]},{"t":"教育建议","items":[{"t":"加强家庭教育指导，发挥家庭在品德发展中的奠基作用","d":"挥家庭在品德发展中的奠基作用。学校应依托家校沟通平台，对祖辈监护人开展家庭教育培训，提升其教育意识与教育能力；同时建议小泽的父母通过电话、视频等方式给予小泽更多情感陪伴，弥补亲子互动的缺失。②。"},{"t":"创设积极的学校氛围，利用学校环境促进学生品德养成","d":"利用学校环境促进学生品德养成。班主任应建立公平、正向的班级管理制度，强化对小泽不良行为（如作弊）的纪律约束；同时开展以诚信、合作为主题的德育活动，引导小泽内化道德规范，改善人际关系，形成正确的是非观和价值观。③引导健康的社会接触，削弱不良社会文化的消极影响。教师可引导小泽参与有意义的课外活动，如志愿服务、小组合作项目、心理辅导小组等，丰富其社会经验，减轻网络带来的负面影响；引导小泽正确使用网络，指导其掌握网络信息鉴别技巧，从而培养良好的媒介素养和自我调节能力。"},{"t":"引导社会健康接触，削弱不良社会文化的消极影响","d":"教师可引导小泽参与有意义的课外活动，如志愿服务、小组合作项目、心理辅导小组等，丰富其社会经验，减轻网络带来的负面影响；引导小泽正确使用网络，指导其掌握网络信息鉴别技巧，从而培养良好的媒介素养和自我调节能力。"}]}],"id":"紫薯3-36"}]},{"id":"紫薯4","name":"紫薯4","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 蔡元培改革北京大学","subject":"中教史","blocks":[{"t":"抱定宗旨，改变校风","items":[{"t":"改变学生观念：抱定宗旨、砥砺德行、敬爱师长","d":"改变校风：大学应该成为“研究高尚学问之地”。"},{"t":"整顿教师队伍，延聘积学热心教员，聘任取“学诣”第一原则","d":"学热心的教员。在教师聘任上采取“学诣”第一的原则。③发展研究所，广积图书，引导师生的研究兴趣。大学不仅要传授知识，而且要创新知识，推动学术进步。④。"},{"t":"发展研究所、广积图书，引导师生研究兴趣","d":"广积图书，引导师生的研究兴趣。大学不仅要传授知识，而且要创新知识，推动学术进步。"},{"t":"砥砺德行，培养正当兴趣，倡导成立各种学会","d":"趣。蔡元培在师生中提倡道德修养，倡导成立了各种学会，培养学生正当的兴趣。（2）贯彻“思想自由，兼容并包”的办学原则。①蔡元培明确声明，在学术上循“思想自由”原则，取“兼容并包”主义，各种学问都可以在大学里被自由地研究和讲授，这样大学才能对学术的发展起到促进作用。②蔡元培以“学诣”为主，罗致各类学术人才，使北大教师队伍一时出现流派纷呈的局面。（3）教授治校，民主管理。蔡元培在《大学令》中确立了教授治校、民主管理的大学校务管理原则，其目的是把推动学校发展的权利交给教授，让真正懂得学术的人来管理学校。（4）学科与教学体制改革。①扩充文理，改变“轻学而重术”的思想。蔡元培认为，大学要偏重于纯粹学理研究。"}]},{"t":"思想自由，兼容并包","items":[{"t":"学术循“思想自由”原则、取“兼容并包”主义，各学问自由讲授","d":"各种学问都可以在大学里被自由地研究和讲授，这样大学才能对学术的发展起到促进作用。"},{"t":"以“学诣”为主罗致各类学术人才，教师队伍流派纷呈"}]},{"t":"教授治校，民主管理","items":[{"t":"《大学令》确立教授治校、民主管理的校务管理原则"},{"t":"把推动学校发展的权利交给教授，由懂学术者管理学校","d":"交给教授，让真正懂得学术的人来管理学校。（4）学科与教学体制改革。①扩充文理，改变“轻学而重术”的思想。蔡元培认为，大学要偏重于纯粹学理研究的文、理两科。在这一思想指导下，他将北京大学工科停办，商科改为商业学，并入法科；同时扩充文、理两科的专业门类，加强两科的建设。②沟通文理，废科设系。蔡元培认为，传统文、理分科的做法不适应近代科学相互联系、相互渗透的发展趋势。为了避免文、理科学生相互隔绝，互不沟通，蔡元培采取了“沟通文理，废科设系”的措施。③改年级制为选科制（学分制）。改年级制为选科制体现了蔡元培“尚自然”“展个性”的教育思想，同时也是落实他“沟通文理”思想的一个具体措施，为文、理科学生相互。"}]},{"t":"学科与教学体制改革","items":[{"t":"扩充文理，改变“轻学而重术”：工科停办、商科并入法科","d":"而重术”的思想。蔡元培认为，大学要偏重于纯粹学理研究的文、理两科。在这一思想指导下，他将北京大学工科停办，商科改为商业学，并入法科；同时扩充文、理两科的专业门类，加强两科的建设。②沟通文理，废科设系。蔡元培认为，传统文、理分科的做法不适应近代科学相互联系、相互渗透的发展趋势。为了避免文、理科学生相互隔绝，互不沟通，蔡元培采取了“沟通文理，废科设系”的措施。③改年级制为选科制（学分制）。改年级制为选科制体现了蔡元培“尚自然”“展个性”的教育思想，同时也是落实他“沟通文理”思想的一个具体措施，为文、理科学生相互选修课程提供了方便。32.。"},{"t":"沟通文理，废科设系，避免文、理科学生相互隔绝","d":"废科设系。蔡元培认为，传统文、理分科的做法不适应近代科学相互联系、相互渗透的发展趋势。为了避免文、理科学生相互隔绝，互不沟通，蔡元培采取了“沟通文理，废科设系”的措施。"},{"t":"改年级制为选科制（学分制），体现尚自然、展个性","d":"的教育思想，同时也是落实他“沟通文理”思想的一个具体措施，为文、理科学生相互选修课程提供了方便。【答案要点】1919年，法国议员阿斯蒂埃提出的关于职业技术教育的《阿斯蒂埃法》被议会通过。"}]}],"id":"紫薯4-31"},{"num":32,"title":"32 阿斯蒂埃法与职业教育","subject":"外教史","blocks":[{"t":"《阿斯蒂埃法》主要内容","items":[{"t":"国家设相关部门管理职业教育，中央由教育部设主管部门"},{"t":"每市镇设一所职业学校，经费由国家与雇主各负一半"},{"t":"18岁以下青年有免费职业教育义务，雇主保证每周4小时"},{"t":"内容包括补充初等教育的普通教育、职业基础学科、劳动学习","d":"的普通教育、作为职业基础的各门学科、获得劳动技能的劳动学习这三个部分。（2）《阿斯蒂埃法》对职业教育发展的启示：①提高对职业教育的重视程度。国家应将职业教育置于与普通教育同等重要的地位，重视职业人才的培养，满足社会对高素质劳动力的需求。②完善职业教育的专门管理与立法保障。职业教育的发展需要制度规范，国家应设立专门的管理机构，健全相关法律法规，以此保障职业教育有序发展。③拓宽经费筹措渠道，保障职业教育经费供给。统筹国家、企业及社会多方力量，多渠道筹集资金，推动职业教育持续发展。④注重普通教育与职业教育的融合。职业教育机构在传授职业技能的同时，不应忽视普通文化课程的教学，以促进学生综合素养的提升。"}]},{"t":"对职业教育发展的启示","items":[{"t":"提高重视程度：置于与普通教育同等重要地位，培养职业人才"},{"t":"完善专门管理与立法保障：设专门管理机构，健全法律法规"},{"t":"拓宽经费筹措渠道：统筹国家、企业及社会多方力量筹集资金","d":"保障职业教育经费供给。统筹国家、企业及社会多方力量，多渠道筹集资金，推动职业教育持续发展。④。"},{"t":"注重普通教育与职业教育融合：不忽视普通文化课程教学","d":"育的融合。职业教育机构在传授职业技能的同时，不应忽视普通文化课程的教学，以促进学生综合素养的提升。《阿斯蒂埃法》的颁布，使法国的职业技术教育第一次获得了有组织的形式，成为一种由国家管理的事业。该法在法国历史上有“技术教育宪章”之称。"}]},{"t":"历史地位与影响","items":[{"t":"使法国职业技术教育首次获得有组织形式，成国家管理事业"},{"t":"在法国历史上有“技术教育宪章”之称","d":"教育宪章”之称。三、材料分析题：第33～36小题，每小题15分，共60分。33.。"}]}],"id":"紫薯4-32"},{"num":33,"title":"33 教师职业与教育家精神","subject":"教原","blocks":[{"t":"教师职业的社会作用","items":[{"t":"文化传承：传播优秀文化，承担传承、创新、发展文明使命","d":"作用：教师是人类优秀文化的传播者，承担着传承、创新和发展人类文明的使命。②。"},{"t":"人才培养：落实立德树人根本任务，培养各类合格人才","d":"作用：教师作为育人主体，落实立德树人的根本任务，通过为社会培养各级各类合格人才，为社会发展提供人才支撑。③。"},{"t":"社会赋能：推动教育高质量发展，促进教育公平与强国建设","d":"作用：教师推动教育高质量发展，促进教育公平，服务教育强国建设，助力社会进步与中国式现代化。（2）在科技革命加速演进、国际人才竞争加剧、教育强国建设深入推进、中国式现代化稳步向前的时代背景下，弘扬教育家精神具有重要的现实意义。①助力教育强国建设：教育家精神是新时代教师队伍建设的重要价值引领，能够锻造高素质专业化教师队伍，夯实教育强国建设根基。②落实立德树人根本任务：教育家精神为教师育人实践提供根本价值遵循，引导教师以德立身、以德施教，切实提升育人质量。③推动教育高质量发展：教育家精神引领教师更新教育理念，创新育人方式，顺应新时代科技变革，适配育人现实需求，破解教育发展难题。（3）结合中国特有的教。"}]},{"t":"弘扬教育家精神的现实意义","items":[{"t":"助力教育强国建设：引领教师队伍建设，夯实强国根基","d":"教育家精神是新时代教师队伍建设的重要价值引领，能够锻造高素质专业化教师队伍，夯实教育强国建设根基。②。"},{"t":"落实立德树人：提供价值遵循，以德立身、以德施教","d":"根本任务：教育家精神为教师育人实践提供根本价值遵循，引导教师以德立身、以德施教，切实提升育人质量。③。"},{"t":"推动教育高质量发展：更新理念、创新育人方式，破解难题","d":"教育家精神引领教师更新教育理念，创新育人方式，顺应新时代科技变革，适配育人现实需求，破解教育发展难题。（3）结合中国特有的教育家精神的六大核心内涵，新时代教师践行教育家精神可以从以下几方面入手：①筑牢心有大我、至诚报国的理想信念。坚守教育初心，心怀家国使命，把教书育人事业融入教育强国建设与民族复兴的时代大局，立足岗位履行育人职责。②恪守言为士则、行为世范的道德情操。坚持以德立身、以德立学、以德施教，以身作则、为人师表，以高尚的师德师风引领学生健康成长。③涵养启智润心、因材施教的育人智慧。尊重学生身心发展规律与个体差异，深耕课堂教学，促进学生全面发展，切实提升育人质量。④秉持勤学笃行、求是创新。"}]},{"t":"践行教育家精神：理想与道德","items":[{"t":"筑牢心有大我、至诚报国的理想信念，立足岗位履职","d":"国的理想信念。坚守教育初心，心怀家国使命，把教书育人事业融入教育强国建设与民族复兴的时代大局，立足岗位履行育人职责。②。"},{"t":"恪守言为士则、行为世范的道德情操，以身作则、为人师表","d":"范的道德情操。坚持以德立身、以德立学、以德施教，以身作则、为人师表，以高尚的师德师风引领学生健康成长。③涵养启智润心、因材施教的育人智慧。尊重学生身心发展规律与个体差异，深耕课堂教学，促进学生全面发展，切实提升育人质量。④秉持勤学笃行、求是创新的躬耕态度。坚持勤学钻研、求真务实，主动顺应科技革命与教育变革趋势，积极创新教学方法与育人模式，破解教育教学中的现实难题。⑤厚植乐教爱生、甘于奉献的仁爱之心。坚守教育情怀，充分尊重、关爱每一位学生，竭诚守护，做好学生成长路上的陪伴者与引路人。⑥树立胸怀天下、以文化人的弘道追求。立足时代发展，传承优秀文化、传播先进理念，夯实文化底色，为中国式现代化培养合格。"}]},{"t":"践行教育家精神：智慧·躬耕·仁爱·弘道","items":[{"t":"涵养启智润心、因材施教的育人智慧，尊重个体差异","d":"教的育人智慧。尊重学生身心发展规律与个体差异，深耕课堂教学，促进学生全面发展，切实提升育人质量。④。"},{"t":"秉持勤学笃行、求是创新的躬耕态度，破解教学难题","d":"新的躬耕态度。坚持勤学钻研、求真务实，主动顺应科技革命与教育变革趋势，积极创新教学方法与育人模式，破解教育教学中的现实难题。⑤。"},{"t":"厚植乐教爱生、甘于奉献的仁爱之心，做好成长引路人","d":"献的仁爱之心。坚守教育情怀，充分尊重、关爱每一位学生，竭诚守护，做好学生成长路上的陪伴者与引路人。⑥。"},{"t":"树立胸怀天下、以文化人的弘道追求，夯实文化底色","d":"人的弘道追求。立足时代发展，传承优秀文化、传播先进理念，夯实文化底色，为中国式现代化培养合格的人才。34.。"}]}],"id":"紫薯4-33"},{"num":34,"title":"34 行为矫正技术与强化策略","subject":"教心","blocks":[{"t":"教师运用的行为矫正技术","items":[{"t":"正强化：当场肯定并公开表扬守纪学生，提高行为概率","d":"教师对自觉维持纪律并提醒他人遵守课堂规范的学生当场予以肯定并在家校群公开表扬。这一做法属于正强化，即通过提供愉快刺激，提高良好行为的发生概率。②。"},{"t":"负惩罚：取消违规学生当日课外活动资格，降低行为概率","d":"对于出现违规行为的学生，教师取消其当日参与课外活动的资格。这是通过消除愉快刺激以降低不当行为发生的概率，属于负惩罚。③。"},{"t":"代币制：小红花即代币，积分前五名可兑换小礼品","d":"教师通过观察学生的课堂表现，给予专注听讲、遵守纪律的学生小红花作为积分奖励，小红花就是一种代币；每周累计积分前五名的学生可兑换小礼品。该技术通过代币及其交换系统对个体行为进行强化。（2）①该现象产生的原因：a.强化物饱和。教师长期使用“积分兑换礼品”这一奖励方式，使得学生逐渐对礼品这一强化物失去兴趣，强化物的强化价值随之下降，导致对课堂行为的干预效果逐渐减弱。b.连续强化的局限性。教师采用连续强化，即学生每出现一次良好行为，教师便给予奖励。在连续强化作用下，强化效应容易衰减，不利于学生课堂良好行为的长期维持。c.过度依赖外部动机。学生课堂良好行为主要依赖外部物质奖励，学生自身缺乏内在动机支持。"}]},{"t":"强化效果减弱的原因","items":[{"t":"强化物饱和：长期积分兑换礼品，学生对奖励失去兴趣","d":"教师长期使用“积分兑换礼品”这一奖励方式，使得学生逐渐对礼品这一强化物失去兴趣，强化物的强化价值随之下降，导致对课堂行为的干预效果逐渐减弱。b.。"},{"t":"连续强化的局限：每次良好行为均奖励，强化效应易衰减","d":"性。教师采用连续强化，即学生每出现一次良好行为，教师便给予奖励。在连续强化作用下，强化效应容易衰减，不利于学生课堂良好行为的长期维持。c.。"},{"t":"过度依赖外部动机：缺乏内在动机支持，行为稳定性差","d":"学生课堂良好行为主要依赖外部物质奖励，学生自身缺乏内在动机支持，因此该行为的稳定性和持续性不强。②相应的改进策略：a.丰富奖励形式。除“积分兑换礼品”的物质奖励之外，增加口头肯定、公开表彰等非物质奖励，同时根据学生特点设置个性化奖励，改善单一物质奖励造成的强化效果下降问题。b.调整强化程序。改变材料中学生每次表现良好，教师就发放小红花的连续强化模式，引入变比强化或变时强化，以此增强学生课堂良好行为的持久性与抗消退能力。c.激发学生的内在动机。教师要引导学生理解良好课堂行为的内在价值，逐步实现从外部强化到自我激励的转变。35.。"}]},{"t":"相应的改进策略","items":[{"t":"丰富奖励形式：增加口头肯定、公开表彰与个性化奖励","d":"除“积分兑换礼品”的物质奖励之外，增加口头肯定、公开表彰等非物质奖励，同时根据学生特点设置个性化奖励，改善单一物质奖励造成的强化效果下降问题。b.。"},{"t":"调整强化程序：以变比强化或变时强化取代连续强化","d":"改变材料中学生每次表现良好，教师就发放小红花的连续强化模式，引入变比强化或变时强化，以此增强学生课堂良好行为的持久性与抗消退能力。c.激发学生的内在动机。教师要引导学生理解良好课堂行为的内在价值，逐步实现从外部强化到自我激励的转变。35.。"},{"t":"激发内在动机：理解良好行为的内在价值，转向自我激励"}]}],"id":"紫薯4-34"},{"num":35,"title":"35 作业的作用与变革趋势","subject":"教原","blocks":[{"t":"作业的作用","items":[{"t":"对学生：巩固课堂所学，深化知识理解，掌握技能技巧","d":"提出三点要求：一是抱定宗旨，二是砥砺德行，三是敬爱师长。②整顿教师队伍，延聘积学热心的教员。在教师聘任上采取“学诣”第一的原则。③发展研究所，广积图书，引导师生的研究兴趣。大学不仅要传授知识，而且要创新知识，推动学术进步。④砥砺德行，培养正当兴趣。蔡元培在师生中提倡道德修养，倡导成立了各种学会，培养学生正当的兴趣。（2）贯彻“思想自由，兼容并包”的办学原则。①蔡元培明确声明，在学术上循“思想自由”原则，取“兼容并包”主义，各种学问都可以在大学里被自由地研究和讲授，这样大学才能对学术的发展起到促进作用。②蔡元培以“学诣”为主，罗致各类学术人才，使北大教师队伍一时出现流派纷呈的局面。"},{"t":"对教师：了解学生知识技能不足，提供针对性指导建议","d":"而言，通过布置和批改作业，教师可以及时了解和发现学生在知识或技能方面存在的不足；同时还能根据学生的作业完成情况，为学生提供针对性的学习指导与改进建议。（2）教师布置作业的要求：①控制作业总量，减轻学生负担。教师应合理控制作业数量，避免作业量过大。案例中，学校规定各科所留作业量都不许超过一页B5纸，体现了对作业总量的严格控制。②精选作业内容，提高作业质量。教师应从大量习题中筛选出典型、精要的题目，避免机械重复。案例中，学校为教师挑选多本练习册，要求教师去粗取精、精简习题，体现了对作业质量的重视。③设计分层作业，满足不同学生需求。作业应体现层次性与差异性，适配不同学生的学业水平。案例中，学校将作业。"}]},{"t":"教师布置作业的要求","items":[{"t":"控制作业总量，减轻学生负担，避免作业量过大","d":"生负担。教师应合理控制作业数量，避免作业量过大。案例中，学校规定各科所留作业量都不许超过一页B5纸，体现了对作业总量的严格控制。②。"},{"t":"精选作业内容，提高作业质量，避免机械重复","d":"业质量。教师应从大量习题中筛选出典型、精要的题目，避免机械重复。案例中，学校为教师挑选多本练习册，要求教师去粗取精、精简习题，体现了对作业质量的重视。③。"},{"t":"设计分层作业：分必做、选做、自选题和错题纠正四部分","d":"满足不同学生需求。作业应体现层次性与差异性，适配不同学生的学业水平。案例中，学校将作业分为必做题、选做题、自选题和错题纠正四个部分，体现了分层设计的要求。④。"},{"t":"丰富作业类型：布置体育、劳动与社会实践作业","d":"促进学生全面发展。作业形式应多样化，不应局限于书面学科作业。案例中，学校布置体育作业、劳动作业和社会实践作业，体现了作业类型的创新与拓展。（3）我国中小学作业变革的主要趋势：①在目标定位方面，从知识本位转向素养导向。在新课标的要求下，作业设计应直接对标学科核心素养，不能仅关注静态的知识掌握，还应当兼顾学生动态成长，关注作业中内嵌的正确价值观、必备品格和关键能力的培养。②在任务设计方面，从碎片化习题转向整体性、综合性作业。作业应突破单一学科的局限，改变零散机械刷题的模式，注重综合性、实践性，提倡跨学科作业、劳动作业、体育作业、社会实践作业等类型，促进学生综合能力发展。③在难度设计方面，从同质化。"}]},{"t":"中小学作业变革的主要趋势","items":[{"t":"目标定位：从知识本位转向素养导向，对标核心素养","d":"方面，从知识本位转向素养导向。在新课标的要求下，作业设计应直接对标学科核心素养，不能仅关注静态的知识掌握，还应当兼顾学生动态成长，关注作业中内嵌的正确价值观、必备品格和关键能力的培养。②在。"},{"t":"任务设计：从碎片化习题转向整体性、综合性作业","d":"方面，从碎片化习题转向整体性、综合性作业。作业应突破单一学科的局限，改变零散机械刷题的模式，注重综合性、实践性，提倡跨学科作业、劳动作业、体育作业、社会实践作业等类型，促进学生综合能力发展。③在。"},{"t":"难度设计：从同质化转向个性化，分层、弹性、可选","d":"方面，从同质化转向个性化。教师要摒弃“一刀切”的作业模式，尊重学生的个体差异，推行分层、弹性、可选的作业设计，适配不同学生的学习水平，调动学生学习的主动性。36.。"}]}],"id":"紫薯4-35"},{"num":36,"title":"36 加涅学习层次与图形概念","subject":"教心","blocks":[{"t":"加涅的学习层次分类","items":[{"t":"学习分八类：信号、刺激—反应、连锁、言语联想、辨别、概念、规则、解决问题","d":"学习、辨别学习、概念学习、规则（原理）的学习、解决问题的学习。同时，他指出每类学习都以前一层级的学习为基础。案例中，小亮虽然能够识别见过的图形，但当图形的颜色、大小、方向发生变化时就会产生困惑。他在学习中主要存在如下问题：。"},{"t":"每类学习都以前一层级的学习为基础，逐级递进","d":"的学习为基础。案例中，小亮虽然能够识别见过的图形，但当图形的颜色、大小、方向发生变化时就会产生困惑。他在学习中主要存在如下问题：①辨别学习未真正达成。辨别学习是指个体学会识别多种刺激的异同，并对它们做出不同的反应。小亮无法区分图形的本质属性（如边数、角数）和非本质属性（如颜色、大小、方向），容易受到外在知觉特征的干扰。②概念学习未真正达成。概念学习是指个体对刺激进行分类时，学会对一类刺激做出同样的反应。小亮只是机械记忆了图形名称与定义，并未真正掌握图形概念。③未能实现概念的迁移应用。小亮只能识别教师展示过的典型例子，无法将习得的概念迁移到新情境中。（2）为了帮助学生完成“图形概念”的真正学习。"}]},{"t":"学生学习中存在的问题","items":[{"t":"辨别学习未达成：无法区分本质与非本质属性，受知觉干扰"},{"t":"概念学习未达成：仅机械记忆图形名称与定义，未掌握概念"},{"t":"未能迁移应用：只能识别典型例子，无法迁移到新情境"}]},{"t":"促进概念学习的教学策略","items":[{"t":"加强变式教学：提供颜色、大小、角度不同的图形卡","d":"教师提供颜色、大小、摆放角度各不相同的三角形和正方形图卡，引导学生观察这些图形的共同特征，从而掌握图形的本质属性。②引导学生开展比较与归类活动。教师组织学生按照边数对图形进行分类，强化图形名称与结构属性的联系，避免学生仅依据表面特征进行分类。③鼓励学生表达判断依据。例如，让学生说出“这是三角形，因为它有三条边”，促使学生将隐性判断转化为显性思维，深化对图形概念的理解。④。"},{"t":"引导比较与归类：按边数分类，强化名称与结构属性联系"},{"t":"鼓励表达判断依据：说出“因为有三条边”，转隐性为显性"},{"t":"设计动手操作：拼摆、旋转、绘制图形，促进概念迁移","d":"活动。教师组织学生动手拼摆、旋转图形或绘制图形，借助实际操作加深概念理解，促进概念迁移。对概念教学的启示：①学生掌握概念并不是一蹴而就的，需要教师分层递进开展引导。教师应当对学习任务的难度及学生的学习水平进行评估，实施分层有效的教学。②教师应关注学生的实际理解水平，勿被学生表面“会了”的现象所迷惑，即便学生能够复述定义，也不能忽视对学生深层思维的引导。"}]},{"t":"对概念教学的启示","items":[{"t":"概念掌握非一蹴而就，需评估任务难度与学习水平，分层递进","d":"开展引导。教师应当对学习任务的难度及学生的学习水平进行评估，实施分层有效的教学。"},{"t":"关注实际理解水平，勿被表面“会了”迷惑，引导深层思维"}]}],"id":"紫薯4-36"}]},{"id":"紫薯5","name":"紫薯5","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 宋代科举制度的变化","subject":"中教史","blocks":[{"t":"科举制度概况","items":[{"t":"以考试为主、举荐为辅，产生于隋、发展于唐，延续1300年","d":"的人才选拔制度，它产生于隋朝，发展于唐朝，延续了1300年，是我国封建社会中持续时间最长、影响范围最广的选士制度。科举制度的。"},{"t":"特点：个人自愿报名，集中考试，以文艺才能为标准，择优录取","d":"是个人自愿报名，集中考试，以文艺才能为标准，限量择优录取。相较于唐制，宋朝科举制度的变化和发展，主要表现在以下方面：（1）扩大科举名额。唐朝进士科，每榜的录取人数很少。宋朝科举考试除按照常例录取正奏名之外，还增设特奏名，录取规模大幅扩大。在扩张录取名额的同时，宋朝还提高科举及第后的地位和待遇。（2）确定“三年一贡举”。宋朝科举考试的时间，最初没有明确的规定，直至宋英宗治平三年，正式确定科举考试的时间为“三年一贡举”。这一改革在历史上产生了深远影响，从此，三年一科举成为定制，一直延续到清末科举考试制度被废除。（3）殿试成为定制。殿试始于唐朝武则天，但当时并没有成为制度。之后，宋太祖在讲武殿亲自主。"}]},{"t":"扩大科举名额","items":[{"t":"唐进士科每榜录取人数少，宋增设特奏名，录取规模大幅扩大","d":"在扩张录取名额的同时，宋朝还提高科举及第后的地位和待遇。"},{"t":"扩张录取名额的同时，提高科举及第后的地位和待遇","d":"宋朝还提高科举及第后的地位和待遇。（2）确定“三年一贡举”。宋朝科举考试的时间，最初没有明确的规定，直至宋英宗治平三年，正式确定科举考试的时间为“三年一贡举”。这一改革在历史上产生了深远影响，从此，三年一科举成为定制，一直延续到清末科举考试制度被废除。（3）殿试成为定制。殿试始于唐朝武则天，但当时并没有成为制度。之后，宋太祖在讲武殿亲自主持考试，“殿试遂为常制”。从此形成三级科举考试制度：州试（由地方官主持）一省试（由尚书省礼部主持）一殿试（由皇帝主持）。（4）建立新制，防止科场作弊。为了维护考试的客观性和公平性，防止作弊，宋朝在科举考试的实践中，逐渐建立了一些新制度，其主要内容有：建立锁院制。"}]},{"t":"确定“三年一贡举”","items":[{"t":"宋英宗治平三年正式确定科举考试时间为“三年一贡举”"},{"t":"三年一科举成为定制，延续至清末科举制度被废除","d":"一直延续到清末科举考试制度被废除。（3）殿试成为定制。殿试始于唐朝武则天，但当时并没有成为制度。之后，宋太祖在讲武殿亲自主持考试，“殿试遂为常制”。从此形成三级科举考试制度：州试（由地方官主持）一省试（由尚书省礼部主持）一殿试（由皇帝主持）。（4）建立新制，防止科场作弊。为了维护考试的客观性和公平性，防止作弊，宋朝在科举考试的实践中，逐渐建立了一些新制度，其主要内容有：建立锁院制、实行别头试、采用糊名法、创立誉录制等。32.。"}]},{"t":"殿试成为定制","items":[{"t":"殿试始于唐武则天，宋太祖讲武殿亲自主持，遂为常制","d":"从此形成三级科举考试制度：州试（由地方官主持）一省试（由尚书省礼部主持）一殿试（由皇帝主持）。"},{"t":"形成州试（地方官）—省试（尚书省礼部）—殿试三级制度"}]},{"t":"建立新制，防止科场作弊","items":[{"t":"为维护考试客观性与公平性，防止作弊而建立新制度"},{"t":"内容有锁院制、别头试、糊名法、誊录制等","d":"采用糊名法、创立誉录制等。【答案要点】裴斯泰洛齐是享有世界盛誉的瑞士教育家，也是世界教育史上第一个明确提出“教育心理学化”口号的教育家。该思想贯穿于他全部的教育探索与教学实践之中，深刻推动了近代教育的科学化发展。"}]}],"id":"紫薯5-31"},{"num":32,"title":"32 裴斯泰洛齐教育心理学化","subject":"外教史","blocks":[{"t":"教育心理学化的含义","items":[{"t":"人的心理活动存在固有基本规律，教育要找到这种规律","d":"的基本规律，教育心理学化就是要找到这种规律，把教育提高到科学的水平，将教育科学建立在人的心理活动规律的基础上。（2）教育心理学化的基本要求。①教育目的的心理学化。要求将教育的目的和教育的理论指导置于儿童本性发展的自然法则的基础上。教育者必须充分认识到，人生来具有天赋的潜能，这种潜能不但有要求不断发展的内在倾向和内心动力，而且还有一定的发展规律。②教育内容的心理学化。必须使教育内容的选择和编制适合儿童的学习心理规律。教育应以广泛的基础知识课程使儿童的本性得到全面、均衡的发展，并努力探索教育内容中普遍存在的基本要素。③教学原则和教学方法的心理学化。在教学过程中必须遵循直观性原则与循序渐进原则，以符。"},{"t":"把教育提高到科学水平，建立在心理活动规律的基础上","d":"的水平，将教育科学建立在人的心理活动规律的基础上。"}]},{"t":"教育心理学化的基本要求","items":[{"t":"教育目的心理学化：置于儿童本性发展的自然法则基础上"},{"t":"教育内容心理学化：选择编制适合儿童学习心理规律"},{"t":"教学原则方法心理学化：遵循直观性与循序渐进原则"},{"t":"让儿童成为自己的教育者：调动能动性，使其懂得自我教育"}]},{"t":"教育心理学化的实践体现","items":[{"t":"系统落地于初等教育实践，形成要素教育理论与各科教学法","d":"践，形成了要素教育理论与初等学校各科教学法，也因此。"},{"t":"被誉为“现代初等学校各科教学法的奠基人”"},{"t":"要素教育：教育内容心理学化的载体，从最基本要素开始","d":"教育内容的心理学化的核心载体。要素教育是教育内容的心理学化的直接产物。裴斯泰洛齐提出，任何事物都是由最基本的要素构成的，儿童掌握了这些要素就能学习到位。教育也应从最基本、最简单的要素开始，由易到难，循序渐进，适合儿童的接受能力。②初等学校。"},{"t":"各科教学法：从直观性、循序渐进出发构建学科教学法","d":"教学方法的心理学化的实践落地。裴斯泰洛齐从要素教育和教学心理学化的观点出发，构建了系统的初等学校各门学科的教学方法，将直观性、循序渐进的要求落实到具体学科中。③。"},{"t":"教育与生产劳动相结合：斯坦兹孤儿院学习为主、手工劳动为辅","d":"儿童教育主体性的实践体现。在斯坦兹孤儿院的教育实践中，裴斯泰洛齐明确将学习与手工劳动相联系，以安排学习为主、参加手工劳动为辅，让儿童在动手实践中主动获得知识与谋生能力。这一模式尊重儿童的能动性，让儿童在真实活动中实现主动发展，是“要让儿童成为他自己的教育者”这一心理学化要求的现实体现。"}]}],"id":"紫薯5-32"},{"num":33,"title":"33 人口变化与教育资源配置","subject":"教原","blocks":[{"t":"人口变化对教育的影响","items":[{"t":"人口数量制约教育发展的规模与速度，学龄人口减少致规模缩减","d":"的规模与速度。材料中的少子化趋势导致基础教育学龄人口规模缩减，直接改变了基础教育的办学规模与发展节奏。②。"},{"t":"人口质量影响教育发展的质量，推动育人质量更高标准","d":"的质量。国民整体素质的不断提升，推动了社会对人才培养要求的持续提高，进而对基础教育育人质量提出了更高标准。③。"},{"t":"人口结构制约教育的结构与布局，推动层级与区域调整","d":"构与布局。材料中的人口老龄化、区域人口增减分化趋势，推动教育层级结构与区域教育布局的调整优化。（2）人口变化趋势为教育高质量发展提供了以下契机：①少子化带来学龄人口减少，提升了生均教育资源占有水平。学生规模缩减后，学校更易推行小班化教学，教师能够兼顾学生的个体差异、开展针对性教学，为教育由规模扩张转向质量提升创造了现实条件。②人口老龄化催生多元学习需求，推动终身教育体系进一步完善。老年群体对继续教育、文化生活的需求增长，带动老年大学、社区教育发展，丰富教育高质量发展的内涵。③区域人口增减分化推动教育资源统筹调整。人口流动带来生源分布变化，推动各地优化教育布局、共享优质教育资源，为缩小城乡教育差。"}]},{"t":"教育高质量发展的契机","items":[{"t":"少子化提升生均教育资源占有水平，更易推行小班化教学","d":"教师能够兼顾学生的个体差异、开展针对性教学，为教育由规模扩张转向质量提升创造了现实条件。"},{"t":"老龄化催生多元学习需求，推动终身教育体系完善","d":"求，推动终身教育体系进一步完善。老年群体对继续教育、文化生活的需求增长，带动老年大学、社区教育发展，丰富教育高质量发展的内涵。③。"},{"t":"区域人口增减分化推动教育资源统筹调整，优化教育布局","d":"教育资源统筹调整。人口流动带来生源分布变化，推动各地优化教育布局、共享优质教育资源，为缩小城乡教育差距、推进教育优质均衡发展提供改革动力。（3）优化教育资源配置的主要策略：①推进托幼一体化建设。受学前教育学龄人口减少的影响，部分幼儿园面临招生困难，政府可通过托幼一体化建设化解办学困境。②做好长期教育资源配置规划。在少子化与城镇化背景下，乡村学校生源进一步缩减。对此，政府可以优化乡村基础教育资源布局，充分利用乡村闲置校舍，将其改造为乡村社区文化中心、老年活动场所或青少年宫等，实现教育资源功能转型。③促进学段、区域之间的教育资源共享。各地教育主管部门推动跨学段、跨区域教育资源共建共享，提升教育资源。"}]},{"t":"优化教育资源配置的策略","items":[{"t":"推进托幼一体化建设，化解幼儿园招生困难","d":"受学前教育学龄人口减少的影响，部分幼儿园面临招生困难，政府可通过托幼一体化建设化解办学困境。"},{"t":"做好长期教育资源配置规划，改造利用乡村闲置校舍","d":"规划。在少子化与城镇化背景下，乡村学校生源进一步缩减。对此，政府可以优化乡村基础教育资源布局，充分利用乡村闲置校舍，将其改造为乡村社区文化中心、老年活动场所或青少年宫等，实现教育资源功能转型。③促进学段、区域之间的教育资源共享。各地教育主管部门推动跨学段、跨区域教育资源共建共享，提升教育资源的统筹使用效率，避免重复建设与资源浪费。④。"},{"t":"促进学段、区域之间教育资源共享，避免重复建设","d":"区域之间的教育资源共享。各地教育主管部门推动跨学段、跨区域教育资源共建共享，提升教育资源的统筹使用效率，避免重复建设与资源浪费。"},{"t":"推动教师校长交流轮岗，均衡配置城乡教师资源","d":"为化解教师资源供需矛盾，各地教育主管部门通过教师校长交流轮岗，统筹推进城乡教师在数量、质量、结构上的均衡配置。34.。"}]}],"id":"紫薯5-33"},{"num":34,"title":"34 韦纳归因理论与积极归因","subject":"教心","blocks":[{"t":"四类归因因素的特征","items":[{"t":"能力：内部的、稳定的、不可控","d":"②初等学校各科教学法：教学方法的心理学化的实践落地。裴斯泰洛齐从要素教育和教学心理学化的观点出发，构建了系统的初等学校各门学科的教学方法，将直观性、循序渐进的要求落实到具体学科中。③教育与生产劳动相结合：儿童教育主体性的实践体现。在斯坦兹孤儿院的教育实践中，裴斯泰洛齐明确将学习与手工劳动相联系，以安排学习为主、参加手工劳动为辅，让儿童在动手实践中主动获得知识与谋生能力。这一模式尊重儿童的能动性，让儿童在真实活动中实现主动发展，是“要让儿童成为他自己的教育者”这一心理学化要求的现实体现。"},{"t":"努力：内部的、不稳定的、可控","d":"归因具有内部的、不稳定的、可控的特征。③。"},{"t":"任务难度：外部的、稳定的、不可控","d":"归因具有外部的、稳定的、不可控的特征。④。"},{"t":"运气：外部的、不稳定的、不可控","d":"归因具有外部的、不稳定的、不可控的特征。（2）产生的效果：①将失败归因于能力，学生可能产生的情绪反应是消极或羞耻，自我效能感低下；对未来的期待是预判自己会再次遭遇失败；对未来行为的影响是逃避类似情境。②将失败归因于努力，学生可能产生的情绪反应是消极或愧疚；对未来的期待是相信通过努力能够改善结果；对未来行为的影响是在类似情境中付出更多的努力。③将失败归因于任务难度，学生可能产生的情绪反应是消极、生气、挫败感；对未来的期待是预判自己再次遇到同类任务仍会失败；对未来行为的影响是逃避类似情境。④将失败归因于运气，学生可能产生的情绪反应是沮丧或懊恼；对未来的期待是难以形成稳定的成功预期；对未来行为的影响。"}]},{"t":"不同归因产生的效果","items":[{"t":"归因于能力：消极或羞耻，自我效能感低，预期再次失败、逃避","d":"学生可能产生的情绪反应是消极或羞耻，自我效能感低下；对未来的期待是预判自己会再次遭遇失败；对未来行为的影响是逃避类似情境。②将失败。"},{"t":"归因于努力：消极或愧疚，相信努力可改善，愿付出更多努力","d":"学生可能产生的情绪反应是消极或愧疚；对未来的期待是相信通过努力能够改善结果；对未来行为的影响是在类似情境中付出更多的努力。③将失败。"},{"t":"归因于任务难度：挫败感，预判再次失败，逃避类似情境","d":"学生可能产生的情绪反应是消极、生气、挫败感；对未来的期待是预判自己再次遇到同类任务仍会失败；对未来行为的影响是逃避类似情境。④将失败。"},{"t":"归因于运气：沮丧或懊恼，难以形成成功预期，抱有侥幸心理","d":"学生可能产生的情绪反应是沮丧或懊恼；对未来的期待是难以形成稳定的成功预期；对未来行为的影响是容易抱有侥幸心理，不会主动付出更多努力。（3）教师促进学生积极归因的方式：①引导学生进行积极归因。在韦纳归因理论框架下，理想的失败归因是归因于内部、不稳定、可控的努力因素，教师要引导学生减少将失败归于能力、任务难度、运气等不可控因素。②引导学生建立积极的自我概念。教师应使学习任务的难度与学生的能力水平相适应，为学生形成努力归因创造条件，提升学生的自我效能感。③引导学生将成败归因于努力，但不能将一切均归因于努力，避免学生产生习得性无助，通过归因训练帮助学生形成辩证的归因模式。35.。"}]},{"t":"促进学生积极归因的方式","items":[{"t":"引导积极归因：多归因于努力，减少归因于能力、难度、运气","d":"这类可控因素，将失败归因于策略不当、努力不足等可调节因素，尽量避免将失败归因于能力不足，从而帮助学生保持积极的学习心态，避免习得性无助。"},{"t":"引导建立积极自我概念：任务难度与能力相适应，提升效能感"},{"t":"通过归因训练形成辩证归因模式，避免习得性无助"}]}],"id":"紫薯5-34"},{"num":35,"title":"35 教学原则、评价与师生关系","subject":"教原","blocks":[{"t":"运用的教学原则","items":[{"t":"因材施教：针对基础差异设计分层任务，有的放矢、扬长避短","d":"原则：教师要从学生的实际情况和个性特点出发，有的放矢地进行差异化教学，使每个学生都能扬长避短，获得最佳发展。案例中，李老师针对学生学习基础差异设计分层任务，分别设置字词学习、段落分析、拓展创作三类学习要求，做到有的放矢，促使每位学生都能在自身原有水平上获得发展，体现了因材施教原则。②。"},{"t":"启发性：不直接讲答案，以问题链引导思考、组织分组讨论","d":"原则：教师要对学生进行启发，而不是告诉学生现成的答案，这有利于调动学生的主动性，促使学生在教师的引导下积极思考，自觉地掌握科学知识，提高分析问题和解决问题的能力。案例中，李老师很少直接讲解答案，而是通过一连串的问题引导学生思考，组织学生分组讨论，充分调动了学生的主动性，符合启发性原则的核心要求。（2）案例中体现的教学评价类型及其特点：①形成性评价：贯穿教学全过程，核心是即时反馈、优化学习。案例中，李老师通过课堂点评、作文批改等方式，给予学生具体的修改建议，关注学生点滴进步，体现了形成性评价即时性、指导性与激励性的特点。②总结性评价：在学期教学结束后实施，用于全面评定学生的学习成效。案例中，李老。"}]},{"t":"体现的教学评价类型","items":[{"t":"形成性评价：贯穿教学全程，即时反馈、优化学习","d":"贯穿教学全过程，核心是即时反馈、优化学习。案例中，李老师通过课堂点评、作文批改等方式，给予学生具体的修改建议，关注学生点滴进步，体现了形成性评价即时性、指导性与激励性的特点。②。"},{"t":"总结性评价：学期末全面评定学业成效，全面性、综合性","d":"在学期教学结束后实施，用于全面评定学生的学习成效。案例中，李老师撰写涵盖学业成绩、课堂表现、学习习惯、人际交往等多个维度的个性化评语，综合评判学生整体发展状况，体现了总结性评价全面性、综合性的特点。（3）案例中的李老师与学生建立了民主平等、尊师爱生、教学相长、心理相容的新型良好师生关系。①民主平等：李老师尊重学生个体差异，不以统一的标准要求所有学生，并通过分组讨论让每位学生平等参与课堂互动。②尊师爱生：李老师耐心引导学生，给予积极正向的激励，以发展的眼光看待厌学学生，充分体现教育关怀。学生感受到尊重与信任，主动向老师请教问题，师生之间相互尊重、彼此关爱。③教学相长：李老师通过设问启发学生思考。"}]},{"t":"新型良好师生关系","items":[{"t":"民主平等：尊重个体差异，不以统一标准要求所有学生","d":"尊师爱生、教学相长、心理相容的新型良好师生关系。"},{"t":"尊师爱生：耐心引导、正向激励，学生主动请教、彼此关爱"},{"t":"教学相长：设问启发助力成长，学生生活分享丰富教学素材","d":"李老师通过设问启发学生思考，助力学生成长；学生的真实生活分享为教学提供了丰富素材，师生在互动交流中相互促进、共同提升。"},{"t":"心理相容：关系融洽、彼此信任，情感上相互接纳、产生共鸣","d":"的新型良好师生关系。①民主平等：李老师尊重学生个体差异，不以统一的标准要求所有学生，并通过分组讨论让每位学生平等参与课堂互动。②尊师爱生：李老师耐心引导学生，给予积极正向的激励，以发展的眼光看待厌学学生，充分体现教育关怀。学生感受到尊重与信任，主动向老师请教问题，师生之间相互尊重、彼此关爱。③教学相长：李老师通过设问启发学生思考，助力学生成长；学生的真实生活分享为教学提供了丰富素材，师生在互动交流中相互促进、共同提升。④心理相容：师生关系融洽，彼此信任。厌学学生在李老师正向评价的鼓舞下重拾学习兴趣，这体现出师生在情感上相互接纳、产生共鸣。36.。"}]}],"id":"紫薯5-35"},{"num":36,"title":"36 学习动机理论与作用","subject":"教心","blocks":[{"t":"案例体现的学习动机理论","items":[{"t":"强化理论：正强化增强正确回答倾向，正向反馈减少挫败感","d":"期望一价值理论（成就动机理论）、自我效能感理论和成败归因理论。"},{"t":"期望—价值理论：按成就动机类型匹配任务难度与评分标准"},{"t":"自我效能感理论：替代性经验与言语说服提升自我效能感","d":"班杜拉认为，自我效能感是个体对自己能否成功完成某一行为的主观判断，其来源包括言语说服、替代性经验等。案例中，焦老师“向学生讲述与他们学习基础相近的学长学姐在学业上取得成就的经历”，为学生提供了可参照的替代性经验，增强学生“学长学姐能做到，我也能做到”的信念；同时通过课堂上的及时鼓励与耐心引导，以言语说服的方式提升学生的自我效能感。"},{"t":"成败归因理论：成功归因于努力，失败归因于策略不当等","d":"①学习动机的强化理论：动机由外部刺激引发，强化是维持和增强行为的重要因素。案例中，焦老师对回答正确的学生给予及时的反馈和鼓励，通过正强化增强学生正确回答的行为倾向；同时对不会回答的学生耐心引导并肯定其思考过程，以正向反馈减少学生的挫败感，维持其学习积极性，体现了强化理论的应用。②期望一价值理论（成就动机理论）：个体的成就动机可分为追求成功和避免失败两种倾向，任务难度与评价标准直接影响动机水平。案例中，焦老师“向喜欢挑战的学生提问难度适中的问题，向害怕失败的学生提问相对简单的问题，并采用相适配的评分标准”，正是针对不同成就动机类型的学生匹配适宜的任务难度，使各类学生都能获得成功的期望与价值体验。"}]},{"t":"学习动机的含义与作用","items":[{"t":"含义：引起和维持学习活动、朝向学习目标的内部心理状态","d":"裴斯泰洛齐确信，人的心理活动存在固有的基本规律，教育心理学化就是要找到这种规律，把教育提高到科学的水平，将教育科学建立在人的心理活动规律的基础上。（2）教育心理学化的基本要求。①教育目的的心理学化。要求将教育的目的和教育的理论指导置于儿童本性发展的自然法则的基础上。教育者必须充分认识到，人生来具有天赋的潜能，这种潜能不但有要求不断发展的内在倾向和内心动力，而且还有一定的发展规律。②教育内容的心理学化。必须使教育内容的选择和编制适合儿童的学习心理规律。教育应以广泛的基础知识课程使儿童的本性得到全面、均衡的发展，并努力探索教育内容中普遍存在的基本要素。③教学原则和教学方法的心理学化。"},{"t":"引发作用：学习需要引发内驱力，唤起激动状态与学习行为","d":"当学生对某些知识或技能产生迫切的学习需要时，就会引发学习内驱力，唤起内部的激动状态，产生焦急、渴求等心理体验，并最终引发一定的学习行为。②。"},{"t":"定向作用：以学习需要和期待为出发点，指向一定学习目标","d":"学习动机以学习需要和学习期待为出发点，使学生的学习行为在初始状态时就指向一定的学习目标，并推动学生为达到这一目标而努力。③。"},{"t":"维持作用：动机水平高者能持久坚持，低者缺乏稳定性","d":"学习动机水平高的学生能在长时间的学习活动中保持认真的态度和坚持完成学习任务的毅力，而学习动机水平低的学生则缺乏学习行为的稳定性和持久性。④。"},{"t":"调节作用：调节学习行为的强度、时间和方向","d":"学习动机调节学习行为的强度、时间和方向。如果行为活动未达到既定目标，学习动机还将驱使学生转换行为活动方向以达到既定目标。"}]}],"id":"紫薯5-36"}]},{"id":"紫薯6","name":"紫薯6","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 宋代书院的特点","subject":"中教史","blocks":[{"t":"书院概况","items":[{"t":"中国古代特有的教育组织形式，形成和兴盛于宋代","d":"宋代书院提倡自由讲学，在功能上集教学、研究、藏书及祭祀于一身，成为独立于官学与私学之外的重要教育机构。它在教学与管理层面形成了独具特色的制度，具体论述如下：。"},{"t":"提倡自由讲学，集教学、研究、藏书及祭祀于一身","d":"在功能上集教学、研究、藏书及祭祀于一身，成为独立于官学与私学之外的重要教育机构。它在教学与管理层面形成了独具特色的制度，具体论述如下：。"},{"t":"独立于官学与私学之外的重要教育机构","d":"的重要教育机构。它在教学与管理层面形成了独具特色的制度，具体论述如下：（1）宋代书院在教学层面的基本特点：（7.5分）①明确培养实用人才的教学目的。书院旨在培养博学多闻、有道德、有理想、胸怀天下的实用人才。②教学内容以儒家经典为主。书院主要传授儒家所宣扬的人伦道德之道和治国安邦之术，大多选用儒家经典和理学家的著作作为教材。③实行教学与研究相结合的教学组织形式。书院将教学与学术研究紧密结合，逐步形成了讲会制度，该制度与近代的学会相似。④教学方法注重集中讲授与自学讨论相结合。书院的课堂教学以集中讲授为主，同时高度重视学生的自学与讨论。⑤师生关系融洽、平等。书院内部师生关系融洽，倡导师生之间自由平等。"}]},{"t":"教学层面的基本特点","items":[{"t":"明确培养实用人才的教学目的，培养博学多闻、胸怀天下之人","d":"学目的。书院旨在培养博学多闻、有道德、有理想、胸怀天下的实用人才。②。"},{"t":"教学内容以儒家经典为主，兼采理学家著作作为教材","d":"主。书院主要传授儒家所宣扬的人伦道德之道和治国安邦之术，大多选用儒家经典和理学家的著作作为教材。③实行教学与研究相结合的教学组织形式。书院将教学与学术研究紧密结合，逐步形成了讲会制度，该制度与近代的学会相似。④。"},{"t":"教学与研究相结合，逐步形成讲会制度","d":"的教学组织形式。书院将教学与学术研究紧密结合，逐步形成了讲会制度，该制度与近代的学会相似。"},{"t":"教学方法注重集中讲授与自学讨论相结合","d":"与自学讨论相结合。书院的课堂教学以集中讲授为主，同时高度重视学生的自学与讨论。⑤师生关系融洽、平等。书院内部师生关系融洽，倡导师生之间自由平等的交往。（2）宋代书院在管理层面的基本特点：（7.5分）①书院实行山长负责制。书院的主持者称为山长或洞主，全面负责书院的组织管理与教育教学工作。②书院生徒来源广泛且有选拔机制。生徒以官学、私学各级学校的学生为主，其中的优秀者可通过考试选拔进入书院学习。③书院制定明确的学规。《白鹿洞书院揭示》成为书院教学的总方针，明确了书院的教育宗旨、教育教学原则、生活基本守则等根本问题。④书院经费从自筹逐渐走向官助。书院初期以自筹经费为主，之后逐渐出现了官办和私办官助等。"},{"t":"师生关系融洽、平等，倡导自由平等的交往","d":"平等。书院内部师生关系融洽，倡导师生之间自由平等的交往。"}]},{"t":"管理层面的基本特点","items":[{"t":"实行山长负责制，山长（洞主）全面负责组织管理与教学","d":"书院的主持者称为山长或洞主，全面负责书院的组织管理与教育教学工作。"},{"t":"生徒来源广泛且有选拔机制，以官学私学各级学生为主","d":"机制。生徒以官学、私学各级学校的学生为主，其中的优秀者可通过考试选拔进入书院学习。③书院制定明确的学规。《白鹿洞书院揭示》成为书院教学的总方针，明确了书院的教育宗旨、教育教学原则、生活基本守则等根本问题。④书院。"},{"t":"制定明确学规，《白鹿洞书院揭示》为教学总方针"},{"t":"经费从自筹逐渐走向官助，出现官办与私办官助形式","d":"助。书院初期以自筹经费为主，之后逐渐出现了官办和私办官助等形式。官方资助主要有拨划学田、赠赐房屋等形式。⑤。"},{"t":"书院发展呈现官学化倾向，逐步成为科举的附庸","d":"向。自南宋起，书院出现官学化倾向，政府加强对书院的控制，书院陆续被纳入官学体系，逐步成为科举的附庸。32.。"}]}],"id":"紫薯6-31"},{"num":32,"title":"32 赞科夫发展性教学理论","subject":"外教史","blocks":[{"t":"教育目的与一般发展","items":[{"t":"教学要在学生的一般发展上取得尽可能大的效果","d":"展上取得尽可能大的效果”，目的是促进学生“理想的一般发展”，这就是发展性教学的思想。（2）“一般发展”的含义：一般发展包括智力的发展、道德情感的发展、意志的发展、身体的发育等各个方面。（3）发展性教学理论的教学原则：（7.5分）①以高难度进行教学的原则：这里的“难度”有两层含义，一是指学习材料有一定的难度，二是指学习内容需要经过学生的努力才能掌握，难度限定在最近发展区内。②以高速度进行教学的原则：教学要不断引导学生向前发展，不断启迪学生的智慧，使学生能深刻理解所学知识。速度的把握是根据是否能促进学生的一般发展来决定的。③理论知识起主导作用的原则：理论知识是指一门课程的知识结构，掌握课程的知识结。"},{"t":"一般发展包括智力、道德情感、意志、身体发育等方面","d":"的发展、道德情感的发展、意志的发展、身体的发育等各个方面。"}]},{"t":"发展性教学的教学原则","items":[{"t":"以高难度进行教学：难度限定在最近发展区内","d":"的原则：这里的“难度”有两层含义，一是指学习材料有一定的难度，二是指学习内容需要经过学生的努力才能掌握，难度限定在最近发展区内。②。"},{"t":"以高速度进行教学：不断引导学生向前发展、启迪智慧","d":"的原则：教学要不断引导学生向前发展，不断启迪学生的智慧，使学生能深刻理解所学知识。速度的把握是根据是否能促进学生的一般发展来决定的。③。"},{"t":"理论知识起主导作用：掌握课程知识结构，融会贯通","d":"的原则：理论知识是指一门课程的知识结构，掌握课程的知识结构的目的是让学生能融会贯通所学知识，能举一反三。④。"},{"t":"使学生理解学习过程：掌握获得知识的方法与途径","d":"的原则：让学生通过自己的智力活动去探索获得知识的方法和途径，掌握学习过程的特点和规律。⑤使班上全体学生（包括最差的学生）获得一般发展的原则：赞科夫认为，在传统教学条件下，差生在发展上几乎毫无进展，是因为传统教学没有把学生的一般发展当作最重要的任务。他认为教学要解决学生学习差的问题，增强学生的学习信心，培养他们的求知欲，发展他们所缺乏的心理品质。（4）评价：以发展性教学理论的教学原则为重要标志的实验教学论体系，是赞科夫首创的苏联发展性教学的第一例完整体系。这一体系揭示了教学的结构与学生的发展进程之间的因果联系，提出了在教学实践中促进儿童的一般发展的原则和具体途径。但是，赞科夫把他的新体系与“传统。"},{"t":"使班上全体学生（包括最差学生）获得一般发展"}]},{"t":"评价","items":[{"t":"首创苏联发展性教学的第一例完整体系，揭示因果联系"},{"t":"把新体系与传统教学论截然对立、以革新派自居，做法欠妥"}]}],"id":"紫薯6-32"},{"num":33,"title":"33 课程目标的功能与落实","subject":"教原","blocks":[{"t":"课程目标的基本功能","items":[{"t":"导向功能：为课程内容取舍、教学活动设计指明方向","d":"为课程内容取舍、教学活动设计指明方向。该校围绕三大课程目标开发特色课程、打造活力课堂，锚定育人方向，体现了导向功能。②。"},{"t":"调控功能：作为教学实施参照标准，及时调整策略与节奏","d":"作为教学实施的参照标准，可及时调整教学策略与节奏，保障育人过程不偏离核心目标。该校围绕课程目标融入“活力思维”育人框架，规范课程实施，体现了调控功能。③。"},{"t":"评价功能：检验课程实施效果，评判课程目标的达成度","d":"检验课程实施效果的核心标尺。该校通过学生通用核心素养及特色素养的发展情况，评判课程目标的达成度，体现了评价功能。（2）该校“七彩阳光”课程目标的设计依据：课程目标的制定需以学习者、社会、学科为三大核心依据。①立足学习者的成长需求。课程目标的设计需遵循学生身心发展规律，尊重个体差异，满足学生个性化成长需求。该校围绕学生的成长需求设计课程，提出培养学生的生长力、绽放力与创新力，注重培养学生的个性素养，致力于让每个孩子都能发挥自身优势、绽放独有光彩，充分体现了对学生个体差异与发展需求的尊重与回应。②顺应社会发展的时代要求。课程目标需要紧跟时代发展，满足社会对人才的培养需求。新时代教育强调培养全面发。"}]},{"t":"课程目标的设计依据","items":[{"t":"立足学习者成长需求：遵循身心发展规律，尊重个体差异","d":"满足学生个性化成长需求。该校围绕学生的成长需求设计课程，提出培养学生的生长力、绽放力与创新力，注重培养学生的个性素养，致力于让每个孩子都能发挥自身优势、绽放独有光彩，充分体现了对学生个体差异与发展需求的尊重与回应。"},{"t":"顺应社会发展时代要求：兼顾通用核心素养与特色素养"},{"t":"契合学科知识育人逻辑：以学科知识体系为载体","d":"发挥学科育人价值。该校课程目标不仅覆盖文化基础等通用核心素养，夯实学生的学科根基，还通过特色课程、活力课堂，将知识学习延伸至能力拓展与品格涵养层面，实现知识学习与育人目标的有机统一。"}]},{"t":"落实课程目标的路径","items":[{"t":"细化目标层级，将课程目标转化为可操作的教学目标","d":"目标转化为可操作的教学目标。依据新课改的要求，教师要将该校“培养学生的生长力、绽放力与创新力”的课程总目标，拆解为单元目标与课时教学目标，把“活力思维”育人框架融入日常教学设计，结合学情分层落实，使宏观的课程目标转化为具体可落地的课堂教学要求。②转变教学方式，践行新课改育人理念。教师应创设自主、合作、探究的学习情境，打造活力课堂，在知识传授的同时，兼顾学生通用核心素养和特色素养的培育，实现知识学习与素养培育的统一。③优化教学评价方式，发挥评价的导向与激励功能。遵循新课改发展性评价理念，以课程目标为评价依据，实施过程性评价与多元化评价，既关注学生的学习结果，也重视学生的成长过程，全面衡量学生素养。"},{"t":"转变教学方式，创设自主、合作、探究的学习情境","d":"践行新课改育人理念。教师应创设自主、合作、探究的学习情境，打造活力课堂，在知识传授的同时，兼顾学生通用核心素养和特色素养的培育，实现知识学习与素养培育的统一。"},{"t":"优化教学评价，实施过程性评价与多元化评价","d":"方式，发挥评价的导向与激励功能。遵循新课改发展性评价理念，以课程目标为评价依据，实施过程性评价与多元化评价，既关注学生的学习结果，也重视学生的成长过程，全面衡量学生素养发展水平，坚持以评促教，保障课程目标有效达成。【答案要点】（1）对该校做法的分析：元认知策略强调学习者对自己认知过程的计划、监控和调节能力，包括计划策略、监控策略、调节策略。该校实施的“学习成长手册”体现了上述三种策略的有效融合。"}]}],"id":"紫薯6-33"},{"num":34,"title":"34 元认知策略与培养方法","subject":"教心","blocks":[{"t":"元认知策略的含义","items":[{"t":"强调学习者对认知过程的计划、监控和调节能力","d":"包括计划策略、监控策略、调节策略。该校实施的“学习成长手册”体现了上述三种策略的有效融合。"},{"t":"包括计划策略、监控策略、调节策略三类，手册体现三者融合","d":"略、调节策略。该校实施的“学习成长手册”体现了上述三种策略的有效融合。①学生每周记录“我下周的学习计划”，体现了计划策略的应用。学生在学习活动开始前设定具体目标、明确学习重点，有助于提升学习的方向性与主动性。②学生通过“我掌握了什么”“我还有哪些不懂”的反思内容，对自己的学习情况进行自我监控，体现了监控策略的应用。这种自我检查促使学生识别已掌握和未掌握的内容，形成对学习状态的清晰认知。③学生在持续开展反思记录的过程中，逐渐发展出根据反思结果调整学习计划的能力，体现了调节策略的应用。这种动态调整机制帮助学生修正不合理的学习方式，提高学习的针对性和效率。（2）教师在日常教学中培养学生的元认知能力的。"}]},{"t":"三种策略的具体体现","items":[{"t":"计划策略：记录“我下周的学习计划”，设定目标与学习重点","d":"监控策略、调节策略。该校实施的“学习成长手册”体现了上述三种策略的有效融合。"},{"t":"监控策略：以“我掌握了什么”反思自检，识别已未掌握内容","d":"调节策略。该校实施的“学习成长手册”体现了上述三种策略的有效融合。"},{"t":"调节策略：依据反思结果调整学习计划，修正不合理方式","d":"该校实施的“学习成长手册”体现了上述三种策略的有效融合。①学生每周记录“我下周的学习计划”，体现了计划策略的应用。学生在学习活动开始前设定具体目标、明确学习重点，有助于提升学习的方向性与主动性。②学生通过“我掌握了什么”“我还有哪些不懂”的反思内容，对自己的学习情况进行自我监控，体现了监控策略的应用。这种自我检查促使学生识别已掌握和未掌握的内容，形成对学习状态的清晰认知。③学生在持续开展反思记录的过程中，逐渐发展出根据反思结果调整学习计划的能力，体现了调节策略的应用。这种动态调整机制帮助学生修正不合理的学习方式，提高学习的针对性和效率。（2）教师在日常教学中培养学生的元认知能力的方法：①强化。"}]},{"t":"培养元认知能力的方法","items":[{"t":"强化元认知意识，丰富元认知知识","d":"元认知知识。教师应向学生阐明元认知策略的意义和作用，如通过具体实例讲解“学习计划如何影响学习效果”“自我检测如何发现知识盲点”等，引发学生对自身学习过程的关注。②。"},{"t":"指导目标设定与计划制订，提供分阶段学习建议","d":"订。教师应引导学生制订具体、可操作的学习目标，并根据实际情况提供分阶段的学习建议，如利用阶段测验结果，引导学生反思学习进度，修订学习方案。③培养自我监控的学习习惯。教师可通过“学习日志”“课堂回顾”等形式，鼓励学生每天或每周记录学习内容、梳理知识困惑、复盘学习策略，从而提升学生对学习过程的感知与调控能力。④。"},{"t":"培养自我监控习惯：以学习日志、课堂回顾记录梳理"},{"t":"促进自我调节与自我评价：自我评价表、学习进展记录图","d":"价。教师可提供“自我评价表”或设计“学习进展记录图”，引导学生主动检查学习成效，识别自身不足并调整学习方式；也可组织开展同伴互评，进一步强化学生的反思意识与调节能力。35.。"}]}],"id":"紫薯6-34"},{"num":35,"title":"35 小组合作学习与讨论法","subject":"教原","blocks":[{"t":"合作学习流于形式的原因","items":[{"t":"违背教师主导与学生主体相统一：缺乏分工指导与监控","d":"体相统一的规律。教学既要充分发挥学生的主观能动性，也不能忽视教师的组织、引导与调控。案例中，肖老师仅布置合作学习任务，却未对小组分工、讨论过程进行有效指导与监控，也未针对学生差异实施分层引导，导致教师主导作用发挥不足；学生因缺乏有效引导而参与动力不足，主体性未能充分发挥，引发相互推诿、参与不均等问题。②。"},{"t":"违背掌握知识与发展能力相统一：讨论偏离主题，无实效","d":"力相统一的规律。教学应在传授知识的同时发展学生的智力与综合能力。案例中，小组讨论偏离教学主题，汇报难以产出有效观点，既没有促成学生对知识的深度理解，也未能借助合作探究发展学生协作交流、问题探究的能力，使得小组合作学习徒有形式，没有实效。（2）教师运用讨论法开展教学的基本要求：①讨论前做好充分准备。教师应明确讨论主题与任务，进行合理分组与分工，确保学生具备相应的知识基础。案例中，肖老师缺乏前置规划，导致小组分工混乱，讨论缺乏明确方向。②讨论中做好引导与调控。教师要巡视各小组活动进展，及时纠偏，引导全体学生参与，避免少数优等生垄断发言。案例中，肖老师全程缺位，直接导致学生参与度两极分化，讨论偏离教。"}]},{"t":"运用讨论法的基本要求","items":[{"t":"讨论前充分准备：明确主题任务，合理分组分工"},{"t":"讨论中引导调控：巡视纠偏，避免少数优等生垄断发言","d":"案例中，肖老师全程缺位，直接导致学生参与度两极分化，讨论偏离教学主题。"},{"t":"讨论后总结提升：梳理讨论成果，深化对核心问题认知"}]},{"t":"优化学习方式的路径","items":[{"t":"锚定育人目标，杜绝形式主义，紧扣教学目标开展活动","d":"式主义。以核心素养培育为导向设计学习任务，紧扣教学目标开展合作、探究活动，避免“为合作而合作”的表演式学习，破解案例中课堂气氛看似活跃却无实质性探究的问题。②。"},{"t":"融合多元学习方式：自主学习为基础、合作与探究为核心","d":"形成协同效应。以自主学习为基础、合作学习为载体、探究学习为核心，实现三者有机衔接、层层递进，而非孤立使用单一学习方式。开展合作交流前，要预留独立思考的时间，确保学生带着个人见解参与讨论，防止出现案例中学困生被动旁观、讨论缺乏深度等问题。③。"},{"t":"完善配套支撑：分组规则、任务分工与过程性评价机制","d":"保障实施成效。建立科学的分组规则、明确的任务分工以及多元化的过程性评价机制，为学习方式变革提供制度支撑，切实提升育人质量。36.。"}]}],"id":"紫薯6-35"},{"num":36,"title":"36 学习策略与学习效果","subject":"教心","blocks":[{"t":"原有学习方式的问题","items":[{"t":"死记硬背，对知识缺乏意义理解","d":"对知识缺乏意义理解；不善于建构知识结构；缺乏对知识的主动加工与应用，容易出现知识遗忘较快、知识迁移困难等问题。案例中，三种教学建议对应的学习策略及各学习策略的作用：。"},{"t":"不善于建构知识结构","d":"缺乏对知识的主动加工与应用，容易出现知识遗忘较快、知识迁移困难等问题。案例中，三种教学建议对应的学习策略及各学习策略的作用：。"},{"t":"缺乏对知识的主动加工与应用，遗忘快、迁移困难","d":"与应用，容易出现知识遗忘较快、知识迁移困难等问题。案例中，三种教学建议对应的学习策略及各学习策略的作用：①复述策略：班主任鼓励小雨用自己的语言复述重点内容或向同学讲解所学知识，属于复述策略的运用。该策略通过对学习材料进行重复加工，维持工作记忆中的信息，推动信息向长时记忆转化。②组织策略：班主任指导小雨借助图表、知识框架梳理笔记、厘清知识点关联，属于组织策略的运用。该策略通过对信息归类整合、建构知识结构，帮助学生厘清知识间内在关联，提高信息的提取效率。③精细加工策略：班主任运用类比法，结合拉窗帘、爬坡等生活实例帮助小雨理解抽象概念，属于精细加工策略的运用。该策略通过将新学知识与个体已有经验建立联。"}]},{"t":"三种学习策略及作用","items":[{"t":"复述策略：用自己的语言复述或向同学讲解，推动长时记忆","d":"班主任鼓励小雨用自己的语言复述重点内容或向同学讲解所学知识，属于复述策略的运用。该策略通过对学习材料进行重复加工，维持工作记忆中的信息，推动信息向长时记忆转化。②。"},{"t":"组织策略：借助图表、知识框架梳理笔记，提高提取效率","d":"班主任指导小雨借助图表、知识框架梳理笔记、厘清知识点关联，属于组织策略的运用。该策略通过对信息归类整合、建构知识结构，帮助学生厘清知识间内在关联，提高信息的提取效率。③。"},{"t":"精细加工策略：用类比法结合生活实例，促进深层理解","d":"班主任运用类比法，结合拉窗帘、爬坡等生活实例帮助小雨理解抽象概念，属于精细加工策略的运用。该策略通过将新学知识与个体已有经验建立联结，促进学生对概念的深层加工和理解。（2）案例中的学习策略对小雨学习效果的提升机制具体如下：①优化认知编码，改善知识存储。复述策略能强化信息在工作记忆中的加工，精细加工策略能在新旧知识之间建立联系，组织策略帮助建构知识网络。三种策略共同实现了对知识的深层意义编码，将信息更有效地转入长时记忆，从而提升记忆的牢固程度，减少遗忘，改变小雨机械记忆的学习方式。②提高知识的迁移能力与应用能力。组织策略厘清概念之间的逻辑关系，精细加工策略借助生活实例理解抽象原理，帮助小雨更好。"}]},{"t":"学习策略的提升机制","items":[{"t":"优化认知编码，改善知识存储，减少遗忘","d":"识存储。复述策略能强化信息在工作记忆中的加工，精细加工策略能在新旧知识之间建立联系，组织策略帮助建构知识网络。三种策略共同实现了对知识的深层意义编码，将信息更有效地转入长时记忆，从而提升记忆的牢固程度，减少遗忘，改变小雨机械记忆的学习方式。②。"},{"t":"提高知识的迁移能力与应用能力，摆脱情境依赖","d":"应用能力。组织策略厘清概念之间的逻辑关系，精细加工策略借助生活实例理解抽象原理，帮助小雨更好地将抽象知识迁移到实际问题情境中，提高其解题的灵活性，摆脱题目情境发生变化便无从作答的困境。"}]}],"id":"紫薯6-36"}]},{"id":"紫薯7","name":"紫薯7","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 隋唐教育管理制度","subject":"中教史","blocks":[{"t":"改革背景","items":[{"t":"隋唐是我国封建社会高度繁荣的阶段"},{"t":"为加强对教育事业的统一管理，选拔符合统治阶级需求的人才","d":"隋唐两代在中央教育管理机构与官学内部管理制度方面进行了系统性的改革，建立了一套完备的教育管理机制，对后世产生了深远影响。具体论述如下：。"},{"t":"在中央教育管理机构与官学内部管理制度上进行系统性改革","d":"官学内部管理制度方面进行了系统性的改革，建立了一套完备的教育管理机制，对后世产生了深远影响。具体论述如下：（1）隋唐中央教育管理机构的演变：①为了加强对教育事业的管理和领导，隋文帝在中央设置了国子寺，内设国子祭酒一人，总管教育事业。国子寺及国子祭酒的设置是我国历史上第一次设立专门管理教育的政府机构和设置专门教育行政长官的开始，标志着我国古代封建教育已经发展到了能独立于其他部门的时代，这在中国古代教育史上具有重大意义。②国子寺因事务日益繁杂，后脱离太常寺独立发展，并改名为国子学。隋炀帝时期，国子学又改名为国子监。③唐初为恢复旧传统、精简行政机构，将国子学附设于太常寺，管理国子学、太学、四门学三学。"}]},{"t":"中央教育管理机构的演变","items":[{"t":"隋文帝设国子寺，内设国子祭酒，首次设立专门管理教育的政府机构","d":"一人，总管教育事业。国子寺及国子祭酒的设置是我国历史上第一次设立专门管理教育的政府机构和设置专门教育行政长官的开始，标志着我国古代封建教育已经发展到了能独立于其他部门的时代，这在中国古代教育史上具有重大意义。"},{"t":"国子寺脱离太常寺独立发展并改称国子学，隋炀帝时改称国子监"},{"t":"唐初精简行政机构，国子学附设于太常寺，管理国子学、太学、四门学","d":"主要学习儒家经典，律学主要学习唐代律令。各类学校的课程均规定了修业期限。"},{"t":"贞观元年唐太宗令国子学脱离太常寺改称国子监，成为与太常寺平行的独立机构","d":"国子监既是中央政府教育行政机构，也是国家最高学府，它的设立标志着我国学校管理走向专门化。此后虽有改朝换代，但国子监仍然长期延续，直到清末学部成立为止。"},{"t":"国子监既是中央教育行政机构又是最高学府，标志学校管理走向专门化"}]},{"t":"入学与学礼制度","items":[{"t":"实行等级入学制度：贵族、官僚子弟享有优先入学特权；广文生不受年龄限制","d":"唐代中央官学实行等级入学制度，贵族、官僚子弟享有优先入学的特权。凡申请入国子监的学生，均有一定的年龄限制。唯有广文生不受年龄限制。②。"},{"t":"确立定期学礼制度：束脩之礼、国学释奠礼、贡士谒见及使者观礼","d":"主要包括束修之礼、国学释奠礼、贡士谒见及使者观礼。这类定期性的隆重礼仪活动对学生进行崇儒尊师、登科从政的教育，起到思想熏陶的作用。③设定各类学校的教学制度。不同类型学校的学习内容各有侧重。例如，国子学、太学、四门学主要学习儒家经典，律学主要学习唐代律令。各类学校的课程均规定了修业期限。④建立系列化的考核制度。国子监为督促学生学业，设置旬试、月试、季试等阶段性考试，形成了完整的考试体系。⑤严格执行惩罚制度。国子监主簿负责执行学规，督促学生勤学，维护国子监的教学和生活秩序，对不率师教、学业无成、假违程限、作乐杂戏的学生予以惩罚。⑥制定合理的休假制度。中央官学在遵循国家统一休假规定的基础上，兼顾学。"},{"t":"学礼活动使学生受崇儒尊师、登科从政教育，起到思想熏陶作用"}]},{"t":"教学、考核与休假制度","items":[{"t":"设定各类学校教学制度：儒经与律令各有侧重，课程规定修业期限"},{"t":"建立系列化考核制度：旬试、月试、季试等，形成完整考试体系"},{"t":"严格执行惩罚制度：国子监主簿执行学规，惩罚不率师教、学业无成者","d":"国子监主簿负责执行学规，督促学生勤学，维护国子监的教学和生活秩序，对不率师教、学业无成、假违程限、作乐杂戏的学生予以惩罚。⑥制定合理的休假制度。中央官学在遵循国家统一休假规定的基础上，兼顾学生身心发展需求，适当安排旬假、田假、授衣假等常规假期。32.。"},{"t":"制定合理休假制度：旬假、田假、授衣假，兼顾学生身心发展需求","d":"等常规假期。【答案要点】福禄培尔是19世纪德国著名的教育家、幼儿园的创立者、近代学前教育理论的奠基人，被誉为“幼儿教育之父”。蒙台梭利是20世纪意大利著名的幼儿教育家，创办了“儿童之家”，形成了著名的蒙台梭利教学法，推动了新教育运动及儿童教育运动的发展。两位幼儿教育家的教育思想既有相同点，也有不同点。"}]}],"id":"紫薯7-31"},{"num":32,"title":"32 福禄培尔与蒙台梭利","subject":"外教史","blocks":[{"t":"两位幼儿教育家","items":[{"t":"福禄培尔：19世纪德国教育家，幼儿园创立者，被誉为“幼儿教育之父”","d":"是19世纪德国著名的教育家、幼儿园的创立者、近代学前教育理论的奠基人，被誉为“幼儿教育之父”"},{"t":"蒙台梭利：20世纪意大利幼儿教育家，创办“儿童之家”，形成蒙台梭利教学法","d":"是20世纪意大利著名的幼儿教育家，创办了“儿童之家”，形成了著名的蒙台梭利教学法，推动了新教育运动及儿童教育运动的发展。两位幼儿教育家的教育思想既有相同点，也有不同点。（1）相同点：①在儿童地位上，他们都反对传统教育对儿童身心的束缚和压迫，主张以儿童为本位，强调教育中自由及活动的重要性。②在儿童教育的理论和实践上，他们都建立了幼儿教育理论体系和专门的幼儿教育机构。福禄培尔建立了幼儿园，蒙台梭利创办了“儿童之家”。③在影响上，他们的教育思想都对世界各国幼儿教育的发展产生了深远的影响。（2）不同点：①教育方法：福禄培尔关于幼儿园教育方法的基本原理是自我活动或自动性，他认为游戏是儿童内在本质向外的自。"}]},{"t":"相同点","items":[{"t":"在儿童地位上都反对传统教育对儿童身心的束缚和压迫，主张以儿童为本位"},{"t":"在理论与实践上都建立了幼儿教育理论体系和专门的幼儿教育机构"},{"t":"在影响上都对世界各国幼儿教育的发展产生了深远影响"}]},{"t":"不同点","items":[{"t":"教育方法：福禄培尔主张自我活动与游戏；蒙台梭利以“工作”结合“纪律”与“自由”","d":"福禄培尔关于幼儿园教育方法的基本原理是自我活动或自动性，他认为游戏是儿童内在本质向外的自发表现，强调应通过游戏来发展儿童的想象力和创造力；蒙台梭利主张让儿童通过“工作”的中介作用把“纪律”与“自由”有机地联系与统一起来。②教育。"},{"t":"组织形式：福禄培尔主张集体教学与集体游戏；蒙台梭利主张个别活动","d":"福禄培尔要求组织集体教学，进行集体游戏，让儿童通过社会参与复演家庭和邻里生活；蒙台梭利主张个别活动、单独学习。③。"},{"t":"教育内容：福禄培尔以活动与游戏为主的课程；蒙台梭利重感官训练与读写算","d":"福禄培尔建立了一个以活动和游戏为主要特征的幼儿园课程体系，包括游戏和歌谣、恩物、手工作业、运动游戏、自然研究等；蒙台梭利儿童教育的内容则包括感官训练，读、写、算的练习，以及实际生活训练。④。"},{"t":"教师作用：福禄培尔主张教师为引导者、组织者；蒙台梭利主张为观察者、指导者","d":"福禄培尔主张教师应该是儿童学习的引导者和组织者，通过讲解、演示和引导等方式，帮助儿童掌握知识和技能；蒙台梭利主张教师应该是儿童学习的观察者和指导者，为儿童提供有准备的环境，帮助儿童自主学习和发展。"}]}],"id":"紫薯7-32"},{"num":33,"title":"33 制度化教育与个体发展","subject":"教原","blocks":[{"t":"教育对个体的双重功能","items":[{"t":"正向个体功能：教育积极促进个体发展，学校制度化生活帮助儿童适应社会","d":"与负向个体功能，即教育对个体发展兼具促进与阻碍的双重作用。"},{"t":"负向个体功能：制度化教育割裂学习生活与本真生活，压抑儿童天性","d":"即教育对个体发展兼具促进与阻碍的双重作用。①教育的正向个体功能：教育对个体发展产生积极促进的作用。材料中，学校的制度化生活能够促进儿童个体社会化，帮助儿童适应社会，为进入成人社会奠定基础，发挥了积极的个体发展作用。②教育的负向个体功能：教育对个体发展产生消极阻碍的作用。材料中，制度化教育割裂儿童的学习生活与本真生活，削弱儿童主体地位，压抑儿童天性，促使儿童变得世故，对儿童发展产生消极影响。（从教育作用的方向和呈现形式来看，教育对个体天性的压抑属于非预期的负向隐性功能，个体社会化则属于教育的正向显性功能。所以，回答负向隐性功能与正向显性功能均可酌情给分。）（2）制度化教育的优势与局限：制度化教。"}]},{"t":"功能性质的判定","items":[{"t":"对儿童天性的压抑属于非预期的负向隐性功能"},{"t":"个体社会化则属于教育的正向显性功能","d":"的正向显性功能。所以，回答负向隐性功能与正向显性功能均可酌情给分。）（2）制度化教育的优势与局限：制度化教育是指由专门的教育人员、机构及其运行机制所构成的教育形态。①优势：制度化教育的出现是人类教育文明的一大进步，也极大地推动了人类整体文明的发展。该教育形式具有较强的组织性与系统性，有利于提高教学效率，保障教学质量。②局限：高度制度化、规范化的教育容易压抑学生天性，弱化儿童的主体地位，造成儿童人格分裂，进而抑制其个性发展。（3）教育制度改进建议：①教育制度的改进应当尊重儿童的主体地位，关照儿童的本真生活，避免制度对儿童生活进行强制改造，兼顾儿童天性发展与个体社会化，消解制度化生活造成的儿童人格。"}]},{"t":"制度化教育的优势与局限","items":[{"t":"制度化教育指由专门的教育人员、机构及其运行机制所构成的教育形态"},{"t":"优势：组织性与系统性较强，利于提高教学效率、保障教学质量"},{"t":"局限：高度制度化、规范化易压抑学生天性，造成儿童人格分裂","d":"制度化教育是指由专门的教育人员、机构及其运行机制所构成的教育形态。①优势：制度化教育的出现是人类教育文明的一大进步，也极大地推动了人类整体文明的发展。该教育形式具有较强的组织性与系统性，有利于提高教学效率，保障教学质量。②局限：高度制度化、规范化的教育容易压抑学生天性，弱化儿童的主体地位，造成儿童人格分裂，进而抑制其个性发展。（3）教育制度改进建议：①教育制度的改进应当尊重儿童的主体地位，关照儿童的本真生活，避免制度对儿童生活进行强制改造，兼顾儿童天性发展与个体社会化，消解制度化生活造成的儿童人格割裂。②教育制度的改进应构建开放型的教育系统，推动办学体制多样化，推行学分制、选课制，给予学生更。"}]},{"t":"教育制度改进建议","items":[{"t":"尊重儿童主体地位与本真生活，避免制度对儿童生活强制改造"},{"t":"构建开放型教育系统，推动办学体制多样化，推行学分制、选课制","d":"推行学分制、选课制，给予学生更多自主选择空间，尊重学生个性发展，激发学生学习主动性。"},{"t":"兼顾制度化与非制度化教育，打通学校、家庭、社会教育壁垒，面向终身教育","d":"教育，打通学校、家庭、社会教育之间的壁垒，吸收非制度化教育的优势，同时面向不同群体发展终身教育体系，以满足多元的教育需求。34.。"}]}],"id":"紫薯7-33"},{"num":34,"title":"34 操作技能的形成与指导","subject":"教心","blocks":[{"t":"技能类型判定","items":[{"t":"骑自行车属于操作技能","d":"操作技能的特点如下：①操作技能的活动对象是物质的、具体的客体或肌肉，具有客观性。②操作动作的执行通过外显的肌肉运动得以实现，具有外显性。③操作活动的各个动作不能合并、省略，必须完整展开，在结构上具有展开性。（2）。"},{"t":"指导与示范属于操作技能形成的认知阶段","d":"能形成的认知阶段，在该阶段，指导者需要帮助学习者理解操作技能，明确学习任务，形成作业期望，并获得一定的完成任务的学习策略。该阶段的教学要求如下：①掌握相关的知识。指导者要帮助学习者梳理必要的先前知识。材料中，在小林正式开始学习骑自行车前，父母先向他讲解骑行的基本安全知识、自行车的基本构造，为小林学习骑行奠定知识基础。②明确练习目的和要求。只有学习者明确所学技能的目的和要求，他们才能自觉地组织自己的行动来掌握这种技能。材料中，小林的父母向他介绍日常通行路段的路况，让小林明白现实骑行的实际要求，便于他更好地开展骑行练习。③形成正确的动作映象。在学习者对所学的操作技能进行练习之前或在练习过程中，指导。"}]},{"t":"操作技能的特点","items":[{"t":"活动对象是物质的、具体的客体或肌肉，具有客观性","d":"体的客体或肌肉，具有客观性。②操作动作的执行通过外显的肌肉运动得以实现，具有外显性。③操作活动的各个动作不能合并、省略，必须完整展开，在结构上具有展开性。（2）指导与示范属于操作技能形成的认知阶段，在该阶段，指导者需要帮助学习者理解操作技能，明确学习任务，形成作业期望，并获得一定的完成任务的学习策略。该阶段的教学要求如下：①掌握相关的知识。指导者要帮助学习者梳理必要的先前知识。材料中，在小林正式开始学习骑自行车前，父母先向他讲解骑行的基本安全知识、自行车的基本构造，为小林学习骑行奠定知识基础。②明确练习目的和要求。只有学习者明确所学技能的目的和要求，他们才能自觉地组织自己的行动来掌握这种技能。"},{"t":"动作执行通过外显的肌肉运动实现，具有外显性"},{"t":"各动作不能合并、省略，必须完整展开，具有展开性"}]},{"t":"认知阶段及其教学要求","items":[{"t":"指导者需帮助学习者理解操作技能、明确学习任务、形成作业期望与学习策略","d":"形成作业期望，并获得一定的完成任务的学习策略。该阶段的教学要求如下：。"},{"t":"掌握相关知识：先讲解骑行安全知识与自行车构造，奠定知识基础"},{"t":"明确练习目的和要求：介绍日常通行路段路况，明了实际要求","d":"只有学习者明确所学技能的目的和要求，他们才能自觉地组织自己的行动来掌握这种技能。材料中，小林的父母向他介绍日常通行路段的路况，让小林明白现实骑行的实际要求，便于他更好地开展骑行练习。③。"},{"t":"形成正确的动作映象：父亲示范启动、平衡、转弯、停车等动作","d":"在学习者对所学的操作技能进行练习之前或在练习过程中，指导者应通过自己的动作示范帮助学习者在头脑中形成正确的动作映象。材料中，小林的父亲系统演示了启动车辆、维持身体平衡、转弯、停车等一系列骑行动作，帮助小林在头脑中形成骑行的正确动作映象。④。"},{"t":"获得一定的学习策略：边示范边讲解平衡技巧，掌握关键动作要领","d":"操作技能的学习也包含学习策略或者窍门问题。一旦学习者利用外加的策略有效地完成任务后，这些策略就会成为学习者的经验，并有可能自发地在后继学习中加以运用。材料中，小林的父亲边示范边讲解维持平衡的技巧，使小林掌握骑行的关键动作要领。35.。"}]}],"id":"紫薯7-34"},{"num":35,"title":"35 课例设计特点与教师素养","subject":"教原","blocks":[{"t":"课例设计的特点","items":[{"t":"生活性：课例贴近学生生活实际，依托已有生活经验开展教学","d":"（现实性）。案例中，数学教师的课例设计贴近学生的生活实际，依托学生已有的生活经验开展教学，体现了课例设计的生活性。②。"},{"t":"综合性：将数学知识与中华优秀传统文化、十二生肖文化相融合","d":"数学教师将数学知识与中华优秀传统文化相结合，将十二生肖文化有机融入数学课堂，体现了课例设计的综合性。③。"},{"t":"探究性：设计开放性问题，激发学生思考、探索与质疑","d":"数学教师设计的问题具有一定的开放性，能够激发学生思考、探索与质疑，体现了课例设计的探究性。④。"},{"t":"趣味性：营造轻松活跃的课堂氛围，调动学生学习兴趣","d":"数学教师的课例设计让教室变成了欢乐的海洋，营造出轻松活跃的课堂氛围，充分调动了学生的学习兴趣，体现了课例设计的趣味性。（2）案例中，教师所采用的教学方法是讨论法。讨论法是学生在教师的指导下为解决某个问题而进行探讨、评析，以明辨是非、获取真知、锻炼思维和培养独立思考能力的方法。案例中，数学教师设置根据属相推算年龄的问题，引发学生的积极思考。学生在课堂上相互质疑、争辩，在集体讨论中逐步深化对生肖与年龄关系的理解，充分体现了讨论法的运用。（3）新时代教师应具备的素养：①高尚的师德。教师要热爱教育事业、关爱学生、严于律己。案例中，数学教师留心观察学生学情，积极思考教学问题，主动优化教学设计，体现了其。"}]},{"t":"教学方法：讨论法","items":[{"t":"讨论法是学生在教师指导下为解决某问题而探讨、评析，以明辨是非、获取真知","d":"获取真知、锻炼思维和培养独立思考能力的方法。案例中，数学教师设置根据属相推算年龄的问题，引发学生的积极思考。学生在课堂上相互质疑、争辩，在集体讨论中逐步深化对生肖与年龄关系的理解，充分体现了讨论法的运用。"},{"t":"案例中教师以属相推算年龄问题引发思考，学生相互质疑争辩、集体讨论深化理解"}]},{"t":"新时代教师应具备的素养","items":[{"t":"高尚的师德：热爱教育事业、关爱学生、严于律己","d":"教师要热爱教育事业、关爱学生、严于律己。案例中，数学教师留心观察学生学情，积极思考教学问题，主动优化教学设计，体现了其对教育事业的热情和对学生发展的关注。②。"},{"t":"宽厚的文化素养：广博的文化知识与深厚的学科底蕴","d":"教师应具备广博的文化知识和深厚的学科底蕴。案例中，数学教师为帮助学生真正理解生肖与年龄的关系，主动查阅大量生肖相关书籍，丰富自身知识储备，并将传统文化与数学教学有机融合，体现了宽厚的文化素养。③。"},{"t":"专门的教育素养：教育理论素养、教育能力素养、教育研究素养","d":"包括教育理论素养、教育能力素养、教育研究素养。案例中，数学教师善于发现学生的学习问题，发挥创造性，自主设计融合传统文化的开放性课例，组织课堂讨论，依靠扎实的教育能力开展教学，体现了良好的专门教育素养。36.。"}]}],"id":"紫薯7-35"},{"num":36,"title":"36 学习迁移类型与促进","subject":"教心","blocks":[{"t":"案例体现的学习迁移类型","items":[{"t":"顺向迁移：先前学习对后继学习的影响，物理“平衡”概念影响化学、生物学习","d":"先前学习对后继学习产生的影响。案例中，学生先在物理课上学习了“平衡”的概念与共性逻辑，并以此为认知基础，影响了后续化学、生物等学科中有关平衡内容的学习，体现了顺向迁移。②。"},{"t":"正迁移：一种学习对另一种学习的积极促进作用，借平衡逻辑理解溶解平衡","d":"一种学习对另一种学习产生的积极促进作用。案例中，学生借助物理课习得的平衡逻辑，快速理解了化学溶解平衡、生物生态平衡的规律，以及运用平衡思路调节自身学习状态，体现了正迁移。③。"},{"t":"负迁移：一种学习对另一种学习的消极阻碍作用，机械套用静态思维造成认知偏差","d":"一种学习对另一种学习产生的消极阻碍作用。案例中，部分学生生硬套用物理的静态思维来理解道德与法治课中的供需平衡，造成认知偏差，体现了负迁移。④。"},{"t":"一般迁移：将习得的一般原理、思维方法迁移到其他具体学习情境","d":"将习得的一般原理、思维方法迁移到其他具体学习情境中。案例中，学生将物理课上提炼出的“平衡是多方制衡下的整体稳定”这一共性思考逻辑迁移至多学科学习与日常生活中，体现了一般迁移。（2）影响学习迁移的主要因素：①学习材料的相似性。两种学习之间的共同要素越多，越容易产生迁移。物理、化学、生物中的“平衡”概念均围绕“稳定状态”展开，相似性较高，因此学生能顺利实现正迁移；而道德与法治中的供需平衡是动态变化的，与物理静态平衡存在本质差异，学生机械套用原有经验，从而产生了负迁移。②原有经验的概括水平。个体对原有知识经验的概括水平越高，迁移的适用范围越广。物理教师引导学生提炼出“平衡是多方制衡下的整体稳定”的。"}]},{"t":"影响学习迁移的主要因素","items":[{"t":"学习材料的相似性：共同要素越多越易迁移，静态与动态平衡存在本质差异","d":"两种学习之间的共同要素越多，越容易产生迁移。物理、化学、生物中的“平衡”概念均围绕“稳定状态”展开，相似性较高，因此学生能顺利实现正迁移；而道德与法治中的供需平衡是动态变化的，与物理静态平衡存在本质差异，学生机械套用原有经验，从而产生了负迁移。②。"},{"t":"原有经验的概括水平：概括水平越高，迁移的适用范围越广","d":"个体对原有知识经验的概括水平越高，迁移的适用范围越广。物理教师引导学生提炼出“平衡是多方制衡下的整体稳定”的共性逻辑，提高了知识的概括程度，使学生能够将该逻辑迁移至多个学科的学习当中。③。"},{"t":"心理定势的作用：定势对学习迁移兼具促进与阻碍的双重作用","d":"定势对学习迁移兼具促进与阻碍的双重作用。学生形成的“平衡即静态对等”的思维定势，在理科同类概念的学习中可以加快理解速度，但将其套用到动态的供需平衡概念时，则会引发认知偏差。④。"},{"t":"教师的教学指导：清晰的教学引导能有效促进学习迁移","d":"清晰的教学引导能有效促进学习迁移。物理教师主动带领学生提炼共性思考逻辑，为学生的跨学科迁移搭建了支架，提升了迁移效果。（3）为促进学生实现有效学习迁移，教师可采取以下教学措施：①整合学科内容。教师应合理编排教学内容，关注不同学科之间的横向关联，挖掘知识间的共通规律，引导学生将某一学科习得的知识与方法，迁移运用到其他学科的学习中。案例中，学生能将物理课习得的“平衡”逻辑，顺利迁移运用到化学、生物等同类概念的学习中，正是得益于学科间内容的有机整合。②加强新旧知识联系。教师应合理安排教学程序，通过课堂提问、适度引导等方式，帮助学生依托已有认知理解新知识，搭建新旧知识之间的联结桥梁，促进新旧知识之间。"}]},{"t":"促进有效迁移的教学措施","items":[{"t":"整合学科内容：合理编排教学内容，关注学科间的横向关联与共通规律","d":"教师应合理编排教学内容，关注不同学科之间的横向关联，挖掘知识间的共通规律，引导学生将某一学科习得的知识与方法，迁移运用到其他学科的学习中。案例中，学生能将物理课习得的“平衡”逻辑，顺利迁移运用到化学、生物等同类概念的学习中，正是得益于学科间内容的有机整合。②。"},{"t":"加强新旧知识联系：通过课堂提问、适度引导，搭建新旧知识的联结桥梁","d":"教师应合理安排教学程序，通过课堂提问、适度引导等方式，帮助学生依托已有认知理解新知识，搭建新旧知识之间的联结桥梁，促进新旧知识之间的纵向迁移。案例中，学生在学习化学溶解平衡、生物生态平衡时，借助之前物理课所学知识快速理解内在规律。这一过程体现了新旧知识有效联系的重要性。③。"},{"t":"强调概括总结：启发学生自主概括原理，厘清概念内涵与适用边界","d":"教师应启发学生自主概括所学原理，结合具体实例厘清概念的内涵与适用边界，提升知识经验的概括水平，为广泛迁移奠定基础。案例中，物理教师引导学生提炼出“平衡是多方制衡下的整体稳定”这一共性思考逻辑，正是通过概括总结促进迁移的典型做法。④。"},{"t":"重视学习策略，培养迁移意识：引导学生反思知识适用场景，主动迁移","d":"移意识。教师应向学生传授基本的认知策略与学习方法，引导学生主动反思知识的适用场景，使其逐步形成主动迁移的意识，最终实现学习能力的广泛迁移。案例中，部分学生将平衡的思路迁移至日常学习生活中，通过均衡分配各科学习时间、调整作息节奏缓解考前焦虑，体现了迁移意识的积极效果。"}]}],"id":"紫薯7-36"}]},{"id":"紫薯8","name":"紫薯8","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 儒家与墨家教育思想","subject":"中教史","blocks":[{"t":"儒家学派概述","items":[{"t":"儒家是春秋战国时期的重要学派，创始人为孔子（孔丘）","d":"重要学派，创始人为孔子（孔丘）。孔子之后，儒家逐步分化出思孟学派与荀子学派两大主要分支。思孟学派继承孔子的仁学思想，形成了重视人的主观能动性的教育观。荀子学派倡导礼治，主张维护等级秩序，提出“性恶论”，并以此作为其外铄论教育思想的理论基础。墨家是与儒家相对立的学派，由墨子（墨翟）创立，代表小生产者的利益。墨家反对贵族特权，追求社会平等，讲求社会实效；在教育上重视经验与实践，注重逻辑思维训练，充分肯定科学技术知识的价值。与儒家相比，墨家在教育方法上具有如下特点：（1）主动：墨子反对儒家“叩则鸣，不叩则不鸣”的被动施教态度，主张“虽不叩必鸣”的“强说人”精神，即使人们不来请教，教育者也应该主动施教。"},{"t":"孔子之后儒家分化为思孟学派与荀子学派两大分支"},{"t":"思孟学派继承仁学思想，形成重视人的主观能动性的教育观"},{"t":"荀子学派倡导礼治、维护等级秩序，提出“性恶论”并以外铄论为理论基础","d":"主张维护等级秩序，提出“性恶论”，并以此作为其外铄论教育思想的理论基础。墨家是与儒家相对立的学派，由墨子（墨翟）创立，代表小生产者的利益。墨家反对贵族特权，追求社会平等，讲求社会实效；在教育上重视经验与实践，注重逻辑思维训练，充分肯定科学技术知识的价值。与儒家相比，墨家在教育方法上具有如下特点：。"}]},{"t":"墨家学派概述","items":[{"t":"墨家与儒家相对立，由墨子（墨翟）创立，代表小生产者利益"},{"t":"反对贵族特权，追求社会平等，讲求社会实效","d":"追求社会平等，讲求社会实效；在教育上重视经验与实践，注重逻辑思维训练，充分肯定科学技术知识的价值。与儒家相比，墨家在教育方法上具有如下特点：。"},{"t":"教育上重视经验与实践，注重逻辑思维训练，充分肯定科学技术知识的价值","d":"注重逻辑思维训练，充分肯定科学技术知识的价值。与儒家相比，墨家在教育方法上具有如下特点：（1）主动：墨子反对儒家“叩则鸣，不叩则不鸣”的被动施教态度，主张“虽不叩必鸣”的“强说人”精神，即使人们不来请教，教育者也应该主动施教。（2）创造：墨子批评儒家“述而不作”，主张“述作结合”。他认为人们既要传承古代优秀文化，也要创造新的事物。这体现了墨子对待文化遗产的态度，也反映出其重视创造的教育理念。（3）实践：孔子重视践行，提出“行有余力，则以学文”，主张识人要“听其言而观其行”。墨子则提出“合其志功而观焉”，主张结合动机与效果评价人的行为。墨家的实践除道德与社会政治实践外，还有生产、军事和科技实践。"}]},{"t":"墨家教育方法的特点","items":[{"t":"主动：反对儒家“叩则鸣，不叩则不鸣”的被动施教，主张“强说人”的主动精神","d":"墨子反对儒家“叩则鸣，不叩则不鸣”的被动施教态度，主张“虽不叩必鸣”的“强说人”精神，即使人们不来请教，教育者也应该主动施教。（2）。"},{"t":"创造：批评儒家“述而不作”，主张“述作结合”，既传承优秀文化又创造新事物","d":"墨子批评儒家“述而不作”，主张“述作结合”。他认为人们既要传承古代优秀文化，也要创造新的事物。这体现了墨子对待文化遗产的态度，也反映出其重视创造的教育理念。（3）。"},{"t":"实践：提出“合其志功而观焉”，结合动机与效果评价行为，重生产、军事、科技实践","d":"孔子重视践行，提出“行有余力，则以学文”，主张识人要“听其言而观其行”。墨子则提出“合其志功而观焉”，主张结合动机与效果评价人的行为。墨家的实践除道德与社会政治实践外，还有生产、军事和科技实践。（4）。"},{"t":"量力：最早明确提出“量力”，一是学生精力有限不能同时学习几方面，二是量力而教","d":"墨子是中国教育史上最早明确提出“量力”教育方法的教育家。“量力”具有两层含义，一是就学生的精力而言，学生不能同时进行几方面的学习；二是就学生的知识水平而言，应当量力而教。32.。"}]}],"id":"紫薯8-31"},{"num":32,"title":"32 赫尔巴特的兴趣观","subject":"外教史","blocks":[{"t":"赫尔巴特及其理论体系","items":[{"t":"19世纪德国哲学家、心理学家、教育家，被誉为“现代教育学之父”","d":"心理学家、教育家，被誉为“现代教育学之父”。他。"},{"t":"提出把教育学建成一门独立学科的设想，构建了较为完整的教育理论体系","d":"独立学科的设想，并构建了较为完整的教育理论体系。其。"},{"t":"教育代表作主要有《普通教育学》《教育学讲授纲要》","d":"通教育学》《教育学讲授纲要》。（1）赫尔巴特的兴趣观：①兴趣的含义：赫尔巴特认为，兴趣是一种将思维的对象保留在意识中的内心力量，是一种智力活动的特性，并具有道德的力量。②兴趣的地位：兴趣不仅是统觉的前提条件，还是课程与教学的基本依据。③兴趣的类型：赫尔巴特把兴趣划分为经验的兴趣和同情的兴趣两大类。其中，经验的兴趣包括经验的、思辨的、审美的兴趣，同情的兴趣包括同情的、社会的、宗教的兴趣。④兴趣活动的过程：赫尔巴特把兴趣活动划分为四个阶段，即注意、期待、要求和行动。（2）赫尔巴特的兴趣观在教育理论体系中的作用：①在教育目的论中，赫尔巴特提出可能的目的和必要的目的。培养儿童具有多方面的兴趣是赫尔巴特。"}]},{"t":"兴趣观","items":[{"t":"兴趣的含义：将思维的对象保留在意识中的内心力量，是智力活动的特性，具有道德的力量","d":"赫尔巴特认为，兴趣是一种将思维的对象保留在意识中的内心力量，是一种智力活动的特性，并具有道德的力量。②。"},{"t":"兴趣的地位：既是统觉的前提条件，也是课程与教学的基本依据","d":"兴趣不仅是统觉的前提条件，还是课程与教学的基本依据。③兴趣的类型：赫尔巴特把兴趣划分为经验的兴趣和同情的兴趣两大类。其中，经验的兴趣包括经验的、思辨的、审美的兴趣，同情的兴趣包括同情的、社会的、宗教的兴趣。④。"},{"t":"兴趣类型：经验兴趣含经验、思辨、审美；同情兴趣含同情、社会、宗教"},{"t":"兴趣活动的过程：划分为注意、期待、要求和行动四个阶段","d":"赫尔巴特把兴趣活动划分为四个阶段，即注意、期待、要求和行动。（2）赫尔巴特的兴趣观在教育理论体系中的作用：①在教育目的论中，赫尔巴特提出可能的目的和必要的目的。培养儿童具有多方面的兴趣是赫尔巴特为教学所确立的直接的、近期的目的，也就是可能的目的，与儿童未来所从事的职业有关。②在课程理论中，赫尔巴特提出经验、兴趣与课程，主张课程内容的选择与儿童的经验和兴趣相一致。根据经验的兴趣设置自然、物理、化学、地理等课程；根据同情的兴趣设置外国语、本国语等课程。③在教学形式阶段理论中，赫尔巴特提出兴趣观是确立教学形式阶段的重要依据。赫尔巴特把兴趣分为注意、期待、要求、行动四个阶段，在此基础上提出教学形式阶。"}]},{"t":"兴趣观在教育理论体系中的作用","items":[{"t":"教育目的论：提出可能的目的与必要的目的，培养多方面兴趣是直接的、近期的目的","d":"中，赫尔巴特提出可能的目的和必要的目的。培养儿童具有多方面的兴趣是赫尔巴特为教学所确立的直接的、近期的目的，也就是可能的目的，与儿童未来所从事的职业有关。②在。"},{"t":"课程理论：课程内容选择与儿童经验和兴趣相一致，据经验兴趣与同情兴趣分别设置课程","d":"中，赫尔巴特提出经验、兴趣与课程，主张课程内容的选择与儿童的经验和兴趣相一致。根据经验的兴趣设置自然、物理、化学、地理等课程；根据同情的兴趣设置外国语、本国语等课程。③在。"},{"t":"教学形式阶段理论：兴趣观是重要依据，注意—明了、期待—联想、要求—系统、行动—方法","d":"中，赫尔巴特提出兴趣观是确立教学形式阶段的重要依据。赫尔巴特把兴趣分为注意、期待、要求、行动四个阶段，在此基础上提出教学形式阶段理论。在教学的明了阶段，学生的兴趣表现为注意；在教学的联想阶段，学生的兴趣表现为获得新观念前的期待；在教学的系统阶段，学生的兴趣表现为要求；在教学的方法阶段，学生的兴趣表现为行动。"}]}],"id":"紫薯8-32"},{"num":33,"title":"33 教师专业成长与队伍建设","subject":"教原","blocks":[{"t":"教师专业成长阶段判定","items":[{"t":"材料中的“我”处于教师专业成长的关注情境阶段","d":"师专业成长的关注情境阶段。福勒和布朗根据教师不同时期的关注焦点，将教师专业成长划分为关注生存、关注情境、关注学生三个阶段。其中，处于。"},{"t":"福勒和布朗将教师专业成长划分为关注生存、关注情境、关注学生三个阶段","d":"阶段。福勒和布朗根据教师不同时期的关注焦点，将教师专业成长划分为关注生存、关注情境、关注学生三个阶段。其中，处于关注情境阶段的教师已平稳度过岗位适应期，不再重点关注自身的生存适应问题，而是将注意力转向教学工作的质量与成效，重点关注学生学业成绩、教学任务完成、班级建设等与教学情境相关的内容。"},{"t":"关注情境阶段的教师已平稳度过岗位适应期，注意力转向教学质量与学生学业成绩","d":"平稳度过岗位适应期，不再重点关注自身的生存适应问题，而是将注意力转向教学工作的质量与成效，重点关注学生学业成绩、教学任务完成、班级建设等与教学情境相关的内容。②判断依据：材料中的“我”有六年教学经验，能快速融入新学校的人际环境，不存在岗位生存、他人评价方面的焦虑，脱离了关注生存阶段；材料中的“我”将主要精力集中在打磨教学内容、提升班级成绩、推进教研工作上，以提高教学质量、提升学生成绩为工作目标，符合关注情境阶段的特征；面对学困生，材料中的“我”受客观条件限制，在教学中只能采用统一大班补差的方式，尚未充分关注学生的个体差异，没有做到因材施教，因此还未进入关注学生阶段。（2）该校教师队伍建设存在的。"}]},{"t":"判断依据","items":[{"t":"已有六年教学经验，能快速融入新学校人际环境，不存在岗位生存的焦虑"},{"t":"主要精力集中于打磨教学内容、提升班级成绩、推进教研，符合关注情境阶段特征","d":"推进教研工作上，以提高教学质量、提升学生成绩为工作目标，符合关注情境阶段的特征；面对学困生，材料中的“我”受客观条件限制，在教学中只能采用统一大班补差的方式，尚未充分关注学生的个体差异，没有做到因材施教，因此还未进入关注学生阶段。"},{"t":"对学困生仅采用统一大班补差，未关注个体差异，尚未进入关注学生阶段"}]},{"t":"教师队伍建设存在的主要问题","items":[{"t":"教研活动难以落地，同伴互助氛围薄弱，尚未形成常态化的教研合作机制","d":"伴互助氛围薄弱。材料中，张磊提议每周开展集体备课，但仅有两位年轻教师参与，多数老教师教学观念固化、参与意愿低。这说明该校尚未形成常态化的教研合作机制，教师之间缺乏有效的交流与专业互助平台。②在职培训针对性不足，实效性偏弱。材料中，该校每季度的培训多为师德、安全类的通识内容，缺少学科教学类的专项研修，无法解决教师教学中的实际困惑，难以有效支撑教师专业能力的持续提升。③。"},{"t":"在职培训针对性不足、实效性偏弱，多为师德、安全类通识内容，缺少学科专项研修","d":"实效性偏弱。材料中，该校每季度的培训多为师德、安全类的通识内容，缺少学科教学类的专项研修，无法解决教师教学中的实际困惑，难以有效支撑教师专业能力的持续提升。"},{"t":"师资配置紧张，教师教学负担过重，缺少时间开展教学反思与自主研修","d":"学负担过重。材料中，该校师资存在明显缺口，教师课务排得很满，这导致教师既没有精力为学困生制订个性化辅导方案，也缺少时间开展教学反思与自主研修，严重压缩了其专业成长的空间。④。"},{"t":"轮岗教师缺少适配支持，教学方法出现“水土不服”，专业价值未充分发挥","d":"教学方法出现“水土不服”。材料中，该校未对交流轮岗的教师配套校情、学情指导，致使城区成熟的教学方法难以适配乡村学情，轮岗教师的专业价值未能得到充分发挥。（3）教育公平包含起点公平、过程公平、结果公平三个主要层次，加强教师队伍建设是实现教育公平的重要抓手。①保障教育起点公平。加强教师队伍建设，有助于优化城乡与校际的师资配置，通过健全教师交流轮岗机制，补齐乡村薄弱学校的师资短板，缩小城乡、校际的教育资源差距，保障学生享有均等的受教育机会。②推进教育过程公平。加强教师队伍建设，能够提升乡村教师的整体专业素养，为不同基础的乡村学生提供高质量、适配学情的教育教学，从而缩小教育实施过程中的质量差距。③夯。"}]},{"t":"教育公平与教师队伍建设","items":[{"t":"教育公平包含起点公平、过程公平、结果公平三个层次，加强教师队伍建设是重要抓手","d":"过程公平、结果公平三个主要层次，加强教师队伍建设是实现教育公平的重要抓手。①保障教育起点公平。加强教师队伍建设，有助于优化城乡与校际的师资配置，通过健全教师交流轮岗机制，补齐乡村薄弱学校的师资短板，缩小城乡、校际的教育资源差距，保障学生享有均等的受教育机会。②推进教育过程公平。加强教师队伍建设，能够提升乡村教师的整体专业素养，为不同基础的乡村学生提供高质量、适配学情的教育教学，从而缩小教育实施过程中的质量差距。③夯实教育结果公平。加强教师队伍建设，有助于整体提升乡村学校育人质量，助力各类学生充分发展，缩小学生群体的发展差距，推动教育结果公平的最终实现。34.。"},{"t":"保障起点公平：优化城乡与校际师资配置，健全交流轮岗机制，补齐乡村师资短板"},{"t":"推进过程公平：提升乡村教师整体专业素养，为乡村学生提供高质量、适配学情的教学"},{"t":"夯实结果公平：整体提升乡村学校育人质量，助力各类学生充分发展","d":"助力各类学生充分发展，缩小学生群体的发展差距，推动教育结果公平的最终实现。【答案要点】（1）科尔伯格将个体的道德发展划分为前习俗水平、习俗水平、后习俗水平三个水平，每个水平包含两个阶段。对材料中学生的不同观点所体现的道德发展阶段及其特征分析如下：。"}]}],"id":"紫薯8-33"},{"num":34,"title":"34 科尔伯格与道德两难","subject":"教心","blocks":[{"t":"材料观点的阶段判定","items":[{"t":"习俗水平·维护权威或秩序的定向：以维护社会秩序为核心，依据是否符合社会秩序准则判断对错","d":"认为法律和社会规范具有权威性，每个人应当承担社会义务与责任，并依据行为是否符合维护社会秩序准则判断行为对错。"},{"t":"后习俗水平·普遍道德原则的定向：是非善恶有独立价值标准，法律与生命冲突时坚守生命至上"},{"t":"后习俗水平·社会契约的定向：契约和法律并非绝对，法律不能实现公平正义时理应修正"}]},{"t":"科尔伯格道德发展理论要点","items":[{"t":"将个体道德发展划分为前习俗、习俗、后习俗三个水平，每个水平包含两个阶段","d":"对材料中学生的不同观点所体现的道德发展阶段及其特征分析如下：。"},{"t":"后习俗水平是道德发展的最高阶段，道德原则已内化为学生的自觉追求"}]},{"t":"道德两难故事促进认知发展的办法","items":[{"t":"设置启发性问题，制造道德认知冲突，引导反思道德选择背后的依据","d":"道德认知冲突。教师选取适宜的道德两难情境，设计层层递进的问题，引导学生主动思考不同道德选择背后的依据，促使学生开展自我反思，突破单一的道德判断思维，形成更加理性的道德判断。②。"},{"t":"组织小组讨论，促进观点交流碰撞，在对比多元观点中提升道德判断水平","d":"点交流碰撞。教师组织学生分组研讨，鼓励大家发表不同看法。学生在交流中对比多元观点，发现自身认知局限，逐步提升道德判断水平。③。"},{"t":"创设开放包容的课堂氛围，尊重学生独立思考，发展辩证思维与批判意识","d":"围，尊重学生独立思考。教师营造宽松平等的讨论环境，鼓励学生自由表达观点，发展学生的辩证思维与批判意识。④。"},{"t":"结合生活实际开展德育，赋予故事现实意义，实现知行合一与道德认知内化","d":"实现知行合一。教师联系学生日常学习生活中真实的道德与法治冲突情境开展教学，赋予道德两难故事现实意义，引导学生将道德认知运用到现实生活中，真正实现道德认知的内化与提升。35.。"}]}],"id":"紫薯8-34"},{"num":35,"title":"35 备课要求与立德树人","subject":"教原","blocks":[{"t":"备课工作的基本要求","items":[{"t":"备教材（钻研教学内容）：确立三维教学目标，厘清重难点，兼顾知识教学与价值育人","d":"厘清教学重难点，明确本节课的知识传授、能力培养与德育任务，精准把握教学核心内容，兼顾知识教学与价值育人。"},{"t":"备学生（深入了解学生）：摸清学情、家庭情况、生活经历与认知特点，因材施教","d":"生活经历与认知特点，并结合当地灾后重建背景设计教学，使教学内容贴合学生实际，贯彻了因材施教的教学原则。"},{"t":"备教法（合理设计教学）：统筹课堂安排，预设教学情境，融入多元育人元素","d":"预设教学情境，主动思考课堂育人价值，在教学中融入多元育人元素，兼顾知识讲授与价值引领。"}]},{"t":"掌握知识与培养思想品德相统一","items":[{"t":"掌握知识是培养学生思想品德的基础，依托学科内容开展德育，避免空洞说教","d":"想品德的基础。案例中，教师以“解决连乘问题”的数学知识教学为载体，将爱的教育融入具体的知识学习过程中，依托学科内容开展德育，使价值观引导有了坚实的知识依托，避免了空洞说教。②。"},{"t":"思想品德的提高能够推动知识学习，调动学生学习主动性","d":"动知识学习。案例中，教师开展爱的教育、引导学生传递善意，能够陶冶学生情操，调动学生学习主动性，促使学生积极投入“解决连乘问题”的数学学习与应用。③。"},{"t":"教学必须坚持知识传授与思想品德教育相统一，实现教书与育人的有机统一","d":"与思想品德教育相统一。案例中，该教师没有局限于数学知识的单一讲授，而是在备课阶段主动挖掘课堂多元育人价值，实现了教书与育人的有机统一，充分践行了这一规律的内在要求。（3）教师在学科教学中落实立德树人根本任务的路径。①深挖学科内在德育元素。教师要充分挖掘学科蕴含的育人价值，将价值引领融入知识讲授的过程中。如案例中教师借助数学教学渗透爱的教育，实现润物无声的育人效果。②整合多元育人资源。教师要打破单一知识传授的局限，主动在教学设计中融入中华优秀传统文化、规则意识、哲思启迪与科学精神等多元要素，丰富课堂育人内涵，拓展育人维度，促进学生全面发展。③立足学情设计德育活动。教师要结合学生的生活经历与认知特。"}]},{"t":"学科教学落实立德树人的路径","items":[{"t":"深挖学科内在德育元素，将价值引领融入知识讲授过程","d":"教师要充分挖掘学科蕴含的育人价值，将价值引领融入知识讲授的过程中。如案例中教师借助数学教学渗透爱的教育，实现润物无声的育人效果。②整合多元育人资源。教师要打破单一知识传授的局限，主动在教学设计中融入中华优秀传统文化、规则意识、哲思启迪与科学精神等多元要素，丰富课堂育人内涵，拓展育人维度，促进学生全面发展。③。"},{"t":"整合多元育人资源，融入中华优秀传统文化、规则意识、哲思启迪与科学精神","d":"教师要打破单一知识传授的局限，主动在教学设计中融入中华优秀传统文化、规则意识、哲思启迪与科学精神等多元要素，丰富课堂育人内涵，拓展育人维度，促进学生全面发展。"},{"t":"立足学情设计德育活动，结合学生生活经历与认知特点创设教学情境","d":"教师要结合学生的生活经历与认知特点创设教学情境，让德育内容贴近学生实际、引发情感共鸣，切实提升育人实效性。如案例中教师结合当地灾后重建背景开展学情分析，为情境育人做好准备。④树立全人育人理念。教师要摒弃知识本位思维，主动思考学科课堂的深层育人价值，将立德树人贯穿教学全过程。36.。"},{"t":"树立全人育人理念，摒弃知识本位思维，将立德树人贯穿教学全过程","d":"教师要摒弃知识本位思维，主动思考学科课堂的深层育人价值，将立德树人贯穿教学全过程。【答案要点】（1）班杜拉提出的社会（观察）学习理论认为，个体可通过观察他人（榜样）的行为及行为结果进行学习。观察学习包含注意、保持、复制、动机四个过程。小乐的行为转变正是经由这四个过程逐步发生的，具体心理机制如下：。"}]}],"id":"紫薯8-35"},{"num":36,"title":"36 观察学习与自我效能感","subject":"教心","blocks":[{"t":"观察学习的过程机制","items":[{"t":"注意过程：成绩优异且乐于助人的小宇成为同桌，小乐观察到其积极参与、分享思路","d":"教师安排数学成绩优异且乐于助人的小宇与小乐成为同桌，使小宇成为小乐直接观察的榜样。小乐通过日常观察，注意到了小宇积极参与课堂、思考解题、分享思路的学习行为，从而启动了对榜样行为的关注。②。"},{"t":"保持过程：将观察到的解题方法与学习策略以表象或语言表征形式储存在头脑中","d":"小乐在观察小宇解题过程的基础上，将所观察到的解题方法与学习策略以表象或语言表征的形式储存在头脑中，为后续的行为再现提供了认知基础。③。"},{"t":"复制过程：在同伴帮助与教师引导下模仿学习方式，独立讲解练习题并转化为实际行动","d":"在同伴帮助与教师引导下，小乐开始模仿小宇的学习方式，尝试解答难度较低的习题；后续独立讲解练习题，成功将习得的行为转化为实际行动。④。"},{"t":"动机过程：榜样获教师肯定产生替代性强化，自身获表扬与掌声产生直接强化","d":"小宇展示解题思路获得教师肯定，使小乐受到替代性强化；小乐讲解练习题获得教师的肯定与全班同学的掌声，受到了直接强化。因此，小乐表现出更多积极的课堂学习行为。（2）自我效能感是指个体对自己能否成功进行某一成就行为的主观判断。教师提升小乐数学学习信心的具体路径如下：①直接经验：教师循序渐进引导小乐学习，让其从解答难度较低的习题入手，逐步在数学小测中取得进步，最终独立讲解练习题并获得认可。这一系列成功的亲身体验有效打破了小乐“我不行”的消极心理定势，显著增强了其自我效能感。②替代经验：教师安排优秀且乐于助人的小宇与小乐成为同桌，让小乐近距离观察小宇积极思考、主动分享解题思路的良好学习表现。通过榜样的。"}]},{"t":"自我效能感的提升路径","items":[{"t":"直接经验：从难度较低的习题入手，小测取得进步并独立讲解，打破“我不行”定势","d":"教师循序渐进引导小乐学习，让其从解答难度较低的习题入手，逐步在数学小测中取得进步，最终独立讲解练习题并获得认可。这一系列成功的亲身体验有效打破了小乐“我不行”的消极心理定势，显著增强了其自我效能感。②。"},{"t":"替代经验：安排优秀且乐于助人的同桌近距离示范，打破“我数学就是差”的固化认知","d":"教师安排优秀且乐于助人的小宇与小乐成为同桌，让小乐近距离观察小宇积极思考、主动分享解题思路的良好学习表现。通过榜样的正向示范，打破了小乐“我数学就是差”的消极固化认知，使其认可自身的学习潜力。③。"},{"t":"言语说服：持续鼓励，引导参与小组讨论并给予积极反馈，帮助树立学习信心","d":"教师持续鼓励小乐，引导他参与小组讨论并给予积极反馈，帮助小乐树立学习信心，提升其自我效能感。（3）教师运用班杜拉相关理论促进学生积极学习的三条有效教学策略：①树立适宜榜样，发挥观察学习的促进作用。教师应在班级选出优秀学生榜样，鼓励榜样展示解题思路与学习方法，引导其他学生观察模仿，从而激发学生的模仿意愿与学习动力。②综合运用多种强化手段。教师应合理利用替代性强化，对榜样的积极行为予以肯定；同时运用直接强化，及时表扬学生表现出的正向学习行为，持续强化学生积极学习动机。③多措并举，增强学生的自我效能感。教师应设计分层学习任务，从简单任务入手帮助学生积累成功体验；同时引导学生设置合理的学习目标，并在。"}]},{"t":"促进积极学习的三条教学策略","items":[{"t":"树立适宜榜样，发挥观察学习的促进作用，激发学生模仿意愿与学习动力","d":"察学习的促进作用。教师应在班级选出优秀学生榜样，鼓励榜样展示解题思路与学习方法，引导其他学生观察模仿，从而激发学生的模仿意愿与学习动力。②。"},{"t":"综合运用多种强化手段：利用替代性强化肯定榜样，及时直接强化正向行为","d":"教师应合理利用替代性强化，对榜样的积极行为予以肯定；同时运用直接强化，及时表扬学生表现出的正向学习行为，持续强化学生积极学习动机。③多措并举，增强学生的自我效能感。教师应设计分层学习任务，从简单任务入手帮助学生积累成功体验；同时引导学生设置合理的学习目标，并在学习过程中持续给予鼓励与积极反馈，帮助学生建立“我能行”的学习信念，增强其自我效能感。"},{"t":"多措并举增强自我效能感：设计分层任务积累成功体验，设置合理目标并持续鼓励"}]}],"id":"紫薯8-36"}]}];

const $ = id => document.getElementById(id);
const selSet = $("selSet"), listEl = $("list");
let recite = false;

function curSet(){ return SETS[ST.cur] || SETS[0]; }
function setKey(){ return curSet().name; }

function fillSets(){
  selSet.innerHTML = "";
  const groups = {};
  SETS.forEach((s, i) => {
    const brand = s.brand || (s.name.indexOf("柯虎") === 0 ? "柯虎" : s.name.indexOf("紫薯") === 0 ? "紫薯" : "迪雯多");
    (groups[brand] = groups[brand] || []).push([i, s]);
  });
  Object.keys(groups).forEach(b => {
    const og = document.createElement("optgroup");
    og.label = b;
    groups[b].forEach(([i, s]) => {
      const o = document.createElement("option");
      o.value = i; o.textContent = s.name + "（" + s.questions.length + "）";
      og.appendChild(o);
    });
    selSet.appendChild(og);
  });
  selSet.value = ST.cur;
}
selSet.onchange = () => { ST.cur = +selSet.value; save(); render(); };

function render(){
  const set = curSet();
  listEl.innerHTML = "";
  let total = 0, got = 0;
  set.questions.forEach(q => {
    const qEl = document.createElement("div");
    qEl.className = "q";
    const qh = document.createElement("div");
    qh.className = "qh";
    const hot = HOT[q.id] && HOT[q.id][0];
    qh.innerHTML = '<span class="num">' + q.num + '</span><span>' + q.title.replace(/^\d+\s*/, '') + '</span>'
      + (hot ? '<span class="badge">★' + hot[1] + '</span>' : '')
      + '<span class="sub">' + q.subject + ' · ' + q.blocks.length + '块</span>';
    qEl.appendChild(qh);

    q.blocks.forEach((b, bi) => {
      const bEl = document.createElement("div");
      bEl.className = "b";
      const bd = ST.collapsed[q.id + "-" + bi] === false ? "open" : "";
      bEl.className = "b " + bd;
      const bh = document.createElement("div");
      bh.className = "bh";
      bh.innerHTML = '<span>' + b.t + '</span><span class="cnt">' + b.items.length + '</span><span class="arrow">▸</span>';
      bh.onclick = () => {
        const nowOpen = !bEl.classList.contains("open");
        bEl.classList.toggle("open", nowOpen);
        ST.collapsed[q.id + "-" + bi] = !nowOpen;
        save();
      };
      bEl.appendChild(bh);

      const items = document.createElement("div");
      items.className = "items";
      b.items.forEach((it, ii) => {
        const id = q.id + "-" + bi + "-" + ii;
        const txt = (typeof it === "object") ? it.t : it;
        const det = (typeof it === "object") ? it.d : null;
        total++;
        if ((ST.status[id] || 0) === 2) got++;
        const itEl = document.createElement("div");
        itEl.className = "it";
        itEl.dataset.id = id;
        itEl.innerHTML = '<div class="row"><span class="dot" data-s="' + (ST.status[id] || 0) + '"></span><span class="tx">' + txt + '</span></div>';
        if (det) {
          const dEl = document.createElement("div");
          dEl.className = "dt";
          dEl.textContent = det;
          itEl.appendChild(dEl);
        }
        itEl.querySelector(".dot").onclick = e => {
          e.stopPropagation();
          ST.status[id] = ((ST.status[id] || 0) + 1) % 3;
          itEl.querySelector(".dot").dataset.s = ST.status[id];
          save(); updateStat();
        };
        itEl.querySelector(".tx").onclick = e => {
          e.stopPropagation();
          if (recite) { itEl.classList.toggle("peek"); return; }
          if (det) itEl.classList.toggle("open");
        };
        items.appendChild(itEl);
      });
      bEl.appendChild(items);
      qEl.appendChild(bEl);
    });
    listEl.appendChild(qEl);
  });
  $("pg").textContent = got; $("pgAll").textContent = total;
  updateStat();
  if (recite) listEl.classList.add("blur");
}

function updateStat(){
  let total = 0, got = 0;
  curSet().questions.forEach(q => q.blocks.forEach(b => b.items.forEach(() => { total++; })));
  listEl.querySelectorAll(".it .dot").forEach(d => { if (d.dataset.s === "2") got++; });
  $("pg").textContent = got; $("pgAll").textContent = total || $("pgAll").textContent;
}

$("prev").onclick = () => { ST.cur = Math.max(0, ST.cur - 1); selSet.value = ST.cur; save(); render(); };
$("next").onclick = () => { ST.cur = Math.min(SETS.length - 1, ST.cur + 1); selSet.value = ST.cur; save(); render(); };
$("btnRecite").onclick = e => {
  recite = !recite;
  e.target.classList.toggle("on", recite);
  listEl.classList.toggle("blur", recite);
  if (!recite) listEl.querySelectorAll(".peek").forEach(x => x.classList.remove("peek"));
};
$("btnExpand").onclick = () => { listEl.querySelectorAll(".b").forEach(b => b.classList.add("open")); };
$("btnCollapse").onclick = () => { listEl.querySelectorAll(".b").forEach(b => b.classList.remove("open")); };

    const c = document.createElement("div");
    c.className = "sh-cell" + (v ? "" : " empty") + (SH.sel === i ? " sel" : "");
    if (v && ST.graded[SH.set]) c.classList.add(v === key[i-1] ? "right" : "wrong");
    c.innerHTML = '<div class="no">' + i + '</div><div class="k">' + (v || "·") + '</div>';
    c.onclick = () => {
      if (SH.sel === i) {
        const order = ["A","B","C","D",""];
        const cur = d[i] || "";
        d[i] = order[(order.indexOf(cur) + 1) % 5];
        if (!d[i]) delete d[i];
      } else SH.sel = i;
      save(); drawSheet();
    };
    shGrid.appendChild(c);
  }
  const answered = Object.keys(d).length;
  shRes.innerHTML = "已填 " + answered + " / 30";
}
$("btnSheet").onclick = () => { sheetEl.hidden = false; drawSheet(); };
$("shClose").onclick = () => { sheetEl.hidden = true; };
$("shGrade").onclick = () => {
  const d = sheetData(), key = SHEET[SH.set] || "";
  ST.graded[SH.set] = true; save();
  const nums = Object.keys(d).map(Number).sort((a,b)=>a-b);
  const wrong = nums.filter(n => d[n] !== key[n-1]);
  const right = nums.length - wrong.length;
  shRes.innerHTML = "得分 <b>" + (right*2) + "</b> / 60　对 " + right + " · 错 " + wrong.length +
    (wrong.length ? "<br>红题号：" + wrong.join("、") : "");
  drawSheet();
};

fillSets();
render();
</script>
</body>
</html>
