"d":"向实际二者都猛烈抨击传统教育脱离生产生活、重文轻实、空谈心性的弊端，反对教育沦为科举附庸、培养脱离社会的士大夫。杨贤江批判传统教育是阶级对立的上层建筑，脱离劳动与大众需求；黄炎培直指传统学校教育的知识技能与社会生活完全脱节，学生毕业之后无用武之地。二者都主张教育必须扎根社会现实，服务社会发展，打破劳心与劳力分离的传统格局。"},{"t":"重视劳动价值，秉持平民取向","d":"民取向二者都反对教育的贵族化特权，认同劳动的教育价值，主张教育与生产劳动相结合。杨贤江提出教育是劳动力再生产的手段，是赋予劳动者特定资质的社会劳动领域；黄炎培强调职业教育手脑并用、做学合一，本质上都是对“万般皆下品，惟有读书高”传统观念的反拨。二者都致力于让教育惠及普通民众，让底层群体通过教育获得生存发展的能力，具有鲜明的平民化色彩。"}]},{"t":"杨贤江与黄炎培教育思想的核心差异","items":[{"t":"理论基础与教育本质认知的分野","d":"知的分野杨贤江以马克思主义历史唯物主义为理论根基，首次系统阐明教育的双重属性：教育既是社会的上层建筑，由经济基础决定并反作用于经济基础；也是劳动力再生产的手段，是将单纯劳动力培养为特殊劳动力的社会劳动领域。他还从历史演进的视角分析教育本质的变迁，指出私有制产生后教育具有鲜明的阶级性，未来共产主义社会的教育将在更高形态上回归劳动属性。黄炎培则以实用主义教育思想为核心，秉持改良主义立场，更多从社会功能与经济价值层面认知教育。他认为教育的核心价值是解决生计问题、适配实业发展需求，将职业教育视为改良社会、振兴实业的核心工具，并未从社会形态与阶级结构的深层剖析教育。"},{"t":"核心目标与价值指向的不同","d":"不同杨贤江的教育目标以人的全面发展与社会革命为指向。他提出“全人生的指导”思想，主张对青年从人生观、政治观、学校观、生活观四个维度进行全面引导，培养身心健康、兼具知识技能与社会理想的革命青年。其最终目标是通过社会革命消灭阶级压迫，实现教育的真正平等与普及，让每个人都能获得自由全面的发展。黄炎培的教育目标以职业发展与社会改良为核心。他将职业教育的目标凝练为“使无业者有业，使有业者乐业”：一方面通过职业技能培训为近代工商业培养适用人才，解决社会失业与底层民众生计问题；另一方面通过“敬业乐群”的职业道德教育，培养职业认同与协作精神，实现职业发展与社会稳定的双重。"},{"t":"实践路径与教育重心的差异","d":"差异杨贤江的教育实践聚焦青年思想与成长引导，侧重意识形态与人生发展层面。他针对近代青年在人生观、职业、社交、生活等方面的普遍困境，构建了涵盖健康生活、劳动生活、公民生活、文化生活的全人生指导体系。他强调青年要主动干预政治、投身社会革命，将教育视为革命斗争的重要武器，服务于社会变革的大局。黄炎培的教育实践聚焦职业教育体系构建，侧重经济与技能层面。他发起成立中华职业教育社，推动建立从初级到高级、贯穿整个职业生涯的职业教育系统，倡导社会化、科学化的办学方针，坚持手脑并用、做学合一的教学原则，致力于推动职业教育的制度化、普及化，让教育直接服务于实业发展与民生改善。"}]},{"t":"二者教育思想对近代中国教育变革的历史贡献","items":[{"t":"杨贤江：开创马克思主义教育的中国化探索","d":"义教育的中国化探索杨贤江是中国马克思主义教育理论的奠基人，其思想具有开创性的历史意义。首先，奠定了中国马克思主义教育理论的基础。他首次运用历史唯物主义系统阐释教育本质，撰写了中国第一部马克思主义教育理论专著《新教育大纲》，打破了资产阶级教育思想的话语垄断，为后来新民主主义教育理论的形成提供了理论源头。其次，创新了青年教育理论体系。“全人生指导”思想突破了传统教育只重知识传授的局限，将教育延伸到青年生活的全方位，为近代青年教育提供了全新的思路，深刻影响了一代进步青年的成长。最后，澄清了教育本质的认识误区。通过对“教育万能论”“教育救国论”“先教育后革命论”"},{"t":"黄炎培：推动中国职业教育的体系化发展","d":"教育的体系化发展作为中国近代职业教育的开创者，黄炎培的思想与实践深刻改变了中国教育的结构与走向。首先，构建了完整的职业教育理论体系。他系统论述了职业教育的作用、地位、目的、方针与教学原则，奠定了中国职业教育的理论基础，填补了传统教育体系的空白。其次，推动了职业教育的制度化实践。发起成立中华职业教育社，开展职业教育实验，推动职业教育纳入国家学制体系，深刻影响了1922年新学制的改革方向。再次，推动了传统教育的实用化转型。他倡导的实用主义教育思潮，冲击了传统教育空疏无用的积弊，推动教育与社会生活、生产实践深度结合，为近代教育注入了务实品格。最后，回应了民生与。"},{"t":"共同推动近代教育的多元转型","d":"元转型二者分别从革命维度与建设维度探索了中国教育的两条出路，共同打破了传统教育的单一格局，丰富了近代中国的教育思想谱系。它们一个指向社会革命的长远目标，一个回应社会改良的现实需求，共同推动教育从封建教化向近代国民教育转型，为后世教育发展留下了宝贵的思想遗产。"}]},{"t":"二者教育思想的时代局限性","items":[{"t":"杨贤江教育思想的探索性局限","d":"性局限作为中国最早的马克思主义教育理论家，其思想处于早期探索阶段，对教育自身的独特规律、对教育的文化传承功能与人本价值的探讨仍不够充分。受当时革命斗争环境的影响，他过于强调教育的革命工具属性与阶级属性，对教育相对独立性的论述相对不足，部分观点带有鲜明的时代印记。"},{"t":"黄炎培教育思想的改良主义局限","d":"主义局限其思想本质上属于教育改良主义范畴，试图在不触动根本社会制度的前提下，通过职业教育解决贫困、失业等深层社会问题，没有认识到社会制度变革是教育发展的根本前提，因此很多理想难以真正落地。同时，职业教育思想相对侧重技能培养与生计功能，对人的全面发展、教育的人文价值与精神启蒙功能的关注有所不足。"},{"t":"共同的时代制约：二者的教育理想都受到半殖民地半封建社会条件的根本制约","d":"二者的教育理想都受到半殖民地半封建社会条件的根本制约。在军阀混战、经济凋敝、政局动荡的近代中国，无论是革命导向的青年教育还是改良导向的职业教育，都难以获得充分落地的社会环境与物质基础，实际成效受到很大限制，无法完全实现各自的教育理想。####32.结合外国教育史知识，简述赫尔巴特教育学两大理论基础、四阶段教学理论；阐释“教育性教学”核心内涵与内在逻辑；论述赫尔巴特教育理论的历史贡献与局限。【解析】赫尔巴特是近代德国具有里程碑意义的哲学家、心理学家与教育家，他首次系统提出将教育学建设为独立学科的构想，并以伦理学与心理学为双重根基，构建起涵盖教育目的、课程理。"}]}]},{"id":"预测6-4-32","num":32,"title":"32 赫尔巴特","subject":"外教史","blocks":[{"t":"赫尔巴特教育学的两大理论基础","items":[{"t":"伦理学基础：教育目的的价值规范","d":"教育目的的价值规范伦理学是赫尔巴特教育目的论的根本依据，其核心是五种相互联系、不可偏废的道德观念，是维护社会秩序的永恒准则，也是教育要达成的最高目标。一是内心自由，指人对真善美形成清晰的理性认知后，能够自觉依照道德规范行事，实现意志与理性的统一；二是完善，指人调节自身意志、做出价值判断的尺度与能力，是个体道德素养的内在支撑；三是仁慈，即绝对的善，要求人无私为他人谋福祉，实现自我意志与他人意志的协调；四是正义，即守法观念，主张通过约定与法律化解不同意志的冲突，维护社会秩序；。"},{"t":"心理学基础：教学过程的科学依据","d":"教学过程的科学依据赫尔巴特是西方历史上首位将心理学作为独立学科研究，并系统将其引入教育领域的思想家，其心理学核心是统觉理论。统觉理论揭示了人的认识形成规律：当新的感官刺激进入意识时，若能唤起意识阈下已有的相似观念并与之结合，就会形成新的统觉团，也就是新的认识结果；若意识中已有相似观念，二者的结合则会进一步巩固认识。在统觉过程中，兴趣是核心动力，它是观念的积极活动状态，能够唤醒原有观念、推动新旧观念的结合，赋予学习活动主动性。统觉心理学为教学过程、课程设计提供了科学的心理学依据，彻底改变了传统教育仅凭经验与思辨的状态，推动教育学向科学方向迈进。"}]},{"t":"四阶段教学理论的核心架构","items":[{"t":"赫尔巴特以统觉心理学为基础","d":"为基础，结合儿童兴趣发展与思维活动的规律，提出了经典的教学形式四阶段理论，将课堂教学过程抽象为规范、有序的四个阶段，实现了教学流程的系统化。第一阶段是明了（清晰）。这一阶段新的表象通过感官呈现，学生处于专心的思维状态，兴趣处于注意阶段。教师主要采用直观教学、清晰讲解的提示教学法，帮助学生获得清晰的感性表象，为新旧观念的联合做好准备。第二阶段是联合（联想）。新表象进入意识后，唤醒原有观念活动，新旧观念开始产生联结但尚未形成最终结论，学生处于从专心向审思过渡的状态，兴趣处于期待阶段。教师通过自由谈话、分析引导的教学方法，帮助学生梳理新旧知识的关联，为知识系统。"}]},{"t":"“教育性教学”原则的核心内涵与内在逻辑","items":[{"t":"核心内涵：赫尔巴特明确提出：不存在无教学的教育，也不存在无教育的教学","d":"人的全面发展是马恩教育思想的核心内核。其核心内涵是摆脱旧式分工造成的人的片面、畸形发展，实现人的体力、智力、道德、个性、审美等全方位、自由充分的发展，最终实现人的彻底解放。这一目标的实现以高度发达的生产力、废除私有制、消灭阶级差异为社会基础，依托德育、智育、体育、综合技术教育协同推进，是社会主义教育的终极价值追求。"},{"t":"内在逻辑：首先，道德认知是德行形成的前提","d":"1.关系对立偏差：零和博弈思维，将全面发展与学业成绩对立。部分教育者与家长认为，强化体美劳会占用智育时间、影响考试成绩，将五育视为此消彼长的竞争关系。材料二中部分家长因学生文化课成绩小幅波动就质疑五育改革，正是这种偏差的典型表现。这种认知忽视了五育之间相互促进、相互支撑的内在逻辑，将学业成绩窄化为唯一的育人目标。"}]},{"t":"赫尔巴特教育理论的历史贡献与局限","items":[{"t":"历史贡献","d":"####31.结合材料与所学，比较杨贤江与黄炎培教育思想异同，并评析二者对近代教育变革的历史贡献与局限性。【解析】近代中国半殖民地半封建的社会语境下，教育救国成为知识界探索救亡道路的核心方向之一。杨贤江与黄炎培作为民国时期极具代表性的教育思想家，分别立足马克思主义理论视角与职业教育实践路径，构建了各具特色的教育思想体系。前者以历史唯物主义剖析教育本质，提出“全人生指导”的青年教育主张；后者以实用主义为内核，倡导职业教育以实现“使无业者有业，使有业者乐业”的目标。二者既共享时代变革的思想底色，又在理论根基、实践路径上形成鲜明分野，共同推动了中国教育的近代转。"},{"t":"确立了教育学的独立学科地位","d":"科地位。赫尔巴特的《普通教育学》构建了首个系统完整的教育学理论体系，涵盖教育目的、课程、教学、德育等核心领域，使教育学彻底从哲学、神学的附庸中独立出来，成为一门有自身研究对象、理论基础与方法体系的独立学科，开启了教育学发展的新纪元。第二，推动了教育学的科学化进程。首次将系统的心理学研究引入教育领域，以统觉理论解释学习过程，以心理规律设计教学环节，打破了传统教育仅凭经验、思辨的局限，为教育心理学的发展奠定了基础，推动教育学从经验之学走向科学之学。第三，构建了经典的教学实践范式。四阶段教学理论、课程相关与集中原则、教育性教学原则等，为学校教学提供了可操作的规。"},{"t":"推动了教育学的科学化进程","d":"进程。首次将系统的心理学研究引入教育领域，以统觉理论解释学习过程，以心理规律设计教学环节，打破了传统教育仅凭经验、思辨的局限，为教育心理学的发展奠定了基础，推动教育学从经验之学走向科学之学。第三，构建了经典的教学实践范式。四阶段教学理论、课程相关与集中原则、教育性教学原则等，为学校教学提供了可操作的规范，深刻影响了世界各国的师范教育与中小学教学实践。20世纪初该理论传入中国，对清末废科举、兴学堂，以及近代师范教育体系的建立起到了重要的推动作用。第四，深化了对教育本质的认识。教育性教学原则深刻揭示了知识传授与品德培育的内在联系，批判了割裂教学与德育的错误倾。"},{"t":"构建了经典的教学实践范式","d":"范式。四阶段教学理论、课程相关与集中原则、教育性教学原则等，为学校教学提供了可操作的规范，深刻影响了世界各国的师范教育与中小学教学实践。20世纪初该理论传入中国，对清末废科举、兴学堂，以及近代师范教育体系的建立起到了重要的推动作用。第四，深化了对教育本质的认识。教育性教学原则深刻揭示了知识传授与品德培育的内在联系，批判了割裂教学与德育的错误倾向，确立了教书育人的核心命题，对后世教育理论发展产生了深远影响。"},{"t":"深化了对教育本质的认识","d":"识。教育性教学原则深刻揭示了知识传授与品德培育的内在联系，批判了割裂教学与德育的错误倾向，确立了教书育人的核心命题，对后世教育理论发展产生了深远影响。"}]}]},{"id":"预测6-4-33","num":33,"title":"33 教学过程本质与规律","subject":"教原","blocks":[{"t":"（1）运用教学过程本质相关观点","items":[{"t":"王老师：秉持“特殊认识说”本质观，以系统知识传授为核心","d":"识说”本质观，以系统知识传授为核心王老师坚持精讲多练，课堂结构严谨、知识讲授系统，注重夯实学生基础，认为扎实的学科知识是素养与能力的前提，本质上秉持的是教学过程的“特殊认识说”，即认为教学过程是教师引导学生系统掌握人类积累的科学文化知识、间接认识世界的特殊认识过程。这种观点的核心逻辑是：教学过程本质上属于认识活动范畴，但又不同于人类探索未知的总体认识过程，具有鲜明的特殊性。一是间接性，学生以学习前人积累的科学文化知识为中介，间接认识现实世界，不需要事事亲身探索、重复前人的认识路径；二是引导性，学生的认识活动尚不成熟，需要在富有知识的教师引导下有序开展，无。"},{"t":"陈老师：秉持“交往建构说”本质观，以学生主动建构为核心","d":"构说”本质观，以学生主动建构为核心陈老师主打小组合作与探究学习，坚持知识需要学生主动建构、自主内化，课堂氛围活跃、学生参与度高，本质上融合了教学过程的“交往说”与学生主体的建构主义认识观，认为教学过程是以师生交往、生生交往为基础，学生主动建构知识的活动过程。这种观点的核心逻辑是：教学不是教师单向的知识传递，而是以交往为背景和手段，通过师生平等对话、生生合作互动，引导学生主动探究、自主建构知识的过程。交往是教学的重要手段与运行基础，学生是知识建构的主体，而非被动的接收者。陈老师的课堂正是这一逻辑的实践：通过小组合作、探究学习的形式，让学生在互动中主动探索，。"}]},{"t":"（2）提炼争论反映的教学过程基本规律","items":[{"t":"争论反映的教学过程基本规律与核心关系","d":"#####（2）结合材料，提炼争论反映的教学过程基本规律，说明教学要处理的核心关系，并结合校长总结阐述你对教学过程本质的理解。【解析】两位教师的教学分歧，表面上是教学模式与方法的差异，本质上折射了教学过程的内在基本规律，反映了教学过程中多重核心关系的平衡难题。校长提出的“教学是综合性育人过程，兼顾知识传递、能力建构与价值塑造”，正是对教学过程本质的深刻把握。"},{"t":"间接经验与直接经验的辩证统一规律","d":"辩证统一规律。教学过程是间接经验学习与直接经验获得的统一，学生以学习间接经验为主，同时必须以直接经验为认知基础。王老师过度侧重间接经验的系统传授，忽视学生的直接经验与探究体验，导致课堂脱离学生生活体验；陈老师过度侧重直接经验式的探究，忽视系统间接经验的学习，导致知识基础薄弱。二者的争论，本质上是间接经验与直接经验孰轻孰重的平衡之争，反映了二者必须结合的基本规律，任何偏向一端都会违背教学规律，影响育人质量。第二，掌握知识与发展能力的辩证统一规律。掌握知识是发展能力的基础，能力发展是掌握知识的重要条件，二者相互依存、相互促进。王老师认为“无知识则无素养”，抓。"},{"t":"对教学过程本质的深层理解","d":"理解结合校长的总结与教学过程的基本规律，教学过程的本质是多重属性的统一体，而非单一的认识或交往过程，具有多维的内涵。首先，教学过程是特殊的认识过程，这是教学的基础属性。教学的核心任务之一是引导学生系统掌握科学文化知识，间接认识世界，这是教学效率性的根本保障。脱离了知识掌握的基础，能力发展、价值培育都会沦为空谈。其次，教学过程是以交往为基础的双边活动过程，这是教学的运行属性。教学不是单向的传递，而是师生、生生之间的互动交往，教师主导与学生主体的统一是教学的基本形态，只有充分调动双方的主动性，才能实现教与学的协同。再次，教学过程是促进学生全面发展的价值实现过。"}]},{"t":"（3）、二，论述教学过程基本规律对优化教学实践的指导意义。","items":[{"t":"坚持间接经验与直接经验结合，破解知识与实践脱节难题","d":"验结合，破解知识与实践脱节难题针对当前课堂“灌输式”与“形式化探究”两种极端，教学必须坚持间接经验为主、直接经验为基的原则，实现二者的有机结合。一方面，要守住系统知识传授的底线，发挥教师的专业引导作用，系统、高效地传递学科基础知识体系，保障学生掌握扎实的间接经验，避免探究活动泛化、知识碎片化的问题。另一方面，要丰富学生的直接经验，将知识学习与生活实践、探究活动结合，通过情境创设、小组探究、实践操作等方式，为抽象知识提供感性经验支撑，让学生在直接体验中深化对间接经验的理解，避免机械记忆、知识僵化的问题。比如数学教学既要有系统的知识精讲与基础练习，也要结合生。"},{"t":"坚持知识掌握与能力发展统一，破解知能分离的育人困境","d":"展统一，破解知能分离的育人困境针对“重知轻能”与“重能轻知”两种偏向，教学必须坚持知识与能力互为基础、相互促进的规律，实现知能并进。一方面，要夯实知识基础，明确知识是能力发展的前提，系统梳理学科知识体系，让学生掌握扎实的核心概念、原理与方法，为能力发展奠定根基，避免脱离知识空谈能力的形式主义。另一方面，要强化能力导向，将知识学习与能力培养同步推进，在知识传授中渗透思维方法、探究策略的培养，通过启发式、探究式教学，引导学生独立思考、主动建构，学会运用知识解决实际问题，避免“高分低能”的知识僵化问题。比如语文教学既要落实字词、文本理解等基础知识，也要通过合作。"},{"t":"坚持教师主导与学生主体协同，破解教与学失衡的问题","d":"体协同，破解教与学失衡的问题针对“教师中心”与“学生中心”两种极端，教学必须坚持教师主导与学生主体相统一的规律，实现教与学的动态平衡。一方面，要强化教师的主导责任，教师要做好教学的设计者、引导者与组织者，精准把握教学目标、系统设计教学过程、适时提供认知支架，保障教学的方向与效率，避免放任学生盲目探索。另一方面，要充分尊重学生的主体地位，激发学生的学习主动性，通过启发提问、合作探究、任务驱动等方式，引导学生主动思考、自主建构，让学生成为学习的主人，避免被动灌输。比如课堂教学中，教师既要精讲核心知识、把控教学节奏，也要给学生留出思考、讨论、探究的空间，实现主。"},{"t":"坚持智力与非智力因素并重，破解课堂沉闷与形式化问题","d":"并重，破解课堂沉闷与形式化问题针对课堂“重智轻情”与“重情轻质”两种偏向，教学必须坚持智力与非智力相互依存的规律，实现认知发展与情感动力的协同。一方面，要优化教学过程，增强教学的趣味性、启发性与吸引力，关注学生的学习兴趣、情感体验与意志品质培养，通过良好的师生互动、丰富的活动设计，激发学生的内在学习动力，避免课堂沉闷、学生被动的问题。另一方面，要坚持认知目标为核心，所有的互动、活动都要服务于学生的知识学习与能力发展，避免为了活跃而活跃的形式主义，让非智力因素真正服务于智力发展。比如课堂小组讨论，既要营造活跃的交流氛围，也要围绕核心知识问题展开，保证讨论的。"},{"t":"坚持知识传授与价值塑造融合，破解育人片面化问题","d":"造融合，破解育人片面化问题针对教学中“重教书轻育人”的倾向，教学必须坚持教育性教学原则，实现知识传授与思想品德教育的统一。一方面，深入挖掘学科知识中的育人元素，将价值引领融入知识教学过程，通过知识的学习，培养学生正确的世界观、人生观与价值观，实现润物细无声的价值培育。另一方面，价值培育要以知识为载体，避免脱离知识的空洞说教，让学生在知识学习的过程中，自然形成正确的价值观念与道德品质。####34.阅读材料，回答问题。#####（1）结合学习动机培养的相关理论，分析小钱产生“习得性无助”倾向的原因，并为刘老师提出培养小钱学习动机的具体措施。【解析】习得性无。"}]}]},{"id":"预测6-4-34","num":34,"title":"34 动机培养与激发","subject":"教心","blocks":[{"t":"（1）结合学习动机培养的相关理论","items":[{"t":"小钱习得性无助倾向的深层成因","d":"深层成因第一，消极归因模式是核心诱因。小钱学习刻苦、长期刷题投入大量时间，但因学习方法死板、不懂变通，成绩始终徘徊在及格线。连续的努力无果没有引导他反思策略与方法的问题，反而让他得出“自己天生不适合学数学”的结论，将失败完全归因为内部、稳定、不可控的能力因素。根据成败归因的规律，当个体将失败归因为稳定且不可控的能力时，会产生强烈的无力感，认为再努力也无法改变结果，进而放弃尝试。小钱正是陷入了这种归因偏差：不认为是方法可以调整，而是认定自己能力不足无法改变，最终从“努力学不好”滑向“天生学不好”的自我否定，形成习得性无助的认知根源。第二，连续失败的直接经验。"},{"t":"消极归因模式是核心诱因","d":"因。小钱学习刻苦、长期刷题投入大量时间，但因学习方法死板、不懂变通，成绩始终徘徊在及格线。连续的努力无果没有引导他反思策略与方法的问题，反而让他得出“自己天生不适合学数学”的结论，将失败完全归因为内部、稳定、不可控的能力因素。根据成败归因的规律，当个体将失败归因为稳定且不可控的能力时，会产生强烈的无力感，认为再努力也无法改变结果，进而放弃尝试。小钱正是陷入了这种归因偏差：不认为是方法可以调整，而是认定自己能力不足无法改变，最终从“努力学不好”滑向“天生学不好”的自我否定，形成习得性无助的认知根源。第二，连续失败的直接经验持续削弱自我效能感。自我效能感是个。"},{"t":"培养小钱学习动机的具体措施","d":"#####（1）结合学习动机培养的相关理论，分析小钱产生“习得性无助”倾向的原因，并为刘老师提出培养小钱学习动机的具体措施。【解析】习得性无助是个体在连续经历多次失败与挫折后，将失败原因归因为自身无法改变的稳定能力因素，进而产生自我否定、回避挑战、放弃努力的心理状态，是学习动机严重受损的典型表现。小钱的习得性无助倾向并非偶然，是长期努力无效、归因认知偏差、自我效能感持续下滑共同作用的结果，需要系统干预才能逐步破解。"}]},{"t":"（2）从学习动机激发的角度","items":[{"t":"刘老师当前课堂做法的不足","d":"#####（2）从学习动机激发的角度，评价刘老师当前课堂做法的不足，并针对小赵的情况提出激发其数学学习动机的建议。【解析】学习动机的激发是通过教学措施将潜在动机转化为激活状态，推动学习活动落地的过程，需要遵循学生身心规律，兼顾个体差异，采用科学的方式方法。刘老师试图通过小组竞赛、成绩对比调动学生积极性，但由于方式违背动机激发的规律，反而起到了反效果，存在多方面的明显不足；针对小赵这类特点鲜明的学生，需要精准对接兴趣特点，实现动机迁移与内在激发。"},{"t":"竞争设计不合理，加剧学习分化，削弱多数学生动机","d":"学习分化，削弱多数学生动机。刘老师采用小组竞赛的方式调动氛围，但竞赛门槛设置不当，仅优等生能够参与互动、获得成就感，多数基础薄弱的学生沦为旁观者，无法在竞赛中获得参与感与成功体验。对于基础较差的学生而言，竞赛带来的不是动力，而是持续的挫败感，进一步降低了他们的学习自信与参与意愿，导致“优等生更积极、学困生更退缩”的两极分化，反而拉低了全班的整体学习积极性。第二，评价方式消极化，伤害学生自我价值，引发畏学厌学情绪。刘老师常当众对比学生成绩、批评基础错题，本意是激励学生努力，但这种以否定性评价为主的方式，直接打击了学生的自尊与自我效能感。学习动机激发的规律显。"},{"t":"针对小赵的数学学习动机激发策略","d":"机激发策略小赵的核心问题是数学学习的内部动机不足，错误地认为数学对自己的篮球职业发展毫无用处，只需及格即可；但他在篮球社团中展现出了优秀的数理思维与主动探究能力，具备学好数学的潜力。激发他的数学学习动机，核心是实现动机迁移，将篮球领域的兴趣与能力迁移到数学学习中，从价值感知、兴趣激发、效能提升三个维度精准发力。第一，挖掘兴趣契合点，实现学习动机的迁移。小赵在篮球社团中能够主动研究战术、计算投篮数据、运用数理思维分析运动问题，说明他具备良好的数理思维基础，也有数据分析的兴趣。教师可以将数学学习与篮球场景深度结合，比如用篮球投篮命中率计算、战术跑位角度分析、。"}]},{"t":"（3）结合“双减”政策要求","items":[{"t":"学习动机培养与激发的辩证关系","d":"#####（3）结合“双减”政策要求，阐述教师应如何正确处理学习动机培养与激发的关系，实现课堂减负提质、促进全班学生形成持续的学习动力。【解析】“双减”政策的核心是减轻学生过重的作业负担与校外培训负担，提升课堂教学质量，实现减负提质。学习动机是影响学习效率与育人质量的核心变量，减负提质的关键，在于正确处理学习动机培养与激发的关系，坚持培养与激发并行，构建长效、高效的学习动力体系，让学生在更少的负担下获得更好的发展。"},{"t":"实现减负提质的实践路径","d":"径第一，坚持培养为基，构建长效动机体系，筑牢减负提质的根本支撑。“双减”减的是机械重复的作业负担与校外培训负担，但学生的学习不能没有持续的内在动力。这就需要将学习动机培养作为课堂教学的长期目标，系统推进。一是立足学生成长需要，尊重学生的兴趣爱好、发展诉求，让学习服务于学生的全面成长，而非单纯的应试，从根本上提升学习的价值感。二是系统开展成就动机训练，通过意识化、体验化、概念化、练习、迁移、内化的完整过程，帮助学生建立积极的成就动机，将学习与自身成长深度绑定。三是持续开展归因训练，引导学生形成积极的归因模式，将成败归因为努力、方法等可控因素，预防与破解习得。"},{"t":"坚持培养为基，构建长效动机体系，筑牢减负提质的根本支撑","d":"效动机体系，筑牢减负提质的根本支撑。“双减”减的是机械重复的作业负担与校外培训负担，但学生的学习不能没有持续的内在动力。这就需要将学习动机培养作为课堂教学的长期目标，系统推进。一是立足学生成长需要，尊重学生的兴趣爱好、发展诉求，让学习服务于学生的全面成长，而非单纯的应试，从根本上提升学习的价值感。二是系统开展成就动机训练，通过意识化、体验化、概念化、练习、迁移、内化的完整过程，帮助学生建立积极的成就动机，将学习与自身成长深度绑定。三是持续开展归因训练，引导学生形成积极的归因模式，将成败归因为努力、方法等可控因素，预防与破解习得性无助，提升学习的韧性。四是。"}]}]},{"id":"预测6-4-35","num":35,"title":"35 教学原则与方法","subject":"教原","blocks":[{"t":"（1）分析四位教师的教学实践分别体现了或违背了哪些教学基本…","items":[{"t":"物理林老师：多重原则协同落地，教学实效突出","d":"多重原则协同落地，教学实效突出林老师的电路教学充分体现了直观性原则、启发性原则、理论联系实际原则与巩固性原则，是高质量教学的典型代表。第一，践行直观性原则，筑牢认知的感性基础。林老师通过实物演示、分组实验的方式，让学生直接接触电路器材，动手搭建真实电路，属于典型的实物直观。学生在亲手操作中形成对电路连接、电流通路的清晰表象，避免了纯符号讲解的抽象感，符合直观性原则中“通过感知丰富感性认识、支撑知识理解”的核心要求。第二，落实启发性原则，激发主动探究思维。林老师没有直接灌输电路连接的规律与原理，而是引导学生自主搭建、自主探究，让学生在操作中发现问题、总结规。"},{"t":"历史方老师：直观手段运用失当，违背系统与巩固原则","d":"直观手段运用失当，违背系统与巩固原则方老师的教学体现了直观性原则的部分要求，但违背了直观与讲解相结合的要求、系统性原则与巩固性原则，陷入了“重形式轻实效”的误区。第一，直观手段激发兴趣，但偏离直观教学的核心目的。方老师大量运用图片、纪录片、趣味故事开展教学，属于模像直观与语言直观的结合，确实丰富了课堂呈现形式，降低了历史内容的距离感，激发了学生的听课兴趣，符合直观性原则中“丰富感性认识”的基本要求。但违背了“直观与讲解相结合”的核心要求：直观只是认知的手段而非目的，方老师过度侧重直观素材的呈现，没有配套系统的逻辑讲解与史实梳理，学生只看到了碎片化的场景与。"},{"t":"数学孙老师：知识巩固导向明确，违背启发与应用原则","d":"知识巩固导向明确，违背启发与应用原则孙老师的教学体现了系统性原则与巩固性原则的部分要求，但违背了启发性原则与理论联系实际原则，属于典型的“灌输固化”模式。第一，落实系统性与巩固性，解题技能训练扎实。孙老师按照“例题讲解—同类训练”的顺序推进教学，由易到难、循序渐进，符合系统性原则的要求；通过大量同类习题训练，帮助学生熟练固定题型的解题步骤，短期内有效提升了解题熟练度，体现了巩固性原则中“反复练习形成技能”的思路。第二，违背启发性原则，思维训练严重不足。孙老师的教学聚焦解题步骤的模仿与训练，没有引导学生理解方程的本质原理，也不启发学生思考不同题型的内在联系。"},{"t":"英语周老师：探究方向符合理念，引导缺位导致形式化","d":"探究方向符合理念，引导缺位导致形式化周老师的初衷是践行启发性原则与学生主体性理念，但由于教学设计粗糙，违背了启发性原则、系统性原则，最终导致讨论流于形式。第一，方向契合启发性原则，但实施严重缺位。周老师采用小组讨论的形式，本意是发挥学生主体性，引导学生自主探究，符合启发性原则的改革方向。但缺乏有效的问题设计与分工引导，只发放简单提纲，没有设置层层递进的问题链，也没有对讨论过程进行引导调控，导致课堂讨论松散混乱，学生多用中文闲聊，没有围绕环保主题的英语表达与深度探究，完全偏离了教学目标。第二，违背系统性原则，教学目标落空。讨论法本应服务于核心知识的掌握与能。"}]},{"t":"（2）分析中小学常用教学方法的特点","items":[{"t":"讲授法：系统高效的知识传递方法","d":"识传递方法讲授法是教师通过系统连贯的语言向学生传授知识的方法，是教学中最基础、最常用的方法。其核心特点是：信息传递量大、系统性强、效率高，能够在短时间内帮助学生建立系统的知识体系；但单向性较强，学生处于被动接收地位，若运用不当容易沦为“灌输式”教学。讲授法的适用场景非常广泛：一是系统理论知识的入门讲授，比如数学原理、历史脉络、语法规则等体系性强的内容，适合用讲授法搭建知识框架；二是重难点知识的深度剖析，针对学生难以自主理解的核心内容，通过教师系统讲解突破认知难点；三是学科知识的整体梳理，在单元复习、总结提升阶段，用讲授法帮助学生形成完整的知识体系。从学段。"},{"t":"演示法：直观形象的感知辅助方法","d":"知辅助方法演示法是教师通过展示实物、模型、图片、音视频等直观素材，帮助学生认识事物、获得知识的方法。其核心特点是：形象生动、感染力强，能够降低抽象知识的认知难度，快速激发学生的学习兴趣；但本质上是被动感知，学生参与度有限，若过度使用容易导致知识碎片化。演示法主要适用于三类场景：一是抽象概念的具象化呈现，比如物理的电路原理、生物的细胞结构、地理的地形地貌，通过直观演示让抽象知识可感可知；二是历史事件、场景的还原，比如历史事件、文化遗迹，通过图片、纪录片还原历史场景，拉近学生与内容的距离；三是操作过程的示范，比如实验操作步骤、劳动技能动作，通过教师示范让学生。"},{"t":"实验法：做中学的探究实践方法","d":"实践方法实验法是学生在教师指导下，运用仪器设备自主开展实验，探究事物规律、验证知识的方法。其核心特点是：实践性、探究性强，学生全程参与操作，既能深化对知识的理解，又能培养动手能力、科学思维与探究精神；但耗时较长，对设备、场地、教师引导能力要求较高。实验法是自然科学类学科的核心教学方法，适用场景集中在：一是学科原理的探究发现，比如物理的电路规律、化学的反应原理，让学生通过实验自主发现规律；二是理论知识的验证巩固，通过实验验证书本知识，深化理解与记忆；三是操作技能的训练培养，比如实验操作、技术实践，提升学生的动手能力。材料中林老师的电路分组实验，就是实验法的。"},{"t":"讨论法：互动共生的思维训练方法","d":"维训练方法讨论法是学生在教师指导下，围绕特定问题探讨辨析、获取知识、锻炼思维的方法。其核心特点是：互动性、开放性强，能够激发多元思考，培养学生的表达能力、合作意识与批判性思维；但对问题设计、教师调控能力要求高，若组织不当容易偏离主题、效率低下，甚至流于形式。讨论法的适用场景包括：一是开放性问题的探究，比如社会议题、文本解读、价值辨析等没有唯一答案的内容，通过讨论拓宽思路；二是重难点的深度理解，通过思维碰撞深化对知识的理解；三是综合能力的培养，在讨论中锻炼表达、倾听、合作等综合素养。材料中周老师的环保主题讨论，就是讨论法的应用尝试，但因为问题设计缺位、引导。"},{"t":"练习法：技能巩固的强化训练方法","d":"化训练方法练习法是学生在教师指导下，运用知识反复完成操作，形成技能技巧的方法。其核心特点是：针对性强、熟练度提升快，能够快速巩固知识、形成技能；但机械重复的练习容易固化思维，抑制学生的灵活性与创造力。练习法广泛适用于各类技能型内容的训练：一是基础知识的巩固，比如字词记忆、公式背诵、概念辨析；二是基础技能的熟练，比如数学运算、英语读写、解题技巧；三是解题方法的强化，通过变式练习提升知识迁移能力。材料中孙老师的同类习题训练，就是练习法的典型应用，能够快速提升固定题型的熟练度，但过度机械训练就会导致“题型稍有变化便无法应对”的问题。#####（3）结合材料一、。"}]},{"t":"（3）、二，论述教学原则对教学方法选择的指导作用，并为该校…","items":[{"t":"教学原则对教学方法选择的核心指导作用","d":"#####（3）结合材料一、二，论述教学原则对教学方法选择的指导作用，并为该校教师优化教学方法提出建议。【解析】教学原则是教学活动的根本准则，是教学方法选择、设计与优化的核心依据，决定了教学方法的价值方向、适用边界与效果底线。针对当前课堂“灌输固化、活动虚化”两大突出问题，必须以教学原则为引领，科学选择、灵活优化教学方法，切实提升课堂实效。"},{"t":"直观性原则划定了教学方法的感知逻辑，要求方法实现“直观感知—抽象思维”的进阶","d":"方法的感知逻辑，要求方法实现“直观感知—抽象思维”的进阶。直观性原则决定了教学不能从概念到概念，必须有感性认知的支撑。这指导教师在选择方法时，抽象知识必须搭配直观手段，比如讲电路要配实验演示，讲历史要配史料素材；同时直观不能脱离讲解升华，不能为了直观而直观，避免陷入形式主义。材料中方老师的问题，就是只重直观形式，忽略了讲解升华，违背了直观与讲解结合的要求。第二，启发性原则锚定了教学方法的主体定位，要求方法平衡“教师主导—学生主体”的关系。启发性原则的核心是激发学生的主动性与思维能力，这决定了教学方法既不能是单向灌输，也不能是放任自流。这指导教师选择方法时。"},{"t":"启发性原则锚定了教学方法的主体定位，要求方法平衡“教师主导—学生主体”的关系","d":"方法的主体定位，要求方法平衡“教师主导—学生主体”的关系。启发性原则的核心是激发学生的主动性与思维能力，这决定了教学方法既不能是单向灌输，也不能是放任自流。这指导教师选择方法时，讲授法要贯彻启发式，不能填鸭；探究法要做好引导，不能放羊。材料中孙老师的机械训练违背了启发性，压抑了学生思维；周老师的无引导讨论也违背了启发性，导致效率低下，二者都是没有把握好启发的尺度。第三，系统性原则明确了教学方法的目标主线，要求方法服务于知识体系的建构。系统性原则要求教学循序渐进、逻辑连贯，所有教学方法都要围绕核心知识目标展开。这指导教师不能为了追求形式创新而偏离知识主线，。"},{"t":"系统性原则明确了教学方法的目标主线，要求方法服务于知识体系的建构","d":"方法的目标主线，要求方法服务于知识体系的建构。系统性原则要求教学循序渐进、逻辑连贯，所有教学方法都要围绕核心知识目标展开。这指导教师不能为了追求形式创新而偏离知识主线，无论是实验、讨论还是练习，最终都要落脚到系统知识的掌握与能力的提升。材料中方老师的知识碎片化、周老师的讨论形式化，本质上都是脱离了系统性原则，方法没有服务于知识目标。第四，理论联系实际原则指明了教学方法的实践导向，要求方法实现“知行合一”的价值。理论联系实际原则要求教学联系生活、注重应用，这指导教学方法不能停留在书本层面，要增加实践应用环节。比如数学教学不能只练书本题型，要结合生活问题；理。"},{"t":"理论联系实际原则指明了教学方法的实践导向，要求方法实现“知行合一”的价值","d":"了教学方法的实践导向，要求方法实现“知行合一”的价值。理论联系实际原则要求教学联系生活、注重应用，这指导教学方法不能停留在书本层面，要增加实践应用环节。比如数学教学不能只练书本题型，要结合生活问题；理科教学不能只讲原理，要动手实验、解决实际问题，培养学以致用的能力。第五，因材施教原则提出了教学方法的分层要求，要求方法适配不同学生的发展水平。因材施教原则决定了教学方法不能一刀切，要根据学生的基础、能力、特点分层设计。比如讨论法要设置分层任务，实验法要提供梯度指导，练习法要设计分层作业，让不同水平的学生都能在自身基础上获得发展。"}]}]},{"id":"预测6-4-36","num":36,"title":"36 学习迁移","subject":"教心","blocks":[{"t":"（1）结合学习迁移分类理论","items":[{"t":"学科知识割裂下的零迁移现象：跨学科未产生有效影响","d":"移现象：跨学科未产生有效影响从迁移的效果维度划分，学生熟练掌握的数学函数知识完全无法应用到物理运动图像的学习中，两门学科知识在认知中互不互通，属于典型的零迁移，即两种学习之间没有产生明显的相互影响。从迁移的范围与距离来看，这种零迁移本质上是远迁移的失败。学生能够在数学学科内部的同类题型中熟练运用函数知识，属于近迁移，即原有经验在相似情境中的顺畅应用；但面对物理运动图像这一表面差异极大的新情境，学生无法识别二者的共通本质，无法实现跨学科的远迁移。从迁移的内容来看，学生的数学学习停留在具体题型与解题步骤层面，没有形成抽象的原理认知，因此只能实现针对特定题型的。"},{"t":"思维定势作用下的负迁移现象：固化模式干扰跨学科解题","d":"移现象：固化模式干扰跨学科解题从迁移的效果维度划分，学生长期形成的数学机械刷题、套公式解题的固定模式，导致在跨学科综合任务中生搬硬套数学公式、忽略物理情境与本质意义，最终出现解题逻辑偏差，属于典型的负迁移，即先前的学习对后续学习产生了消极阻碍作用。从迁移的内在心理机制来看，这是同化性迁移的误用。同化性迁移指不改变原有认知结构，直接将已有经验应用到同类事物中。学生试图直接套用数学学科的解题认知结构处理物理问题，不对物理情境的条件、本质进行分析调整，强行用数学公式套入物理过程，本质上是用同化的方式处理不同质的新情境，最终导致错误。从定势的影响来看，长期的机械。"},{"t":"教师支架支持下的条件性正迁移现象：引导下实现有限积极影响","d":"性正迁移现象：引导下实现有限积极影响从迁移的效果维度划分，在“用数学语言描述运动世界”跨学科单元教学中，通过师生互动引导，学生能够短暂理解数理关联、跟上教学节奏，说明数学知识能够对物理学习产生积极的促进作用，属于条件性的正迁移，即一种学习对另一种学习产生了积极影响。但这种正迁移具有明显的局限性：从迁移的自主性来看，它依赖教师的外部支架引导，学生无法独立完成迁移，属于高路迁移的初级阶段。高路迁移指有意识地将抽象知识应用到另一情境，这里学生还无法自主完成这种意识性的迁移，必须依靠教师的提示才能建立关联。从迁移的距离来看，这种迁移只能在课堂教学的相似情境中实现。"}]},{"t":"（2）影响知识迁移的因素","items":[{"t":"主观层面：学生认知与思维的局限性制约迁移发生","d":"学生认知与思维的局限性制约迁移发生第一，已有经验的概括水平不足，知识锚定具体题型。已有经验的抽象概括水平，是决定迁移能力高低的核心因素。概括水平越高，知识的适用范围越广，越容易实现跨情境迁移。学生在数学学习中，长期以专项训练、机械刷题为主，对一次函数、二次函数的掌握停留在“图像绘制步骤、斜率计算公式、解题套路”的具体操作层面，没有提炼出“函数是变量关系的量化表达、斜率本质是变化率、图像反映变化规律”等抽象的、一般性的原理。经验的概括度低，就导致知识的适用范围窄，只能在高度相似的数学题型中实现近迁移，无法迁移到表面形式不同、本质原理相通的物理情境中，这是跨。"},{"t":"已有经验的概括水平不足，知识锚定具体题型","d":"足，知识锚定具体题型。已有经验的抽象概括水平，是决定迁移能力高低的核心因素。概括水平越高，知识的适用范围越广，越容易实现跨情境迁移。学生在数学学习中，长期以专项训练、机械刷题为主，对一次函数、二次函数的掌握停留在“图像绘制步骤、斜率计算公式、解题套路”的具体操作层面，没有提炼出“函数是变量关系的量化表达、斜率本质是变化率、图像反映变化规律”等抽象的、一般性的原理。经验的概括度低，就导致知识的适用范围窄，只能在高度相似的数学题型中实现近迁移，无法迁移到表面形式不同、本质原理相通的物理情境中，这是跨学科迁移失败的根本认知原因。第二，信息加工方式固化，形成学科。"},{"t":"信息加工方式固化，形成学科专属思维定势","d":"成学科专属思维定势。个体加工信息的习惯、风格与思维定势，会直接影响迁移的效果，定势在相似情境中起促进作用，在差异情境中起阻碍作用。学生在数学课堂中长期形成了“套公式、代数值、算结果”的信息加工模式，思维围绕解题技巧展开；而物理学科的学习需要“分析物理过程、明确约束条件、结合运动规律、建立量化关系”的加工逻辑，思维围绕现象本质展开。两种加工方式差异显著，学生习惯了数学的解题定势，面对物理问题时就会本能地套用数学模式，忽略物理本质，不仅无法实现知识迁移，还会产生负迁移，出现解题逻辑偏差。第三，主动迁移意识缺失，形成学科割裂认知定势。学习态度与迁移意识是影响迁。"},{"t":"主动迁移意识缺失，形成学科割裂认知定势","d":"成学科割裂认知定势。学习态度与迁移意识是影响迁移的重要主观变量，主动的迁移意识能够促使个体主动联结不同领域的知识。学生长期在分科教学的模式下学习，潜移默化地形成了“数学与物理是独立学科、知识互不关联”的认知定势，没有主动跨学科调用知识的意识。遇到物理运动图像问题时，学生只会从物理学科内部寻找思路，不会主动调取已掌握的数学函数知识，人为造成了知识的割裂，使得迁移失去了内在动力。"},{"t":"客观层面：教学与情境的差异性阻碍迁移实现","d":"教学与情境的差异性阻碍迁移实现第一，学习材料与情境的相似性低，学科表征差异显著。学习材料、问题情境的相似性，是影响迁移发生的重要客观因素，相似性越高，迁移越容易发生。数学中的函数图像是抽象的数学模型，剥离了具体的物理意义，聚焦数值与逻辑关系；物理中的s-t、v-t图像是真实运动过程的量化描述，承载了运动状态、物理过程等具体内涵，聚焦规律与现实意义。二者虽然在数学本质上具有一致性，但呈现形式、情境背景、关注重点都存在显著差异。学生长期沉浸在数学的抽象题型情境中，面对物理的真实问题情境时，难以识别其中蕴含的数学模型，自然无法实现知识的自动迁移。第二，学科教学。"}]},{"t":"（3）运用“为迁移而教”的相关理论","items":[{"t":"整合跨学科教学内容，搭建迁移的内容载体","d":"搭建迁移的内容载体打破学科独立的教学格局，整合数学与物理的关联内容，共同设计跨学科主题单元，是促进迁移的基础。两位教师可以联合开发系列跨学科主题，比如“运动中的函数规律”“图像中的变化率”“真实场景的量化分析”等，围绕同一主题融合两科的知识内容。在同一个教学单元中，数学教师从函数的角度讲解变量关系，物理教师从运动的角度讲解过程规律，共同引导学生认识到二者的共通本质。通过主题式的内容整合，让学生在同一情境下同时接触两个学科的视角，打破“学科独立”的认知，为知识迁移提供内容载体。同时要注意，整合不是简单的内容叠加，而是围绕共同的核心素养目标，让两科知识相互支。"},{"t":"加强知识的纵横关联，构建迁移的认知桥梁","d":"构建迁移的认知桥梁知识之间的联系越清晰，迁移越容易发生。教学中要主动搭建知识关联的桥梁，降低迁移的认知门槛。一方面，加强纵向的新旧知识关联，在各科日常教学中提前渗透跨学科联结。比如数学教师在讲解函数图像、斜率计算时，主动引入物理运动的生活实例，让学生感知数学知识的应用场景；物理教师在讲解运动图像时，主动引导学生回忆数学中的函数变化规律，帮助学生调取已有认知，用旧知识理解新内容。另一方面，加强横向的学科本质关联，明确提炼不同学科知识的共通原理。比如共同总结“变化率”这一核心概念，明确它在数学中是斜率、在物理中是速度/加速度，帮助学生抛开学科形式差异，把握本。"},{"t":"强化知识的概括总结，提升迁移的抽象水平","d":"提升迁移的抽象水平已有经验的概括水平越高，迁移的适应性越强。教学中要改变“重题型训练、轻原理概括”的模式，把提升知识的概括水平作为教学的重要目标。数学教学中，不能只满足于学生会解具体题目，要引导学生从大量题型中提炼出一般性的原理、方法与思维模式，比如总结函数图像的分析方法、变量关系的探究思路，让学生掌握的是“渔”而非“鱼”。物理教学中，引导学生从具体的运动情境中抽象出量化规律，学会用数学语言描述物理过程，提升知识的抽象度。通过提升概括水平，让学生的知识从具体题型上升到一般原理，实现从特殊迁移到一般迁移的升级，能够灵活应用到不同的学科情境中。同时设计多样化。"},{"t":"教授迁移的学习策略，培养迁移的方法能力","d":"培养迁移的方法能力迁移能力的提升，离不开具体学习策略的支撑。教师要有意识地教授跨学科学习的方法与策略，让学生学会迁移。比如教授“本质抽象法”，引导学生面对具体问题时，先抛开具体的学科情境，提炼核心的数量关系与逻辑模型，再匹配对应的学科知识；教授“学科类比法”，引导学生遇到新问题时，主动联想其他学科的相关方法，寻找共通的解决思路。同时培养学生的元认知策略，引导学生监控自己的思考过程，反思是否陷入了学科思维定势，主动调整思考方式。比如在跨学科解题时，提醒学生先明确物理情境与条件，再调用数学工具，避免生搬硬套公式。通过策略教学，让学生掌握迁移的方法，从“学会知。"},{"t":"培养主动迁移的意识，形成迁移的内在动力","d":"形成迁移的内在动力迁移意识是主动迁移的内在动力。教师要通过多种方式培养学生的跨学科迁移意识，打破学科割裂的认知定势。首先，及时肯定与鼓励学生的迁移行为，当学生主动用数学知识解决物理问题，或者用物理实例理解数学原理时，给予明确的表扬与强化，让学生感受到迁移的价值。其次，设计梯度化的迁移任务，从有教师支架的引导迁移，逐步过渡到半独立的迁移练习，最终实现完全独立的跨情境迁移，让学生在逐步进阶中积累迁移的成功体验，提升自我效能感。最后，引导学生建立“知识整体观”，让学生认识到不同学科本质上是从不同视角认识世界，知识是相通的，而非孤立的。通过长期的引导与训练，让主。"}]}]}]},{"id":"预测6-5","name":"预测5","questions":[{"id":"预测6-5-31","num":31,"title":"31 晏阳初/梁漱溟","subject":"中教史","blocks":[{"t":"二者乡村教育思想与实践的共通之处","items":[{"t":"秉持教育救国的核心立场，立足乡村回应时代危机","d":"场，立足乡村回应时代危机二者都将乡村教育视为挽救民族危亡、改造中国社会的根本路径，坚信乡村衰败是中国整体危机的核心，教育是破解乡村困境的关键抓手。面对近代中国农村的全面衰落，二者都拒绝单纯的政治革命或碎片化经济改良路径，选择从教育入手，通过提升农民素质、重构乡村社会实现国家复兴，都是教育救国思潮在乡村领域的具体落地。"},{"t":"坚持教育与社会改造结合，推行系统性乡村建设","d":"合，推行系统性乡村建设二者都没有将乡村教育局限于学校识字教育，而是将教育视为乡村整体改造的核心牵引，推动教育与经济、卫生、道德、治理等领域协同推进。晏阳初的四大教育涵盖文化、生计、健康、公民多个维度，梁漱溟的乡农教育兼顾文化生产、风俗教化、基层治理，本质上都是以教育为核心的乡村社会系统工程。"},{"t":"扎根实地开展实验，践行知识分子与民众结合","d":"行知识分子与民众结合二者都摒弃书斋式的教育空谈，深入乡村开展长期实地实验。晏阳初迁居定县开展全县范围的乡村改造实验，梁漱溟在邹平创办乡村建设研究院落地乡农教育，都坚持从农村实际出发设计教育方案，身体力行践行知识分子下乡的道路，体现了“五四”以来知识阶层面向民众、服务社会的精神传统。"},{"t":"以人的改造为核心，着眼农民素质提升","d":"眼农民素质提升二者都将人的改造作为乡村建设的根本支点。晏阳初提出培养农民的知识力、生产力、强健力、团结力，梁漱溟强调通过精神陶冶塑造新型农民，本质上都是希望通过教育提升农民的综合素养，从根本上激活乡村发展的内生动力。"}]},{"t":"二者乡村教育思想与实践的核心差异","items":[{"t":"问题诊断：现象层面的四大病症与文化层面的失调危机","d":"20世纪二三十年代，中国乡村社会在内外冲击下全面衰败，经济凋敝、文化落后、民生失序成为普遍困境。以晏阳初、梁漱溟为代表的知识分子纷纷投身乡村建设运动，试图以教育为核心路径改造乡村社会、挽救民族危亡。晏阳初以河北定县为实验区，针对“愚、穷、弱、私”四大病症推行系统性教育改造；梁漱溟以山东邹平为实验基地，立足“文化失调”的判断开展乡农教育实践。二者同属乡村教育救国的探索，却在问题诊断、实践路径、价值取向等方面形成鲜明差异，共同书写了中国近代乡村教育的重要篇章。"},{"t":"教育目标：人的素质改良与文化秩序重建","d":"（三）人的全面发展的终极教育目标人的全面发展是马恩教育思想的核心内核。其核心内涵是摆脱旧式分工造成的人的片面、畸形发展，实现人的体力、智力、道德、个性、审美等全方位、自由充分的发展，最终实现人的彻底解放。这一目标的实现以高度发达的生产力、废除私有制、消灭阶级差异为社会基础，依托德育、智育、体育、综合技术教育协同推进，是社会主义教育的终极价值追求。"},{"t":"教育内容：四大教育协同与道德教育统合","d":"颜之推提出教育的目标是培养对国家有实际效用的治国人才，主张人才应当专精一职，因此教育内容必须兼顾“德”与“艺”两个方面。德育居于根本地位，以儒家孝悌仁义为核心，树立仁义信念、践行仁义道德是德育的最终目标；艺的内容涵盖广泛，既包括经史百家等书本知识，也包括琴、棋、书、画、数、医、射、投壶等士大夫社会生活必备的“杂艺”。此外，他还特别提出士大夫应当了解农业生产知识，知晓稼穑之艰难，避免脱离实际。"},{"t":"实践路径：三大方式协同与政教养卫合一","d":"#####（3）结合两则材料，论述人的全面发展学说对我国教育目的的指导意义，分析新时代基础教育落实全面发展教育的实践路径。【解析】马克思主义人的全面发展学说是我国教育目的的理论基石，为新时代基础教育改革指明了根本方向，对落实五育并举、推进健康学校建设、破解综合育人弱化难题具有根本性的指导意义。"}]},{"t":"二者乡村教育实验的历史贡献","items":[{"t":"晏阳初平民乡村教育的开创性贡献","d":"开创性贡献晏阳初构建了中国首个系统的乡村平民教育体系，首创“四大教育、三大方式”的框架，打破了传统学校教育的边界，将教育延伸到家庭与社会，推动乡村教育从单一识字教育转向社会系统改造。定县实验切实推动了乡村扫盲、农业技术改良、公共卫生普及与公民意识培育，在一定程度上改善了农民的生产生活状态。他提出的“农民化”理念，开创了知识分子下乡与民众结合的实践范式，其思想不仅影响了中国乡村建设，也成为世界平民教育运动的重要经验。"},{"t":"梁漱溟乡农教育的探索性价值","d":"性价值梁漱溟从文化视角探索乡村问题，立足中国社会的独特性思考乡村改造道路，避免了照搬西方模式的误区，深化了对中国乡村社会本质的认识。他提出的“政教养卫合一”模式，探索了教育与基层治理融合的路径，为乡村社会的组织化建设提供了新思路。其乡农教育实践推动了传统道德的传承与现代知识的下乡，培养了一批乡村建设人才，对邹平当地的农业改良、风俗改良产生了实际影响。"},{"t":"共同的历史价值：二者共同推动了乡村教育的发展","d":"二者共同推动了乡村教育的发展，打破了近代教育集中于城市的格局，将教育资源引入广大乡村，开启了中国现代乡村教育的先河。二者都立足中国本土实际探索乡村建设道路，体现了知识分子的爱国情怀与务实精神，为后世乡村教育发展、基层社会治理留下了宝贵的历史经验与思想遗产。"}]},{"t":"二者乡村教育实验的时代局限性","items":[{"t":"共同的改良主义局限：二者的乡村教育本质上都是社会改良主义的探索","d":"二者的乡村教育本质上都是社会改良主义的探索，都没有认识到帝国主义侵略与封建剥削压迫是中国乡村衰败的根本根源，试图单纯通过教育改造实现乡村复兴，没有触动封建土地制度与社会阶级结构，因此无法从根本上解决中国乡村的深层危机。实验都局限在较小的县域范围，缺乏全国推广的社会条件与经济基础，最终都因抗战爆发等原因中断，未能实现预期的社会改造目标。"},{"t":"晏阳初思想的局限：晏阳初对乡村问题的诊断停留在表面现象","d":"晏阳初对乡村问题的诊断停留在表面现象，将“愚、穷、弱、私”这些社会压迫的结果当成了问题的根源，导致其教育方案治标不治本。四大教育的推行缺乏相应的制度与经济支撑，公民教育等理念难以在传统乡村社会真正落地，整体上呈现出温和改良的软弱性。"},{"t":"梁漱溟思想的局限：梁漱溟的乡村理论带有明显的文化决定论倾向","d":"梁漱溟的乡村理论带有明显的文化决定论倾向，过分强调文化失调的作用，忽视了经济基础与阶级矛盾的决定性意义。他否认阶级斗争，试图在传统伦理基础上走“第三条道路”，与近代中国社会革命的主流趋势相脱节。同时其教育过于倚重传统道德教化，对现代科学与民主精神的吸纳相对有限，具有一定的保守性。####32.请结合外国教育史知识，分类概述两大取向主要教育思潮核心主张，对比二者在教育目的、课程设置、师生关系上的核心分歧，并结合结构主义、终身教育思潮，论述20世纪西方教育思潮的整体演进逻辑与历史影响。【解析】。"}]}]},{"id":"预测6-5-32","num":32,"title":"32 20世纪两大思潮","subject":"外教史","blocks":[{"t":"两类取向教育思潮的核心主张","items":[{"t":"20世纪西方教育思潮整体可分为保守取向与革新取向两大阵营","d":"####32.请结合外国教育史知识，分类概述两大取向主要教育思潮核心主张，对比二者在教育目的、课程设置、师生关系上的核心分歧，并结合结构主义、终身教育思潮，论述20世纪西方教育思潮的整体演进逻辑与历史影响。【解析】。"}]},{"t":"两类思潮在核心维度上的分歧","items":[{"t":"两类思潮基于不同的哲学立场与教育逻辑","d":"学立场与教育逻辑，在教育的核心命题上形成了鲜明对立，本质是“文化传承与社会秩序”和“个体发展与社会革新”两种教育价值的博弈。"}]},{"t":"20世纪西方现代教育思潮的整体演进逻辑与历史影响","items":[{"t":"20世纪中后期兴起的结构主义教育与终身教育思潮","d":"结构主义教育与终身教育思潮，是对前期两大阵营理论的整合与超越，既吸收了双方的合理内核，也拓展了教育理论的边界，推动整个现代教育思潮呈现出清晰的演进脉络。"}]}]},{"id":"预测6-5-33","num":33,"title":"33 教学组织与评价","subject":"教原","blocks":[{"t":"（1）分析该校教学组织形式改革体现了哪些现代教学组织形式的…","items":[{"t":"教学组织形式改革体现的核心方向","d":"#####（1）结合材料二，分析该校教学组织形式改革体现了哪些现代教学组织形式的改革方向，并评析分层走班与翻转课堂在实施中存在的问题及其原因。【解析】该校推进的分层走班、翻转课堂、混合式教学等改革，集中体现了现代教学组织形式从标准化、统一化走向个性化、分层化、信息化、混合化的核心改革方向，是对传统班级授课制的优化与突破，但在实践中也因适配性不足、配套机制缺失暴露出相应问题。"},{"t":"走向分层化、个别化的适配性教学，回应学生差异需求","d":"适配性教学，回应学生差异需求。传统班级授课制以统一进度、统一内容面向全体学生，难以兼顾不同学生的能力基础与学习节奏。该校实施分层走班制，学期初通过学业诊断将学生分为不同层次，不同层次班级的教学进度、难度各不相同，本质上是分层教学与走班制的结合实践，契合现代教学组织形式“尊重个体差异、实施因材施教”的改革方向。这种改革打破了固定班级的统一教学模式，根据学生的知识与能力水平分组施教，让教学难度、进度匹配学生的接受能力，是个别化教学理念在班级授课制框架下的创新实践，目的是让每个学生都能在适配的节奏中获得最佳发展。第二，走向信息化、混合化的重构式教学，重塑教学流。"},{"t":"走向信息化、混合化的重构式教学，重塑教学流程形态","d":"重构式教学，重塑教学流程形态。该校引入翻转课堂模式，教师课前录制微课，学生课前自主学习，课堂用于讨论、练习答疑；同时开展混合式教学，线上资源配合线下课堂，支持学生在线自学与检测。这体现了现代教学组织形式“信息技术赋能、线上线下融合”的改革方向，是对传统课堂时空边界的突破。翻转课堂重构了“课前学知识、课内化知识”的教学流程，将知识学习环节前置到课外，课堂聚焦互动深化与能力提升；混合教学则整合了在线学习的便捷性与线下课堂的互动性，契合泛在学习、数字化教学的发展趋势，推动教学从“课堂中心”向“学习中心”转变。第三，走向主体化、自主化的学习型教学，转变学习动力模。"},{"t":"走向主体化、自主化的学习型教学，转变学习动力模式","d":"学习型教学，转变学习动力模式。无论是分层走班赋予学生的分层选择空间，还是翻转课堂、混合教学赋予学生的课前自主学习权，都体现了现代教学组织形式“以学生为主体、激发自主学习”的改革方向。改革不再局限于教师“教”的形式优化，更关注学生“学”的方式变革，通过组织形式的调整调动学生的学习主动性，推动从“教师中心”向“学生中心”转型，让学习从被动的知识接收转向主动的意义建构。"},{"t":"分层走班实施中的问题与成因","d":"与成因分层走班改革中出现B、C层部分学生自我效能感下降、认为分层是贴差生标签的问题，本质上是分层模式的配套机制缺失与标签效应共同作用的结果。第一，分层的标签效应伤害学生自尊，引发消极自我认知。分层教学如果只以学业成绩为标准划分层级，并且用显性的A、B、C层级命名，很容易给学生贴上“优生”“差生”的身份标签。处于低层级的学生容易产生自我否定，认为自己被官方定义为“差生”，进而降低自我效能感，甚至产生自卑、厌学情绪。这违背了分层教学“因材施教、促进每个学生更好发展”的初衷，反而对低层级学生的学习动力造成打击，出现“越分层、越掉队”的反向效果。第二，静态分层缺。"}]},{"t":"（2）从评价功能与评价方法两个维度","items":[{"t":"基于评价功能维度的评价类型与作用","d":"价类型与作用从评价的实施功能与阶段来看，该校的评价改革涵盖了诊断性评价、形成性评价、终结性评价三类，形成了贯穿教学全程的完整评价链条。"},{"t":"诊断性评价：前置定位，精准分层","d":"【解析】课堂提问、随堂点评是在教学过程中进行的评价，属于形成性评价，可以了解学情、诊断问题、反馈教学，并动态调整教学策略。A说单元前置小测主要用于划分学习组别，窄化了诊断性评价功能；B说标准参照评价可横向对比学生学业水平，不准确，标准参照评价主要判断是否达到标准；D说增值性评价可作为教师绩效考核核心依据，过于绝对。因此选C。"},{"t":"形成性评价：过程调控，反馈改进","d":"【解析】课堂提问、随堂点评是在教学过程中进行的评价，属于形成性评价，可以了解学情、诊断问题、反馈教学，并动态调整教学策略。A说单元前置小测主要用于划分学习组别，窄化了诊断性评价功能；B说标准参照评价可横向对比学生学业水平，不准确，标准参照评价主要判断是否达到标准；D说增值性评价可作为教师绩效考核核心依据，过于绝对。因此选C。"},{"t":"终结性评价：结果检验，质量兜底","d":"针对课程评价标准缺失、育人成效难以衡量的问题，教师要主动探索适配特色校本课程的多元评价体系，打破传统纸笔评价的局限。构建过程性评价与终结性评价相结合、学生自评、互评与教师评价相结合的综合评价模式，聚焦学生实践能力、创新思维、合作能力、品格素养的发展变化，精准衡量课程育人成效。同时以评价结果为导向，反向推动课程内容、教学方式的优化升级，形成“创生—实施—评价—优化”的良性循环，持续提升课程创生质量。6\\.坚持教学相长，在师生互动中生成课程价值课程创生的核心生命力源于师生互动。教师在课程实施过程中，要充分尊重学生的主体性，鼓励学生主动参与、大胆探究、自主创新。"},{"t":"基于评价方法维度的评价类型与作用","d":"价类型与作用从评价的实施方法与载体来看，该校的评价改革涵盖了纸笔测验、表现性评价、档案袋评价、自评与互评四种类型，实现了量化与质性、过程与结果的多元结合。"}]},{"t":"（3）和材料二","items":[{"t":"新时代教学评价改革的核心理念","d":"#####（3）结合材料一和材料二，论述新时代教学评价改革的核心理念，并为该校解决评价改革中的现实困境提出建议。【解析】新时代义务教育质量评价改革以立德树人为根本遵循，以学生发展为中心，推动评价理念、功能、内容、方式的系统性变革，是破除“唯分数、唯升学”导向、落实全面育人的核心抓手。该校的评价改革契合改革方向，但也面临分层标签效应、翻转课堂配套不足、教师评价负担重等现实困境，需要以改革理念为引领，系统优化破解难题。"},{"t":"坚持以生为本的发展性评价，回归育人本质","d":"评价，回归育人本质。新时代评价改革的核心是“以学生发展为中心”，评价的根本目的不是给学生贴标签、排名次，而是诊断教学问题、改进教学实践、促进学生成长。这要求评价从传统的选拔、甄别功能，转向发展、激励、改进功能，把促进学生全面、主动、可持续发展作为评价的出发点与落脚点。材料一中明确提出评价不是贴标签、排名次，而是诊断问题、改进教学、促进成长，正是发展性评价理念的核心体现。第二，坚持过程与结果并重的整体性评价，优化评价结构。针对传统评价“重结果、轻过程”的弊端，新时代评价改革强调改进结果评价，强化过程评价，构建贯穿教学全程的评价链条。既重视最终的学业质量，也。"},{"t":"坚持过程与结果并重的整体性评价，优化评价结构","d":"整体性评价，优化评价结构。针对传统评价“重结果、轻过程”的弊端，新时代评价改革强调改进结果评价，强化过程评价，构建贯穿教学全程的评价链条。既重视最终的学业质量，也重视学习过程中的努力、进步与成长，通过过程评价引导学生重视学习过程，实现“以评促学、以评促教”。材料一中提出“强化过程评价”，该校将过程性表现占比设为40%，正是对这一理念的实践落地。第三，坚持多元综合的全面性评价，落实五育并举。新时代评价改革破除“唯分数、唯升学”的片面导向，强调健全综合评价，覆盖品德、学业、身心健康、审美、劳动与社会实践等多个维度，推动评价从单一的智育评价转向五育并举的全面评。"},{"t":"坚持多元综合的全面性评价，落实五育并举","d":"评价，落实五育并举。新时代评价改革破除“唯分数、唯升学”的片面导向，强调健全综合评价，覆盖品德、学业、身心健康、审美、劳动与社会实践等多个维度，推动评价从单一的智育评价转向五育并举的全面评价。材料一中明确监测覆盖五大领域，就是要通过综合评价的指挥棒，引导学校落实五育并举，促进学生全面发展。第四，坚持技术赋能的高效性评价，减轻师生负担。新时代评价改革强调依托信息技术赋能评价改革，通过数字化、智能化的评价工具，优化评价流程，提升评价效率，减轻师生的不合理负担。材料一中提出“依托信息技术赋能评价改革，减轻师生不合理负担”，正是评价改革现代化的重要方向，也是破解。"},{"t":"坚持技术赋能的高效性评价，减轻师生负担","d":"评价，减轻师生负担。新时代评价改革强调依托信息技术赋能评价改革，通过数字化、智能化的评价工具，优化评价流程，提升评价效率，减轻师生的不合理负担。材料一中提出“依托信息技术赋能评价改革，减轻师生不合理负担”，正是评价改革现代化的重要方向，也是破解评价工作量大、效率低问题的核心路径。第五，坚持诊断改进的服务性评价，服务教学实践。新时代评价改革强调评价的服务功能，评价不是目的，而是改进教学、促进成长的手段。通过评价诊断教学中的问题，反向优化教学策略，提升教学质量，实现“评价—诊断—改进—提升”的良性循环。"}]}]},{"id":"预测6-5-34","num":34,"title":"34 学习策略","subject":"教心","blocks":[{"t":"（1）结合元认知策略理论","items":[{"t":"小孙运用的核心元认知策略","d":"策略第一，计划策略：事前规划，锚定学习路径。元认知计划策略是指在认知活动开始前，根据特定目标规划活动程序、预判问题、设计解决路径的策略，涵盖目标制定、任务排序、路径设计等内容。小孙放学首先列出当日任务清单，并按难易程度排序，正是计划策略的典型应用。在每日学习开始前，他先梳理当日所有学习任务，建立清晰的任务目标体系，再按照难易程度完成优先级排序，预判不同任务的难度与精力投入，设计最优的完成顺序。这种事前规划避免了学习的盲目性，让后续的学习活动有明确的方向与节奏，从起点上保障了学习的有序性。第二，监控策略：事中调控，保障学习专注。元认知监控策略是指在学习过程。"},{"t":"计划策略：事前规划，锚定学习路径","d":"元认知策略是个体对自身认知过程进行监控、调节与管理的高阶策略，本质是“对认知的认知”，具体包括计划策略、监控策略与调节策略三大类，贯穿学习活动的事前、事中、事后全过程，是自主学习能力的核心支撑。小孙的良好学习习惯，正是系统运用元认知策略的典型体现，每类策略都对应具体的行为表现，共同支撑了高效的自主学习。"},{"t":"监控策略：事中调控，保障学习专注","d":"【解析】按照题材归类诗歌、绘制思维导图属于组织策略，主要用于整合零散知识、构建知识体系，因此C正确。A想象诗歌画面属于精加工策略，但“梳理知识层级结构”属于组织策略；B圈画字词、写批注不完全属于复述策略，写批注更多是精加工；D预习标记疑难诗句主要属于复述或元认知监控策略，不是精加工策略。因此选C。"},{"t":"调节策略：事后调整，优化学习过程","d":"元认知策略是个体对自身认知过程进行监控、调节与管理的高阶策略，本质是“对认知的认知”，具体包括计划策略、监控策略与调节策略三大类，贯穿学习活动的事前、事中、事后全过程，是自主学习能力的核心支撑。小孙的良好学习习惯，正是系统运用元认知策略的典型体现，每类策略都对应具体的行为表现，共同支撑了高效的自主学习。"},{"t":"元认知策略对自主学习能力发展的核心作用","d":"能力发展的核心作用元认知策略是自主学习的“导航系统”，从根本上决定了自主学习的质量与效率，对学生自主学习能力的发展具有关键性的支撑作用。第一，实现从被动学习到主动规划的转变，提升学习的自主性。元认知策略让学生不再是被动的任务执行者，而是学习的主动规划者。学生能够自主设定目标、安排进度、设计路径，从“老师让我学”转向“我知道怎么学”，真正成为学习的主体，这是自主学习能力的核心标志。第二，实现从盲目学习到精准调控的转变，提升学习的高效性。通过全程监控与灵活调节，学生能够及时发现学习中的问题，调整学习策略，排除干扰因素，避免时间与精力的浪费，让学习过程始终处于。"}]},{"t":"（2）综合运用时间管理策略、努力管理策略和环境管理策略","items":[{"t":"小唐自主学习效率低下的深层原因","d":"#####（2）综合运用时间管理策略、努力管理策略和环境管理策略，分析小唐自主学习效率低下的原因，并为李老师提出指导小唐改进的具体措施。【解析】自主学习效率的提升离不开时间管理、努力管理、环境管理三类资源管理策略的协同支撑。小唐自主学习状态不佳、效率低下，本质上是三类策略全面缺失的结果，需要从三个维度系统干预，帮助其掌握科学的自我管理方法。"},{"t":"时间管理策略缺失，学习无序且时间利用率低","d":"习无序且时间利用率低。时间管理策略是通过合理规划时间、高效利用时间资源保障学习效率的策略，包括计划时间、最优时间利用、化零为整等核心方法。小唐在时间管理上存在明显短板：一是缺乏学习计划，放学回家先刷短视频，七点左右才开始写作业，没有主动规划学习时间，将大量黄金时间消耗在无关活动上，学习启动严重滞后；二是没有把握最优学习时间，精力最充沛的时段被娱乐活动占据，开始学习后精力已经下降，学习效率大打折扣；三是时间碎片化严重，写作业时频繁查看手机，不断打断学习节奏，整块的学习时间被切割成零散碎片，无法进行深度思考，严重影响学习质量。时间管理的混乱，是其学习效率低下。"},{"t":"努力管理策略薄弱，意志控制与动机支撑不足","d":"志控制与动机支撑不足。努力管理策略是通过调节心理状态、维持意志努力、强化学习动机，保障学习持续投入的策略，包括归因调整、心境调节、意志控制、自我强化等方法。小唐在努力管理上的问题十分突出：一是意志控制能力不足，难以抵制短视频、手机信息的诱惑，明明想早点写完作业却难以自控，无法将注意力持续集中在学习任务上，容易被无关因素干扰；二是问题解决的努力坚持不足，遇到难题不经过独立思考就直接拍照搜题抄写答案，回避思考过程，没有付出足够的意志努力突破瓶颈，学习停留在表层完成，没有深度加工；三是缺乏积极的自我强化与归因调整，他将问题归因为自己“难以自控”，没有意识到是方。"},{"t":"环境管理策略缺位，学习环境干扰因素过多","d":"习环境干扰因素过多。环境管理策略是通过主动管控学习环境、排除干扰、利用环境相似性提升学习效率的策略，包括自然条件调节、学习空间设计等。小唐的学习环境存在大量干扰源：书桌堆放零食、漫画玩具，视觉干扰物多；手机放在一旁，随时会产生信息提示，听觉与注意力干扰频繁；没有专门的、整洁的学习空间，各种无关刺激不断分散注意力，导致学习时极易分心，无法进入深度专注的状态。环境的干扰，进一步加剧了时间的浪费与意志的消耗，成为效率低下的重要诱因。"},{"t":"指导小唐改进的具体教育措施","d":"育措施针对小唐的问题，李老师可以结合“学会学习”主题活动，从三类策略入手，开展针对性的指导与训练，帮助其逐步提升自主学习能力。第一，系统教授时间管理策略，建立有序的学习节奏。一是开展任务规划训练，指导学生学习制定每日学习任务清单，按照“先难后易”“重要优先”的原则排序，教给学生拆解任务、设定节点的方法，让学习从无序走向有序。比如引导小唐放学先列任务，明确每项任务的预计时间，优先完成重要且难的任务，避免拖延。二是最优时间利用指导，引导学生识别自己的精力高峰时段，将高难度的学习任务安排在精力最旺盛的时间，把娱乐、休息安排在精力低谷期，提升时间利用效率。比如建。"}]},{"t":"（3）运用学业求助策略理论","items":[{"t":"部分学生“从不求助”的深层原因","d":"#####（3）运用学业求助策略理论，分析材料中部分学生“从不求助”的原因，并结合班级“学会学习”主题教育活动，阐述教师应如何培养学生的适应性求助能力。【解析】学业求助策略是学生遇到学习困难时，主动寻求他人支持以突破瓶颈、提升效率的重要学习策略，分为工具性求助（适应性求助）与执行性求助（非适应性求助）两类。部分学生“从不求助”，本质上是对学业求助的认知偏差与能力缺失，需要结合“学会学习”主题教育，系统引导学生建立正确的求助观念，掌握适应性求助的方法。"},{"t":"自我效能感偏低，将求助等同于能力不足","d":"助等同于能力不足。学业求助行为与学生的自我效能感高度相关，低自我效能水平的学生普遍认为，向别人求助就等于承认自己能力差，会被老师、同学看不起，为了维护自尊，避免暴露“自己不行”，宁愿自己硬扛或直接放弃，也不主动求助。材料中部分学生“认为提问代表自己能力不足”，正是这种认知的典型体现。这类学生将独立完成任务作为衡量能力的唯一标准，将求助视为对自我能力的否定，为了保护自尊而回避求助，哪怕因此影响学习效率也在所不惜。第二，归因模式偏差，将独立完成绝对化。受传统学习观念的影响，很多学生形成了“独立学习才是优秀，求助就是依赖”的错误归因。他们认为，只有完全靠自己解。"},{"t":"归因模式偏差，将独立完成绝对化","d":"完成绝对化。受传统学习观念的影响，很多学生形成了“独立学习才是优秀，求助就是依赖”的错误归因。他们认为，只有完全靠自己解决问题才是能力强的表现，求助就是不独立、不优秀的体现，因此刻意回避求助。这种归因忽略了学习的社会性与互动性，将独立学习推向了极端，最终反而阻碍了自身的学习与进步。第三，过往经验的负面影响，形成求助的负面预期。学生的求助行为受过去习得经验的深刻影响，如果学生之前求助时，曾经被老师批评“这么简单都不会”，或者被同学嘲笑，就会形成“求助会带来负面评价”的负面预期，进而回避求助。还有的学生因为性格内向，或者缺乏社交技巧，不知道怎么开口求助，害怕。"},{"t":"过往经验的负面影响，形成求助的负面预期","d":"形成求助的负面预期。学生的求助行为受过去习得经验的深刻影响，如果学生之前求助时，曾经被老师批评“这么简单都不会”，或者被同学嘲笑，就会形成“求助会带来负面评价”的负面预期，进而回避求助。还有的学生因为性格内向，或者缺乏社交技巧，不知道怎么开口求助，害怕求助被拒绝，因此选择不求助。第四，求助策略能力不足，不知道如何有效求助。部分学生缺乏学业求助的策略训练，不知道什么时候该求助、向谁求助、怎么求助才有效。有的学生遇到问题时，判断不了是自己再想想就能解决，还是必须求助；有的学生想求助但不知道找老师还是找同学，也不知道怎么表达自己的问题；还有的学生分不清工具性求。"},{"t":"求助策略能力不足，不知道如何有效求助","d":"知道如何有效求助。部分学生缺乏学业求助的策略训练，不知道什么时候该求助、向谁求助、怎么求助才有效。有的学生遇到问题时，判断不了是自己再想想就能解决，还是必须求助；有的学生想求助但不知道找老师还是找同学，也不知道怎么表达自己的问题；还有的学生分不清工具性求助与执行性求助的区别，要么不问，要么直接要答案，没有掌握正确的求助方法，因此干脆选择不求助。"}]}]},{"id":"预测6-5-35","num":35,"title":"35 德育过程与原则","subject":"教原","blocks":[{"t":"（1）分析刘老师的德育实践体现了德育过程的哪些基本规律。","items":[{"t":"德育过程是学生在教师引导下自主建构个体品德的过程","d":"引导下自主建构个体品德的过程。学生并非被动接收道德灌输，而是主动选择、吸收环境与教育影响，自主建构自身道德观念，教师则发挥引导作用，组织活动促进学生主动思考。面对班级考试作弊的现象，刘老师没有直接追查学生、简单批评惩戒，而是组织班委会策划诚信主题班会，由班委收集全班学生对于诚信问题的看法，组织全班开展观点讨论，让学生自主辨析“作弊是否公平”“不作弊会不会吃亏”等真实道德困境。在这个过程中，学生在群体讨论、思想碰撞中自主思考诚信的价值，自主起草班级诚信公约，形成属于班级群体的道德规范，而非教师直接下达道德命令。同时，刘老师尊重小华的特点，利用小华在同学中的。"},{"t":"德育过程是培养学生知、情、意、行整体和谐发展的过程","d":"情、意、行整体和谐发展的过程。品德包含道德认识、道德情感、道德意志、道德行为四个要素，四者相互联系、相互促进，德育需要兼顾四个维度，同时德育具有多开端性，可以根据学生品德发展短板灵活选择教育切入点。诚信主题班会，首先提升学生对诚信的道德认识，让学生辨析作弊的危害与公平的价值；在集体讨论中，学生产生对于失信行为的道德评判，形成相应道德情感；学生起草诚信公约，约定行为底线，尝试约束自身行为，锻炼道德意志；公约推行之后学生测验行为得到改善，落实到道德行为层面。材料中学生周记写道“公约归公约，关键时候很难坚持”，这恰恰体现道德意志是薄弱环节，学生虽然具备道德认知。"},{"t":"德育过程是不断提高学生自我教育能力的过程","d":"生自我教育能力的过程。自我教育能力包含自我期望、自我评价、自我调控能力，是衡量德育成效的重要标志，德育的最终目标是激发学生自我教育，实现由他律向自律转变。刘老师组织班委会牵头开展班会、学生自主讨论、自主起草诚信公约，让学生参与班级道德规范的制定，引导学生自主评价班级内的诚信问题，自主约定行为底线，锻炼学生自我评价与自我管理能力。在接力赛事的实践中，小华承担组织任务，在和老师沟通、组织同学训练的过程中，学会自我约束，主动减少课堂讲话的行为，逐步形成自我调控的意识。班级积分管理制度，将行为标准公开张贴，每周汇总，目的是让学生对照标准评价自身行为，主动调整言行。"},{"t":"德育过程是德育矛盾积极转化的过程","d":"极转化的过程。德育过程的主要矛盾是教师向学生提出的道德要求，与学生当前已有的思想品德水平之间的矛盾，德育就是不断推动这类矛盾转化，促进学生品德提升。班级出现作弊现象，学生内心存在“遵守诚信”和“作弊不吃亏”的思想矛盾，刘老师通过主题班会创设道德讨论的情境，引导学生辨析矛盾，推动学生思想观念向认同诚信的方向转化。小华存在纪律意识薄弱、课堂随意讲话的问题，他原有思想品德水平和班级规范要求之间存在矛盾，刘老师没有单纯批评，而是发掘他的组织能力，安排他负责接力训练，在集体责任的要求下，推动小华思想行为发生积极转变。积分管理的推行，是向学生明确提出行为规范要求，以。"}]},{"t":"（2）分析刘老师运用的德育原则","items":[{"t":"集体教育与个别教育相结合原则","d":"【解析】王老师依靠班集体舆论影响学生，又同步进行个别谈话，体现集体教育与个别教育相结合；既讲授道德规范，又组织公益实践，体现知行统一；依靠规章制度约束行为，坚持长善救失，体现正面引导与纪律约束相结合、依靠积极因素克服消极因素。A中“必须依托班级制度强制约束才能实现”过于绝对；C把品德转化关键归结为规章制度，片面；D说道德实践起决定性作用，也不准确。因此选B。"},{"t":"知行统一原则","d":"刘老师在班级德育工作中综合运用了集体教育与个别教育相结合原则、知行统一原则、正面引导与纪律约束相结合原则、长善救失原则、教育影响一致性与连贯性原则等多项德育原则，各项原则的落实取得了一定育人成效，但同时也存在诸多局限与问题。第一，集体教育与个别教育相结合原则。该原则强调德育既要依靠集体力量教育个体，又要通过个别学生的转变带动整个集体，将教师主导作用与集体教育力量相结合。刘老师面对班级作弊问题，没有单独追查个体，而是面向全班开展诚信主题班会，依靠班集体讨论，由全班共同制定班级诚信公约，依靠集体舆论、集体约定约束每一位学生，发挥集体教育的力量。针对小华这一个。"},{"t":"正面引导与纪律约束相结合原则","d":"【解析】王老师依靠班集体舆论影响学生，又同步进行个别谈话，体现集体教育与个别教育相结合；既讲授道德规范，又组织公益实践，体现知行统一；依靠规章制度约束行为，坚持长善救失，体现正面引导与纪律约束相结合、依靠积极因素克服消极因素。A中“必须依托班级制度强制约束才能实现”过于绝对；C把品德转化关键归结为规章制度，片面；D说道德实践起决定性作用，也不准确。因此选B。"},{"t":"发挥积极因素、克服消极因素原则（长善救失原则）","d":"极因素原则（长善救失原则）。该原则要求教师一分为二看待学生，发掘学生身上的闪光点，依靠学生自身积极因素克服品德当中的消极因素。刘老师通过家访和日常观察，发现小华虽然经常迟到、不交作业、扰乱课堂，但是在操场号召力强，同学愿意跟随他参与活动，这就是小华身上的积极因素。刘老师利用这个优势，安排小华负责班级接力赛训练，发挥他的组织号召力，让他在承担集体责任的过程中，克服自身纪律松散的缺点。成效方面，长善救失的教育方式尊重小华，发掘他的优势，让小华获得成就感与集体归属感，有效减少课堂讲话行为，实现消极行为的改善。但局限在于，本次教育依托运动会这一次活动，属于短期实。"},{"t":"教育影响一致性原则","d":"该原则要求协调学校、家庭、社会多方教育力量，形成协同育人合力。刘老师开展家访了解小华家庭情况，组织家长会和家长沟通学生情况，尝试联动家庭共同开展德育。但是在实践中暴露出很大问题，部分家长存在教育观念偏差，认为学生只要成绩好，不惹麻烦就可以，忽视品德养成；还有家长无法有效管控孩子手机使用，家庭的价值导向和学校德育要求不一致，家校之间教育影响相互冲突，抵消学校德育的效果，学校主导的协同育人没有真正落地。综合评析，刘老师德育工作摒弃简单粗暴的惩罚与道德灌输，重视学生参与、集体力量、因材施教，在一定程度上促进学生品德发展。但是德育工作存在重短期活动、轻长期意志培。"}]},{"t":"（3）和材料二","items":[{"t":"德育实践贯彻德育原则需要注意的问题","d":"需要注意的问题第一，贯彻德育原则必须坚持以学生品德自主建构为核心，避免走向两个极端：单纯道德知识灌输，或者单纯行为规训。德育原则的落实，不是把道德规范强行灌输给学生，也不是依靠奖惩制度简单管控学生行为。无论是疏导原则、知行统一原则，还是集体教育原则，根本目标都是引导学生自主形成道德信念。在德育实践中，如果只重视讲道理、背诵道德规范，忽略学生的内心体验与实践，会造成学生道理明白，但是无法落实到行动；如果仅仅依靠积分、公约等外部奖惩约束行为，只管控外在表现，忽视内在道德情感、意志的培育，学生会形成功利化的道德认知，遵守规则只是为了获得奖励或者规避惩罚，一旦外。"},{"t":"贯彻德育原则必须坚持以学生品德自主建构为核心","d":"以学生品德自主建构为核心，避免走向两个极端：单纯道德知识灌输，或者单纯行为规训。德育原则的落实，不是把道德规范强行灌输给学生，也不是依靠奖惩制度简单管控学生行为。无论是疏导原则、知行统一原则，还是集体教育原则，根本目标都是引导学生自主形成道德信念。在德育实践中，如果只重视讲道理、背诵道德规范，忽略学生的内心体验与实践，会造成学生道理明白，但是无法落实到行动；如果仅仅依靠积分、公约等外部奖惩约束行为，只管控外在表现，忽视内在道德情感、意志的培育，学生会形成功利化的道德认知，遵守规则只是为了获得奖励或者规避惩罚，一旦外部监督消失，就难以坚持道德行为。材料二当。"},{"t":"贯彻德育原则要兼顾知情意行完整统一","d":"情意行完整统一，重视德育的长期性、反复性，不能期望依靠单次主题活动实现品德的永久转变。学生品德发展过程中，知、情、意、行四个要素发展常常不均衡，很多学生道德认知到位，但是道德意志薄弱，容易出现知行脱节。在落实各项德育原则时，不能只偏重道德认知教育，还要兼顾道德情感体验、道德意志锻炼与行为习惯训练。德育不是一次性活动，学生思想矛盾会反复出现，品德提升是螺旋上升的过程。不能在开展一次主题班会、制定一份公约之后就停止德育工作，必须持续跟进、反复巩固。材料一中明确德育要以养成良好行为习惯为重点，落实知行合一，恰恰说明品德习惯需要长期锤炼，不能追求短期成效。同时德。"},{"t":"贯彻德育原则需要统筹多方教育力量，坚持教育影响的一致性，构建家校社协同育人体系","d":"多方教育力量，坚持教育影响的一致性，构建家校社协同育人体系。德育原则中的教育影响一致性与连贯性原则，要求学校发挥主导作用，协调家庭、社会的教育影响，保持价值导向统一。学生的品德塑造，同时受到学校教育、家庭教养、社会环境多重影响。如果学校倡导诚信、责任、集体主义，但是家庭传递“成绩优先，品德次要”的价值观，家校教育要求相互矛盾，德育效果会被大幅削弱。在贯彻德育原则开展班级德育时，不能只局限在班级内部开展工作，必须主动开展家庭教育指导，纠正家长的片面教育观念，引导家长配合学校德育要求，协调家校教育步调，形成协同育人合力。材料一文件强调学校承担协同育人主导责任。"},{"t":"贯彻德育原则应当辩证处理好尊重信任学生与严格要求学生、集体教育与个别教育之间的关系","d":"处理好尊重信任学生与严格要求学生、集体教育与个别教育之间的关系。落实德育原则，一方面要尊重学生人格，相信学生具备自我教育的潜能，采用疏导、启发、长善救失的方式，发掘学生身上的积极因素，避免简单批评、贴标签；另一方面也要提出合理、稳定、严格的道德与行为要求，做到宽严相济。同时要兼顾集体与个体，依靠集体舆论、集体活动教育全体学生，同时关注学生个体差异，针对不同学生的成长背景、个性特点开展个别教育。只重视集体统一要求，容易忽略学生个体差异；只关注个别学生，缺少集体氛围的支撑，德育的覆盖面和持续性会受到限制。"}]}]},{"id":"预测6-5-36","num":36,"title":"36 问题解决","subject":"教心","blocks":[{"t":"（1）结合问题解决的基本过程理论","items":[{"t":"理解与表征问题能力薄弱，无法精准拆解真实复杂问题，是学生解题困难的核心根源","d":"弱，无法精准拆解真实复杂问题，是学生解题困难的核心根源。理解和表征问题是问题解决的首要前提，要求学生能够精准识别有效信息、剔除无关冗余信息、理解信息背后的实际含义，并对问题形成整体、完整的认知，清晰把握问题的核心目标。本次垃圾分类方案设计属于真实场景问题，包含垃圾产量、各类垃圾占比、清运成本、场地限制、师生接受度等多重复杂信息，存在大量冗余、干扰性内容。而学生长期适应结构单一、条件明确的常规数学应用题，缺乏复杂问题表征能力。一方面，学生无法精准筛选有效信息，难以区分数据的实用价值，经常误用无关数据开展计算，导致解题基础出现偏差；另一方面，学生仅能机械套用。"},{"t":"寻求解答方式固化单一，依赖机械算法，缺乏灵活的启发式解题思维","d":"依赖机械算法，缺乏灵活的启发式解题思维。在寻求解答阶段，问题解决包含算法式和启发式两种核心策略，常规标准化应用题可依靠固定算法顺利解决，但真实情境的项目化问题无固定解题模板，必须依托启发式思维灵活拆解问题、设计方案。长期刷题训练让学生形成了固化的解题思维，习惯使用单一的算法式策略，只会机械套用平均数、百分比等固定数学公式完成计算，不会根据真实问题的复杂条件调整解题思路。学生缺乏手段目的分析法、类比思维、多维度推演等启发式解题能力，无法结合场地限制、成本约束等现实条件，多角度设计垃圾分类优化方案，只能停留在表层数据计算层面，无法实现知识与真实问题的适配，难。"},{"t":"执行解答计划机械僵化，缺乏问题适配性，无法落地真实问题解决方案","d":"缺乏问题适配性，无法落地真实问题解决方案。执行计划阶段要求学生结合问题目标和现实条件，灵活落实解题思路、完成方案设计。但学生在本次项目学习中，解题执行完全脱离实际需求，机械照搬常规解题流程，只完成基础的数据计算，却不会结合校园真实场景优化方案。多数学生仅完成数值运算，无法将计算结果转化为可落地的垃圾分类优化策略，也不会根据场地、成本等现实约束调整解题和设计思路，导致解题过程流于形式，无法真正解决校园垃圾分类优化的核心问题。同时，由于前期问题表征偏差、解题思路单一，学生的执行过程缺乏针对性和逻辑性，出现数据误用、指标单一、方案空洞等一系列问题，解题执行效果。"},{"t":"缺乏科学的结果评价能力，无法验证方案合理性与优势","d":"力，无法验证方案合理性与优势。评价阶段是问题解决的收尾关键环节，要求学生对解题过程、计算结果、解决方案的科学性、合理性、可行性进行全面校验复盘。本次项目式学习无标准答案，需要学生自主论证方案优势、校验方案可行性，但学生完全缺乏对应的评价能力。很多学生能够设计出看似合理的垃圾分类方案，却无法运用数学知识、真实数据证明方案的科学性与优势，不会从成本、效率、可行性等多维度评价方案质量。同时，学生无法复盘自身解题过程中的问题，对自身误用数据、指标单一、思路片面等问题毫无认知，不能及时修正解题偏差，最终导致项目学习成果质量低下，无法达成解决真实问题的学习目标。整体。"}]},{"t":"（2）从结构不良问题的解决过程角度","items":[{"t":"厘清问题情境与核心限制，完成问题精准定位","d":"制，完成问题精准定位。结构不良问题解决的首要特殊过程是全面梳理问题背景、筛选有效信息、厘清多重情境限制。学生解决垃圾分类方案问题时，需要摒弃常规解题的单一思维，全面梳理校园垃圾产量、各类垃圾占比、清运成本、场地条件、师生接受度等全部情境要素，精准区分有效数据与无关冗余信息，剔除无效干扰条件，明确本次项目的核心目标并非单纯计算数据，而是依托数学知识设计低成本、高可行性、高接受度的垃圾分类优化方案，突破单一“减量”的片面认知。针对学生信息筛选能力弱、问题认知片面的问题，张老师可开展问题拆解专项指导，提前梳理项目情境中的各类约束条件，带领学生分类辨析有效信息与。"},{"t":"澄清多元立场与评价维度，建立全面解题视角","d":"度，建立全面解题视角。结构不良问题具备多元评价角度，不存在单一评判标准，需要解题者兼顾多方立场、多重指标综合考量。学生解题时需要跳出单一数据思维，兼顾学校管理、师生体验、成本管控、场地适配等多方立场，不再局限于垃圾总量减少这单一指标，综合平衡各类影响因素。针对学生思维片面、评价维度单一的问题，张老师可创设多元讨论场景，组织学生分组探讨垃圾分类方案需要考虑的核心要素，引导学生自主梳理成本、可行性、师生接受度等评价维度，帮助学生建立多维度、全方位的解题思维，规避片面化解题误区。第三，结合情境要素，自主设计多元化解决方案。不同于结构化问题的固定解法，结构不良问。"},{"t":"结合情境要素，自主设计多元化解决方案","d":"计多元化解决方案。不同于结构化问题的固定解法，结构不良问题需要学生结合真实情境，自主探究、设计多种可行的解决方案。学生需要灵活运用统计、比例、函数等数学知识，结合校园真实数据，设计出不同侧重点的垃圾分类优化方案，而非机械套用固定公式计算。针对学生解题思路固化、只会机械计算的问题，张老师要弱化公式套用训练，强化知识应用训练，引导学生结合不同的约束条件推演多种方案，鼓励学生发散思维，打破刷题形成的思维定势，培养学生方案设计与创新能力。第四，科学评价方案有效性，自主论证方案优势。结构不良问题无标准答案，核心是筛选最优、最适配的方案，要求学生自主依托数据、理论、。"},{"t":"科学评价方案有效性，自主论证方案优势","d":"自主论证方案优势。结构不良问题无标准答案，核心是筛选最优、最适配的方案，要求学生自主依托数据、理论、情境条件论证方案的科学性与合理性。学生需要运用数学计算结果、校园实际条件，为自己设计的垃圾分类方案提供数据支撑，清晰论证方案的优势与可行性，解决“方案合理但无法证明”的困境。针对学生论证能力缺失的问题，张老师可专项开展方案论证教学，教学生运用数据对比、维度分析、可行性推演等方法，为方案提供科学支撑，培养学生有理有据的论证思维。第五，开展元认知监控，全程复盘解题过程。结构不良问题解题过程复杂、极易出现偏差，需要全程开展自我监控与反思，实时排查解题漏洞。学生需。"},{"t":"开展元认知监控，全程复盘解题过程","d":"复盘解题过程。结构不良问题解题过程复杂、极易出现偏差，需要全程开展自我监控与反思，实时排查解题漏洞。学生需要在解题过程中持续自查信息使用、数据计算、方案设计、维度考量等环节，及时发现误用数据、指标单一、思路片面等问题。针对学生缺乏自我反思能力的问题，张老师可引导学生建立解题复盘清单，从信息筛选、目标定位、方案设计、数据应用等维度开展自我检查，培养学生的元认知监控能力。第六，落地实施方案，实时监察实施效果。学生设计方案后，需要结合校园真实场景模拟落地实施，监察方案的适配性，观察方案是否适配场地条件、是否能够控制清运成本、是否符合师生日常使用习惯，检验方案的。"}]},{"t":"（3）综合运用影响问题解决的因素和问题解决能力培养的理论","items":[{"t":"重构学生知识结构，实现知识系统化、情境化，夯实问题解决基础","d":"现知识系统化、情境化，夯实问题解决基础。知识经验的数量与质量是影响问题解决的核心因素，学生机械刷题积累的碎片化知识，无法适配真实情境问题的解决需求。张老师需摒弃传统机械刷题的教学模式，不再单纯训练学生的公式套用、数值计算能力，而是结合生活、校园真实场景，重构数学知识教学体系。在日常教学中，将统计、比例、函数等数学知识与校园管理、生活实践、社会热点相结合，让学生理解数学知识的实际应用价值，掌握知识的适用场景与应用方法，形成系统化、情境化的知识体系。同时引导学生整合陈述性知识、程序性知识与策略性知识，不仅记住公式定理，更掌握知识的应用逻辑、解题思路与变通方法。"},{"t":"破除思维定势与功能固着，培养学生灵活创新的解题思维","d":"着，培养学生灵活创新的解题思维。长期机械刷题让学生形成了极强的思维定势，习惯用固定公式、固定套路解决所有数学问题，无法灵活应对开放性真实问题，同时对数学知识的功能形成固着认知，仅认为数学可用于卷面计算，忽略其方案设计、数据分析、逻辑论证的功能。对此，张老师需要彻底优化日常训练题型，减少标准化、结构化的机械习题，增加情境化、开放性、探究性的数学问题，刻意打破学生的固化解题思维。在教学中鼓励学生一题多解、多角度思考，不局限于标准答案，允许学生结合真实情境设计个性化解题方案。同时结合项目式学习案例，引导学生挖掘数学知识的多元应用功能，突破功能固着，培养学生思维。"},{"t":"优化问题表征教学，提升学生复杂问题拆解与信息筛选能力","d":"升学生复杂问题拆解与信息筛选能力。问题表征方式直接决定问题解决的效率与正确率，学生解题困难的首要原因是无法精准表征复杂真实问题。张老师需专项开展问题表征能力训练，教学生结构化拆解复杂问题的方法，引导学生在面对真实情境问题时，分步完成信息筛选、信息解读、目标定位、维度梳理等工作。针对学生容易误用冗余信息、忽略约束条件的问题，常态化开展复杂信息辨析训练，提供包含干扰信息、多重限制条件的情境化习题，训练学生精准提取有效信息、剔除无效信息的能力。同时引导学生建立整体化问题表征思维，摒弃单一指标解题认知，兼顾多重约束条件与多元评价维度，全面提升学生的问题解读与表征。"},{"t":"常态化开展探究式、项目式学习，发挥学生主体探究能力","d":"目式学习，发挥学生主体探究能力。探究性学习是培养真实问题解决能力的核心途径，材料中善于提问、主动探究的学生思维更活跃、解题能力更强，充分印证了主动探究的育人价值。张老师需落实科技教育与项目式学习的教学要求，将项目式学习常态化、常态化融入日常数学教学，不再将教学局限于课堂习题训练。结合校园生活、社会生活设计多元化的数学实践项目，如校园资源统计、能耗分析、活动方案优化等，让学生长期在真实情境中自主探究、合作研讨、设计方案、验证成果。充分尊重学生的主体地位，鼓励学生主动提问、大胆质疑、自主探索，营造自由宽松的探究氛围，彻底改变学生被动刷题、被动解题的学习模式，。"},{"t":"系统教授多元问题解决策略，重点强化启发式策略教学","d":"策略，重点强化启发式策略教学。学生长期依赖单一算法式解题策略，无法适配开放性问题，张老师需针对性开展解题策略专项教学，丰富学生的解题工具库。在教学中弱化机械算法训练，重点讲解手段目的分析法、逆向反推法、类比思维、多角度推演等启发式解题策略，并结合垃圾分类、校园实践等真实案例，讲解策略的应用场景与使用方法。引导学生根据问题类型灵活切换解题策略，面对结构化习题可使用算法式高效解题，面对真实开放的结构不良问题，运用启发式策略灵活拆解、多元设计、迭代优化，让学生掌握适配不同问题的解题方法，提升问题解决的灵活性与专业性。第六，建立全过程评价体系，培养学生反思论证与。"}]}]}]},{"id":"预测6-6","name":"预测6","questions":[{"id":"预测6-6-31","num":31,"title":"31 陶行知/陈鹤琴","subject":"中教史","blocks":[{"t":"二者教育思想的共通内核","items":[{"t":"同承实用主义立场，批判传统教育积弊","d":"判传统教育积弊二者的教育思想均以对传统教育的批判为逻辑起点，共同指向传统教育“书本中心、教师中心、脱离生活”的核心弊端。陶行知尖锐抨击传统教育与社会生活割裂、劳心与劳力分离，只会培养脱离实际的“书呆子”；陈鹤琴反对“死读书、读死书”的灌输式教学，批评传统教育脱离儿童天性与现实生活需求。二者都主张教育必须跳出书本的桎梏，回归生活世界，以生活作为教育的源头与归宿。"},{"t":"同倡实践本位理念，强调“做”的核心价值","d":"调“做”的核心价值二者都将“做”置于教育过程的核心位置，坚持手脑并用、知行合一的教育原则。陶行知提出“教学做合一”，认为“行是知之始”，学习必须从实践行动出发，在劳力上劳心，打破劳心与劳力的二元对立；陈鹤琴提出“做中教，做中学，做中求进步”，认为“做”是儿童学习的基础，凡儿童能自己做的就应让其自主探索。二者都否定被动接受的注入式教学，将实践作为知识生成、能力发展的根本路径。"},{"t":"同怀教育救国理想，探索本土教育道路","d":"索本土教育道路二者均以教育救国为时代使命，拒绝照搬西方教育模式，致力于探索适配中国国情的本土化教育路径。陶行知面向中国乡村衰败、民众文盲率高的现实，探索平民普及教育的中国方案；陈鹤琴针对中国幼儿教育照搬西方、脱离本土儿童特点的问题，开展中国化、科学化的幼儿教育实验。二者都扎根中国社会实际，推动教育理论与实践的本土化转型。"}]},{"t":"二者教育思想的核心差异","items":[{"t":"教育视野：社会大教育观与学校育人观的分野","d":"20世纪上半叶，中国教育在民族救亡与社会转型的语境中加速现代化探索，陶行知与陈鹤琴作为中国现代教育史上两位里程碑式的教育家，分别立足平民教育与儿童教育领域，提出了“生活教育”与“活教育”两大理论体系。二者均深受实用主义教育思想影响，以改造传统教育、回归生活本质为核心方向，却因教育视野、实践场域的不同形成了各具特色的理论路径，共同推动了中国教育的现代转型，对当代教育改革仍具有深刻的启示价值。"},{"t":"教育目标：社会改造指向与人的发展指向的侧重","d":"（三）人的全面发展的终极教育目标人的全面发展是马恩教育思想的核心内核。其核心内涵是摆脱旧式分工造成的人的片面、畸形发展，实现人的体力、智力、道德、个性、审美等全方位、自由充分的发展，最终实现人的彻底解放。这一目标的实现以高度发达的生产力、废除私有制、消灭阶级差异为社会基础，依托德育、智育、体育、综合技术教育协同推进，是社会主义教育的终极价值追求。"},{"t":"实践体系：大众普及模式与儿童育人模式的差异","d":"针对当前基础教育普遍存在的重智轻体美劳、综合育人形式化、评价唯分数等问题，结合人的全面发展学说的要求，应当从课程、教学、评价、保障、协同五个维度系统推进全面发展教育落地。第一，强化课程刚性保障，开齐开足上好体美劳课程。严格落实国家课程方案，足额开设体育、美育、劳动教育课程，建立课程刚性保障机制，严禁随意挤占、挪用体美劳课时。优化课程实施形式，体育课程要保障锻炼时长与运动实效，美育课程要强化艺术体验与动手创作，劳动教育要丰富实践场景与岗位体验，让课程从“表上”落到“课上”，从“形式”走向“实质”。第二，深化教学模式改革，强化实践育人与个性发展。打破单一的知。"}]},{"t":"历史贡献与时代局限","items":[{"t":"历史贡献","d":"####31.结合材料与所学，比较杨贤江与黄炎培教育思想异同，并评析二者对近代教育变革的历史贡献与局限性。【解析】近代中国半殖民地半封建的社会语境下，教育救国成为知识界探索救亡道路的核心方向之一。杨贤江与黄炎培作为民国时期极具代表性的教育思想家，分别立足马克思主义理论视角与职业教育实践路径，构建了各具特色的教育思想体系。前者以历史唯物主义剖析教育本质，提出“全人生指导”的青年教育主张；后者以实用主义为内核，倡导职业教育以实现“使无业者有业，使有业者乐业”的目标。二者既共享时代变革的思想底色，又在理论根基、实践路径上形成鲜明分野，共同推动了中国教育的近代转。"},{"t":"陶行知开创了中国现代大众平民教育的范式","d":"大众平民教育的范式。他的生活教育理论打破了传统教育的精英属性与学校围墙，将教育延伸到社会底层与广阔乡村，创造了乡村师范、工学团、小先生制等一系列本土化的普及教育模式，为中国乡村教育、平民教育的发展奠定了理论与实践基础，推动了教育公平与教育普及的历史进程。第二，陈鹤琴奠定了中国现代学前教育的科学根基。他首次系统开展中国儿童心理发展研究，建立了首个中国化、科学化的幼儿教育体系，活教育理论与五指活动课程深刻塑造了中国学前教育的基本形态，推动了幼儿教育从经验化走向科学化，对中国儿童教育发展影响深远。第三，二者共同推动了中国教育的现代转型。它们共同颠覆了传统教育书。"},{"t":"陈鹤琴奠定了中国现代学前教育的科学根基","d":"学前教育的科学根基。他首次系统开展中国儿童心理发展研究，建立了首个中国化、科学化的幼儿教育体系，活教育理论与五指活动课程深刻塑造了中国学前教育的基本形态，推动了幼儿教育从经验化走向科学化，对中国儿童教育发展影响深远。第三，二者共同推动了中国教育的现代转型。它们共同颠覆了传统教育书本至上、灌输为主的模式，确立了学生的主体地位与实践的核心价值，推动教育从服务科举转向服务人的发展与社会进步，探索了中国教育的本土化发展道路，丰富了中国现代教育的思想宝库。"},{"t":"二者共同推动了中国教育的现代转型","d":"育的现代转型。它们共同颠覆了传统教育书本至上、灌输为主的模式，确立了学生的主体地位与实践的核心价值，推动教育从服务科举转向服务人的发展与社会进步，探索了中国教育的本土化发展道路，丰富了中国现代教育的思想宝库。"},{"t":"时代局限：二者的思想与实践都受到近代中国社会历史条件的制约，具有鲜明的时代局限"}]},{"t":"对当代教育改革的启示","items":[{"t":"其一，坚持教育与生活深度融合，落实实践育人根本要求","d":"深度融合，落实实践育人根本要求。要打破教育与生活的壁垒，立足时代需求更新教育内容，强化项目式、探究式、体验式学习，让教育回应现实生活与社会发展需要，避免知识与实践脱节的问题。其二，坚守学生主体地位，激发学习者的主动性与创造性。尊重学生的身心发展规律与个体差异，倡导自主学习、动手实践，改变灌输式教学模式，培养学生的创新精神与实践能力，落实“做中学”的教育理念。其三，立足中国本土实际，推动教育理论与实践的中国化创新。扎根中国文化与社会现实，不盲目照搬西方教育模式，构建具有中国特色的教育体系，走本土化的教育现代化道路。其四，推进教育公平优质发展，补齐薄弱领域教。"}]}]},{"id":"预测6-6-32","num":32,"title":"32 福禄贝尔/蒙台梭利","subject":"外教史","blocks":[{"t":"福禄培尔幼儿教育核心理论与标志性教育载体","items":[{"t":"核心教育理论观点","d":"第一，统一原则是其思想的核心根基，带有鲜明的时代与思想特征。他提出万物皆有统一的精神内核，教育的本质是引导儿童自由展现自身内在的精神本质，逐步认识自然、人性与世界的统一，实现身心的和谐发展。第二，顺应自然原则，主张教育必须贴合双重自然规律，既遵循大自然的客观规律，更要尊重儿童与生俱来的生理、心理天性，杜绝成人主观强制灌输。第三，持续发展原则，首次将进化发展理念引入幼儿教育领域，认为儿童的成长是从低级到高级、从简单到复杂、从不完善到完善的动态递进过程，每个成长阶段都有独特价值，教育需适配儿童阶段性发展特征。第四，创造原则，强调人天生具备创造性，教育的核心目。"},{"t":"统一原则是其思想的核心根基，带有鲜明的时代与思想特征","d":"心根基，带有鲜明的时代与思想特征。他提出万物皆有统一的精神内核，教育的本质是引导儿童自由展现自身内在的精神本质，逐步认识自然、人性与世界的统一，实现身心的和谐发展。第二，顺应自然原则，主张教育必须贴合双重自然规律，既遵循大自然的客观规律，更要尊重儿童与生俱来的生理、心理天性，杜绝成人主观强制灌输。第三，持续发展原则，首次将进化发展理念引入幼儿教育领域，认为儿童的成长是从低级到高级、从简单到复杂、从不完善到完善的动态递进过程，每个成长阶段都有独特价值，教育需适配儿童阶段性发展特征。第四，创造原则，强调人天生具备创造性，教育的核心目标之一是唤醒儿童的创造潜能。"},{"t":"顺应自然原则","d":"主张教育必须贴合双重自然规律，既遵循大自然的客观规律，更要尊重儿童与生俱来的生理、心理天性，杜绝成人主观强制灌输。第三，持续发展原则，首次将进化发展理念引入幼儿教育领域，认为儿童的成长是从低级到高级、从简单到复杂、从不完善到完善的动态递进过程，每个成长阶段都有独特价值，教育需适配儿童阶段性发展特征。第四，创造原则，强调人天生具备创造性，教育的核心目标之一是唤醒儿童的创造潜能，让儿童通过自主活动展现创造力，实现自我成长。在幼儿园教育实践层面，他明确幼儿园是家庭教育的补充而非替代，采用半日制办学模式，延续家庭生活化的教育氛围。同时确立了自我活动的核心教育方法。"},{"t":"持续发展原则","d":"首次将进化发展理念引入幼儿教育领域，认为儿童的成长是从低级到高级、从简单到复杂、从不完善到完善的动态递进过程，每个成长阶段都有独特价值，教育需适配儿童阶段性发展特征。第四，创造原则，强调人天生具备创造性，教育的核心目标之一是唤醒儿童的创造潜能，让儿童通过自主活动展现创造力，实现自我成长。在幼儿园教育实践层面，他明确幼儿园是家庭教育的补充而非替代，采用半日制办学模式，延续家庭生活化的教育氛围。同时确立了自我活动的核心教育方法，重视儿童自主体验、亲身观察，高度肯定游戏的教育价值，认为游戏是儿童精神最纯粹的自发表达，同时注重儿童社交能力培养，引导儿童在集体互动。"},{"t":"创造原则","d":"强调人天生具备创造性，教育的核心目标之一是唤醒儿童的创造潜能，让儿童通过自主活动展现创造力，实现自我成长。在幼儿园教育实践层面，他明确幼儿园是家庭教育的补充而非替代，采用半日制办学模式，延续家庭生活化的教育氛围。同时确立了自我活动的核心教育方法，重视儿童自主体验、亲身观察，高度肯定游戏的教育价值，认为游戏是儿童精神最纯粹的自发表达，同时注重儿童社交能力培养，引导儿童在集体互动中实现社会化发展。"}]},{"t":"蒙台梭利幼儿教育核心理论与标志性教育载体","items":[{"t":"核心教育理论观点：首先","d":"第一，统一原则是其思想的核心根基，带有鲜明的时代与思想特征。他提出万物皆有统一的精神内核，教育的本质是引导儿童自由展现自身内在的精神本质，逐步认识自然、人性与世界的统一，实现身心的和谐发展。第二，顺应自然原则，主张教育必须贴合双重自然规律，既遵循大自然的客观规律，更要尊重儿童与生俱来的生理、心理天性，杜绝成人主观强制灌输。第三，持续发展原则，首次将进化发展理念引入幼儿教育领域，认为儿童的成长是从低级到高级、从简单到复杂、从不完善到完善的动态递进过程，每个成长阶段都有独特价值，教育需适配儿童阶段性发展特征。第四，创造原则，强调人天生具备创造性，教育的核心目。"},{"t":"标志性教育载体：其一","d":"一、福禄培尔幼儿教育核心理论与标志性教育载体福禄培尔是19世纪近代学前教育理论的奠基人、世界幼儿园制度的创立者，被誉为“幼儿教育之父”，其教育理论形成了近代首个系统的幼儿教育体系，核心理论围绕四大教育原则展开，配套专属的教育实践载体。"}]},{"t":"福禄培尔与蒙台梭利教育思想的核心差异","items":[{"t":"儿童发展观差异：福禄培尔的儿童发展观带有唯心主义与神秘主义色彩","d":"福禄培尔的儿童发展观带有唯心主义与神秘主义色彩，以精神发展为核心，认为儿童成长是内在精神不断显现、趋近统一的过程，侧重儿童精神、情感与创造力的整体性自发成长，强调游戏对儿童精神滋养的核心价值，重视儿童的想象与情感表达。蒙台梭利的儿童发展观以科学实证为基础，依托生物学、心理学规律，聚焦儿童生理与心理的客观发展节律，提出敏感期、吸收性心智等科学概念，认为儿童发展是内在生命潜能在专属环境中的有序释放。她否定纯粹的想象性游戏，主张儿童通过真实、务实的实践工作实现能力成长，更注重儿童理性能力、感官能力与实操能力的精准发展。"},{"t":"教育组织方式差异：在教学形式上","d":"####32.简述二人幼儿教育核心观点与标志性载体，对比儿童发展观、教育组织方式差异，论述二者对近代幼儿教育的历史贡献。【解析】。"}]},{"t":"二者对近代幼儿教育发展的历史贡献","items":[{"t":"福禄培尔的历史贡献：其一，开创了近代公共幼儿教育新纪元","d":"其一，开创了近代公共幼儿教育新纪元。他创立世界第一所幼儿园，彻底终结了传统幼儿教育完全依附家庭的格局，确立了幼儿园的教育定位，明确其家庭教育补充的功能，构建了近代首个学前教育制度雏形。其二，奠定了近代学前教育理论体系。他首次系统阐释幼儿教育的核心原则、内容与方法，确立了游戏在幼儿教育中的核心地位，颠覆了传统灌输式教育理念，确立了儿童自主活动的教育核心。其三，推动了幼儿教育的普及与专业化发展。他重视幼教师资培训与教育经验推广，其教育模式在19世纪后风靡全球，为世界各国幼儿教育制度化、规范化发展提供了核心参考，让幼儿教育成为独立的教育阶段。"},{"t":"蒙台梭利的历史贡献：其一，推动幼儿教育走向科学化","d":"其一，推动幼儿教育走向科学化。她以实证科学为基础，打破了传统幼儿教育的经验化、主观化局限，提出敏感期、吸收性心智等科学理论，精准揭示幼儿身心发展规律，为近代幼儿教育提供了科学的理论依据。其二，创新了幼儿教育实践模式。“儿童之家”与标准化教具体系，构建了系统化、可复制的幼儿教育模式，个别化教育、自我教育的理念，契合儿童个体发展差异，为现代个性化幼儿教育奠定基础。其三，拓展了幼儿教育的内容边界。她首创系统化感官训练体系，突破了传统幼儿教育重游戏、轻能力训练的局限，率先开展低龄儿童读写算科学启蒙，丰富了幼儿教育的内容维度，推动近代幼儿教育从“情感滋养”向“能力。"}]}]},{"id":"预测6-6-33","num":33,"title":"33 德育方法与途径","subject":"教原","blocks":[{"t":"（1）分析该校使用的德育方法，评析其合理性与不足。","items":[{"t":"该校运用的核心德育方法","d":"法第一，说服教育法。说服教育是通过摆事实、讲道理提升学生道德认知、形成正确价值观点的基础方法。该校的运用体现在三个层面：一是系统课堂讲授，通过专门的道德与法治课程，系统向学生传递道德规范与价值准则，承担着传递基础道德认知的核心功能；二是集中主题宣讲，通过定期的国旗下讲话、月度主题班会，围绕特定德育主题开展集中教育，强化学生对具体主题的道德认知；三是学科渗透说教，语文、科学等学科教师尝试依托教学内容渗透德育，多在课堂结尾附加几句道德引导，属于学科教学中的延伸式说服。第二，情感陶冶法。情感陶冶是通过创设良好教育情境，潜移默化熏陶学生品德的隐性方法。该校主要以。"},{"t":"说服教育法","d":"【解析】教师依托现实案例引导学生明辨是非、纠正错误认知，是通过讲解、说理提高学生道德认识，属于说服教育法；结合学生日常表现开展德育评定，属于品德评价法；通过表彰优秀、警示违纪规范学生品行，属于奖惩法。A中的疏导法和自我修养法不贴切；B中的实践锻炼法和榜样示范法不准确；C中的榜样示范法不准确。故选D。"},{"t":"情感陶冶法","d":"情感陶冶是通过创设良好教育情境，潜移默化熏陶学生品德的隐性方法。该校主要以环境陶冶的形式落实，在校园走廊、公共宣传栏布置德育文化标语，打造显性的德育文化环境，试图通过校园文化氛围对学生进行浸润式影响，让学生在日常环境中潜移默化地接受道德观念，是隐性德育方法的典型应用。第三，实践锻炼法。实践锻炼是有目的地组织学生开展实际活动与社会交往，在实践中培养良好品德与行为习惯的方法。该校每学期组织学生前往敬老院开展敬老服务、走进社区开展环保志愿活动，让学生在真实社会场景中践行奉献、责任、环保等道德要求；同时通过一日常规量化管理，引导学生反复践行日常行为规范，在持续的。"},{"t":"实践锻炼法","d":"【解析】教师依托现实案例引导学生明辨是非、纠正错误认知，是通过讲解、说理提高学生道德认识，属于说服教育法；结合学生日常表现开展德育评定，属于品德评价法；通过表彰优秀、警示违纪规范学生品行，属于奖惩法。A中的疏导法和自我修养法不贴切；B中的实践锻炼法和榜样示范法不准确；C中的榜样示范法不准确。故选D。"},{"t":"品德评价与奖惩法","d":"品德评价法是依据德育目标对学生品德表现给予肯定或否定评价，引导学生品德发展的方法。该校实行一日常规量化评比制度，每周公示各班得分，对日常行为进行即时评价与约束；期末开展文明班级、美德少年评选，将志愿服务时长纳入评选指标，通过荣誉激励、量化考核的方式，既对学生行为进行正向引导，也发挥约束规范作用。"}]},{"t":"（2）分析该校德育途径，说明不同途径的整合方式。","items":[{"t":"该校的核心德育途径","d":"第一，课程育人途径。课程育人是学校德育的主渠道，分为直接德育课程与学科渗透德育两个层面。一方面，学校开设专门的道德与法治课程，系统讲授道德知识与理论，属于直接的道德教育，是学生系统学习道德规范、发展道德思维的核心载体，保障了德育的基本课时与知识传递的系统性。另一方面，语文、科学等学科教师尝试依托学科内容渗透德育，属于间接的课程德育，试图将道德教育融入学科教学全过程，发挥课堂教学的育人功能，是全员德育的重要实践载体。第二，活动育人途径。活动育人是德育的重要实践载体，该校通过多样化的主题活动落实德育要求。一是仪式与主题教育活动，包括国旗下讲话、月度主题班会、。"},{"t":"课程育人途径","d":"课程育人是学校德育的主渠道，分为直接德育课程与学科渗透德育两个层面。一方面，学校开设专门的道德与法治课程，系统讲授道德知识与理论，属于直接的道德教育，是学生系统学习道德规范、发展道德思维的核心载体，保障了德育的基本课时与知识传递的系统性。另一方面，语文、科学等学科教师尝试依托学科内容渗透德育，属于间接的课程德育，试图将道德教育融入学科教学全过程，发挥课堂教学的育人功能，是全员德育的重要实践载体。第二，活动育人途径。活动育人是德育的重要实践载体，该校通过多样化的主题活动落实德育要求。一是仪式与主题教育活动，包括国旗下讲话、月度主题班会、黑板报评比等，围绕特。"},{"t":"活动育人途径","d":"活动育人是德育的重要实践载体，该校通过多样化的主题活动落实德育要求。一是仪式与主题教育活动，包括国旗下讲话、月度主题班会、黑板报评比等，围绕特定德育主题开展集中教育，强化主题认知；二是评选表彰活动，包括文明班级、美德少年评选，发挥荣誉激励与榜样示范作用；三是校外实践活动，包括敬老院服务、社区环保志愿等，让学生在活动中践行道德要求。第三，管理育人途径。管理育人是将德育融入学校日常管理的隐性途径，该校通过实行一日常规量化评比制度，细化学生日常行为规范，每周公示评分结果，将德育要求贯穿到校园管理的各个细节，通过制度规范引导学生行为，发挥管理的育人功能，是德育落。"},{"t":"管理育人途径","d":"管理育人是将德育融入学校日常管理的隐性途径，该校通过实行一日常规量化评比制度，细化学生日常行为规范，每周公示评分结果，将德育要求贯穿到校园管理的各个细节，通过制度规范引导学生行为，发挥管理的育人功能，是德育落地的制度保障。第四，文化育人途径。文化育人是通过校园文化潜移默化影响学生的隐性途径，该校通过走廊德育标语、宣传栏文化布置、主题黑板报评比等形式，营造校园德育文化氛围，让学生在日常文化浸润中受到道德熏陶，是环境育人的重要组成部分。第五，实践育人途径。实践育人是通过社会实践落实德育的延伸途径，该校组织学生走进社区、敬老院开展志愿服务与劳动实践，让学生在真。"},{"t":"文化育人途径","d":"文化育人是通过校园文化潜移默化影响学生的隐性途径，该校通过走廊德育标语、宣传栏文化布置、主题黑板报评比等形式，营造校园德育文化氛围，让学生在日常文化浸润中受到道德熏陶，是环境育人的重要组成部分。第五，实践育人途径。实践育人是通过社会实践落实德育的延伸途径，该校组织学生走进社区、敬老院开展志愿服务与劳动实践，让学生在真实社会场景中践行道德要求，培养社会责任感与奉献精神，是校内德育向校外的延伸，也是道德认知转化为行为实践的重要路径。"}]},{"t":"（3）、二，论述全方位德育内涵与实施要求，为该校德育优化提…","items":[{"t":"全方位德育的核心内涵","d":"第一，全员育人：德育不是班主任与德育部门的专属工作，全体教师都是德育工作者，都承担德育职责。每一位教职工都要在自身的教学、管理与服务中主动渗透德育，以自身的言行影响学生，形成人人都是德育工作者、处处都是德育场的格局。第二，全程育人：德育贯穿学校教育的全过程，从课堂教学到课外活动，从入学到毕业，从知识学习到行为管理，德育渗透在教育的每一个环节，伴随学生成长的全周期，形成前后衔接、层层递进的德育链条，实现全程浸润、持续育人。第三，全方位育人：德育通过课程、文化、活动、实践、管理、协同六大途径全面展开，覆盖学生的认知、情感、行为、价值等多个维度，整合学校、家庭。"},{"t":"全员育人：德育不是班主任与德育部门的专属工作，全体教师都是德育工作者，都承担德育职责","d":"针对当前基础教育普遍存在的重智轻体美劳、综合育人形式化、评价唯分数等问题，结合人的全面发展学说的要求，应当从课程、教学、评价、保障、协同五个维度系统推进全面发展教育落地。第一，强化课程刚性保障，开齐开足上好体美劳课程。严格落实国家课程方案，足额开设体育、美育、劳动教育课程，建立课程刚性保障机制，严禁随意挤占、挪用体美劳课时。优化课程实施形式，体育课程要保障锻炼时长与运动实效，美育课程要强化艺术体验与动手创作，劳动教育要丰富实践场景与岗位体验，让课程从“表上”落到“课上”，从“形式”走向“实质”。第二，深化教学模式改革，强化实践育人与个性发展。打破单一的知。"},{"t":"全程育人：德育贯穿学校教育的全过程","d":"【解析】“三全育人”强调全员育人、全程育人、全方位育人，要求学校统筹思政课程、学科德育、校园文化、班级公约、志愿服务、劳动实践、家校社协同等多种途径，形成育人合力。A说直接德育居于核心、间接和隐性德育仅辅助，不准确；C说家校社协同会弱化学校主导地位，错误；D说优先直接德育与社会实践德育，也不符合全方位统筹的要求。因此选B。"},{"t":"全方位育人：德育通过课程、文化、活动、实践、管理、协同六大途径全面展开","d":"【解析】“三全育人”强调全员育人、全程育人、全方位育人，要求学校统筹思政课程、学科德育、校园文化、班级公约、志愿服务、劳动实践、家校社协同等多种途径，形成育人合力。A说直接德育居于核心、间接和隐性德育仅辅助，不准确；C说家校社协同会弱化学校主导地位，错误；D说优先直接德育与社会实践德育，也不符合全方位统筹的要求。因此选B。"},{"t":"全人育人：德育以促进学生全面发展为目标","d":"第一，推动教学目标精准化，破解目标空泛虚化难题。布卢姆理论将笼统的育人目标拆解为三大领域、多层级的具体目标，用可观测、可测量的行为动词表述教学目标，让教学从“模糊的感觉”走向“精准的设计”。材料中语文教师将“体会父爱”细化为结合细节分析情感、清晰表达感悟的具体目标，数学教师设计三级分层目标，正是目标精准化的体现。清晰的目标为教学活动指明了方向，避免了教学活动的随意性与碎片化，从源头上为教-学-评一致奠定了基础。第二，指引教学活动系统化，促进教学与目标的匹配。布卢姆的目标层级逻辑，为教学活动的设计提供了清晰的参照。教师可以根据不同层级的目标，匹配对应的教学。"}]}]},{"id":"预测6-6-34","num":34,"title":"34 创造性","subject":"教心","blocks":[{"t":"（1）结合创造性思维过程理论","items":[{"t":"小何：准备充分但生成受阻，过度审慎扼杀创意生成","d":"受阻，过度审慎扼杀创意生成小何能够认真制定任务时间表，花费大量时间查阅文献、收集案例，说明其在创造性思维的准备阶段表现突出，能够主动围绕任务广泛搜集信息、积累素材，完成了创造的前期知识储备。但他始终难以独立形成原创设计方案，总担心自己的想法过于简单、达不到专业水准，不敢提交初步构想，本质上是创造性思维从准备阶段向沉思、灵感阶段推进受阻，无法完成从信息堆砌到创意生成的跃迁。从阶段发展视角看，小何过度停留在准备阶段，始终在补充资料、完善调研，迟迟不敢进入构想生成的环节，沉思过程不足，难以产生灵感迸发。他总觉得资料还不够多、想法还不够好，用准备阶段的完美要求苛。"},{"t":"小杨：生成快速但探索不足，浅尝辄止制约创意深化","d":"不足，浅尝辄止制约创意深化小杨在小组讨论时思维活跃，能快速提出多个创意点子，说明其创造性思维的生成阶段效率高，灵感迸发快，能够快速形成多个初步构想，具备良好的发散思维能力。但他难以解释方案背后的原理与可行性，方案确定后就不愿意持续打磨细节、修改优化，本质上是创造性思维的探索、验证阶段严重不足，创意停留在浅层点子层面，无法走向深入完善。从阶段发展视角看，小杨的优势在灵感阶段，思维活跃、点子多，但沉思阶段的深度思考不足，没有深入推敲方案的内在原理与现实可行性；验证阶段更是缺失，不愿意花时间打磨细节、优化方案，觉得有了基本构想就完成了任务，导致创意难以落地。从。"}]},{"t":"（2）结合影响创造性发展的因素","items":[{"t":"“不敢想”：价值认知偏差与环境容错不足共同抑制创造勇气","d":"价值认知偏差与环境容错不足共同抑制创造勇气学生不敢大胆设想，核心是创造动机与自信不足，同时外部环境的评价导向进一步强化了“犯错恐惧”。从个体因素来看，首先是人格与自我认知偏差，很多学生存在“创新是天才专属能力”的固化认知，认为只有少数聪明人才具备创新能力，普通人做不到，因此从一开始就放弃了自主尝试，直接在网上找现成选题修改应付任务。这种认知直接消解了创造的内在动力，让学生连尝试的勇气都没有。其次是自我效能感不足，像小何这样的学生，总担心自己的想法过于简单、达不到专业水准，害怕提出不成熟的想法被嘲笑、被否定，因此宁愿一直准备也不敢输出构想。最后是动机的功利。"},{"t":"“想不出”：知识僵化与思维训练缺失导致创意生成困难","d":"知识僵化与思维训练缺失导致创意生成困难学生想法单薄、想不出新点子，核心是知识基础的质量不高与创造性思维策略训练缺失，导致信息无法转化为创意。从个体因素来看，首先是知识基础的僵化。学生在常规技能训练中表现好，因为常规任务有固定步骤，只需要套用知识即可；但创意设计需要灵活重组知识，学生的知识大多是应试导向的碎片化、刻板化知识，只记得操作步骤，不理解深层原理，也不会跨场景迁移应用，因此难以产生新的组合与构想。知识本身是创造的基础，但僵化的知识反而会阻碍创造，学生积累的知识越死板，越难产生新颖想法。其次是认知风格的局限，多数学生长期接受标准化训练，形成了系统型、。"},{"t":"“想不深”：思维深度不足与意志薄弱制约创意深化","d":"思维深度不足与意志薄弱制约创意深化学生方案难以深入完善，核心是深度思维能力不足与创造意志薄弱，导致探索与验证环节缺位。从个体因素来看，首先是思维深度的局限。部分学生比如小杨，虽然思维活跃点子多，但以直觉思维为主，逻辑深度不足，难以深入挖掘方案背后的原理，也不会系统论证可行性，创意停留在表面。其次是创造意志薄弱，缺乏精益求精、持续打磨的精神，方案初步成型就不愿意再修改，觉得“差不多就行”，没有追求极致的动力。最后是元认知能力不足，学生不会自我监控创造过程，不知道什么时候该深入、该怎么优化，往往想到什么就是什么，没有主动迭代优化的意识。从环境因素来看，常规教。"}]},{"t":"（3）结合该通知要求，阐述教学中培养学生创造性的策略。","items":[{"t":"破除创新认知误区，培育创造意识与自信，让学生“敢创造”","d":"育创造意识与自信，让学生“敢创造”针对学生“创新是天才专利”“怕出错不敢尝试”的问题，首先要破除创造的神秘感，建立人人可创造的认知。教师可以通过引入身边普通人的创新案例、学生优秀的往届作品，让学生明白创新不是遥不可及的天才行为，而是每个人都能掌握的思维方式与实践能力，打破“只有少数人能创新”的固化认知。其次要激发创造热情，结合校园真实场景设计任务，比如校园垃圾分类优化、图书角智能改造、楼道照明优化等，让学生感受到创新是用来解决身边真实问题的，不是空洞的空想，在解决实际问题的过程中获得成就感，激发内在创造兴趣。还要培养创造勇气，营造“容错”的课堂文化，明确。"},{"t":"系统训练创造性思维方法，掌握创造策略，让学生“会创造”","d":"法，掌握创造策略，让学生“会创造”针对学生“想不出、想不深”的问题，要将创造性思维训练融入课堂教学，让学生掌握可操作的创造方法与工具。首先，常态化开展头脑风暴训练，在创意构思阶段，采用延迟评价原则，鼓励学生尽可能多提出想法，不急于批评对错，让学生在自由发散中产生更多创意。比如小组设计时，先做“点子风暴”，每个人都提想法，不评价好坏，量变引发质变，很多看似不成熟的想法会碰撞出更好的创意。其次，运用分合法训练思维的灵活性，一方面引导学生用新视角重新看待常规问题，比如校园里的垃圾分类、图书管理，引导学生跳出常规思路设计新方案；另一方面引导学生遇到陌生的设计任务。"},{"t":"立足真实项目实践，完善创造过程，让学生“能创造”","d":"善创造过程，让学生“能创造”结合科技实践育人的要求，以真实情境的项目为载体，让学生在完整的创造实践中锻炼能力。首先，锚定真实校园场景设计项目任务，比如校园垃圾分类优化、图书角智能改造、楼道照明优化等，让学生从真实问题出发开展设计，避免创意脱离实际，也让学生感受到知识的应用价值。其次，构建阶梯式项目体系，从简单的小设计到综合的创意装置，逐步提升难度，让学生循序渐进地经历完整的创造过程：调研需求、构思方案、制作原型、测试优化，每个环节都有明确的引导，避免学生不知道怎么推进。针对小何这类学生，引导他从资料收集走向方案构思，教他怎么从案例中提炼思路，而不是一直停。"},{"t":"营造支持性教学环境，优化评价导向，让学生“愿创造”","d":"优化评价导向，让学生“愿创造”良好的环境与评价是创造性发展的重要支撑。首先，营造民主宽松的课堂氛围，教师放下“权威”姿态，和学生一起探讨设计，不轻易否定学生的想法，对不成熟的构想给出优化建议而非批评，保护学生的好奇心与探索欲。其次，改革评价方式，建立过程性、多元化的评价体系，不只看最终成品的质量，更看重学生在过程中的努力、创意、进步。比如调研认真、想法新颖、优化积极都可以获得肯定，不用完美的成品也能获得好的评价，弱化结果导向，强化过程价值。同时，强化内部动机，让学生因为解决问题的成就感、创造的乐趣而投入，而不是为了分数而应付任务。比如组织校园创意方案评选。"},{"t":"优化知识教学方式，构建灵活知识基础，为创造提供支撑","d":"建灵活知识基础，为创造提供支撑创造离不开知识基础，僵化的知识无法支撑创造。教师要改变传统的技能训练模式，不仅教操作步骤，更讲深层原理，讲知识的应用场景，让学生理解知识的本质，而不是死记步骤。比如通用技术的技能教学，不仅让学生会操作，更让学生理解技术原理，知道可以用在什么地方、怎么改造应用。同时加强知识的整合与迁移训练，引导学生跨学科、跨场景调用知识，打破学科壁垒，为创意生成提供扎实灵活的知识支撑。####35.阅读材料，回答问题。#####（1）结合材料一师德师风第一标准，评析林老师专业素养的优势与不足。【解析】教师专业素养是教师开展教育教学工作的核心支。"}]}]},{"id":"预测6-6-35","num":35,"title":"35 教师专业发展与师生关系","subject":"教原","blocks":[{"t":"（1）师德师风第一标准，评析林老师专业素养的优势与不足。","items":[{"t":"林老师专业素养的核心优势","d":"优势第一，学科专业知识扎实，教学实施能力突出，教学实绩优异。林老师从教十二年，学科功底扎实，所带班级统考成绩常年位居年级前列，反映出其具备深厚的学科专业知识储备，能够精准把握学科知识的体系与重难点，教学操作能力成熟，知识传授的效率与质量突出。这是教师胜任教学岗位的基础素养，也是其能够长期保持教学质量优势的核心支撑，体现了专业素养的核心基础要求。第二，具备自我发展意识与初步反思研究能力，能够主动调整改进教学实践。在同事提醒后，林老师没有固守原有教学经验，而是主动访谈学困生，真实了解学生的学习状态与心理感受；随后申报学困生转化微型课题，坚持撰写教学反思日志，。"},{"t":"学科专业知识扎实，教学实施能力突出，教学实绩优异","d":"学实施能力突出，教学实绩优异。林老师从教十二年，学科功底扎实，所带班级统考成绩常年位居年级前列，反映出其具备深厚的学科专业知识储备，能够精准把握学科知识的体系与重难点，教学操作能力成熟，知识传授的效率与质量突出。这是教师胜任教学岗位的基础素养，也是其能够长期保持教学质量优势的核心支撑，体现了专业素养的核心基础要求。第二，具备自我发展意识与初步反思研究能力，能够主动调整改进教学实践。在同事提醒后，林老师没有固守原有教学经验，而是主动访谈学困生，真实了解学生的学习状态与心理感受；随后申报学困生转化微型课题，坚持撰写教学反思日志，主动观摩优秀同事的课堂，邀请同。"},{"t":"林老师专业素养的突出不足","d":"不足第一，专业情意与师德层面：学生中心理念缺失，尊重学生人格不到位，偏离师德师风核心要求。师德师风的核心要求是坚持以生为本，尊重学生人格，关注学生内心感受，促进学生全面发展。但林老师在原有教学中，将成绩与纪律放在优先位置，忽视学生的主体地位与心理感受。面对课堂上打哈欠的学生，当场要求整节课站立听课，采用简单粗暴的惩罚方式管理纪律，没有顾及学生的人格尊严与情绪感受，最终引发学生强烈的抵触情绪。日常教学中课堂节奏偏快，不考虑学困生的接受能力，学生普遍畏惧举手提问，害怕被批评，说明林老师没有真正站在学生的角度考虑学习体验，热爱学生、尊重学生的师德要求落实不到位。"},{"t":"专业情意与师德层面：学生中心理念缺失，尊重学生人格不到位，偏离师德师风核心要求","d":"学生中心理念缺失，尊重学生人格不到位，偏离师德师风核心要求。师德师风的核心要求是坚持以生为本，尊重学生人格，关注学生内心感受，促进学生全面发展。但林老师在原有教学中，将成绩与纪律放在优先位置，忽视学生的主体地位与心理感受。面对课堂上打哈欠的学生，当场要求整节课站立听课，采用简单粗暴的惩罚方式管理纪律，没有顾及学生的人格尊严与情绪感受，最终引发学生强烈的抵触情绪。日常教学中课堂节奏偏快，不考虑学困生的接受能力，学生普遍畏惧举手提问，害怕被批评，说明林老师没有真正站在学生的角度考虑学习体验，热爱学生、尊重学生的师德要求落实不到位，违背了师德师风第一标准的核心。"}]},{"t":"（2）结合校本教研、反思、同伴互助、行动研究的成长路径","items":[{"t":"教师专业发展的核心内涵与发展取向","d":"涵与发展取向教师专业发展不是单一的技能提升，而是涵盖专业知识、专业能力、专业情意的全方位成长，是一个持续深化、终身发展的过程。从发展取向来看，实践-反思取向强调教师通过对自身实践的反思，生成个人实践智慧，深化对教学的理解；生态取向强调教师群体的合作互助，依托校本教研、同伴互动，在教师文化中共同成长；专家型取向强调教师开展行动研究，用研究的方式解决教学问题，提升专业研究能力；自我更新取向则是融合多重发展路径，实现知识、能力、情意的全面提升。校本教研、教学反思、同伴互助、行动研究四大成长路径，正是不同发展取向的具体实践载体：教学反思是实践-反思取向的核心方法。"},{"t":"林老师专业发展的收获与进步","d":"与进步第一，开启实践反思型成长，教学自我优化意识增强。林老师坚持撰写教学反思日志，主动复盘自身教学问题，从只关注教学成绩转向关注学生学习状态，开始对自身的教学节奏、课堂互动、学困生问题进行深度审视，打破了长期以来的经验固化。这种基于自身实践的反思，能够帮助教师生成个人化的实践智慧，推动教学从经验驱动走向反思驱动，是专业发展的重要进步。第二，融入生态式同伴互助，打破封闭教学的局限。林老师主动观摩优秀同事的课堂，邀请同事来班听课评课，借助同伴的视角发现自身教学问题，学习优秀的教学经验，打破了个体教学的封闭状态。这种同伴互助的方式，能够借助教师群体的智慧弥补个。"},{"t":"开启实践反思型成长，教学自我优化意识增强","d":"教学自我优化意识增强。林老师坚持撰写教学反思日志，主动复盘自身教学问题，从只关注教学成绩转向关注学生学习状态，开始对自身的教学节奏、课堂互动、学困生问题进行深度审视，打破了长期以来的经验固化。这种基于自身实践的反思，能够帮助教师生成个人化的实践智慧，推动教学从经验驱动走向反思驱动，是专业发展的重要进步。第二，融入生态式同伴互助，打破封闭教学的局限。林老师主动观摩优秀同事的课堂，邀请同事来班听课评课，借助同伴的视角发现自身教学问题，学习优秀的教学经验，打破了个体教学的封闭状态。这种同伴互助的方式，能够借助教师群体的智慧弥补个体经验的不足，是教师专业发展高效。"},{"t":"林老师专业发展的现存不足","d":"不足第一，专业发展缺乏系统规划，整体处于被动问题驱动阶段。林老师的专业调整源于同事的提醒与现实的教学问题，属于被动应对式的成长，没有主动制定系统的职业生涯发展规划，对自身专业发展的目标、路径、节奏缺乏清晰设计。发展动力更多来自外部问题倒逼，而非内在的主动追求，发展的系统性与前瞻性不足。第二，实践反思深度不足，未触及教育理念与师德层面的深层变革。林老师的反思更多集中在教学节奏、提问设计等教学方法层面，对自身的学生观、师生观、教育价值观的反思不足。比如遇到学生纪律问题时依旧容易急躁，说明其教育理念与行为模式没有发生根本转变，反思没有深入到价值层面，导致教学改。"},{"t":"专业发展缺乏系统规划，整体处于被动问题驱动阶段","d":"整体处于被动问题驱动阶段。林老师的专业调整源于同事的提醒与现实的教学问题，属于被动应对式的成长，没有主动制定系统的职业生涯发展规划，对自身专业发展的目标、路径、节奏缺乏清晰设计。发展动力更多来自外部问题倒逼，而非内在的主动追求，发展的系统性与前瞻性不足。第二，实践反思深度不足，未触及教育理念与师德层面的深层变革。林老师的反思更多集中在教学节奏、提问设计等教学方法层面，对自身的学生观、师生观、教育价值观的反思不足。比如遇到学生纪律问题时依旧容易急躁，说明其教育理念与行为模式没有发生根本转变，反思没有深入到价值层面，导致教学改进停留在技术层面，难以实现质的提。"}]},{"t":"（3）结合构建良好师生关系要求","items":[{"t":"林老师原有师生关系的类型与弊端","d":"类型与弊端林老师原有师生关系属于典型的教师中心导向下的专制型师生关系。这种关系模式中，教师处于绝对的权威与支配地位，以知识传授与纪律管控为核心，学生处于被动服从的地位，人格尊严与主体地位没有得到充分尊重。从日常表现来看，课堂节奏、教学进度完全由教师决定，不顾学困生的接受能力；学生课堂行为出现问题时，采用当众罚站的惩罚方式，不考虑学生的情绪与尊严；学生普遍畏惧举手提问，害怕被批评，不敢表达自身的学习困难，都印证了师生之间的命令与服从关系，是专制型师生关系的典型特征。这种师生关系模式存在多重育人弊端：第一，压抑学生的学习主体性与主动性，造成课堂生态的沉闷低效。"},{"t":"良好师生关系的核心特点：良好的师生关系是民主平等、尊师爱生、教学相长、宽容理解的良性互动关系","d":"点良好的师生关系是民主平等、尊师爱生、教学相长、宽容理解的良性互动关系，具备四大核心特征：其一，社会关系层面民主平等，师生人格地位平等，教师尊重学生人格，发扬教学民主，不搞权威压制；其二，人际关系层面尊师爱生，学生尊重教师，教师关爱学生，彼此情感联结深厚，配合默契；其三，教育关系层面教学相长，教师主导、学生主体，彼此相互促进、共同成长，教师在教的过程中也获得提升；其四，心理层面宽容理解，教师理解学生的个体差异，包容学生的错误，关注学生的内心感受。"},{"t":"优化师生关系的实践建议","d":"议第一，转变教育观念，树立以生为本的学生观与平等师生观。这是构建良好师生关系的根本前提。林老师需要从根本上转变教师中心的理念，真正将学生作为学习与发展的主体，将学生的人格尊严、内心感受放在比纪律、成绩更重要的位置。处理课堂问题时，先站在学生的角度考虑原因，而非简单动用权威惩罚，比如学生课堂打哈欠，可先通过眼神示意、课后询问原因的方式处理，保护学生的自尊心，让教育充满温度。第二，主动研究学生，尊重个体差异，实现因材施教。要主动走近学生，通过访谈、谈心、作业反馈等多种方式，深入了解学生的知识基础、学习节奏、心理状态与兴趣需求，尤其关注学困生的学习困难。在此基。"},{"t":"转变教育观念，树立以生为本的学生观与平等师生观","d":"生为本的学生观与平等师生观。这是构建良好师生关系的根本前提。林老师需要从根本上转变教师中心的理念，真正将学生作为学习与发展的主体，将学生的人格尊严、内心感受放在比纪律、成绩更重要的位置。处理课堂问题时，先站在学生的角度考虑原因，而非简单动用权威惩罚，比如学生课堂打哈欠，可先通过眼神示意、课后询问原因的方式处理，保护学生的自尊心，让教育充满温度。第二，主动研究学生，尊重个体差异，实现因材施教。要主动走近学生，通过访谈、谈心、作业反馈等多种方式，深入了解学生的知识基础、学习节奏、心理状态与兴趣需求，尤其关注学困生的学习困难。在此基础上调整教学节奏，设计分层的。"}]}]},{"id":"预测6-6-36","num":36,"title":"36 品德不良与矫正","subject":"教心","blocks":[{"t":"（1）结合道德认知发展理论","items":[{"t":"小王道德认知所处的发展阶段","d":"展阶段从道德认知发展的阶段特征来看，小王整体仍停留在较低的发展水平，带有鲜明的功利化与他律道德特征，价值观偏差问题突出。其一，道德判断以自我利益为核心，奉行相对功利的行为准则。他固执地认为“弱者理应被欺负”，将欺凌弱小作为获取优越感、索取利益的合理手段；认为成绩落后只能依靠作弊，将分数作为学习的唯一目标，完全无视规则的公平性与道德性。判断行为好坏的标准是“对自己有没有好处”，而非是否符合普遍的道德规范，属于典型的相对功利取向。其二，对道德规则的认知停留在外部强制层面，未内化为自身价值准则。小王轻视规则与道德规范，认为规则是用来约束弱者的，自身有能力就可以。"},{"t":"道德认知与道德行为脱节的具体表现","d":"#####（1）结合道德认知发展理论，判断小王道德认知所处阶段，分析其道德认知与道德行为脱节的表现和原因。【解析】儿童的道德认知发展遵循从他律向自律逐步演进的规律，10岁左右是发展的关键转折期，进入青春期后应当逐步形成自律的道德判断能力，能够基于公正、平等原则自主判断是非，理解社会规则的内在价值。小王作为初二学生，正处于青春期品德发展的关键阶段，但从实际表现来看，其道德认知发展严重滞后且存在显著偏差，远未达到成熟的自律道德阶段，同时道德认知与道德行为之间呈现明显的扭曲脱节状态。"},{"t":"道德认知与行为脱节的深层原因","d":"深层原因第一，道德认知本身存在根本性偏差，缺乏正确的是非判断基础。小王长期处于正向引导缺失的成长环境中，错误的生活经验让他形成了“力量至上”的生存逻辑，没有建立起符合社会规范的道德认知体系。认知本身的方向错误，自然无法引导正确的行为，这是知行脱节的根源。第二，道德情感发展严重缺失，认知缺乏内在动力支撑。小王家庭关爱长期缺位，缺乏正向情感滋养，导致情感冷漠、共情能力不足，无法体会他人的痛苦与感受，伤害他人时没有羞耻感，违反规则时没有愧疚感。道德情感是认知转化为行为的动力，动力缺失自然导致认知与行为脱节。第三，道德意志薄弱，无法用认知约束行为冲动。小王处于青。"},{"t":"道德认知本身存在根本性偏差，缺乏正确的是非判断基础","d":"性偏差，缺乏正确的是非判断基础。小王长期处于正向引导缺失的成长环境中，错误的生活经验让他形成了“力量至上”的生存逻辑，没有建立起符合社会规范的道德认知体系。认知本身的方向错误，自然无法引导正确的行为，这是知行脱节的根源。第二，道德情感发展严重缺失，认知缺乏内在动力支撑。小王家庭关爱长期缺位，缺乏正向情感滋养，导致情感冷漠、共情能力不足，无法体会他人的痛苦与感受，伤害他人时没有羞耻感，违反规则时没有愧疚感。道德情感是认知转化为行为的动力，动力缺失自然导致认知与行为脱节。第三，道德意志薄弱，无法用认知约束行为冲动。小王处于青春期，本身情绪冲动、自控力差，面对。"}]},{"t":"（2）结合影响品德发展的因素，分析小王品德不良的成因。","items":[{"t":"外部环境因素是品德不良形成的核心诱因","d":"良形成的核心诱因第一，家庭环境的系统性缺陷是品德问题的根源。家庭是儿童品德发展的第一课堂，家庭结构、教养方式、家庭氛围直接决定品德发展的基础底色。小王的家庭存在多重育人缺陷：其一，家庭结构破损，教育功能长期缺位。父母离异后小王跟随父亲生活，父亲常年外出务工，家庭教育几乎空白；日常照料的奶奶只关注生活照顾，缺乏品德教育意识，对任性、违纪、欺凌行为一味纵容，没有及时纠正偏差，让小王从小就没有建立清晰的规则边界。其二，教育方式简单粗暴，引发逆反心理。父亲返乡后，发现问题只会严厉打骂，缺乏耐心的沟通疏导与价值观引导，不仅没有纠正错误认知，反而激化了小王的逆反心理。"},{"t":"家庭环境的系统性缺陷是品德问题的根源","d":"是品德问题的根源。家庭是儿童品德发展的第一课堂，家庭结构、教养方式、家庭氛围直接决定品德发展的基础底色。小王的家庭存在多重育人缺陷：其一，家庭结构破损，教育功能长期缺位。父母离异后小王跟随父亲生活，父亲常年外出务工，家庭教育几乎空白；日常照料的奶奶只关注生活照顾，缺乏品德教育意识，对任性、违纪、欺凌行为一味纵容，没有及时纠正偏差，让小王从小就没有建立清晰的规则边界。其二，教育方式简单粗暴，引发逆反心理。父亲返乡后，发现问题只会严厉打骂，缺乏耐心的沟通疏导与价值观引导，不仅没有纠正错误认知，反而激化了小王的逆反心理，让他更加抵触正向教育，甚至用更极端的行为。"},{"t":"个体内部因素是品德不良形成的内在依据","d":"良形成的内在依据第一，道德认知偏差是品德问题的思想根源。小王的道德认知不仅水平低，而且存在系统性的价值观偏差，错误地将力量、利益作为判断行为的标准，轻视道德规则与社会规范，没有形成正确的是非观、公正观、责任观。认知层面的方向性错误，直接导致行为的整体走偏，是所有不良行为的内在思想根源。同时他的认知片面、极端，只能看到规则对自己的约束，看不到规则对所有人的保护作用，因此从内心排斥道德规范。第二，道德情感缺失是品德偏差的心理动因。小王长期缺乏稳定的家庭关爱与情感滋养，导致情感冷漠、共情能力不足，无法站在他人角度体会痛苦，因此欺凌同学时毫无愧疚，伤害他人时心安。"},{"t":"道德认知偏差是品德问题的思想根源","d":"题的思想根源。小王的道德认知不仅水平低，而且存在系统性的价值观偏差，错误地将力量、利益作为判断行为的标准，轻视道德规则与社会规范，没有形成正确的是非观、公正观、责任观。认知层面的方向性错误，直接导致行为的整体走偏，是所有不良行为的内在思想根源。同时他的认知片面、极端，只能看到规则对自己的约束，看不到规则对所有人的保护作用，因此从内心排斥道德规范。第二，道德情感缺失是品德偏差的心理动因。小王长期缺乏稳定的家庭关爱与情感滋养，导致情感冷漠、共情能力不足，无法站在他人角度体会痛苦，因此欺凌同学时毫无愧疚，伤害他人时心安理得。同时他对权威、规则抱有天然的抵触情绪。"}]},{"t":"（3）结合文件要求","items":[{"t":"建立信任联结，消解对抗情绪，筑牢品德矫正的情感基础","d":"抗情绪，筑牢品德矫正的情感基础品德不良的学生往往对教师抱有戒心与敌意，存在牢固的心理防线，单纯的批评说教只会激化矛盾，无法发挥教育效果。矫正教育的第一步，是建立信任的师生关系，用关爱消解对立。第一，主动关心接纳，打破心理防线。改变“只在犯错时教育”的模式，主动走近小王，关注他的学习困难与生活需求，而非只作为纪律的执行者。比如针对他学习基础薄弱的问题，提供针对性的学业辅导；了解他家庭的实际情况，给予适当的关心与帮助。通过持续的真诚善意，让他感受到教师不是针对他这个人，而是想帮助他变好，逐步消解抵触情绪，建立信任联结，为后续教育引导铺垫情感基础。第二，尊重人。"},{"t":"纠正认知偏差，强化规则意识，夯实品德发展的思想基础","d":"则意识，夯实品德发展的思想基础道德认知是品德形成的前提，针对小王价值观偏差、规则意识淡薄的问题，结合道德与法治启蒙要求，系统开展认知矫正，从根源上扭转思想偏差。第一，开展价值澄清，纠正错误道德认知。针对“弱者理应被欺负”“成绩差只能作弊”等错误观念，避免空洞说教，采用认知冲突、案例讨论等方式引导深度思考。比如围绕“校园欺凌的代价”“作弊真的能帮到自己吗”等主题，结合真实的青少年案例展开讨论，让他看到欺凌对他人身心的伤害、作弊对个人诚信与长远发展的负面影响，在认知冲突中反思自身观念的偏差。引导他自主得出正确结论，而非强行灌输道德规范。第二，深化规则教育，理。"},{"t":"培育道德情感，锻炼道德意志，构建品德的内在约束动力","d":"德意志，构建品德的内在约束动力针对小王道德情感缺失、意志薄弱的问题，从共情培养、羞耻感激发、意志训练入手，让道德认知获得情感与意志的支撑，转化为内在的行为约束力。第一，开展移情训练，唤醒共情能力。共情是抑制侵犯行为的核心心理力量。通过角色扮演、情境体验等方式，让小王站在被欺凌者的立场，体会被羞辱、被欺负的痛苦与无助，打破“弱者活该”的冷漠认知。比如开展“假如我是他”的主题活动，引导他换位思考，理解他人的感受，逐步建立尊重他人、共情他人的情感基础。第二，激发道德羞耻感与荣誉感。当小王出现正向行为时，及时公开肯定，让他体会到遵守规则、帮助他人带来的荣誉感；当。"},{"t":"强化行为训练，固化良好习惯，实现行为层面的持久转变","d":"好习惯，实现行为层面的持久转变结合良好行为习惯养成的要求，通过目标引导、正向强化、集体约束，帮助小王用新的良好行为习惯替代旧的行为惯性。第一，设置阶梯目标，循序渐进矫正。品德矫正要经历醒悟、转变、自新的长期过程，不能急于求成，允许行为反复。针对小王的情况，先设定最低限度的行为目标，比如不主动欺凌同学、考试不作弊，达成后再逐步提升要求，比如主动帮助同学、诚信应考。每一步都明确标准，及时反馈，避免目标过高导致挫败感，让他在小步前进中建立信心。第二，及时正向强化，巩固良好行为。当小王出现积极行为时，比如主动帮助同学、遵守纪律、认真完成作业，第一时间给予表扬与肯。"},{"t":"推动家校社协同，整合育人力量，构建品德矫正的环境支撑","d":"育人力量，构建品德矫正的环境支撑小王的品德问题根源在家庭，受同伴影响深，单靠学校教育难以根治，必须构建学校主导、家庭尽责、社会支持的协同育人体系，形成矫正合力。第一，优化家校沟通，指导家庭教育方法。主动与小王的父亲、奶奶沟通，改变“只告状、提要求”的沟通模式，客观分析问题根源，给予具体的家庭教育方法指导。比如提醒奶奶不能一味溺爱，要明确行为边界；建议父亲改变打骂的教育方式，多倾听孩子的想法，耐心沟通引导。帮助家长掌握科学的教育方法，让家庭成为正向教育的支撑，而非阻力。第二，引导同伴交往，净化成长环境。通过班级集体活动，引导小王融入积极的同伴群体，减少与不。"}]}]}]},{"name":"柯虎1","questions":[{"num":31,"title":"31 颜之推的家庭教育及其启示·中频","subject":"中教史","blocks":[{"t":"颜之推家庭教育思想：","items":[{"t":"重视儿童早期教育，强调及早施教。","d":"调及早施教。幼年时期是奠定基础的重要阶段，长辈应利用好这个教育时机，及早对幼儿进行教育。"},{"t":"幼年时期是奠定基础的重要阶段，长辈应利用好这个教育时机，及早对幼儿进行教育","d":"（1）重视儿童早期教育，强调及早施教。幼年时期是奠定基础的重要阶段，长辈应利用好这个教育时机，及早对幼儿进行教育。"},{"t":"主张严与慈相结合的教育原则：不善于教育子女的父母","d":"育原则：不善于教育子女的父母，往往重爱轻教，对幼儿一味溺爱，任其为所欲为，在子女面前没有威信。为了达到教育目的，不论是怒责还是鞭笞，只要是有效的手段都是可以采用的。"},{"t":"强调教育切忌偏宠：不管子女聪慧与否，都应以同样的爱护与教育标准来对待。","d":"不管子女聪慧与否，都应以同样的爱护与教育标准来对待。"},{"t":"重视学习通用语言，不强调方言：父母对儿童学习正确的语言负有重要的责任，不可轻视。","d":"强调方言：父母对儿童学习正确的语言负有重要的责任，不可轻视。"}]},{"t":"启示：","items":[{"t":"理论上的启示：家庭教育的重要性：颜之推强调家庭教育对于培养孩子品德和修养的重要性","d":"家庭教育的重要性：颜之推强调家庭教育对于培养孩子品德和修养的重要性。这一观点在当今依然适用，家庭是孩子最早接触到的社会环境，家庭教育对孩子的成长起着决定性的作用。父母的责任：现代父母要认识到自己的责任，积极参与孩子的教育，成为良好的榜样。"},{"t":"父母的责任：现代父母要认识到自己的责任，积极参与孩子的教育，成为良好的榜样","d":"（1）理论上的启示：家庭教育的重要性：颜之推强调家庭教育对于培养孩子品德和修养的重要性。这一观点在当今依然适用，家庭是孩子最早接触到的社会环境，家庭教育对孩子的成长起着决定性的作用。父母的责任：现代父母要认识到自己的责任，积极参与孩子的教育，成为良好的榜样。"},{"t":"实践上的启示：培养孩子的自主性：现代家庭教育应注重培养孩子的自主性","d":"培养孩子的自主性：现代家庭教育应注重培养孩子的自主性，鼓励他们独立思考、解决问题和做出决策。培养孩子的品德和道德：颜之推注重培养孩子的品德和道德修养，强调孝道、仁爱和诚信等价值观。现代家庭教育也应注重培养孩子的品德和道德修养，帮助他们成为有责任感和正确价值观的人。"},{"t":"对当今教育的启示：","d":"31.【解析】本题考查《中国教育史》中古代教育家颜之推的家庭教育及其启示。属于中频考点，难度适中。对于颜之推的家庭教育部分，可从颜之推的教育背景入题，按照讲义与课程内容进行阐述即可。对于当今教育的启示，可从理论启示、实践启示、对当今教育的启示三个方面进行回答。【参考答案】。"}]}],"id":"柯虎1-31"},{"num":32,"title":"32 实用主义教育家杜威的教育无目的论…·高频","subject":"外教史","blocks":[{"t":"启示杜威的“教育无目的论”并不是说教育真的没有目的","items":[{"t":"今社会在教学中应该关注到儿童的身心发展水平以及儿童的兴趣和需要","d":"注到儿童的身心发展水平以及儿童的兴趣和需要，对儿童的教育是一个持续不断的社会化的过程，我们要多关注儿童，不能够无视儿童的想法及观点，消极的对待儿童，不考虑儿童的兴趣与需要，这些都是不合理的教学观点。"},{"t":"教育要注意尊重儿童的愿望","d":"愿望，使儿童从教育本身、从生长过程中得到乐趣，学生在学习中感受到了乐趣他才会主动去学习，而不会厌学，这样可以更好的激发学生的学习积极性。"},{"t":"教育目的的设立必须与学生进行合作完成。教育者需要提供学生能力有所发挥的环境。","d":"学生进行合作完成。教育者需要提供学生能力有所发挥的环境。如果教师把目的强加给了学生，从而使教师的智慧受到限制，使教师局限于现有的课程、教法，因此没有创新，思想不能和教材、学生发生密切的联系。这样教师也就不能更好地利用教材，不能去理解学生的真正需要，教育的作用就没办法很好地发挥，也不利于学生的成长。因此应该遵循学生的身心发展规律，尊重儿童的天性。"},{"t":"如果教师把目的强加给了学生","d":"（3）教育目的的设立必须与学生进行合作完成。教育者需要提供学生能力有所发挥的环境。如果教师把目的强加给了学生，从而使教师的智慧受到限制，使教师局限于现有的课程、教法，因此没有创新，思想不能和教材、学生发生密切的联系。这样教师也就不能更好地利用教材，不能去理解学生的真正需要，教育的作用就没办法很好地发挥，也不利于学生的成长。因此应该遵循学生的身心发展规律，尊重儿童的天性。"}]}],"id":"柯虎1-32"},{"num":33,"title":"33 对于教师职业特点与教师要求·高频","subject":"教原","blocks":[{"t":"（1）简述“经师”和“人师”的区别。","items":[{"t":"示范性：示范性是教师劳动最突出的特点，孔子曰：“其身正，不令而行；其身不正，虽令不从","d":"劳动最突出的特点，孔子曰：“其身正，不令而行；其身不正，虽令不从。”教师的言谈举止、人品道德都对学生起到示范作用，潜移默化间影响学生的道德发展，因此教师需要润己泽人，不断提高自身的道德修养成为“人师”，从而带动学生。"},{"t":"复杂性：教师的劳动对象、劳动任务、劳动手段和劳动过程是复杂的","d":"象、劳动任务、劳动手段和劳动过程是复杂的。首先，教师面对的对象是人，是具有情感的不同的学生，因此教师需要因材施教；其次，教师需要教书育人，实现学生德智体美劳的全面发展。只有成为“人师”，教师才能照顾学生的个性化特点，不仅提升学生的知识，而且涵养学生品德，成为健全的人。"},{"t":"创造性：劳动性质和劳动对象决定了教师劳动的创造性","d":"动对象决定了教师劳动的创造性，主要表现在对学生因材施教，高水平的教育机制，教学内容和教学方法的选择。“人师”要求教师把自己的温暖和情感倾注到每一个学生身上，让每一个学生都健康成长，让每一个孩子都有人生出彩的机会，体现了教师工作的创造性。"},{"t":"长期性和长效性：一方面教师对学生的影响不是短时间内就可以完成的，而是一个长期、动态的过程","d":"33.【解析】本题结合材料考查对于教师职业特点与教师要求。属于高频考点，难度较高。首先“经师”与“人师”的区别就是是否具有品德教育，强调不仅要对学生传授知识，还要教育品德。第二问教师劳动的特点可根据讲义，从示范性、复杂性、创造性、长期性和长效性进行举例论述。第三问“教师如何做‘经师’和‘人师’的统一者”即考查教师如何处理好知识传授与品德教育，可从树立良好的学生观、提升自身素养、建立良好的师生关系进行回答，也可从其他方面进行论述，答案不唯一，言之有理即可。【参考答案】。"}]},{"t":"（2）结合教师职业的特点，论述成为“人师”的必要性。","items":[{"t":"树立正确的学生观","d":"教师应认识到学生是未成熟的人、具有主体性的人、独特的人和有特定权责的人，学生以系统学习间接经验为主，具有主体性、独立性、选择性、个体性、创造性、自我意识、差异性和明显的发展特征。因此，教师在教育时，应注意做到因材施教，尊重学生的主体性特征。"},{"t":"提升自身的专业素养，教师专业素养包括专业理想、专业知识和专业能力","d":"教师专业素养包括专业理想、专业知识和专业能力。要成为“经师”和“人师”的统一者，教师首先要树立教育理想，做学生成长的引领者、文化的传播者和发展者、社会物质文明和精神文明建设的推动者；其次，要广泛学习，增强自身的专业知识，“有一桶水，才能给学生一瓶水”，教师不仅要学习学科教学知识、课程知识，还要学习社区教育情境知识等；最后，教师还要扎实专业能力，不仅能够具备高超的教授学科知识，还具备教学机智，擅长处理各类教学事件。"},{"t":"建立良好的师生关系","d":"33.【解析】本题结合材料考查对于教师职业特点与教师要求。属于高频考点，难度较高。首先“经师”与“人师”的区别就是是否具有品德教育，强调不仅要对学生传授知识，还要教育品德。第二问教师劳动的特点可根据讲义，从示范性、复杂性、创造性、长期性和长效性进行举例论述。第三问“教师如何做‘经师’和‘人师’的统一者”即考查教师如何处理好知识传授与品德教育，可从树立良好的学生观、提升自身素养、建立良好的师生关系进行回答，也可从其他方面进行论述，答案不唯一，言之有理即可。【参考答案】。"}]}],"id":"柯虎1-33"},{"num":34,"title":"34 教育热点问题·中频","subject":"教原","blocks":[{"t":"（1）阅读上述材料","items":[{"t":"培养解决问题的能力：学生通过亲身解决问题的经验","d":"学生通过亲身解决问题的经验，可以学会思考和解决问题的步骤，而不是仅仅依赖于教师提供的答案。"},{"t":"长远学习进步：那些在确定所需相关事实以及从哪里和如何获取事实方面有过专门练习的学生","d":"那些在确定所需相关事实以及从哪里和如何获取事实方面有过专门练习的学生，在学习解决问题时显示出更大的进步。这种技能的早期习得，使得学生在更高阶段的学习中不需要再对这些基本技能进行特别强调，从而可以更专注于高级问题的解决。"}]},{"t":"（2）2022年3月","items":[{"t":"以皮亚杰和维果斯基为代表的建构主义理论认为知识是一种暂定性的解释和假设","d":"（2）①自主学习符合建构主义强调的主动性。以皮亚杰和维果斯基为代表的建构主义理论认为知识是一种暂定性的解释和假设，学习者并不是空着脑袋进入学习情景中的。在日常生活和以往各种形式的学习中，他们建构主义认为学生的学习具有主动建构性、活动情景性、社会互动性。学习不是由教师把知识简单地传递给学生，而是一个学生积极、主动参与的过程。学生不是简单被动地接收信息，而是主动地建构知识的意义，这种建构无法由他人代替。学习需要创设一些具体的教育情景，教师通过情境教学的方式，可以帮助学生更好地理解知识。建构主义，尤其是社会建构主义，特别注意强调在他人帮助或者合作学习的方式下进。"},{"t":"学习是学习者主动建构的过程","d":"（2）①自主学习符合建构主义强调的主动性。以皮亚杰和维果斯基为代表的建构主义理论认为知识是一种暂定性的解释和假设，学习者并不是空着脑袋进入学习情景中的。在日常生活和以往各种形式的学习中，他们建构主义认为学生的学习具有主动建构性、活动情景性、社会互动性。学习不是由教师把知识简单地传递给学生，而是一个学生积极、主动参与的过程。学生不是简单被动地接收信息，而是主动地建构知识的意义，这种建构无法由他人代替。学习需要创设一些具体的教育情景，教师通过情境教学的方式，可以帮助学生更好地理解知识。建构主义，尤其是社会建构主义，特别注意强调在他人帮助或者合作学习的方式下进。"},{"t":"教师在教学过程中","d":"（2）①自主学习符合建构主义强调的主动性。以皮亚杰和维果斯基为代表的建构主义理论认为知识是一种暂定性的解释和假设，学习者并不是空着脑袋进入学习情景中的。在日常生活和以往各种形式的学习中，他们建构主义认为学生的学习具有主动建构性、活动情景性、社会互动性。学习不是由教师把知识简单地传递给学生，而是一个学生积极、主动参与的过程。学生不是简单被动地接收信息，而是主动地建构知识的意义，这种建构无法由他人代替。学习需要创设一些具体的教育情景，教师通过情境教学的方式，可以帮助学生更好地理解知识。建构主义，尤其是社会建构主义，特别注意强调在他人帮助或者合作学习的方式下进。"},{"t":"自主学习符合人本理论的“非指导性教学原则”。","d":"的“非指导性教学原则”。以罗杰斯为代表的人本理论认为，在传统教育中，教师是知识的拥有者，学生只是被动的接受者，教师可以通过讲演、考试甚至嘲弄等方式来支配学生的学习，而学生无所适从；教师是权力的拥有者，而学生是服从者。罗杰斯主张废除“教师”这一角色，代之以“学习的促进者”，进行“非指导性教学”。人本主义心理学家主张的“做”中学和在学习过程中学习者如何学习的观点有利于在教育教学中消除老师与学生、学和做、目的和手段之间的对立，使学习成为乐趣。"}]}],"id":"柯虎1-34"},{"num":35,"title":"35 对于小组合作学习的理解","subject":"教原","blocks":[{"t":"（1）从社会发展对教育的需求角度，分析合作学习的必要性。","items":[{"t":"经济发展的需求：合作学习可以培养学生的团队合作能力","d":"（1）合作学习的实质是通过组建学习小组，在小组内部实施合作，发挥学生主体作用，达到更好的学习效果。经济发展的需求：合作学习可以培养学生的团队合作能力，这对未来的工作是非常必要的，因为现代经济活动越来越依赖团队分工与协作。政治民主化的需求：合作学习可以培养学生的民主态度与公民意识，这对未来的社会参与与国家建设是非常必要的。文化多元化的需求：合作学习可以让不同文化背景的学生互相交流与理解，这对构建和谐社会是非常必要的。科技创新与发展的需求：合作学习可以发挥学生的创造力与实践能力，培养创新人才，这对国家科技进步是非常必要的。知识爆炸与更新的需求：合作学习可以实。"},{"t":"政治民主化的需求：合作学习可以培养学生的民主态度与公民意识","d":"（1）合作学习的实质是通过组建学习小组，在小组内部实施合作，发挥学生主体作用，达到更好的学习效果。经济发展的需求：合作学习可以培养学生的团队合作能力，这对未来的工作是非常必要的，因为现代经济活动越来越依赖团队分工与协作。政治民主化的需求：合作学习可以培养学生的民主态度与公民意识，这对未来的社会参与与国家建设是非常必要的。文化多元化的需求：合作学习可以让不同文化背景的学生互相交流与理解，这对构建和谐社会是非常必要的。科技创新与发展的需求：合作学习可以发挥学生的创造力与实践能力，培养创新人才，这对国家科技进步是非常必要的。知识爆炸与更新的需求：合作学习可以实。"},{"t":"文化多元化的需求：合作学习可以让不同文化背景的学生互相交流与理解","d":"（1）合作学习的实质是通过组建学习小组，在小组内部实施合作，发挥学生主体作用，达到更好的学习效果。经济发展的需求：合作学习可以培养学生的团队合作能力，这对未来的工作是非常必要的，因为现代经济活动越来越依赖团队分工与协作。政治民主化的需求：合作学习可以培养学生的民主态度与公民意识，这对未来的社会参与与国家建设是非常必要的。文化多元化的需求：合作学习可以让不同文化背景的学生互相交流与理解，这对构建和谐社会是非常必要的。科技创新与发展的需求：合作学习可以发挥学生的创造力与实践能力，培养创新人才，这对国家科技进步是非常必要的。知识爆炸与更新的需求：合作学习可以实。"},{"t":"科技创新与发展的需求：合作学习可以发挥学生的创造力与实践能力","d":"（1）合作学习的实质是通过组建学习小组，在小组内部实施合作，发挥学生主体作用，达到更好的学习效果。经济发展的需求：合作学习可以培养学生的团队合作能力，这对未来的工作是非常必要的，因为现代经济活动越来越依赖团队分工与协作。政治民主化的需求：合作学习可以培养学生的民主态度与公民意识，这对未来的社会参与与国家建设是非常必要的。文化多元化的需求：合作学习可以让不同文化背景的学生互相交流与理解，这对构建和谐社会是非常必要的。科技创新与发展的需求：合作学习可以发挥学生的创造力与实践能力，培养创新人才，这对国家科技进步是非常必要的。知识爆炸与更新的需求：合作学习可以实。"}]},{"t":"（2）从现行课堂教学方式的角度","items":[{"t":"教学评价：课堂讲授和个别发言强调个人表现，而合作学习需要团队协作","d":"（2）教学方式：长期以来，课堂教学以教师讲授为主，学生习惯被动接受知识，不习惯主动参与和互动。教学评价：课堂讲授和个别发言强调个人表现，而合作学习需要团队协作。教学氛围：课堂氛围严肃，不鼓励讨论，学生不习惯团队互动。"},{"t":"教学氛围：课堂氛围严肃，不鼓励讨论，学生不习惯团队互动","d":"（2）教学方式：长期以来，课堂教学以教师讲授为主，学生习惯被动接受知识，不习惯主动参与和互动。教学评价：课堂讲授和个别发言强调个人表现，而合作学习需要团队协作。教学氛围：课堂氛围严肃，不鼓励讨论，学生不习惯团队互动。"}]},{"t":"（3）从学校教学改革的角度，提出帮助学生适应合作学习的建议","items":[{"t":"目的：加强对学生合作能力的培养，如沟通协调能力、问题解决能力、自我管理能力等","d":"（3）从学校教学改革的角度，我认为可以提出以下帮助学生适应合作学习的建议：目的：加强对学生合作能力的培养，如沟通协调能力、问题解决能力、自我管理能力等。内容：设置一些需要综合各学科知识完成的项目，让学生体会跨学科合作的意义。增加一些需要团队合作完成的项目、练习任务或案例分析等，营造合作氛围。方法：循序渐进，逐步增加合作学习在课程中的比重和时间，让学生有一个适应的过程。鼓励教师充分肯定学生的合作行为，营造积极的合作学习氛围。鼓励教师创设灵活多样的合作学习模式，而不仅是固定的小组讨论。管理：制定学生合作行为规范，并让学生参与制定，提高合作意识。逐步进行这些改。"},{"t":"内容：设置一些需要综合各学科知识完成的项目，让学生体会跨学科合作的意义","d":"（3）从学校教学改革的角度，我认为可以提出以下帮助学生适应合作学习的建议：目的：加强对学生合作能力的培养，如沟通协调能力、问题解决能力、自我管理能力等。内容：设置一些需要综合各学科知识完成的项目，让学生体会跨学科合作的意义。增加一些需要团队合作完成的项目、练习任务或案例分析等，营造合作氛围。方法：循序渐进，逐步增加合作学习在课程中的比重和时间，让学生有一个适应的过程。鼓励教师充分肯定学生的合作行为，营造积极的合作学习氛围。鼓励教师创设灵活多样的合作学习模式，而不仅是固定的小组讨论。管理：制定学生合作行为规范，并让学生参与制定，提高合作意识。逐步进行这些改。"},{"t":"方法：循序渐进，逐步增加合作学习在课程中的比重和时间，让学生有一个适应的过程","d":"（3）从学校教学改革的角度，我认为可以提出以下帮助学生适应合作学习的建议：目的：加强对学生合作能力的培养，如沟通协调能力、问题解决能力、自我管理能力等。内容：设置一些需要综合各学科知识完成的项目，让学生体会跨学科合作的意义。增加一些需要团队合作完成的项目、练习任务或案例分析等，营造合作氛围。方法：循序渐进，逐步增加合作学习在课程中的比重和时间，让学生有一个适应的过程。鼓励教师充分肯定学生的合作行为，营造积极的合作学习氛围。鼓励教师创设灵活多样的合作学习模式，而不仅是固定的小组讨论。管理：制定学生合作行为规范，并让学生参与制定，提高合作意识。逐步进行这些改。"},{"t":"鼓励教师充分肯定学生的合作行为，营造积极的合作学习氛围","d":"（3）从学校教学改革的角度，我认为可以提出以下帮助学生适应合作学习的建议：目的：加强对学生合作能力的培养，如沟通协调能力、问题解决能力、自我管理能力等。内容：设置一些需要综合各学科知识完成的项目，让学生体会跨学科合作的意义。增加一些需要团队合作完成的项目、练习任务或案例分析等，营造合作氛围。方法：循序渐进，逐步增加合作学习在课程中的比重和时间，让学生有一个适应的过程。鼓励教师充分肯定学生的合作行为，营造积极的合作学习氛围。鼓励教师创设灵活多样的合作学习模式，而不仅是固定的小组讨论。管理：制定学生合作行为规范，并让学生参与制定，提高合作意识。逐步进行这些改。"}]}],"id":"柯虎1-35"},{"num":36,"title":"36 维纳的成败归因理论·高频","subject":"教心","blocks":[{"t":"（1）结合维纳的归因理论，分析材料中同学的归因方式。","items":[{"t":"内部与外部、稳定与不稳定、可控与不可控","d":"（1）根据维纳的成败归因理论，人们倾向于将活动成败的原因归结于六个因素：能力高低、努力程度、任务难度、运气好坏、身心状态、外界环境等。这六个因素可以归为三个维度：内部与外部、稳定与不稳定、可控与不可控。"},{"t":"小雅的归因方式为努力归因，即内部、不稳定、可控的归因方式。","d":"归因，即内部、不稳定、可控的归因方式。"},{"t":"小斌的归因方式为能力归因，即内部、稳定、不可控的归因方式。","d":"归因，即内部、稳定、不可控的归因方式。"},{"t":"小辉的归因方式为任务难度归因，即外部、稳定、不可控的归因方式。","d":"难度归因，即外部、稳定、不可控的归因方式。"}]},{"t":"（2）如果你是这位数学老师","items":[{"t":"教师应引导学生进行客观归因","d":"观归因，尽量地将学习上的成功归因于自己的能力和努力，而将学习上的失败归因于内部的不稳定因素，即努力不够，只有这样才能使学生产生更高的学习动机，树立对下次学习成功的期望。"},{"t":"教师要帮助学生建立积极的自我概念","d":"极的自我概念，在日常工作中慎重地对学生做出评价，以引导学生建立积极的自我概念，从而激发学习动机。"},{"t":"需要注意的是，不能将一切归因于努力","d":"一切归因于努力。如果学生已经非常努力但是仍然没有成功，则容易导致习得性无助，所以教师应帮助学生找到正确的原因。"}]}],"id":"柯虎1-36"}],"id":"柯虎1"},{"name":"柯虎2","questions":[{"num":31,"title":"31 陈鹤琴的“活教育”体系·中频","subject":"中教史","blocks":[{"t":"陈鹤琴是我国著名的儿童教育家","items":[{"t":"“活教育”的目的论：“做人，做中国人，做现代中国人”是陈鹤琴“活教育”的目的论。","d":"做人，做中国人，做现代中国人”是陈鹤琴“活教育”的目的论。他对“现代中国人”提出五方面的要求要有健全的身体、要有建设的能力、要有创造的能力、要能够合作、要服务。"},{"t":"他对“现代中国人”提出五方面的要求要有健全的身体","d":"①“活教育”的目的论：“做人，做中国人，做现代中国人”是陈鹤琴“活教育”的目的论。他对“现代中国人”提出五方面的要求要有健全的身体、要有建设的能力、要有创造的能力、要能够合作、要服务。"},{"t":"“活教育”的课程论：“大自然、大社会都是活教材”是陈鹤琴对“活教育”的课程论的概括表述","d":"31.【解析】本题考查《中国教育史》中近代教育家陈鹤琴的“活教育”体系，属于中频考点，难度适中。对于陈鹤琴的“活教育”体系只需要按照讲义与课程内容进行简述答到：活教育的目的论：“做人、做中国人、做现代中国人”“活教育”的课程论：“大自然、大社会都是活教材”“活教育”的教学论：教学原则为“做中教，做中学，做中求进步”。活教育的启示，言之有理的如当代教育目的、当代教学方式、活动课程启示等均可。【参考答案】。"},{"t":"“活教育”的教学论：教学原则为“做中教，做中学，做中求进步”。","d":"31.【解析】本题考查《中国教育史》中近代教育家陈鹤琴的“活教育”体系，属于中频考点，难度适中。对于陈鹤琴的“活教育”体系只需要按照讲义与课程内容进行简述答到：活教育的目的论：“做人、做中国人、做现代中国人”“活教育”的课程论：“大自然、大社会都是活教材”“活教育”的教学论：教学原则为“做中教，做中学，做中求进步”。活教育的启示，言之有理的如当代教育目的、当代教学方式、活动课程启示等均可。【参考答案】。"}]},{"t":"现代价值意义。","items":[{"t":"活教育”思想的提出","d":"（2）现代价值意义。活教育”思想的提出，为我国近代教育事业带来了一片光明前景，对现代社会的发展，有着重要价值和意义。"},{"t":"“活教育”开创了对新型教育模式探索的先河。","d":"型教育模式探索的先河。“活教育”无论是在教学目的、教学内容、还是教学方法上，都是陈鹤琴长期教育研究与教育实践的总结，针对中国传统教育，他能够去其糟粕取其精华，将学生学习带向社会，融入自然。这一方面拓宽了学生视野，教会他们如何做人；另一方面，改变了以往毫无生气的课堂面貌，更有利于学生身心发展和智力提升。这种新型教学模式，在之前从未出现过，可以说它开创了我国教学改革的先河。"},{"t":"“活教育”无论是在教学目的、教学内容、还是教学方法上","d":"①“活教育”开创了对新型教育模式探索的先河。“活教育”无论是在教学目的、教学内容、还是教学方法上，都是陈鹤琴长期教育研究与教育实践的总结，针对中国传统教育，他能够去其糟粕取其精华，将学生学习带向社会，融入自然。这一方面拓宽了学生视野，教会他们如何做人；另一方面，改变了以往毫无生气的课堂面貌，更有利于学生身心发展和智力提升。这种新型教学模式，在之前从未出现过，可以说它开创了我国教学改革的先河。"},{"t":"“活教育”确立了儿童在教学中的重要地位。","d":"在教学中的重要地位。“活教育”的提出，首次将儿童的重要性摆在了教育的首位。陈鹤琴认为，幼教工作的开展，应当以尊重儿童、热爱儿童和了解儿童为前提，将他们视为具有独立人格的个体；而不是成年人的附属品。只有这样，在开展“活教育”的过程中，才有利于培养儿童自尊自信的良好品格，满足个性发展需求。这种进步的理念，为日后我国的幼教事业广泛接受并采纳。"},{"t":"“活教育”明确了我国的教学目的和教学理念。","d":"的教学目的和教学理念。“活教育”明确强调，其目的是教会国人如何做一名现代中国人这是一种带有鲜明爱国特色且符合中国国情的教育理念。它不同于传统盲目的教育学习，也不是照搬别国、忽略本国历史文化与社会现实的教学，它的提出更激发了国人学习的热情。在教学理念上，“活教育”明确表示，幼儿的教育工作，是极为复杂的，并非仅仅依靠幼稚园一方努力就可取得良好效果，对幼儿的培养还离不开家庭和社会的关注。只有三方相互协调配合，才有助于儿童身心更健康发展。这理念的提出，大大引发了社会和家庭对儿童的关注。"}]}],"id":"柯虎2-31"},{"num":32,"title":"32 赫尔巴特的课程论","subject":"外教史","blocks":[{"t":"兴趣观是赫尔巴特设置课程的基本依据之一。","items":[{"t":"课程内容的选择和编制应该与儿童的兴趣保持一致","d":"（1）兴趣观是赫尔巴特设置课程的基本依据之一。课程内容的选择和编制应该与儿童的兴趣保持一致。赫尔巴特将兴趣分为经验类的兴趣和同情类的兴趣。经验类的兴趣包括经验的、审美的、思辨的。经验的兴趣应设自然、物理、化学和地理等课程；思辨的兴趣，应设数学、逻辑和文法等课程；审美的兴趣，应设文学、绘画等课程。同情类的兴趣包括同情的、社会的、宗教的。同情的兴趣，应设本国语、外国语等课程；社会的兴趣，应设历史、政治、法律；宗教的兴趣，应设神学等课程。"},{"t":"经验类的兴趣包括经验的、审美的、思辨的","d":"32.【解析】本题考查《外国教育史》中赫尔巴特的课程论，本题属于小点大考，难度较高。首先从理论方面，需要答到兴趣影响课程设置、赫尔巴特将兴趣分为经验类的兴趣和同情类的兴趣、经验类的兴趣包括经验的、审美的、思辨的。同情类的兴趣包括同情的、社会的、宗教的。其次兴趣影响教学可以从：兴趣分为四阶段：注意、期待、要求、行动。教学形式阶段理论：明了、联合、系统、方法。两方面进行回答。【参考答案】。"},{"t":"同情类的兴趣包括同情的、社会的、宗教的","d":"32.【解析】本题考查《外国教育史》中赫尔巴特的课程论，本题属于小点大考，难度较高。首先从理论方面，需要答到兴趣影响课程设置、赫尔巴特将兴趣分为经验类的兴趣和同情类的兴趣、经验类的兴趣包括经验的、审美的、思辨的。同情类的兴趣包括同情的、社会的、宗教的。其次兴趣影响教学可以从：兴趣分为四阶段：注意、期待、要求、行动。教学形式阶段理论：明了、联合、系统、方法。两方面进行回答。【参考答案】。"},{"t":"社会的兴趣，应设历史、政治、法律；宗教的兴趣，应设神学等课程","d":"（1）兴趣观是赫尔巴特设置课程的基本依据之一。课程内容的选择和编制应该与儿童的兴趣保持一致。赫尔巴特将兴趣分为经验类的兴趣和同情类的兴趣。经验类的兴趣包括经验的、审美的、思辨的。经验的兴趣应设自然、物理、化学和地理等课程；思辨的兴趣，应设数学、逻辑和文法等课程；审美的兴趣，应设文学、绘画等课程。同情类的兴趣包括同情的、社会的、宗教的。同情的兴趣，应设本国语、外国语等课程；社会的兴趣，应设历史、政治、法律；宗教的兴趣，应设神学等课程。"}]},{"t":"兴趣观是赫尔巴特确立教学形式阶段论的重要依据。","items":[{"t":"赫尔巴特从心理学角度出发，将兴趣分为四阶段：注意、期待、探求、行动","d":"（2）兴趣观是赫尔巴特确立教学形式阶段论的重要依据。赫尔巴特从心理学角度出发，将兴趣分为四阶段：注意、期待、探求、行动。与之对应，他提出了教学形式阶段理论：明了、联合、系统、方法。在教学的明了阶段，学生的兴趣表现为注意，处于静止的专心活动，教师通过提示来使学生获得清晰的表象；在教学的联合阶段，兴趣表现为期待，教师运用分析的教学方法：在系统的教学阶段，兴趣处于探求阶段，教师运用综合的教学方法；在方法阶段，教师要求学生自己进行活动，通过练习来巩固新的知识。"},{"t":"与之对应，他提出了教学形式阶段理论：明了、联合、系统、方法","d":"（2）兴趣观是赫尔巴特确立教学形式阶段论的重要依据。赫尔巴特从心理学角度出发，将兴趣分为四阶段：注意、期待、探求、行动。与之对应，他提出了教学形式阶段理论：明了、联合、系统、方法。在教学的明了阶段，学生的兴趣表现为注意，处于静止的专心活动，教师通过提示来使学生获得清晰的表象；在教学的联合阶段，兴趣表现为期待，教师运用分析的教学方法：在系统的教学阶段，兴趣处于探求阶段，教师运用综合的教学方法；在方法阶段，教师要求学生自己进行活动，通过练习来巩固新的知识。"},{"t":"在教学的明了阶段","d":"（2）兴趣观是赫尔巴特确立教学形式阶段论的重要依据。赫尔巴特从心理学角度出发，将兴趣分为四阶段：注意、期待、探求、行动。与之对应，他提出了教学形式阶段理论：明了、联合、系统、方法。在教学的明了阶段，学生的兴趣表现为注意，处于静止的专心活动，教师通过提示来使学生获得清晰的表象；在教学的联合阶段，兴趣表现为期待，教师运用分析的教学方法：在系统的教学阶段，兴趣处于探求阶段，教师运用综合的教学方法；在方法阶段，教师要求学生自己进行活动，通过练习来巩固新的知识。"},{"t":"在教学的联合阶段，兴趣表现为期待，教师运用分析的教学方法：","d":"（2）兴趣观是赫尔巴特确立教学形式阶段论的重要依据。赫尔巴特从心理学角度出发，将兴趣分为四阶段：注意、期待、探求、行动。与之对应，他提出了教学形式阶段理论：明了、联合、系统、方法。在教学的明了阶段，学生的兴趣表现为注意，处于静止的专心活动，教师通过提示来使学生获得清晰的表象；在教学的联合阶段，兴趣表现为期待，教师运用分析的教学方法：在系统的教学阶段，兴趣处于探求阶段，教师运用综合的教学方法；在方法阶段，教师要求学生自己进行活动，通过练习来巩固新的知识。"}]}],"id":"柯虎2-32"},{"num":33,"title":"33 教原·高频","subject":"教原","blocks":[{"t":"（1）阅读材料","items":[{"t":"课程建设以核心素养为导向","d":"33.【解析】本题结合材料，考查教育热点素质教育问题。属于高频考点，难度较高。根据材料，课程建设以核心素养为导向的理由有：国际竞争力、现代化、教育改革。我国培养学生核心素养有：人文底蕴、科学精神、学会学习、健康生活、责任担当、实践创新。做法上可以从课程目的、课程内容、课程方法、课程评价这些角度进行回答（任选两点即可）。【参考答案】。"},{"t":"课程建设以核心素养为导向，是深化教育综合改革、加快推进教育现代化的需要","d":"33.【解析】本题结合材料，考查教育热点素质教育问题。属于高频考点，难度较高。根据材料，课程建设以核心素养为导向的理由有：国际竞争力、现代化、教育改革。我国培养学生核心素养有：人文底蕴、科学精神、学会学习、健康生活、责任担当、实践创新。做法上可以从课程目的、课程内容、课程方法、课程评价这些角度进行回答（任选两点即可）。【参考答案】。"}]},{"t":"（2）我国要培养的学生核心素养是什么？","items":[{"t":"其中文化基础包括人文底蕴、科学精神；","d":"（2）我国核心素养包括文化基础、自主发展、社会参与三个维度。其中文化基础包括人文底蕴、科学精神；自主发展包括学会学习、健康生活：社会参与包括责任担当、实践创新。"},{"t":"自主发展包括学会学习、健康生活：","d":"（2）我国核心素养包括文化基础、自主发展、社会参与三个维度。其中文化基础包括人文底蕴、科学精神；自主发展包括学会学习、健康生活：社会参与包括责任担当、实践创新。"},{"t":"社会参与包括责任担当、实践创新","d":"（2）我国核心素养包括文化基础、自主发展、社会参与三个维度。其中文化基础包括人文底蕴、科学精神；自主发展包括学会学习、健康生活：社会参与包括责任担当、实践创新。"}]},{"t":"（3）如何推动以核心素养为导向的课程建设？","items":[{"t":"课程是为落实培养目标服务的","d":"（3）第一，以核心素养为导向开发课程体系，明确课程目标。课程是为落实培养目标服务的。课程标准研制、教材开发、课程资源建设，都要紧扣核心素养这个育人目标，都要与核心素养精准对接，并以核心素养为中心，不断精简内容，优化结构，加强跨学科学习，做到减负增效。第二，以核心素养为导向选择课程内容。新课程方案要求明确提出“基于核心素养培养要求，明确课程内容选什么、选多少”，注重与学生经验、社会生活的关联，加强课程内容的内在联系，突出课程内容结构化，探索主题、项目、任务等内容组织方式。第三，以核心素养为导向深化教学改革方式。满堂灌、死记硬背、题海战术等传统教学方法是难以。"},{"t":"第二，以核心素养为导向选择课程内容","d":"（3）第一，以核心素养为导向开发课程体系，明确课程目标。课程是为落实培养目标服务的。课程标准研制、教材开发、课程资源建设，都要紧扣核心素养这个育人目标，都要与核心素养精准对接，并以核心素养为中心，不断精简内容，优化结构，加强跨学科学习，做到减负增效。第二，以核心素养为导向选择课程内容。新课程方案要求明确提出“基于核心素养培养要求，明确课程内容选什么、选多少”，注重与学生经验、社会生活的关联，加强课程内容的内在联系，突出课程内容结构化，探索主题、项目、任务等内容组织方式。第三，以核心素养为导向深化教学改革方式。满堂灌、死记硬背、题海战术等传统教学方法是难以。"},{"t":"新课程方案要求明确提出“基于核心素养培养要求","d":"（3）第一，以核心素养为导向开发课程体系，明确课程目标。课程是为落实培养目标服务的。课程标准研制、教材开发、课程资源建设，都要紧扣核心素养这个育人目标，都要与核心素养精准对接，并以核心素养为中心，不断精简内容，优化结构，加强跨学科学习，做到减负增效。第二，以核心素养为导向选择课程内容。新课程方案要求明确提出“基于核心素养培养要求，明确课程内容选什么、选多少”，注重与学生经验、社会生活的关联，加强课程内容的内在联系，突出课程内容结构化，探索主题、项目、任务等内容组织方式。第三，以核心素养为导向深化教学改革方式。满堂灌、死记硬背、题海战术等传统教学方法是难以。"},{"t":"第三，以核心素养为导向深化教学改革方式","d":"（3）第一，以核心素养为导向开发课程体系，明确课程目标。课程是为落实培养目标服务的。课程标准研制、教材开发、课程资源建设，都要紧扣核心素养这个育人目标，都要与核心素养精准对接，并以核心素养为中心，不断精简内容，优化结构，加强跨学科学习，做到减负增效。第二，以核心素养为导向选择课程内容。新课程方案要求明确提出“基于核心素养培养要求，明确课程内容选什么、选多少”，注重与学生经验、社会生活的关联，加强课程内容的内在联系，突出课程内容结构化，探索主题、项目、任务等内容组织方式。第三，以核心素养为导向深化教学改革方式。满堂灌、死记硬背、题海战术等传统教学方法是难以。"}]}],"id":"柯虎2-33"},{"num":34,"title":"34 教育热点问题“唯分数论”的观点","subject":"教原","blocks":[{"t":"（1）阅读上述材料","items":[{"t":"分数的评价维度单一，只考察知识掌握，而不涵盖学生的全面发展。","d":"34.【解析】本题结合材料考查教育热点问题“唯分数论”的观点。首先要明确观点：分数只是静态的、阶段性的数据，并不能反映学生的动态发展和长足进步。分数的评价维度单一，只考察知识掌握，而不涵盖学生的全面发展。总分的意义也是有限的，在日常学习过程中，总分与排名并不会给学生带来更好的学习。第二问则可以从相关的学习理论，行为、认知（发现、接受）、建构、人本等角度进行分析。学习动机理论则可以从强化、需要层次、成败归因、目标定向、自我效能、自我价值、自我决定等角度言之有理即可。【参考答案】。"},{"t":"总分的意义也是有限的，在日常学习过程中，总分与排名并不会给学生带来更好的学习。","d":"34.【解析】本题结合材料考查教育热点问题“唯分数论”的观点。首先要明确观点：分数只是静态的、阶段性的数据，并不能反映学生的动态发展和长足进步。分数的评价维度单一，只考察知识掌握，而不涵盖学生的全面发展。总分的意义也是有限的，在日常学习过程中，总分与排名并不会给学生带来更好的学习。第二问则可以从相关的学习理论，行为、认知（发现、接受）、建构、人本等角度进行分析。学习动机理论则可以从强化、需要层次、成败归因、目标定向、自我效能、自我价值、自我决定等角度言之有理即可。【参考答案】。"}]},{"t":"（2）《2022版义务教育课程方案》指出","items":[{"t":"根据建构主义学习理论，学生是积极主动的学习者，他们通过参与
