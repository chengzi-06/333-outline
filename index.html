<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="333 大纲">
<meta name="theme-color" content="#F7F5EF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>333 大纲</title>
<style>
:root{
  --paper:#F7F5EF; --ink:#1E2A22; --ink2:#41524a; --muted:#8B9A90;
  --line:#DCE3DA; --card:#FFFFFF; --green:#1E4725; --green-l:#CFE3C6; --gold:#B08A2E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;font-size:15px;}
body{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));}

#top{position:sticky;top:0;z-index:20;background:rgba(247,245,239,.97);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;}
.row1{display:flex;align-items:center;gap:8px;}
#selSet{flex:1;font:inherit;font-size:14.5px;padding:9px 10px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink);}
.nav{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;
  color:var(--ink2);font-size:15px;display:flex;align-items:center;justify-content:center;}
.row2{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:2px;}
.row2::-webkit-scrollbar{display:none;}
.btn{flex:none;font:inherit;font-size:13px;padding:8px 13px;border-radius:10px;
  border:1px solid var(--line);background:#fff;color:var(--ink2);white-space:nowrap;}
.btn.on{background:var(--green);color:#fff;border-color:var(--green);}
.stat{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap;padding-right:2px;}
.stat b{color:var(--green);font-size:15px;}

#list{padding:10px 10px 0;}
.q{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;}
.q>.qh{display:flex;align-items:center;gap:8px;padding:13px 12px;font-weight:800;font-size:15px;
  color:var(--ink);}
.q>.qh .num{color:var(--green);}
.q>.qh .sub{font-weight:500;color:var(--muted);font-size:11.5px;margin-left:auto;}
.q>.qh .badge{font-size:10.5px;font-weight:800;color:#8A6A1A;background:#FBF1CF;border:1px solid #E7D493;
  border-radius:6px;padding:1px 5px;}
.b{border-top:1px solid #EEF1ED;}
.b>.bh{display:flex;align-items:center;gap:8px;padding:11px 12px 11px 16px;font-size:14px;
  font-weight:700;color:var(--green);background:#F6F8F1;}
.b>.bh .cnt{font-weight:500;color:var(--muted);font-size:11.5px;}
.b>.bh .arrow{margin-left:auto;color:var(--muted);font-size:12px;transition:transform .18s;}
.b.open>.bh .arrow{transform:rotate(90deg);}
.items{display:none;}
.b.open>.items{display:block;}
.it{display:flex;gap:9px;align-items:flex-start;padding:10px 12px 10px 16px;font-size:14px;
  line-height:1.65;color:var(--ink2);border-top:1px solid #F3F5F1;}
.it .dot{width:16px;height:16px;border-radius:50%;flex:none;margin-top:2px;
  border:1.5px solid #C9D2C8;background:#fff;}
.it .dot[data-s="1"]{background:#E3B341;border-color:#E3B341;}
.it .dot[data-s="2"]{background:#3F9D63;border-color:#3F9D63;}
.it .tx{flex:1;}
.blur .it .tx{filter:blur(6px);opacity:.55;}
.it.peek .tx{filter:none;opacity:1;}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:40px 10px;}

#sheet{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column;width:100%;max-width:100%;
  padding-top:calc(8px + env(safe-area-inset-top,0px));}
#sheet[hidden]{display:none;}
#sheet .sh-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);}
#shSet{flex:1 1 100%;font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;}
#shGrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;padding:12px 10px 40px;align-content:start;}
.sh-cell{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:11px;background:#fff;padding:9px 2px 11px;text-align:center;}
.sh-cell .no{font-size:10.5px;color:var(--muted);}
.sh-cell .k{font-size:20px;font-weight:800;color:var(--ink2);margin-top:2px;min-height:26px;}
.sh-cell.empty .k{color:#D2D9D1;}
.sh-cell.sel{outline:2px solid var(--gold);outline-offset:1px;}
.sh-cell.right{background:#EAF6EE;border-color:#8FCBA6;} .sh-cell.right .k{color:#2E8B57;}
.sh-cell.wrong{background:#FBECEA;border-color:#E0A6A0;} .sh-cell.wrong .k{color:#C0392B;}
#shRes{padding:0 12px 10px;font-size:14px;color:var(--ink2);}
#shRes b{font-size:20px;color:var(--green);}
</style>
</head>
<body>

<div id="top">
  <div class="row1">
    <button class="nav" id="prev">‹</button>
    <select id="selSet"></select>
    <button class="nav" id="next">›</button>
  </div>
  <div class="row2">
    <button class="btn" id="btnRecite">背诵模式</button>
    <button class="btn" id="btnExpand">展开全部</button>
    <button class="btn" id="btnCollapse">收起全部</button>
    <button class="btn" id="btnSheet">答题卡</button>
    <span class="stat">掌握 <b id="pg">0</b>/<span id="pgAll">0</span></span>
  </div>
</div>

<div id="list"></div>

<div id="sheet" hidden>
  <div class="sh-bar">
    <select id="shSet"></select>
    <button class="btn" id="shGrade">判分</button>
    <button class="btn" id="shClose">关闭</button>
  </div>
  <div id="shGrid"></div>
  <div id="shRes"></div>
</div>

<script>

作学习氛围"]}],"id":"柯虎1-35"},{"num":36,"title":"36 维纳的成败归因理论·高频","subject":"教心","blocks":[{"t":"（1）结合维纳的归因理论，分析材料中同学的归因方式。","items":["内部与外部、稳定与不稳定、可控与不可控","小雅的归因方式为努力归因，即内部、不稳定、可控的归因方式。","小斌的归因方式为能力归因，即内部、稳定、不可控的归因方式。","小辉的归因方式为任务难度归因，即外部、稳定、不可控的归因方式。"]},{"t":"（2）如果你是这位数学老师","items":["教师应引导学生进行客观归因","教师要帮助学生建立积极的自我概念","需要注意的是，不能将一切归因于努力"]}],"id":"柯虎1-36"}],"id":"柯虎1"},{"name":"柯虎2","questions":[{"num":31,"title":"31 陈鹤琴的“活教育”体系·中频","subject":"中教史","blocks":[{"t":"陈鹤琴是我国著名的儿童教育家","items":["“活教育”的目的论：“做人，做中国人，做现代中国人”是陈鹤琴“活教育”的目的论。","他对“现代中国人”提出五方面的要求要有健全的身体","“活教育”的课程论：“大自然、大社会都是活教材”是陈鹤琴对“活教育”的课程论的概括表述","“活教育”的教学论：教学原则为“做中教，做中学，做中求进步”。"]},{"t":"现代价值意义。","items":["活教育”思想的提出","“活教育”开创了对新型教育模式探索的先河。","“活教育”无论是在教学目的、教学内容、还是教学方法上","“活教育”确立了儿童在教学中的重要地位。","“活教育”明确了我国的教学目的和教学理念。"]}],"id":"柯虎2-31"},{"num":32,"title":"32 赫尔巴特的课程论","subject":"外教史","blocks":[{"t":"兴趣观是赫尔巴特设置课程的基本依据之一。","items":["课程内容的选择和编制应该与儿童的兴趣保持一致","经验类的兴趣包括经验的、审美的、思辨的","同情类的兴趣包括同情的、社会的、宗教的","社会的兴趣，应设历史、政治、法律；宗教的兴趣，应设神学等课程"]},{"t":"兴趣观是赫尔巴特确立教学形式阶段论的重要依据。","items":["赫尔巴特从心理学角度出发，将兴趣分为四阶段：注意、期待、探求、行动","与之对应，他提出了教学形式阶段理论：明了、联合、系统、方法","在教学的明了阶段","在教学的联合阶段，兴趣表现为期待，教师运用分析的教学方法："]}],"id":"柯虎2-32"},{"num":33,"title":"33 教原·高频","subject":"教原","blocks":[{"t":"（1）阅读材料","items":["课程建设以核心素养为导向","课程建设以核心素养为导向，是深化教育综合改革、加快推进教育现代化的需要"]},{"t":"（2）我国要培养的学生核心素养是什么？","items":["其中文化基础包括人文底蕴、科学精神；","自主发展包括学会学习、健康生活：","社会参与包括责任担当、实践创新"]},{"t":"（3）如何推动以核心素养为导向的课程建设？","items":["课程是为落实培养目标服务的","第二，以核心素养为导向选择课程内容","新课程方案要求明确提出“基于核心素养培养要求","第三，以核心素养为导向深化教学改革方式"]}],"id":"柯虎2-33"},{"num":34,"title":"34 教育热点问题“唯分数论”的观点","subject":"教原","blocks":[{"t":"（1）阅读上述材料","items":["分数的评价维度单一，只考察知识掌握，而不涵盖学生的全面发展。","总分的意义也是有限的，在日常学习过程中，总分与排名并不会给学生带来更好的学习。"]},{"t":"（2）《2022版义务教育课程方案》指出","items":["根据建构主义学习理论，学生是积极主动的学习者，他们通过参与和互动来构建知识","观察、记录和分析学习过程可以更好地了解学生的学习方式和策略","根据人本主义学习理论，学习是学生知情统一的过程","相关的学习动机维纳归因理论认为，引导学生正确归因可以进一步激发学生的学习动机"]}],"id":"柯虎2-34"},{"num":35,"title":"35 对于教师劳动的知识","subject":"教原","blocks":[{"t":"（1）从教师劳动特点的角度，评析材料中张老师的做法。","items":["首先，张老师的做法可以说“事出有因”","教师劳动具有复杂性，教育过程本身就是一个复杂的活动过程","但是，无论如何，张老师后续的处理方式是不合理的","教师劳动具有示范性、合作性和长期性"]},{"t":"（2）如果你是张老师，面对这种情况，你会怎么做？","items":["和家长积极沟通交流：培养孩子，是一项复杂的工作，也要求家长、学校的支持","通过改进教学组织形式的方式，促进教育过程中的公平","努力提高自我修养，同时关注自身的心理健康，以合适的方式疏解工作中的压力"]}],"id":"柯虎2-35"},{"num":36,"title":"36 行为主义教育理论·中频","subject":"教心","blocks":[{"t":"情境2中，教师的做法依据的是负惩罚","items":["材料中老师宣布取消小明去春游的活动资格，属于负惩罚的运用"]}],"id":"柯虎2-36"}],"id":"柯虎2"},{"name":"柯虎3","questions":[{"num":31,"title":"31 陶行知的教育实践及教育思想·高频","subject":"中教史","blocks":[{"t":"“生活教育”实践","items":["晓庄学校：陶行知为改造乡村培育乡村教师，在南京创办试验乡村师范学校，后改名晓庄学校。","山海工学团：陶行知在上海郊区大场创办山海工学团","“小先生制”：为了解决普及教育中师资缺乏、经费匮乏、女子教育困难等问题","育才学校：抗战期间"]},{"t":"“生活教育”理论体系“生活即教育”是生活教育理论的核心","items":["生活含有教育的意义。陶行知认为，“教育的根本意义是生活之变化”。","实际生活是教育的中心","生活决定教育，教育改造生活","“社会即学校”“生活教育”理论的另一主张是“社会即学校”","“社会含有学校的意味”。因为到处是生活，所以到处是教育，整个社会就像一个教育的场所。"]},{"t":"基于陶行知的教育思想和实践，我对教育家精神的理解：","items":["无私奉献精神","艰韧不拔的奋斗精神","一切从实际出发的求真务实精神","勇于开拓进取的创造精神","心有大我、至诚报国的理想信念；"]}],"id":"柯虎3-31"},{"num":32,"title":"32 进步教育运动发展历程·低频","subject":"外教史","blocks":[{"t":"成型（1918-1929年）","items":["自然发展的自由","3.形成研究阵地"]},{"t":"转折（1929-1943年）","items":["由于进步教育运动的专业化倾向，失去了公众的理解和支持","发生转向","分裂阵营。进步教育运动内部出现分化。","受到攻击"]},{"t":"衰落（1944-1957年）","items":["难以同步","自身局限","受到抨击","内部决裂","对儿童教育的反思：从传统教育忽视儿童转向发扬儿童中心论"]}],"id":"柯虎3-32"},{"num":33,"title":"33 科技与教育之间的关系","subject":"教原","blocks":[{"t":"（1）阐述科技与教育之间的关系。","items":["科学技术对教育具有重要的影响，表现在：","科学技术影响教育观念：教育的各种观念都会受到科学技术的影响。","科学技术影响教育结构：教育结构随着科技的发展发生了变化，受科学技术的影响。","科学技术影响教育的目的、内容和技术","教育为科学技术的发展提供知识积累：科学技术的发展需要相应的专业知识、能力作理论基础"]},{"t":"（2）阅读上述材料，分析人工智能可能为教育带来哪些挑战。","items":["过度关注个性化学习和考试成绩","影响教学质量人工智能会影响教学质量","导致不确定性和过度依赖技术一方面，人工智能在教育中的应用存在很多不确定的地方"]},{"t":"（3）结合所学知识","items":["利用人工智能变革学习方式人工智能为实现个性化学习和培养创新思维注入了新的活力","利用人工智能变革教学方式教育可利用人工智能改变传统讲授法等教学方式","利用人工智能变革教学内容教育工作者要明确人工智能进入课堂是为了拓宽教育的内容边界","利用人工智能变革评价方式教育工作者可借助人工智能技术评价的多元化、过程化手段","利用人工智能变革师生关系教育工作者应利用人工智能做到因材施教"]}],"id":"柯虎3-33"},{"num":34,"title":"34 对于迁移理论的理解","subject":"教原","blocks":[{"t":"（1）结合所学知识，请简述至少三种迁移理论。","items":["相同元素说：桑代克、伍德沃斯认为只有在原先的学习情境与新的学习情境有相同要素时","概括化理论：贾德认为迁移产生的关键在于学习者能够概括出两组活动之间的共同原理。","学习者的概括水平越高，迁移的可能性就越大","关系理论：格式塔心理学家重视学习者对学习情境内部关系的顿悟在迁移中的作用","认知结构迁移理论：奥苏伯尔认为"]},{"t":"（2）结合所学知识","items":["个体加工学习材料过程的相似性","已有经验的概括水平","学习态度和定势","年龄、智力水平。学习者的年龄、智力水平等方面都在不同程度上影响迁移的产生。","学习材料、情境的相似性。越是相似的材料、问题和情境，迁移越容易发生。"]},{"t":"（3）请说明，教师应如何促进学生的学习迁移？","items":["加强知识联系","重视学习策略","强调概括总结","培养迁移意识"]}],"id":"柯虎3-34"},{"num":35,"title":"35 教师对于德育的理解","subject":"教原","blocks":[{"t":"不正确。教师的教育观念只停留在知识的讲授上","items":["全方位德育指德育应当普遍存在于学校的一切教育活动之中"]},{"t":"针对张老师：改进德育授课方式。","items":["用生活案例讲概念：讲“责任”时","换种方式提问：将“你怎么理解责任”","加实践环节：让学生分组写“班级责任公约”"]},{"t":"针对王老师：挖掘数学学科的育人性。","items":["找数学里的思政点：讲统计时，让学生统计校园垃圾分类数据，聊“数据准了对环保有啥用”","写教案时明确小目标：比如教解方程"]}],"id":"柯虎3-35"},{"num":36,"title":"36 《教育心理学》","subject":"教心","blocks":[{"t":"加德纳多元智能理论指出","items":["加德纳多元智能理论指出"]}],"id":"柯虎3-36"}],"id":"柯虎3"},{"name":"柯虎4","questions":[{"num":31,"title":"31 《中国教育史》近代教育家蔡元培的…·高频","subject":"中教史","blocks":[{"t":"提出“五育并举”的教育方针","items":["在实利主义教育上，蔡元培主张“以人民生计为普通教育之中坚”，加强职业技能的培训；","在公民道德教育上","在美感教育上，蔡元培认为美育是世界观教育的主要途径，主张以美育代替宗教"]},{"t":"提出教育独立思想","items":["教育独立思想的内容包括：教育经费独立：政府指定固定的款项，专作教育经费，不能移作他用","教育独立思想的实践设想：蔡元培主张将全国分为若干个大学区","对教育独立思想的评价：教育活动必须接受社会的物质支持并传播一定的政治和社会价值体系"]},{"t":"蔡元培的教育实践。蔡元培的教育实践集中体现在对北京大学的改革上。","items":["抱定宗旨，改变校风。","第一，改变学生观念，让学生抱定为求学而来的宗旨；","第二，整顿教师队伍，延聘积学热心的教员；","第三，发展研究所，广积图书，引导师生研究兴趣；","贯彻“思想自由，兼容并包”的办学原则。"]}],"id":"柯虎4-31"},{"num":32,"title":"32 《外国教育史》卢梭的自然主义教育·高频","subject":"外教史","blocks":[{"t":"自然主义教育思想的实施","items":["卢梭的自然主义教育思想是教育界一场哥白尼式的革命"]}],"id":"柯虎4-32"},{"num":33,"title":"33 劳动教育的理解与重要意义","subject":"教原","blocks":[{"t":"（1）简述劳动教育的含义及开展劳动教育的必要性。","items":["开展劳动教育的必要性：大中小学实施劳动教育","实施劳动教育能更好地促进学生的全面发展。","教育与生产劳动相结合，是造就全面发展的人的基本途径","此外，劳动实践过程以及劳动成果所包含的美的因素，也有助于学生审美意识的培养","实施劳动教育能更好地促进社会发展。"]},{"t":"（2）从家庭、学校和社会三方面","items":["第一，对于学校来说：","劳动课程是学校实施劳动教育的重要途径","第二，对于家长来说：","引导家长树立劳动教育观念。","指导家长把劳动教育有机融入家庭日常生活。"]},{"t":"（3）如果你是某小学的劳动教师，你会如何设计一堂劳动课？","items":["劳动课程主题：收纳整理","课程目标：通过对学习用品、生活用品、厨房用具、家中杂物等物品的收纳整理","课程内容：对教室内学习用品和教学用品进行收纳整理","课程评价：总分100分"]}],"id":"柯虎4-33"},{"num":34,"title":"34 《教育心理学》记忆规律与记忆力·中频","subject":"教心","blocks":[{"t":"（1）结合材料和所学知识，阐述记忆的规律。","items":["记忆的时间和容量是有限的"]},{"t":"（2）结合认知策略，谈谈如何培养学生的记忆力？","items":["整体学习和部分学习相结合","掌握精加工策略","注意复习"]}],"id":"柯虎4-34"},{"num":35,"title":"35 《教育心理学》维果茨基的最近发展…·高频","subject":"教心","blocks":[{"t":"王老师所面临的困境是班上学生学业水平差异大","items":["（1）个性化教学：采用个性化教学方法","（2）分层教学：将学生分成不同层次的小组","（3）小组合作学习：鼓励学生之间进行小组合作学习","（4）利用混合教学资源：提供多样化的教学资源"]}],"id":"柯虎4-35"},{"num":36,"title":"36 《教育心理学》学习动机理论·高频","subject":"教心","blocks":[{"t":"（1）请用学习动机理论分析上述案例。","items":["韦纳的归因理论提出了“三维度六因素”，认为人们常将成败归因于能力、努力、任务难度和运气","自我价值理论关注人们如何评价自身价值，自我价值是认为自己是优秀、有能力个体的一种信念"]},{"t":"（2）面对这种情况，请你给王老师提几条建议。","items":["要帮助小米建立积极的自我概念","要合理设置任务","要关心、爱护小米"]}],"id":"柯虎4-36"}],"id":"柯虎4"},{"name":"柯虎5","questions":[{"num":31,"title":"31 《中国教育史》近代职业教育家黄炎…·中频","subject":"中教史","blocks":[{"t":"职业教育的方针","items":["社会化。第一","科学化。物质方面","人事方面：包括教育管理的组织、机构自身的建设等，都要运用科学管理方法"]},{"t":"职业教育作用","items":["黄炎培将职业教育的理论价值概括为：第一，谋个性之发展；第二，为个人谋生之准备；","第三，为个人服务社会之准备；第四，为国家及世界增进生产力之准备","对教育和社会的影响：“国无不教之民，民无不乐之生。”","对当时中国社会的作用：职业教育有助于解决中国最大、最急需解决的生计问题"]},{"t":"职业教育的地位","items":["一贯的。②整个的。③正统的。"]},{"t":"职业教育的目的。","items":["他将职业教育的目的概括为“使无业者有业，使有业者乐业”","“使无业者有业”","“使有业者乐业”"]},{"t":"职业教育的教学原则。","items":["职业教育必须遵循“手脑并用”“做学合一”的原则","作为中国近现代职业教育的先行者"]}],"id":"柯虎5-31"},{"num":32,"title":"32 外教史·高频","subject":"外教史","blocks":[{"t":"杜威的“教育无目的”内涵","items":["教育无目的论：杜威提出了“教育无目的论”","注重内在目的：所谓“教育无目的论”，并不是说教育真的没有目的","教育目的所具有的社会性：杜威强调以儿童为中心，注重儿童的经验，强调教育过程内的目的"]},{"t":"对当代教育的启示","items":["注重个体发展：杜威强调教育应以个体的内在需求和成长为出发点","强调教育的社会性：杜威认为教育目的具有社会性","平衡个体与社会：杜威在个体与社会之间寻求平衡，既重视个体的成长，又注重社会的发展","杜威的教育理念为我国教育体系提供了重要的启示"]}],"id":"柯虎5-32"},{"num":33,"title":"33 教育热点问题课改与“双减”政策·高频","subject":"教原","blocks":[{"t":"（1）简述德育、智育、体育的相互联系。","items":["德育与智育的关系。","正如苏格拉底所指出，美德即知识，道德可教","智育同样离不开德育","智育和体育的关系。","德育与体育的关系。"]},{"t":"（2）结合教育功能相关的知识点，谈谈“双减”政策的必要性。","items":["对个体的功能。","正向功能：减轻学生校内作业和校外培训负担有助于保障学生的身心健康","负向功能：过多的作业和培训可能导致学生焦虑、压力过大","对社会的功能。","显性功能和隐性功能。"]},{"t":"（3）结合材料","items":["课程结构：由分科为主向分科和综合课程结合转变","课程内容：由“难、繁、偏、旧”向注重兴趣和经验转变","课程实施：由死记硬背、机械训练向自主、合作、探究学习转变"]}],"id":"柯虎5-33"},{"num":34,"title":"34 教原·高频","subject":"教原","blocks":[{"t":"（1）根据上述材料概括过度炒作状元会带来至少哪4方面的不利…","items":["首先，对“状元”自身有不利影响","其次，对其他考生带来不利影响","再次，对教育资源分配造成不利影响","最后，对社会风气的不利影响：在社会上形成利益链条，媒体的渲染和炒作引起教育焦虑"]},{"t":"（2）2020年10月","items":["人本理论认为学习应促进学生知情方面的统一，不能只关注和评价学生的成绩","观察学习理论强调榜样的重要性","从学习动机的角度看评价改革的必要性。","不以学生中高考成绩为标准对学生进行奖励"]},{"t":"（3）假定你是一名班主任","items":["首先，我会更关注和发掘学生的学习兴趣，引导学生把关注点放在学习过程中，而不是放在…","其次，我会努力促进学生之间的合作，可以通过分组","最后，作为班主任，我会避免注重结果性评价，更多地关注过程性评价"]}],"id":"柯虎5-34"},{"num":35,"title":"35 教育实际问题","subject":"教原","blocks":[{"t":"（1）阅读上述案例","items":["材料中反映出由于学校超负荷招生且学生学习水平差异大","柯老师重点关注的问题只是如何在有限的时间内","柯老师过分重视优等生的成绩和升学率"]},{"t":"（2）假如你是柯老师，面对这种情况你会如何处理？","items":["确保每个学生都能获得公平的教育机会","采用小组学习和合作学习的组织形式","情感上激励、尊重、关爱学生","建立良好的师生关系"]}],"id":"柯虎5-35"},{"num":36,"title":"36 教心·高频","subject":"教心","blocks":[{"t":"（1）结合维果茨基的最近发展区理论","items":["前者由独立解决问题的能力而定","小A、小B和小C这三个学生处在不同的发展水平：","小A的能力在百分数问题的最近发展区之上，她不需要额外的帮助就能完成任务","小B的能力恰好处在最近发展区之内，在教师的帮助下，他成功地完成了学习任务"]},{"t":"（2）结合认知发展理论，谈谈如何在实际教学中促进学生发展？","items":["利用支架式教学：在学生的最近发展区内给学生提供适当的支持和指导","进行交互式教学：最近发展区内的相互作用实质是教师和学生共同协作的认知活动","开展合作学习：教师应当在课堂中引导学生有意识地模仿专家或同伴的行为来思考和完成具体任务"]}],"id":"柯虎5-36"}],"id":"柯虎5"},{"name":"柯虎6","questions":[{"num":31,"title":"31 《中国教育史》古代儒家教育著作《…·高频","subject":"中教史","blocks":[{"t":"为学之序：《中庸》提出“博学之","items":["《中庸》与《大学》互为阐发"]}],"id":"柯虎6-31"},{"num":32,"title":"32 《外国教育史》赫尔巴特的课程论·高频","subject":"外教史","blocks":[{"t":"经验、兴趣与课程","items":["经验的兴趣。经验的兴趣具体包括经验的、思辨的、审美的兴趣。经验的兴趣对应的课程：","自然、物理、化学、地理等","同情的兴趣。同情的兴趣具体包括同情的、社会的、宗教的兴趣；同情的兴趣对应的课程：","外国语、本国语等"]},{"t":"统觉与课程。","items":["相关原则：学校不同课程的安排应当相互影响、相互联系。","集中原则：在学校的所有课程中"]},{"t":"儿童发展与课程","items":["婴儿期：0~3岁，相当于人类历史的早期，对身体的养护大于一切；","幼儿期：4~8岁，相当于人类历史的想象期，教学内容以《荷马史诗》为主；","童年期：主要学习任务是学习数学；","青年期：主要学习任务是学习历史。"]},{"t":"赫尔巴特课程论的启示。","items":["根据兴趣设置广泛的课程内容","在进行课程改革的过程中，必须以间接经验的学习为主，以学生的直接经验为基础。","学校在进行课程安排时必须遵循相关与集中原则","以儿童发展以及文化发展为课程设计的基础，有的放矢地进行教育，提高课程内容的时效性。"]}],"id":"柯虎6-32"},{"num":33,"title":"33 教育对社会的作用·高频","subject":"教原","blocks":[{"t":"（1）从教育对社会的功能角度","items":["在经济方面：教育是使可能的劳动力转变为现实的劳动力的基本途径","在政治方面：教育通过传播一定的社会政治意识形态，完成年轻一代的政治社会化","在文化方面：教育可以传递文化、选择文化、发展文化。","在科技方面：教育可以为科学技术的发展提供知识积累"]},{"t":"（2）从学校教育变革的角度","items":["教育内容方面科技教育：加强科技教育","实践能力培养：注重培养学生的实践能力","教育方法方面项目化学习：推行项目化学习","跨学科教育：推动跨学科教育","教育评价方面综合评价体系：建立综合评价体系"]}],"id":"柯虎6-33"},{"num":34,"title":"34 教原·高频","subject":"教原","blocks":[{"t":"（1）根据上述材料的描述","items":["微观系统指的是个体活动和交往的直接环境","中间系统指的是各微观系统之间的联系","外层系统指的是学生并未直接参与却对学生的发展起到影响的系统","宏观系统指的是整个社会环境，包括主流价值观、文化、亚文化等"]}],"id":"柯虎6-34"},{"num":35,"title":"35 教原·高频","subject":"教原","blocks":[{"t":"（1）上述案例中体现了什么德育原则和方法？","items":["集体教育和个别教育相结合的原则：上述案例中王老师在一次照相活动中发现米琦的孤单","发挥积极因素和克服消极因素相结合的原则：该原则指在德育过程中","榜样示范法：所有同学都在拍照，只有米琦同学看到并捡起了被弄掉的文具盒","实践锻炼法：王老师发现米琦同学身上的闪光点"]},{"t":"（2）请你评析一下王老师的做法有什么效果？","items":["对米琦来说","对于班级里的其他同学来说","对王老师来说"]}],"id":"柯虎6-35"},{"num":36,"title":"36 教原·高频","subject":"教原","blocks":[{"t":"（1）依据艾里克森的发展理论","items":["案例中反映了青少年的自我同一性（或自我认同）发展问题"]},{"t":"（2）结合案例","items":["个体方面的因素包括个体的认知水平、人格特点等","在案例中，乙受父母设计的大学专业和职业规划影响，缺乏自主选择意识"]}],"id":"柯虎6-36"}],"id":"柯虎6"},{"name":"柯虎7","questions":[{"num":31,"title":"31 《中国教育史》近代癸卯学制·高频","subject":"中教史","blocks":[{"t":"新的部分","items":["学制的系统：仿照三级学制系统模式分为初等、中等、高等三级。","学制的目的：规划了义务教育的目标，确立了德、智、体三方面协调发展的“三育”模式。","学制内容：设置了众多实业学堂，以适应和推动近代资本主义工商业的发展，重视师范教育。","学制的组织管理：将分年课程规划、班级授课制作为基本的教学管理和教学组织形式。","对待儿童：要求尊重儿童个性，禁止体罚。"]},{"t":"旧的部分","items":["学制的指导思想：仍然是洋务教育“中学为体","学制的课程内容：“读经讲经”课比重大。","学制的等级性：进入学堂需要有保人，客观上限制了普通民众进入高等教育","学制的管理：规定了许多旨在维护封建统治秩序的禁令"]}],"id":"柯虎7-31"},{"num":32,"title":"32 《外国教育学》新教主义思潮·低频","subject":"教原","blocks":[{"t":"新传统主义教育思潮的主要观点","items":["要素主义教育思潮主张把人类文化的“共同要素”传给下一代","永恒主义教育主张教育的性质永恒不变","新托马斯主义教育是以托马斯主义为理论基础，大力主张宗教教育的一种教育理论","新传统主义教育思潮重视学科知识的系统性和内在联系"]},{"t":"新传统主义教育思潮对教育的影响主要体现在以下几个方面：","items":["把教育放在了更广泛的社会背景下进行研究","建立了教师的权威性","重视传统文化的传承"]}],"id":"柯虎7-32"},{"num":33,"title":"33 教学评价的相关知识·高频","subject":"教原","blocks":[{"t":"（1）阐述教学评价在教学中的作用。","items":["诊断教学问题：通过评价教学目标的达成程度","提供反馈信息：教学评价的结果可以为教师判定教学现状并及时作出调整提供大量的反馈信息","调控教学方向：如果教学评价的标准和内容能够全面地反映人才培养的需要","检验教学效果：在教学活动中"]},{"t":"（2）结合材料","items":["宏观层面：我国的教育目的在于培养德、智、体、美、劳全面发展的社会主义建设者和接班人","微观层面：","加剧人与人之间的竞争","千人一面，不利于学生独立个性的培养与身心的全面发展"]},{"t":"（3）为使教学评价正确发挥效用，现代教育应该怎么做？","items":["由过去主要评价教师的“教”向重点评价学生的“学”转变。","由过去注重“双基”和“学科能力”目标落实的评价","由注重教师对教材的使用和教学方法的选择的评价","注重发挥教学评价的发展性功能","构建新的课堂教学评价标准"]}],"id":"柯虎7-33"},{"num":34,"title":"34 教原·高频","subject":"教原","blocks":[{"t":"（1）阅读材料，概括心理健康问题带来的危害。","items":["信任对怀疑（0~1.5岁）：如果婴儿得到了较好的抚养并与父母建立了良好的亲子关系","自主对羞怯（1.5~3岁）：这一阶段的儿童开始表现出自我控制的需要与倾向","主动对内疚（3~6岁）：这一阶段儿童的活动范围逐渐超出家庭的圈子","如果无法顺利过渡的话，可能出现容易内疚的心理问题","在信任对怀疑、自主对羞怯、主动对内疚的阶段，儿童的成长环境主要是家庭"]}],"id":"柯虎7-34"},{"num":35,"title":"35 德育问题·高频","subject":"教原","blocks":[{"t":"（1）上述案例反映了德育中的什么问题？","items":["虽然学生在课堂上能够正确回答老师的问题"]},{"t":"（2）结合德育方法，谈谈如何尽量避免上述问题的出现？","items":["在实际德育过程中还应运用实践锻炼","实践锻炼法是有目的、有计划地组织学生参加各种实践活动","情感陶冶法是通过创设良好的环境","品德评价法是根据德育目标的要求","榜样示范法是以他人的高尚思想"]}],"id":"柯虎7-35"},{"num":36,"title":"36 《教育心理学》的道德行为发展理论·中频","subject":"教心","blocks":[{"t":"班杜拉提出观察学习的理论","items":["材料可见，平平通过母亲的教导，得知了抢夺别人的东西是不对的"]}],"id":"柯虎7-36"}],"id":"柯虎7"},{"id":"紫薯1","name":"紫薯1","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 新文化运动的教育变革","subject":"中教史","blocks":[{"t":"教育观念的变革","items":["个性化：强调个人价值，主张人人都有受教育机会","平民化：坚持庶民方向，打破贵贱上下与劳心劳力的阶级教育","实用化：注重生活能力培养，解决生计问题，学校与社会相联系","科学化：崇尚科学知识、科学方法与科学精神，三者相辅相成"]},{"t":"教育实践的变革","items":["废除读经，恢复民国初年教育宗旨：1919年恢复国民教育宗旨","教育普及有所发展：提倡义务教育，办学规模与学生数量迅速增加","改革学校教学内容：推行白话文和国语，中等教育注意实用","改革师范教育和大学：筹划六大师范区，蔡元培改革北大"]}],"id":"紫薯1-31"},{"num":32,"title":"32 中世纪大学的兴起与特征","subject":"外教史","blocks":[{"t":"中世纪大学的兴起","items":["12世纪前后在西欧城市兴起的新型教育机构","以萨莱诺、波隆那、巴黎、牛津和剑桥为代表，是近代大学直接源头"]},{"t":"产生原因","items":["政治经济条件：王权日渐强固，社会趋于稳定，手工业成为专门职业","阶级条件：新兴城市市民阶层提出新的政治、经济和文化要求","文化条件：古希腊、古罗马经典著作重新被发现，加强文化交流"]},{"t":"性质与体制","items":["性质：一种自治的教授和学习中心","目的：进行职业训练，培养社会所需要的专业人才","体制：按领导体制分为‘学生’大学和‘先生’大学两种"]},{"t":"课程、学位与教学","items":["课程：应社会需要分文、法、神、医四科","制度：已有学位制度，考试合格可得‘硕士’‘博士’学位","教学方法：演讲和辩论"]},{"t":"享有的特权","items":["大学自治，大学师生免税、免服兵役","设立特别法庭，处理大学师生与外人之间发生的诉讼","有集体迁移的自由，享有颁发教师资格证的特权"]}],"id":"紫薯1-32"},{"num":33,"title":"33 学校消亡论与AI时代教师角色","subject":"教原","blocks":[{"t":"‘学校消亡论’评析","items":["合理之处：AI拓宽学习渠道，可替代部分基础性教学工作","催生泛在学习、个性化学习等新型形态，反映技术驱动趋势","不可替代性：学校保障教育质量与公平，是学生社会化重要场所","核心功能：承担立德树人、价值引领、品德培育，AI无法替代"]},{"t":"教师角色的‘变’","items":["AI承担作业批改、学情统计等重复性事务，教师转向学习设计者","教师需熟练运用智能教育工具，聚焦创新思维、批判性思维培养"]},{"t":"教师角色的‘不变’","items":["教书育人的根本任务不变，立德树人始终是教师的主要职责","以情育人、以理服人的教育内核不变，情感关怀不可替代","因材施教原则不变，个性化指导难以由数据统计实现"]},{"t":"教师始终‘在场’的原因","items":["教育本质的要求：教育是人与人之间的精神交往与价值引导","学生成长的需要：品德养成、心理发展与社会性发展需针对性引导","时代发展的需要：信息纷繁、价值多元，更需教师做好价值引领"]}],"id":"紫薯1-33"},{"num":34,"title":"34 儿童认知发展规律与教学启示","subject":"教心","blocks":[{"t":"前运算阶段（3~6岁）","items":["思维具有不可逆性和刻板性，尚未获得守恒概念","能运用表象、语言或抽象符号代表自己经历过的事物","言语和概念快速发展，但概括性和一般性掌握不足","具有泛灵论倾向，出现集体独白现象","存在自我中心主义（集中化），思维刻板"]},{"t":"具体运算阶段（7岁以上）","items":["思维具有可逆性，已获得守恒概念","可进行逻辑思维，但仍需具体事物的支持","能理解原则和规则，但在实际生活中只能刻板遵守","思维具有可逆性，去自我中心主义（去集中化）","越来越以社会为中心，日益关注别人的看法"]},{"t":"对教学的启示","items":["遵循儿童认知发展的阶段性规律，切忌超前施教","依托同化与顺应机制，引导学生主动建构认知结构","创设认知冲突情境，通过平衡化推动认知发展"]}],"id":"紫薯1-34"},{"num":35,"title":"35 活动课程的特点与评价原则","subject":"教原","blocks":[{"t":"活动课程的主要特点","items":["以直接经验为核心载体，通过实践活动获取直接经验","突出学生的主体性，学生自主主导活动全流程","具有综合性与开放性，打破学科壁垒，强调知识综合运用","聚焦实践能力的培养，在真实情境中提升解决问题能力"]},{"t":"直接经验与间接经验相统一","items":["教学以间接经验为主，为实践提供理论支撑","教学以直接经验为辅，抽象知识需依托实践体验才能真正理解","将学科知识与实践活动有机结合，实现二者互补统一"]},{"t":"实施该课程的评价原则","items":["发展性评价原则：以促进学生全面发展为核心目的","过程性评价原则：覆盖活动全流程，关注参与度与思维成长","多元化评价原则：学生自评、组内互评、教师评价相结合"]}],"id":"紫薯1-35"},{"num":36,"title":"36 创造性培养的教学策略","subject":"教心","blocks":[{"t":"教学行为的积极价值","items":["营造安全、包容的课堂心理环境，消除创造性表达的心理顾虑","保护并强化学生的创造动机，通过激励性评价激发创新意愿","尊重学生的个性化思维成果，不设标准答案"]},{"t":"有效培养创造性的途径","items":["创设支持创造性发展的课堂环境：宽松、民主、包容","培养学生的创造性个性品质：保护好奇心与求知欲，鼓励独立思考","教授创造性思维训练策略：发散思维、头脑风暴、探究式学习"]}],"id":"紫薯1-36"}]},{"id":"紫薯2","name":"紫薯2","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 《学记》的教育贡献","subject":"中教史","blocks":[{"t":"教育管理方面的贡献","items":["重视大学开学和入学教育：天子率百官亲临学宫，定期视察学宫","重视学业的训诫仪式：使学生明确‘为日后从政而学习’的目的","重视考核：每隔一年考查一次，内容包括学业成绩和道德品行"]},{"t":"教育教学原则","items":["启发诱导：‘道而弗牵，强而弗抑，开而弗达’，倡导自主思考","系统概括预防性、及时施教、循序渐进、学习观摩等原则","长善救失、藏息相辅，揭示教学的普遍规律"]},{"t":"教学方法的阐述","items":["对讲解法、问答法、练习法等做出精当阐述","提醒教师结合学生情况灵活施教，切忌机械固化"]}],"id":"紫薯2-31"},{"num":32,"title":"32 新传统教育派教育思潮","subject":"外教史","blocks":[{"t":"要素主义教育","items":["1938年《要素主义者促进美国教育的纲领》发表，代表人物巴格莱","课程核心是人类文化遗产的共同要素，教材按知识逻辑系统编写","教学过程是严格的训练智慧的过程，学生必须刻苦和专心","教师应是整个教育过程中的权威人物"]},{"t":"永恒主义教育","items":["提倡复古，代表人物赫钦斯、艾德勒、利文斯通、阿兰","教育的性质永恒不变，主要目的是培养永恒的理性","永恒的古典学科应在学校课程中占中心地位","倡导实施全民的自由教育"]},{"t":"新托马斯主义教育","items":["提倡宗教教育，代表人物为法国神学家、教育家马利坦","教育应以宗教为基础，培养真正的基督教徒和有用的公民","学校课程应以基督教精神为基础，教育处于教会控制之下"]},{"t":"三种思潮的影响","items":["要素主义影响美国20世纪50—60年代教育改革，主张被纳入政策","永恒主义在教育理论上有影响，实践影响限于大学和上层知识界","新托马斯主义曾在欧美教会学校产生影响，但存在内在矛盾"]}],"id":"紫薯2-32"},{"num":33,"title":"33 立德树人与德育贯穿五育","subject":"教原","blocks":[{"t":"立德树人是根本任务的原因","items":["遵循人才成长规律：德是首要、是方向，德行统领才干","契合我国教育本质：坚持德育为先，坚守正确政治方向","顺应民族复兴需求：需要大量德才兼备、堪当重任的时代新人"]},{"t":"德育贯穿五育全过程","items":["核心内涵：德育并非独立的育人环节，应有机融入五育全过程","智育为德育提供认知基础，二者相辅相成","体育兼具强身与塑德价值，锤炼意志品质与拼搏精神","美育以美润德，提升审美与艺术修养，陶冶道德情操","劳动教育以劳树德，树立正确劳动观，涵养社会责任感"]},{"t":"当好‘大先生’的路径","items":["教师要有大情怀：以理想信念为根基，兼具家国情怀与教育情怀","教师要有大学问：扎实精深的专业学识是教书育人的基础","教师要有大格局：立足时代大局，拓宽育人视野，怀揣仁爱之心"]}],"id":"紫薯2-33"},{"num":34,"title":"34 功能固着与问题解决教学策略","subject":"教心","blocks":[{"t":"功能固着","items":["功能固着指个体熟知物品惯常用途后，很难想到它的其他用途","实验中被试只意识到钳子剪铁丝的常用功能，未想到可当重物使用"]},{"t":"培养问题解决能力的策略","items":["充分利用已有经验，形成知识结构体系","分析问题的构成，把握问题解决的规律","开展研究性学习，发挥学生的主动性","教授问题解决策略，灵活变换问题","允许学生大胆猜想，鼓励开展实践验证"]}],"id":"紫薯2-34"},{"num":35,"title":"35 家校合作问题与协同育人","subject":"教原","blocks":[{"t":"家校合作模式的问题","items":["沟通单向化：以学校单向输出要求为主，家长处于被动接收地位","地位不对等：话语权仍由学校掌握，缺乏平等的对话机制","合作浅层化：停留在事务传达、经验分享层面，未形成长效机制"]},{"t":"家校协同育人的意义","items":["统一育人方向：形成教育共识，避免教育导向相互冲突","整合育人资源：学校发挥专业教育优势，家庭发挥情感与生活优势","提升育人实效：学校提供专业指导，家庭反馈学生成长细节"]},{"t":"推动家校良性互动的措施","items":["构建系统化家长成长课程体系，帮助家长提升育人能力","建立平等双向的沟通机制，打破学校单向主导的沟通格局","丰富多元共育实践形式，推动家校资源互通、双向赋能"]}],"id":"紫薯2-35"},{"num":36,"title":"36 自我效能感低下的成因与辅导","subject":"教心","blocks":[{"t":"自我效能感低下的成因","items":["直接经验的影响：近期多次考试失利，导致自信心下降","情绪唤起的影响：一提到考试就紧张、沮丧，降低自我效能感","言语说服的影响：持续消极的自我言语暗示，造成自信心受挫"]},{"t":"提高自我效能感的辅导","items":["帮助学生建立清晰的自我认知，全面了解自己，避免妄自菲薄","为学生创设获得成功经验的机会，设置递进式学习任务","开展积极的言语劝说，给予正向鼓励与客观评价","提供针对性学业指导，帮助其查漏补缺，补齐学习短板"]}],"id":"紫薯2-36"}]},{"id":"紫薯3","name":"紫薯3","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 壬子癸丑学制的进步","subject":"中教史","blocks":[{"t":"两种学制概况","items":["癸卯学制：首个全国性法定学制系统，三段七级，总年限20~21年","壬子癸丑学制：首个资产阶级性质学制，三段四级，17~18年"]},{"t":"性质与学校系统","items":["性质：实现由封建性质向资产阶级性质学制的转变","取消奖励科举出身，废止保人制度，大学不设经科","学校系统：基础教育、高等教育、实业教育、师范教育均有雏形","中学废文、实分科，取消高等学堂，只设大学预科"]},{"t":"学制年限的缩短","items":["与癸卯学制相比缩短了3年，加快人才培养速度","有利于普通教育的普及和平民化发展"]},{"t":"课程内容和教学方法","items":["取消‘忠君’‘尊孔’课程，不再局限于传统经典著作","增加自然科学课程和生产技能训练，知识体系开放化、实用化","反对体罚，改进教学方法，使教育更加联系学生实际"]},{"t":"教育对象","items":["女子享有与男子平等的法定教育权","初等教育阶段男女同校，设立女子中学、女子师范学校"]}],"id":"紫薯3-31"},{"num":32,"title":"32 马克思人的全面发展学说","subject":"外教史","blocks":[{"t":"人的全面发展的内涵","items":["以人的劳动能力全面发展为基础，各方面和谐统一发展","包括社会关系、体力、智力、道德精神面貌、意志、情感、个性等"]},{"t":"社会条件与根本途径","items":["人的发展由整个社会的发展决定，大工业社会提供物质基础","教育与生产劳动相结合是实现人的全面发展的根本途径"]},{"t":"在教育学上的意义","items":["确立了科学的人的发展观","指明了人的全面发展的历史必然性","为我国教育目的的制定奠定了理论基础"]},{"t":"现实意义","items":["社会主义制度的建立为人的全面发展拓宽了道路","要依据我国的特点尽可能地促进人的全面发展","人的全面发展是构建社会主义和谐社会的基本内涵","追求人的全面发展与实现人的自由发展必须和谐统一"]}],"id":"紫薯3-32"},{"num":33,"title":"33 杜威内在目的论及其启示","subject":"教原","blocks":[{"t":"杜威的内在目的论","items":["教育不能脱离儿童身心发展规律、兴趣与内在需要预设外在目的","教育的根本目的在于立足儿童自身发展、促进其自然生长","评价：突出儿童主体地位，但片面强调内在目的，过于理想化"]},{"t":"确立教育目的的基本依据","items":["个体的身心发展规律：尊重受教育者的主体地位","社会发展的客观需要：受社会政治、经济、文化条件制约","科学的教育理论指引：以马克思主义人的全面发展学说为指导"]},{"t":"对教育改革的启示","items":["理论层面：坚持教育的内在目的与外在目的辩证统一","实践层面：遵循身心发展规律，优化教育教学与课程体系"]}],"id":"紫薯3-33"},{"num":34,"title":"34 观察学习理论及教学应用","subject":"教心","blocks":[{"t":"社会（观察）学习理论","items":["观察学习是一种间接学习，人类大多数行为通过观察习得","通过观察他人行为及其后果，获得符号表征与行为规则"]},{"t":"观察学习的基本过程","items":["注意过程：调节对示范活动的探索与知觉","保持过程：所观察的行为在记忆中以符号形式表征","复制过程：又称动作再现过程，即观察后的模仿过程","动机过程：因表现所观察到的行为而受到激励"]},{"t":"教师的教学应用","items":["发挥替代强化的作用，帮助学生树立良好的榜样","教授新行为、技能、态度和情感，并予以示范与强化","注意发挥自身的榜样作用，以好奇心与热情感染学生","监控学生习得行为的表现：去抑制、抑制、社会促进效应"]}],"id":"紫薯3-34"},{"num":35,"title":"35 教学评价功能与新时代评价观","subject":"教原","blocks":[{"t":"教学评价的功能","items":["诊断功能：多维度数据绘制全息画像，诊断优势与短板","导向功能：扭转‘唯分数论’倾向，引导重视综合素质","激励与促进功能：关注过程兴趣、态度、习惯，激发内驱力"]},{"t":"教学评价的类型","items":["按评价时间划分：以过程性评价为主，兼顾终结性评价","按评价主体划分：多元主体评价，教师、家长、学生协同参与"]},{"t":"新时代应树立的评价观","items":["评价目的聚焦发展：弱化甄别选拔，促进全面成长","评价内容综合多元：破除‘唯分数论’，兼顾学业与综合素质","评价方式动态立体：过程性与终结性、量化与质性相结合","评价主体多元协同：教师、家长、学生共同参与","评价手段科学精准：依托信息技术实现数据驱动评价"]}],"id":"紫薯3-35"},{"num":36,"title":"36 影响品德发展的外部因素","subject":"教心","blocks":[{"t":"外部因素及影响","items":["家庭环境：起奠基作用，小泽长期与父母分离，缺乏情感交流","学校环境：学风建设不足，学业压力过大，部分学生存在作弊","同伴影响：性格孤僻，人际交往匮乏，缺乏正面同伴榜样","社会文化影响：沉迷网络暴力、功利主义视频，规则意识缺失"]},{"t":"教育建议","items":["加强家庭教育指导，发挥家庭在品德发展中的奠基作用","创设积极的学校氛围，利用学校环境促进学生品德养成","引导社会健康接触，削弱不良社会文化的消极影响"]}],"id":"紫薯3-36"}]},{"id":"紫薯4","name":"紫薯4","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 蔡元培改革北京大学","subject":"中教史","blocks":[{"t":"抱定宗旨，改变校风","items":["改变学生观念：抱定宗旨、砥砺德行、敬爱师长","整顿教师队伍，延聘积学热心教员，聘任取“学诣”第一原则","发展研究所、广积图书，引导师生研究兴趣","砥砺德行，培养正当兴趣，倡导成立各种学会"]},{"t":"思想自由，兼容并包","items":["学术循“思想自由”原则、取“兼容并包”主义，各学问自由讲授","以“学诣”为主罗致各类学术人才，教师队伍流派纷呈"]},{"t":"教授治校，民主管理","items":["《大学令》确立教授治校、民主管理的校务管理原则","把推动学校发展的权利交给教授，由懂学术者管理学校"]},{"t":"学科与教学体制改革","items":["扩充文理，改变“轻学而重术”：工科停办、商科并入法科","沟通文理，废科设系，避免文、理科学生相互隔绝","改年级制为选科制（学分制），体现尚自然、展个性"]}],"id":"紫薯4-31"},{"num":32,"title":"32 阿斯蒂埃法与职业教育","subject":"外教史","blocks":[{"t":"《阿斯蒂埃法》主要内容","items":["国家设相关部门管理职业教育，中央由教育部设主管部门","每市镇设一所职业学校，经费由国家与雇主各负一半","18岁以下青年有免费职业教育义务，雇主保证每周4小时","内容包括补充初等教育的普通教育、职业基础学科、劳动学习"]},{"t":"对职业教育发展的启示","items":["提高重视程度：置于与普通教育同等重要地位，培养职业人才","完善专门管理与立法保障：设专门管理机构，健全法律法规","拓宽经费筹措渠道：统筹国家、企业及社会多方力量筹集资金","注重普通教育与职业教育融合：不忽视普通文化课程教学"]},{"t":"历史地位与影响","items":["使法国职业技术教育首次获得有组织形式，成国家管理事业","在法国历史上有“技术教育宪章”之称"]}],"id":"紫薯4-32"},{"num":33,"title":"33 教师职业与教育家精神","subject":"教原","blocks":[{"t":"教师职业的社会作用","items":["文化传承：传播优秀文化，承担传承、创新、发展文明使命","人才培养：落实立德树人根本任务，培养各类合格人才","社会赋能：推动教育高质量发展，促进教育公平与强国建设"]},{"t":"弘扬教育家精神的现实意义","items":["助力教育强国建设：引领教师队伍建设，夯实强国根基","落实立德树人：提供价值遵循，以德立身、以德施教","推动教育高质量发展：更新理念、创新育人方式，破解难题"]},{"t":"践行教育家精神：理想与道德","items":["筑牢心有大我、至诚报国的理想信念，立足岗位履职","恪守言为士则、行为世范的道德情操，以身作则、为人师表"]},{"t":"践行教育家精神：智慧·躬耕·仁爱·弘道","items":["涵养启智润心、因材施教的育人智慧，尊重个体差异","秉持勤学笃行、求是创新的躬耕态度，破解教学难题","厚植乐教爱生、甘于奉献的仁爱之心，做好成长引路人","树立胸怀天下、以文化人的弘道追求，夯实文化底色"]}],"id":"紫薯4-33"},{"num":34,"title":"34 行为矫正技术与强化策略","subject":"教心","blocks":[{"t":"教师运用的行为矫正技术","items":["正强化：当场肯定并公开表扬守纪学生，提高行为概率","负惩罚：取消违规学生当日课外活动资格，降低行为概率","代币制：小红花即代币，积分前五名可兑换小礼品"]},{"t":"强化效果减弱的原因","items":["强化物饱和：长期积分兑换礼品，学生对奖励失去兴趣","连续强化的局限：每次良好行为均奖励，强化效应易衰减","过度依赖外部动机：缺乏内在动机支持，行为稳定性差"]},{"t":"相应的改进策略","items":["丰富奖励形式：增加口头肯定、公开表彰与个性化奖励","调整强化程序：以变比强化或变时强化取代连续强化","激发内在动机：理解良好行为的内在价值，转向自我激励"]}],"id":"紫薯4-34"},{"num":35,"title":"35 作业的作用与变革趋势","subject":"教原","blocks":[{"t":"作业的作用","items":["对学生：巩固课堂所学，深化知识理解，掌握技能技巧","对教师：了解学生知识技能不足，提供针对性指导建议"]},{"t":"教师布置作业的要求","items":["控制作业总量，减轻学生负担，避免作业量过大","精选作业内容，提高作业质量，避免机械重复","设计分层作业：分必做、选做、自选题和错题纠正四部分","丰富作业类型：布置体育、劳动与社会实践作业"]},{"t":"中小学作业变革的主要趋势","items":["目标定位：从知识本位转向素养导向，对标核心素养","任务设计：从碎片化习题转向整体性、综合性作业","难度设计：从同质化转向个性化，分层、弹性、可选"]}],"id":"紫薯4-35"},{"num":36,"title":"36 加涅学习层次与图形概念","subject":"教心","blocks":[{"t":"加涅的学习层次分类","items":["学习分八类：信号、刺激—反应、连锁、言语联想、辨别、概念、规则、解决问题","每类学习都以前一层级的学习为基础，逐级递进"]},{"t":"学生学习中存在的问题","items":["辨别学习未达成：无法区分本质与非本质属性，受知觉干扰","概念学习未达成：仅机械记忆图形名称与定义，未掌握概念","未能迁移应用：只能识别典型例子，无法迁移到新情境"]},{"t":"促进概念学习的教学策略","items":["加强变式教学：提供颜色、大小、角度不同的图形卡","引导比较与归类：按边数分类，强化名称与结构属性联系","鼓励表达判断依据：说出“因为有三条边”，转隐性为显性","设计动手操作：拼摆、旋转、绘制图形，促进概念迁移"]},{"t":"对概念教学的启示","items":["概念掌握非一蹴而就，需评估任务难度与学习水平，分层递进","关注实际理解水平，勿被表面“会了”迷惑，引导深层思维"]}],"id":"紫薯4-36"}]},{"id":"紫薯5","name":"紫薯5","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 宋代科举制度的变化","subject":"中教史","blocks":[{"t":"科举制度概况","items":["以考试为主、举荐为辅，产生于隋、发展于唐，延续1300年","特点：个人自愿报名，集中考试，以文艺才能为标准，择优录取"]},{"t":"扩大科举名额","items":["唐进士科每榜录取人数少，宋增设特奏名，录取规模大幅扩大","扩张录取名额的同时，提高科举及第后的地位和待遇"]},{"t":"确定“三年一贡举”","items":["宋英宗治平三年正式确定科举考试时间为“三年一贡举”","三年一科举成为定制，延续至清末科举制度被废除"]},{"t":"殿试成为定制","items":["殿试始于唐武则天，宋太祖讲武殿亲自主持，遂为常制","形成州试（地方官）—省试（尚书省礼部）—殿试三级制度"]},{"t":"建立新制，防止科场作弊","items":["为维护考试客观性与公平性，防止作弊而建立新制度","内容有锁院制、别头试、糊名法、誊录制等"]}],"id":"紫薯5-31"},{"num":32,"title":"32 裴斯泰洛齐教育心理学化","subject":"外教史","blocks":[{"t":"教育心理学化的含义","items":["人的心理活动存在固有基本规律，教育要找到这种规律","把教育提高到科学水平，建立在心理活动规律的基础上"]},{"t":"教育心理学化的基本要求","items":["教育目的心理学化：置于儿童本性发展的自然法则基础上","教育内容心理学化：选择编制适合儿童学习心理规律","教学原则方法心理学化：遵循直观性与循序渐进原则","让儿童成为自己的教育者：调动能动性，使其懂得自我教育"]},{"t":"教育心理学化的实践体现","items":["系统落地于初等教育实践，形成要素教育理论与各科教学法","被誉为“现代初等学校各科教学法的奠基人”","要素教育：教育内容心理学化的载体，从最基本要素开始","各科教学法：从直观性、循序渐进出发构建学科教学法","教育与生产劳动相结合：斯坦兹孤儿院学习为主、手工劳动为辅"]}],"id":"紫薯5-32"},{"num":33,"title":"33 人口变化与教育资源配置","subject":"教原","blocks":[{"t":"人口变化对教育的影响","items":["人口数量制约教育发展的规模与速度，学龄人口减少致规模缩减","人口质量影响教育发展的质量，推动育人质量更高标准","人口结构制约教育的结构与布局，推动层级与区域调整"]},{"t":"教育高质量发展的契机","items":["少子化提升生均教育资源占有水平，更易推行小班化教学","老龄化催生多元学习需求，推动终身教育体系完善","区域人口增减分化推动教育资源统筹调整，优化教育布局"]},{"t":"优化教育资源配置的策略","items":["推进托幼一体化建设，化解幼儿园招生困难","做好长期教育资源配置规划，改造利用乡村闲置校舍","促进学段、区域之间教育资源共享，避免重复建设","推动教师校长交流轮岗，均衡配置城乡教师资源"]}],"id":"紫薯5-33"},{"num":34,"title":"34 韦纳归因理论与积极归因","subject":"教心","blocks":[{"t":"四类归因因素的特征","items":["能力：内部的、稳定的、不可控","努力：内部的、不稳定的、可控","任务难度：外部的、稳定的、不可控","运气：外部的、不稳定的、不可控"]},{"t":"不同归因产生的效果","items":["归因于能力：消极或羞耻，自我效能感低，预期再次失败、逃避","归因于努力：消极或愧疚，相信努力可改善，愿付出更多努力","归因于任务难度：挫败感，预判再次失败，逃避类似情境","归因于运气：沮丧或懊恼，难以形成成功预期，抱有侥幸心理"]},{"t":"促进学生积极归因的方式","items":["引导积极归因：多归因于努力，减少归因于能力、难度、运气","引导建立积极自我概念：任务难度与能力相适应，提升效能感","通过归因训练形成辩证归因模式，避免习得性无助"]}],"id":"紫薯5-34"},{"num":35,"title":"35 教学原则、评价与师生关系","subject":"教原","blocks":[{"t":"运用的教学原则","items":["因材施教：针对基础差异设计分层任务，有的放矢、扬长避短","启发性：不直接讲答案，以问题链引导思考、组织分组讨论"]},{"t":"体现的教学评价类型","items":["形成性评价：贯穿教学全程，即时反馈、优化学习","总结性评价：学期末全面评定学业成效，全面性、综合性"]},{"t":"新型良好师生关系","items":["民主平等：尊重个体差异，不以统一标准要求所有学生","尊师爱生：耐心引导、正向激励，学生主动请教、彼此关爱","教学相长：设问启发助力成长，学生生活分享丰富教学素材","心理相容：关系融洽、彼此信任，情感上相互接纳、产生共鸣"]}],"id":"紫薯5-35"},{"num":36,"title":"36 学习动机理论与作用","subject":"教心","blocks":[{"t":"案例体现的学习动机理论","items":["强化理论：正强化增强正确回答倾向，正向反馈减少挫败感","期望—价值理论：按成就动机类型匹配任务难度与评分标准","自我效能感理论：替代性经验与言语说服提升自我效能感","成败归因理论：成功归因于努力，失败归因于策略不当等"]},{"t":"学习动机的含义与作用","items":["含义：引起和维持学习活动、朝向学习目标的内部心理状态","引发作用：学习需要引发内驱力，唤起激动状态与学习行为","定向作用：以学习需要和期待为出发点，指向一定学习目标","维持作用：动机水平高者能持久坚持，低者缺乏稳定性","调节作用：调节学习行为的强度、时间和方向"]}],"id":"紫薯5-36"}]},{"id":"紫薯6","name":"紫薯6","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 宋代书院的特点","subject":"中教史","blocks":[{"t":"书院概况","items":["中国古代特有的教育组织形式，形成和兴盛于宋代","提倡自由讲学，集教学、研究、藏书及祭祀于一身","独立于官学与私学之外的重要教育机构"]},{"t":"教学层面的基本特点","items":["明确培养实用人才的教学目的，培养博学多闻、胸怀天下之人","教学内容以儒家经典为主，兼采理学家著作作为教材","教学与研究相结合，逐步形成讲会制度","教学方法注重集中讲授与自学讨论相结合","师生关系融洽、平等，倡导自由平等的交往"]},{"t":"管理层面的基本特点","items":["实行山长负责制，山长（洞主）全面负责组织管理与教学","生徒来源广泛且有选拔机制，以官学私学各级学生为主","制定明确学规，《白鹿洞书院揭示》为教学总方针","经费从自筹逐渐走向官助，出现官办与私办官助形式","书院发展呈现官学化倾向，逐步成为科举的附庸"]}],"id":"紫薯6-31"},{"num":32,"title":"32 赞科夫发展性教学理论","subject":"外教史","blocks":[{"t":"教育目的与一般发展","items":["教学要在学生的一般发展上取得尽可能大的效果","一般发展包括智力、道德情感、意志、身体发育等方面"]},{"t":"发展性教学的教学原则","items":["以高难度进行教学：难度限定在最近发展区内","以高速度进行教学：不断引导学生向前发展、启迪智慧","理论知识起主导作用：掌握课程知识结构，融会贯通","使学生理解学习过程：掌握获得知识的方法与途径","使班上全体学生（包括最差学生）获得一般发展"]},{"t":"评价","items":["首创苏联发展性教学的第一例完整体系，揭示因果联系","把新体系与传统教学论截然对立、以革新派自居，做法欠妥"]}],"id":"紫薯6-32"},{"num":33,"title":"33 课程目标的功能与落实","subject":"教原","blocks":[{"t":"课程目标的基本功能","items":["导向功能：为课程内容取舍、教学活动设计指明方向","调控功能：作为教学实施参照标准，及时调整策略与节奏","评价功能：检验课程实施效果，评判课程目标的达成度"]},{"t":"课程目标的设计依据","items":["立足学习者成长需求：遵循身心发展规律，尊重个体差异","顺应社会发展时代要求：兼顾通用核心素养与特色素养","契合学科知识育人逻辑：以学科知识体系为载体"]},{"t":"落实课程目标的路径","items":["细化目标层级，将课程目标转化为可操作的教学目标","转变教学方式，创设自主、合作、探究的学习情境","优化教学评价，实施过程性评价与多元化评价"]}],"id":"紫薯6-33"},{"num":34,"title":"34 元认知策略与培养方法","subject":"教心","blocks":[{"t":"元认知策略的含义","items":["强调学习者对认知过程的计划、监控和调节能力","包括计划策略、监控策略、调节策略三类，手册体现三者融合"]},{"t":"三种策略的具体体现","items":["计划策略：记录“我下周的学习计划”，设定目标与学习重点","监控策略：以“我掌握了什么”反思自检，识别已未掌握内容","调节策略：依据反思结果调整学习计划，修正不合理方式"]},{"t":"培养元认知能力的方法","items":["强化元认知意识，丰富元认知知识","指导目标设定与计划制订，提供分阶段学习建议","培养自我监控习惯：以学习日志、课堂回顾记录梳理","促进自我调节与自我评价：自我评价表、学习进展记录图"]}],"id":"紫薯6-34"},{"num":35,"title":"35 小组合作学习与讨论法","subject":"教原","blocks":[{"t":"合作学习流于形式的原因","items":["违背教师主导与学生主体相统一：缺乏分工指导与监控","违背掌握知识与发展能力相统一：讨论偏离主题，无实效"]},{"t":"运用讨论法的基本要求","items":["讨论前充分准备：明确主题任务，合理分组分工","讨论中引导调控：巡视纠偏，避免少数优等生垄断发言","讨论后总结提升：梳理讨论成果，深化对核心问题认知"]},{"t":"优化学习方式的路径","items":["锚定育人目标，杜绝形式主义，紧扣教学目标开展活动","融合多元学习方式：自主学习为基础、合作与探究为核心","完善配套支撑：分组规则、任务分工与过程性评价机制"]}],"id":"紫薯6-35"},{"num":36,"title":"36 学习策略与学习效果","subject":"教心","blocks":[{"t":"原有学习方式的问题","items":["死记硬背，对知识缺乏意义理解","不善于建构知识结构","缺乏对知识的主动加工与应用，遗忘快、迁移困难"]},{"t":"三种学习策略及作用","items":["复述策略：用自己的语言复述或向同学讲解，推动长时记忆","组织策略：借助图表、知识框架梳理笔记，提高提取效率","精细加工策略：用类比法结合生活实例，促进深层理解"]},{"t":"学习策略的提升机制","items":["优化认知编码，改善知识存储，减少遗忘","提高知识的迁移能力与应用能力，摆脱情境依赖"]}],"id":"紫薯6-36"}]},{"id":"紫薯7","name":"紫薯7","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 隋唐教育管理制度","subject":"中教史","blocks":[{"t":"改革背景","items":["隋唐是我国封建社会高度繁荣的阶段","为加强对教育事业的统一管理，选拔符合统治阶级需求的人才","在中央教育管理机构与官学内部管理制度上进行系统性改革"]},{"t":"中央教育管理机构的演变","items":["隋文帝设国子寺，内设国子祭酒，首次设立专门管理教育的政府机构","国子寺脱离太常寺独立发展并改称国子学，隋炀帝时改称国子监","唐初精简行政机构，国子学附设于太常寺，管理国子学、太学、四门学","贞观元年唐太宗令国子学脱离太常寺改称国子监，成为与太常寺平行的独立机构","国子监既是中央教育行政机构又是最高学府，标志学校管理走向专门化"]},{"t":"入学与学礼制度","items":["实行等级入学制度：贵族、官僚子弟享有优先入学特权；广文生不受年龄限制","确立定期学礼制度：束脩之礼、国学释奠礼、贡士谒见及使者观礼","学礼活动使学生受崇儒尊师、登科从政教育，起到思想熏陶作用"]},{"t":"教学、考核与休假制度","items":["设定各类学校教学制度：儒经与律令各有侧重，课程规定修业期限","建立系列化考核制度：旬试、月试、季试等，形成完整考试体系","严格执行惩罚制度：国子监主簿执行学规，惩罚不率师教、学业无成者","制定合理休假制度：旬假、田假、授衣假，兼顾学生身心发展需求"]}],"id":"紫薯7-31"},{"num":32,"title":"32 福禄培尔与蒙台梭利","subject":"外教史","blocks":[{"t":"两位幼儿教育家","items":["福禄培尔：19世纪德国教育家，幼儿园创立者，被誉为“幼儿教育之父”","蒙台梭利：20世纪意大利幼儿教育家，创办“儿童之家”，形成蒙台梭利教学法"]},{"t":"相同点","items":["在儿童地位上都反对传统教育对儿童身心的束缚和压迫，主张以儿童为本位","在理论与实践上都建立了幼儿教育理论体系和专门的幼儿教育机构","在影响上都对世界各国幼儿教育的发展产生了深远影响"]},{"t":"不同点","items":["教育方法：福禄培尔主张自我活动与游戏；蒙台梭利以“工作”结合“纪律”与“自由”","组织形式：福禄培尔主张集体教学与集体游戏；蒙台梭利主张个别活动","教育内容：福禄培尔以活动与游戏为主的课程；蒙台梭利重感官训练与读写算","教师作用：福禄培尔主张教师为引导者、组织者；蒙台梭利主张为观察者、指导者"]}],"id":"紫薯7-32"},{"num":33,"title":"33 制度化教育与个体发展","subject":"教原","blocks":[{"t":"教育对个体的双重功能","items":["正向个体功能：教育积极促进个体发展，学校制度化生活帮助儿童适应社会","负向个体功能：制度化教育割裂学习生活与本真生活，压抑儿童天性"]},{"t":"功能性质的判定","items":["对儿童天性的压抑属于非预期的负向隐性功能","个体社会化则属于教育的正向显性功能"]},{"t":"制度化教育的优势与局限","items":["制度化教育指由专门的教育人员、机构及其运行机制所构成的教育形态","优势：组织性与系统性较强，利于提高教学效率、保障教学质量","局限：高度制度化、规范化易压抑学生天性，造成儿童人格分裂"]},{"t":"教育制度改进建议","items":["尊重儿童主体地位与本真生活，避免制度对儿童生活强制改造","构建开放型教育系统，推动办学体制多样化，推行学分制、选课制","兼顾制度化与非制度化教育，打通学校、家庭、社会教育壁垒，面向终身教育"]}],"id":"紫薯7-33"},{"num":34,"title":"34 操作技能的形成与指导","subject":"教心","blocks":[{"t":"技能类型判定","items":["骑自行车属于操作技能","指导与示范属于操作技能形成的认知阶段"]},{"t":"操作技能的特点","items":["活动对象是物质的、具体的客体或肌肉，具有客观性","动作执行通过外显的肌肉运动实现，具有外显性","各动作不能合并、省略，必须完整展开，具有展开性"]},{"t":"认知阶段及其教学要求","items":["指导者需帮助学习者理解操作技能、明确学习任务、形成作业期望与学习策略","掌握相关知识：先讲解骑行安全知识与自行车构造，奠定知识基础","明确练习目的和要求：介绍日常通行路段路况，明了实际要求","形成正确的动作映象：父亲示范启动、平衡、转弯、停车等动作","获得一定的学习策略：边示范边讲解平衡技巧，掌握关键动作要领"]}],"id":"紫薯7-34"},{"num":35,"title":"35 课例设计特点与教师素养","subject":"教原","blocks":[{"t":"课例设计的特点","items":["生活性：课例贴近学生生活实际，依托已有生活经验开展教学","综合性：将数学知识与中华优秀传统文化、十二生肖文化相融合","探究性：设计开放性问题，激发学生思考、探索与质疑","趣味性：营造轻松活跃的课堂氛围，调动学生学习兴趣"]},{"t":"教学方法：讨论法","items":["讨论法是学生在教师指导下为解决某问题而探讨、评析，以明辨是非、获取真知","案例中教师以属相推算年龄问题引发思考，学生相互质疑争辩、集体讨论深化理解"]},{"t":"新时代教师应具备的素养","items":["高尚的师德：热爱教育事业、关爱学生、严于律己","宽厚的文化素养：广博的文化知识与深厚的学科底蕴","专门的教育素养：教育理论素养、教育能力素养、教育研究素养"]}],"id":"紫薯7-35"},{"num":36,"title":"36 学习迁移类型与促进","subject":"教心","blocks":[{"t":"案例体现的学习迁移类型","items":["顺向迁移：先前学习对后继学习的影响，物理“平衡”概念影响化学、生物学习","正迁移：一种学习对另一种学习的积极促进作用，借平衡逻辑理解溶解平衡","负迁移：一种学习对另一种学习的消极阻碍作用，机械套用静态思维造成认知偏差","一般迁移：将习得的一般原理、思维方法迁移到其他具体学习情境"]},{"t":"影响学习迁移的主要因素","items":["学习材料的相似性：共同要素越多越易迁移，静态与动态平衡存在本质差异","原有经验的概括水平：概括水平越高，迁移的适用范围越广","心理定势的作用：定势对学习迁移兼具促进与阻碍的双重作用","教师的教学指导：清晰的教学引导能有效促进学习迁移"]},{"t":"促进有效迁移的教学措施","items":["整合学科内容：合理编排教学内容，关注学科间的横向关联与共通规律","加强新旧知识联系：通过课堂提问、适度引导，搭建新旧知识的联结桥梁","强调概括总结：启发学生自主概括原理，厘清概念内涵与适用边界","重视学习策略，培养迁移意识：引导学生反思知识适用场景，主动迁移"]}],"id":"紫薯7-36"}]},{"id":"紫薯8","name":"紫薯8","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 儒家与墨家教育思想","subject":"中教史","blocks":[{"t":"儒家学派概述","items":["儒家是春秋战国时期的重要学派，创始人为孔子（孔丘）","孔子之后儒家分化为思孟学派与荀子学派两大分支","思孟学派继承仁学思想，形成重视人的主观能动性的教育观","荀子学派倡导礼治、维护等级秩序，提出“性恶论”并以外铄论为理论基础"]},{"t":"墨家学派概述","items":["墨家与儒家相对立，由墨子（墨翟）创立，代表小生产者利益","反对贵族特权，追求社会平等，讲求社会实效","教育上重视经验与实践，注重逻辑思维训练，充分肯定科学技术知识的价值"]},{"t":"墨家教育方法的特点","items":["主动：反对儒家“叩则鸣，不叩则不鸣”的被动施教，主张“强说人”的主动精神","创造：批评儒家“述而不作”，主张“述作结合”，既传承优秀文化又创造新事物","实践：提出“合其志功而观焉”，结合动机与效果评价行为，重生产、军事、科技实践","量力：最早明确提出“量力”，一是学生精力有限不能同时学习几方面，二是量力而教"]}],"id":"紫薯8-31"},{"num":32,"title":"32 赫尔巴特的兴趣观","subject":"外教史","blocks":[{"t":"赫尔巴特及其理论体系","items":["19世纪德国哲学家、心理学家、教育家，被誉为“现代教育学之父”","提出把教育学建成一门独立学科的设想，构建了较为完整的教育理论体系","教育代表作主要有《普通教育学》《教育学讲授纲要》"]},{"t":"兴趣观","items":["兴趣的含义：将思维的对象保留在意识中的内心力量，是智力活动的特性，具有道德的力量","兴趣的地位：既是统觉的前提条件，也是课程与教学的基本依据","兴趣类型：经验兴趣含经验、思辨、审美；同情兴趣含同情、社会、宗教","兴趣活动的过程：划分为注意、期待、要求和行动四个阶段"]},{"t":"兴趣观在教育理论体系中的作用","items":["教育目的论：提出可能的目的与必要的目的，培养多方面兴趣是直接的、近期的目的","课程理论：课程内容选择与儿童经验和兴趣相一致，据经验兴趣与同情兴趣分别设置课程","教学形式阶段理论：兴趣观是重要依据，注意—明了、期待—联想、要求—系统、行动—方法"]}],"id":"紫薯8-32"},{"num":33,"title":"33 教师专业成长与队伍建设","subject":"教原","blocks":[{"t":"教师专业成长阶段判定","items":["材料中的“我”处于教师专业成长的关注情境阶段","福勒和布朗将教师专业成长划分为关注生存、关注情境、关注学生三个阶段","关注情境阶段的教师已平稳度过岗位适应期，注意力转向教学质量与学生学业成绩"]},{"t":"判断依据","items":["已有六年教学经验，能快速融入新学校人际环境，不存在岗位生存的焦虑","主要精力集中于打磨教学内容、提升班级成绩、推进教研，符合关注情境阶段特征","对学困生仅采用统一大班补差，未关注个体差异，尚未进入关注学生阶段"]},{"t":"教师队伍建设存在的主要问题","items":["教研活动难以落地，同伴互助氛围薄弱，尚未形成常态化的教研合作机制","在职培训针对性不足、实效性偏弱，多为师德、安全类通识内容，缺少学科专项研修","师资配置紧张，教师教学负担过重，缺少时间开展教学反思与自主研修","轮岗教师缺少适配支持，教学方法出现“水土不服”，专业价值未充分发挥"]},{"t":"教育公平与教师队伍建设","items":["教育公平包含起点公平、过程公平、结果公平三个层次，加强教师队伍建设是重要抓手","保障起点公平：优化城乡与校际师资配置，健全交流轮岗机制，补齐乡村师资短板","推进过程公平：提升乡村教师整体专业素养，为乡村学生提供高质量、适配学情的教学","夯实结果公平：整体提升乡村学校育人质量，助力各类学生充分发展"]}],"id":"紫薯8-33"},{"num":34,"title":"34 科尔伯格与道德两难","subject":"教心","blocks":[{"t":"材料观点的阶段判定","items":["习俗水平·维护权威或秩序的定向：以维护社会秩序为核心，依据是否符合社会秩序准则判断对错","后习俗水平·普遍道德原则的定向：是非善恶有独立价值标准，法律与生命冲突时坚守生命至上","后习俗水平·社会契约的定向：契约和法律并非绝对，法律不能实现公平正义时理应修正"]},{"t":"科尔伯格道德发展理论要点","items":["将个体道德发展划分为前习俗、习俗、后习俗三个水平，每个水平包含两个阶段","后习俗水平是道德发展的最高阶段，道德原则已内化为学生的自觉追求"]},{"t":"道德两难故事促进认知发展的办法","items":["设置启发性问题，制造道德认知冲突，引导反思道德选择背后的依据","组织小组讨论，促进观点交流碰撞，在对比多元观点中提升道德判断水平","创设开放包容的课堂氛围，尊重学生独立思考，发展辩证思维与批判意识","结合生活实际开展德育，赋予故事现实意义，实现知行合一与道德认知内化"]}],"id":"紫薯8-34"},{"num":35,"title":"35 备课要求与立德树人","subject":"教原","blocks":[{"t":"备课工作的基本要求","items":["备教材（钻研教学内容）：确立三维教学目标，厘清重难点，兼顾知识教学与价值育人","备学生（深入了解学生）：摸清学情、家庭情况、生活经历与认知特点，因材施教","备教法（合理设计教学）：统筹课堂安排，预设教学情境，融入多元育人元素"]},{"t":"掌握知识与培养思想品德相统一","items":["掌握知识是培养学生思想品德的基础，依托学科内容开展德育，避免空洞说教","思想品德的提高能够推动知识学习，调动学生学习主动性","教学必须坚持知识传授与思想品德教育相统一，实现教书与育人的有机统一"]},{"t":"学科教学落实立德树人的路径","items":["深挖学科内在德育元素，将价值引领融入知识讲授过程","整合多元育人资源，融入中华优秀传统文化、规则意识、哲思启迪与科学精神","立足学情设计德育活动，结合学生生活经历与认知特点创设教学情境","树立全人育人理念，摒弃知识本位思维，将立德树人贯穿教学全过程"]}],"id":"紫薯8-35"},{"num":36,"title":"36 观察学习与自我效能感","subject":"教心","blocks":[{"t":"观察学习的过程机制","items":["注意过程：成绩优异且乐于助人的小宇成为同桌，小乐观察到其积极参与、分享思路","保持过程：将观察到的解题方法与学习策略以表象或语言表征形式储存在头脑中","复制过程：在同伴帮助与教师引导下模仿学习方式，独立讲解练习题并转化为实际行动","动机过程：榜样获教师肯定产生替代性强化，自身获表扬与掌声产生直接强化"]},{"t":"自我效能感的提升路径","items":["直接经验：从难度较低的习题入手，小测取得进步并独立讲解，打破“我不行”定势","替代经验：安排优秀且乐于助人的同桌近距离示范，打破“我数学就是差”的固化认知","言语说服：持续鼓励，引导参与小组讨论并给予积极反馈，帮助树立学习信心"]},{"t":"促进积极学习的三条教学策略","items":["树立适宜榜样，发挥观察学习的促进作用，激发学生模仿意愿与学习动力","综合运用多种强化手段：利用替代性强化肯定榜样，及时直接强化正向行为","多措并举增强自我效能感：设计分层任务积累成功体验，设置合理目标并持续鼓励"]}],"id":"紫薯8-36"}]}];

const $ = id => document.getElementById(id);
const selSet = $("selSet"), listEl = $("list");

function curSet(){ return SETS[ST.cur] || SETS[0]; }
function setKey(){ return curSet().name; }

function fillSets(){
  selSet.innerHTML = "";
  const groups = {};
  SETS.forEach((s, i) => {
    const brand = s.brand || (s.name.indexOf("柯虎") === 0 ? "柯虎" : s.name.indexOf("紫薯") === 0 ? "紫薯" : "迪雯多");
    (groups[brand] = groups[brand] || []).push([i, s]);
  });
  Object.keys(groups).forEach(b => {
    const og = document.createElement("optgroup");
    og.label = b;
    groups[b].forEach(([i, s]) => {
      const o = document.createElement("option");
      o.value = i; o.textContent = s.name + "（" + s.questions.length + "）";
      og.appendChild(o);
    });
    selSet.appendChild(og);
  });
  selSet.value = ST.cur;
}
selSet.onchange = () => { ST.cur = +selSet.value; save(); render(); };

function render(){
  const set = curSet();
  listEl.innerHTML = "";
  let total = 0, got = 0;
  set.questions.forEach(q => {
    const qEl = document.createElement("div");
    qEl.className = "q";
    const qh = document.createElement("div");
    qh.className = "qh";
    const hot = HOT[q.id] && HOT[q.id][0];
    qh.innerHTML = '<span class="num">' + q.num + '</span><span>' + q.title.replace(/^\d+\s*/, '') + '</span>'
      + (hot ? '<span class="badge">★' + hot[1] + '</span>' : '')
      + '<span class="sub">' + q.subject + ' · ' + q.blocks.length + '块</span>';
    qEl.appendChild(qh);

    q.blocks.forEach((b, bi) => {
      const bEl = document.createElement("div");
      bEl.className = "b";
      const bd = ST.collapsed[q.id + "-" + bi] === false ? "open" : "";
      bEl.className = "b " + bd;
      const bh = document.createElement("div");
      bh.className = "bh";
      bh.innerHTML = '<span>' + b.t + '</span><span class="cnt">' + b.items.length + '</span><span class="arrow">▸</span>';
      bh.onclick = () => {
        const nowOpen = !bEl.classList.contains("open");
        bEl.classList.toggle("open", nowOpen);
        ST.collapsed[q.id + "-" + bi] = !nowOpen;
        save();
      };
      bEl.appendChild(bh);

      const items = document.createElement("div");
      items.className = "items";
      b.items.forEach((it, ii) => {
        const id = q.id + "-" + bi + "-" + ii;
        total++;
        if ((ST.status[id] || 0) === 2) got++;
        const itEl = document.createElement("div");
        itEl.className = "it";
        itEl.dataset.id = id;
        itEl.innerHTML = '<span class="dot" data-s="' + (ST.status[id] || 0) + '"></span><span class="tx">' + it + '</span>';
        itEl.querySelector(".dot").onclick = e => {
          e.stopPropagation();
          ST.status[id] = ((ST.status[id] || 0) + 1) % 3;
          itEl.querySelector(".dot").dataset.s = ST.status[id];
          save(); updateStat();
        };
        itEl.querySelector(".tx").onclick = e => { e.stopPropagation(); if (recite) itEl.classList.toggle("peek"); };
        items.appendChild(itEl);
      });
      bEl.appendChild(items);
      qEl.appendChild(bEl);
    });
    listEl.appendChild(qEl);
  });
  $("pg").textContent = got; $("pgAll").textContent = total;
  updateStat();
  if (recite) listEl.classList.add("blur");
}

function updateStat(){
  let total = 0, got = 0;
  curSet().questions.forEach(q => q.blocks.forEach(b => b.items.forEach(() => { total++; })));
  listEl.querySelectorAll(".it .dot").forEach(d => { if (d.dataset.s === "2") got++; });
  $("pg").textContent = got; $("pgAll").textContent = total || $("pgAll").textContent;
}

$("prev").onclick = () => { ST.cur = Math.max(0, ST.cur - 1); selSet.value = ST.cur; save(); render(); };
$("next").onclick = () => { ST.cur = Math.min(SETS.length - 1, ST.cur + 1); selSet.value = ST.cur; save(); render(); };
$("btnRecite").onclick = e => {
  recite = !recite;
  e.target.classList.toggle("on", recite);
  listEl.classList.toggle("blur", recite);
  if (!recite) listEl.querySelectorAll(".peek").forEach(x => x.classList.remove("peek"));
};
$("btnExpand").onclick = () => { listEl.querySelectorAll(".b").forEach(b => b.classList.add("open")); };
$("btnCollapse").onclick = () => { listEl.querySelectorAll(".b").forEach(b => b.classList.remove("open")); };

        const cur = d[i] || "";
        d[i] = order[(order.indexOf(cur) + 1) % 5];
        if (!d[i]) delete d[i];
      } else SH.sel = i;
      save(); drawSheet();
    };
    shGrid.appendChild(c);
  }
  const answered = Object.keys(d).length;
  if (ST.gradeMsg && ST.gradeMsg[SH.set]) shRes.innerHTML = ST.gradeMsg[SH.set];
  else shRes.innerHTML = "已填 " + answered + " / 30";
}
$("btnSheet").onclick = () => { sheetEl.hidden = false; drawSheet(); };
$("shClose").onclick = () => { sheetEl.hidden = true; };
$("shGrade").onclick = () => {
  const d = sheetData(), key = SHEET[SH.set] || "";
  ST.graded[SH.set] = true; save();
  const nums = Object.keys(d).map(Number).sort((a,b)=>a-b);
  const wrong = nums.filter(n => d[n] !== key[n-1]);
  const right = nums.length - wrong.length;
  const msg = "得分 <b>" + (right*2) + "</b> / 60　对 " + right + " · 错 " + wrong.length +
    (wrong.length ? "<br>红题号：" + wrong.join("、") : "");
  ST.gradeMsg = ST.gradeMsg || {};
  ST.gradeMsg[SH.set] = msg;
  shRes.innerHTML = msg;
  drawSheet();
};

fillSets();
render();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
