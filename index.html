校全面推进五育并举改革","d":"**该校全面推进五育并举改革，契合新时代基础教育改革的方向，抓住了全面育人的核心要求，具有重要的现实必要性与正确性。但改革过程中出现文化课成绩波动、家长质疑的困境，折射出深层的认知与实践问题。"},{"t":"突破困境的实践路径：遵循全面发展教育的内部关系规律","d":"**遵循全面发展教育的内部关系规律，该校需要从协同、融合、沟通、提质四个维度系统推进，实现五育的良性互动。1.。"},{"t":"把握整体性规律，构建五育协同育人体系","d":"五育协同育人体系。打破“各育分开、各自为政”的思维，推动五育相互渗透、相互支撑。将德育融入学科教学，实现课程思政；将美育融入知识学习，提升思维的创造性；将体育锻炼与学习节奏结合，提升学习精力与效率；将劳动教育与知识应用结合，提升实践能力。通过协同融合，让五育共同服务于学生的能力提升，形成“五育共进、相互赋能”的格局，从长期看反而会促进学业质量的深层提升。1.。"},{"t":"挖掘相互促进价值，破解“对立”认知误区","d":"解“对立”认知误区。主动向家长与社会传递五育的内在逻辑：体育能够增强体质、提升注意力持久性与思维活力，为智育提供身体支撑；美育能够培养想象力、创造力与审美感知，提升学科学习的思维品质；劳动教育能够促进知识的应用与内化，深化对知识的理解；德育能够激发学习动机与责任意识，提供学习的精神动力。五育不仅不影响智育，反而会从不同维度支撑智育的高质量发展。1.。"},{"t":"优化实践质量，避免形式化提升育人实效","d":"式化提升育人实效。破解形式化困境，让各育真正落地生根：德育要贴近学生生活，在日常管理、班级活动中渗透，而非空泛宣讲；体育要保障锻炼实效，提升运动技能与体质；美育要强化动手创作与审美体验，而非被动观看；劳动教育要结合真实劳动场景，培养劳动能力与观念。通过提升各育的质量，真正实现全面育人，让家长看到学生综合能力的提升，化解焦虑。1.加强家校协同，凝聚改革共识合力。建立系统的家校沟通机制，通过家长开放日、学生成长展示、理念宣讲等方式，让家长直观看到学生在五育中的成长与进步，理解全面发展对学生终身发展的价值。同时搭建家校共育平台，引导家长参与五育实践，争取家长的理解与支持，形成育人合力，共同推进改革。"}]},{"t":"（3）阐释立德树人背景下五育并举与德育为先的内在关系","items":[{"t":"五育并举与德育为先的内在关系","d":"内在关系，论述中小学落实立德树人的实践路径。【解析】立德树人是我国教育的根本任务，五育并举与德育为先是落实立德树人的核心遵循，二者具有内在的统一性，共同服务于培养担当民族复兴大任的时代新人的根本目标。**。"},{"t":"德育为先是五育并举的灵魂统帅","d":"灵魂统帅。立德树人，立德为先，德育在五育中居于引领地位，决定着整个教育的价值方向与根本性质。坚持德育为先，才能保证五育并举始终沿着培养社会主义建设者和接班人的正确方向推进，避免育人的功利化、工具化偏差。德育不是孤立存在的，而是贯穿于其他各育之中：智育有价值方向，体育有意志品质，美育有道德情操，劳动有思想觉悟，都是德育的具体体现。1.。"},{"t":"五育并举是立德树人的全面载体","d":"全面载体。立德树人的目标是培养德智体美劳全面发展的时代新人，这一目标必须通过五育并举的完整育人体系来实现。立德树人不是单纯的德育工作，而是要通过德育、智育、体育、美育、劳动教育的协同推进，全面提升学生的思想道德、科学文化、健康体魄、审美素养与劳动能力，让学生成为有理想、有本领、有担当的人。五育并举从不同维度支撑着树人的目标，是立德树人的实践载体。1.。"},{"t":"二者统一于人的全面发展的根本目标","d":"展的根本目标。德育为先是方向保障，解决“培养什么人、怎样培养人”的根本问题；五育并举是路径支撑，解决“全面培养、系统育人”的实践问题。二者共同服务于“培养全面发展的社会主义建设者和接班人”的根本目标，共同落实为党育人、为国育才的使命。**。"},{"t":"中小学落实立德树人的实践路径","d":"实践路径**中小学落实立德树人根本任务，必须坚持德育为先与五育并举的统一，构建全方位、全过程、全员性的育人体系。1.坚持德育为先，构建全链条德育体系。把立德树人贯穿教育教学全过程，落实课程育人、教学育人、文化育人、活动育人、管理育人、全员育人。用好课堂教学主渠道，推动德育融入各学科教学，实现知识传授与价值引领的统一；丰富主题教育活动，让学生在实践中涵养品德；强化校园文化建设，以文化人、以文育德；完善日常管理，在管理中渗透价值引导；发动全体教师，落实全员育人，让德育从思政课程延伸到教育全环节，真正发挥引领作用。1.坚持五育并举，构建全面育人新格局。严格开齐开足五育课程，保障各育的课时与质量，严禁。"}]}]},{"id":"预测6-1-36","num":36,"title":"36 观察学习","subject":"教心","blocks":[{"t":"（1）依托班杜拉观察学习理论","items":[{"t":"不良行为的习得过程：从注意到复制的间接学习链条","d":"从注意到复制的间接学习链条**观察学习的核心特征是“间接习得”，学生不需要亲自尝试行为后果，仅通过观察就能完成行为模式的记忆与掌握，这也是短视频不良行为能够快速蔓延的心理基础。1.。"},{"t":"注意过程：不良榜样的强吸引力触发选择性注意","d":"不良榜样的强吸引力触发选择性注意。注意是观察学习的起始环节，决定了个体筛选、接收哪些行为信息。短视频中的低俗言行之所以能精准抓住初中生的注意力，是多重因素共同作用的结果。其一，榜样行为的显著性与新奇性。网红的低俗言行往往夸张搞怪、具有强烈的感官刺激性，与平淡的日常校园生活形成鲜明反差，新奇感极强，很容易突破学生的注意筛选。其二，呈现方式的高频性与渗透性。短视频平台基于算法的碎片化、高频次推送，让学生在刷视频的过程中反复接触同类内容，不断强化注意的深度。其三，观察者自身的发展特点。"},{"t":"保持过程：重复暴露强化记忆表征","d":"重复暴露强化记忆表征。保持过程是将观察到的行为以心理表象、符号编码的形式储存在大脑中，为后续的行为复制提供记忆基础。学生频繁刷短视频的过程，就是对不良行为的反复观察过程，重复的视觉刺激让这些行为模式以生动的表象形式深度储存在记忆中，保持效果极强。同时，低俗言行大多简单直白、标签性强，容易以符号化的方式被学生提炼记忆，进一步提升了保持的牢固程度。这也是为什么学生即使被批评后，依然能在私下场景准确复现相关行为的原因——行为模式已经完成记忆储存，不会因为外部惩罚就凭空消失。1.。"},{"t":"复制过程：低门槛行为实现快速模仿","d":"低门槛行为实现快速模仿。复制过程是个体将记忆中的行为表征转化为外显行为的过程，也就是模仿的实施环节。网红的低俗言行大多是口头禅、简单肢体动作，技术门槛低、易于复制，初中生的行为能力完全可以轻松复现。同时，班级群体的跟风效应进一步降低了模仿的心理门槛：第一个学生模仿后获得同伴关注，其他学生就会纷纷效仿，形成行为传播的连锁反应，最终演变为班级不良风气。**。"},{"t":"不良行为的表现过程：动机过程的调节作用","d":"动机过程的调节作用**行为的习得不等于行为的表现，个体是否将已经习得的行为展现出来，核心取决于动机过程的调节。动机过程受到直接强化、替代性强化与自我强化的共同影响，决定了行为表现的场景、频率与强度。1.初始阶段：双重正向强化驱动公开表现。一开始学生公开模仿不良言行，本质上是替代性强化与直接强化共同作用的结果。一方面，学生观察到网红通过这类行为获得流量、关注与追捧，这是替代性强化，让学生觉得这类行为是“酷”的、能获得他人认可的；另一方面，学生自己模仿后，获得了同班同学的关注、起哄，满足了其寻求同伴认同的心理需求，这是直接的正向强化。两种强化共同作用，让学生有强烈的动机公开表现不良行为，推动了不。"}]},{"t":"（2）运用直接强化与替代强化理论","items":[{"t":"批评违纪学生：直接惩罚的短期效果与深层局限","d":"树立正向榜样两种育人方式的效果差异。【解析】直接强化与替代强化是调节个体行为动机的两种核心机制：直接强化是个体自身行为受到奖励或惩罚，从而调节行为频率；替代强化是个体通过观察榜样行为的后果，调整自身的行为倾向。批评违纪学生与树立正向榜样两种育人方式，分别对应直接惩罚与替代强化两种机制，在作用逻辑、效果层面、持续时效上存在显著差异。**。"},{"t":"积极效果：快速遏制公开不良行为","d":"快速遏制公开不良行为。直接惩罚的作用直接、见效快，能够迅速改变行为的后果预期。学生明确感知到公开模仿不良言行会带来批评、扣分等负面结果，出于对惩罚的规避，会快速停止公开场合的违规模仿。材料中“有效杜绝了学生公开违规模仿的行为”，正是直接惩罚的短期效果体现，对于快速遏制不良风气的蔓延具有立竿见影的作用，适合紧急情况下的行为管控。1.。"},{"t":"核心局限：治标不治本，难以根除问题","d":"治标不治本，难以根除问题。首先，只抑制行为表现，不消除行为习得。根据观察学习理论，惩罚只会影响行为的表现动机，不会抹去已经习得的行为模式。学生只是为了避免惩罚而隐藏行为，一旦脱离惩罚场景，行为就会再次出现。材料中学生在隐蔽场景私下模仿，正是这一局限的直接体现。其次，只破不立，没有提供替代性行为。批评只是告诉学生“不能做什么”，没有告诉学生“应该做什么”，学生寻求关注、展现自我的心理需求没有得到正向满足，就会通过隐蔽的方式继续寻求满足，无法从根源上解决问题。最后，容易引发逆反心理，削弱师生信任。"},{"t":"树立正向榜样：替代强化的深层价值与长效效果","d":"替代强化的深层价值与长效效果**选拔班级优秀学生作为正向榜样、开展表彰引领、邀请优秀毕业生分享经验，本质上是通过正向榜样的示范与积极后果的呈现，实现替代性强化，引导学生主动模仿正向行为、抑制不良行为。1.。"},{"t":"积极效果：标本兼治，实现深层引导","d":"标本兼治，实现深层引导。首先，既抑制不良行为，也建立正向标准。正向榜样不仅为学生提供了正确的行为参照，也通过榜样的积极后果（表彰、认可、成长成功）传递了“什么样的行为会获得肯定”的信号，从动机层面引导学生主动放弃不良行为，转向正向行为，实现从“禁止”到“引导”的转变。其次，作用范围广，面向全体学生。直接惩罚针对的是已经违纪的学生，而榜样教育面向全体学生，能够让所有学生都从榜样的经验中获得启发，主动调节自身行为，具有整体育人的效果。材料中“班级班风学风显著改善”，正是替代强化整体效应的体现。最后，激发内在动机，促进长效自觉。当学生认同正向榜样，将榜样的行为标准内化为自身的追求时，行为的动力就从。"}]},{"t":"（3）结合观察学习规律","items":[{"t":"优化班级榜样教育、提升德育实效的方法","d":"升德育实效的方法，分析短视频环境下榜样育人的挑战与应对策略。"},{"t":"精准选树榜样，提升注意效果","d":"意效果。注意过程是榜样教育的起点，榜样的吸引力直接决定教育效果。首先，坚持“贴近性”原则，优先选树学生身边的榜样。同班的优秀学生、同校的优秀毕业生，在年龄、经历、生活环境上与学生高度相似，更容易被学生关注与认同，远比遥不可及的名人榜样效果好。其次，突出榜样的行为细节而非仅仅是荣誉标签。不仅宣传榜样的荣誉，更要展现榜样的行为过程、成长故事、遇到的困难与应对方法，让榜样的行为可感知、可学习。最后，丰富榜样类型，覆盖多元成长维度。不仅有学习榜样，也要有品德榜样、自律榜样、劳动榜样等，适配不同学生的发展需求，让每个学生都能找到适合自己的参照。1.。"},{"t":"清晰呈现行为，强化保持效果","d":"持效果。保持过程是榜样行为转化为学生记忆表征的关键环节。首先，系统呈现榜样的行为逻辑，而不是碎片化的事迹。比如优秀毕业生分享自律成长经验，要完整呈现“如何抵制网络诱惑、如何规划时间、如何克服困难”的完整过程，让学生能够形成清晰的行为序列记忆，而不是模糊的印象。其次，多样化呈现方式，强化记忆编码。结合故事分享、现场互动、事迹展示等多种形式，让学生从听觉、视觉等多通道接收榜样信息，提升记忆保持的牢固程度。1.。"},{"t":"搭建实践载体，促进复制落地","d":"制落地。复制过程是榜样行为转化为学生自身行为的中间环节。首先，设置阶梯式的实践任务，让学生从易到难模仿榜样行为。比如针对自律榜样，先从“每天按时完成作业”的小目标开始，逐步提升自律要求，让学生在逐步实践中掌握行为方法。其次，搭建同伴互助的平台。以榜样学生为核心组建学习小组、互助小组，让学生在日常互动中近距离观察、模仿榜样的行为，提升复制的准确性。1.。"},{"t":"强化正向激励，激活内在动机","d":"在动机。动机过程是榜样行为持续表现的根本保障。首先，及时肯定学生的正向模仿行为。当学生表现出榜样的积极行为时，及时给予表扬、认可，通过直接强化巩固行为动机。其次，引导学生自我强化。引导学生以榜样为参照，制定自我成长目标，进行自我监督、自我评价，将外部的榜样要求转化为内在的自我追求，最终实现行为的自觉自律。**。"}]}]}]},{"id":"预测6-2","name":"预测2","questions":[{"id":"预测6-2-31","num":31,"title":"31 朱熹·理学教育","subject":"中教史","blocks":[{"t":"教育的本质与核心目的","items":[{"t":"朱熹的教育思想以“性即理”的理学哲学为根基，明确了教育的本质作用与根本目标","d":"即理”的理学哲学为根基，明确了教育的本质作用与根本目标。他将人性划分为“天命之性”与“气质之性”两个层面：天命之性禀受天理而生，内含仁、义、礼、智等道德内核，是纯粹至善的；气质之性是理与气相杂的产物，有善有恶，清明中正者契合天理，昏浊偏私者流于人欲。教育的核心作用就在于“变化气质”，通过教化去除物欲的蒙蔽，显现并扩充气质中本有的善性，最终实现“明天理、灭人欲”的根本任务。在此哲学基础上，朱熹提出学校教育的根本目的是“明人伦”。在他看来，克服气质之偏、革除物欲之蔽，最终要落实到人伦秩序的践行上。教育就是要使人人明晰父子有亲、君臣有义、夫妇有别、长幼有序、朋友有信的伦理规范，自觉恪守封建等级秩序。"}]},{"t":"分段教育体系：小学与大学的递进衔接","items":[{"t":"小学教育：铸就圣贤坯璞：小学阶段对应8至15岁","d":"铸就圣贤坯璞**小学阶段对应8至15岁，核心任务是培养“圣贤坯璞”，为后续的。"},{"t":"大学教育：精研义理成才：大学阶段从15岁开始","d":"筑牢根基。在教学理念上，朱熹提出“教事”为主的原则，即通过具体的日常行事，让儿童感知基本的伦理道德规范，养成良好的行为习惯，掌握初步的文化知识技能。教学内容力求浅近具体，让儿童在洒扫应对、进退周旋的具体行为中体悟伦理秩序，做到“知之浅而行之小者”。在教育方法上，朱熹强调三点：一是先入为主、及早施教，重视童年启蒙的关键价值，主张在儿童心智尚未定型时施以正向引导；二是教学形象生动，契合儿童的认知特点，借助故事、格言等形式激发学习兴趣；三是首创以《童蒙须知》《训学斋规》等行为规范文本，系统规定儿童的言语、举止、服饰、行事准则，将道德培养落实到日常细节之中。**。"}]},{"t":"朱子读书法：古代读书方法论的集大成","items":[{"t":"朱熹在总结自身读书经验与前人治学传统的基础上","d":"验与前人治学传统的基础上，提出了系统的读书方法论，被后世称为“朱子读书法”，包含六大基本原则，是古代读书治学经验的高度凝练。一是循序渐进。读书需遵循典籍的内在逻辑次序，不可颠倒逾越；要结合自身的学力水平制定读书计划，扎实推进，切忌囫囵吞枣、急于求成，在打好基础的前提下逐步深入。二是熟读精思。读书既要熟读成诵，夯实文本记忆基础，更要精于思考，经历从无疑到生疑再到解疑的完整思维过程，在质疑与探究中把握经典的深层义理。三是虚心涵泳。读书需秉持虚怀若谷的心态，静心思虑，仔细体会文本本意，不可先入为主、牵强附会；要反复咀嚼、细心玩味，沉潜于文本之中体悟深意。四是切己体察。读书不能停留在口耳记诵层面，必须。"}]},{"t":"道德教育思想：内外兼修的修养体系","items":[{"t":"朱熹构建了一套从内在信念到外在践行的完整道德修养体系","d":"信念到外在践行的完整道德修养体系，将道德教育贯穿教育的全过程，形成了五个层层递进的修养环节。其一，立志。朱熹认为志向是人心的根本方向，对个体成长至关重要，学者首要之事便是树立远大的道德志向，以成圣成贤为终身追求，为道德修养提供根本动力。其二，居敬。要求内心专心致志、谨慎敬畏，一方面自觉抑制人欲诱惑，恪守封建伦理规范；另一方面外在仪容举止、言语态度都符合礼制要求，做到内外兼修、表里如一。其三，存养。即“存心养性”，每个人都有先天的善性，但易被气质之偏与物欲所遮蔽，需要通过存养的功夫，涵养本心、发显善性，守护内在的道德本源。其四，省察。强调时时处处进行自我反省与检视，做到“无时不省察”，在念虑萌发。"}]},{"t":"历史影响与时代局限","items":[{"t":"深远的历史影响","d":"第一，构建了理学教育的经典体系。朱熹编定的《四书章句集注》，自元代起成为科举考试的标准答案与各级学校的核心教材，地位超越五经，主导了宋元明清近八百年的教育内容，统一了传统教育的思想内核。第二，确立了书院教育的办学范式。《白鹿洞书院揭示》是中国书院史上第一个纲领性学规，明确了书院的教育宗旨、为学路径与行为准则，成为后世书院与官学办学的范本，推动了古代书院教育的制度化发展。第三，完善了古代教育的分段体系。小学与大学的分段设计，契合个体的认知发展规律，细化了人才培养的阶段目标与方法，丰富了中国古代的教育理论。第四，奠定了传统治学方法的基础。朱子读书法系统总结了。"},{"t":"构建了理学教育的经典体系","d":"体系。朱熹编定的《四书章句集注》，自元代起成为科举考试的标准答案与各级学校的核心教材，地位超越五经，主导了宋元明清近八百年的教育内容，统一了传统教育的思想内核。"},{"t":"确立了书院教育的办学范式","d":"范式。《白鹿洞书院揭示》是中国书院史上第一个纲领性学规，明确了书院的教育宗旨、为学路径与行为准则，成为后世书院与官学办学的范本，推动了古代书院教育的制度化发展。"},{"t":"完善了古代教育的分段体系","d":"体系。小学与大学的分段设计，契合个体的认知发展规律，细化了人才培养的阶段目标与方法，丰富了中国古代的教育理论。"},{"t":"奠定了传统治学方法的基础","d":"基础。朱子读书法系统总结了古代读书治学的经验，成为后世士人的基本治学准则，深刻影响了中国古代的学风与士人精神。**。"}]}]},{"id":"预测6-2-32","num":32,"title":"32 三大教育力量","subject":"外教史","blocks":[{"t":"三大教育力量的核心办学实践形态","items":[{"t":"人文主义教育：世俗精英教育的兴起","d":"14至17世纪，伴随文艺复兴的思想解放与宗教改革的社会变革，欧洲教育彻底打破中世纪天主教会的单一垄断格局，逐步形成人文主义教育、新教教育与天主教教育三大力量并行发展的多元态势。三者基于不同的立场与目标开展办学实践，既相互竞争又相互影响，共同推动欧洲教育从中世纪传统形态向近代形态转型。"},{"t":"新教教育：教派化国民教育的探索","d":"14至17世纪，伴随文艺复兴的思想解放与宗教改革的社会变革，欧洲教育彻底打破中世纪天主教会的单一垄断格局，逐步形成人文主义教育、新教教育与天主教教育三大力量并行发展的多元态势。三者基于不同的立场与目标开展办学实践，既相互竞争又相互影响，共同推动欧洲教育从中世纪传统形态向近代形态转型。"},{"t":"天主教教育：反宗教改革下的教会教育革新","d":"三大力量并行发展的多元态势。三者基于不同的立场与目标开展办学实践，既相互竞争又相互影响，共同推动欧洲教育从中世纪传统形态向近代形态转型。**。"}]},{"t":"三者在教育价值取向与课程内容上的异同","items":[{"t":"共通之处","d":"第一，均重视古典文化的传承与价值。三大教育力量都将古希腊罗马的古典语言、文学、哲学作为重要教学内容，突破了中世纪经院哲学的知识局限，共同延续了欧洲古典文化脉络，也丰富了教育的知识体系。第二，均保留宗教信仰的教育维度。人文主义教育家普遍信仰上帝，仅反对教会的腐朽专制与思想禁锢，并未否定宗教本身；新教与天主教教育更是以宗教信仰为核心目标，只是教派立场与教义阐释不同。第三，均冲击了中世纪僵化的教育传统。三者都不同程度反对经院教育的教条主义、死记硬背与体罚陋习，开始关注儿童的身心特点，改进教学组织与方法，推动教育从纯宗教教化向更丰富的形态发展。"},{"t":"均重视古典文化的传承与价值","d":"与价值。三大教育力量都将古希腊罗马的古典语言、文学、哲学作为重要教学内容，突破了中世纪经院哲学的知识局限，共同延续了欧洲古典文化脉络，也丰富了教育的知识体系。"},{"t":"均保留宗教信仰的教育维度","d":"维度。人文主义教育家普遍信仰上帝，仅反对教会的腐朽专制与思想禁锢，并未否定宗教本身；新教与天主教教育更是以宗教信仰为核心目标，只是教派立场与教义阐释不同。"},{"t":"均冲击了中世纪僵化的教育传统","d":"教育传统。三者都不同程度反对经院教育的教条主义、死记硬背与体罚陋习，开始关注儿童的身心特点，改进教学组织与方法，推动教育从纯宗教教化向更丰富的形态发展。**。"},{"t":"核心差异","d":"****1.教育价值取向的分野**人文主义教育秉持人本主义价值，以人的发展为核心。歌颂人的价值尊严，追求个性解放与现世幸福，教育目标是培养身心和谐、学识广博的“全人”与世俗精英，服务于人的完善与世俗社会改良，世俗性特征最为突出。新教教育秉持信仰救赎与国家服务双重价值，以宗教目的为根本。首要目标是培养虔信本教派的教徒，巩固教义传播；同时强调教育服务国家治理、提升国民素养，兼具宗教性与世俗功利性，推动教育成为国家公共职能。天主教教育秉持教会护教价值，以维护天主教会权威为核心。教育是反宗教改革的工具，根本目的是对抗新教、维护天主教正统地位，培养忠诚的神职人员与宗教精英，宗教属性最为鲜明。**2.课程。"}]},{"t":"三者对欧洲近代教育转型的共同历史作用","items":[{"t":"打破教会教育垄断，推动教育格局多元化","d":"动教育格局多元化。中世纪欧洲教育完全由天主教会掌控，三大教育力量的兴起形成了世俗人文教育、新教国家教育、天主教教会教育三足鼎立的格局。教育的举办主体从单一教会扩展到世俗政权、人文学者、不同教派，教育形态从单一教会教育转向精英教育、国民教育、宗教教育多元并存，开启了欧洲教育近代化的多元格局。"},{"t":"推动教育国家化与世俗化转型","d":"化转型。新教教育首次将教育权纳入国家公共职能，开创了国家办学、义务教育的制度传统，推动教育从教会私属事务向国家公共事业转变；人文主义教育拓展了世俗知识的边界，将人的发展、世俗生活纳入教育目标，削弱了教育的宗教附庸地位；天主教教育的规范化实践也客观上推动了学校制度的成熟。三者共同发力，推动欧洲教育逐步摆脱宗教的绝对控制，向近代国家公共教育体系转型。"},{"t":"奠定国民普及教育的思想与实践基础","d":"想与实践基础。新教教派提出的全民教育、义务教育、免费教育理念，突破了中世纪精英教育的阶层壁垒，将教育普及到普通民众层面，尤其是加尔文在日内瓦的普及教育实践，为近代国民教育体系的形成提供了最早的实践样本，深刻影响了后世欧美公共教育制度的建立。"},{"t":"丰富教育内容与教学方法，推动教育走向规范化","d":"法，推动教育走向规范化。人文主义教育拓展了人文学科、体育、美育的教育维度，确立了尊重儿童、因材施教的教学传统；新教教育开创本族语教学，丰富了实用课程体系；耶稣会学校建立了系统的班级授课制、分级学制与严格的师资培训制度。三者共同推动教育从中世纪零散、教条、体罚为主的落后模式，向系统、规范、关注人的发展的近代教育模式演进。"},{"t":"搭建中世纪教育向近代教育过渡的桥梁","d":"教育过渡的桥梁。三大教育力量虽立场各异，但共同继承了欧洲古典文化遗产，在保留宗教文化传统的同时，注入了人文精神、国家意识、普及理念、科学方法等近代教育因子。它们的探索与实践，为夸美纽斯泛智教育、洛克绅士教育等近代教育思想的形成，以及近代学校制度的最终确立积累了宝贵经验，是欧洲教育从中世纪走向近代不可或缺的过渡环节。###材料分析题####33.阅读材料，回答问题。#####（1）结合材料，运用个体主观能动性理论，分析双减后学生分化的原因及教育启示。"}]}]},{"id":"预测6-2-33","num":33,"title":"33 主观能动性·学校主导","subject":"教原","blocks":[{"t":"（1）运用个体主观能动性理论","items":[{"t":"双减后学生分化的深层原因：主观能动性的差异决定环境作用的效度","d":"原因：主观能动性的差异决定环境作用的效度**同样是减少书面作业与考试、释放课后时间的外部环境变化，对不同学生产生了完全相反的影响，其核心逻辑在于：外部环境的价值必须通过个体的主动选择与内化才能转化为发展成果，主观能动性的水平直接决定了个体对环境资源的利用方向与利用效率。"},{"t":"对教育的实践启示：减负不是教育的终点，而是教育转型的起点","d":"**减负不是教育的终点，而是教育转型的起点。教育不能只做“减负担”的减法，更要做“提能力”的加法，把激发学生的主观能动性作为提质的核心。"}]},{"t":"（2）说明该校实践如何体现学校教育在人的身心发展中的主导作…","items":[{"t":"有目的的系统育人设计，引领学生发展方向","d":"引领学生发展方向**学校教育的主导性首先体现在其明确的育人目标与系统的培养方案，能够规定人的发展方向，对学生施加全面、系统、深刻的影响。该校针对减负后可能出现的自主学习不足问题，主动构建了“学习指导+导师引领+社团拓展+家校协同”的完整育人体系，不是被动应对减负，而是主动设计学生的发展路径。"},{"t":"专业教师的教育引领，发挥专业育人价值","d":"发挥专业育人价值**学校教育由专门培训的教师实施，教师的专业引领是学校教育主导作用的重要支撑。该校的导师制、学习方法课程、社团指导，都是教师专业作用的体现。"},{"t":"整合多方育人资源，优化学生发展环境","d":"化学生发展环境**学校教育能够在一定程度上控制、协调影响学生发展的各种因素，整合学校、家庭、社会的资源，为学生营造最佳的发展环境。"},{"t":"促进个性化与社会化的统一，实现全面育人","d":"统一，实现全面育人**学校教育的主导作用还体现在促进个体个性化与社会化的双重发展。一方面，促进个体个性化。自主选课、导师个别指导、多元社团，尊重了学生的个体差异，充分挖掘学生的内在潜力，促进学生的主体意识形成与个性发展，让每个学生都能成长为独特的个体。另一方面，促进个体社会化。社团活动、成果展示、集体学习，让学生在互动中学会交往、合作、展示，促进学生的行为社会化与能力社会化，帮助学生更好地适应社会发展。#####（3）结合材料一中课后服务形式单。"}]},{"t":"（3）中课后服务形式单一、家庭学习氛围薄弱等现象及材料二中…","items":[{"t":"内部前提条件：学校教育主导作用的内在基础","d":"学校教育主导作用的内在基础**内部因素是学校主导作用发挥的根本依据，决定了教育本身的能力与效度。"},{"t":"外部前提条件：学校教育主导作用的环境支撑","d":"学校教育主导作用的环境支撑**外部因素是学校主导作用发挥的必要保障，学校教育无法脱离家庭与社会环境独立发挥作用。"},{"t":"实践启示：内外协同构建育人合力","d":"内外协同构建育人合力**学校要充分发挥主导作用，不能只靠学校单打独斗，必须坚持内外兼修。对内，要以激发学生主观能动性为核心，不断提升教育自身的质量，优化课程设计、提升教师专业能力、完善育人体系，练好内功；对外，要主动加强家校沟通，争取家庭的理解与配合，同时联动社会资源，拓展育人空间，争取外部支持。只有内外形成合力，学校教育的主导作用才能真正充分发挥，实现减负提质的育人目标。####34.阅读材料，回答问题。#####（1）结合布鲁纳认知—发现说，评析张老师探究教学的优缺点。"}]}]},{"id":"预测6-2-34","num":34,"title":"34 布鲁纳·奥苏伯尔","subject":"教心","blocks":[{"t":"（1）结合布鲁纳认知—发现说，评析张老师探究教学的优缺点。","items":[{"t":"探究式教学的优势：契合主动建构规律，凸显过程育人价值","d":"契合主动建构规律，凸显过程育人价值**。"},{"t":"遵循学习的主动建构本质，充分激发学生的学习主体性","d":"质，充分激发学生的学习主体性。布鲁纳指出，学习不是被动接受信息的过程，而是学习者主动将新知识与原有认知结构建立联系，进而重组编码系统、建构认知体系的过程。张老师没有直接向学生灌输三角形内角和定理，而是为每组准备不同类型的三角形纸片，组织学生以小组为单位，通过量角器测量、剪拼拼接、折叠验证等多种方式自主探究规律。整个过程中，学生是知识的主动发现者，而非被动接收者，动手参与积极、课堂氛围活跃，充分体现了学习的主动性，有效激发了学生的探究热情。"},{"t":"探究式教学的局限：知识建构深度不足，效率与落实存短板","d":"知识建构深度不足，效率与落实存短板**。"},{"t":"学科基本结构落实不到位，认知建构缺乏精准性与系统性","d":"位，认知建构缺乏精准性与系统性。布鲁纳强调，教学的核心目标是让学生掌握学科的基本结构，形成系统的认知结构，这是知识迁移的基础。张老师的课堂将大量时间用于动手操作，在定理归纳提升环节，多数小组只能描述直观的操作现象，难以用规范的数学语言概括结论，也无法自主完成严谨的逻辑推导，最终由教师梳理总结定理内容。这说明学生的认知建构停留在直观经验层面，没有形成精准、系统的符号化知识结构，学科基本结构的掌握不够扎实，影响了知识的迁移应用。"}]},{"t":"（2）依据奥苏伯尔有意义接受说","items":[{"t":"李老师的讲授教学属于有意义学习的判断依据","d":"有意义学习的判断依据**判断一种学习是否为有意义学习，核心看是否满足“材料有逻辑意义、学习者有意义学习心向、认知结构有固着观念、主动开展意义同化”四个核心条件，李老师的课堂完全符合这些要求。"},{"t":"运用先行组织者策略优化教学的具体路径","d":"化教学的具体路径**先行组织者是先于学习任务呈现的引导性材料，其抽象、概括水平高于学习任务，能够在新旧知识之间架设认知桥梁，增强新旧知识的可辨别性，促进有意义学习的深入。李老师的教学虽然已有旧知识复习环节，但可以通过先行组织者策略进一步系统化、精准化优化。"}]},{"t":"（3）比较布鲁纳与奥苏伯尔学习理论差异","items":[{"t":"布鲁纳与奥苏伯尔学习理论的核心差异","d":"理论差异，阐述对双减背景课堂改革的启示。【解析】布鲁纳的认知—发现说与奥苏伯尔的有意义接受说，是现代认知学习理论的两大核心流派，二者分别从主动发现与意义同化两个维度揭示了学习的本质规律，在学习本质、教学模式、价值取向、效率特征等方面存在显著差异。二者并非对立的两极，而是互补的关系，对双减背景下的课堂提质增效改革具有重要的指导意义。**。"},{"t":"学习本质的认知差异：主动发现建构与意义接受同化","d":"主动发现建构与意义接受同化。布鲁纳认为，学习的本质是学习者主动获得知识、转化信息、评价结果，进而重组自身认知结构的过程，核心是“做中学”，强调个体的主动探索与认知重构。奥苏伯尔则认为，学习的本质是新知识与认知结构中已有的适当观念建立非人为的、实质性的联系，实现知识的意义同化，核心是“理解中学”，强调个体对知识的主动理解与系统内化。前者侧重认知结构的动态重组，后者侧重认知结构的有序扩充。"},{"t":"对双减背景下课堂改革的实践启示","d":"的实践启示**双减政策的核心目标是减轻学生过重作业负担与校外培训负担，提升课堂教学质量，推动核心素养落地。这就要求课堂改革必须走出“要么满堂灌、要么伪探究”的两极误区，吸收两种理论的合理内核，实现提质增效。"}]}]},{"id":"预测6-2-35","num":35,"title":"35 三级课程·课改·课程创生","subject":"教原","blocks":[{"t":"（1）说明国家、地方、校本课程各自定位与三者关系。","items":[{"t":"三类课程的核心定位：1\\.国家课程","d":"**1\\.国家课程：育人主体、基础核心、规范底线国家课程由中央教育行政部门统一编制、实施与评价，是面向全国中小学生的统一性、强制性课程，在基础教育课程体系中占据绝对主体地位，是落实立德树人根本任务、保障全国基础教育育人质量统一标准的核心载体。从属性来看，国家课程具备极强的权威性、规范性与通用性，严格依据国家课程方案和新课标标准制定，明确各学段、各学科的课程目标、教学内容、学业要求与育人标准，规定了基础教育的基本育人底线与人才培养规格。其核心价值在于保障全国义务教育的公平性、基础性与统一性，杜绝区域、校际育人标准的大幅偏差，为所有学生提供平等、全面的基础学科教育，夯实学生核心素养发展的根基。"},{"t":"三类课程的内在辩证关系：首先，三者主次分明、层级清晰，坚守统一育人底线","d":"系**首先，三者主次分明、层级清晰，坚守统一育人底线。国家课程是根本主体，决定基础教育的育人方向、核心内容与质量标准，是地方课程、校本课程开发实施的前提与基础，任何地方与校本课程的建设，都必须服从国家课程的育人要求，不得偏离国家教育方针、降低基础育人标准。这也契合材料中学校的办学理念，即在凸显课程特色的同时，坚守统一育人标准，杜绝盲目追求特色而弱化基础育人质量。地方课程与校本课程属于辅助补充，始终围绕国家课程的核心目标开展建设，是对国家课程的延伸与丰富，而非替代与颠覆。其次，三者相互补充、协同赋能，实现育人全覆盖。国家课程侧重通用知识、核心素养的标准化培育，保障育人公平与基础质量；地方课程侧重。"}]},{"t":"（2）阐述我国基础教育课程改革核心理念","items":[{"t":"基础教育课程改革的核心核心理念","d":"心核心理念第一，坚持育人本位，落实素养导向育人目标。新课改彻底摒弃传统课程重知识传授、轻素养培育的弊端，立足学生终身发展需求，构建三维目标体系并进一步升级为核心素养育人体系，强调在传授基础知识、基本技能的同时，培育学生正确价值观、必备品格与关键能力，实现知识学习、能力提升、价值塑造的统一。摒弃应试化、功利化的育人导向，突出课程的育人价值，推动课程从“知识本位”向“素养本位”转型，让课程服务于学生全面、可持续发展。第二，优化课程结构，构建均衡多元课程体系。新课改打破传统课程学科本位、科目割裂、结构单一的局限，推行国家、地方、校本三级课程管理模式，强化课程的。"},{"t":"坚持育人本位，落实素养导向育人目标","d":"养导向育人目标。新课改彻底摒弃传统课程重知识传授、轻素养培育的弊端，立足学生终身发展需求，构建三维目标体系并进一步升级为核心素养育人体系，强调在传授基础知识、基本技能的同时，培育学生正确价值观、必备品格与关键能力，实现知识学习、能力提升、价值塑造的统一。摒弃应试化、功利化的育人导向，突出课程的育人价值，推动课程从“知识本位”向“素养本位”转型，让课程服务于学生全面、可持续发展。"},{"t":"优化课程结构，构建均衡多元课程体系","d":"衡多元课程体系。新课改打破传统课程学科本位、科目割裂、结构单一的局限，推行国家、地方、校本三级课程管理模式，强化课程的均衡性、综合性与选择性。既坚守国家课程的基础性与统一性，保障基础教育公平与质量底线，又通过地方课程凸显地域特色、校本课程适配学生个性，丰富课程供给形态，破解传统课程同质化、固化化的问题，实现“统一规范与多元特色”的有机平衡。同时大力推进课程综合化、实践化，强化跨学科学习、探究性学习与社会实践育人。"},{"t":"变革实施方式，凸显学生主体发展地位","d":"生主体发展地位。新课改倡导自主、合作、探究的新型学习方式，摒弃被动接受、机械训练的传统教学模式，强调立足学生生活经验、兴趣需求设计课程活动，鼓励学生主动参与、动手实践、深度探究，培养学生问题解决能力、创新能力与合作能力，充分尊重学生的主体性与差异性，适配不同学生的发展节奏与特长需求。"},{"t":"完善管理评价，推动课程动态提质升级","d":"程动态提质升级。新课改下放课程管理权限，赋予地方、学校课程开发自主权，激发基层办学活力；同时建立发展性课程评价体系，打破单一的甄别选拔评价模式，通过多元评价、动态反馈、持续修订，推动课程、教师、学生的全方位发展，实现课程建设的动态优化、迭代升级。**。"}]},{"t":"（3）论述教师在课改中的角色定位","items":[{"t":"新课改背景下教师的多元角色定位","d":"元角色定位**1\\.从教材执行者转变为课程自主开发者与建设者传统应试教育模式下，教师的核心工作是严格依照教材、教案开展教学，被动完成既定授课任务，缺乏课程自主话语权。而新课改下放课程管理自主权，赋予学校、教师课程开发的合法权利，教师不再是单纯的“教书匠”。材料中该校教师打破固有认知，主动参与校本课程研发，语文、数理科学教师结合自身专业优势开发特色课程，充分体现了教师课程开发者的角色。教师能够立足学科专业、结合学情需求、依托校内外资源，自主设计、开发、优化特色课程，是三级课程体系落地、校本课程提质的核心力量。"},{"t":"教师实现课程创生的核心实践路径","d":"心实践路径**1\\.更新教育理念，树立课程创生意识课程创生的前提是理念革新，教师首先要彻底摒弃“课程开发是专家专属工作、教师只需授课”的固化认知，树立全员课程建设、全程课程创生的全新理念。主动对接新课改素养导向、三级课程管理的核心要求，明确自身在课程开发、实施、优化中的主体责任，认识到课程不是静态固定的文本，而是在师生互动、实践探索中动态生成的育人载体。学校可通过专题培训、教研研讨、课改分享等方式，帮助教师转变认知，激发教师课程研发的主动性与积极性，为课程创生奠定思想基础。2\\.立足学情调研，精准锚定课程创生方向课程创生的核心目标是服务学生发展，脱离学情的课程开发必然流于形式、质量低下。教师在。"}]}]},{"id":"预测6-2-36","num":36,"title":"36 建构主义","subject":"教心","blocks":[{"t":"（1）依据建构主义知识观、学生观","items":[{"t":"对三组差异化绿化方案的处理：契合知识本质规律，尊重学生经验差异","d":"的处理：契合知识本质规律，尊重学生经验差异**从建构主义知识观来看，知识并不是对客观现实绝对无误的终极答案，只是人们对各类现象形成的暂时性解释与假设，具备动态性、情境性与主观性。知识无法脱离具体场景直接套用，不存在放之四海而皆准的标准化方案，需要结合具体情境进行再创造。校园绿化优化本身就是典型的情境化实践问题，需要兼顾场地条件、植物习性、景观需求、养护成本、生态价值等多重维度，不存在唯一绝对正确的设计方案。三组学生分别从景观美学、环境适配、本土生态三个角度形成设计思路，正是知识主观性与情境性的体现——不同学习者基于自身的观察视角、知识储备与思考逻辑，会对同一个问题形成不同的解释与方案。"},{"t":"对学生片面认知的处理：遵循认知建构规律，留白激发自主探究","d":"遵循认知建构规律，留白激发自主探究**针对第三组学生提出的“种树越多校园越干燥”的片面观点，教师没有当场直接否定纠错，而是顺势引导学生课后自主查阅资料、下节课深度研讨，这一做法同样符合建构主义的核心逻辑。从知识观层面，关于植物蒸腾作用与校园微气候的关联，本身就不是单。"}]},{"t":"（2）结合建构主义学习观、教学观","items":[{"t":"项目式学习实践的优势：深度契合建构主义育人逻辑","d":"深度契合建构主义育人逻辑第一，创设真实问题情境，落实学习的情境性。教师选取校园绿化优化这一学生身边的真实问题作为探究主题，打破教室边界，组织学生实地勘察校园绿植分布、光照条件、土壤状况，让生物知识学习嵌入真实的校园改造场景。这一设计完全符合情境性学习的要求，为学生提供了解决现实问题的原型，让学生在真实任务中感知知识的应用价值，避免了书本知识与现实生活割裂的问题。第二，突出学生主体地位，激发学习的主动建构性。教师没有按传统模式逐点讲授植物生长习性、蒸腾作用等知识点，而是提前布置探究任务，由学生分组自主调研、查阅资料、整合数据、设计绿化方案。整个过程中，学生。"},{"t":"创设真实问题情境，落实学习的情境性","d":"实学习的情境性。教师选取校园绿化优化这一学生身边的真实问题作为探究主题，打破教室边界，组织学生实地勘察校园绿植分布、光照条件、土壤状况，让生物知识学习嵌入真实的校园改造场景。这一设计完全符合情境性学习的要求，为学生提供了解决现实问题的原型，让学生在真实任务中感知知识的应用价值，避免了书本知识与现实生活割裂的问题。"},{"t":"突出学生主体地位，激发学习的主动建构性","d":"发学习的主动建构性。教师没有按传统模式逐点讲授植物生长习性、蒸腾作用等知识点，而是提前布置探究任务，由学生分组自主调研、查阅资料、整合数据、设计绿化方案。整个过程中，学生不再是被动的知识接收者，而是主动的问题解决者，需要自主调动原有生物知识，加工处理调研信息，形成自己的设计思路。这种模式充分尊重了学习的主动建构属性，让学生在解决问题的过程中完成对新知识的意义建构。"},{"t":"搭建学习共同体平台，发挥学习的社会互动性","d":"发挥学习的社会互动性。教师以小组为单位组织探究，课堂设置成果展示、小组互评、质疑辩论环节，构建了多向交流的学习共同体。小组内部成员分工协作、共享信息，共同完成项目任务；班级层面不同小组相互质疑、补充观点，在观点碰撞中完善认知。这种模式充分利用了学生的经验差异，将个体的思考转化为共同体的共享资源，体现了建构主义对社会性相互作用的重视。"},{"t":"转变教学育人功能，促进知识经验的生长","d":"进知识经验的生长。教师没有将教学等同于传递确定的客观知识，而是将重心放在激发学生探究、推动学生经验生长上。面对学生的片面认知，教师没有直接灌输标准答案，而是将其转化为新的探究课题，引导学生进一步搜集信息、反思原有认知，推动学生对自身的知识经验进行改组、转换与改造。这种定位符合建构主义教学观的核心主张，将教学从“知识传递”转向了“促进知识生长”。**。"}]},{"t":"（3）运用建构主义理论","items":[{"t":"核心素养导向下教师的角色转型","d":"角色转型第一，从知识讲授者转向真实问题情境的创设者。建构主义教学观强调情境性学习，知识的意义生成于真实的问题场景。教师不再直接罗列知识点、讲解例题，而是挖掘生活中与学科知识紧密关联的真实任务，创设能够引发学生认知冲突、激发探究兴趣的学习情境。就像材料中的生物教师，以校园绿化优化为项目主题，把课堂延伸到真实的校园环境，创设出需要运用生物知识解决的现实问题，为学生的知识建构搭建了真实的场景载体。第二，从内容传递者转向学习支架的搭建者。建构主义认为学生依托原有经验生长新知识，但学生的原有经验与认知能力存在局限，在复杂探究任务中容易遇到障碍。教师的核心任务不再是。"},{"t":"从知识讲授者转向真实问题情境的创设者","d":"问题情境的创设者。建构主义教学观强调情境性学习，知识的意义生成于真实的问题场景。教师不再直接罗列知识点、讲解例题，而是挖掘生活中与学科知识紧密关联的真实任务，创设能够引发学生认知冲突、激发探究兴趣的学习情境。就像材料中的生物教师，以校园绿化优化为项目主题，把课堂延伸到真实的校园环境，创设出需要运用生物知识解决的现实问题，为学生的知识建构搭建了真实的场景载体。"},{"t":"从内容传递者转向学习支架的搭建者","d":"支架的搭建者。建构主义认为学生依托原有经验生长新知识，但学生的原有经验与认知能力存在局限，在复杂探究任务中容易遇到障碍。教师的核心任务不再是给出标准答案，而是根据学生的认知水平提供启发性问题、资料线索、方法指引等各类支架，帮助学生跨越认知瓶颈，支撑学生自主完成知识建构。当学生出现认知误区时，教师不直接否定，而是搭建探究支架，引导学生自主查阅资料、开展研讨，自主完成认知修正，并随着学生能力提升逐步撤去支架，培养学生的独立探究能力。"},{"t":"从课堂管理者转向学习共同体的组织者","d":"共同体的组织者。建构主义重视学习的社会互动性，学生之间的经验差异是宝贵的学习资源。教师需要打破单向讲授的课堂结构，组织小组合作探究，搭建课堂交流、互评、辩论的平台，引导学生开展平等对话，鼓励学生表达不同观点，引导学生尊重不同想法，在观点碰撞中完善认知。教师不再是课堂的唯一权威，而是研讨秩序的维护者、对话方向的引导者，推动学习共同体内部的经验共享与思想碰撞。"},{"t":"从教学执行者转向学生认知发展的引导者","d":"认知发展的引导者。教学的核心目标是促进学生原有经验的改组与重建，教师需要敏锐捕捉学生的前概念、认知误区，利用认知冲突激发学生的反思意愿。通过启发性提问，引导学生反思自身观点的局限，推动学生主动检验假设、完成认知重构。教师需要持续观察学生的建构过程，及时发现学生知识碎片化、理论实践脱节等问题，调整教学安排，引导学生梳理整合知识体系，推动认知向纵深发展。"}]}]}]},{"id":"预测6-3","name":"预测3","questions":[{"id":"预测6-3-31","num":31,"title":"31 王守仁/王夫之","subject":"中教史","blocks":[{"t":"王守仁的核心教育主张","items":[{"t":"教育目的：致良知与复明本心","d":"的具体体现；分学段设置育人重点，属于不同学段的培养目标；学校依托学段目标设计主题活动，属于课程目标层面的安排；教师将目标转化为可观测、可评价的课堂表现，属于教学目标。因此依次为教育目的、培养目标、课程目标、教学目标，选A。**5.。"},{"t":"道德修养：知行合一的实践路径","d":"的核心准则。纲常体系的建立，使道德教育有了明确的标准，成为中国封建社会道德教育的核心内容。在德育原则与方法上，他提出重义轻利的价值追求，主张“正其谊不谋其利，明其道不计其功”；强调“以仁安人，以义正我”，兼顾对他人的尊重与个体的社会责任；主张道德修养中仁智统。"},{"t":"儿童教育：顺应性情的自然教育","d":"方面的主张，分析王夫之在人性论、学习观、教育作用方面的思想特点，比较二人教育思想的异同，并评析明清之际教育思想的启蒙特征。"}]},{"t":"王夫之教育思想的核心特点","items":[{"t":"人性论基础：性日生日成的后天建构","d":"性日生日成的后天建构**王夫之提出“性日生日成”的著名命题，打破了传统人性论的先验论。他认为人性并非天生固定、一成不变，而是在后天的生长变化过程中逐渐形成的，是环境与教育共同作用的结果。与之对应，教育对人的发展具有双重核心作用：一是“继善成性”，引导人继承善的禀赋、形成完善的道德品性；二是“改恶为善”，矫正青少年时期因失教而形成的恶习。这一人性论将教育从“复性”的框架中解放出来，转向“成性”的后天建构，为教育的价值提供了更具现实性的哲学基础。**。"},{"t":"学习观：有序、因人与学思并重","d":"有序、因人与学思并重**王夫之系统论述了教学过程的规律，形成了辩证的学习方法论。其一，施之有序，认为人的能力是逐步发展的，教学应当遵循由粗到精、由小到大、由事到理的顺序，循序渐进，逐步提升，是对传统循序渐进原则的深化发展。其二，因人而进，强调教学要针对学生的实际情况有的放矢，教师需通过考察品质、询问志向、观察行为了解学生特点，采用差异化的教学方法。其三，学思相资以为功，提出学与思是相辅相成的两条求知路径：学习要虚心吸纳前人经验，拓宽学识基础；思考要突破成规，发挥独立思考能力。“学愈博则思愈远”“思之困则学必勤”，深刻揭示了学与思的辩证关系。**。"},{"t":"教育作用：治国与育人的双重价值","d":"治国与育人的双重价值**王夫之继承儒家重教传统，将教育视为治国理政的根本，同时高度重视教育对个体发展的塑造作用。在道德观上，他批判程朱理学“存天理、灭人欲”的对立逻辑，主张天理与人欲紧密相连，天理存在于人欲之中，反对泯灭人的欲望，提倡依据天理合理节欲。这一主张肯定了人的合理欲望的正当性，具有重要的思想解放意义。在修养论上，他强调立志、自得与力行，认为道德修养的关键在于个体自觉，最终要落实到实际行动，“行”是检验道德知识、衡量道德心性的根本标准，凸显了实践在教育中的核心地位。**。"}]},{"t":"二人教育思想的异同比较","items":[{"t":"共通的思想内核：王守仁与王夫之的教育思想都扎根于儒家教育传统，具有诸多共通之处","d":"**王守仁与王夫之的教育思想都扎根于儒家教育传统，具有诸多共通之处。其一，都以道德教育为教育的核心，将完善人格、成就圣贤作为教育的终极目标；其二，都强调知行统一，重视道德实践的价值，反对空疏的书本记诵；其三，都尊重教育的个体差异，主张因材施教、循序渐进，契合人的发展规律；其四，都批判程朱理学教育的僵化弊病，致力于打破教条、重构教育的内在活力。**。"},{"t":"核心的路径分野：二者的思想分歧本质上是心学与气学、唯心与唯物的哲学分野在教育领域的体现","d":"**二者的思想分歧本质上是心学与气学、唯心与唯物的哲学分野在教育领域的体现。"}]},{"t":"明清之际教育思想的启蒙特征","items":[{"t":"从王守仁到王夫之","d":"明清教育思想的演进呈现出鲜明的早期启蒙特征，开启了对传统教育的深度反思。首先，对理学教条的突破与思想解放。王守仁的心学打破了程朱理学的思想垄断，将真理的标准从外在经典转向内在本心，极大地解放了士人的思想；王夫之则从唯物主义立场全面批判宋明理学的空疏与独断，推动思想向实学、实证方向转型。其次，人的主体性的彰显。王守仁强调人人皆有良知、人人可成圣贤，肯定了个体的道德自主性；王夫之强调学思结合、自得力行，凸显了个体在学习与修养中的能动性。二者都从不同维度提升了人的主体地位，蕴含着人本主义的萌芽。再次，教育的实践转向与经世品格。针对传统教育空疏无用的弊病，二人都强调实践的价值：王守仁以知行合一纠正空。"}]}]},{"id":"预测6-3-32","num":32,"title":"32 自然主义三人","subject":"外教史","blocks":[{"t":"三位教育家的核心教育主张","items":[{"t":"夸美纽斯：自然主义教育的制度奠基","d":"泛智教育、洛克绅士教育等近代教育思想的形成，以及近代学校制度的最终确立积累了宝贵经验，是欧洲教育从中世纪走向近代不可或缺的过渡环节。###材料分析题####33.阅读材料，回答问题。#####（1）结合材料，运用个体主观能动性理论，分析双减后学生分化的原因及教育启示。"},{"t":"卢梭：自然主义教育的思想体系化","d":"思想体系化卢梭是18世纪法国启蒙运动的核心思想家，其教育著作《爱弥儿》被称为教育史上的“哥白尼式革命”。他以性善论与感觉论为哲学基础，构建了完整的自然教育理论体系。卢梭提出教育的核心是“回归自然”，认为人性本善，唯有远离城市喧嚣、遵循自然天性的教育，才能守护儿童的善良本性，培养独立自主、自由平等的“自然人”。在教育原则上，倡导“消极教育”，反对成人对儿童的强制灌输与过度干预，认为教师的职责是创造适宜的学习环境、防范不良影响，而非主动说教；提出“自然后果律”，让儿童从自身行为的自然结果中获得经验教训，而非接受成人的惩罚；强调因材施教，尊重儿童的个体差异，依。"},{"t":"裴斯泰洛齐：自然主义教育的实践科学化","d":"是这一脉络中三座里程碑式的人物，三者立足不同时代背景，依次推动自然主义教育从制度奠基、思想体系化走向实践科学化，共同驱动了西方教育从传统形态向近代科学形态的深刻转型。**。"}]},{"t":"三者在自然主义教育思想上的继承与发展关系","items":[{"t":"共同的思想根基：三者都站在新兴资产阶级的立场上","d":"**三者都站在新兴资产阶级的立场上，批判中世纪经院教育脱离现实、压抑天性、死记硬背的弊端，反对教会对教育的垄断控制；都主张教育必须遵循自然规律，尊重儿童的本性与身心发展特点，强调人的全面发展；都具有鲜明的人文主义与民主主义色彩，倡导教育普及与教育平等，推动教育从贵族特权向大众权利转变。**。"},{"t":"递进式的发展脉络"},{"t":"夸美纽斯：自然主义的系统化奠基","d":"自然主义的系统化奠基。夸美纽斯是自然主义教育思想的正式创立者。他首次将“教育适应自然”上升为教育的根本原则，结束了此前零散的经验式探索；同时构建了包含学制、教学、管理在内的完整教育制度框架，让自然主义从思想主张落地为可推行的教育模式。但他的“自然”更多指向宇宙的普遍秩序，带有宗教色彩与机械类比的局限，对儿童内在本性的探讨尚不深入。1.。"},{"t":"卢梭：自然主义的本体化转向","d":"自然主义的本体化转向。卢梭继承并深化了“教育适应自然”的理念，实现了自然主义的核心转向——从关注“外在自然规律”转向关注“儿童内在天性”。他彻底打破了传统教育以成人、书本、宗教为中心的逻辑，真正确立了儿童的教育主体地位，赋予自然主义反封建、反专制的启蒙精神，构建了从教育目的、原则到阶段划分的完整思想体系。但卢梭的思想带有浓厚的哲学思辨色彩，理想化程度较高，缺乏系统的实践路径。1.。"},{"t":"裴斯泰洛齐：自然主义的科学化实践","d":"自然主义的科学化实践。裴斯泰洛齐同时继承了夸美纽斯的普及教育理想、制度建设思路，以及卢梭的儿童本位、自然发展理念，实现了自然主义的实践转向与科学化升级。他将卢梭抽象的“自然天性”具体化为儿童的心理发展规律，提出“教育心理学化”的方向，把哲学层面的自然主义转化为可操作的教学方法与课程体系；同时将自然主义教育从精英层面推向平民大众，通过教育与劳动结合的模式，让自然主义思想落地为国民教育实践，推动自然主义从理论思潮走向教育科学。简言之，三者的演进逻辑是：从“教育要契合自然秩序”到“教育要回归儿童天性”，再到“教育要遵循心理规律”，层层深入，逐步趋近近代教育的科学内核。**。"}]},{"t":"自然主义教育演进对近代教育科学化转型的历史意义","items":[{"t":"推动教育的世俗化转型，打破宗教神学的教育垄断","d":"打破宗教神学的教育垄断。自然主义教育逐步削弱了教育的宗教属性：夸美纽斯将大量世俗自然知识纳入泛智课程，卢梭反对过早的宗教灌输与教会的思想控制，裴斯泰洛齐面向平民的世俗国民教育实践，共同推动教育从培养神职人员的工具，转变为培养世俗公民、促进人的发展的社会事业，为近代公共教育制度的建立扫清了思想障碍。"},{"t":"确立儿童的教育主体地位，奠定现代教育的人文内核","d":"位，奠定现代教育的人文内核。自然主义教育颠覆了传统教育中教师绝对权威、儿童被动接受的格局，将儿童从教育的客体转变为教育的中心。尊重天性、因材施教、顺应发展规律等理念，逐步成为教育的基本共识，推动教育从“以教为中心”转向“以学为中心”，为现代教育的人文性奠定了思想基础。"},{"t":"推动教育学从经验思辨走向独立科学，开启教育科学化进程","d":"走向独立科学，开启教育科学化进程。夸美纽斯首次构建了系统的教育理论体系，让教育学从哲学与神学中独立出来；卢梭提供了儿童本位的哲学基础，拓展了教育研究的核心维度；裴斯泰洛齐提出“教育心理学化”，将心理学引入教育研究，为后来赫尔巴特教育理论、实验教育学思潮的兴起奠定了基础，推动教育研究从经验总结走向科学实证，宣告了近代教育科学的开端。"},{"t":"构建近代学校教育的制度与实践框架","d":"度与实践框架。夸美纽斯创立的班级授课制、学年制、统一学制，成为近代各国学校制度的标准模式，极大提升了教育普及的效率；裴斯泰洛齐的要素教学法、各科教学法，奠定了近代初等教育的教学实践范式；普及教育、国民教育的思想，推动了近代公共教育体系的建立，为教育的规模化、规范化发展提供了制度支撑。当然，这一时期的自然主义教育也存在时代局限，如夸美纽斯思想中的宗教残余、卢梭自然教育的理想化色彩、裴斯泰洛齐要素教育的机械主义倾向等。但整体而言，这一思想演进脉络从根本上改变了西方教育的发展方向，为近代教育的科学化、民主化、世俗化奠定了坚实基础，其核心理念至今仍是世界教育发展的重要遵循。###材料分析题####33。"}]}]},{"id":"预测6-3-33","num":33,"title":"33 教学目标与评价","subject":"教原","blocks":[{"t":"（1）结合布卢姆教育目标分类学（修订版）","items":[{"t":"语文教师修改后教学目标的认知层次定位","d":"标的认知层次定位**修订后的语文教学目标摆脱了“体会父爱”的空泛表述，转向可操作、可观测的具体要求，对应认知领域从基础到高阶的多个层级，形成了递进式的认知目标体系。"},{"t":"数学教师教学目标设计的合理性与实施问题","d":"的合理性与实施问题**数学教师针对函数专题设计三级分层目标，整体符合布卢姆教育目标分类的核心逻辑，具有明显的合理性，但教学实施环节存在明显的目标与实践脱节问题。从目标设计的合理性来看，其一，分层递进，符合认知发展规律。三级目标从“说出定义关键词”到“结合生活实例举例”再到“规范画出图像”，遵循了从简单到复杂、从识记到应用的认知发展顺序，对应认知领域的记忆、理解、应用层次，同时涵盖动作技能领域的操作与准确层次，目标梯度清晰，符合学生的认知进阶规律。其二，具体可测，避免空泛虚化。每一级目标都有明确的行为表现与评价标准，“准确说出”“举例说明”“规范画出”都是可观测、可检验的行为动词，解决了传统教学。"}]},{"t":"（2）分析该校课程资源开发存在的不足，提出优化路径","items":[{"t":"该校课程资源开发的突出不足","d":"出不足第一，资源开发意识薄弱，校内资源挖掘不足，校外资源闲置浪费。多数教师缺乏课程资源开发意识，将课程资源窄化为教材、教参等校内文本资源，没有主动挖掘校内的环境、设施、文化等隐性资源，更没有意识到周边丰富的社会资源的育人价值。学校周边的区科技馆、城市博物馆等优质社会资源长期闲置，没有与学科教学建立有机联系，资源优势没有转化为育人优势。第二，校外资源利用形式化，缺乏目标锚定与任务设计。学校组织的校外参观活动往往停留在“走马观花”的层面，缺少与学科教学对应的明确学习任务，也没有配套的评价要求。学生参观完科技馆、博物馆，只是获得了零散的感官体验，没有带着学科问。"},{"t":"资源开发意识薄弱，校内资源挖掘不足，校外资源闲置浪费","d":"内资源挖掘不足，校外资源闲置浪费。多数教师缺乏课程资源开发意识，将课程资源窄化为教材、教参等校内文本资源，没有主动挖掘校内的环境、设施、文化等隐性资源，更没有意识到周边丰富的社会资源的育人价值。学校周边的区科技馆、城市博物馆等优质社会资源长期闲置，没有与学科教学建立有机联系，资源优势没有转化为育人优势。"},{"t":"课程资源开发的优化路径","d":"径第一，强化资源开发意识，构建校内外资源整合格局。引导教师树立大课程资源观，打破“教材即唯一资源”的认知局限，系统梳理校内校外各类育人资源，建立资源清单，明确不同资源的育人价值与适用场景。主动对接周边科技馆、博物馆、企业、社区等校外主体，建立稳定的校外资源合作机制，将社会资源转化为课程育人载体。第二，锚定教学目标设计资源活动，破解形式化困境。所有校外资源的利用，都必须紧扣课时教学目标，设计明确的学习任务与探究问题，让学生带着任务走进校外场景。比如参观科技馆前，明确对应学科知识点的探究任务，让学生在参观中带着问题观察、思考、记录，避免无目的的参观。同时配套。"},{"t":"强化资源开发意识，构建校内外资源整合格局","d":"建校内外资源整合格局。引导教师树立大课程资源观，打破“教材即唯一资源”的认知局限，系统梳理校内校外各类育人资源，建立资源清单，明确不同资源的育人价值与适用场景。主动对接周边科技馆、博物馆、企业、社区等校外主体，建立稳定的校外资源合作机制，将社会资源转化为课程育人载体。"},{"t":"利用校外资源时三大领域学习目标的设计","d":"域学习目标的设计**利用校外资源开展教学，必须对应认知、情感、动作技能三大领域的目标层级，实现资源价值的最大化。在认知领域，要对应从记忆到创造的层级设计目标。比如利用科技馆资源，可设计：记忆层，能准确说出3件以上展品对应的科学原理名称；理解层，能解释核心展品的基本工作逻辑；应用层，能将展品的原理与课本中的知识点建立对应联系；分析层，能分析展品的设计思路与技术优势；评价层，能对展品的改进方向提出自己的判断；创造层，能设计一个简单的同类原理小发明。通过分层目标，让校外资源服务于认知的逐级进阶。在情感领域，要对应价值内化的层级设计目标。比如利用博物馆资源，可设计：接受层，愿意主动观察文物展品，不排斥。"}]},{"t":"（3）“教—学—评不一致”的问题","items":[{"t":"布卢姆目标分类理论对教学设计的实践价值","d":"教学设计的实践价值，以及应用时需要注意的问题。【解析】“教—学—评不一致”是当前中小学课堂教学的突出问题，本质上是目标、教学、评价三者脱节，教学缺乏清晰的目标锚定与闭环设计。布卢姆教育目标分类理论为破解这一问题提供了系统的理论工具，对教学设计具有重要的实践价值；但在应用过程中也需要避免机械化、碎片化等误区，确保理论落地不走样。**。"},{"t":"推动教学目标精准化，破解目标空泛虚化难题","d":"破解目标空泛虚化难题。布卢姆理论将笼统的育人目标拆解为三大领域、多层级的具体目标，用可观测、可测量的行为动词表述教学目标，让教学从“模糊的感觉”走向“精准的设计”。材料中语文教师将“体会父爱”细化为结合细节分析情感、清晰表达感悟的具体目标，数学教师设计三级分层目标，正是目标精准化的体现。清晰的目标为教学活动指明了方向，避免了教学活动的随意性与碎片化，从源头上为教-学-评一致奠定了基础。"},{"t":"应用布卢姆目标分类理论的注意事项","d":"论的注意事项第一，避免目标碎片化，保持育人目标的整体性。布卢姆理论将目标划分为不同领域、不同层级，是为了精准设计，而非割裂育人目标。在应用中不能机械地将目标拆分为孤立的碎片，忽视三者之间的内在关联。比如语文教学不能只设计认知目标，还要同步设计情感目标，实现文以载道、情理交融；数学教学不能只关注认知与技能，还要培养学生的科学精神与探究兴趣。要始终把握育人的整体性，让不同领域、不同层级的目标相互支撑、协同发力。第二，避免机械化套用，保留教学的灵活性与创造性。布卢姆目标分类提供的是框架参考，而非固定的模板。不同学科、不同课型、不同学情的目标设计应当灵活调整，不。"},{"t":"避免目标碎片化，保持育人目标的整体性","d":"育人目标的整体性。布卢姆理论将目标划分为不同领域、不同层级，是为了精准设计，而非割裂育人目标。在应用中不能机械地将目标拆分为孤立的碎片，忽视三者之间的内在关联。比如语文教学不能只设计认知目标，还要同步设计情感目标，实现文以载道、情理交融；数学教学不能只关注认知与技能，还要培养学生的科学精神与探究兴趣。要始终把握育人的整体性，让不同领域、不同层级的目标相互支撑、协同发力。"}]}]},{"id":"预测6-3-34","num":34,"title":"34 唤醒·归因·习得性无助","subject":"教心","blocks":[{"t":"（1）结合耶克斯—多德森定律","items":[{"t":"小宇考试发挥失常的深层原因","d":"层原因第一，目标单一化导致动机过载，突破最佳区间。小宇将考入重点高中作为初三阶段唯一的学习目标，将单次期中考试的重要性过度放大，使得考试动机强度过高，远远超出了最佳水平。过高的动机强度会引发过度的焦虑与紧张，大量占用认知资源，干扰思维过程的正常运转：考试时遇到稍难的题目就心跳加速、注意力难以集中，大脑的算力被焦虑情绪消耗，无法集中在题目分析与思路推导上。同时，过度紧张引发了不自信与强迫性行为，让他反复回头检查基础题的计算结果，看似谨慎，实则浪费了大量答题时间，最终导致后面的综合大题作答时间严重不足，成绩大幅下滑。这完全符合倒U型曲线的规律：动机超过临界点。"},{"t":"目标单一化导致动机过载，突破最佳区间","d":"载，突破最佳区间。小宇将考入重点高中作为初三阶段唯一的学习目标，将单次期中考试的重要性过度放大，使得考试动机强度过高，远远超出了最佳水平。过高的动机强度会引发过度的焦虑与紧张，大量占用认知资源，干扰思维过程的正常运转：考试时遇到稍难的题目就心跳加速、注意力难以集中，大脑的算力被焦虑情绪消耗，无法集中在题目分析与思路推导上。同时，过度紧张引发了不自信与强迫性行为，让他反复回头检查基础题的计算结果，看似谨慎，实则浪费了大量答题时间，最终导致后面的综合大题作答时间严重不足，成绩大幅下滑。这完全符合倒U型曲线的规律：动机超过临界点后，强度越高，行为表现越差。"},{"t":"班主任引导全班调整考试动机的实施路径","d":"试动机的实施路径第一，引导理性看待考试，适度降低动机预期。通过主题班会、小组讨论、个别谈心等多层方式，引导学生正确认识考试的功能定位：考试只是阶段学习的检测工具，目的是诊断知识漏洞、优化后续学习，而非决定未来的终极审判，弱化单次考试与升学目标的强绑定。帮助学生建立多元的学习目标体系，将“考高分、升名校”的单一远期目标，拆解为“掌握核心知识点、提升解题速度、积累应试经验”等多层近期目标，避免将所有压力集中在单次分数排名上，让整体动机强度逐步回归最佳区间。第二，结合任务难度匹配动机，分层调节备考状态。引导学生建立“任务难度—动机强度”的匹配意识：对于基础题，。"},{"t":"引导理性看待考试，适度降低动机预期","d":"度降低动机预期。通过主题班会、小组讨论、个别谈心等多层方式，引导学生正确认识考试的功能定位：考试只是阶段学习的检测工具，目的是诊断知识漏洞、优化后续学习，而非决定未来的终极审判，弱化单次考试与升学目标的强绑定。帮助学生建立多元的学习目标体系，将“考高分、升名校”的单一远期目标，拆解为“掌握核心知识点、提升解题速度、积累应试经验”等多层近期目标，避免将所有压力集中在单次分数排名上，让整体动机强度逐步回归最佳区间。"}]},{"t":"（2）运用韦纳成败归因理论","items":[{"t":"小宇的归因类型与动机影响","d":"影响**小宇的归因呈现出混合特征，但核心是消极的不可控归因，容易引发自我否定与动机衰退。"},{"t":"小浩的归因类型与动机影响","d":"影响**小浩将成绩下滑归结为“课后习题训练量不足、解题熟练度不够”，属于典型的努力归因，是内部、不稳定、可控的归因类型。从控制点维度看，努力属于内部因素，将失败归因为努力不足，不会从根本上否定自身能力，不会引发深度的自我否定与价值感崩塌；从稳定性维度看，努力程度是不稳定的，可以通过自身行动快速调整，学生相信只要增加训练量、提升熟练度，成绩就能回升，对未来的成绩提升抱有积极预期；从可控性维度看，努力是个人意志可以控制的因素，失败后不会产生无力感，反而会立刻激发行动动力，主动调整学习策略，针对性查漏补缺。"},{"t":"两种归因的动机影响对比","d":"比第一，自我认知影响不同：小宇的能力归因打击自我效能感，小浩的努力归因保护自我价值感。同样是考试失败，小宇否定了自己的数学学习能力，自我认知走向消极，甚至产生自我怀疑；小浩认为只是训练量与熟练度不足，没有否定自身潜力，自我认知保持积极稳定。第二，后续行为不同：小宇的不可控归因会导致回避与放弃，小浩的可控归因会激发主动行动。小宇会因为觉得“不适合学数学”而逃避数学学习，减少在数学学科的精力投入，甚至产生畏难情绪；小浩会立刻制定学习计划，增加专项习题训练，主动查漏补缺，用实际行动改变现状。第三，长期发展不同：小宇的稳定消极归因容易形成习得性无助，小浩的可控归。"},{"t":"自我认知影响不同：小宇的能力归因打击自我效能感，小浩的努力归因保护自我价值感","d":"小宇的能力归因打击自我效能感，小浩的努力归因保护自我价值感。同样是考试失败，小宇否定了自己的数学学习能力，自我认知走向消极，甚至产生自我怀疑；小浩认为只是训练量与熟练度不足，没有否定自身潜力，自我认知保持积极稳定。"}]},{"t":"（3）设计本次主题班会的教育要点","items":[{"t":"主题班会的核心教育要点","d":"点第一，认知重构：正确认识考试的价值与成败的意义。班会开篇通过问题引导、案例讨论，带领学生跳出“考试定终身”的认知误区，明确考试是阶段学习的诊断工具，核心价值是发现知识漏洞、优化后续学习，而非评判个人能力与未来的标尺。通过“考试的意义”小组分享，让学生明白一次考试的成败不代表整体的学习能力，更不决定未来的发展高度，弱化考试的功利属性，降低不必要的动机过载。同时引导学生转换视角看待失败：失败的考试比成功的考试更有成长价值，因为它能精准暴露自己的知识盲区与策略问题，为后续提升指明方向。第二，归因引导：学习积极归因的方法与思维。设置“归因卡片辨析”活动，带领学。"},{"t":"认知重构：正确认识考试的价值与成败的意义","d":"正确认识考试的价值与成败的意义。班会开篇通过问题引导、案例讨论，带领学生跳出“考试定终身”的认知误区，明确考试是阶段学习的诊断工具，核心价值是发现知识漏洞、优化后续学习，而非评判个人能力与未来的标尺。通过“考试的意义”小组分享，让学生明白一次考试的成败不代表整体的学习能力，更不决定未来的发展高度，弱化考试的功利属性，降低不必要的动机过载。同时引导学生转换视角看待失败：失败的考试比成功的考试更有成长价值，因为它能精准暴露自己的知识盲区与策略问题，为后续提升指明方向。"},{"t":"引导积极归因、预防习得性无助的长效路径","d":"得性无助的长效路径**习得性无助是个体在多次受挫后，将失败归因为稳定、不可控的内部因素，产生的“再努力也没用”的放弃心态。预防习得性无助，需要从归因引导、成功体验、评价方式、支持系统四个维度系统发力。"}]}]},{"id":"预测6-3-35","num":35,"title":"35 教学模式","subject":"教原","blocks":[{"t":"（1）阐释逆向设计教学模式与问题教学模式的内涵","items":[{"t":"两种教学模式的核心内涵：逆向设计教学模式是典型的“以终为始”的教学设计范式","d":"涵**逆向设计教学模式是典型的“以终为始”的教学设计范式，核心逻辑是先确定学习结束后学生应当达成的最终预期成果，再制定可衡量、可观测的评价量规，最后反向设计具体的学习任务与教学活动，所有教学环节都指向最终成果的达成。其核心特征是评价前置、目标引领，教学活动不再是盲目的知识传递，而是有明确方向的能力建构。这种模式适合知识结论相对明确、同时又需要锻炼学生逆向推理与成果意识的内容，能够有效激发学生的学习目标感，锻炼学生的逆向思维与整体规划能力。"},{"t":"张老师逆向设计教学实践的评析","d":"践的评析**张老师采用逆向设计模式，先确定单元最终学习成果，制定详细评价量规，再反向安排学习任务与课时，整体设计符合逆向设计的核心理念，具有突出的优势。其一，目标导向清晰，教学针对性强。以最终成果为起点反向设计教学，所有学习任务都指向明确的能力目标，避免了传统教学“走一步看一步”的盲目性，也让学生清晰知晓学习的终点要求，提升学习的目标感与主动性。其二，评价前置，实现教-学-评一致性。提前制定评价量规，让学生清楚成果的评价标准，能够引导学生自主对照标准调整学习过程，也为教学评价提供了明确依据，有利于形成教学闭环。其三，锻炼逆向思维与整体规划能力。"},{"t":"李老师问题教学模式实践的评析","d":"践的评析**李老师采用问题教学模式，借助春游租车费用预算的真实生活问题引入一元一次不等式的学习，引导学生在解决实际问题中自主归纳解法，整体践行了问题教学的核心逻辑，育人价值突出。其一，真实问题驱动，激发内在学习动机。租车预算是学生生活中真实可感的场景，打破了数学知识的抽象感，让学生感受到知识的应用价值，有效激发探究兴趣，避免了传统数学教学的枯燥感。其二，做中学建构知识，培养问题解决能力。学生在解决预算问题的过程中，自主调动已有知识，尝试、调整、归纳不等式的解法，知识不是教师灌输的，而是学生在问题解决中自主建构的，同时也培养了分析问题、解决实际问题的能力。其三，渗透数学应用意识，落实核心素养。将。"}]},{"t":"（2）分析项目探究教学、STEM教学实施过程中的共同现实挑…","items":[{"t":"两类模式实施的共同现实挑战","d":"实挑战第一，教师端：备课负担大幅增加，专业能力面临挑战。两类模式都不再是传统的“教教材”，而是需要教师自主开发课程、设计项目、整合资源、设计评价体系。比如学校科学组开发校园生态改造、智能灌溉等STEM主题课程，需要教师跨学科整合科学、数学、工程、技术等多领域知识，还要设计项目流程、准备实践材料、设计评价方案，工作量远大于传统教学，导致教师备课压力大。同时，传统分科培养背景下的教师大多只精通单一学科，跨学科知识储备不足，项目设计与引导能力参差不齐，容易导致项目教学质量参差不齐。第二，效率端：课时占用多，系统知识覆盖不足。项目探究与STEM教学都需要大量的时。"},{"t":"教师端：备课负担大幅增加，专业能力面临挑战","d":"备课负担大幅增加，专业能力面临挑战。两类模式都不再是传统的“教教材”，而是需要教师自主开发课程、设计项目、整合资源、设计评价体系。比如学校科学组开发校园生态改造、智能灌溉等STEM主题课程，需要教师跨学科整合科学、数学、工程、技术等多领域知识，还要设计项目流程、准备实践材料、设计评价方案，工作量远大于传统教学，导致教师备课压力大。同时，传统分科培养背景下的教师大多只精通单一学科，跨学科知识储备不足，项目设计与引导能力参差不齐，容易导致项目教学质量参差不齐。"},{"t":"效率端：课时占用多，系统知识覆盖不足","d":"课时占用多，系统知识覆盖不足。项目探究与STEM教学都需要大量的时间开展实践、探究、制作、交流，课时安排紧张。相比传统讲授式单位时间内的知识传递量，两类模式下学生获得的系统知识点相对较少，容易出现知识碎片化的问题。材料中提到的“系统知识点覆盖不足”，正是这类模式的普遍问题：学生参与度高、兴趣浓，但知识体系不够完整，学科逻辑的系统性不足，长期来看可能影响学生的知识基础扎实度，也与应试评价体系存在一定的张力。"},{"t":"学生端：能力分层加剧，学困生适配困难","d":"能力分层加剧，学困生适配困难。两类模式都对学生的自主探究能力、知识基础、思维水平有较高要求，学生之间的能力差异会被放大。基础扎实、思维活跃的学生能在项目中充分锻炼能力、快速成长；而基础薄弱、自主学习能力弱的学生，容易在自主探究中迷失方向，跟不上进度，出现“优生更优、学困生更困”的两极分化现象。这与逆向设计、问题教学中出现的问题本质一致，是所有高自主性教学模式共同面临的学情挑战。"},{"t":"适配端：内容适配性有限，并非所有内容都适合","d":"内容适配性有限，并非所有内容都适合。两类模式都有其适用边界，不是所有教学内容都适合用项目或STEM的方式开展。比如基础概念、定义定理、系统的知识体系，用讲授式效率更高；如果盲目将所有内容都项目化，不仅效率低下，还容易出现内容理解肤浅、基础不牢的问题。材料中提到“并非所有的教学内容都适合采用项目式学习的方式开展”，正是对这一适配边界的清醒认知。**。"}]},{"t":"（3）论述教师选择教学模式的主要依据","items":[{"t":"教师选择教学模式的主要依据","d":"要依据，说明如何避免教学模式运用的形式化倾向。【解析】教学模式没有绝对的优劣之分，只有适不适合的区别。教师选择教学模式，必须立足教学目标、教学内容、学生学情、教学条件等多重依据，理性选择、灵活运用，才能避免为了创新而创新的形式化倾向，真正发挥模式的育人价值。**。"},{"t":"依据教学目标的定位选择模式","d":"择模式。教学模式是服务于育人目标的工具，选择的根本依据是教学目标。如果教学目标是系统传授基础知识、夯实学科基础，那么高效的讲授式教学更合适；如果目标是培养学生的问题意识与应用能力，适合采用问题教学模式；如果目标是强化成果意识、锻炼逆向思维与任务规划能力，适合采用逆向设计模式；如果目标是培养跨学科综合素养、实践创新能力，适合采用项目探究与STEM教学模式。不能脱离目标谈模式创新，否则就会本末倒置。"},{"t":"依据教学内容的特点匹配模式","d":"配模式。不同的教学内容有不同的属性，适配的模式也不同。对于基础概念、抽象定义、系统的学科原理，讲授式效率更高，能够快速帮助学生建立知识框架；对于应用性强、与生活联系紧密的内容，适合用问题教学，让学生在应用中理解知识；对于有明确成果标准、强调能力落地的内容，适合逆向设计；对于综合性强、跨学科的实践主题，适合项目探究与STEM模式。比如数学中的基础概念学习，不适合全程用项目式，而应用类内容则适合结合生活问题展开。"},{"t":"依据学生的学情特点调整模式","d":"整模式。学生的年龄阶段、认知水平、知识基础、能力结构，直接决定模式的适配性。低年级、基础薄弱的学生，需要更多的引导与小步子教学，不宜采用自主性太强、难度太高的探究模式；高年级、基础扎实、思维活跃的学生，可以给予更多的自主探究空间，更多采用项目式、问题式教学。同时要考虑班级的整体水平与分层差异，避免一刀切的模式套用。"},{"t":"依据教学的资源条件适配模式","d":"配模式。教学模式的落地需要课时、场地、资源、师资等条件支撑。课时充足、实践资源丰富、师资能力强的学校，可以更多开展项目探究与STEM教学；课时紧张、资源有限、师资不足的情况下，要优先保障基础教学的效率，适度开展探究活动。不能脱离实际条件盲目照搬先进模式，否则只会流于形式。**。"}]}]},{"id":"预测6-3-36","num":36,"title":"36 自我效能·目标定向","subject":"教心","blocks":[{"t":"（1）自我效能感理论","items":[{"t":"三名学生的自我效能感水平及对学习行为的影响","d":"水平及对学习行为的影响第一，小陈：自我效能感中等偏上但稳定性弱，呈现“结果依赖性”特征。小陈数学基础较好，说明其具备一定的成功经验支撑，对熟悉、有把握的题目有较高的效能感；但他的自我效能感高度绑定考试分数与班级排名，缺乏稳定的内在支撑。一旦成绩下滑，就快速陷入自我否定，效能感断崖式下降。对学习行为的影响体现在三个层面：其一，任务选择保守，回避挑战，答题时只敢回答自己有把握的题目，不敢尝试不确定的难题，限制了能力提升的空间；其二，抗挫能力弱，成绩出现波动就自我怀疑，无法理性分析问题原因；其三，情绪唤醒过度，考前极度焦虑，考试中大量认知资源被情绪消耗，影响正。"},{"t":"小陈：自我效能感中等偏上但稳定性弱，呈现“结果依赖性”特征","d":"自我效能感中等偏上但稳定性弱，呈现“结果依赖性”特征。小陈数学基础较好，说明其具备一定的成功经验支撑，对熟悉、有把握的题目有较高的效能感；但他的自我效能感高度绑定考试分数与班级排名，缺乏稳定的内在支撑。一旦成绩下滑，就快速陷入自我否定，效能感断崖式下降。对学习行为的影响体现在三个层面：其一，任务选择保守，回避挑战，答题时只敢回答自己有把握的题目，不敢尝试不确定的难题，限制了能力提升的空间；其二，抗挫能力弱，成绩出现波动就自我怀疑，无法理性分析问题原因；其三，情绪唤醒过度，考前极度焦虑，考试中大量认知资源被情绪消耗，影响正常发挥，形成“越想考好越考不好”的恶性循环。"},{"t":"小林：高且稳定的自我效能感，呈现“能力成长性”特征","d":"高且稳定的自我效能感，呈现“能力成长性”特征。小林对自身的学习能力有积极稳定的判断，相信通过努力可以提升水平、解决问题。对学习行为的影响十分积极：其一，主动选择挑战性任务，乐于主动挑战综合性难题，不畏惧失败；其二，挫折坚持性强，考试失利后不会自我否定，而是主动查找知识漏洞，整理错题本、总结解题方法，将失败转化为提升的契机；其三，行为持续性好，坚持用方法优化学习，数学成绩稳步提升，形成“挑战—总结—提升”的良性循环；其四，情绪状态稳定，不会因为单次考试波动否定自身，学习的内在动力充足。"},{"t":"小周：低自我效能感，呈现“能力固化”特征","d":"低自我效能感，呈现“能力固化”特征。小周坚信自己天生学不好数学，对自身完成数学学习任务的能力持完全否定的判断，效能感处于极低水平。对学习行为的影响完全是负面的：其一，主动回避学习任务，上课状态消极、课后作业敷衍，不再主动参与学习任务；其二，自我设限保护自尊，为了避免努力后依然失败的尴尬，索性放弃努力，用“不努力”为自己的差成绩找借口，避免暴露“能力不足”；其三，行为陷入恶性循环，越不努力成绩越差，成绩越差越不相信自己能学好，最终彻底放弃。**。"},{"t":"影响自我效能感形成的主要因素","d":"主要因素**第一，直接成败经验是核心影响因素。个体亲身经历的成功与失败是影响自我效能感的最强因素：成功经验会提升效能感，反复失败会削弱效能感。小林在持续的学习中积累了“努力就能提升”的成功经验，因此效能感稳步提升；小周经历多次学习失败，形成了“自己学不好”的负面经验，效能感持续走低；小陈虽然基础不错，但缺少应对挫折的成功经验，一次下滑就冲击效能感。"}]},{"t":"（2）运用自我价值理论","items":[{"t":"类型判断与依据：小周属于低趋高避型（逃避失败者）","d":"**小周属于低趋高避型（逃避失败者），核心特征是对成功的趋近动机弱，对失败的回避动机强，学习的核心动力不是追求成功，而是避免失败带来的自我价值伤害。判断依据体现在两个维度：其一，低趋：对学习成功没有主动追求的欲望，上课状态消极、课后作业敷衍，不主动参与学习任务，不期待通过努力获得好成绩，对学业进步没有向往。其二，高避：高度恐惧失败对自尊的打击，认为自己天生学不好数学，为了保护自己的自尊，索性选择放弃努力。这种选择本质上是一种自我防御：如果努力了还是学不好，就等于证明自己能力差，会彻底摧毁自我价值；而不努力的话，失败就可以归因于“没好好学”，而非能力不足，从而维护自尊。**。"},{"t":"行为背后的心理机制：自我价值理论认为","d":"**自我价值理论认为，学生的自我价值感源于能力的展示，学业成功被视为个人能力的证明，而能力被很多学生看作是固定的、天生的。对小周而言，他已经形成了“自己数学能力差”的核心认知，如果付出全力学习依然成绩不好，就等于坐实了“自己笨”的判断，这会直接打击自我价值，带来强烈的羞愧与自我否定。为了避免这种痛苦，他选择主动放弃努力，用“不投入”作为自我保护的屏障，让失败的原因指向“努力不足”而非“能力不足”，从而维持“只要我努力就能学好”的幻想，保护残存的自我价值。这种心理机制本质上是个体在长期失败体验下的自我防御策略，看似消极放弃，实则是为了避免更深的自我伤害。"},{"t":"转化小周的教育建议","d":"#####（2）运用自我价值理论，判断小周属于四种动机类型中的哪一种，并结合其学习表现说明判断依据，分析其行为背后的心理机制，并为王老师提出转化小周的教育建议。【解析】自我价值理论从自尊保护的视角解释学生的学习动机，认为学生的核心动机是维护自我价值感，能力、成功、自我价值三者形成连锁关系。基于对成功的趋近与对失败的回避两个维度，学生可分为高趋低避、高趋高避、低趋高避、低趋低避四种类型，小周属于典型的低趋高避型，即逃避失败者。"},{"t":"创设低风险成功情境，阶梯式积累成功经验","d":"阶梯式积累成功经验。降低任务难度，为小周设计符合其水平的阶梯式学习任务，从最基础的题目入手，让他在不断完成小任务的过程中获得成功体验，逐步打破“自己学不好”的认知。每次成功都及时肯定，让他感受到努力带来的进步，逐步建立“努力就能进步”的联结，而不是用难题反复打击其信心。"},{"t":"引导正确归因，剥离能力与自我价值的绑定","d":"力与自我价值的绑定。通过归因训练，引导小周将成绩好坏归因为努力程度、解题方法、练习量等可控、可改变的因素，而非天生能力。比如考得不好时，引导他分析是哪些知识点没掌握、哪种题型不熟练，而不是归因为“自己笨”。同时强调能力的成长性，让他明白数学能力可以通过练习逐步提升，不是天生固定的，打破“能力天生决定论”的认知。"}]},{"t":"（3）结合目标定向理论","items":[{"t":"小陈与小林的目标定向类型与行为差异","d":"类型及其学习行为差异，并结合《关于做好2026年普通高校招生工作的通知》的要求，阐述教师应如何引导学生形成积极的成就目标定向。"},{"t":"小陈：表现目标定向，持能力实体观","d":"持能力实体观。小陈默认能力是固定的、天生的，学习的核心目的是通过好分数、好排名向他人证明自己的能力，获得正面评价。其行为差异体现在：其一，任务选择保守，回避可能暴露能力不足的挑战性任务，只敢做有把握的题目，避免挑战失败影响“聪明”的形象；其二，价值绑定分数，过度看重班级排名与分数高低，将成绩等同于自身能力与价值；其三，挫折承受力弱，成绩下滑就陷入自我否定，把失败归因为能力不足，容易产生自我怀疑；其四，情绪压力大，考试过度焦虑，担心考不好证明自己能力差，大量认知资源被情绪消耗，影响发挥。第二，小林：掌握目标定向，持能力增长观。小林认为能力是可以通过努力、练。"},{"t":"小林：掌握目标定向，持能力增长观","d":"恰好对应两种典型的目标定向，在学习行为、挫折反应、发展路径上呈现显著差异。结合教育部相关通知中加强学业指导、关注心理健康的要求，教师需要系统引导学生形成积极的掌握目标定向。**。"},{"t":"引导学生形成积极成就目标定向的实践路径","d":"目标定向的实践路径**教育部相关通知明确要求加强学生学业发展指导、关注学习心理健康，引导学生形成积极的成就目标定向，是落实这一要求的核心抓手，具体可从以下方面推进：。"},{"t":"传递能力增长观，重塑学生的能力认知","d":"学生的能力认知。通过课堂渗透、主题班会、榜样分享等多种方式，向学生传递“能力可塑、努力提升”的成长型思维。结合学科学习规律，让学生明白知识可以积累、技能可以训练、方法可以优化，成绩提升的本质是能力的成长，而非天生智力的证明。比如用学生进步的真实案例，说明努力带来的能力变化，打破“能力天生固定”的实体观。"}]}]}]},{"id":"预测6-4","name":"预测4","questions":[{"id":"预测6-4-31","num":31,"title":"31 杨贤江/黄炎培","subject":"中教史","blocks":[{"t":"杨贤江与黄炎培教育思想的共通之处","items":[{"t":"立足救亡语境，回应时代需求","d":"代需求**二者都诞生于民族危机深重的近代中国，将教育改革与国家命运深度绑定，都以破解传统教育空疏无用的积弊、培养适配时代需求的人才为出发点。面对近代中国内忧外患的社会局面，二人都拒绝脱离现实的书院式教育，主张教育必须回应社会转型的迫切需要，将教育视为挽救民族危亡、推动社会进步的重要力量，共同呼应了救亡图存的时代主题。**。"},{"t":"批判传统教育，主张面向实际","d":"向实际**二者都猛烈抨击传统教育脱离生产生活、重文轻实、空谈心性的弊端，反对教育沦为科举附庸、培养脱离社会的士大夫。杨贤江批判传统教育是阶级对立的上层建筑，脱离劳动与大众需求；黄炎培直指传统学校教育的知识技能与社会生活完全脱节，学生毕业之后无用武之地。二者都主张教育必须扎根社会现实，服务社会发展，打破劳心与劳力分离的传统格局。**。"},{"t":"重视劳动价值，秉持平民取向","d":"民取向**二者都反对教育的贵族化特权，认同劳动的教育价值，主张教育与生产劳动相结合。杨贤江提出教育是劳动力再生产的手段，是赋予劳动者特定资质的社会劳动领域；黄炎培强调职业教育手脑并用、做学合一，本质上都是对“万般皆下品，惟有读书高”传统观念的反拨。二者都致力于让教育惠及普通民众，让底层群体通过教育获得生存发展的能力，具有鲜明的平民化色彩。**。"}]},{"t":"杨贤江与黄炎培教育思想的核心差异","items":[{"t":"理论基础与教育本质认知的分野","d":"知的分野**杨贤江以马克思主义历史唯物主义为理论根基，首次系统阐明教育的双重属性：教育既是社会的上层建筑，由经济基础决定并反作用于经济基础；也是劳动力再生产的手段，是将单纯劳动力培养为特殊劳动力的社会劳动领域。他还从历史演进的视角分析教育本质的变迁，指出私有制产生后教育具有鲜明的阶级性，未来共产主义社会的教育将在更高形态上回归劳动属性。黄炎培则以实用主义教育思想为核心，秉持改良主义立场，更多从社会功能与经济价值层面认知教育。他认为教育的核心价值是解决生计问题、适配实业发展需求，将职业教育视为改良社会、振兴实业的核心工具，并未从社会形态与阶级结构的深层剖析教育的本质属性。**。"},{"t":"核心目标与价值指向的不同","d":"不同**杨贤江的教育目标以人的全面发展与社会革命为指向。他提出“全人生的指导”思想，主张对青年从人生观、政治观、学校观、生活观四个维度进行全面引导，培养身心健康、兼具知识技能与社会理想的革命青年。其最终目标是通过社会革命消灭阶级压迫，实现教育的真正平等与普及，让每个人都能获得自由全面的发展。黄炎培的教育目标以职业发展与社会改良为核心。他将职业教育的目标凝练为“使无业者有业，使有业者乐业”：一方面通过职业技能培训为近代工商业培养适用人才，解决社会失业与底层民众生计问题；另一方面通过“敬业乐群”的职业道德教育，培养职业认同与协作精神，实现职业发展与社会稳定的双重目标。**。"},{"t":"实践路径与教育重心的差异","d":"差异**杨贤江的教育实践聚焦青年思想与成长引导，侧重意识形态与人生发展层面。他针对近代青年在人生观、职业、社交、生活等方面的普遍困境，构建了涵盖健康生活、劳动生活、公民生活、文化生活的全人生指导体系。他强调青年要主动干预政治、投身社会革命，将教育视为革命斗争的重要武器，服务于社会变革的大局。黄炎培的教育实践聚焦职业教育体系构建，侧重经济与技能层面。他发起成立中华职业教育社，推动建立从初级到高级、贯穿整个职业生涯的职业教育系统，倡导社会化、科学化的办学方针，坚持手脑并用、做学合一的教学原则，致力于推动职业教育的制度化、普及化，让教育直接服务于实业发展与民生改善。**。"}]},{"t":"二者教育思想对近代中国教育变革的历史贡献","items":[{"t":"杨贤江：开创马克思主义教育的中国化探索","d":"在《新教育大纲》中批判多种错误教育思潮，明确教育的阶级性，运用马克思主义分析教育本质，因此D正确。A错误，教育起源于劳动实践是劳动起源说，不是《教育史ABC》的核心表述；B错误，杨贤江认为教育本质随社会历史变化，不是永恒不变；C错误，全人生指导思想的核心是培养全面发展的人，不是只培养专业学习能力。故选D。**21.。"},{"t":"黄炎培：推动中国职业教育的体系化发展","d":"提出“使无业者有业，使有业者乐业”，既关注职业谋生，也关注职业志趣和人生价值实现，B正确。A说职业教育体系应独立、避免与普通教育交叉，不准确；C说“社会化”是首要方针，核心是实现供需精准对接，表述过于绝对；D说黄炎培对农村农业职业教育持保守态度，错误，他重视农村职业教育。**18.。"},{"t":"共同推动近代教育的多元转型","d":"元转型**二者分别从革命维度与建设维度探索了中国教育的两条出路，共同打破了传统教育的单一格局，丰富了近代中国的教育思想谱系。它们一个指向社会革命的长远目标，一个回应社会改良的现实需求，共同推动教育从封建教化向近代国民教育转型，为后世教育发展留下了宝贵的思想遗产。**。"}]},{"t":"二者教育思想的时代局限性","items":[{"t":"杨贤江教育思想的探索性局限","d":"性局限**作为中国最早的马克思主义教育理论家，其思想处于早期探索阶段，对教育自身的独特规律、对教育的文化传承功能与人本价值的探讨仍不够充分。受当时革命斗争环境的影响，他过于强调教育的革命工具属性与阶级属性，对教育相对独立性的论述相对不足，部分观点带有鲜明的时代印记。**。"},{"t":"黄炎培教育思想的改良主义局限","d":"主义局限**其思想本质上属于教育改良主义范畴，试图在不触动根本社会制度的前提下，通过职业教育解决贫困、失业等深层社会问题，没有认识到社会制度变革是教育发展的根本前提，因此很多理想难以真正落地。同时，职业教育思想相对侧重技能培养与生计功能，对人的全面发展、教育的人文价值与精神启蒙功能的关注有所不足。**。"},{"t":"共同的时代制约：二者的教育理想都受到半殖民地半封建社会条件的根本制约","d":"**二者的教育理想都受到半殖民地半封建社会条件的根本制约。在军阀混战、经济凋敝、政局动荡的近代中国，无论是革命导向的青年教育还是改良导向的职业教育，都难以获得充分落地的社会环境与物质基础，实际成效受到很大限制，无法完全实现各自的教育理想。####32.结合外国教育史知识，简述赫尔巴特教育学两大理论基础、四阶段教学理论；阐释“教育性教学”核心内涵与内在逻辑；论述赫尔巴特教育理论的历史贡献与局限。"}]}]},{"id":"预测6-4-32","num":32,"title":"32 赫尔巴特","subject":"外教史","blocks":[{"t":"赫尔巴特教育学的两大理论基础","items":[{"t":"伦理学基础：教育目的的价值规范","d":"教育目的的价值规范**伦理学是赫尔巴特教育目的论的根本依据，其核心是五种相互联系、不可偏废的道德观念，是维护社会秩序的永恒准则，也是教育要达成的最高目标。一是内心自由，指人对真善美形成清晰的理性认知后，能够自觉依照道德规范行事，实现意志与理性的统一；二是完善，指人调节自身意志、做出价值判断的尺度与能力，是个体道德素养的内在支撑；三是仁慈，即绝对的善，要求人无私为他人谋福祉，实现自我意志与他人意志的协调；四是正义，即守法观念，主张通过约定与法律化解不同意志的冲突，维护社会秩序；五是公平或报偿，强调善有善报、恶有恶报，引导人对自身行为的道德后果形成清晰认知。"},{"t":"心理学基础：教学过程的科学依据","d":"教学过程的科学依据**赫尔巴特是西方历史上首位将心理学作为独立学科研究，并系统将其引入教育领域的思想家，其心理学核心是统觉理论。统觉理论揭示了人的认识形成规律：当新的感官刺激进入意识时，若能唤起意识阈下已有的相似观念并与之结合，就会形成新的统觉团，也就是新的认识结果；若意识中已有相似观念，二者的结合则会进一步巩固认识。在统觉过程中，兴趣是核心动力，它是观念的积极活动状态，能够唤醒原有观念、推动新旧观念的结合，赋予学习活动主动性。统觉心理学为教学过程、课程设计提供了科学的心理学依据，彻底改变了传统教育仅凭经验与思辨的状态，推动教育学向科学方向迈进。**。"}]},{"t":"四阶段教学理论的核心架构","items":[{"t":"赫尔巴特以统觉心理学为基础","d":"为基础，结合儿童兴趣发展与思维活动的规律，提出了经典的教学形式四阶段理论，将课堂教学过程抽象为规范、有序的四个阶段，实现了教学流程的系统化。第一阶段是明了（清晰）。这一阶段新的表象通过感官呈现，学生处于专心的思维状态，兴趣处于注意阶段。教师主要采用直观教学、清晰讲解的提示教学法，帮助学生获得清晰的感性表象，为新旧观念的联合做好准备。第二阶段是联合（联想）。新表象进入意识后，唤醒原有观念活动，新旧观念开始产生联结但尚未形成最终结论，学生处于从专心向审思过渡的状态，兴趣处于期待阶段。教师通过自由谈话、分析引导的教学方法，帮助学生梳理新旧知识的关联，为知识系统化奠基。第三阶段是系统。初步联结的新旧观。"}]},{"t":"“教育性教学”原则的核心内涵与内在逻辑","items":[{"t":"核心内涵：赫尔巴特明确提出：不存在无教学的教育，也不存在无教育的教学","d":"是摆脱旧式分工造成的人的片面、畸形发展，实现人的体力、智力、道德、个性、审美等全方位、自由充分的发展，最终实现人的彻底解放。这一目标的实现以高度发达的生产力、废除私有制、消灭阶级差异为社会基础，依托德育、智育、体育、综合技术教育协同推进，是社会主义教育的终极价值追求。**。"},{"t":"内在逻辑：首先，道德认知是德行形成的前提","d":"将学业成绩窄化为唯一的育人目标。1.实践形式偏差：表面化落实，消解五育的育人实效。很多学校的五育落实停留在“开了课、搞了活动”的表面形式：德育空泛宣讲、美育用看视频代替动手创作、劳动教育走流程摆样子，没有真正落地育人价值。材料一中提到的综合育人开展形式化、德育实践环节不足，正是这类问题的集中反映。形式化的落实让五育沦为“完成任务”，无法真正发挥育人功能。1.评价导向偏差：唯分数评价，弱化五育落实动力。长期以来，中小学办学评价以升学率、分数为核心指标，五育成效不纳入核心评价体系，导致学校落实五育的内在动力不足。材料一中提出将五育成效纳入年度考核与督导评估，正是针对评价偏差的纠偏，但基层评价体系。"}]},{"t":"赫尔巴特教育理论的历史贡献与局限","items":[{"t":"历史贡献","d":"与局限性。【解析】近代中国半殖民地半封建的社会语境下，教育救国成为知识界探索救亡道路的核心方向之一。杨贤江与黄炎培作为民国时期极具代表性的教育思想家，分别立足马克思主义理论视角与职业教育实践路径，构建了各具特色的教育思想体系。前者以历史唯物主义剖析教育本质，提出“全人生指导”的青年教育主张；后者以实用主义为内核，倡导职业教育以实现“使无业者有业，使有业者乐业”的目标。二者既共享时代变革的思想底色，又在理论根基、实践路径上形成鲜明分野，共同推动了中国教育的近代转型。**。"},{"t":"确立了教育学的独立学科地位","d":"科地位。赫尔巴特的《普通教育学》构建了首个系统完整的教育学理论体系，涵盖教育目的、课程、教学、德育等核心领域，使教育学彻底从哲学、神学的附庸中独立出来，成为一门有自身研究对象、理论基础与方法体系的独立学科，开启了教育学发展的新纪元。"},{"t":"推动了教育学的科学化进程","d":"进程。首次将系统的心理学研究引入教育领域，以统觉理论解释学习过程，以心理规律设计教学环节，打破了传统教育仅凭经验、思辨的局限，为教育心理学的发展奠定了基础，推动教育学从经验之学走向科学之学。"},{"t":"构建了经典的教学实践范式","d":"范式。四阶段教学理论、课程相关与集中原则、教育性教学原则等，为学校教学提供了可操作的规范，深刻影响了世界各国的师范教育与中小学教学实践。20世纪初该理论传入中国，对清末废科举、兴学堂，以及近代师范教育体系的建立起到了重要的推动作用。"},{"t":"深化了对教育本质的认识","d":"识。教育性教学原则深刻揭示了知识传授与品德培育的内在联系，批判了割裂教学与德育的错误倾向，确立了教书育人的核心命题，对后世教育理论发展产生了深远影响。**。"}]}]},{"id":"预测6-4-33","num":33,"title":"33 教学过程本质与规律","subject":"教原","blocks":[{"t":"（1）运用教学过程本质相关观点","items":[{"t":"王老师：秉持“特殊认识说”本质观，以系统知识传授为核心","d":"依靠班集体舆论影响学生，又同步进行个别谈话，体现集体教育与个别教育相结合；既讲授道德规范，又组织公益实践，体现知行统一；依靠规章制度约束行为，坚持长善救失，体现正面引导与纪律约束相结合、依靠积极因素克服消极因素。A中“必须依托班级制度强制约束才能实现”过于绝对；C把品德转化关键归结为规章制度，片面；D说道德实践起决定性作用，也不准确。因此选B。**9.。"},{"t":"陈老师：秉持“交往建构说”本质观，以学生主动建构为核心","d":"分别持有的教学过程本质观，评析各自合理性与局限。"}]},{"t":"（2）提炼争论反映的教学过程基本规律","items":[{"t":"争论反映的教学过程基本规律与核心关系","d":"本规律，说明教学要处理的核心关系，并结合校长总结阐述你对教学过程本质的理解。"},{"t":"间接经验与直接经验的辩证统一规律","d":"辩证统一规律。教学过程是间接经验学习与直接经验获得的统一，学生以学习间接经验为主，同时必须以直接经验为认知基础。王老师过度侧重间接经验的系统传授，忽视学生的直接经验与探究体验，导致课堂脱离学生生活体验；陈老师过度侧重直接经验式的探究，忽视系统间接经验的学习，导致知识基础薄弱。二者的争论，本质上是间接经验与直接经验孰轻孰重的平衡之争，反映了二者必须结合的基本规律，任何偏向一端都会违背教学规律，影响育人质量。"},{"t":"对教学过程本质的深层理解","d":"理解**结合校长的总结与教学过程的基本规律，教学过程的本质是多重属性的统一体，而非单一的认识或交往过程，具有多维的内涵。首先，教学过程是特殊的认识过程，这是教学的基础属性。教学的核心任务之一是引导学生系统掌握科学文化知识，间接认识世界，这是教学效率性的根本保障。脱离了知识掌握的基础，能力发展、价值培育都会沦为空谈。其次，教学过程是以交往为基础的双边活动过程，这是教学的运行属性。教学不是单向的传递，而是师生、生生之间的互动交往，教师主导与学生主体的统一是教学的基本形态，只有充分调动双方的主动性，才能实现教与学的协同。再次，教学过程是促进学生全面发展的价值实现过程，这是教学的根本属性。教学的终极目。"}]},{"t":"（3）、二，论述教学过程基本规律对优化教学实践的指导意义。","items":[{"t":"坚持间接经验与直接经验结合，破解知识与实践脱节难题","d":"验结合，破解知识与实践脱节难题**针对当前课堂“灌输式”与“形式化探究”两种极端，教学必须坚持间接经验为主、直接经验为基的原则，实现二者的有机结合。一方面，要守住系统知识传授的底线，发挥教师的专业引导作用，系统、高效地传递学科基础知识体系，保障学生掌握扎实的间接经验，避免探究活动泛化、知识碎片化的问题。另一方面，要丰富学生的直接经验，将知识学习与生活实践、探究活动结合，通过情境创设、小组探究、实践操作等方式，为抽象知识提供感性经验支撑，让学生在直接体验中深化对间接经验的理解，避免机械记忆、知识僵化的问题。"},{"t":"坚持知识掌握与能力发展统一，破解知能分离的育人困境","d":"展统一，破解知能分离的育人困境**针对“重知轻能”与“重能轻知”两种偏向，教学必须坚持知识与能力互为基础、相互促进的规律，实现知能并进。一方面，要夯实知识基础，明确知识是能力发展的前提，系统梳理学科知识体系，让学生掌握扎实的核心概念、原理与方法，为能力发展奠定根基，避免脱离知识空谈能力的形式主义。另一方面，要强化能力导向，将知识学习与能力培养同步推进，在知识传授中渗透思维方法、探究策略的培养，通过启发式、探究式教学，引导学生独立思考、主动建构，学会运用知识解决实际问题，避免“高分低能”的知识僵化问题。"},{"t":"坚持教师主导与学生主体协同，破解教与学失衡的问题","d":"体协同，破解教与学失衡的问题**针对“教师中心”与“学生中心”两种极端，教学必须坚持教师主导与学生主体相统一的规律，实现教与学的动态平衡。一方面，要强化教师的主导责任，教师要做好教学的设计者、引导者与组织者，精准把握教学目标、系统设计教学过程、适时提供认知支架，保障教学的方向与效率，避免放任学生盲目探索。另一方面，要充分尊重学生的主体地位，激发学生的学习主动性，通过启发提问、合作探究、任务驱动等方式，引导学生主动思考、自主建构，让学生成为学习的主人，避免被动灌输。比如课堂教学中，教师既要精讲核心知识、把控教学节奏，也要给学生留出思考、讨论、探究的空间，实现主导性与主体性的平衡。**。"},{"t":"坚持智力与非智力因素并重，破解课堂沉闷与形式化问题","d":"并重，破解课堂沉闷与形式化问题**针对课堂“重智轻情”与“重情轻质”两种偏向，教学必须坚持智力与非智力相互依存的规律，实现认知发展与情感动力的协同。一方面，要优化教学过程，增强教学的趣味性、启发性与吸引力，关注学生的学习兴趣、情感体验与意志品质培养，通过良好的师生互动、丰富的活动设计，激发学生的内在学习动力，避免课堂沉闷、学生被动的问题。另一方面，要坚持认知目标为核心，所有的互动、活动都要服务于学生的知识学习与能力发展，避免为了活跃而活跃的形式主义，让非智力因素真正服务于智力发展。比如课堂小组讨论，既要营造活跃的交流氛围，也要围绕核心知识问题展开，保证讨论的深度与实效。**。"},{"t":"坚持知识传授与价值塑造融合，破解育人片面化问题","d":"造融合，破解育人片面化问题**针对教学中“重教书轻育人”的倾向，教学必须坚持教育性教学原则，实现知识传授与思想品德教育的统一。一方面，深入挖掘学科知识中的育人元素，将价值引领融入知识教学过程，通过知识的学习，培养学生正确的世界观、人生观与价值观，实现润物细无声的价值培育。另一方面，价值培育要以知识为载体，避免脱离知识的空洞说教，让学生在知识学习的过程中，自然形成正确的价值观念与道德品质。####34.阅读材料，回答问题。#####（1）结合学习动机培养的相关理论，分析小钱产生“习得性无助”倾向的原因，并为刘老师提出培养小钱学习动机的具体措施。"}]}]},{"id":"预测6-4-34","num":34,"title":"34 动机培养与激发","subject":"教心","blocks":[{"t":"（1）结合学习动机培养的相关理论","items":[{"t":"小钱习得性无助倾向的深层成因","d":"深层成因第一，消极归因模式是核心诱因。小钱学习刻苦、长期刷题投入大量时间，但因学习方法死板、不懂变通，成绩始终徘徊在及格线。连续的努力无果没有引导他反思策略与方法的问题，反而让他得出“自己天生不适合学数学”的结论，将失败完全归因为内部、稳定、不可控的能力因素。根据成败归因的规律，当个体将失败归因为稳定且不可控的能力时，会产生强烈的无力感，认为再努力也无法改变结果，进而放弃尝试。小钱正是陷入了这种归因偏差：不认为是方法可以调整，而是认定自己能力不足无法改变，最终从“努力学不好”滑向“天生学不好”的自我否定，形成习得性无助的认知根源。第二，连续失败的直接经验。"},{"t":"消极归因模式是核心诱因","d":"因。小钱学习刻苦、长期刷题投入大量时间，但因学习方法死板、不懂变通，成绩始终徘徊在及格线。连续的努力无果没有引导他反思策略与方法的问题，反而让他得出“自己天生不适合学数学”的结论，将失败完全归因为内部、稳定、不可控的能力因素。根据成败归因的规律，当个体将失败归因为稳定且不可控的能力时，会产生强烈的无力感，认为再努力也无法改变结果，进而放弃尝试。小钱正是陷入了这种归因偏差：不认为是方法可以调整，而是认定自己能力不足无法改变，最终从“努力学不好”滑向“天生学不好”的自我否定，形成习得性无助的认知根源。"},{"t":"培养小钱学习动机的具体措施","d":"体措施**针对小钱的状态，培养学习动机需要从归因重构、效能提升、方法赋能、目标阶梯四个维度系统推进，帮助他打破恶性循环，重建学习动力。"}]},{"t":"（2）从学习动机激发的角度","items":[{"t":"刘老师当前课堂做法的不足","d":"不足，并针对小赵的情况提出激发其数学学习动机的建议。"},{"t":"竞争设计不合理，加剧学习分化，削弱多数学生动机","d":"学习分化，削弱多数学生动机。刘老师采用小组竞赛的方式调动氛围，但竞赛门槛设置不当，仅优等生能够参与互动、获得成就感，多数基础薄弱的学生沦为旁观者，无法在竞赛中获得参与感与成功体验。对于基础较差的学生而言，竞赛带来的不是动力，而是持续的挫败感，进一步降低了他们的学习自信与参与意愿，导致“优等生更积极、学困生更退缩”的两极分化，反而拉低了全班的整体学习积极性。"},{"t":"针对小赵的数学学习动机激发策略","d":"机激发策略**小赵的核心问题是数学学习的内部动机不足，错误地认为数学对自己的篮球职业发展毫无用处，只需及格即可；但他在篮球社团中展现出了优秀的数理思维与主动探究能力，具备学好数学的潜力。激发他的数学学习动机，核心是实现动机迁移，将篮球领域的兴趣与能力迁移到数学学习中，从价值感知、兴趣激发、效能提升三个维度精准发力。"}]},{"t":"（3）结合“双减”政策要求","items":[{"t":"学习动机培养与激发的辩证关系","d":"关系，实现课堂减负提质、促进全班学生形成持续的学习动力。"},{"t":"实现减负提质的实践路径","d":"径第一，坚持培养为基，构建长效动机体系，筑牢减负提质的根本支撑。“双减”减的是机械重复的作业负担与校外培训负担，但学生的学习不能没有持续的内在动力。这就需要将学习动机培养作为课堂教学的长期目标，系统推进。一是立足学生成长需要，尊重学生的兴趣爱好、发展诉求，让学习服务于学生的全面成长，而非单纯的应试，从根本上提升学习的价值感。二是系统开展成就动机训练，通过意识化、体验化、概念化、练习、迁移、内化的完整过程，帮助学生建立积极的成就动机，将学习与自身成长深度绑定。三是持续开展归因训练，引导学生形成积极的归因模式，将成败归因为努力、方法等可控因素，预防与破解习得。"},{"t":"坚持培养为基，构建长效动机体系，筑牢减负提质的根本支撑","d":"效动机体系，筑牢减负提质的根本支撑。“双减”减的是机械重复的作业负担与校外培训负担，但学生的学习不能没有持续的内在动力。这就需要将学习动机培养作为课堂教学的长期目标，系统推进。一是立足学生成长需要，尊重学生的兴趣爱好、发展诉求，让学习服务于学生的全面成长，而非单纯的应试，从根本上提升学习的价值感。二是系统开展成就动机训练，通过意识化、体验化、概念化、练习、迁移、内化的完整过程，帮助学生建立积极的成就动机，将学习与自身成长深度绑定。三是持续开展归因训练，引导学生形成积极的归因模式，将成败归因为努力、方法等可控因素，预防与破解习得性无助，提升学习的韧性。四是重视自我效能感培养，通过阶梯式成功体验。"}]}]},{"id":"预测6-4-35","num":35,"title":"35 教学原则与方法","subject":"教原","blocks":[{"t":"（1）分析四位教师的教学实践分别体现了或违背了哪些教学基本…","items":[{"t":"物理林老师：多重原则协同落地，教学实效突出","d":"多重原则协同落地，教学实效突出**林老师的电路教学充分体现了直观性原则、启发性原则、理论联系实际原则与巩固性原则，是高质量教学的典型代表。"},{"t":"历史方老师：直观手段运用失当，违背系统与巩固原则","d":"直观手段运用失当，违背系统与巩固原则**方老师的教学体现了直观性原则的部分要求，但违背了直观与讲解相结合的要求、系统性原则与巩固性原则，陷入了“重形式轻实效”的误区。"},{"t":"数学孙老师：知识巩固导向明确，违背启发与应用原则","d":"知识巩固导向明确，违背启发与应用原则**孙老师的教学体现了系统性原则与巩固性原则的部分要求，但违背了启发性原则与理论联系实际原则，属于典型的“灌输固化”模式。"},{"t":"英语周老师：探究方向符合理念，引导缺位导致形式化","d":"探究方向符合理念，引导缺位导致形式化**周老师的初衷是践行启发性原则与学生主体性理念，但由于教学设计粗糙，违背了启发性原则、系统性原则，最终导致讨论流于形式。"}]},{"t":"（2）分析中小学常用教学方法的特点","items":[{"t":"讲授法：系统高效的知识传递方法","d":"案例设问属于谈话法；小组讨论属于讨论法；影像演示属于。"},{"t":"演示法：直观形象的感知辅助方法","d":"模拟法庭推演属于角色扮演法。B中讨论法和谈话法顺序颠倒，且参观法不对；C中。"},{"t":"实验法：做中学的探究实践方法","d":"实习作业法不对；D中讲演法、参观法不对。故选A。**12.。"},{"t":"讨论法：互动共生的思维训练方法","d":"本应服务于核心知识的掌握与能力的提升，但周老师的讨论没有明确的知识目标与能力指向，学生在闲聊中没有获得系统的语言知识，也没有提升探究能力，教学活动没有围绕核心目标系统推进，最终“探究学习完全流于形式”"},{"t":"练习法：技能巩固的强化训练方法","d":"技能巩固的强化训练方法**练习法是学生在教师指导下，运用知识反复完成操作，形成技能技巧的方法。其核心特点是：针对性强、熟练度提升快，能够快速巩固知识、形成技能；但机械重复的练习容易固化思维，抑制学生的灵活性与创造力。练习法广泛适用于各类技能型内容的训练：一是基础知识的巩固，比如字词记忆、公式背诵、概念辨析；二是基础技能的熟练，比如数学运算、英语读写、解题技巧；三是解题方法的强化，通过变式练习提升知识迁移能力。材料中孙老师的同类习题训练，就是练习法的典型应用，能够快速提升固定题型的熟练度，但过度机械训练就会导致“题型稍有变化便无法应对”的问题。#####（3）结合材料。"}]},{"t":"（3）、二，论述教学原则对教学方法选择的指导作用，并为该校…","items":[{"t":"教学原则对教学方法选择的核心指导作用","d":"择的指导作用，并为该校教师优化教学方法提出建议。"},{"t":"直观性原则划定了教学方法的感知逻辑，要求方法实现“直观感知—抽象思维”的进阶","d":"方法的感知逻辑，要求方法实现“直观感知—抽象思维”的进阶。直观性原则决定了教学不能从概念到概念，必须有感性认知的支撑。这指导教师在选择方法时，抽象知识必须搭配直观手段，比如讲电路要配实验演示，讲历史要配史料素材；同时直观不能脱离讲解升华，不能为了直观而直观，避免陷入形式主义。材料中方老师的问题，就是只重直观形式，忽略了讲解升华，违背了直观与讲解结合的要求。"},{"t":"启发性原则锚定了教学方法的主体定位，要求方法平衡“教师主导—学生主体”的关系","d":"方法的主体定位，要求方法平衡“教师主导—学生主体”的关系。启发性原则的核心是激发学生的主动性与思维能力，这决定了教学方法既不能是单向灌输，也不能是放任自流。这指导教师选择方法时，讲授法要贯彻启发式，不能填鸭；探究法要做好引导，不能放羊。材料中孙老师的机械训练违背了启发性，压抑了学生思维；周老师的无引导讨论也违背了启发性，导致效率低下，二者都是没有把握好启发的尺度。"},{"t":"系统性原则明确了教学方法的目标主线，要求方法服务于知识体系的建构","d":"方法的目标主线，要求方法服务于知识体系的建构。系统性原则要求教学循序渐进、逻辑连贯，所有教学方法都要围绕核心知识目标展开。这指导教师不能为了追求形式创新而偏离知识主线，无论是实验、讨论还是练习，最终都要落脚到系统知识的掌握与能力的提升。材料中方老师的知识碎片化、周老师的讨论形式化，本质上都是脱离了系统性原则，方法没有服务于知识目标。"},{"t":"理论联系实际原则指明了教学方法的实践导向，要求方法实现“知行合一”的价值","d":"了教学方法的实践导向，要求方法实现“知行合一”的价值。理论联系实际原则要求教学联系生活、注重应用，这指导教学方法不能停留在书本层面，要增加实践应用环节。比如数学教学不能只练书本题型，要结合生活问题；理科教学不能只讲原理，要动手实验、解决实际问题，培养学以致用的能力。"}]}]},{"id":"预测6-4-36","num":36,"title":"36 学习迁移","subject":"教心","blocks":[{"t":"（1）结合学习迁移分类理论","items":[{"t":"学科知识割裂下的零迁移现象：跨学科未产生有效影响","d":"移现象：跨学科未产生有效影响**从迁移的效果维度划分，学生熟练掌握的数学函数知识完全无法应用到物理运动图像的学习中，两门学科知识在认知中互不互通，属于典型的零迁移，即两种学习之间没有产生明显的相互影响。从迁移的范围与距离来看，这种零迁移本质上是远迁移的失败。学生能够在数学学科内部的同类题型中熟练运用函数知识，属于近迁移，即原有经验在相似情境中的顺畅应用；但面对物理运动图像这一表面差异极大的新情境，学生无法识别二者的共通本质，无法实现跨学科的远迁移。"},{"t":"思维定势作用下的负迁移现象：固化模式干扰跨学科解题","d":"移现象：固化模式干扰跨学科解题**从迁移的效果维度划分，学生长期形成的数学机械刷题、套公式解题的固定模式，导致在跨学科综合任务中生搬硬套数学公式、忽略物理情境与本质意义，最终出现解题逻辑偏差，属于典型的负迁移，即先前的学习对后续学习产生了消极阻碍作用。从迁移的内在心理机制来看，这是同化性迁移的误用。同化性迁移指不改变原有认知结构，直接将已有经验应用到同类事物中。学生试图直接套用数学学科的解题认知结构处理物理问题，不对物理情境的条件、本质进行分析调整，强行用数学公式套入物理过程，本质上是用同化的方式处理不同质的新情境，最终导致错误。"},{"t":"教师支架支持下的条件性正迁移现象：引导下实现有限积极影响","d":"性正迁移现象：引导下实现有限积极影响**从迁移的效果维度划分，在“用数学语言描述运动世界”跨学科单元教学中，通过师生互动引导，学生能够短暂理解数理关联、跟上教学节奏，说明数学知识能够对物理学习产生积极的促进作用，属于条件性的正迁移，即一种学习对另一种学习产生了积极影响。但这种正迁移具有明显的局限性：从迁移的自主性来看，它依赖教师的外部支架引导，学生无法独立完成迁移，属于高路迁移的初级阶段。高路迁移指有意识地将抽象知识应用到另一情境，这里学生还无法自主完成这种意识性的迁移，必须依靠教师的提示才能建立关联。从迁移的距离来看，这种迁移只能在课堂教学的相似情境中实现，属于近迁移范畴；一旦脱离课堂支架。"}]},{"t":"（2）影响知识迁移的因素","items":[{"t":"主观层面：学生认知与思维的局限性制约迁移发生","d":"学生认知与思维的局限性制约迁移发生**。"},{"t":"已有经验的概括水平不足，知识锚定具体题型","d":"足，知识锚定具体题型。已有经验的抽象概括水平，是决定迁移能力高低的核心因素。概括水平越高，知识的适用范围越广，越容易实现跨情境迁移。学生在数学学习中，长期以专项训练、机械刷题为主，对一次函数、二次函数的掌握停留在“图像绘制步骤、斜率计算公式、解题套路”的具体操作层面，没有提炼出“函数是变量关系的量化表达、斜率本质是变化率、图像反映变化规律”等抽象的、一般性的原理。经验的概括度低，就导致知识的适用范围窄，只能在高度相似的数学题型中实现近迁移，无法迁移到表面形式不同、本质原理相通的物理情境中，这是跨学科迁移失败的根本认知原因。"},{"t":"信息加工方式固化，形成学科专属思维定势","d":"成学科专属思维定势。个体加工信息的习惯、风格与思维定势，会直接影响迁移的效果，定势在相似情境中起促进作用，在差异情境中起阻碍作用。学生在数学课堂中长期形成了“套公式、代数值、算结果”的信息加工模式，思维围绕解题技巧展开；而物理学科的学习需要“分析物理过程、明确约束条件、结合运动规律、建立量化关系”的加工逻辑，思维围绕现象本质展开。两种加工方式差异显著，学生习惯了数学的解题定势，面对物理问题时就会本能地套用数学模式，忽略物理本质，不仅无法实现知识迁移，还会产生负迁移，出现解题逻辑偏差。"},{"t":"主动迁移意识缺失，形成学科割裂认知定势","d":"成学科割裂认知定势。学习态度与迁移意识是影响迁移的重要主观变量，主动的迁移意识能够促使个体主动联结不同领域的知识。学生长期在分科教学的模式下学习，潜移默化地形成了“数学与物理是独立学科、知识互不关联”的认知定势，没有主动跨学科调用知识的意识。遇到物理运动图像问题时，学生只会从物理学科内部寻找思路，不会主动调取已掌握的数学函数知识，人为造成了知识的割裂，使得迁移失去了内在动力。**。"},{"t":"客观层面：教学与情境的差异性阻碍迁移实现","d":"教学与情境的差异性阻碍迁移实现**第一，学习材料与情境的相似性低，学科表征差异显著。学习材料、问题情境的相似性，是影响迁移发生的重要客观因素，相似性越高，迁移越容易发生。数学中的函数图像是抽象的数学模型，剥离了具体的物理意义，聚焦数值与逻辑关系；物理中的s-t、v-t图像是真实运动过程的量化描述，承载了运动状态、物理过程等具体内涵，聚焦规律与现实意义。二者虽然在数学本质上具有一致性，但呈现形式、情境背景、关注重点都存在显著差异。学生长期沉浸在数学的抽象题型情境中，面对物理的真实问题情境时，难以识别其中蕴含的数学模型，自然无法实现知识的自动迁移。"}]},{"t":"（3）运用“为迁移而教”的相关理论","items":[{"t":"整合跨学科教学内容，搭建迁移的内容载体","d":"搭建迁移的内容载体**打破学科独立的教学格局，整合数学与物理的关联内容，共同设计跨学科主题单元，是促进迁移的基础。两位教师可以联合开发系列跨学科主题，比如“运动中的函数规律”“图像中的变化率”“真实场景的量化分析”等，围绕同一主题融合两科的知识内容。在同一个教学单元中，数学教师从函数的角度讲解变量关系，物理教师从运动的角度讲解过程规律，共同引导学生认识到二者的共通本质。通过主题式的内容整合，让学生在同一情境下同时接触两个学科的视角，打破“学科独立”的认知，为知识迁移提供内容载体。"},{"t":"加强知识的纵横关联，构建迁移的认知桥梁","d":"构建迁移的认知桥梁**知识之间的联系越清晰，迁移越容易发生。教学中要主动搭建知识关联的桥梁，降低迁移的认知门槛。一方面，加强纵向的新旧知识关联，在各科日常教学中提前渗透跨学科联结。比如数学教师在讲解函数图像、斜率计算时，主动引入物理运动的生活实例，让学生感知数学知识的应用场景；物理教师在讲解运动图像时，主动引导学生回忆数学中的函数变化规律，帮助学生调取已有认知，用旧知识理解新内容。另一方面，加强横向的学科本质关联，明确提炼不同学科知识的共通原理。比如共同总结“变化率”这一核心概念，明确它在数学中是斜率、在物理中是速度/加速度，帮助学生抛开学科形式差异，把握本质内核，为一般迁移奠定基础。"},{"t":"强化知识的概括总结，提升迁移的抽象水平","d":"提升迁移的抽象水平**已有经验的概括水平越高，迁移的适应性越强。教学中要改变“重题型训练、轻原理概括”的模式，把提升知识的概括水平作为教学的重要目标。数学教学中，不能只满足于学生会解具体题目，要引导学生从大量题型中提炼出一般性的原理、方法与思维模式，比如总结函数图像的分析方法、变量关系的探究思路，让学生掌握的是“渔”而非“鱼”。物理教学中，引导学生从具体的运动情境中抽象出量化规律，学会用数学语言描述物理过程，提升知识的抽象度。通过提升概括水平，让学生的知识从具体题型上升到一般原理，实现从特殊迁移到一般迁移的升级，能够灵活应用到不同的学科情境中。"},{"t":"教授迁移的学习策略，培养迁移的方法能力","d":"培养迁移的方法能力**迁移能力的提升，离不开具体学习策略的支撑。教师要有意识地教授跨学科学习的方法与策略，让学生学会迁移。比如教授“本质抽象法”，引导学生面对具体问题时，先抛开具体的学科情境，提炼核心的数量关系与逻辑模型，再匹配对应的学科知识；教授“学科类比法”，引导学生遇到新问题时，主动联想其他学科的相关方法，寻找共通的解决思路。同时培养学生的元认知策略，引导学生监控自己的思考过程，反思是否陷入了学科思维定势，主动调整思考方式。比如在跨学科解题时，提醒学生先明确物理情境与条件，再调用数学工具，避免生搬硬套公式。通过策略教学，让学生掌握迁移的方法，从“学会知识”走向“学会迁移”。**。"},{"t":"培养主动迁移的意识，形成迁移的内在动力","d":"形成迁移的内在动力**迁移意识是主动迁移的内在动力。教师要通过多种方式培养学生的跨学科迁移意识，打破学科割裂的认知定势。首先，及时肯定与鼓励学生的迁移行为，当学生主动用数学知识解决物理问题，或者用物理实例理解数学原理时，给予明确的表扬与强化，让学生感受到迁移的价值。其次，设计梯度化的迁移任务，从有教师支架的引导迁移，逐步过渡到半独立的迁移练习，最终实现完全独立的跨情境迁移，让学生在逐步进阶中积累迁移的成功体验，提升自我效能感。最后，引导学生建立“知识整体观”，让学生认识到不同学科本质上是从不同视角认识世界，知识是相通的，而非孤立的。通过长期的引导与训练，让主动迁移成为学生的学习习惯，最终实现“。"}]}]}]},{"id":"预测6-5","name":"预测5","questions":[{"id":"预测6-5-31","num":31,"title":"31 晏阳初/梁漱溟","subject":"中教史","blocks":[{"t":"二者乡村教育思想与实践的共通之处","items":[{"t":"秉持教育救国的核心立场，立足乡村回应时代危机","d":"场，立足乡村回应时代危机**二者都将乡村教育视为挽救民族危亡、改造中国社会的根本路径，坚信乡村衰败是中国整体危机的核心，教育是破解乡村困境的关键抓手。面对近代中国农村的全面衰落，二者都拒绝单纯的政治革命或碎片化经济改良路径，选择从教育入手，通过提升农民素质、重构乡村社会实现国家复兴，都是教育救国思潮在乡村领域的具体落地。**。"},{"t":"坚持教育与社会改造结合，推行系统性乡村建设","d":"合，推行系统性乡村建设**二者都没有将乡村教育局限于学校识字教育，而是将教育视为乡村整体改造的核心牵引，推动教育与经济、卫生、道德、治理等领域协同推进。晏阳初的四大教育涵盖文化、生计、健康、公民多个维度，梁漱溟的乡农教育兼顾文化生产、风俗教化、基层治理，本质上都是以教育为核心的乡村社会系统工程。**。"},{"t":"扎根实地开展实验，践行知识分子与民众结合","d":"行知识分子与民众结合**二者都摒弃书斋式的教育空谈，深入乡村开展长期实地实验。晏阳初迁居定县开展全县范围的乡村改造实验，梁漱溟在邹平创办乡村建设研究院落地乡农教育，都坚持从农村实际出发设计教育方案，身体力行践行知识分子下乡的道路，体现了“五四”以来知识阶层面向民众、服务社会的精神传统。**。"},{"t":"以人的改造为核心，着眼农民素质提升","d":"眼农民素质提升**二者都将人的改造作为乡村建设的根本支点。晏阳初提出培养农民的知识力、生产力、强健力、团结力，梁漱溟强调通过精神陶冶塑造新型农民，本质上都是希望通过教育提升农民的综合素养，从根本上激活乡村发展的内生动力。**。"}]},{"t":"二者乡村教育思想与实践的核心差异","items":[{"t":"问题诊断：现象层面的四大病症与文化层面的失调危机","d":"实践路径、价值取向等方面形成鲜明差异，共同书写了中国近代乡村教育的重要篇章。**。"},{"t":"教育目标：人的素质改良与文化秩序重建","d":"人的素质改良与文化秩序重建**晏阳初的教育目标指向人的素质改造，通过四大教育分别破解四大病症，最终培养具备知识力、生产力、强健力、团结力的现代农民，改善乡村生存状态，实现乡村的渐进改良。其核心是“化农民”，即改造农民的素质与能力，而他也提出知识分子要先“农民化”、融入乡村，才能有效开展改造工作。梁漱溟的教育目标指向文化秩序与社会结构的重建，希望通过乡村教育实现中西文化的调适沟通，以中国传统伦理精神为根基，吸纳西方现代文明的长处，重建乡村社会的伦理秩序与治理体系，最终走出一条中国特色的乡村建设道路，本质上是文化救亡与社会重构。**。"},{"t":"教育内容：四大教育协同与道德教育统合","d":"四大教育协同与道德教育统合**晏阳初构建了四大教育的内容体系：以文艺教育攻愚，开展扫盲识字、文化普及，培养知识力；以生计教育攻穷，推广农业技术、发展合作经济、改良手工业，培养生产力；以卫生教育攻弱，普及公共卫生、推行科学医疗，培养强健力；以公民教育攻私，开展公民训练、培育公共精神，培养团结力。四大教育各有侧重、协同推进，内容侧重实用技能与公共素养。梁漱溟的乡农教育以道德教育为核心统合各类内容。课程分为通用课程与地方特色课程两类：通用课程包括识字、唱歌等基础内容，以及核心的“精神讲话”，先以传统道德巩固农民的精神自信，再逐步引入新知识改造旧习惯；地方课程则因地制宜教授生产技术。"},{"t":"实践路径：三大方式协同与政教养卫合一","d":"三大方式协同与政教养卫合一**晏阳初设计了学校式、社会式、家庭式三大实施方式：学校式教育以青少年为对象，开办各级平民学校；社会式教育面向普通民众，通过读书会、农业展览等开展社会教育；家庭式教育以家庭为单位，开展道德、卫生、儿童教育。三类方式相互配合，构建覆盖全人群的教育网络。梁漱溟则推行“政、教、养、卫合一”“以教统政”的组织模式，建立村学—乡学的层级教育体系，学校同时承担基层行政功能，以村学代村公所、乡学代乡公所，乡村的政治、经济、社会措施都通过教育机构推行。学校内部设儿童部、成人部、妇女部、高级部，融合学校教育与社会教育，以教育统摄整个乡村建设。**。"}]},{"t":"二者乡村教育实验的历史贡献","items":[{"t":"晏阳初平民乡村教育的开创性贡献","d":"开创性贡献**晏阳初构建了中国首个系统的乡村平民教育体系，首创“四大教育、三大方式”的框架，打破了传统学校教育的边界，将教育延伸到家庭与社会，推动乡村教育从单一识字教育转向社会系统改造。定县实验切实推动了乡村扫盲、农业技术改良、公共卫生普及与公民意识培育，在一定程度上改善了农民的生产生活状态。他提出的“农民化”理念，开创了知识分子下乡与民众结合的实践范式，其思想不仅影响了中国乡村建设，也成为世界平民教育运动的重要经验。**。"},{"t":"梁漱溟乡农教育的探索性价值","d":"性价值**梁漱溟从文化视角探索乡村问题，立足中国社会的独特性思考乡村改造道路，避免了照搬西方模式的误区，深化了对中国乡村社会本质的认识。他提出的“政教养卫合一”模式，探索了教育与基层治理融合的路径，为乡村社会的组织化建设提供了新思路。其乡农教育实践推动了传统道德的传承与现代知识的下乡，培养了一批乡村建设人才，对邹平当地的农业改良、风俗改良产生了实际影响。**。"},{"t":"共同的历史价值：二者共同推动了乡村教育的发展","d":"**二者共同推动了乡村教育的发展，打破了近代教育集中于城市的格局，将教育资源引入广大乡村，开启了中国现代乡村教育的先河。二者都立足中国本土实际探索乡村建设道路，体现了知识分子的爱国情怀与务实精神，为后世乡村教育发展、基层社会治理留下了宝贵的历史经验与思想遗产。**。"}]},{"t":"二者乡村教育实验的时代局限性","items":[{"t":"共同的改良主义局限：二者的乡村教育本质上都是社会改良主义的探索","d":"**二者的乡村教育本质上都是社会改良主义的探索，都没有认识到帝国主义侵略与封建剥削压迫是中国乡村衰败的根本根源，试图单纯通过教育改造实现乡村复兴，没有触动封建土地制度与社会阶级结构，因此无法从根本上解决中国乡村的深层危机。实验都局限在较小的县域范围，缺乏全国推广的社会条件与经济基础，最终都因抗战爆发等原因中断，未能实现预期的社会改造目标。**。"},{"t":"晏阳初思想的局限：晏阳初对乡村问题的诊断停留在表面现象","d":"**晏阳初对乡村问题的诊断停留在表面现象，将“愚、穷、弱、私”这些社会压迫的结果当成了问题的根源，导致其教育方案治标不治本。四大教育的推行缺乏相应的制度与经济支撑，公民教育等理念难以在传统乡村社会真正落地，整体上呈现出温和改良的软弱性。**。"},{"t":"梁漱溟思想的局限：梁漱溟的乡村理论带有明显的文化决定论倾向","d":"**梁漱溟的乡村理论带有明显的文化决定论倾向，过分强调文化失调的作用，忽视了经济基础与阶级矛盾的决定性意义。他否认阶级斗争，试图在传统伦理基础上走“第三条道路”，与近代中国社会革命的主流趋势相脱节。同时其教育过于倚重传统道德教化，对现代科学与民主精神的吸纳相对有限，具有一定的保守性。####32.请结合外国教育史知识，分类概述两大取向主要教育思潮核心主张，对比二者在教育目的、课程设置、师生关系上的核心分歧，并结合结构主义、终身教育思潮，论述20世纪西方教育思潮的整体演进逻辑与历史影响。"}]}]},{"id":"预测6-5-32","num":32,"title":"32 20世纪两大思潮","subject":"外教史","blocks":[{"t":"两类取向教育思潮的核心主张","items":[{"t":"20世纪西方教育思潮整体可分为保守取向与革新取向两大阵营","d":"的整体演进逻辑与历史影响。【解析】**1.两类取向教育思潮的核心主张**20世纪西方教育思潮整体可分为保守取向与革新取向两大阵营，二者大多兴起于20世纪上半叶，在后续教育发展中持续产生影响，分别代表了教育领域“文化传承”与“突破革新”两条核心路径。**（1）保守取向教育思潮**该类思潮以反思进步教育的弊端、回归教育的文化传承功能为核心立场，强调教育的规范性与知识的系统性，核心流派包括三个：①永恒主义：认为人性与真理具有永恒不变的属性，教育的基本原则与核心内容恒定不变；核心目标是培养人的理性、传承人类永恒的文化遗产；课程以古典名著为核心，推崇自由教育与理智训练，主张通过阅读经典发展学生的理性思维。"}]},{"t":"两类思潮在核心维度上的分歧","items":[{"t":"两类思潮基于不同的哲学立场与教育逻辑","d":"学立场与教育逻辑，在教育的核心命题上形成了鲜明对立，本质是“文化传承与社会秩序”和“个体发展与社会革新”两种教育价值的博弈。①教育目的的价值取向分歧。保守取向坚持文化本位与社会秩序优先：永恒主义追求人类理性的传承与永恒价值的延续，要素主义强调民族文化共同要素的传递与社会秩序的巩固，新托马斯主义以宗教信仰与灵魂救赎为终极目标。三者均将教育视为传承既有文明、维护社会稳定的工具，个体发展服从于文化与社会的整体需求。革新取向坚持个体价值或社会改造优先：存在主义以个体存在意义与自由选择为核心，现代人文主义以个体自我实现与人格完整为核心，二者均突出个体的主体价值；改造主义则以社会改良与进步为核心，将教育视。"}]},{"t":"20世纪西方现代教育思潮的整体演进逻辑与历史影响","items":[{"t":"20世纪中后期兴起的结构主义教育与终身教育思潮","d":"结构主义教育与终身教育思潮，是对前期两大阵营理论的整合与超越，既吸收了双方的合理内核，也拓展了教育理论的边界，推动整个现代教育思潮呈现出清晰的演进脉络。**（1）整体演进逻辑**①从二元对立走向多元融合。20世纪上半叶保守与革新两大阵营尖锐对立，中后期逐步走向辩证融合，结构主义教育是这一转向的典型代表：它既吸收了保守取向的知识内核，强调学科基本结构的系统性与权威性；也继承了革新取向的学生主体理念，倡导发现学习、重视学生的主动探究。各国教育实践也不再偏执一端，而是在知识基础与学生主体、个体价值与社会功能之间寻求平衡，多元互补成为教育理论发展的主流方向。②教育场域从封闭学校走向开放终身。前期所有思。"}]}]},{"id":"预测6-5-33","num":33,"title":"33 教学组织与评价","subject":"教原","blocks":[{"t":"（1）分析该校教学组织形式改革体现了哪些现代教学组织形式的…","items":[{"t":"教学组织形式改革体现的核心方向","d":"了哪些现代教学组织形式的改革方向，并评析分层走班与翻转课堂在实施中存在的问题及其原因。"},{"t":"走向分层化、个别化的适配性教学，回应学生差异需求","d":"适配性教学，回应学生差异需求。传统班级授课制以统一进度、统一内容面向全体学生，难以兼顾不同学生的能力基础与学习节奏。该校实施分层走班制，学期初通过学业诊断将学生分为不同层次，不同层次班级的教学进度、难度各不相同，本质上是分层教学与走班制的结合实践，契合现代教学组织形式“尊重个体差异、实施因材施教”的改革方向。这种改革打破了固定班级的统一教学模式，根据学生的知识与能力水平分组施教，让教学难度、进度匹配学生的接受能力，是个别化教学理念在班级授课制框架下的创新实践，目的是让每个学生都能在适配的节奏中获得最佳发展。"},{"t":"走向信息化、混合化的重构式教学，重塑教学流程形态","d":"重构式教学，重塑教学流程形态。该校引入翻转课堂模式，教师课前录制微课，学生课前自主学习，课堂用于讨论、练习答疑；同时开展混合式教学，线上资源配合线下课堂，支持学生在线自学与检测。这体现了现代教学组织形式“信息技术赋能、线上线下融合”的改革方向，是对传统课堂时空边界的突破。翻转课堂重构了“课前学知识、课内化知识”的教学流程，将知识学习环节前置到课外，课堂聚焦互动深化与能力提升；混合教学则整合了在线学习的便捷性与线下课堂的互动性，契合泛在学习、数字化教学的发展趋势，推动教学从“课堂中心”向“学习中心”转变。"},{"t":"走向主体化、自主化的学习型教学，转变学习动力模式","d":"学习型教学，转变学习动力模式。无论是分层走班赋予学生的分层选择空间，还是翻转课堂、混合教学赋予学生的课前自主学习权，都体现了现代教学组织形式“以学生为主体、激发自主学习”的改革方向。改革不再局限于教师“教”的形式优化，更关注学生“学”的方式变革，通过组织形式的调整调动学生的学习主动性，推动从“教师中心”向“学生中心”转型，让学习从被动的知识接收转向主动的意义建构。**。"},{"t":"分层走班实施中的问题与成因","d":"与成因**分层走班改革中出现B、C层部分学生自我效能感下降、认为分层是贴差生标签的问题，本质上是分层模式的配套机制缺失与标签效应共同作用的结果。"}]},{"t":"（2）从评价功能与评价方法两个维度","items":[{"t":"基于评价功能维度的评价类型与作用","d":"价类型与作用**从评价的实施功能与阶段来看，该校的评价改革涵盖了。"},{"t":"诊断性评价：前置定位，精准分层","d":"【解析】课堂提问、随堂点评是在教学过程中进行的评价，属于形成性评价，可以了解学情、诊断问题、反馈教学，并动态调整教学策略。A说单元前置小测主要用于划分学习组别，窄化了诊断性评价功能；B说标准参照评价可横向对比学生学业水平，不准确，标准参照评价主要判断是否达到标准；D说增值性评价可作为教师绩效考核核心依据，过于绝对。因此选C。"},{"t":"形成性评价：过程调控，反馈改进","d":"【解析】课堂提问、随堂点评是在教学过程中进行的评价，属于形成性评价，可以了解学情、诊断问题、反馈教学，并动态调整教学策略。A说单元前置小测主要用于划分学习组别，窄化了诊断性评价功能；B说标准参照评价可横向对比学生学业水平，不准确，标准参照评价主要判断是否达到标准；D说增值性评价可作为教师绩效考核核心依据，过于绝对。因此选C。"},{"t":"终结性评价：结果检验，质量兜底","d":"三类，形成了贯穿教学全程的完整评价链条。1.诊断性评价：前置定位，精准分层。诊断性评价是在学期或单元教学开始时实施的前置性评价，核心功能是检查学生的学习准备程度、辨别学习困难原因、实现学生的适当安置。该校在学期初通过学业诊断对学生进行分层走班，就是典型的诊断性评价实践。其在学业成就评价中的作用体现在：一是精准把脉学生的学业基础与能力水平，为分层教学提供科学依据，让教学难度适配学生水平，为后续的学业成就评价确立基准起点；二是识别学生的学习优势与短板，为后续的针对性教学、个别辅导提供方向，是提升学业成就评价针对性的前提。"},{"t":"基于评价方法维度的评价类型与作用","d":"价类型与作用**从评价的实施方法与载体来看，该校的评价改革涵盖了纸笔测验、表现性评价、档案袋评价、自评与互评四种类型，实现了量化与质性、过程与结果的多元结合。1.纸笔测验：量化评价，客观高效。纸笔测验是通过书面测试考查知识技能掌握程度的评价方法，该校的随堂测、单元检测、终结性考试都属于纸笔测验范畴。其功能是客观、高效地考查学生对基础知识、基本技能的掌握程度。在学业成就评价中的作用：纸笔测验是学业成就评价的经典基础手段，具有实施便捷、评分客观、效率高的优势，能够系统考查学生的知识掌握水平，为学业成就提供可量化的客观依据，是保障学业评价公平性与效率性的核心载体。1.表现性评价：质性考查，全面育人。"}]},{"t":"（3）和材料二","items":[{"t":"新时代教学评价改革的核心理念","d":"核心理念，并为该校解决评价改革中的现实困境提出建议。"},{"t":"坚持以生为本的发展性评价，回归育人本质","d":"评价，回归育人本质。新时代评价改革的核心是“以学生发展为中心”，评价的根本目的不是给学生贴标签、排名次，而是诊断教学问题、改进教学实践、促进学生成长。这要求评价从传统的选拔、甄别功能，转向发展、激励、改进功能，把促进学生全面、主动、可持续发展作为评价的出发点与落脚点。材料一中明确提出评价不是贴标签、排名次，而是诊断问题、改进教学、促进成长，正是发展性评价理念的核心体现。"},{"t":"坚持过程与结果并重的整体性评价，优化评价结构","d":"整体性评价，优化评价结构。针对传统评价“重结果、轻过程”的弊端，新时代评价改革强调改进结果评价，强化过程评价，构建贯穿教学全程的评价链条。既重视最终的学业质量，也重视学习过程中的努力、进步与成长，通过过程评价引导学生重视学习过程，实现“以评促学、以评促教”。材料一中提出“强化过程评价”，该校将过程性表现占比设为40%，正是对这一理念的实践落地。"},{"t":"坚持多元综合的全面性评价，落实五育并举","d":"评价，落实五育并举。新时代评价改革破除“唯分数、唯升学”的片面导向，强调健全综合评价，覆盖品德、学业、身心健康、审美、劳动与社会实践等多个维度，推动评价从单一的智育评价转向五育并举的全面评价。材料一中明确监测覆盖五大领域，就是要通过综合评价的指挥棒，引导学校落实五育并举，促进学生全面发展。"},{"t":"坚持技术赋能的高效性评价，减轻师生负担","d":"评价，减轻师生负担。新时代评价改革强调依托信息技术赋能评价改革，通过数字化、智能化的评价工具，优化评价流程，提升评价效率，减轻师生的不合理负担。材料一中提出“依托信息技术赋能评价改革，减轻师生不合理负担”，正是评价改革现代化的重要方向，也是破解评价工作量大、效率低问题的核心路径。"}]}]},{"id":"预测6-5-34","num":34,"title":"34 学习策略","subject":"教心","blocks":[{"t":"（1）结合元认知策略理论","items":[{"t":"小孙运用的核心元认知策略","d":"策略第一，计划策略：事前规划，锚定学习路径。元认知计划策略是指在认知活动开始前，根据特定目标规划活动程序、预判问题、设计解决路径的策略，涵盖目标制定、任务排序、路径设计等内容。小孙放学首先列出当日任务清单，并按难易程度排序，正是计划策略的典型应用。在每日学习开始前，他先梳理当日所有学习任务，建立清晰的任务目标体系，再按照难易程度完成优先级排序，预判不同任务的难度与精力投入，设计最优的完成顺序。这种事前规划避免了学习的盲目性，让后续的学习活动有明确的方向与节奏，从起点上保障了学习的有序性。第二，监控策略：事中调控，保障学习专注。元认知监控策略是指在学习过程。"},{"t":"计划策略：事前规划，锚定学习路径","d":"事前规划，锚定学习路径。元认知计划策略是指在认知活动开始前，根据特定目标规划活动程序、预判问题、设计解决路径的策略，涵盖目标制定、任务排序、路径设计等内容。小孙放学首先列出当日任务清单，并按难易程度排序，正是计划策略的典型应用。在每日学习开始前，他先梳理当日所有学习任务，建立清晰的任务目标体系，再按照难易程度完成优先级排序，预判不同任务的难度与精力投入，设计最优的完成顺序。这种事前规划避免了学习的盲目性，让后续的学习活动有明确的方向与节奏，从起点上保障了学习的有序性。"},{"t":"监控策略：事中调控，保障学习专注","d":"事中调控，保障学习专注。元认知监控策略是指在学习过程中，对自身的理解程度、策略执行、注意力状态进行持续监控，保障学习活动朝着目标推进，具体包括领会监控、策略监控与注意监控。小孙的行为体现了三类监控的协同：一是注意监控，他将桌面只摆放当前学习用品，手机静音放在客厅，主动排除干扰源，调控自身的注意力状态，保障注意力集中在学习任务上，属于注意监控的主动运用；二是领会监控，完成一项任务就打勾，持续跟踪任务完成进度，监视自己的学习速度与质量，及时掌握学习状态，属于领会监控的具体体现。"},{"t":"调节策略：事后调整，优化学习过程","d":"事后调整，优化学习过程。元认知调节策略是指根据监控发现的问题，及时调整认知策略、修正问题解决方式、弥补学习漏洞的策略，是保障学习灵活性的关键。小孙的调节策略体现在两个层面：一是任务节奏调节，完成一项任务后短暂休息，劳逸结合，根据自身的精力状态调整学习节奏，避免疲劳导致效率下降；二是策略调整，遇到难题先独立思考，无法解决时就向老师发送思路寻求提示，获得提示后继续作答，当发现自身思考无法突破时，及时调整问题解决策略，从独立思考转向寻求支持，而非固执钻牛角尖或直接放弃。这种灵活的调节让他既能保持独立思考，又能及时突破瓶颈，保障学习的顺畅性。**。"},{"t":"元认知策略对自主学习能力发展的核心作用","d":"能力发展的核心作用**元认知策略是自主学习的“导航系统”，从根本上决定了自主学习的质量与效率，对学生自主学习能力的发展具有关键性的支撑作用。"}]},{"t":"（2）综合运用时间管理策略、努力管理策略和环境管理策略","items":[{"t":"小唐自主学习效率低下的深层原因","d":"的原因，并为李老师提出指导小唐改进的具体措施。【解析】自主学习效率的提升离不开时间管理、努力管理、环境管理三类资源管理策略的协同支撑。小唐自主学习状态不佳、效率低下，本质上是三类策略全面缺失的结果，需要从三个维度系统干预，帮助其掌握科学的自我管理方法。**。"},{"t":"时间管理策略缺失，学习无序且时间利用率低","d":"习无序且时间利用率低。时间管理策略是通过合理规划时间、高效利用时间资源保障学习效率的策略，包括计划时间、最优时间利用、化零为整等核心方法。小唐在时间管理上存在明显短板：一是缺乏学习计划，放学回家先刷短视频，七点左右才开始写作业，没有主动规划学习时间，将大量黄金时间消耗在无关活动上，学习启动严重滞后；二是没有把握最优学习时间，精力最充沛的时段被娱乐活动占据，开始学习后精力已经下降，学习效率大打折扣；三是时间碎片化严重，写作业时频繁查看手机，不断打断学习节奏，整块的学习时间被切割成零散碎片，无法进行深度思考，严重影响学习质量。时间管理的混乱，是其学习效率低下的表层原因。"},{"t":"努力管理策略薄弱，意志控制与动机支撑不足","d":"志控制与动机支撑不足。努力管理策略是通过调节心理状态、维持意志努力、强化学习动机，保障学习持续投入的策略，包括归因调整、心境调节、意志控制、自我强化等方法。小唐在努力管理上的问题十分突出：一是意志控制能力不足，难以抵制短视频、手机信息的诱惑，明明想早点写完作业却难以自控，无法将注意力持续集中在学习任务上，容易被无关因素干扰；二是问题解决的努力坚持不足，遇到难题不经过独立思考就直接拍照搜题抄写答案，回避思考过程，没有付出足够的意志努力突破瓶颈，学习停留在表层完成，没有深度加工。"},{"t":"环境管理策略缺位，学习环境干扰因素过多","d":"习环境干扰因素过多。环境管理策略是通过主动管控学习环境、排除干扰、利用环境相似性提升学习效率的策略，包括自然条件调节、学习空间设计等。小唐的学习环境存在大量干扰源：书桌堆放零食、漫画玩具，视觉干扰物多；手机放在一旁，随时会产生信息提示，听觉与注意力干扰频繁；没有专门的、整洁的学习空间，各种无关刺激不断分散注意力，导致学习时极易分心，无法进入深度专注的状态。环境的干扰，进一步加剧了时间的浪费与意志的消耗，成为效率低下的重要诱因。**。"},{"t":"指导小唐改进的具体教育措施","d":"育措施**针对小唐的问题，李老师可以结合“学会学习”主题活动，从三类策略入手，开展针对性的指导与训练，帮助其逐步提升自主学习能力。"}]},{"t":"（3）运用学业求助策略理论","items":[{"t":"部分学生“从不求助”的深层原因","d":"的原因，并结合班级“学会学习”主题教育活动，阐述教师应如何培养学生的适应性求助能力。"},{"t":"自我效能感偏低，将求助等同于能力不足","d":"助等同于能力不足。学业求助行为与学生的自我效能感高度相关，低自我效能水平的学生普遍认为，向别人求助就等于承认自己能力差，会被老师、同学看不起，为了维护自尊，避免暴露“自己不行”，宁愿自己硬扛或直接放弃，也不主动求助。材料中部分学生“认为提问代表自己能力不足”，正是这种认知的典型体现。这类学生将独立完成任务作为衡量能力的唯一标准，将求助视为对自我能力的否定，为了保护自尊而回避求助，哪怕因此影响学习效率也在所不惜。"},{"t":"归因模式偏差，将独立完成绝对化","d":"完成绝对化。受传统学习观念的影响，很多学生形成了“独立学习才是优秀，求助就是依赖”的错误归因。他们认为，只有完全靠自己解决问题才是能力强的表现，求助就是不独立、不优秀的体现，因此刻意回避求助。这种归因忽略了学习的社会性与互动性，将独立学习推向了极端，最终反而阻碍了自身的学习与进步。"},{"t":"过往经验的负面影响，形成求助的负面预期","d":"形成求助的负面预期。学生的求助行为受过去习得经验的深刻影响，如果学生之前求助时，曾经被老师批评“这么简单都不会”，或者被同学嘲笑，就会形成“求助会带来负面评价”的负面预期，进而回避求助。还有的学生因为性格内向，或者缺乏社交技巧，不知道怎么开口求助，害怕求助被拒绝，因此选择不求助。"},{"t":"求助策略能力不足，不知道如何有效求助","d":"知道如何有效求助。部分学生缺乏学业求助的策略训练，不知道什么时候该求助、向谁求助、怎么求助才有效。有的学生遇到问题时，判断不了是自己再想想就能解决，还是必须求助；有的学生想求助但不知道找老师还是找同学，也不知道怎么表达自己的问题；还有的学生分不清工具性求助与执行性求助的区别，要么不问，要么直接要答案，没有掌握正确的求助方法，因此干脆选择不求助。**。"}]}]},{"id":"预测6-5-35","num":35,"title":"35 德育过程与原则","subject":"教原","blocks":[{"t":"（1）分析刘老师的德育实践体现了德育过程的哪些基本规律。","items":[{"t":"德育过程是学生在教师引导下自主建构个体品德的过程","d":"引导下自主建构个体品德的过程。学生并非被动接收道德灌输，而是主动选择、吸收环境与教育影响，自主建构自身道德观念，教师则发挥引导作用，组织活动促进学生主动思考。面对班级考试作弊的现象，刘老师没有直接追查学生、简单批评惩戒，而是组织班委会策划诚信主题班会，由班委收集全班学生对于诚信问题的看法，组织全班开展观点讨论，让学生自主辨析“作弊是否公平”“不作弊会不会吃亏”等真实道德困境。在这个过程中，学生在群体讨论、思想碰撞中自主思考诚信的价值，自主起草班级诚信公约，形成属于班级群体的道德规范，而非教师直接下达道德命令。"},{"t":"德育过程是培养学生知、情、意、行整体和谐发展的过程","d":"情、意、行整体和谐发展的过程。品德包含道德认识、道德情感、道德意志、道德行为四个要素，四者相互联系、相互促进，德育需要兼顾四个维度，同时德育具有多开端性，可以根据学生品德发展短板灵活选择教育切入点。诚信主题班会，首先提升学生对诚信的道德认识，让学生辨析作弊的危害与公平的价值；在集体讨论中，学生产生对于失信行为的道德评判，形成相应道德情感；学生起草诚信公约，约定行为底线，尝试约束自身行为，锻炼道德意志；公约推行之后学生测验行为得到改善，落实到道德行为层面。"},{"t":"德育过程是不断提高学生自我教育能力的过程","d":"生自我教育能力的过程。自我教育能力包含自我期望、自我评价、自我调控能力，是衡量德育成效的重要标志，德育的最终目标是激发学生自我教育，实现由他律向自律转变。刘老师组织班委会牵头开展班会、学生自主讨论、自主起草诚信公约，让学生参与班级道德规范的制定，引导学生自主评价班级内的诚信问题，自主约定行为底线，锻炼学生自我评价与自我管理能力。在接力赛事的实践中，小华承担组织任务，在和老师沟通、组织同学训练的过程中，学会自我约束，主动减少课堂讲话的行为，逐步形成自我调控的意识。班级积分管理制度，将行为标准公开张贴，每周汇总，目的是让学生对照标准评价自身行为，主动调整言行，培养自我监督能力。"},{"t":"德育过程是德育矛盾积极转化的过程","d":"极转化的过程。德育过程的主要矛盾是教师向学生提出的道德要求，与学生当前已有的思想品德水平之间的矛盾，德育就是不断推动这类矛盾转化，促进学生品德提升。班级出现作弊现象，学生内心存在“遵守诚信”和“作弊不吃亏”的思想矛盾，刘老师通过主题班会创设道德讨论的情境，引导学生辨析矛盾，推动学生思想观念向认同诚信的方向转化。小华存在纪律意识薄弱、课堂随意讲话的问题，他原有思想品德水平和班级规范要求之间存在矛盾，刘老师没有单纯批评，而是发掘他的组织能力，安排他负责接力训练，在集体责任的要求下，推动小华思想行为发生积极转变。积分管理的推行，是向学生明确提出行为规范要求，以此对照学生当下的行为状态，引导学生调整言。"}]},{"t":"（2）分析刘老师运用的德育原则","items":[{"t":"集体教育与个别教育相结合原则","d":"结合；既讲授道德规范，又组织公益实践，体现知行统一；依靠规章制度约束行为，坚持长善救失，体现正面引导与纪律约束相结合、依靠积极因素克服消极因素。A中“必须依托班级制度强制约束才能实现”过于绝对；C把品德转化关键归结为规章制度，片面；D说道德实践起决定性作用，也不准确。因此选B。**9.。"},{"t":"知行统一原则","d":"刘老师在班级德育工作中综合运用了集体教育与个别教育相结合原则、知行统一原则、正面引导与纪律约束相结合原则、长善救失原则、教育影响一致性与连贯性原则等多项德育原则，各项原则的落实取得了一定育人成效，但同时也存在诸多局限与问题。第一，集体教育与个别教育相结合原则。该原则强调德育既要依靠集体力量教育个体，又要通过个别学生的转变带动整个集体，将教师主导作用与集体教育力量相结合。刘老师面对班级作弊问题，没有单独追查个体，而是面向全班开展诚信主题班会，依靠班集体讨论，由全班共同制定班级诚信公约，依靠集体舆论、集体约定约束每一位学生，发挥集体教育的力量。针对小华这一个。"},{"t":"正面引导与纪律约束相结合原则","d":"结合原则、长善救失原则、教育影响一致性与连贯性原则等多项德育原则，各项原则的落实取得了一定育人成效，但同时也存在诸多局限与问题。"},{"t":"发挥积极因素、克服消极因素原则（长善救失原则）","d":"极因素原则（长善救失原则）。该原则要求教师一分为二看待学生，发掘学生身上的闪光点，依靠学生自身积极因素克服品德当中的消极因素。刘老师通过家访和日常观察，发现小华虽然经常迟到、不交作业、扰乱课堂，但是在操场号召力强，同学愿意跟随他参与活动，这就是小华身上的积极因素。刘老师利用这个优势，安排小华负责班级接力赛训练，发挥他的组织号召力，让他在承担集体责任的过程中，克服自身纪律松散的缺点。成效方面，长善救失的教育方式尊重小华，发掘他的优势，让小华获得成就感与集体归属感，有效减少课堂讲话行为，实现消极行为的改善。"},{"t":"教育影响一致性原则","d":"该原则要求协调学校、家庭、社会多方教育力量，形成协同育人合力。刘老师开展家访了解小华家庭情况，组织家长会和家长沟通学生情况，尝试联动家庭共同开展德育。但是在实践中暴露出很大问题，部分家长存在教育观念偏差，认为学生只要成绩好，不惹麻烦就可以，忽视品德养成；还有家长无法有效管控孩子手机使用，家庭的价值导向和学校德育要求不一致，家校之间教育影响相互冲突，抵消学校德育的效果，学校主导的协同育人没有真正落地。综合评析，刘老师德育工作摒弃简单粗暴的惩罚与道德灌输，重视学生参与、集体力量、因材施教，在一定程度上促进学生品德发展。但是德育工作存在重短期活动、轻长期意志培育；重外在行为管控，轻内在信念塑造；家。"}]},{"t":"（3）和材料二","items":[{"t":"德育实践贯彻德育原则需要注意的问题","d":"需要注意的问题第一，贯彻德育原则必须坚持以学生品德自主建构为核心，避免走向两个极端：单纯道德知识灌输，或者单纯行为规训。德育原则的落实，不是把道德规范强行灌输给学生，也不是依靠奖惩制度简单管控学生行为。无论是疏导原则、知行统一原则，还是集体教育原则，根本目标都是引导学生自主形成道德信念。在德育实践中，如果只重视讲道理、背诵道德规范，忽略学生的内心体验与实践，会造成学生道理明白，但是无法落实到行动；如果仅仅依靠积分、公约等外部奖惩约束行为，只管控外在表现，忽视内在道德情感、意志的培育，学生会形成功利化的道德认知，遵守规则只是为了获得奖励或者规避惩罚，一旦外。"},{"t":"贯彻德育原则必须坚持以学生品德自主建构为核心","d":"以学生品德自主建构为核心，避免走向两个极端：单纯道德知识灌输，或者单纯行为规训。德育原则的落实，不是把道德规范强行灌输给学生，也不是依靠奖惩制度简单管控学生行为。无论是疏导原则、知行统一原则，还是集体教育原则，根本目标都是引导学生自主形成道德信念。在德育实践中，如果只重视讲道理、背诵道德规范，忽略学生的内心体验与实践，会造成学生道理明白，但是无法落实到行动；如果仅仅依靠积分、公约等外部奖惩约束行为，只管控外在表现，忽视内在道德情感、意志的培育，学生会形成功利化的道德认知，遵守规则只是为了获得奖励或者规避惩罚，一旦外部监督消失，就难以坚持道德行为。"},{"t":"贯彻德育原则要兼顾知情意行完整统一","d":"情意行完整统一，重视德育的长期性、反复性，不能期望依靠单次主题活动实现品德的永久转变。学生品德发展过程中，知、情、意、行四个要素发展常常不均衡，很多学生道德认知到位，但是道德意志薄弱，容易出现知行脱节。在落实各项德育原则时，不能只偏重道德认知教育，还要兼顾道德情感体验、道德意志锻炼与行为习惯训练。德育不是一次性活动，学生思想矛盾会反复出现，品德提升是螺旋上升的过程。不能在开展一次主题班会、制定一份公约之后就停止德育工作，必须持续跟进、反复巩固。材料一中明确德育要以养成良好行为习惯为重点，落实知行合一，恰恰说明品德习惯需要长期锤炼，不能追求短期成效。"},{"t":"贯彻德育原则需要统筹多方教育力量，坚持教育影响的一致性，构建家校社协同育人体系","d":"多方教育力量，坚持教育影响的一致性，构建家校社协同育人体系。德育原则中的教育影响一致性与连贯性原则，要求学校发挥主导作用，协调家庭、社会的教育影响，保持价值导向统一。学生的品德塑造，同时受到学校教育、家庭教养、社会环境多重影响。如果学校倡导诚信、责任、集体主义，但是家庭传递“成绩优先，品德次要”的价值观，家校教育要求相互矛盾，德育效果会被大幅削弱。在贯彻德育原则开展班级德育时，不能只局限在班级内部开展工作，必须主动开展家庭教育指导，纠正家长的片面教育观念，引导家长配合学校德育要求，协调家校教育步调，形成协同育人合力。"},{"t":"贯彻德育原则应当辩证处理好尊重信任学生与严格要求学生、集体教育与个别教育之间的关系","d":"处理好尊重信任学生与严格要求学生、集体教育与个别教育之间的关系。落实德育原则，一方面要尊重学生人格，相信学生具备自我教育的潜能，采用疏导、启发、长善救失的方式，发掘学生身上的积极因素，避免简单批评、贴标签；另一方面也要提出合理、稳定、严格的道德与行为要求，做到宽严相济。同时要兼顾集体与个体，依靠集体舆论、集体活动教育全体学生，同时关注学生个体差异，针对不同学生的成长背景、个性特点开展个别教育。只重视集体统一要求，容易忽略学生个体差异；只关注个别学生，缺少集体氛围的支撑，德育的覆盖面和持续性会受到限制。**。"}]}]},{"id":"预测6-5-36","num":36,"title":"36 问题解决","subject":"教心","blocks":[{"t":"（1）结合问题解决的基本过程理论","items":[{"t":"理解与表征问题能力薄弱，无法精准拆解真实复杂问题，是学生解题困难的核心根源","d":"弱，无法精准拆解真实复杂问题，是学生解题困难的核心根源。理解和表征问题是问题解决的首要前提，要求学生能够精准识别有效信息、剔除无关冗余信息、理解信息背后的实际含义，并对问题形成整体、完整的认知，清晰把握问题的核心目标。本次垃圾分类方案设计属于真实场景问题，包含垃圾产量、各类垃圾占比、清运成本、场地限制、师生接受度等多重复杂信息，存在大量冗余、干扰性内容。而学生长期适应结构单。"},{"t":"寻求解答方式固化单一，依赖机械算法，缺乏灵活的启发式解题思维","d":"依赖机械算法，缺乏灵活的启发式解题思维。在寻求解答阶段，问题解决包含算法式和启发式两种核心策略，常规标准化应用题可依靠固定算法顺利解决，但真实情境的项目化问题无固定解题模板，必须依托启发式思维灵活拆解问题、设计方案。长期刷题训练让学生形成了固化的解题思维，习惯使用单一的算法式策略，只会机械套用平均数、百分比等固定数学公式完成计算，不会根据真实问题的复杂条件调整解题思路。学生缺乏手段目的分析法、类比思维、多维度推演等启发式解题能力，无法结合场地限制、成本约束等现实条件，多角度设计垃圾分类优化方案，只能停留在表层数据计算层面，无法实现知识与真实问题的适配，难以形成科学、全面的解决方案。"},{"t":"执行解答计划机械僵化，缺乏问题适配性，无法落地真实问题解决方案","d":"缺乏问题适配性，无法落地真实问题解决方案。执行计划阶段要求学生结合问题目标和现实条件，灵活落实解题思路、完成方案设计。但学生在本次项目学习中，解题执行完全脱离实际需求，机械照搬常规解题流程，只完成基础的数据计算，却不会结合校园真实场景优化方案。多数学生仅完成数值运算，无法将计算结果转化为可落地的垃圾分类优化策略，也不会根据场地、成本等现实约束调整解题和设计思路，导致解题过程流于形式，无法真正解决校园垃圾分类优化的核心问题。同时，由于前期问题表征偏差、解题思路单一，学生的执行过程缺乏针对性和逻辑性，出现数据误用、指标单。"},{"t":"缺乏科学的结果评价能力，无法验证方案合理性与优势","d":"力，无法验证方案合理性与优势。评价阶段是问题解决的收尾关键环节，要求学生对解题过程、计算结果、解决方案的科学性、合理性、可行性进行全面校验复盘。本次项目式学习无标准答案，需要学生自主论证方案优势、校验方案可行性，但学生完全缺乏对应的评价能力。很多学生能够设计出看似合理的垃圾分类方案，却无法运用数学知识、真实数据证明方案的科学性与优势，不会从成本、效率、可行性等多维度评价方案质量。同时，学生无法复盘自身解题过程中的问题，对自身误用数据、指标单。"}]},{"t":"（2）从结构不良问题的解决过程角度","items":[{"t":"厘清问题情境与核心限制，完成问题精准定位","d":"制，完成问题精准定位。结构不良问题解决的首要特殊过程是全面梳理问题背景、筛选有效信息、厘清多重情境限制。学生解决垃圾分类方案问题时，需要摒弃常规解题的单一思维，全面梳理校园垃圾产量、各类垃圾占比、清运成本、场地条件、师生接受度等全部情境要素，精准区分有效数据与无关冗余信息，剔除无效干扰条件，明确本次项目的核心目标并非单纯计算数据，而是依托数学知识设计低成本、高可行性、高接受度的垃圾分类优化方案，突破单一“减量”的片面认知。"},{"t":"澄清多元立场与评价维度，建立全面解题视角","d":"度，建立全面解题视角。结构不良问题具备多元评价角度，不存在单一评判标准，需要解题者兼顾多方立场、多重指标综合考量。学生解题时需要跳出单一数据思维，兼顾学校管理、师生体验、成本管控、场地适配等多方立场，不再局限于垃圾总量减少这单一指标，综合平衡各类影响因素。针对学生思维片面、评价维度单一的问题，张老师可创设多元讨论场景，组织学生分组探讨垃圾分类方案需要考虑的核心要素，引导学生自主梳理成本、可行性、师生接受度等评价维度，帮助学生建立多维度、全方位的解题思维，规避片面化解题误区。"},{"t":"结合情境要素，自主设计多元化解决方案","d":"计多元化解决方案。不同于结构化问题的固定解法，结构不良问题需要学生结合真实情境，自主探究、设计多种可行的解决方案。学生需要灵活运用统计、比例、函数等数学知识，结合校园真实数据，设计出不同侧重点的垃圾分类优化方案，而非机械套用固定公式计算。针对学生解题思路固化、只会机械计算的问题，张老师要弱化公式套用训练，强化知识应用训练，引导学生结合不同的约束条件推演多种方案，鼓励学生发散思维，打破刷题形成的思维定势，培养学生方案设计与创新能力。"},{"t":"科学评价方案有效性，自主论证方案优势","d":"自主论证方案优势。结构不良问题无标准答案，核心是筛选最优、最适配的方案，要求学生自主依托数据、理论、情境条件论证方案的科学性与合理性。学生需要运用数学计算结果、校园实际条件，为自己设计的垃圾分类方案提供数据支撑，清晰论证方案的优势与可行性，解决“方案合理但无法证明”的困境。针对学生论证能力缺失的问题，张老师可专项开展方案论证教学，教学生运用数据对比、维度分析、可行性推演等方法，为方案提供科学支撑，培养学生有理有据的论证思维。"},{"t":"开展元认知监控，全程复盘解题过程","d":"复盘解题过程。结构不良问题解题过程复杂、极易出现偏差，需要全程开展自我监控与反思，实时排查解题漏洞。学生需要在解题过程中持续自查信息使用、数据计算、方案设计、维度考量等环节，及时发现误用数据、指标单。"}]},{"t":"（3）综合运用影响问题解决的因素和问题解决能力培养的理论","items":[{"t":"重构学生知识结构，实现知识系统化、情境化，夯实问题解决基础","d":"现知识系统化、情境化，夯实问题解决基础。知识经验的数量与质量是影响问题解决的核心因素，学生机械刷题积累的碎片化知识，无法适配真实情境问题的解决需求。张老师需摒弃传统机械刷题的教学模式，不再单纯训练学生的公式套用、数值计算能力，而是结合生活、校园真实场景，重构数学知识教学体系。在日常教学中，将统计、比例、函数等数学知识与校园管理、生活实践、社会热点相结合，让学生理解数学知识的实际应用价值，掌握知识的适用场景与应用方法，形成系统化、情境化的知识体系。"},{"t":"破除思维定势与功能固着，培养学生灵活创新的解题思维","d":"着，培养学生灵活创新的解题思维。长期机械刷题让学生形成了极强的思维定势，习惯用固定公式、固定套路解决所有数学问题，无法灵活应对开放性真实问题，同时对数学知识的功能形成固着认知，仅认为数学可用于卷面计算，忽略其方案设计、数据分析、逻辑论证的功能。对此，张老师需要彻底优化日常训练题型，减少标准化、结构化的机械习题，增加情境化、开放性、探究性的数学问题，刻意打破学生的固化解题思维。在教学中鼓励学生一题多解、多角度思考，不局限于标准答案，允许学生结合真实情境设计个性化解题方案。"},{"t":"优化问题表征教学，提升学生复杂问题拆解与信息筛选能力","d":"升学生复杂问题拆解与信息筛选能力。问题表征方式直接决定问题解决的效率与正确率，学生解题困难的首要原因是无法精准表征复杂真实问题。张老师需专项开展问题表征能力训练，教学生结构化拆解复杂问题的方法，引导学生在面对真实情境问题时，分步完成信息筛选、信息解读、目标定位、维度梳理等工作。针对学生容易误用冗余信息、忽略约束条件的问题，常态化开展复杂信息辨析训练，提供包含干扰信息、多重限制条件的情境化习题，训练学生精准提取有效信息、剔除无效信息的能力。同时引导学生建立整体化问题表征思维，摒弃单一指标解题认知，兼顾多重约束条件与多元评价维度，全面提升学生的问题解读与表征能力。"},{"t":"常态化开展探究式、项目式学习，发挥学生主体探究能力","d":"目式学习，发挥学生主体探究能力。探究性学习是培养真实问题解决能力的核心途径，材料中善于提问、主动探究的学生思维更活跃、解题能力更强，充分印证了主动探究的育人价值。张老师需落实科技教育与项目式学习的教学要求，将项目式学习常态化、常态化融入日常数学教学，不再将教学局限于课堂习题训练。结合校园生活、社会生活设计多元化的数学实践项目，如校园资源统计、能耗分析、活动方案优化等，让学生长期在真实情境中自主探究、合作研讨、设计方案、验证成果。"},{"t":"系统教授多元问题解决策略，重点强化启发式策略教学","d":"策略，重点强化启发式策略教学。学生长期依赖单一算法式解题策略，无法适配开放性问题，张老师需针对性开展解题策略专项教学，丰富学生的解题工具库。在教学中弱化机械算法训练，重点讲解手段目的分析法、逆向反推法、类比思维、多角度推演等启发式解题策略，并结合垃圾分类、校园实践等真实案例，讲解策略的应用场景与使用方法。引导学生根据问题类型灵活切换解题策略，面对结构化习题可使用算法式高效解题，面对真实开放的结构不良问题，运用启发式策略灵活拆解、多元设计、迭代优化，让学生掌握适配不同问题的解题方法，提升问题解决的灵活性与专业性。"}]}]}]},{"id":"预测6-6","name":"预测6","questions":[{"id":"预测6-6-31","num":31,"title":"31 陶行知/陈鹤琴","subject":"中教史","blocks":[{"t":"二者教育思想的共通内核","items":[{"t":"同承实用主义立场，批判传统教育积弊","d":"判传统教育积弊**二者的教育思想均以对传统教育的批判为逻辑起点，共同指向传统教育“书本中心、教师中心、脱离生活”的核心弊端。陶行知尖锐抨击传统教育与社会生活割裂、劳心与劳力分离，只会培养脱离实际的“书呆子”；陈鹤琴反对“死读书、读死书”的灌输式教学，批评传统教育脱离儿童天性与现实生活需求。二者都主张教育必须跳出书本的桎梏，回归生活世界，以生活作为教育的源头与归宿。**。"},{"t":"同倡实践本位理念，强调“做”的核心价值","d":"调“做”的核心价值**二者都将“做”置于教育过程的核心位置，坚持手脑并用、知行合一的教育原则。陶行知提出“教学做合一”，认为“行是知之始”，学习必须从实践行动出发，在劳力上劳心，打破劳心与劳力的二元对立；陈鹤琴提出“做中教，做中学，做中求进步”，认为“做”是儿童学习的基础，凡儿童能自己做的就应让其自主探索。二者都否定被动接受的注入式教学，将实践作为知识生成、能力发展的根本路径。**。"},{"t":"同怀教育救国理想，探索本土教育道路","d":"索本土教育道路**二者均以教育救国为时代使命，拒绝照搬西方教育模式，致力于探索适配中国国情的本土化教育路径。陶行知面向中国乡村衰败、民众文盲率高的现实，探索平民普及教育的中国方案；陈鹤琴针对中国幼儿教育照搬西方、脱离本土儿童特点的问题，开展中国化、科学化的幼儿教育实验。二者都扎根中国社会实际，推动教育理论与实践的本土化转型。**。"}]},{"t":"二者教育思想的核心差异","items":[{"t":"教育视野：社会大教育观与学校育人观的分野","d":"实践场域的不同形成了各具特色的理论路径，共同推动了中国教育的现代转型，对当代教育改革仍具有深刻的启示价值。**。"},{"t":"教育目标：社会改造指向与人的发展指向的侧重","d":"社会改造指向与人的发展指向的侧重**陶行知的教育目标服务于社会改造与大众解放。他的生活教育以提升劳苦大众的生活能力、改造乡村社会面貌为直接目标，通过普及文化知识、生产技能与公民意识，推动民众从愚昧贫困中解放出来，最终实现社会的整体进步，教育是社会改造的工具与路径。陈鹤琴的教育目标聚焦人的完整成长与身份建构，提出“做人，做中国人，做现代中国人”的三层目标：从普遍意义上的“做人”，到具有家国情怀的“做中国人”，再到具备健全身体、建设能力、创造能力、合作精神、服务意识的“做现代中国人”，层层递进，以个体的全面发展为核心指向。**。"},{"t":"实践体系：大众普及模式与儿童育人模式的差异","d":"大众普及模式与儿童育人模式的差异**陶行知构建了面向大众的普及教育实践体系。在乡村创办晓庄师范，培养兼具农夫身手、科学头脑的乡村教师；在上海创办山海工学团，推行“工以养生，学以明生”的工读结合模式；创造“小先生制”，以学龄儿童教民众的方式破解师资匮乏难题，探索出穷国普及教育的独特路径，实践场域覆盖乡村、工厂、社区，面向全年龄段民众。陈鹤琴构建了聚焦儿童的科学化教育体系。创办中国第一所实验幼稚园——鼓楼幼稚园，开展儿童心理追踪研究；提出“五指活动”课程模式，将健康、社会、科学、艺术、文学活动融为一体，以整体活动替代分科教学；形成实验观察、阅读思考、创作发表、批评研讨的四步教学法，实践核心集中于。"}]},{"t":"历史贡献与时代局限","items":[{"t":"历史贡献","d":"与局限性。【解析】近代中国半殖民地半封建的社会语境下，教育救国成为知识界探索救亡道路的核心方向之一。杨贤江与黄炎培作为民国时期极具代表性的教育思想家，分别立足马克思主义理论视角与职业教育实践路径，构建了各具特色的教育思想体系。前者以历史唯物主义剖析教育本质，提出“全人生指导”的青年教育主张；后者以实用主义为内核，倡导职业教育以实现“使无业者有业，使有业者乐业”的目标。二者既共享时代变革的思想底色，又在理论根基、实践路径上形成鲜明分野，共同推动了中国教育的近代转型。**。"},{"t":"陶行知开创了中国现代大众平民教育的范式","d":"大众平民教育的范式。他的生活教育理论打破了传统教育的精英属性与学校围墙，将教育延伸到社会底层与广阔乡村，创造了乡村师范、工学团、小先生制等一系列本土化的普及教育模式，为中国乡村教育、平民教育的发展奠定了理论与实践基础，推动了教育公平与教育普及的历史进程。"},{"t":"陈鹤琴奠定了中国现代学前教育的科学根基","d":"学前教育的科学根基。他首次系统开展中国儿童心理发展研究，建立了首个中国化、科学化的幼儿教育体系，活教育理论与五指活动课程深刻塑造了中国学前教育的基本形态，推动了幼儿教育从经验化走向科学化，对中国儿童教育发展影响深远。"},{"t":"二者共同推动了中国教育的现代转型","d":"育的现代转型。它们共同颠覆了传统教育书本至上、灌输为主的模式，确立了学生的主体地位与实践的核心价值，推动教育从服务科举转向服务人的发展与社会进步，探索了中国教育的本土化发展道路，丰富了中国现代教育的思想宝库。**。"},{"t":"时代局限：二者的思想与实践都受到近代中国社会历史条件的制约，具有鲜明的时代局限","d":"**二者的思想与实践都受到近代中国社会历史条件的制约，具有鲜明的时代局限。一方面，二者都带有教育救国的改良主义色彩，试图以教育改良解决社会根本问题，在半殖民地半封建的战乱环境中，实践仅局限于局部区域，难以在全国范围系统推行，无法从根本上改变中国社会的深层危机。另一方面，二者的理论各有侧重局限：陶行知的生活教育相对弱化了系统学科知识的体系化传授，过度泛化教育的边界，一定程度上消解了学校教育的独特功能与规范性；陈鹤琴的活教育理论与实践主要集中于学前与初等教育阶段，适用范围相对有限，对高等教育、社会教育的系统阐释不足。**。"}]},{"t":"对当代教育改革的启示","items":[{"t":"其一，坚持教育与生活深度融合，落实实践育人根本要求","d":"深度融合，落实实践育人根本要求。要打破教育与生活的壁垒，立足时代需求更新教育内容，强化项目式、探究式、体验式学习，让教育回应现实生活与社会发展需要，避免知识与实践脱节的问题。其二，坚守学生主体地位，激发学习者的主动性与创造性。尊重学生的身心发展规律与个体差异，倡导自主学习、动手实践，改变灌输式教学模式，培养学生的创新精神与实践能力，落实“做中学”的教育理念。其三，立足中国本土实际，推动教育理论与实践的中国化创新。扎根中国文化与社会现实，不盲目照搬西方教育模式，构建具有中国特色的教育体系，走本土化的教育现代化道路。其四，推进教育公平优质发展，补齐薄弱领域教育短板。借鉴平民教育、小先生制的普惠精神。"}]}]},{"id":"预测6-6-32","num":32,"title":"32 福禄贝尔/蒙台梭利","subject":"外教史","blocks":[{"t":"福禄培尔幼儿教育核心理论与标志性教育载体","items":[{"t":"核心教育理论观点","d":"第一，统一原则是其思想的核心根基，带有鲜明的时代与思想特征。他提出万物皆有统一的精神内核，教育的本质是引导儿童自由展现自身内在的精神本质，逐步认识自然、人性与世界的统一，实现身心的和谐发展。第二，顺应自然原则，主张教育必须贴合双重自然规律，既遵循大自然的客观规律，更要尊重儿童与生俱来的生理、心理天性，杜绝成人主观强制灌输。第三，持续发展原则，首次将进化发展理念引入幼儿教育领域，认为儿童的成长是从低级到高级、从简单到复杂、从不完善到完善的动态递进过程，每个成长阶段都有独特价值，教育需适配儿童阶段性发展特征。第四，创造原则，强调人天生具备创造性，教育的核心目。"},{"t":"统一原则是其思想的核心根基，带有鲜明的时代与思想特征","d":"心根基，带有鲜明的时代与思想特征。他提出万物皆有统一的精神内核，教育的本质是引导儿童自由展现自身内在的精神本质，逐步认识自然、人性与世界的统一，实现身心的和谐发展。"},{"t":"顺应自然原则","d":"主张教育必须贴合双重自然规律，既遵循大自然的客观规律，更要尊重儿童与生俱来的生理、心理天性，杜绝成人主观强制灌输。"},{"t":"持续发展原则","d":"首次将进化发展理念引入幼儿教育领域，认为儿童的成长是从低级到高级、从简单到复杂、从不完善到完善的动态递进过程，每个成长阶段都有独特价值，教育需适配儿童阶段性发展特征。"},{"t":"创造原则","d":"强调人天生具备创造性，教育的核心目标之一是唤醒儿童的创造潜能，让儿童通过自主活动展现创造力，实现自我成长。在幼儿园教育实践层面，他明确幼儿园是家庭教育的补充而非替代，采用半日制办学模式，延续家庭生活化的教育氛围。同时确立了自我活动的核心教育方法，重视儿童自主体验、亲身观察，高度肯定游戏的教育价值，认为游戏是儿童精神最纯粹的自发表达，同时注重儿童社交能力培养，引导儿童在集体互动中实现社会化发展。**。"}]},{"t":"蒙台梭利幼儿教育核心理论与标志性教育载体","items":[{"t":"核心教育理论观点：首先","d":"**第一，统一原则是其思想的核心根基，带有鲜明的时代与思想特征。他提出万物皆有统一的精神内核，教育的本质是引导儿童自由展现自身内在的精神本质，逐步认识自然、人性与世界的统一，实现身心的和谐发展。"},{"t":"标志性教育载体：其一","d":"**其一，恩物，是福禄培尔最具代表性的专属教学载体，是为幼儿量身设计的标准化游戏材料与教学用具。恩物遵循循序渐进、整体与部分统一的设计逻辑，作为自然万物的象征，帮助儿童直观认知自然规律、锻炼想象力与创造力，是幼儿自主活动的核心工具。其二，系统化的幼儿园课程体系，涵盖游戏歌谣、手工作业、团体运动游戏、自然研究等内容。其中《母亲与儿歌》奠定了幼儿情感与启蒙教育的基础，团体圆圈游戏、诗歌配套游戏助力儿童认知个体与集体的关系，自然研究则培养儿童的爱心与探索精神。其三，世界上第一所官方幼儿园，开创了公共幼儿教育的全新形态，彻底打破了传统幼儿家庭教育的单一模式。**。"}]},{"t":"福禄培尔与蒙台梭利教育思想的核心差异","items":[{"t":"儿童发展观差异：福禄培尔的儿童发展观带有唯心主义与神秘主义色彩","d":"**福禄培尔的儿童发展观带有唯心主义与神秘主义色彩，以精神发展为核心，认为儿童成长是内在精神不断显现、趋近统一的过程，侧重儿童精神、情感与创造力的整体性自发成长，强调游戏对儿童精神滋养的核心价值，重视儿童的想象与情感表达。蒙台梭利的儿童发展观以科学实证为基础，依托生物学、心理学规律，聚焦儿童生理与心理的客观发展节律，提出敏感期、吸收性心智等科学概念，认为儿童发展是内在生命潜能在专属环境中的有序释放。她否定纯粹的想象性游戏，主张儿童通过真实、务实的实践工作实现能力成长，更注重儿童理性能力、感官能力与实操能力的精准发展。**。"},{"t":"教育组织方式差异：在教学形式上","d":"**在教学形式上，福禄培尔以集体游戏活动为核心组织形式，注重团体互动、集体歌谣、圆圈游戏等群体性活动，强调儿童的社会化交往与集体归属感，教育氛围更具生活化、趣味性、情感化。课程组织灵活自由，侧重儿童自主创造与情感抒发。蒙台梭利以个别化自主工作为核心组织形式，尊重儿童个体发展差异，允许儿童自主选择教具、自主把控学习节奏、独立完成实操训练。教育环境高度有序规范，教具标准化、流程系统化，强调儿童独立探索、自我教育、自我纠错，集体活动占比极低，更侧重个体能力的精准培育。**。"}]},{"t":"二者对近代幼儿教育发展的历史贡献","items":[{"t":"福禄培尔的历史贡献：其一，开创了近代公共幼儿教育新纪元","d":"**其一，开创了近代公共幼儿教育新纪元。他创立世界第一所幼儿园，彻底终结了传统幼儿教育完全依附家庭的格局，确立了幼儿园的教育定位，明确其家庭教育补充的功能，构建了近代首个学前教育制度雏形。其二，奠定了近代学前教育理论体系。他首次系统阐释幼儿教育的核心原则、内容与方法，确立了游戏在幼儿教育中的核心地位，颠覆了传统灌输式教育理念，确立了儿童自主活动的教育核心。其三，推动了幼儿教育的普及与专业化发展。他重视幼教师资培训与教育经验推广，其教育模式在19世纪后风靡全球，为世界各国幼儿教育制度化、规范化发展提供了核心参考，让幼儿教育成为独立的教育阶段。**。"},{"t":"蒙台梭利的历史贡献：其一，推动幼儿教育走向科学化","d":"**其一，推动幼儿教育走向科学化。她以实证科学为基础，打破了传统幼儿教育的经验化、主观化局限，提出敏感期、吸收性心智等科学理论，精准揭示幼儿身心发展规律，为近代幼儿教育提供了科学的理论依据。其二，创新了幼儿教育实践模式。“儿童之家”与标准化教具体系，构建了系统化、可复制的幼儿教育模式，个别化教育、自我教育的理念，契合儿童个体发展差异，为现代个性化幼儿教育奠定基础。其三，拓展了幼儿教育的内容边界。她首创系统化感官训练体系，突破了传统幼儿教育重游戏、轻能力训练的局限，率先开展低龄儿童读写算科学启蒙，丰富了幼儿教育的内容维度，推动近代幼儿教育从“情感滋养”向“能力培育”全方位升级，成为20世纪影响力。"}]}]},{"id":"预测6-6-33","num":33,"title":"33 德育方法与途径","subject":"教原","blocks":[{"t":"（1）分析该校使用的德育方法，评析其合理性与不足。","items":[{"t":"该校运用的核心德育方法","d":"法第一，说服教育法。说服教育是通过摆事实、讲道理提升学生道德认知、形成正确价值观点的基础方法。该校的运用体现在三个层面：一是系统课堂讲授，通过专门的道德与法治课程，系统向学生传递道德规范与价值准则，承担着传递基础道德认知的核心功能；二是集中主题宣讲，通过定期的国旗下讲话、月度主题班会，围绕特定德育主题开展集中教育，强化学生对具体主题的道德认知；三是学科渗透说教，语文、科学等学科教师尝试依托教学内容渗透德育，多在课堂结尾附加几句道德引导，属于学科教学中的延伸式说服。第二，情感陶冶法。情感陶冶是通过创设良好教育情境，潜移默化熏陶学生品德的隐性方法。该校主要以。"},{"t":"说服教育法","d":"说服教育是通过摆事实、讲道理提升学生道德认知、形成正确价值观点的基础方法。该校的运用体现在三个层面：一是系统课堂讲授，通过专门的道德与法治课程，系统向学生传递道德规范与价值准则，承担着传递基础道德认知的核心功能；二是集中主题宣讲，通过定期的国旗下讲话、月度主题班会，围绕特定德育主题开展集中教育，强化学生对具体主题的道德认知；三是学科渗透说教，语文、科学等学科教师尝试依托教学内容渗透德育，多在课堂结尾附加几句道德引导，属于学科教学中的延伸式说服。"},{"t":"情感陶冶法","d":"情感陶冶是通过创设良好教育情境，潜移默化熏陶学生品德的隐性方法。该校主要以环境陶冶的形式落实，在校园走廊、公共宣传栏布置德育文化标语，打造显性的德育文化环境，试图通过校园文化氛围对学生进行浸润式影响，让学生在日常环境中潜移默化地接受道德观念，是隐性德育方法的典型应用。"},{"t":"实践锻炼法","d":"实践锻炼是有目的地组织学生开展实际活动与社会交往，在实践中培养良好品德与行为习惯的方法。该校每学期组织学生前往敬老院开展敬老服务、走进社区开展环保志愿活动，让学生在真实社会场景中践行奉献、责任、环保等道德要求；同时通过一日常规量化管理，引导学生反复践行日常行为规范，在持续的行为练习中固化规则意识，是道德行为养成的重要路径。"},{"t":"品德评价与奖惩法","d":"品德评价法是依据德育目标对学生品德表现给予肯定或否定评价，引导学生品德发展的方法。该校实行一日常规量化评比制度，每周公示各班得分，对日常行为进行即时评价与约束；期末开展文明班级、美德少年评选，将志愿服务时长纳入评选指标，通过荣誉激励、量化考核的方式，既对学生行为进行正向引导，也发挥约束规范作用。**。"}]},{"t":"（2）分析该校德育途径，说明不同途径的整合方式。","items":[{"t":"该校的核心德育途径","d":"第一，课程育人途径。课程育人是学校德育的主渠道，分为直接德育课程与学科渗透德育两个层面。一方面，学校开设专门的道德与法治课程，系统讲授道德知识与理论，属于直接的道德教育，是学生系统学习道德规范、发展道德思维的核心载体，保障了德育的基本课时与知识传递的系统性。另一方面，语文、科学等学科教师尝试依托学科内容渗透德育，属于间接的课程德育，试图将道德教育融入学科教学全过程，发挥课堂教学的育人功能，是全员德育的重要实践载体。第二，活动育人途径。活动育人是德育的重要实践载体，该校通过多样化的主题活动落实德育要求。一是仪式与主题教育活动，包括国旗下讲话、月度主题班会、。"},{"t":"课程育人途径","d":"课程育人是学校德育的主渠道，分为直接德育课程与学科渗透德育两个层面。一方面，学校开设专门的道德与法治课程，系统讲授道德知识与理论，属于直接的道德教育，是学生系统学习道德规范、发展道德思维的核心载体，保障了德育的基本课时与知识传递的系统性。另一方面，语文、科学等学科教师尝试依托学科内容渗透德育，属于间接的课程德育，试图将道德教育融入学科教学全过程，发挥课堂教学的育人功能，是全员德育的重要实践载体。"},{"t":"活动育人途径","d":"活动育人是德育的重要实践载体，该校通过多样化的主题活动落实德育要求。一是仪式与主题教育活动，包括国旗下讲话、月度主题班会、黑板报评比等，围绕特定德育主题开展集中教育，强化主题认知；二是评选表彰活动，包括文明班级、美德少年评选，发挥荣誉激励与榜样示范作用；三是校外实践活动，包括敬老院服务、社区环保志愿等，让学生在活动中践行道德要求。"},{"t":"管理育人途径","d":"管理育人是将德育融入学校日常管理的隐性途径，该校通过实行一日常规
