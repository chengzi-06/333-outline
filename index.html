量化评比制度，细化学生日常行为规范，每周公示评分结果，将德育要求贯穿到校园管理的各个细节，通过制度规范引导学生行为，发挥管理的育人功能，是德育落地的制度保障。"},{"t":"文化育人途径","d":"文化育人是通过校园文化潜移默化影响学生的隐性途径，该校通过走廊德育标语、宣传栏文化布置、主题黑板报评比等形式，营造校园德育文化氛围，让学生在日常文化浸润中受到道德熏陶，是环境育人的重要组成部分。"}]},{"t":"（3）、二，论述全方位德育内涵与实施要求，为该校德育优化提…","items":[{"t":"全方位德育的核心内涵","d":"第一，全员育人：德育不是班主任与德育部门的专属工作，全体教师都是德育工作者，都承担德育职责。每一位教职工都要在自身的教学、管理与服务中主动渗透德育，以自身的言行影响学生，形成人人都是德育工作者、处处都是德育场的格局。第二，全程育人：德育贯穿学校教育的全过程，从课堂教学到课外活动，从入学到毕业，从知识学习到行为管理，德育渗透在教育的每一个环节，伴随学生成长的全周期，形成前后衔接、层层递进的德育链条，实现全程浸润、持续育人。第三，全方位育人：德育通过课程、文化、活动、实践、管理、协同六大途径全面展开，覆盖学生的认知、情感、行为、价值等多个维度，整合学校、家庭。"},{"t":"全员育人：德育不是班主任与德育部门的专属工作，全体教师都是德育工作者，都承担德育职责","d":"德育不是班主任与德育部门的专属工作，全体教师都是德育工作者，都承担德育职责。每一位教职工都要在自身的教学、管理与服务中主动渗透德育，以自身的言行影响学生，形成人人都是德育工作者、处处都是德育场的格局。"},{"t":"全程育人：德育贯穿学校教育的全过程","d":"德育贯穿学校教育的全过程，从课堂教学到课外活动，从入学到毕业，从知识学习到行为管理，德育渗透在教育的每一个环节，伴随学生成长的全周期，形成前后衔接、层层递进的德育链条，实现全程浸润、持续育人。"},{"t":"全方位育人：德育通过课程、文化、活动、实践、管理、协同六大途径全面展开","d":"德育通过课程、文化、活动、实践、管理、协同六大途径全面展开，覆盖学生的认知、情感、行为、价值等多个维度，整合学校、家庭、社会三方力量，形成多渠道、立体化的育人格局，实现直接德育与间接德育结合、显性教育与隐性教育统一。"},{"t":"全人育人：德育以促进学生全面发展为目标","d":"德育以促进学生全面发展为目标，不仅培养道德认知，更注重道德情感、道德意志与道德行为的全面发展，兼顾品德发展与核心素养提升，落实立德树人根本任务，培养完整发展的时代新人。**。"}]}]},{"id":"预测6-6-34","num":34,"title":"34 创造性","subject":"教心","blocks":[{"t":"（1）结合创造性思维过程理论","items":[{"t":"小何：准备充分但生成受阻，过度审慎扼杀创意生成","d":"受阻，过度审慎扼杀创意生成小何能够认真制定任务时间表，花费大量时间查阅文献、收集案例，说明其在创造性思维的准备阶段表现突出，能够主动围绕任务广泛搜集信息、积累素材，完成了创造的前期知识储备。但他始终难以独立形成原创设计方案，总担心自己的想法过于简单、达不到专业水准，不敢提交初步构想，本质上是创造性思维从准备阶段向沉思、灵感阶段推进受阻，无法完成从信息堆砌到创意生成的跃迁。从阶段发展视角看，小何过度停留在准备阶段，始终在补充资料、完善调研，迟迟不敢进入构想生成的环节，沉思过程不足，难以产生灵感迸发。他总觉得资料还不够多、想法还不够好，用准备阶段的完美要求苛。"},{"t":"小杨：生成快速但探索不足，浅尝辄止制约创意深化","d":"在创新任务中的问题与成因。【解析】创造性思维并非随机的灵感迸发，而是遵循特定认知规律、分阶段推进的复杂心理过程，从信息收集、构想生成到验证优化，每个环节的能力短板都会直接影响创造的质量与效率。经典的阶段理论将创造性思维划分为准备、沉思、灵感、验证四个依次递进的环节，也有观点从“生成初步构想—探索完善结构”的循环视角解释创造过程。小何与小杨在创新任务中的表现差异，本质上是创造性思维不同阶段发展失衡、能力存在短板的直接体现。**。"}]},{"t":"（2）结合影响创造性发展的因素","items":[{"t":"“不敢想”：价值认知偏差与环境容错不足共同抑制创造勇气","d":"价值认知偏差与环境容错不足共同抑制创造勇气**学生不敢大胆设想，核心是创造动机与自信不足，同时外部环境的评价导向进一步强化了“犯错恐惧”。从个体因素来看，首先是人格与自我认知偏差，很多学生存在“创新是天才专属能力”的固化认知，认为只有少数聪明人才具备创新能力，普通人做不到，因此从一开始就放弃了自主尝试，直接在网上找现成选题修改应付任务。这种认知直接消解了创造的内在动力，让学生连尝试的勇气都没有。其次是自我效能感不足，像小何这样的学生，总担心自己的想法过于简单、达不到专业水准，害怕提出不成熟的想法被嘲笑、被否定，因此宁愿一直准备也不敢输出构想。"},{"t":"“想不出”：知识僵化与思维训练缺失导致创意生成困难","d":"知识僵化与思维训练缺失导致创意生成困难**学生想法单薄、想不出新点子，核心是知识基础的质量不高与创造性思维策略训练缺失，导致信息无法转化为创意。从个体因素来看，首先是知识基础的僵化。学生在常规技能训练中表现好，因为常规任务有固定步骤，只需要套用知识即可；但创意设计需要灵活重组知识，学生的知识大多是应试导向的碎片化、刻板化知识，只记得操作步骤，不理解深层原理，也不会跨场景迁移应用，因此难以产生新的组合与构想。知识本身是创造的基础，但僵化的知识反而会阻碍创造，学生积累的知识越死板，越难产生新颖想法。"},{"t":"“想不深”：思维深度不足与意志薄弱制约创意深化","d":"思维深度不足与意志薄弱制约创意深化**学生方案难以深入完善，核心是深度思维能力不足与创造意志薄弱，导致探索与验证环节缺位。从个体因素来看，首先是思维深度的局限。部分学生比如小杨，虽然思维活跃点子多，但以直觉思维为主，逻辑深度不足，难以深入挖掘方案背后的原理，也不会系统论证可行性，创意停留在表面。其次是创造意志薄弱，缺乏精益求精、持续打磨的精神，方案初步成型就不愿意再修改，觉得“差不多就行”，没有追求极致的动力。最后是元认知能力不足，学生不会自我监控创造过程，不知道什么时候该深入、该怎么优化，往往想到什么就是什么，没有主动迭代优化的意识。从环境因素来看，常规教学任务大多只看结果不看过程，学生习。"}]},{"t":"（3）结合该通知要求，阐述教学中培养学生创造性的策略。","items":[{"t":"破除创新认知误区，培育创造意识与自信，让学生“敢创造”","d":"育创造意识与自信，让学生“敢创造”**针对学生“创新是天才专利”“怕出错不敢尝试”的问题，首先要破除创造的神秘感，建立人人可创造的认知。教师可以通过引入身边普通人的创新案例、学生优秀的往届作品，让学生明白创新不是遥不可及的天才行为，而是每个人都能掌握的思维方式与实践能力，打破“只有少数人能创新”的固化认知。其次要激发创造热情，结合校园真实场景设计任务，比如校园垃圾分类优化、图书角智能改造、楼道照明优化等，让学生感受到创新是用来解决身边真实问题的，不是空洞的空想，在解决实际问题的过程中获得成就感，激发内在创造兴趣。"},{"t":"系统训练创造性思维方法，掌握创造策略，让学生“会创造”","d":"法，掌握创造策略，让学生“会创造”**针对学生“想不出、想不深”的问题，要将创造性思维训练融入课堂教学，让学生掌握可操作的创造方法与工具。首先，常态化开展头脑风暴训练，在创意构思阶段，采用延迟评价原则，鼓励学生尽可能多提出想法，不急于批评对错，让学生在自由发散中产生更多创意。比如小组设计时，先做“点子风暴”，每个人都提想法，不评价好坏，量变引发质变，很多看似不成熟的想法会碰撞出更好的创意。其次，运用分合法训练思维的灵活性，一方面引导学生用新视角重新看待常规问题，比如校园里的垃圾分类、图书管理，引导学生跳出常规思路设计新方案。"},{"t":"立足真实项目实践，完善创造过程，让学生“能创造”","d":"善创造过程，让学生“能创造”**结合科技实践育人的要求，以真实情境的项目为载体，让学生在完整的创造实践中锻炼能力。首先，锚定真实校园场景设计项目任务，比如校园垃圾分类优化、图书角智能改造、楼道照明优化等，让学生从真实问题出发开展设计，避免创意脱离实际，也让学生感受到知识的应用价值。其次，构建阶梯式项目体系，从简单的小设计到综合的创意装置，逐步提升难度，让学生循序渐进地经历完整的创造过程：调研需求、构思方案、制作原型、测试优化，每个环节都有明确的引导，避免学生不知道怎么推进。针对小何这类学生，引导他从资料收集走向方案构思，教他怎么从案例中提炼思路，而不是一直停留在调研。"},{"t":"营造支持性教学环境，优化评价导向，让学生“愿创造”","d":"优化评价导向，让学生“愿创造”**良好的环境与评价是创造性发展的重要支撑。首先，营造民主宽松的课堂氛围，教师放下“权威”姿态，和学生一起探讨设计，不轻易否定学生的想法，对不成熟的构想给出优化建议而非批评，保护学生的好奇心与探索欲。其次，改革评价方式，建立过程性、多元化的评价体系，不只看最终成品的质量，更看重学生在过程中的努力、创意、进步。比如调研认真、想法新颖、优化积极都可以获得肯定，不用完美的成品也能获得好的评价，弱化结果导向，强化过程价值。同时，强化内部动机，让学生因为解决问题的成就感、创造的乐趣而投入，而不是为了分数而应付任务。"},{"t":"优化知识教学方式，构建灵活知识基础，为创造提供支撑","d":"建灵活知识基础，为创造提供支撑**创造离不开知识基础，僵化的知识无法支撑创造。教师要改变传统的技能训练模式，不仅教操作步骤，更讲深层原理，讲知识的应用场景，让学生理解知识的本质，而不是死记步骤。比如通用技术的技能教学，不仅让学生会操作，更让学生理解技术原理，知道可以用在什么地方、怎么改造应用。同时加强知识的整合与迁移训练，引导学生跨学科、跨场景调用知识，打破学科壁垒，为创意生成提供扎实灵活的知识支撑。####35.阅读材料，回答问题。#####（1）结合材料一师德师风第一标准，评析林老师专业素养的优势与不足。"}]}]},{"id":"预测6-6-35","num":35,"title":"35 教师专业发展与师生关系","subject":"教原","blocks":[{"t":"（1）师德师风第一标准，评析林老师专业素养的优势与不足。","items":[{"t":"林老师专业素养的核心优势","d":"优势第一，学科专业知识扎实，教学实施能力突出，教学实绩优异。林老师从教十二年，学科功底扎实，所带班级统考成绩常年位居年级前列，反映出其具备深厚的学科专业知识储备，能够精准把握学科知识的体系与重难点，教学操作能力成熟，知识传授的效率与质量突出。这是教师胜任教学岗位的基础素养，也是其能够长期保持教学质量优势的核心支撑，体现了专业素养的核心基础要求。第二，具备自我发展意识与初步反思研究能力，能够主动调整改进教学实践。在同事提醒后，林老师没有固守原有教学经验，而是主动访谈学困生，真实了解学生的学习状态与心理感受；随后申报学困生转化微型课题，坚持撰写教学反思日志，。"},{"t":"学科专业知识扎实，教学实施能力突出，教学实绩优异","d":"学实施能力突出，教学实绩优异。林老师从教十二年，学科功底扎实，所带班级统考成绩常年位居年级前列，反映出其具备深厚的学科专业知识储备，能够精准把握学科知识的体系与重难点，教学操作能力成熟，知识传授的效率与质量突出。这是教师胜任教学岗位的基础素养，也是其能够长期保持教学质量优势的核心支撑，体现了专业素养的核心基础要求。"},{"t":"林老师专业素养的突出不足","d":"不足第一，专业情意与师德层面：学生中心理念缺失，尊重学生人格不到位，偏离师德师风核心要求。师德师风的核心要求是坚持以生为本，尊重学生人格，关注学生内心感受，促进学生全面发展。但林老师在原有教学中，将成绩与纪律放在优先位置，忽视学生的主体地位与心理感受。面对课堂上打哈欠的学生，当场要求整节课站立听课，采用简单粗暴的惩罚方式管理纪律，没有顾及学生的人格尊严与情绪感受，最终引发学生强烈的抵触情绪。日常教学中课堂节奏偏快，不考虑学困生的接受能力，学生普遍畏惧举手提问，害怕被批评，说明林老师没有真正站在学生的角度考虑学习体验，热爱学生、尊重学生的师德要求落实不到位。"},{"t":"专业情意与师德层面：学生中心理念缺失，尊重学生人格不到位，偏离师德师风核心要求","d":"学生中心理念缺失，尊重学生人格不到位，偏离师德师风核心要求。师德师风的核心要求是坚持以生为本，尊重学生人格，关注学生内心感受，促进学生全面发展。但林老师在原有教学中，将成绩与纪律放在优先位置，忽视学生的主体地位与心理感受。面对课堂上打哈欠的学生，当场要求整节课站立听课，采用简单粗暴的惩罚方式管理纪律，没有顾及学生的人格尊严与情绪感受，最终引发学生强烈的抵触情绪。日常教学中课堂节奏偏快，不考虑学困生的接受能力，学生普遍畏惧举手提问，害怕被批评，说明林老师没有真正站在学生的角度考虑学习体验，热爱学生、尊重学生的师德要求落实不到位，违背了师德师风第一标准的核心要义。"}]},{"t":"（2）结合校本教研、反思、同伴互助、行动研究的成长路径","items":[{"t":"教师专业发展的核心内涵与发展取向","d":"涵与发展取向**教师专业发展不是单一的技能提升，而是涵盖专业知识、专业能力、专业情意的全方位成长，是一个持续深化、终身发展的过程。从发展取向来看，实践-反思取向强调教师通过对自身实践的反思，生成个人实践智慧，深化对教学的理解；生态取向强调教师群体的合作互助，依托校本教研、同伴互动，在教师文化中共同成长；专家型取向强调教师开展行动研究，用研究的方式解决教学问题，提升专业研究能力；自我更新取向则是融合多重发展路径，实现知识、能力、情意的全面提升。"},{"t":"林老师专业发展的收获与进步","d":"与进步第一，开启实践反思型成长，教学自我优化意识增强。林老师坚持撰写教学反思日志，主动复盘自身教学问题，从只关注教学成绩转向关注学生学习状态，开始对自身的教学节奏、课堂互动、学困生问题进行深度审视，打破了长期以来的经验固化。这种基于自身实践的反思，能够帮助教师生成个人化的实践智慧，推动教学从经验驱动走向反思驱动，是专业发展的重要进步。第二，融入生态式同伴互助，打破封闭教学的局限。林老师主动观摩优秀同事的课堂，邀请同事来班听课评课，借助同伴的视角发现自身教学问题，学习优秀的教学经验，打破了个体教学的封闭状态。这种同伴互助的方式，能够借助教师群体的智慧弥补个。"},{"t":"开启实践反思型成长，教学自我优化意识增强","d":"教学自我优化意识增强。林老师坚持撰写教学反思日志，主动复盘自身教学问题，从只关注教学成绩转向关注学生学习状态，开始对自身的教学节奏、课堂互动、学困生问题进行深度审视，打破了长期以来的经验固化。这种基于自身实践的反思，能够帮助教师生成个人化的实践智慧，推动教学从经验驱动走向反思驱动，是专业发展的重要进步。"},{"t":"林老师专业发展的现存不足","d":"不足第一，专业发展缺乏系统规划，整体处于被动问题驱动阶段。林老师的专业调整源于同事的提醒与现实的教学问题，属于被动应对式的成长，没有主动制定系统的职业生涯发展规划，对自身专业发展的目标、路径、节奏缺乏清晰设计。发展动力更多来自外部问题倒逼，而非内在的主动追求，发展的系统性与前瞻性不足。第二，实践反思深度不足，未触及教育理念与师德层面的深层变革。林老师的反思更多集中在教学节奏、提问设计等教学方法层面，对自身的学生观、师生观、教育价值观的反思不足。比如遇到学生纪律问题时依旧容易急躁，说明其教育理念与行为模式没有发生根本转变，反思没有深入到价值层面，导致教学改。"},{"t":"专业发展缺乏系统规划，整体处于被动问题驱动阶段","d":"整体处于被动问题驱动阶段。林老师的专业调整源于同事的提醒与现实的教学问题，属于被动应对式的成长，没有主动制定系统的职业生涯发展规划，对自身专业发展的目标、路径、节奏缺乏清晰设计。发展动力更多来自外部问题倒逼，而非内在的主动追求，发展的系统性与前瞻性不足。"}]},{"t":"（3）结合构建良好师生关系要求","items":[{"t":"林老师原有师生关系的类型与弊端","d":"类型与弊端**林老师原有师生关系属于典型的教师中心导向下的专制型师生关系。这种关系模式中，教师处于绝对的权威与支配地位，以知识传授与纪律管控为核心，学生处于被动服从的地位，人格尊严与主体地位没有得到充分尊重。从日常表现来看，课堂节奏、教学进度完全由教师决定，不顾学困生的接受能力；学生课堂行为出现问题时，采用当众罚站的惩罚方式，不考虑学生的情绪与尊严；学生普遍畏惧举手提问，害怕被批评，不敢表达自身的学习困难，都印证了师生之间的命令与服从关系，是专制型师生关系的典型特征。这种师生关系模式存在多重育人弊端：。"},{"t":"良好师生关系的核心特点：良好的师生关系是民主平等、尊师爱生、教学相长、宽容理解的良性互动关系","d":"点**良好的师生关系是民主平等、尊师爱生、教学相长、宽容理解的良性互动关系，具备四大核心特征：其一，社会关系层面民主平等，师生人格地位平等，教师尊重学生人格，发扬教学民主，不搞权威压制；其二，人际关系层面尊师爱生，学生尊重教师，教师关爱学生，彼此情感联结深厚，配合默契；其三，教育关系层面教学相长，教师主导、学生主体，彼此相互促进、共同成长，教师在教的过程中也获得提升；其四，心理层面宽容理解，教师理解学生的个体差异，包容学生的错误，关注学生的内心感受。**。"},{"t":"优化师生关系的实践建议","d":"议第一，转变教育观念，树立以生为本的学生观与平等师生观。这是构建良好师生关系的根本前提。林老师需要从根本上转变教师中心的理念，真正将学生作为学习与发展的主体，将学生的人格尊严、内心感受放在比纪律、成绩更重要的位置。处理课堂问题时，先站在学生的角度考虑原因，而非简单动用权威惩罚，比如学生课堂打哈欠，可先通过眼神示意、课后询问原因的方式处理，保护学生的自尊心，让教育充满温度。第二，主动研究学生，尊重个体差异，实现因材施教。要主动走近学生，通过访谈、谈心、作业反馈等多种方式，深入了解学生的知识基础、学习节奏、心理状态与兴趣需求，尤其关注学困生的学习困难。在此基。"},{"t":"转变教育观念，树立以生为本的学生观与平等师生观","d":"生为本的学生观与平等师生观。这是构建良好师生关系的根本前提。林老师需要从根本上转变教师中心的理念，真正将学生作为学习与发展的主体，将学生的人格尊严、内心感受放在比纪律、成绩更重要的位置。处理课堂问题时，先站在学生的角度考虑原因，而非简单动用权威惩罚，比如学生课堂打哈欠，可先通过眼神示意、课后询问原因的方式处理，保护学生的自尊心，让教育充满温度。"}]}]},{"id":"预测6-6-36","num":36,"title":"36 品德不良与矫正","subject":"教心","blocks":[{"t":"（1）结合道德认知发展理论","items":[{"t":"小王道德认知所处的发展阶段","d":"展阶段**从道德认知发展的阶段特征来看，小王整体仍停留在较低的发展水平，带有鲜明的功利化与他律道德特征，价值观偏差问题突出。其一，道德判断以自我利益为核心，奉行相对功利的行为准则。他固执地认为“弱者理应被欺负”，将欺凌弱小作为获取优越感、索取利益的合理手段；认为成绩落后只能依靠作弊，将分数作为学习的唯一目标，完全无视规则的公平性与道德性。判断行为好坏的标准是“对自己有没有好处”，而非是否符合普遍的道德规范，属于典型的相对功利取向。其二，对道德规则的认知停留在外部强制层面，未内化为自身价值准则。小王轻视规则与道德规范，认为规则是用来约束弱者的，自身有能力就可以突破规则。"},{"t":"道德认知与道德行为脱节的具体表现","d":"节的具体表现**完整的品德结构是道德认知、道德情感、道德意志、道德行为的统一体，认知是行为的思想基础，行为是认知的外在体现。小王的品德结构存在明显的失衡与扭曲，认知与行为的脱节体现在三个层面：。"},{"t":"道德认知与行为脱节的深层原因","d":"深层原因第一，道德认知本身存在根本性偏差，缺乏正确的是非判断基础。小王长期处于正向引导缺失的成长环境中，错误的生活经验让他形成了“力量至上”的生存逻辑，没有建立起符合社会规范的道德认知体系。认知本身的方向错误，自然无法引导正确的行为，这是知行脱节的根源。第二，道德情感发展严重缺失，认知缺乏内在动力支撑。小王家庭关爱长期缺位，缺乏正向情感滋养，导致情感冷漠、共情能力不足，无法体会他人的痛苦与感受，伤害他人时没有羞耻感，违反规则时没有愧疚感。道德情感是认知转化为行为的动力，动力缺失自然导致认知与行为脱节。第三，道德意志薄弱，无法用认知约束行为冲动。小王处于青。"},{"t":"道德认知本身存在根本性偏差，缺乏正确的是非判断基础","d":"性偏差，缺乏正确的是非判断基础。小王长期处于正向引导缺失的成长环境中，错误的生活经验让他形成了“力量至上”的生存逻辑，没有建立起符合社会规范的道德认知体系。认知本身的方向错误，自然无法引导正确的行为，这是知行脱节的根源。"}]},{"t":"（2）结合影响品德发展的因素，分析小王品德不良的成因。","items":[{"t":"外部环境因素是品德不良形成的核心诱因","d":"良形成的核心诱因第一，家庭环境的系统性缺陷是品德问题的根源。家庭是儿童品德发展的第一课堂，家庭结构、教养方式、家庭氛围直接决定品德发展的基础底色。小王的家庭存在多重育人缺陷：其一，家庭结构破损，教育功能长期缺位。父母离异后小王跟随父亲生活，父亲常年外出务工，家庭教育几乎空白；日常照料的奶奶只关注生活照顾，缺乏品德教育意识，对任性、违纪、欺凌行为一味纵容，没有及时纠正偏差，让小王从小就没有建立清晰的规则边界。其二，教育方式简单粗暴，引发逆反心理。父亲返乡后，发现问题只会严厉打骂，缺乏耐心的沟通疏导与价值观引导，不仅没有纠正错误认知，反而激化了小王的逆反心理。"},{"t":"家庭环境的系统性缺陷是品德问题的根源","d":"是品德问题的根源。家庭是儿童品德发展的第一课堂，家庭结构、教养方式、家庭氛围直接决定品德发展的基础底色。小王的家庭存在多重育人缺陷：其一，家庭结构破损，教育功能长期缺位。父母离异后小王跟随父亲生活，父亲常年外出务工，家庭教育几乎空白；日常照料的奶奶只关注生活照顾，缺乏品德教育意识，对任性、违纪、欺凌行为一味纵容，没有及时纠正偏差，让小王从小就没有建立清晰的规则边界。其二，教育方式简单粗暴，引发逆反心理。父亲返乡后，发现问题只会严厉打骂，缺乏耐心的沟通疏导与价值观引导，不仅没有纠正错误认知，反而激化了小王的逆反心理，让他更加抵触正向教育，甚至用更极端的行为对抗管教。其三，缺乏正向道德榜样。"},{"t":"个体内部因素是品德不良形成的内在依据","d":"良形成的内在依据第一，道德认知偏差是品德问题的思想根源。小王的道德认知不仅水平低，而且存在系统性的价值观偏差，错误地将力量、利益作为判断行为的标准，轻视道德规则与社会规范，没有形成正确的是非观、公正观、责任观。认知层面的方向性错误，直接导致行为的整体走偏，是所有不良行为的内在思想根源。同时他的认知片面、极端，只能看到规则对自己的约束，看不到规则对所有人的保护作用，因此从内心排斥道德规范。第二，道德情感缺失是品德偏差的心理动因。小王长期缺乏稳定的家庭关爱与情感滋养，导致情感冷漠、共情能力不足，无法站在他人角度体会痛苦，因此欺凌同学时毫无愧疚，伤害他人时心安。"},{"t":"道德认知偏差是品德问题的思想根源","d":"题的思想根源。小王的道德认知不仅水平低，而且存在系统性的价值观偏差，错误地将力量、利益作为判断行为的标准，轻视道德规则与社会规范，没有形成正确的是非观、公正观、责任观。认知层面的方向性错误，直接导致行为的整体走偏，是所有不良行为的内在思想根源。同时他的认知片面、极端，只能看到规则对自己的约束，看不到规则对所有人的保护作用，因此从内心排斥道德规范。"}]},{"t":"（3）结合文件要求","items":[{"t":"建立信任联结，消解对抗情绪，筑牢品德矫正的情感基础","d":"抗情绪，筑牢品德矫正的情感基础**品德不良的学生往往对教师抱有戒心与敌意，存在牢固的心理防线，单纯的批评说教只会激化矛盾，无法发挥教育效果。矫正教育的第一步，是建立信任的师生关系，用关爱消解对立。"},{"t":"纠正认知偏差，强化规则意识，夯实品德发展的思想基础","d":"则意识，夯实品德发展的思想基础**道德认知是品德形成的前提，针对小王价值观偏差、规则意识淡薄的问题，结合道德与法治启蒙要求，系统开展认知矫正，从根源上扭转思想偏差。"},{"t":"培育道德情感，锻炼道德意志，构建品德的内在约束动力","d":"德意志，构建品德的内在约束动力**针对小王道德情感缺失、意志薄弱的问题，从共情培养、羞耻感激发、意志训练入手，让道德认知获得情感与意志的支撑，转化为内在的行为约束力。"},{"t":"强化行为训练，固化良好习惯，实现行为层面的持久转变","d":"好习惯，实现行为层面的持久转变**结合良好行为习惯养成的要求，通过目标引导、正向强化、集体约束，帮助小王用新的良好行为习惯替代旧的行为惯性。"},{"t":"推动家校社协同，整合育人力量，构建品德矫正的环境支撑","d":"育人力量，构建品德矫正的环境支撑**小王的品德问题根源在家庭，受同伴影响深，单靠学校教育难以根治，必须构建学校主导、家庭尽责、社会支持的协同育人体系，形成矫正合力。"}]}]}]},{"name":"柯虎1","questions":[{"num":31,"title":"31 颜之推的家庭教育及其启示·中频","subject":"中教史","blocks":[{"t":"颜之推家庭教育思想：","items":[{"t":"重视儿童早期教育，强调及早施教。","d":"调及早施教。幼年时期是奠定基础的重要阶段，长辈应利用好这个教育时机，及早对幼儿进行教育。"},{"t":"幼年时期是奠定基础的重要阶段，长辈应利用好这个教育时机，及早对幼儿进行教育","d":"重要阶段，长辈应利用好这个教育时机，及早对幼儿进行教育。（2）。"},{"t":"主张严与慈相结合的教育原则：不善于教育子女的父母","d":"育原则：不善于教育子女的父母，往往重爱轻教，对幼儿一味溺爱，任其为所欲为，在子女面前没有威信。为了达到教育目的，不论是怒责还是鞭笞，只要是有效的手段都是可以采用的。（3）。"},{"t":"强调教育切忌偏宠：不管子女聪慧与否，都应以同样的爱护与教育标准来对待。","d":"不管子女聪慧与否，都应以同样的爱护与教育标准来对待。（4）。"},{"t":"重视学习通用语言，不强调方言：父母对儿童学习正确的语言负有重要的责任，不可轻视。","d":"强调方言：父母对儿童学习正确的语言负有重要的责任，不可轻视。（5）注重儿童道德教育：儿童道德教育应包括以孝悌为中心的人伦道德教育和立志。"}]},{"t":"启示：","items":[{"t":"理论上的启示：家庭教育的重要性：颜之推强调家庭教育对于培养孩子品德和修养的重要性","d":"家庭教育的重要性：颜之推强调家庭教育对于培养孩子品德和修养的重要性。这一观点在当今依然适用，家庭是孩子最早接触到的社会环境，家庭教育对孩子的成长起着决定性的作用。"},{"t":"父母的责任：现代父母要认识到自己的责任，积极参与孩子的教育，成为良好的榜样","d":"现代父母要认识到自己的责任，积极参与孩子的教育，成为良好的榜样。（2）。"},{"t":"实践上的启示：培养孩子的自主性：现代家庭教育应注重培养孩子的自主性","d":"培养孩子的自主性：现代家庭教育应注重培养孩子的自主性，鼓励他们独立思考、解决问题和做出决策。培养孩子的品德和道德：颜之推注重培养孩子的品德和道德修养，强调孝道、仁爱和诚信等价值观。现代家庭教育也应注重培养孩子的品德和道德修养，帮助他们成为有责任感和正确价值观的人。（3）。"},{"t":"对当今教育的启示：","d":"注重对传统文化的传承：颜之推注重对传统文化的传承，他的家庭教育思想与中国传统文化相契合。在当今社会，传承和弘扬传统文化仍然具有重要意义，可以帮助孩子树立正确的价值观、增强文化认同。把握对现代教育的创新：尽管颜之推的家庭教育思想有其独特的价值，但在现代社会，我们也需要根据时代的变化和教育的需求进行创新。现代家庭教育需要结合科技、社会变革和全球化的趋势，为孩子提供更全面、多元化的教育。总的来说，颜之推的家庭教育思想给我们提供了许多有益的启示，包括家庭教育的重要性、父母的责任、培养孩子的自主性和品德修养等。这些启示在现代家庭教育中仍然具有指导意义。32.。"}]}],"id":"柯虎1-31"},{"num":32,"title":"32 实用主义教育家杜威的教育无目的论…·高频","subject":"外教史","blocks":[{"t":"启示杜威的“教育无目的论”并不是说教育真的没有目的","items":[{"t":"今社会在教学中应该关注到儿童的身心发展水平以及儿童的兴趣和需要","d":"注到儿童的身心发展水平以及儿童的兴趣和需要，对儿童的教育是一个持续不断的社会化的过程，我们要多关注儿童，不能够无视儿童的想法及观点，消极的对待儿童，不考虑儿童的兴趣与需要，这些都是不合理的教学观点。（2）。"},{"t":"教育要注意尊重儿童的愿望","d":"愿望，使儿童从教育本身、从生长过程中得到乐趣，学生在学习中感受到了乐趣他才会主动去学习，而不会厌学，这样可以更好的激发学生的学习积极性。（3）。"},{"t":"教育目的的设立必须与学生进行合作完成。教育者需要提供学生能力有所发挥的环境。","d":"学生进行合作完成。教育者需要提供学生能力有所发挥的环境。"},{"t":"如果教师把目的强加给了学生","d":"了学生，从而使教师的智慧受到限制，使教师局限于现有的课程、教法，因此没有创新，思想不能和教材、学生发生密切的联系。这样教师也就不能更好地利用教材，不能去理解学生的真正需要，教育的作用就没办法很好地发挥，也不利于学生的成长。因此应该遵循学生的身心发展规律，尊重儿童的天性。"}]}],"id":"柯虎1-32"},{"num":33,"title":"33 对于教师职业特点与教师要求·高频","subject":"教原","blocks":[{"t":"（1）简述“经师”和“人师”的区别。","items":[{"t":"示范性：示范性是教师劳动最突出的特点，孔子曰：“其身正，不令而行；其身不正，虽令不从","d":"劳动最突出的特点，孔子曰：“其身正，不令而行；其身不正，虽令不从。”教师的言谈举止、人品道德都对学生起到示范作用，潜移默化间影响学生的道德发展，因此教师需要润己泽人，不断提高自身的道德修养成为“人师”，从而带动学生。"},{"t":"复杂性：教师的劳动对象、劳动任务、劳动手段和劳动过程是复杂的","d":"象、劳动任务、劳动手段和劳动过程是复杂的。首先，教师面对的对象是人，是具有情感的不同的学生，因此教师需要因材施教；其次，教师需要教书育人，实现学生德智体美劳的全面发展。只有成为“人师”，教师才能照顾学生的个性化特点，不仅提升学生的知识，而且涵养学生品德，成为健全的人。"},{"t":"创造性：劳动性质和劳动对象决定了教师劳动的创造性","d":"动对象决定了教师劳动的创造性，主要表现在对学生因材施教，高水平的教育机制，教学内容和教学方法的选择。“人师”要求教师把自己的温暖和情感倾注到每一个学生身上，让每一个学生都健康成长，让每一个孩子都有人生出彩的机会，体现了教师工作的创造性。"},{"t":"长期性和长效性：一方面教师对学生的影响不是短时间内就可以完成的，而是一个长期、动态的过程","d":"进行举例论述。第三问“教师如何做‘经师’和‘人师’的统一者”即考查教师如何处理好知识传授与品德教育，可从树立良好的学生观、提升自身素养、建立良好的师生关系进行回答，也可从其他方面进行论述，答案不唯一，言之有理即可。"}]},{"t":"（2）结合教师职业的特点，论述成为“人师”的必要性。","items":[{"t":"树立正确的学生观","d":"教师应认识到学生是未成熟的人、具有主体性的人、独特的人和有特定权责的人，学生以系统学习间接经验为主，具有主体性、独立性、选择性、个体性、创造性、自我意识、差异性和明显的发展特征。因此，教师在教育时，应注意做到因材施教，尊重学生的主体性特征。②。"},{"t":"提升自身的专业素养，教师专业素养包括专业理想、专业知识和专业能力","d":"教师专业素养包括专业理想、专业知识和专业能力。要成为“经师”和“人师”的统一者，教师首先要树立教育理想，做学生成长的引领者、文化的传播者和发展者、社会物质文明和精神文明建设的推动者；其次，要广泛学习，增强自身的专业知识，“有一桶水，才能给学生一瓶水”，教师不仅要学习学科教学知识、课程知识，还要学习社区教育情境知识等；最后，教师还要扎实专业能力，不仅能够具备高超的教授学科知识，还具备教学机智，擅长处理各类教学事件。③。"},{"t":"建立良好的师生关系","d":"教师与学生间应建立相互配合、民主平等、教学相长、心理相容的师生关系，以人格魅力呵护学生心灵，以学术造诣开启学生智慧，以模范行为影响和带动学生。34.。"}]}],"id":"柯虎1-33"},{"num":34,"title":"34 教育热点问题·中频","subject":"教原","blocks":[{"t":"（1）阅读上述材料","items":[{"t":"培养解决问题的能力：学生通过亲身解决问题的经验","d":"学生通过亲身解决问题的经验，可以学会思考和解决问题的步骤，而不是仅仅依赖于教师提供的答案。②。"},{"t":"长远学习进步：那些在确定所需相关事实以及从哪里和如何获取事实方面有过专门练习的学生","d":"那些在确定所需相关事实以及从哪里和如何获取事实方面有过专门练习的学生，在学习解决问题时显示出更大的进步。这种技能的早期习得，使得学生在更高阶段的学习中不需要再对这些基本技能进行特别强调，从而可以更专注于高级问题的解决。（2）①自主学习符合建构主义强调的主动性。以皮亚杰和维果斯基为代表的建构主义理论认为知识是一种暂定性的解释和假设，学习者并不是空着脑袋进入学习情景中的。在日常生活和以往各种形式的学习中，他们建构主义认为学生的学习具有主动建构性、活动情景性、社会互动性。学习不是由教师把知识简单地传递给学生，而是一个学生积极、主动参与的过程。学生不是简单被动地接收信息，而是主动地建构知识的意义，这。"}]},{"t":"（2）2022年3月","items":[{"t":"以皮亚杰和维果斯基为代表的建构主义理论认为知识是一种暂定性的解释和假设","d":"代表的建构主义理论认为知识是一种暂定性的解释和假设，学习者并不是空着脑袋进入学习情景中的。在日常生活和以往各种形式的学习中，他们建构主义认为学生的学习具有主动建构性、活动情景性、社会互动性。学习不是由教师把知识简单地传递给学生，而是一个学生积极、主动参与的过程。学生不是简单被动地接收信息，而是主动地建构知识的意义，这种建构无法由他人代替。学习需要创设一些具体的教育情景，教师通过情境教学的方式，可以帮助学生更好地理解知识。建构主义，尤其是社会建构主义，特别注意强调在他人帮助或者合作学习的方式下进行学习。"},{"t":"学习是学习者主动建构的过程","d":"的过程。我们应该树立新的知识观、学习观和教学观，根据儿童身心发展的水平选择适合其身心发展特点的教育内容。学生积极、主动地参与活动非常重要。"},{"t":"教师在教学过程中","d":"要引导学生从旁观者逐渐转变为教学活动的参与者，在社会性互动中获得知识和技能。②。"},{"t":"自主学习符合人本理论的“非指导性教学原则”。","d":"的“非指导性教学原则”。以罗杰斯为代表的人本理论认为，在传统教育中，教师是知识的拥有者，学生只是被动的接受者，教师可以通过讲演、考试甚至嘲弄等方式来支配学生的学习，而学生无所适从；教师是权力的拥有者，而学生是服从者。罗杰斯主张废除“教师”这一角色，代之以“学习的促进者”，进行“非指导性教学”。人本主义心理学家主张的“做”中学和在学习过程中学习者如何学习的观点有利于在教育教学中消除老师与学生、学和做、目的和手段之间的对立，使学习成为乐趣。35.。"}]}],"id":"柯虎1-34"},{"num":35,"title":"35 对于小组合作学习的理解","subject":"教原","blocks":[{"t":"（1）从社会发展对教育的需求角度，分析合作学习的必要性。","items":[{"t":"经济发展的需求：合作学习可以培养学生的团队合作能力","d":"合作学习可以培养学生的团队合作能力，这对未来的工作是非常必要的，因为现代经济活动越来越依赖团队分工与协作。"},{"t":"政治民主化的需求：合作学习可以培养学生的民主态度与公民意识","d":"合作学习可以培养学生的民主态度与公民意识，这对未来的社会参与与国家建设是非常必要的。"},{"t":"文化多元化的需求：合作学习可以让不同文化背景的学生互相交流与理解","d":"合作学习可以让不同文化背景的学生互相交流与理解，这对构建和谐社会是非常必要的。"},{"t":"科技创新与发展的需求：合作学习可以发挥学生的创造力与实践能力","d":"合作学习可以发挥学生的创造力与实践能力，培养创新人才，这对国家科技进步是非常必要的。知识爆炸与更新的需求：合作学习可以实现资源共享，让学生相互学习与进步，这对学生适应未来是非常必要的。（2）教学方式：长期以来，课堂教学以教师讲授为主，学生习惯被动接受知识，不习惯主动参与和互动。教学评价：课堂讲授和个别发言强调个人表现，而合作学习需要团队协作。教学氛围：课堂氛围严肃，不鼓励讨论，学生不习惯团队互动。（3）从学校教学改革的角度，我认为可以提出以下帮助学生适应合作学习的建议：目的：加强对学生合作能力的培养，如沟通协调能力、问题解决能力、自我管理能力等。内容：设置一些需要综合各学科知识完成的项目，让。"}]},{"t":"（2）从现行课堂教学方式的角度","items":[{"t":"教学评价：课堂讲授和个别发言强调个人表现，而合作学习需要团队协作","d":"课堂讲授和个别发言强调个人表现，而合作学习需要团队协作。"},{"t":"教学氛围：课堂氛围严肃，不鼓励讨论，学生不习惯团队互动","d":"课堂氛围严肃，不鼓励讨论，学生不习惯团队互动。（3）从学校教学改革的角度，我认为可以提出以下帮助学生适应合作学习的建议：目的：加强对学生合作能力的培养，如沟通协调能力、问题解决能力、自我管理能力等。内容：设置一些需要综合各学科知识完成的项目，让学生体会跨学科合作的意义。增加一些需要团队合作完成的项目、练习任务或案例分析等，营造合作氛围。方法：循序渐进，逐步增加合作学习在课程中的比重和时间，让学生有一个适应的过程。鼓励教师充分肯定学生的合作行为，营造积极的合作学习氛围。鼓励教师创设灵活多样的合作学习模式，而不仅是固定的小组讨论。管理：制定学生合作行为规范，并让学生参与制定，提高合作意识。逐步进。"}]},{"t":"（3）从学校教学改革的角度，提出帮助学生适应合作学习的建议","items":[{"t":"目的：加强对学生合作能力的培养，如沟通协调能力、问题解决能力、自我管理能力等","d":"有组织、有计划的系统教育活动。非正规教育由非官方或非专职机构/个人实施，无统一规范，以满足特定需求为目标的非系统、灵活化的教育活动。实体教育以“线下物理空间”为载体的教育活动，强调“面对面互动”，与“线上虚拟教育”相对，仅强调实施场景，不涉及“机构认可”或“组织规范性”。社会教育由社会机构或社会群体实施，以普及知识、提升社会素养为目标的教育活动，是“学校教育、家庭教育”之外的第三方教育，强调实施主体的社会性。故本题选A。2.B。"},{"t":"内容：设置一些需要综合各学科知识完成的项目，让学生体会跨学科合作的意义","d":"故本题选B。10.B【解析】本题考查《教育学原理》布鲁姆教育目标分类学。布鲁姆将认知领域的教育目标从低到高分为六个层次。题干明确强调“将所学概念、规则。"},{"t":"方法：循序渐进，逐步增加合作学习在课程中的比重和时间，让学生有一个适应的过程","d":"规律和理论应用于新情境”，符合“运用”分类。故本题选B。11.C。"},{"t":"鼓励教师充分肯定学生的合作行为，营造积极的合作学习氛围","d":"的合作行为，营造积极的合作学习氛围。鼓励教师创设灵活多样的合作学习模式，而不仅是固定的小组讨论。管理：制定学生合作行为规范，并让学生参与制定，提高合作意识。逐步进行这些改革，可以帮助学生更好地适应和参与合作学习。加强家校合作，让家长了解并支持学校的合作学习改革。评价：改革考核评价方法，增加过程考核和团队考核的比重，体现团队合作的价值。36.。"}]}],"id":"柯虎1-35"},{"num":36,"title":"36 维纳的成败归因理论·高频","subject":"教心","blocks":[{"t":"（1）结合维纳的归因理论，分析材料中同学的归因方式。","items":[{"t":"内部与外部、稳定与不稳定、可控与不可控","d":"（1）根据维纳的成败归因理论，人们倾向于将活动成败的原因归结于六个因素：能力高低、努力程度、任务难度、运气好坏、身心状态、外界环境等。这六个因素可以归为三个维度：内部与外部、稳定与不稳定、可控与不可控。"},{"t":"小雅的归因方式为努力归因，即内部、不稳定、可控的归因方式。","d":"归因，即内部、不稳定、可控的归因方式。②。"},{"t":"小斌的归因方式为能力归因，即内部、稳定、不可控的归因方式。","d":"归因，即内部、稳定、不可控的归因方式。③。"},{"t":"小辉的归因方式为任务难度归因，即外部、稳定、不可控的归因方式。","d":"难度归因，即外部、稳定、不可控的归因方式。（2）作为老师，我们要培养学生努力导致成功的归因观。相信成功与努力之间有必然的联系，人就不容易表现出消极行为，不容易产生无力感，这样有助于培养学生的学习动机。教师可通过以下方式引导学生正确归因：①教师应引导学生进行客观归因，尽量地将学习上的成功归因于自己的能力和努力，而将学习上的失败归因于内部的不稳定因素，即努力不够，只有这样才能使学生产生更高的学习动机，树立对下次学习成功的期望。②教师要帮助学生建立积极的自我概念，在日常工作中慎重地对学生做出评价，以引导学生建立积极的自我概念，从而激发学习动机。③需要注意的是，不能将一切归因于努力。如果学生已经非常努。"}]},{"t":"（2）如果你是这位数学老师","items":[{"t":"教师应引导学生进行客观归因","d":"观归因，尽量地将学习上的成功归因于自己的能力和努力，而将学习上的失败归因于内部的不稳定因素，即努力不够，只有这样才能使学生产生更高的学习动机，树立对下次学习成功的期望。②。"},{"t":"教师要帮助学生建立积极的自我概念","d":"极的自我概念，在日常工作中慎重地对学生做出评价，以引导学生建立积极的自我概念，从而激发学习动机。③。"},{"t":"需要注意的是，不能将一切归因于努力","d":"一切归因于努力。如果学生已经非常努力但是仍然没有成功，则容易导致习得性无助，所以教师应帮助学生找到正确的原因。"}]}],"id":"柯虎1-36"}],"id":"柯虎1"},{"name":"柯虎2","questions":[{"num":31,"title":"31 陈鹤琴的“活教育”体系·中频","subject":"中教史","blocks":[{"t":"陈鹤琴是我国著名的儿童教育家","items":[{"t":"“活教育”的目的论：“做人，做中国人，做现代中国人”是陈鹤琴“活教育”的目的论。","d":"做人，做中国人，做现代中国人”是陈鹤琴“活教育”的目的论。"},{"t":"他对“现代中国人”提出五方面的要求要有健全的身体","d":"出五方面的要求要有健全的身体、要有建设的能力、要有创造的能力、要能够合作、要服务。②。"},{"t":"“活教育”的课程论：“大自然、大社会都是活教材”是陈鹤琴对“活教育”的课程论的概括表述","d":"大自然、大社会都是活教材”是陈鹤琴对“活教育”的课程论的概括表述。但是陈鹤琴并不摒弃课本，也不反对间接经验。③。"},{"t":"“活教育”的教学论：教学原则为“做中教，做中学，做中求进步”。","d":"教学原则为“做中教，做中学，做中求进步”。陈鹤琴强调以做为基础，确立学生在教学活动中的主体性，鼓励学生积极“做”的时候，教师要进行有效的指导。他提出“活教育教学的四个步骤：实验观察、阅读思考、创作发表、批评研讨。陈鹤琴批判传统教育忽视儿童生活和主体性，力图去除以学校和课堂为中心而脱离社会生活、以书本为中心而脱离实际和实践、以教师为中心而漠视学生的存在等弊端，充分考虑了中国的时代背景和国情。（2）现代价值意义。活教育”思想的提出，为我国近代教育事业带来了一片光明前景，对现代社会的发展，有着重要价值和意义。①“活教育”开创了对新型教育模式探索的先河。“活教育”无论是在教学目的、教学内容、还是教学。"}]},{"t":"现代价值意义。","items":[{"t":"活教育”思想的提出","d":"为我国近代教育事业带来了一片光明前景，对现代社会的发展，有着重要价值和意义。①。"},{"t":"“活教育”开创了对新型教育模式探索的先河。","d":"型教育模式探索的先河。“活教育”无论是在教学目的、教学内容、还是教学方法上，都是陈鹤琴长期教育研究与教育实践的总结，针对中国传统教育，他能够去其糟粕取其精华，将学生学习带向社会，融入自然。这一方面拓宽了学生视野，教会他们如何做人；另一方面，改变了以往毫无生气的课堂面貌，更有利于学生身心发展和智力提升。这种新型教学模式，在之前从未出现过，可以说它开创了我国教学改革的先河。"},{"t":"“活教育”无论是在教学目的、教学内容、还是教学方法上","d":"学目的、教学内容、还是教学方法上，都是陈鹤琴长期教育研究与教育实践的总结，针对中国传统教育，他能够去其糟粕取其精华，将学生学习带向社会，融入自然。这一方面拓宽了学生视野，教会他们如何做人；另一方面，改变了以往毫无生气的课堂面貌，更有利于学生身心发展和智力提升。这种新型教学模式，在之前从未出现过，可以说它开创了我国教学改革的先河。②。"},{"t":"“活教育”确立了儿童在教学中的重要地位。","d":"在教学中的重要地位。“活教育”的提出，首次将儿童的重要性摆在了教育的首位。陈鹤琴认为，幼教工作的开展，应当以尊重儿童、热爱儿童和了解儿童为前提，将他们视为具有独立人格的个体；而不是成年人的附属品。只有这样，在开展“活教育”的过程中，才有利于培养儿童自尊自信的良好品格，满足个性发展需求。这种进步的理念，为日后我国的幼教事业广泛接受并采纳。③。"},{"t":"“活教育”明确了我国的教学目的和教学理念。","d":"的教学目的和教学理念。“活教育”明确强调，其目的是教会国人如何做一名现代中国人这是一种带有鲜明爱国特色且符合中国国情的教育理念。它不同于传统盲目的教育学习，也不是照搬别国、忽略本国历史文化与社会现实的教学，它的提出更激发了国人学习的热情。在教学理念上，“活教育”明确表示，幼儿的教育工作，是极为复杂的，并非仅仅依靠幼稚园一方努力就可取得良好效果，对幼儿的培养还离不开家庭和社会的关注。只有三方相互协调配合，才有助于儿童身心更健康发展。这理念的提出，大大引发了社会和家庭对儿童的关注。④“活教育”为中国推行素质教育打下了基础。“活教育”思想是我国目前推行素质教育理念的缩影，素质教育要求尊重学生身心发展。"}]}],"id":"柯虎2-31"},{"num":32,"title":"32 赫尔巴特的课程论","subject":"外教史","blocks":[{"t":"兴趣观是赫尔巴特设置课程的基本依据之一。","items":[{"t":"课程内容的选择和编制应该与儿童的兴趣保持一致","d":"应该与儿童的兴趣保持一致。赫尔巴特将兴趣分为经验类的兴趣和同情类的兴趣。"},{"t":"经验类的兴趣包括经验的、审美的、思辨的","d":"的、审美的、思辨的。经验的兴趣应设自然、物理、化学和地理等课程；思辨的兴趣，应设数学、逻辑和文法等课程；审美的兴趣，应设文学、绘画等课程。"},{"t":"同情类的兴趣包括同情的、社会的、宗教的","d":"的、社会的、宗教的。同情的兴趣，应设本国语、外国语等课程。"},{"t":"社会的兴趣，应设历史、政治、法律；宗教的兴趣，应设神学等课程","d":"政治、法律；宗教的兴趣，应设神学等课程。（2）兴趣观是赫尔巴特确立教学形式阶段论的重要依据。赫尔巴特从心理学角度出发，将兴趣分为四阶段：注意、期待、探求、行动。与之对应，他提出了教学形式阶段理论：明了、联合、系统、方法。在教学的明了阶段，学生的兴趣表现为注意，处于静止的专心活动，教师通过提示来使学生获得清晰的表象；在教学的联合阶段，兴趣表现为期待，教师运用分析的教学方法：在系统的教学阶段，兴趣处于探求阶段，教师运用综合的教学方法；在方法阶段，教师要求学生自己进行活动，通过练习来巩固新的知识。33.。"}]},{"t":"兴趣观是赫尔巴特确立教学形式阶段论的重要依据。","items":[{"t":"赫尔巴特从心理学角度出发，将兴趣分为四阶段：注意、期待、探求、行动","d":"出发，将兴趣分为四阶段：注意、期待、探求、行动。"},{"t":"与之对应，他提出了教学形式阶段理论：明了、联合、系统、方法","d":"学形式阶段理论：明了、联合、系统、方法。"},{"t":"在教学的明了阶段","d":"学生的兴趣表现为注意，处于静止的专心活动，教师通过提示来使学生获得清晰的表象。"},{"t":"在教学的联合阶段，兴趣表现为期待，教师运用分析的教学方法：","d":"趣表现为期待，教师运用分析的教学方法：在系统的教学阶段，兴趣处于探求阶段，教师运用综合的教学方法；在方法阶段，教师要求学生自己进行活动，通过练习来巩固新的知识。33.。"}]}],"id":"柯虎2-32"},{"num":33,"title":"33 教原·高频","subject":"教原","blocks":[{"t":"（1）阅读材料","items":[{"t":"课程建设以核心素养为导向","d":"导向的理由有：国际竞争力、现代化、教育改革。我国培养学生核心素养有：人文底蕴、科学精神、学会学习、健康生活、责任担当、实践创新。做法上可以从课程目的、课程内容、课程方法、课程评价这些角度进行回答（任选两点即可）。"},{"t":"课程建设以核心素养为导向，是深化教育综合改革、加快推进教育现代化的需要","d":"导向，是提升我国国际竞争力、建设教育强国的需要。课程建设以核心素养为导向，是推进我国社会现代化、人的现代化、贯彻党的教育方针的需要。课程建设以核心素养为导向，是深化教育综合改革、加快推进教育现代化的需要。（2）我国核心素养包括文化基础、自主发展、社会参与三个维度。其中文化基础包括人文底蕴、科学精神；自主发展包括学会学习、健康生活：社会参与包括责任担当、实践创新。（3）。"}]},{"t":"（2）我国要培养的学生核心素养是什么？","items":[{"t":"其中文化基础包括人文底蕴、科学精神；","d":"（2）我国核心素养包括文化基础、自主发展、社会参与三个维度。其中文化基础包括人文底蕴、科学精神；自主发展包括学会学习、健康生活：社会参与包括责任担当、实践创新。"},{"t":"自主发展包括学会学习、健康生活：","d":"（2）我国核心素养包括文化基础、自主发展、社会参与三个维度。其中文化基础包括人文底蕴、科学精神；自主发展包括学会学习、健康生活：社会参与包括责任担当、实践创新。"},{"t":"社会参与包括责任担当、实践创新","d":"实践创新。（3）第一，以核心素养为导向开发课程体系，明确课程目标。课程是为落实培养目标服务的。课程标准研制、教材开发、课程资源建设，都要紧扣核心素养这个育人目标，都要与核心素养精准对接，并以核心素养为中心，不断精简内容，优化结构，加强跨学科学习，做到减负增效。"}]},{"t":"（3）如何推动以核心素养为导向的课程建设？","items":[{"t":"课程是为落实培养目标服务的","d":"服务的。课程标准研制、教材开发、课程资源建设，都要紧扣核心素养这个育人目标，都要与核心素养精准对接，并以核心素养为中心，不断精简内容，优化结构，加强跨学科学习，做到减负增效。"},{"t":"第二，以核心素养为导向选择课程内容","d":"（3）第一，以核心素养为导向开发课程体系，明确课程目标。课程是为落实培养目标服务的。课程标准研制、教材开发、课程资源建设，都要紧扣核心素养这个育人目标，都要与核心素养精准对接，并以核心素养为中心，不断精简内容，优化结构，加强跨学科学习，做到减负增效。第二，以核心素养为导向选择课程内容。新课程方案要求明确提出“基于核心素养培养要求，明确课程内容选什么、选多少”，注重与学生经验、社会生活的关联，加强课程内容的内在联系，突出课程内容结构化，探索主题、项目、任务等内容组织方式。第三，以核心素养为导向深化教学改革方式。满堂灌、死记硬背、题海战术等传统教学方法是难以。"},{"t":"新课程方案要求明确提出“基于核心素养培养要求","d":"出“基于核心素养培养要求，明确课程内容选什么、选多少”，注重与学生经验、社会生活的关联，加强课程内容的内在联系，突出课程内容结构化，探索主题、项目、任务等内容组织方式。"},{"t":"第三，以核心素养为导向深化教学改革方式","d":"向深化教学改革方式。满堂灌、死记硬背、题海战术等传统教学方法是难以培育出核心素养的。新课程方案要求准确把握课程要培养的学生核心素养，明确教学内容和教学活动的素养要求，改革教学过程和教学方法，把核心素养的培养落实到具体教育教学活动中。培育学生的核心素养，尤其是培养创新能力与批判性思维、需要运用启发式、探究式、讨论式、参与式教学，激发学生的好奇心，培养学生的兴趣爱好，营造独立思考自由探索、勇于创新的良好环境。"}]}],"id":"柯虎2-33"},{"num":34,"title":"34 教育热点问题“唯分数论”的观点","subject":"教原","blocks":[{"t":"（1）阅读上述材料","items":[{"t":"分数的评价维度单一，只考察知识掌握，而不涵盖学生的全面发展。","d":"只考察知识掌握，而不涵盖学生的全面发展。"},{"t":"总分的意义也是有限的，在日常学习过程中，总分与排名并不会给学生带来更好的学习。","d":"在日常学习过程中，总分与排名并不会给学生带来更好的学习。第二问则可以从相关的学习理论，行为、认知（发现、接受）、建构、人本等角度进行分析。学习动机理论则可以从强化、需要层次、成败归因、目标定向、自我效能、自我价值、自我决定等角度言之有理即可。"}]},{"t":"（2）《2022版义务教育课程方案》指出","items":[{"t":"根据建构主义学习理论，学生是积极主动的学习者，他们通过参与和互动来构建知识","d":"学生是积极主动的学习者，他们通过参与和互动来构建知识。"},{"t":"观察、记录和分析学习过程可以更好地了解学生的学习方式和策略","d":"过程可以更好地了解学生的学习方式和策略，从而提供有针对性的指导和支持。"},{"t":"根据人本主义学习理论，学习是学生知情统一的过程","d":"学习是学生知情统一的过程。加强对话交流和倡导协商式评价可以促进师生之间的互动和合作，建立积极的学习氛围，使评价过程更加综合和全面。这样的评价方式能够更好地满足学生的学习需求，促进他们的全面发展。②。"},{"t":"相关的学习动机维纳归因理论认为，引导学生正确归因可以进一步激发学生的学习动机","d":"因理论认为，引导学生正确归因可以进一步激发学生的学习动机。基于证据的评价关注学生真实发生的进步，这可以激发学生的学习动机。当学生看到自己的努力和进步得到认可时，他们更有动力继续学习和成长。马斯洛需要层次理论认为，学生的需要分为缺失性需要和成长性需要。关注学生的进步避免单一依靠纸笔测验对学生进行评价，有利于满足学生尊重的需要，进一步激发学生的学习动机。35.。"}]}],"id":"柯虎2-34"},{"num":35,"title":"35 对于教师劳动的知识","subject":"教原","blocks":[{"t":"（1）从教师劳动特点的角度，评析材料中张老师的做法。","items":[{"t":"首先，张老师的做法可以说“事出有因”","d":"（1）教师劳动具有示范性、复杂性、创造性、合作性、长期性和长效性的特点。首先，张老师的做法可以说“事出有因”。教师劳动具有复杂性，教育过程本身就是一个复杂的活动过程。张老师一开始的委屈是由学生家长不理解教师劳动工作的复杂性导致的。家长总是把目光关注在自己孩子身上，然而班级授课制这一教学组织形式下，在短时间的课堂上，老师容易无意识忽略一些孩子，这是难以避免的。张老师被误解，学校也没有很好处理，没有照顾老师的情绪。但是，无论如何，张老师后续的处理方式是不合理的。教师劳动具有示范性、合作性和长期性。从示范性的角度来说，张老师后来有意无意忽略王小明同学，这不符合。"},{"t":"教师劳动具有复杂性，教育过程本身就是一个复杂的活动过程","d":"教育过程本身就是一个复杂的活动过程。张老师一开始的委屈是由学生家长不理解教师劳动工作的复杂性导致的。家长总是把目光关注在自己孩子身上，然而班级授课制这一教学组织形式下，在短时间的课堂上，老师容易无意识忽略一些孩子，这是难以避免的。张老师被误解，学校也没有很好处理，没有照顾老师的情绪。"},{"t":"但是，无论如何，张老师后续的处理方式是不合理的","d":"（1）教师劳动具有示范性、复杂性、创造性、合作性、长期性和长效性的特点。首先，张老师的做法可以说“事出有因”。教师劳动具有复杂性，教育过程本身就是一个复杂的活动过程。张老师一开始的委屈是由学生家长不理解教师劳动工作的复杂性导致的。家长总是把目光关注在自己孩子身上，然而班级授课制这一教学组织形式下，在短时间的课堂上，老师容易无意识忽略一些孩子，这是难以避免的。张老师被误解，学校也没有很好处理，没有照顾老师的情绪。但是，无论如何，张老师后续的处理方式是不合理的。教师劳动具有示范性、合作性和长期性。从示范性的角度来说，张老师后来有意无意忽略王小明同学，这不符合。"},{"t":"教师劳动具有示范性、合作性和长期性","d":"合作性和长期性。从示范性的角度来说，张老师后来有意无意忽略王小明同学，这不符合教师职业道德规范，也违背育人的目的。从长期性的角度来说，对王小明同学也会造成较持久的伤害，影响王小明同学的身心健康。从合作性的角度来说，张老师工作不被家长理解、校方支持时，张老师应主动沟通，而不是破罐子破摔。综上，张老师的做法是不合理的。（2）如果我是张老师，我会：和家长积极沟通交流：培养孩子，是一项复杂的工作，也要求家长、学校的支持。我会在收到家长的投诉后，先和校方、家长说清楚，自己并不是有意忽略王小明同学。而是课堂互动时间有限，也会和家长分析王小明同学平时的表现、成绩等，体谅到家长或许是因为觉得自己孩子成绩不好。"}]},{"t":"（2）如果你是张老师，面对这种情况，你会怎么做？","items":[{"t":"和家长积极沟通交流：培养孩子，是一项复杂的工作，也要求家长、学校的支持","d":"培养孩子，是一项复杂的工作，也要求家长、学校的支持。我会在收到家长的投诉后，先和校方、家长说清楚，自己并不是有意忽略王小明同学。而是课堂互动时间有限，也会和家长分析王小明同学平时的表现、成绩等，体谅到家长或许是因为觉得自己孩子成绩不好，会被老师忽略。我会耐心告诉家长，王小明同学不会因为成绩而被忽略，同时在家长面前，赞扬王小明的优点，客观分析其缺点，做到一分为二的看学生，能与家长形成家校合力。"},{"t":"通过改进教学组织形式的方式，促进教育过程中的公平","d":"的方式，促进教育过程中的公平；我会客观分析，班级授课制下，的确有时会无意识忽略一些孩子。我会配合分层教学、小组合作、个别辅导等形式，多和学生沟通交流。"},{"t":"努力提高自我修养，同时关注自身的心理健康，以合适的方式疏解工作中的压力","d":"时关注自身的心理健康，以合适的方式疏解工作中的压力。36.。"}]}],"id":"柯虎2-35"},{"num":36,"title":"36 行为主义教育理论·中频","subject":"教心","blocks":[{"t":"情境2中，教师的做法依据的是负惩罚","items":[{"t":"材料中老师宣布取消小明去春游的活动资格，属于负惩罚的运用","d":"明去春游的活动资格，属于负惩罚的运用。（3）情境3中，教师的做法依据的是负强化。负强化即终止厌恶刺激，从而增强其行为出现的概率。材料中，老师只要小华不在课上讲闲话，老师就取消他讨厌的做值日生的要求，属于负强化。"}]}],"id":"柯虎2-36"}],"id":"柯虎2"},{"name":"柯虎3","questions":[{"num":31,"title":"31 陶行知的教育实践及教育思想·高频","subject":"中教史","blocks":[{"t":"“生活教育”实践","items":[{"t":"晓庄学校：陶行知为改造乡村培育乡村教师，在南京创办试验乡村师范学校，后改名晓庄学校。","d":"31.【解析】本题考查《中国教育史》中近代教育家陶行知的教育实践及教育思想，属于高频考点，难度适中。陶行知的教育实践活动可以从：中华平民教育会、晓庄学校、科学下嫁、山海工学团、小先生制、艺友制、育才学校中进行举例回答；陶行知的教育思想则从：生活即教育、社会即学校、教学做合一进行论述即可。对于教育家精神的看法，要有教育家精神+自己的看法，教育家精神要表述完整。【参考答案】陶行知是中国现代杰出的人民教育家、思想家。他毕生奉献给教育，勇于批判和改革旧教育，为中国探索民族教育的新路。他的教育思想具有创造性并不断发展、不断进步而其“生活教育”思想则贯穿始终。"},{"t":"山海工学团：陶行知在上海郊区大场创办山海工学团","d":"小先生制、艺友制、育才学校中进行举例回答；陶行知的教育思想则从：生活即教育、社会即学校、教学做合一进行论述即可。对于教育家精神的看法，要有教育家精神+自己的看法，教育家精神要表述完整。"},{"t":"“小先生制”：为了解决普及教育中师资缺乏、经费匮乏、女子教育困难等问题","d":"为了解决普及教育中师资缺乏、经费匮乏、女子教育困难等问题，陶行知提出儿童是中国实现普及教育的重要力量，并提出“小先生制”。④。"},{"t":"育才学校：抗战期间","d":"抗战期间，为了抢救战区儿童和培养人才幼苗，收容战争中流离失所的难童陶行知在重庆创办育才学校。"}]},{"t":"“生活教育”理论体系“生活即教育”是生活教育理论的核心","items":[{"t":"生活含有教育的意义。陶行知认为，“教育的根本意义是生活之变化”。","d":"陶行知认为，“教育的根本意义是生活之变化”。②。"},{"t":"实际生活是教育的中心","d":"陶行知认为生活与教育是一回事，是同一个过程，教育不能脱离生活。教育要通过生活来进行。③。"},{"t":"生活决定教育，教育改造生活","d":"造生活。一方面，生活决定教育，表现为教育的目的、原则、内容和方法都由生活决定；另一方面，教育又能改造生活，推动生活进步。教育不仅改造着社会生活也改造着每个人的生活。"},{"t":"“社会即学校”“生活教育”理论的另一主张是“社会即学校”","d":"教育”理论的另一主张是“社会即学校”，它是“生活即教育”思想在学校与社会关系问题上的具体化。①。"},{"t":"“社会含有学校的意味”。因为到处是生活，所以到处是教育，整个社会就像一个教育的场所。","d":"因为到处是生活，所以到处是教育，整个社会就像一个教育的场所。②“学校含有社会的意味”。陶行知主张改造传统的学校，人们应该依据社会的需要，依社会的力量，去创建新型的学校，即把工场、农村与学校打成一片的学校，这样的学校能产生造社会的作用。“教学做合一”是方法论“教学做合一”的涵义是：教的方法根据学的方法；学的方法根据做的方法。事怎样做便怎样学，怎样学便怎样教。教与学都以做为中心。在做上教的是先生，在做上学的是学生。结合其整个思想看，“教学做合一”包含以下要点：①“教学做合一”要求“在劳力上劳心”。②“教学做合一”是因为“行是知之始”。③“教学做合一”要求“有教先学”和“有学有教”。④“教学做合。"}]},{"t":"基于陶行知的教育思想和实践，我对教育家精神的理解：","items":[{"t":"无私奉献精神","d":"捧着一颗心来，不带半根草去”，是陶先生的名言，他的一生忠实地履行了这一名言。我们要学习陶行知，首先就要学习他这种精神，学习他的为人。②。"},{"t":"艰韧不拔的奋斗精神","d":"陶先生是在当时的反动派统治之下办教育，帮助劳苦大众与苦难现实作斗争，引导人民向着解放与幸福的道路前进。具有战胜一切困难的勇气和百折不挠的毅力。正如马克思所讲：“在科学的道路上，是没有平坦的大道可走的”，要想在理论上和实践中都取得较好的成绩，仍必须学习和发扬陶先生的奋斗精神。③。"},{"t":"一切从实际出发的求真务实精神","d":"务实精神。陶先生的“生活教育理论”，是从实践中来，又到实践中去的十分重视社会实践的理论。他讲“千教万教，教人求真；千学万学，学做真人”，在教育方法上特别重视“教学做合一”，所体现的就是一切从实际出发的求真务实精神。④。"},{"t":"勇于开拓进取的创造精神","d":"神。陶先生是最具有开拓创新精神的教育家，是我国创造教育理论的奠基人。教育在培育民族创新精神和培养创造性人才方面，肩负着特殊的使命。每一个学校，都要爱护和培养学生的好奇心、求知欲，帮助学生自主学习、独立思考，保护学生的探索精神、创新思维，营造崇尚真知、追求真理的氛围，为学生的禀赋和潜能的充分开发创造一种宽松的环境。教育家精神：①。"},{"t":"心有大我、至诚报国的理想信念；","d":"理想信念；②言为士则、行为世范的道德情操；③启智润心、因材施教的育人智慧；④勤学笃行、求是创新的躬耕态度；⑤乐教爱生、甘于奉献的仁爱之心；⑥胸怀天下、以文化人的弘道追求。32.。"}]}],"id":"柯虎3-31"},{"num":32,"title":"32 进步教育运动发展历程·低频","subject":"外教史","blocks":[{"t":"成型（1918-1929年）","items":[{"t":"自然发展的自由","d":"②兴趣是所有作业的动机；③教师是引导者而不是监督者；④科学研究儿童；⑤重视影响儿童身体发展的一切因素；⑥为满足儿童生活的需要，学校与家庭应进行合作；⑦进步主义学校应当成为教育运动的领导者。2.创办杂志。1924年，协会创办《进步教育》杂志，向读者介绍欧洲的新教育和美国的进步教育实验。"},{"t":"3.形成研究阵地","d":"这一时期，进步教育日益专业化，哥伦比亚大学师范学院成为进步教育运动的中心，杜威担任协会的名誉主席。"}]},{"t":"转折（1929-1943年）","items":[{"t":"由于进步教育运动的专业化倾向，失去了公众的理解和支持","d":"业化倾向，失去了公众的理解和支持。同时，1929年开始的大萧条引起的青年就业困难，使人们怀疑进步教育运动下的学校教育质量，这严重影响了美国进步教育运动的发展。①。"},{"t":"发生转向","d":"一是从强调儿童中心和个人的自由转向强调学校的社会职能，二是教育中心从初等教育转向中等教育。②。"},{"t":"分裂阵营。进步教育运动内部出现分化。"},{"t":"受到攻击","d":"新保守主义针对进步教育中废除传统教育的课程计划、班级授课制等合理性的措施进行了批判，也针对他们过度地放纵儿童进行了猛烈的攻击。"}]},{"t":"衰落（1944-1957年）","items":[{"t":"难以同步","d":"进步教育运动不能与美国的社会变化始终一致，未能较好地适应美国社会发展对教育提出的新要求。②。"},{"t":"自身局限","d":"进步教育理论和实践本身存在许多矛盾和局限，如过分强调儿童个人的自由，忽视社会和文化对个人发展的决定作用，过分否定学校工作的一些基本规律，导致教学质量的下降③。"},{"t":"受到抨击","d":"改造主义和保守主义等教育流派的抨击与批判，击中了进步教育的要害加速了进步教育的衰落。④。"},{"t":"内部决裂","d":"进步教育运动在理论上的分化，导致运动内部的决裂。同时，进步教育运动对教师提出过高的要求，使教师难以完成和达到进步教育家所期望的教育效果。对我国教育改革的启示：①。"},{"t":"对儿童教育的反思：从传统教育忽视儿童转向发扬儿童中心论","d":"从传统教育忽视儿童转向发扬儿童中心论，进步主义提出了“整体儿童”的概念，关注儿童的一切能力或力量。②对教师作用的反思：从传统教育主张教师监督转向提倡教师发挥鼓励、引导和调度的作用，认为教师不是唯一的权威。③对学校观念的反思：从传统教育把学校看成被动传授知识的场所转向主张学校是主动解决问题的教育场所。④对课程教学的反思：从传统灌输式课堂转向互动、热情和人道的课堂氛围，让儿童获得更多的活动空间，课堂实现个别化教学，鼓励学生探索、操作和应用。"}]}],"id":"柯虎3-32"},{"num":33,"title":"33 科技与教育之间的关系","subject":"教原","blocks":[{"t":"（1）阐述科技与教育之间的关系。","items":[{"t":"科学技术对教育具有重要的影响，表现在：","d":"要的影响，同时教育对科学技术具有重要的反作用，具体表现在：科学技术对教育具有重要的影响，表现在：①。"},{"t":"科学技术影响教育观念：教育的各种观念都会受到科学技术的影响。","d":"教育的各种观念都会受到科学技术的影响。②。"},{"t":"科学技术影响教育结构：教育结构随着科技的发展发生了变化，受科学技术的影响。","d":"教育结构随着科技的发展发生了变化，受科学技术的影响。③。"},{"t":"科学技术影响教育的目的、内容和技术","d":"的、内容和技术：科学技术的快速发展使得人工智能技术在教育领域得到广泛应用，在一定程度上也影响着教育的目的、内容和技术。教育对科学技术具有反作用，表现在：①。"},{"t":"教育为科学技术的发展提供知识积累：科学技术的发展需要相应的专业知识、能力作理论基础","d":"提供知识积累：科学技术的发展需要相应的专业知识、能力作理论基础，因此科技的发展离不开教育，教育为其提供了必要的知识积累。②教育为科学技术的发展培养所需人才：科学技术的发展离不开人才，而人才需要通过教育培养其创新能力、实践能力等。教育为其提供必要的人才支持。③教育为科学技术转化为生产力创造条件：科学技术在转化生产力时需要教育的参与，因此教育在一定程度上为其转化为相应生产力创造了必要条件。（2）人工智能为教育带来的挑战①过度关注个性化学习和考试成绩，偏离教育本质人工智能在教育场景中，常把“个性化学习”理解成根据学生答题数据推送知识点，把提升考试分数当作主要目标。这种做法会让教育变得片面：只看重学生。"}]},{"t":"（2）阅读上述材料，分析人工智能可能为教育带来哪些挑战。","items":[{"t":"过度关注个性化学习和考试成绩","d":"考试成绩，偏离教育本质人工智能在教育场景中，常把“个性化学习”理解成根据学生答题数据推送知识点，把提升考试分数当作主要目标。这种做法会让教育变得片面：只看重学生对知识点的掌握程度，却忽略了学生在尝试、犯错、思考中培养的独立思考能力、创新想法，在小组学习里锻炼的沟通和合作能力，这些对学生成长很关键的部分，都容易被人工智能所忽视。学生会慢慢只在意分数高低，对学习本身的兴趣和热情会减少，变成被动应付考试的人，不再是能全面发展的个体。②。"},{"t":"影响教学质量人工智能会影响教学质量","d":"会影响教学质量。从教学内容和方式来看，人工智能的算法更倾向于按照固定的流程传递知识，没办法像老师那样，根据班里学生的理解能力、生活经历灵活调整上课节奏，也很难补充贴近学生例子，导致教学内容变得死板，没办法真正做到根据每个学生的情况调整教学，最终让整体教学质量下降。③。"},{"t":"导致不确定性和过度依赖技术一方面，人工智能在教育中的应用存在很多不确定的地方","d":"赖技术一方面，人工智能在教育中的应用存在很多不确定的地方。人工智能的运行依靠大量数据，但在教育里，学生的学习动力、情绪状态、家庭环境等复杂因素，没办法全部用数据衡量。这就导致人工智能判断学生的学习需求时可能出错，推荐的学习计划、给出的评价结果，也可能和学生的实际情况不一样。另一方面，如果过度依赖人工智能技术，老师把备课、上课、批改作业这些重要的教学工作都交给人工智能，慢慢就会失去设计优质教学内容、掌控课堂、敏锐发现学生需求的能力，从原本主导教学的人，变成只是操作人工智能的人。同时，学生也可能习惯从人工智能那里直接获取答案，不再主动思考、自己解决问题，形成对技术的依赖，最终不管是老师的教学能力。"}]},{"t":"（3）结合所学知识","items":[{"t":"利用人工智能变革学习方式人工智能为实现个性化学习和培养创新思维注入了新的活力","d":"方式人工智能为实现个性化学习和培养创新思维注入了新的活力，教育工作者可以根据学生特点、学习需求、身心发展规律，生成一个个性化、定制化的学习方案为学生提供良好的沉浸式学习体验。②。"},{"t":"利用人工智能变革教学方式教育可利用人工智能改变传统讲授法等教学方式","d":"方式教育可利用人工智能改变传统讲授法等教学方式，为教学注入新鲜形式，激发学生的学习兴趣，调动其学习动机，改善教学设计。③。"},{"t":"利用人工智能变革教学内容教育工作者要明确人工智能进入课堂是为了拓宽教育的内容边界","d":"内容教育工作者要明确人工智能进入课堂是为了拓宽教育的内容边界，可进行跨学科整合，使教学内容由难、繁、旧、偏向注重学生兴趣和能力转变。④。"},{"t":"利用人工智能变革评价方式教育工作者可借助人工智能技术评价的多元化、过程化手段","d":"方式教育工作者可借助人工智能技术评价的多元化、过程化手段，以评价结果的准确性正确评价学生发展、成绩方面等，优化教学评价。⑤。"},{"t":"利用人工智能变革师生关系教育工作者应利用人工智能做到因材施教","d":"关系教育工作者应利用人工智能做到因材施教，与学生建立民主平等，和谐相处，教学相长的师生关系。教育工作者要警惕过度依赖技术造成的负面影响，让技术服务教育，而不是被技术主导。34.。"}]}],"id":"柯虎3-33"},{"num":34,"title":"34 对于迁移理论的理解","subject":"教原","blocks":[{"t":"（1）结合所学知识，请简述至少三种迁移理论。","items":[{"t":"相同元素说：桑代克、伍德沃斯认为只有在原先的学习情境与新的学习情境有相同要素时","d":"桑代克、伍德沃斯认为只有在原先的学习情境与新的学习情境有相同要素时，原先的学习才有可能迁移到新的学习中去。并且，迁移的程度取决于这两种情境相同要素的多少。③。"},{"t":"概括化理论：贾德认为迁移产生的关键在于学习者能够概括出两组活动之间的共同原理。","d":"贾德认为迁移产生的关键在于学习者能够概括出两组活动之间的共同原理。"},{"t":"学习者的概括水平越高，迁移的可能性就越大","d":"③概括化理论：贾德认为迁移产生的关键在于学习者能够概括出两组活动之间的共同原理。学习者的概括水平越高，迁移的可能性就越大。"},{"t":"关系理论：格式塔心理学家重视学习者对学习情境内部关系的顿悟在迁移中的作用","d":"格式塔心理学家重视学习者对学习情境内部关系的顿悟在迁移中的作用，他们认为，迁移的关键不在于有多少共同因素，而是学习者是否发现了两个学习经验之间存在的共同关系。⑤。"},{"t":"认知结构迁移理论：奥苏伯尔认为","d":"奥苏伯尔认为，在有意义学习中，学生积极主动地将新知识与认知结构中有关的旧知识发生相互作用，旧知识得到充实和改造，新知识获得了实际意义。这个过程就是陈述性知识迁移的过程，而其中的关键因素是认知结构本身的可利用性、可辨别性与清晰稳定性。（2）影响迁移的因素主观因素：①个体加工学习材料过程的相似性。个体加工信息的方法、习惯和风格各有不同，个体善于将自己习惯的加工信息的过程迁移到其他问题和情境中去。②已有经验的概括水平。学习迁移实际上是已有经验的具体化或新旧经验的协调过程。因此已有经验的概括水平对迁移的效果有很大影响。③学习态度和定势。在学习态度上，个体是否具有主动迁移的意识、能否进行自我调控是学习。"}]},{"t":"（2）结合所学知识","items":[{"t":"个体加工学习材料过程的相似性","d":"的相似性。个体加工信息的方法、习惯和风格各有不同，个体善于将自己习惯的加工信息的过程迁移到其他问题和情境中去。②。"},{"t":"已有经验的概括水平","d":"学习迁移实际上是已有经验的具体化或新旧经验的协调过程。因此已有经验的概括水平对迁移的效果有很大影响。③。"},{"t":"学习态度和定势","d":"在学习态度上，个体是否具有主动迁移的意识、能否进行自我调控是学习迁移的关键。一般来说，定势对学习能够起促进作用，但是有时也会起阻碍作用。④。"},{"t":"年龄、智力水平。学习者的年龄、智力水平等方面都在不同程度上影响迁移的产生。","d":"者的年龄、智力水平等方面都在不同程度上影响迁移的产生。客观因素：①。"},{"t":"学习材料、情境的相似性。越是相似的材料、问题和情境，迁移越容易发生。","d":"性。越是相似的材料、问题和情境，迁移越容易发生。②教学指导、外界提示语的影响。越是清晰的教学指导或外界提示语，越容易促进迁移；越是模糊的、无效的教学指导或提示语，越阻碍迁移。（3）①整合学科内容。教师应注意把各个独立的教学内容整合起来，注意各门学科之间的横向联系鼓励学生把在某一门学科中学到的知识运用于其他学科中，促进横向迁移。②加强知识联系。教师应重视新旧知识技能之间的联系，要促使学生把已学过的内容迁移到新知识上去，可以通过提问、提示等方式，使学生利用已有知识来理解新知识，促进纵向迁移。③重视学习策略。教师要有意识地教学生学会如何学习，帮助他们掌握概括化的认知策略和元认知策略。认知策略和元认知。"}]},{"t":"（3）请说明，教师应如何促进学生的学习迁移？","items":[{"t":"加强知识联系","d":"教师应重视新旧知识技能之间的联系，要促使学生把已学过的内容迁移到新知识上去，可以通过提问、提示等方式，使学生利用已有知识来理解新知识，促进纵向迁移。③。"},{"t":"重视学习策略","d":"教师要有意识地教学生学会如何学习，帮助他们掌握概括化的认知策略和元认知策略。认知策略和元认知策略是可教的，教授学习策略就会促进学习迁移。④。"},{"t":"强调概括总结","d":"教师要有意识地启发学生对所学内容进行概括总结。教师可以引导学生提高概括总结的能力，充分利用原理、原则的迁移。在讲解原理、原则时要尽可能用丰富的举例说明，帮助学生将理论应用于实践之中。⑤。"},{"t":"培养迁移意识","d":"教师通过反馈和归因控制等方式使学生形成关于学习的积极态度，鼓励学生大胆地进行迁移，将知识灵活应用。35.。"}]}],"id":"柯虎3-34"},{"num":35,"title":"35 教师对于德育的理解","subject":"教原","blocks":[{"t":"不正确。教师的教育观念只停留在知识的讲授上","items":[{"t":"全方位德育指德育应当普遍存在于学校的一切教育活动之中","d":"普遍存在于学校的一切教育活动之中。每一个教师都应该是德育教师。教师以自己的教学活动与日常生活全方位地影响着学生的道德成长。教师的德育活动并不仅仅存在于课堂之中，更存在于日常生活之中，即直接德育和间接德育相结合，全方位地促进学生品德的发展。（2）针对张老师：改进德育授课方式。①用生活案例讲概念：讲“责任”时，别只说定义，先提“值日生打扫卫生”“帮同学讲题”“家里分担家务”这些学生熟悉的事，再问“没这些责任会怎样”，让学生从具体场景懂道理。②换种方式提问：将“你怎么理解责任”，改成“班级搞公益活动，你想做什么任务？为什么？”“看到同学忘做集体任务，你会怎么做？”，让学生结合自己的行动回答。③加实践。"}]},{"t":"针对张老师：改进德育授课方式。","items":[{"t":"用生活案例讲概念：讲“责任”时","d":"讲“责任”时，别只说定义，先提“值日生打扫卫生”“帮同学讲题”“家里分担家务”这些学生熟悉的事，再问“没这些责任会怎样”，让学生从具体场景懂道理。②。"},{"t":"换种方式提问：将“你怎么理解责任”","d":"将“你怎么理解责任”，改成“班级搞公益活动，你想做什么任务？为什么？”“看到同学忘做集体任务，你会怎么做？”，让学生结合自己的行动回答。③。"},{"t":"加实践环节：让学生分组写“班级责任公约”","d":"让学生分组写“班级责任公约”，或模拟“班级管理者”处理小事，让学生在做事中体会责任，不是光听道理。（3）针对王老师：挖掘数学学科的育人性。①找数学里的思政点：讲统计时，让学生统计校园垃圾分类数据，聊“数据准了对环保有啥用”；讲几何时，看故宫的对称美，聊传统文化，把价值观融入知识点。②写教案时明确小目标：比如教解方程，就写“鼓励学生解题不放弃”“让学生学会听同学的解题思路”，上课多夸坚持解题、帮同学的学生，把引导落到实处。还可以让王老师带学生算资源使用数据，让思政和数学结合起来。36.。"}]},{"t":"针对王老师：挖掘数学学科的育人性。","items":[{"t":"找数学里的思政点：讲统计时，让学生统计校园垃圾分类数据，聊“数据准了对环保有啥用”","d":"讲统计时，让学生统计校园垃圾分类数据，聊“数据准了对环保有啥用”；讲几何时，看故宫的对称美，聊传统文化，把价值观融入知识点。②。"},{"t":"写教案时明确小目标：比如教解方程","d":"比如教解方程，就写“鼓励学生解题不放弃”“让学生学会听同学的解题思路”，上课多夸坚持解题、帮同学的学生，把引导落到实处。还可以让王老师带学生算资源使用数据，让思政和数学结合起来。36.。"}]}],"id":"柯虎3-35"},{"num":36,"title":"36 《教育心理学》","subject":"教心","blocks":[{"t":"加德纳多元智能理论指出","items":[{"t":"加德纳多元智能理论指出","d":"出，人的智能包括语言、逻辑-数学、运动、人际等多种类型，无高低之分。王老师发现有特长（运动智能）的王大明、善交际（人际智能）的顾小丹未被推荐，且察觉两人沮丧情绪，说明她跳出“成绩=唯一优秀标准”的局限，关注到学生不同维度的优势，契合该理论对“多元发展”的倡导，能避免学生因单一评价陷入自我否定。"}]}],"id":"柯虎3-36"}],"id":"柯虎3"},{"name":"柯虎4","questions":[{"num":31,"title":"31 《中国教育史》近代教育家蔡元培的…·高频","subject":"中教史","blocks":[{"t":"提出“五育并举”的教育方针","items":[{"t":"在实利主义教育上，蔡元培主张“以人民生计为普通教育之中坚”，加强职业技能的培训；","d":"元培主张“以人民生计为普通教育之中坚”，加强职业技能的培训。"},{"t":"在公民道德教育上","d":"蔡元培主张从儒家传统文化入手进行公民道德教育，其内涵和资产阶级追求的自由、平等、博爱的精神是相通的；在世界观教育上，将世界分为“现象世界”和“实体世界”，主张人们立足于现象世界而追求实体世界。"},{"t":"在美感教育上，蔡元培认为美育是世界观教育的主要途径，主张以美育代替宗教","d":"认为美育是世界观教育的主要途径，主张以美育代替宗教。（2）提出教育独立思想。1922年3月，蔡元培发表《教育独立议》一文，阐明其教育独立的基本观点。①教育独立思想的内容包括：教育经费独立：政府指定固定的款项，专作教育经费，不能移作他用；教育行政独立：设立专管教育的行政机构，不附设于政府部门；教育学术和内容独立；教育方针应保持稳定、能自由编辑、出版、选用教科书；教育脱离宗教独立。②教育独立思想的实践设想：蔡元培主张将全国分为若干个大学区，每区设立一所大学，管理所有教育事务，但大学区制度没有完全建立。③对教育独立思想的评价：教育活动必须接受社会的物质支持并传播一定的政治和社会价值体系，它因此依附于。"}]},{"t":"提出教育独立思想","items":[{"t":"教育独立思想的内容包括：教育经费独立：政府指定固定的款项，专作教育经费，不能移作他用","d":"括：教育经费独立：政府指定固定的款项，专作教育经费，不能移作他用；教育行政独立：设立专管教育的行政机构，不附设于政府部门；教育学术和内容独立；教育方针应保持稳定、能自由编辑、出版、选用教科书；教育脱离宗教独立。②。"},{"t":"教育独立思想的实践设想：蔡元培主张将全国分为若干个大学区","d":"想：蔡元培主张将全国分为若干个大学区，每区设立一所大学，管理所有教育事务，但大学区制度没有完全建立。③。"},{"t":"对教育独立思想的评价：教育活动必须接受社会的物质支持并传播一定的政治和社会价值体系","d":"教育活动必须接受社会的物质支持并传播一定的政治和社会价值体系，它因此依附于一定的政治和社会力量，不可能也不应该完全独立。但是不完全独立不等于不能相对独立，教育主体的能动性决定了它在教育活动中有自主选择的能力和自由。（3）蔡元培的教育实践。蔡元培的教育实践集中体现在对北京大学的改革上。①抱定宗旨，改变校风。蔡元培认为，大学应是“研究高尚学问之地”，改革北京大学的第一步是明确大学的宗旨，并为师生创造研究高深学问的条件和氛围。"}]},{"t":"蔡元培的教育实践。蔡元培的教育实践集中体现在对北京大学的改革上。","items":[{"t":"抱定宗旨，改变校风。","d":"蔡元培认为，大学应是“研究高尚学问之地”，改革北京大学的第一步是明确大学的宗旨，并为师生创造研究高深学问的条件和氛围。"},{"t":"第一，改变学生观念，让学生抱定为求学而来的宗旨；","d":"①抱定宗旨，改变校风。蔡元培认为，大学应是“研究高尚学问之地”，改革北京大学的第一步是明确大学的宗旨，并为师生创造研究高深学问的条件和氛围。第一，改变学生观念，让学生抱定为求学而来的宗旨；第二，整顿教师队伍，延聘积学热心的教员；第三，发展研究所，广积图书，引导师生研究兴趣；第四，砥砺德行，培养正当兴趣。"},{"t":"第二，整顿教师队伍，延聘积学热心的教员；","d":"①抱定宗旨，改变校风。蔡元培认为，大学应是“研究高尚学问之地”，改革北京大学的第一步是明确大学的宗旨，并为师生创造研究高深学问的条件和氛围。第一，改变学生观念，让学生抱定为求学而来的宗旨；第二，整顿教师队伍，延聘积学热心的教员；第三，发展研究所，广积图书，引导师生研究兴趣；第四，砥砺德行，培养正当兴趣。"},{"t":"第三，发展研究所，广积图书，引导师生研究兴趣；","d":"积图书，引导师生研究兴趣；第四，砥砺德行，培养正当兴趣。②。"},{"t":"贯彻“思想自由，兼容并包”的办学原则。","d":"并包”的办学原则。蔡元培认为，“大学者，‘囊括大典，网罗众家’之学府也”。在学术上“循‘思想自由’原则，取兼容并包主义”。在教师的聘任上，罗致各类学术人才，使北京大学的教师队伍呈现出流派纷呈的局面。③教授治校，民主管理。蔡元培设立评议会、教授会，确定学校内部组织章程，决定设立行政会议、教务会议及教务处、总务处。新的管理体制的建立，改变了京师大学堂遗留下来的封建衙门作风，提高了工作效率。④学科与教学体制改革。"}]}],"id":"柯虎4-31"},{"num":32,"title":"32 《外国教育史》卢梭的自然主义教育·高频","subject":"外教史","blocks":[{"t":"自然主义教育思想的实施","items":[{"t":"卢梭的自然主义教育思想是教育界一场哥白尼式的革命","d":"想集中表现在他的著作《爱弥儿》中。（1）自然主义教育思想的基本含义。①主张回归自然，15岁之前的教育必须在远离城市的农村中进行。②每个人都是由自然的教育、事物的教育、人为的教育三者培养起来的。三种教育结合才能培育好人。因为自然的教育不受人的控制，所以事物的教育和人为的教育需要符合自然的教育。其中，自然的教育主要指个人才能和器官的发展。（2）自然主义教育的目标。卢梭自然主义教育的目标是培养自然人。自然人的特征是独立自主、平等、自由、自食其力。（3）自然教育的方法原则。①正确认识儿童，把孩子看作孩子。孩子不是等待管教的奴仆，也不是成人的玩物。②实行消极教育，遵循自然天性的教育。③主张因材施教。（4。"}]}],"id":"柯虎4-32"},{"num":33,"title":"33 劳动教育的理解与重要意义","subject":"教原","blocks":[{"t":"（1）简述劳动教育的含义及开展劳动教育的必要性。","items":[{"t":"开展劳动教育的必要性：大中小学实施劳动教育","d":"大中小学实施劳动教育，实现教育与生产劳动相结合，是培养全面发展的人的重要途径，具有多方面的深远意义：①。"},{"t":"实施劳动教育能更好地促进学生的全面发展。","d":"促进学生的全面发展。教育与生产劳动相结合，是造就全面发展的人的基本途径。通过劳动技术实践过程，将所学知识与实际生产劳动联系起来，有助于促进学生智力的发展，有助于学生体质的增强。此外，劳动实践过程以及劳动成果所包含的美的因素，也有助于学生审美意识的培养。"},{"t":"教育与生产劳动相结合，是造就全面发展的人的基本途径","d":"是造就全面发展的人的基本途径。通过劳动技术实践过程，将所学知识与实际生产劳动联系起来，有助于促进学生智力的发展，有助于学生体质的增强。"},{"t":"此外，劳动实践过程以及劳动成果所包含的美的因素，也有助于学生审美意识的培养","d":"及劳动成果所包含的美的因素，也有助于学生审美意识的培养。②。"},{"t":"实施劳动教育能更好地促进社会发展。","d":"促进社会发展。促进社会和谐：通过劳动教育，学生能够更好地融入社会，理解社会分工的重要性，促进社会和谐发展。促进经济发展：有技能的劳动力是社会发展的基石，劳动教育可以为社会培养更多具备实际技能的人才，促进经济的可持续发展。因此，劳动教育不仅有助于学生个人的全面发展，还对社会的和谐稳定和经济发展起着重要的推动作用。通过劳动教育，学生能够在实践中成长，能培养出更多具备实际技能和正确价值观的新一代公民，为社会的可持续发展贡献力量。（2）全面加强新时代大中小学劳动教育需要社会、学校、家庭多方面的努力。"}]},{"t":"（2）从家庭、学校和社会三方面","items":[{"t":"第一，对于学校来说：","d":"（2）全面加强新时代大中小学劳动教育需要社会、学校、家庭多方面的努力。第一，对于学校来说：劳动课程是学校实施劳动教育的重要途径，在劳动教育中发挥主导作用，要有目的、有计划地组织学生参加日常生活劳动、生产劳动和服务性劳动，培养学生正确的劳动价值观和良好的劳动品质。第二，对于家长来说：。"},{"t":"劳动课程是学校实施劳动教育的重要途径","d":"动教育的重要途径，在劳动教育中发挥主导作用，要有目的、有计划地组织学生参加日常生活劳动、生产劳动和服务性劳动，培养学生正确的劳动价值观和良好的劳动品质。"},{"t":"第二，对于家长来说：","d":"（2）全面加强新时代大中小学劳动教育需要社会、学校、家庭多方面的努力。第一，对于学校来说：劳动课程是学校实施劳动教育的重要途径，在劳动教育中发挥主导作用，要有目的、有计划地组织学生参加日常生活劳动、生产劳动和服务性劳动，培养学生正确的劳动价值观和良好的劳动品质。第二，对于家长来说：。"},{"t":"引导家长树立劳动教育观念。","d":"观念。学校要通过家长会、家长学校、家长开放日、给家长的一封信等方式，向家长宣传劳动对学生身心发展的价值，促进家长对劳动教育形成正确认知。②。"},{"t":"指导家长把劳动教育有机融入家庭日常生活。","d":"机融入家庭日常生活。学校要根据本地、本校实际，设计不同学段学生家庭劳动清单，根据家庭日常生活实际，鼓励家长利用整理房间、打扫卫生、器具维护、美化家庭、养护绿植、烹饪帮厨等机会，把劳动教育融入日常生活中，让学生坚持不懈地完成，从而养成居家生活劳动的好习惯。③指导家长做好榜样示范。学校可以通过开展丰富多彩的亲子劳动活动，布置亲子劳动任务创造家庭成员共同劳动的机会，让学生有机会向家长学习，达到“亲子共成长”的目的。"}]},{"t":"（3）如果你是某小学的劳动教师，你会如何设计一堂劳动课？","items":[{"t":"劳动课程主题：收纳整理","d":"（3）设计一堂劳动课。劳动课程主题：收纳整理。课程目标：通过对学习用品、生活用品、厨房用具、家中杂物等物品的收纳整理，培养学生的思考能力、逻辑能力、统筹能力等综合能力；使学生体验整齐有序、条理做事的过程，从而形成良好的思维基础、培养其自控和掌管人生的能力。课程内容：对教室内学习用品和教学用品进行收纳整理。课程评价：总分100分，主要包括三个方面组成：①学生参与活动的出勤记录，占成绩的20%；②劳动课程过程中的记录，占成绩的20%；③学生活动中或活动后完成任务的情况和活动的成果，占成绩的60%。"},{"t":"课程目标：通过对学习用品、生活用品、厨房用具、家中杂物等物品的收纳整理","d":"通过对学习用品、生活用品、厨房用具、家中杂物等物品的收纳整理，培养学生的思考能力、逻辑能力、统筹能力等综合能力；使学生体验整齐有序、条理做事的过程，从而形成良好的思维基础、培养其自控和掌管人生的能力。"},{"t":"课程内容：对教室内学习用品和教学用品进行收纳整理","d":"对教室内学习用品和教学用品进行收纳整理。"},{"t":"课程评价：总分100分","d":"总分100分，主要包括三个方面组成：①学生参与活动的出勤记录，占成绩的20%；②劳动课程过程中的记录，占成绩的20%；③学生活动中或活动后完成任务的情况和活动的成果，占成绩的60%。34.。"}]}],"id":"柯虎4-33"},{"num":34,"title":"34 《教育心理学》记忆规律与记忆力·中频","subject":"教心","blocks":[{"t":"（1）结合材料和所学知识，阐述记忆的规律。","items":[{"t":"记忆的时间和容量是有限的","d":"限的。根据加涅的理论，记忆是由短时记忆经过编码进入长时记忆的。短时记忆只能容纳5~9个组块。（2）①利用记忆规律。排除其他因素的干扰，避免前摄抑制和倒摄抑制。②整体学习和部分学习相结合。在学习过程中可以先进行分块部分学习，然后再进行整体学习。还可以进行过度学习，过度学习150%的效果最好。③掌握精加工策略。比如运用位置记忆、首字连词和关键词等记忆术策略，还可以在学习过程中采用做笔记、联系实际生活、充分利用背景知识等策略。④注意复习。学习之后及时复习可延长记忆时间，防止遗忘。还可以进行集中复习和分散复习，或者可以采用自问自答和尝试背诵的方式来保持记忆。35.。"}]},{"t":"（2）结合认知策略，谈谈如何培养学生的记忆力？","items":[{"t":"整体学习和部分学习相结合","d":"结合。在学习过程中可以先进行分块部分学习，然后再进行整体学习。还可以进行过度学习，过度学习150%的效果最好。③。"},{"t":"掌握精加工策略","d":"比如运用位置记忆、首字连词和关键词等记忆术策略，还可以在学习过程中采用做笔记、联系实际生活、充分利用背景知识等策略。④。"},{"t":"注意复习","d":"学习之后及时复习可延长记忆时间，防止遗忘。还可以进行集中复习和分散复习，或者可以采用自问自答和尝试背诵的方式来保持记忆。35.。"}]}],"id":"柯虎4-34"},{"num":35,"title":"35 《教育心理学》维果茨基的最近发展…·高频","subject":"教心","blocks":[{"t":"王老师所面临的困境是班上学生学业水平差异大","items":[{"t":"（1）个性化教学：采用个性化教学方法","d":"采用个性化教学方法，根据学生的学习水平和需求，为不同水平的学生提供定制化的教学内容和支持。"},{"t":"（2）分层教学：将学生分成不同层次的小组","d":"将学生分成不同层次的小组，每个小组根据学生的学习水平设置相应的教学内容和任务，以确保每个学生都能在适合自己水平的环境中学习。"},{"t":"（3）小组合作学习：鼓励学生之间进行小组合作学习","d":"鼓励学生之间进行小组合作学习，让学生相互学习和支持，帮助学生在不同水平的情况下共同成长。"},{"t":"（4）利用混合教学资源：提供多样化的教学资源","d":"源：提供多样化的教学资源，包括视频、练习题、小组讨论等，以满足不同学生的学习风格和需求。36.。"}]}],"id":"柯虎4-35"},{"num":36,"title":"36 《教育心理学》学习动机理论·高频","subject":"教心","blocks":[{"t":"（1）请用学习动机理论分析上述案例。","items":[{"t":"韦纳的归因理论提出了“三维度六因素”，认为人们常将成败归因于能力、努力、任务难度和运气","d":"三维度六因素”，认为人们常将成败归因于能力、努力、任务难度和运气。小米总是以“太笨了，不会写”为借口不写作业，不做练习，体现出她将自己的失败归因于内部的、稳定的、不可控的能力，这会使她形成习得性无助，从而导致学习动机低下。③。"},{"t":"自我价值理论关注人们如何评价自身价值，自我价值是认为自己是优秀、有能力个体的一种信念","d":"如何评价自身价值，自我价值是认为自己是优秀、有能力个体的一种信念。小米属于“低趋低避型”，亦即“失败接受者”，她认为自己“写上去也是错的”，所以她不期待成功，并且对失败也不感到恐惧或羞愧。（2）①要传授具体的学习策略。小米本来数学成绩就不太好，王老师需要教她具体的学习策略，并考虑小米自身的掌握水平，指导她制定相应的学习目标。②要帮助小米建立积极的自我概念。王老师要慎重地评价小米，尤其不能训斥，要引导她建立积极的自我概念，如此才能进一步激发她的学习动机。③要合理设置任务。为了提升小米的自我价值的需要，同时促进她努力学习，王老师要合理设置任务，采取相应的措施帮助小米学习，比如为其设定中等难度，即成。"}]},{"t":"（2）面对这种情况，请你给王老师提几条建议。","items":[{"t":"要帮助小米建立积极的自我概念","d":"自我概念。王老师要慎重地评价小米，尤其不能训斥，要引导她建立积极的自我概念，如此才能进一步激发她的学习动机。③。"},{"t":"要合理设置任务","d":"为了提升小米的自我价值的需要，同时促进她努力学习，王老师要合理设置任务，采取相应的措施帮助小米学习，比如为其设定中等难度，即成功概率为50%的任务。④。"},{"t":"要关心、爱护小米","d":"王老师大声呵斥会让小米感受到自己不被尊重，缺乏关爱，所以王老师既要在学习上关心和帮助小米，也要在生活与情感方面积极地关心她、爱护她，让她感受到教师的尊重和爱护。"}]}],"id":"柯虎4-36"}],"id":"柯虎4"},{"name":"柯虎5","questions":[{"num":31,"title":"31 《中国教育史》近代职业教育家黄炎…·中频","subject":"中教史","blocks":[{"t":"职业教育的方针","items":[{"t":"社会化。第一","d":"办学宗旨的社会化：以教育为方法，以职业为目的。"},{"t":"科学化。物质方面","d":"包括农业、工业、商业、家事等专业课程的设置、教材的选编、教学训练原则的确定、实习设施的配置等，事前要经过调查和实验，事后要勤于总结，逐步推广。"},{"t":"人事方面：包括教育管理的组织、机构自身的建设等，都要运用科学管理方法","d":"包括教育管理的组织、机构自身的建设等，都要运用科学管理方法。"}]},{"t":"职业教育作用","items":[{"t":"黄炎培将职业教育的理论价值概括为：第一，谋个性之发展；第二，为个人谋生之准备；","d":"论价值概括为：第一，谋个性之发展；第二，为个人谋生之准备。"},{"t":"第三，为个人服务社会之准备；第四，为国家及世界增进生产力之准备","d":"之准备；第四，为国家及世界增进生产力之准备。②。"},{"t":"对教育和社会的影响：“国无不教之民，民无不乐之生。”","d":"国无不教之民，民无不乐之生。”③。"},{"t":"对当时中国社会的作用：职业教育有助于解决中国最大、最急需解决的生计问题","d":"职业教育有助于解决中国最大、最急需解决的生计问题，消灭贫困，进而使国家每一个公民享受到最基本的自由权利。"}]},{"t":"职业教育的地位","items":[{"t":"一贯的。②整个的。③正统的。","d":"正统的。（四）职业教育的目的。他将职业教育的目的概括为“使无业者有业，使有业者乐业”。①“使无业者有业”，是指通过职业教育为国家工商业发展造就适用人才，同时解决社会失业问题，使人才不至浪费，使生计得以保障。②“使有业者乐业”，是指通过职业教育形成人的道德智能，使之能胜任所职、热爱所职，进而能有所创造发明，造福于社会和人类。"}]},{"t":"职业教育的目的。","items":[{"t":"他将职业教育的目的概括为“使无业者有业，使有业者乐业”","d":"括为“使无业者有业，使有业者乐业”。①。"},{"t":"“使无业者有业”","d":"是指通过职业教育为国家工商业发展造就适用人才，同时解决社会失业问题，使人才不至浪费，使生计得以保障。②。"},{"t":"“使有业者乐业”","d":"是指通过职业教育形成人的道德智能，使之能胜任所职、热爱所职，进而能有所创造发明，造福于社会和人类。"}]},{"t":"职业教育的教学原则。","items":[{"t":"职业教育必须遵循“手脑并用”“做学合一”的原则","d":"脑并用”“做学合一”的原则，做到“理论与实际并行”“知识与技能并重”"},{"t":"作为中国近现代职业教育的先行者","d":"育的先行者，黄炎培及其职业教育思想开创和推进了中国的职业教育事业；其平民化、实用化、科学化和社会化特征，也丰富了中国的教育理论，并对20世纪二三十年代中国教育改革产生了巨大的影响。32.。"}]}],"id":"柯虎5-31"},{"num":32,"title":"32 外教史·高频","subject":"外教史","blocks":[{"t":"杜威的“教育无目的”内涵","items":[{"t":"教育无目的论：杜威提出了“教育无目的论”","d":"及其对当代教育的启示，属于高频考点，难度适中。这里注意，题目询问杜威的教育无目的论，只需回答此思想内涵即可，不需要叙述杜威的其它实用主义教育思想。对当代教育的启示可以从注重个体发展、强调教育的社会属性、平衡个体与社会关系三个角度进行回答。"},{"t":"注重内在目的：所谓“教育无目的论”，并不是说教育真的没有目的","d":"所谓“教育无目的论”，并不是说教育真的没有目的。杜威反对的是外在的、固定的、终极的教育目的。他认为，外在的教育目的不能顾及儿童的兴趣和需要，杜威所希求的是教育过程内的目的，这个目的就是“生长”。杜威主张以生长为教育的目的，其主要意图在于反对外在因素对儿童发展的压制，要求教育尊重儿童的愿望和要求，使儿童从教育本身、生长过程中得到乐趣。③。"},{"t":"教育目的所具有的社会性：杜威强调以儿童为中心，注重儿童的经验，强调教育过程内的目的","d":"性：杜威强调以儿童为中心，注重儿童的经验，强调教育过程内的目的。杜威注重尊重儿童，促进儿童内在的发展，将民主的精神传递给儿童，认为最终还是要建设一个民主主义的社会。所以杜威不是个人本位论者，也不是社会本位论者，而是力求在个体和社会之间寻求平衡。"}]},{"t":"对当代教育的启示","items":[{"t":"注重个体发展：杜威强调教育应以个体的内在需求和成长为出发点","d":"强调教育的社会属性、平衡个体与社会关系三个角度进行回答。"},{"t":"强调教育的社会性：杜威认为教育目的具有社会性","d":"杜威认为教育目的具有社会性，教育应当促进个体的内在发展，并为建设民主社会奠定基础。教育不仅仅是为了个体发展，更应当培养学生的社会责任感和民主意识，促进社会的和谐发展。③。"},{"t":"平衡个体与社会：杜威在个体与社会之间寻求平衡，既重视个体的成长，又注重社会的发展","d":"杜威在个体与社会之间寻求平衡，既重视个体的成长，又注重社会的发展。这对我国教育体系提出了平衡个体发展和社会需求的要求，教育应当既关注学生个体发展，又培养学生为社会发展作出贡献的能力。"},{"t":"杜威的教育理念为我国教育体系提供了重要的启示","d":"教育体系提供了重要的启示，促使我们更加关注学生个体发展、社会责任感的培养以及个体与社会之间的平衡，从而推动我国教育朝着更加全面、平衡和可持续的方向发展。"}]}],"id":"柯虎5-32"},{"num":33,"title":"33 教育热点问题课改与“双减”政策·高频","subject":"教原","blocks":[{"t":"（1）简述德育、智育、体育的相互联系。","items":[{"t":"德育与智育的关系。","d":"正如苏格拉底所指出，美德即知识，道德可教。行善必知善，道德不仅仅是培养学生的具体道德规则，还要培养学生的道德思维能力。根据教育性教学原则，德育应当存在于一切教学之中。智育同样离不开德育。一些美德，如不迷信、不盲从、崇尚真理等，对于学生的知识和智力的发展极为重要。"},{"t":"正如苏格拉底所指出，美德即知识，道德可教","d":"美德即知识，道德可教。行善必知善，道德不仅仅是培养学生的具体道德规则，还要培养学生的道德思维能力。根据教育性教学原则，德育应当存在于一切教学之中。"},{"t":"智育同样离不开德育","d":"一些美德，如不迷信、不盲从、崇尚真理等，对于学生的知识和智力的发展极为重要。②。"},{"t":"智育和体育的关系。","d":"体育是智育的物质基础。学校教育所要培养的学生首先要求有强健的身体，只有身体强健、精力充沛的人才能高效地学习。智育对于体育也必不可少。教授一些程序性知识也是进行体育教学必不可少的环节。③。"},{"t":"德育与体育的关系。","d":"体育对于德育的影响，正如洛克所说“健康之精神寓于健康之身体”。只有拥有健康的身体，个体才能有精力运用知识和技能去服务社会、帮助他人。德育对于体育的影响也是显著的。在体育竞技中，团结协作、公平竞争等体育精神都离不开道德教育。（2）“双减”指要有效减轻义务教育阶段学生过重作业负担和校外培训负担。教育既有对个体发展的功能，也有对社会发展的功能。既有正向的功能，也有负向的功能；既有显性的功能，也有隐性的功能。①对个体的功能。正向功能：减轻学生校内作业和校外培训负担有助于保障学生的身心健康，提高学习效率，促进学生的全面发展。负向功能：过多的作业和培训可能导致学生焦虑、压力过大，甚至影响学生的心理健康和学。"}]},{"t":"（2）结合教育功能相关的知识点，谈谈“双减”政策的必要性。","items":[{"t":"对个体的功能。","d":"正向功能：减轻学生校内作业和校外培训负担有助于保障学生的身心健康，提高学习效率，促进学生的全面发展。负向功能：过多的作业和培训可能导致学生焦虑、压力过大，甚至影响学生的心理健康和学习动力。因此，减轻这些负担是确保学生健康成长的必要举措。"},{"t":"正向功能：减轻学生校内作业和校外培训负担有助于保障学生的身心健康","d":"减轻学生校内作业和校外培训负担有助于保障学生的身心健康，提高学习效率，促进学生的全面发展。"},{"t":"负向功能：过多的作业和培训可能导致学生焦虑、压力过大","d":"过多的作业和培训可能导致学生焦虑、压力过大，甚至影响学生的心理健康和学习动力。因此，减轻这些负担是确保学生健康成长的必要举措。②。"},{"t":"对社会的功能。","d":"正向功能：减轻学生负担有助于缓解家长的焦虑和压力，促进家庭和谐，减少家庭教育投入，有利于社会资源的合理利用。此外，减轻学生负担也有助于提升教育公平，减少学生间的竞争压力。负向功能：过多的作业和培训可能导致家长过度投入，加重家庭负担，甚至影响家庭和社会稳定。因此，减轻这些负担是维护社会稳定和促进社会发展的必要举措。③。"},{"t":"显性功能和隐性功能。","d":"显性功能：“双减”政策的显性功能是直接减轻学生作业和培训负担，提高学生的学习效率和生活质量。隐性功能：如对于建设更加公正、稳定的社会具有重要意义。综合来看，“双减”政策的必要性体现在保障学生身心健康、促进全面发展、缓解家庭压力、提升教育公平等多个方面，有助于个体和社会的健康发展，推动教育体系朝着更加平衡、可持续的方向发展。（3）①课程目标：由注重知识传授向获得核心素养转变。学生的理想信念、道德品质、知识智力、身体和心理素质等各方面的培养缺一不可。持续推动落实好“双减”工作要求，促进学生全面发展。②课程结构：由分科为主向分科和综合课程结合转变。不断优化课程结构，加强跨学科学习和实践学习，适当增加。"}]},{"t":"（3）结合材料","items":[{"t":"课程结构：由分科为主向分科和综合课程结合转变","d":"33.【解析】本题结合材料考查教育热点问题课改与“双减”政策。属于高频考点，难度较高。首先第一问，关于德育智育体育的相互联系，可以从全面教育的组成部分进行回答，分别解释其互相的关系。第二问，从教育功能解释“双减”政策的必要性，从教育功能上讲，教育分为个体功能与社会功能，教育也有正向功能与负向功能，教育还有显性功能与隐形功能。从这三个角度，解答“双减”政策的必要性，强调其能保障学生身心健康、促进全面发展、缓解家庭压力、提升教育公平等多个方面，有助于个体和社会的健康发展，推动教育体系朝着更加平衡、可持续的方向发展。第三问，从课改角度，还少年儿童“一个幸福美好。"},{"t":"课程内容：由“难、繁、偏、旧”向注重兴趣和经验转变","d":"31.【解析】本题考查《中国教育史》近代职业教育家黄炎培的大职业教育思想，属于中频考点，难度较低。答题者可以从黄炎培的教育背景入题，其教育思想按照讲义与课程内容按点论述即可。【参考答案】黄炎培是中国近现代著名的爱国主义者和民主主义教育家，是我国近代职业教育的创始人和理论家。他将毕生精力奉献于中国的职业教育事业，为改革脱离社会生活和生产的传统教育，建设中国的职业教育，作出了重要的贡献。其大职业教育思想体现在“社会化、科学化”的职业教育方针上。"},{"t":"课程实施：由死记硬背、机械训练向自主、合作、探究学习转变","d":"等方面进行回答。【参考答案】（1）德育、智育、体育相互联系、密不可分，在实践中，共同组成统一的教育过程。①德育与智育的关系。正如苏格拉底所指出，美德即知识，道德可教。行善必知善，道德不仅仅是培养学生的具体道德规则，还要培养学生的道德思维能力。根据教育性教学原则，德育应当存在于一切教学之中。智育同样离不开德育。一些美德，如不迷信、不盲从、崇尚真理等，对于学生的知识和智力的发展极为重要。②智育和体育的关系。体育是智育的物质基础。学校教育所要培养的学生首先要求有强健的身体，只有身体强健、精力充沛的人才能高效地学习。智育对于体育也必不可少。教授一些程序性知识也是进行体育教学必不可少的环节。③德育与体育。"}]}],"id":"柯虎5-33"},{"num":34,"title":"34 教原·高频","subject":"教原","blocks":[{"t":"（1）根据上述材料概括过度炒作状元会带来至少哪4方面的不利…","items":[{"t":"首先，对“状元”自身有不利影响","d":"有不利影响：过于强调和渲染之前数年学业的成就，可能短时间能提升其成就感，但也在无形中“强化”了“成功者”的身份，不利于其关注学业本身的内部成就和动机，也不利于形成抗压能力。"},{"t":"其次，对其他考生带来不利影响","d":"不利影响：传递状元“成功者”的身份，隐喻其他同学为“失败者”，在某种程度上是对其他学生自我价值的否定，不利于其树立积极的自我概念和自我意识。"},{"t":"再次，对教育资源分配造成不利影响","d":"造成不利影响：会造成学校之间的攀比，出了状元的学校更能吸引优质的师资，造成教育资源的分配不均。"},{"t":"最后，对社会风气的不利影响：在社会上形成利益链条，媒体的渲染和炒作引起教育焦虑","d":"利影响：在社会上形成利益链条，媒体的渲染和炒作引起教育焦虑。（2）①从学习理论的角度看评价改革的必要性。人本理论认为学习应促进学生知情方面的统一，不能只关注和评价学生的成绩。不过度渲染“高考状元”，提倡综合性的评价方式，避免使学生产生“失败者”的焦虑情绪，有利于促进立德树人，培养完人。观察学习理论强调榜样的重要性，但是榜样应和观察者之间有较多的相似性，在差距较大时，反而不利于学生自身的期待。在全社会形成尊重知识、尊重创造的良好风气，而不是渲染“高考状元”的成功，对社会风气有更好的影响。②从学习动机的角度看评价改革的必要性。不以学生中高考成绩为标准对学生进行奖励，从学习动机的角度来看，有利于激发。"}]},{"t":"（2）2020年10月","items":[{"t":"人本理论认为学习应促进学生知情方面的统一，不能只关注和评价学生的成绩","d":"进学生知情方面的统一，不能只关注和评价学生的成绩。不过度渲染“高考状元”，提倡综合性的评价方式，避免使学生产生“失败者”的焦虑情绪，有利于促进立德树人，培养完人。"},{"t":"观察学习理论强调榜样的重要性","d":"的重要性，但是榜样应和观察者之间有较多的相似性，在差距较大时，反而不利于学生自身的期待。在全社会形成尊重知识、尊重创造的良好风气，而不是渲染“高考状元”的成功，对社会风气有更好的影响。②。"},{"t":"从学习动机的角度看评价改革的必要性。","d":"价改革的必要性。不以学生中高考成绩为标准对学生进行奖励，从学习动机的角度来看，有利于激发学生的内部学习动机。归因理论认为教育应引导学生对成败进行正确的归因，过度渲染高考状元，可能会使“成功者”更倾向于将自己的“成功”归因于能力，而失败者也会将失败归因于自己的能力，觉得自己“天生不是学习的料”。不过度渲染“高考状元”，可以不过度把学习和自我概念、自尊联系在一起，有利于树立学生积极的自我概念，帮助学生形成良好的自我同一性。从学习习惯、学习态度等方面引导学生归因。目标定向理论认为，任务卷入的学习者比个体卷入的学习者有更高的认知水平。评价方式由结果导向的评价转变。"},{"t":"不以学生中高考成绩为标准对学生进行奖励","d":"标准对学生进行奖励，从学习动机的角度来看，有利于激发学生的内部学习动机。归因理论认为教育应引导学生对成败进行正确的归因，过度渲染高考状元，可能会使“成功者”更倾向于将自己的“成功”归因于能力，而失败者也会将失败归因于自己的能力，觉得自己“天生不是学习的料”。不过度渲染“高考状元”，可以不过度把学习和自我概念、自尊联系在一起，有利于树立学生积极的自我概念，帮助学生形成良好的自我同一性。从学习习惯、学习态度等方面引导学生归因。目标定向理论认为，任务卷入的学习者比个体卷入的学习者有更高的认知水平。评价方式由结果导向的评价转变为综合性的评价，有利于学生关注学习过程，而不以考试成绩的结果论英雄。（3）作。"}]},{"t":"（3）假定你是一名班主任","items":[{"t":"首先，我会更关注和发掘学生的学习兴趣，引导学生把关注点放在学习过程中，而不是放在…","d":"掘学生的学习兴趣，引导学生把关注点放在学习过程中，而不是放在学习结果上。"},{"t":"其次，我会努力促进学生之间的合作，可以通过分组","d":"生之间的合作，可以通过分组、对话的方式，帮助学生明白集体合作的重要性。"},{"t":"最后，作为班主任，我会避免注重结果性评价，更多地关注过程性评价","d":"会避免注重结果性评价，更多地关注过程性评价。35.。"}]}],"id":"柯虎5-34"},{"num":35,"title":"35 教育实际问题","subject":"教原","blocks":[{"t":"（1）阅读上述案例","items":[{"t":"材料中反映出由于学校超负荷招生且学生学习水平差异大","d":"超负荷招生且学生学习水平差异大，导致教育资源分配不均，特别是对学习水平较低的学生，他们未能获得足够的关注和支持，违背了教育公平的原则。学校为了生存发展，让老师高负荷工作，也没有做到对老师的关心和爱护。②。"},{"t":"柯老师重点关注的问题只是如何在有限的时间内","d":"只是如何在有限的时间内，完成教学任务，她选择忽视学习水平较低的学生，对他们采取放任的态度，这是柯老师缺乏专业素养、违背专业标准的表现。③。"},{"t":"柯老师过分重视优等生的成绩和升学率","d":"的成绩和升学率，而忽视后进生的学习情况，这本身就是柯老师教育目的缺失，以及教学目标不清晰的表现。教育本质是促人向善的，育人根本在育德，学校与柯老师都忽略了这一点。（2）假如我是柯老师，面对这种情况，我会从以下角度处理：①确保每个学生都能获得公平的教育机会。我会重新评估座位安排，确保所有学生都能在课堂上得到适当的关注，而不是仅仅将学习水平较低的学生安排在教室后面。②采用小组学习和合作学习的组织形式。我会根据学生的不同能力和需求，设计差异化的教学计划和活动，确保每个学生都能在自己的水平上得到提升。并鼓励学生进行合作，通过小组讨论和项目展开，让不同水平的学生互相帮助，共同进步。此外，我还会定期反思教。"}]},{"t":"（2）假如你是柯老师，面对这种情况你会如何处理？","items":[{"t":"确保每个学生都能获得公平的教育机会","d":"公平的教育机会。我会重新评估座位安排，确保所有学生都能在课堂上得到适当的关注，而不是仅仅将学习水平较低的学生安排在教室后面。②。"},{"t":"采用小组学习和合作学习的组织形式","d":"习的组织形式。我会根据学生的不同能力和需求，设计差异化的教学计划和活动，确保每个学生都能在自己的水平上得到提升。并鼓励学生进行合作，通过小组讨论和项目展开，让不同水平的学生互相帮助，共同进步。此外，我还会定期反思教学方法的有效性，根据学生的学习反馈进行调整，以满足不同学生的需求。③。"},{"t":"情感上激励、尊重、关爱学生","d":"爱学生。尊重每个学生的个性和差异，通过个别辅导和鼓励，帮助他们建立自信，激发学习兴趣。通过表扬和奖励，正面激励学生的学习行为，即使是小的进步也应给予认可。此外，我还会与家长建立良好的沟通机制，共同关注学生的学习进展，为学生提供更多的支持和资源。④。"},{"t":"建立良好的师生关系","d":"即尊师爱生，相互配合；民主平等、和谐亲密；教学相长，心理相容的师生关系。36.。"}]}],"id":"柯虎5-35"},{"num":36,"title":"36 教心·高频","subject":"教心","blocks":[{"t":"（1）结合维果茨基的最近发展区理论","items":[{"t":"前者由独立解决问题的能力而定","d":"能力而定，后者则是指在成人的指导下或是与更有能力的同伴合作时解决问题的能力。"},{"t":"小A、小B和小C这三个学生处在不同的发展水平：","d":"（1）最近发展区是由维果茨基提出的，指现在的发展水平与潜在的发展水平之间的差距。前者由独立解决问题的能力而定，后者则是指在成人的指导下或是与更有能力的同伴合作时解决问题的能力。小A、小B和小C这三个学生处在不同的发展水平：小A的能力在百分数问题的最近发展区之上，她不需要额外的帮助就能完成任务。小B的能力恰好处在最近发展区之内，在教师的帮助下，他成功地完成了学习任务。小C的能力在最近发展区之下，所以教师不得不改变他的教学以便适应并找到小C的最近发展区。例如，小C一开始并不知道该问题可以通过首先得到一个分数，然后是一个小数，最后是一个百分数来解决。然而，小C。"},{"t":"小A的能力在百分数问题的最近发展区之上，她不需要额外的帮助就能完成任务","d":"题的最近发展区之上，她不需要额外的帮助就能完成任务。"},{"t":"小B的能力恰好处在最近发展区之内，在教师的帮助下，他成功地完成了学习任务","d":"近发展区之内，在教师的帮助下，他成功地完成了学习任务。小C的能力在最近发展区之下，所以教师不得不改变他的教学以便适应并找到小C的最近发展区。例如，小C一开始并不知道该问题可以通过首先得到一个分数，然后是一个小数，最后是一个百分数来解决。然而，小C却能够算出卖给宠物店的沙鼠的分数。教师通过及时地让小C确认这个分数，使教学适应并找到了小C在该任务上的最近发展区，因此，促进了小C的发展。（2）在实际教学中，教师可运用多种教学方式促进学生的认知发展，如：①利用支架式教学：在学生的最近发展区内给学生提供适当的支持和指导，而且要随着儿童认知发展的变化进行调整。②进行交互式教学：最近发展区内的相互作用实质是。"}]},{"t":"（2）结合认知发展理论，谈谈如何在实际教学中促进学生发展？","items":[{"t":"利用支架式教学：在学生的最近发展区内给学生提供适当的支持和指导","d":"在学生的最近发展区内给学生提供适当的支持和指导，而且要随着儿童认知发展的变化进行调整。②。"},{"t":"进行交互式教学：最近发展区内的相互作用实质是教师和学生共同协作的认知活动","d":"最近发展区内的相互作用实质是教师和学生共同协作的认知活动，因此在教学中，教师可以运用交互式教学，和学生轮流充当教师角色加强学生对知识的理解与运用。③。"},{"t":"开展合作学习：教师应当在课堂中引导学生有意识地模仿专家或同伴的行为来思考和完成具体任务","d":"教师应当在课堂中引导学生有意识地模仿专家或同伴的行为来思考和完成具体任务，使学生从旁观者逐渐转变为教学活动的参与者，在合作中获得知识和技能。"}]}],"id":"柯虎5-36"}],"id":"柯虎5"},{"name":"柯虎6","questions":[{"num":31,"title":"31 《中国教育史》古代儒家教育著作《…·高频","subject":"中教史","blocks":[{"t":"为学之序：《中庸》提出“博学之","items":[{"t":"《中庸》与《大学》互为阐发","d":"为阐发，具有较强的理论色彩和思辨性，对后世知识分子、一般民众的个人修养、精神生活和为人处世均有影响。中庸的准则要求人们行事最大限度中正适度，恰到好处，但它体现的保守性和缺乏锐气也是明显的。32.。"}]}],"id":"柯虎6-31"},{"num":32,"title":"32 《外国教育史》赫尔巴特的课程论·高频","subject":"外教史","blocks":[{"t":"经验、兴趣与课程","items":[{"t":"经验的兴趣。经验的兴趣具体包括经验的、思辨的、审美的兴趣。经验的兴趣对应的课程：","d":"趣具体包括经验的、思辨的、审美的兴趣。经验的兴趣对应的课程：。"},{"t":"自然、物理、化学、地理等","d":"理等；思辨的兴趣对应的课程：数学、逻辑、文法等；审美的兴趣对应的课程：文学、绘画等。②。"},{"t":"同情的兴趣。同情的兴趣具体包括同情的、社会的、宗教的兴趣；同情的兴趣对应的课程：","d":"趣具体包括同情的、社会的、宗教的兴趣；同情的兴趣对应的课程：。"},{"t":"外国语、本国语等","d":"社会的兴趣对应的课程：历史、政治、法律等；宗教的兴趣对应的课程：神学等。（2）统觉与课程。①相关原则：学校不同课程的安排应当相互影响、相互联系。②集中原则：在学校的所有课程中，选择一门科目作为学习的中心，其他科目作为学习和理解它的手段，历史和数学是所有科目的中心。（3）儿童发展与课程。文化纪元理论是儿童发展与课程设计的基础。以此为基础，赫尔巴特深入探讨了儿童的年龄分期。①婴儿期：0~3岁，相当于人类历史的早期，对身体的养护大于一切；②幼儿期：4~8岁，相当于人类历史的想象期，教学内容以《荷马史诗》为主；③童年期：主要学习任务是学习数学；④青年期：主要学习任务是学习历史。（4）赫尔巴特课程论的。"}]},{"t":"统觉与课程。","items":[{"t":"相关原则：学校不同课程的安排应当相互影响、相互联系。","d":"学校不同课程的安排应当相互影响、相互联系。②。"},{"t":"集中原则：在学校的所有课程中","d":"在学校的所有课程中，选择一门科目作为学习的中心，其他科目作为学习和理解它的手段，历史和数学是所有科目的中心。（3）儿童发展与课程。文化纪元理论是儿童发展与课程设计的基础。以此为基础，赫尔巴特深入探讨了儿童的年龄分期。①婴儿期：0~3岁，相当于人类历史的早期，对身体的养护大于一切；②幼儿期：4~8岁，相当于人类历史的想象期，教学内容以《荷马史诗》为主；③童年期：主要学习任务是学习数学；④青年期：主要学习任务是学习历史。（4）赫尔巴特课程论的启示。①根据兴趣设置广泛的课程内容。课程内容的选择必须与儿童的经验和兴趣相一致，只有与儿童经验相联系的内容，才能引起儿童的兴趣。②在进行课程改革的过程中，必。"}]},{"t":"儿童发展与课程","items":[{"t":"婴儿期：0~3岁，相当于人类历史的早期，对身体的养护大于一切；","d":"0~3岁，相当于人类历史的早期，对身体的养护大于一切；②。"},{"t":"幼儿期：4~8岁，相当于人类历史的想象期，教学内容以《荷马史诗》为主；","d":"4~8岁，相当于人类历史的想象期，教学内容以《荷马史诗》为主；③。"},{"t":"童年期：主要学习任务是学习数学；"},{"t":"青年期：主要学习任务是学习历史。","d":"主要学习任务是学习历史。（4）赫尔巴特课程论的启示。①根据兴趣设置广泛的课程内容。课程内容的选择必须与儿童的经验和兴趣相一致，只有与儿童经验相联系的内容，才能引起儿童的兴趣。②在进行课程改革的过程中，必须以间接经验的学习为主，以学生的直接经验为基础。③学校在进行课程安排时必须遵循相关与集中原则。学校不同课程的安排应当相互影响、相互联系。在学校的所有课程中，选择一门科目作为学习的中心，其他科目作为学习和理解它的手段。④以儿童发展以及文化发展为课程设计的基础，有的放矢地进行教育，提高课程内容的时效性。"}]},{"t":"赫尔巴特课程论的启示。","items":[{"t":"根据兴趣设置广泛的课程内容","d":"程内容。课程内容的选择必须与儿童的经验和兴趣相一致，只有与儿童经验相联系的内容，才能引起儿童的兴趣。②。"},{"t":"在进行课程改革的过程中，必须以间接经验的学习为主，以学生的直接经验为基础。","d":"中，必须以间接经验的学习为主，以学生的直接经验为基础。③。"},{"t":"学校在进行课程安排时必须遵循相关与集中原则","d":"必须遵循相关与集中原则。学校不同课程的安排应当相互影响、相互联系。在学校的所有课程中，选择一门科目作为学习的中心，其他科目作为学习和理解它的手段。④。"},{"t":"以儿童发展以及文化发展为课程设计的基础，有的放矢地进行教育，提高课程内容的时效性。","d":"展为课程设计的基础，有的放矢地进行教育，提高课程内容的时效性。"}]}],"id":"柯虎6-32"},{"num":33,"title":"33 教育对社会的作用·高频","subject":"教原","blocks":[{"t":"（1）从教育对社会的功能角度","items":[{"t":"在经济方面：教育是使可能的劳动力转变为现实的劳动力的基本途径","d":"教育是使可能的劳动力转变为现实的劳动力的基本途径。教育是使知识形态的生产力转化为直接生产力的一种重要途径。教育是提高劳动生产率的重要因素。②。"},{"t":"在政治方面：教育通过传播一定的社会政治意识形态，完成年轻一代的政治社会化","d":"教育通过传播一定的社会政治意识形态，完成年轻一代的政治社会化。教育通过培养政治管理人才，促进政治体制的变革与完善。教育通过提高全民文化素质，推动国家的民主政治建设。教育是形成社会舆论、影响政治时局的重要力量。③。"},{"t":"在文化方面：教育可以传递文化、选择文化、发展文化。","d":"教育可以传递文化、选择文化、发展文化。④。"},{"t":"在科技方面：教育可以为科学技术的发展提供知识积累","d":"教育可以为科学技术的发展提供知识积累，为科学技术的发展培养所需人才，为科学技术转化为生产力创造条件。教育通过发挥这些社会功能，可以促进科技创新，培养相应人才。科技创新是现代化的重要推动力量，能够提高生产效率、改善生活质量，推动经济社会发展。科技的进步对于国家的现代化进程至关重要。人才是国家的宝贵资源，是推动现代化发展的重要力量。培养和吸引高素质人才，提高人才的创新能力和竞争力，对于国家的现代化建设至关重要。（2）①教育目的方面培养创新人才：教育的目的应当是培养具有创新精神、实践能力和综合素质的人才，使其能够适应社会发展的需要，为国家创新体系提供人才支持。②教育内容方面科技教育：加强科技教育。"}]},{"t":"（2）从学校教育变革的角度","items":[{"t":"教育内容方面科技教育：加强科技教育","d":"加强科技教育，将科技创新理念和方法融入教育内容中，培养学生的科学素养和创新意识。"},{"t":"实践能力培养：注重培养学生的实践能力","d":"注重培养学生的实践能力，通过实践性教学和项目实践，提升学生的创新能力和解决问题的能力。③。"},{"t":"教育方法方面项目化学习：推行项目化学习","d":"习：推行项目化学习，让学生参与实际项目，培养他们的团队合作能力和解决问题的能力。"},{"t":"跨学科教育：推动跨学科教育","d":"推动跨学科教育，打破学科壁垒，促进不同学科之间的交叉融合，培养学生的综合素质和创新思维。④。"},{"t":"教育评价方面综合评价体系：建立综合评价体系","d":"体系：建立综合评价体系，不仅注重学生的学习成绩，还要评价学生的创新能力、实践能力和团队合作能力。激励创新：通过奖励制度和激励机制，鼓励学生参与科技创新活动，促进学生创新意识和实践能力的提升。34.。"}]}],"id":"柯虎6-33"},{"num":34,"title":"34 教原·高频","subject":"教原","blocks":[{"t":"（1）根据上述材料的描述","items":[{"t":"微观系统指的是个体活动和交往的直接环境","d":"动和交往的直接环境。一开始，学生作为独立个体，其发展的微观系统主要为家庭，后随着学生的发展，活动范围不断扩展，学校、社会被不断纳入个体的微观系统。②。"},{"t":"中间系统指的是各微观系统之间的联系","d":"系统之间的联系。对学生而言，家庭、学校都是他所处的微观系统，微观系统之间会相互作用，这也代表着学生的家庭和学校需要共同努力作用于学生的发展。③。"},{"t":"外层系统指的是学生并未直接参与却对学生的发展起到影响的系统","d":"未直接参与却对学生的发展起到影响的系统。在学校中，学生有大量的同伴群体，他们每个人都受到各自家庭的影响，又在不断地影响他人。这代表着家庭教育的影响不仅仅局限于个体的家庭。④。"},{"t":"宏观系统指的是整个社会环境，包括主流价值观、文化、亚文化等","d":"会环境，包括主流价值观、文化、亚文化等。这代表整个社会都应明确育人的职责。综上，学校是教书育人的主阵地，要认真履行教育教学职责，全面掌握并向家长及时沟通学生在校期间的情况。家长要强化家庭是第一个课堂、家长是第一任老师的责任意识，注重家庭建设，坚持以身作则、言传身教，为子女健康成长创造良好家庭环境。社会应有效支持、服务全面育人。教育的责任不能只留给学校。35.。"}]}],"id":"柯虎6-34"},{"num":35,"title":"35 教原·高频","subject":"教原","blocks":[{"t":"（1）上述案例中体现了什么德育原则和方法？","items":[{"t":"集体教育和个别教育相结合的原则：上述案例中王老师在一次照相活动中发现米琦的孤单","d":"35.【解析】本题结合材料例子，考查《教育学原理》德育教育。属于高频考点，难度较低。第一问材料体现了集体教育和个别教育相结合的原则、发挥积极因素和克服消极因素相结合的原则、榜样示范法和实践锻炼法，注意回答时要结合材料分析德育原则。第二问答案不唯一，王老师的做法产生的效果只要是积极向上的，有助于米琦的，言之有理即可。【参考答案】。"},{"t":"发挥积极因素和克服消极因素相结合的原则：该原则指在德育过程中","d":"35.【解析】本题结合材料例子，考查《教育学原理》德育教育。属于高频考点，难度较低。第一问材料体现了集体教育和个别教育相结合的原则、发挥积极因素和克服消极因素相结合的原则、榜样示范法和实践锻炼法，注意回答时要结合材料分析德育原则。第二问答案不唯一，王老师的做法产生的效果只要是积极向上的，有助于米琦的，言之有理即可。【参考答案】。"},{"t":"榜样示范法：所有同学都在拍照，只有米琦同学看到并捡起了被弄掉的文具盒","d":"35.【解析】本题结合材料例子，考查《教育学原理》德育教育。属于高频考点，难度较低。第一问材料体现了集体教育和个别教育相结合的原则、发挥积极因素和克服消极因素相结合的原则、榜样示范法和实践锻炼法，注意回答时要结合材料分析德育原则。第二问答案不唯一，王老师的做法产生的效果只要是积极向上的，有助于米琦的，言之有理即可。【参考答案】。"},{"t":"实践锻炼法：王老师发现米琦同学身上的闪光点","d":"注意回答时要结合材料分析德育原则。第二问答案不唯一，王老师的做法产生的效果只要是积极向上的，有助于米琦的，言之有理即可。"}]},{"t":"（2）请你评析一下王老师的做法有什么效果？","items":[{"t":"对米琦来说","d":"他有了更多与同学们相处的机会，也多了很多朋友，能够更好地融入班集体，他不再孤单，变得更加乐观、开朗、自信。②。"},{"t":"对于班级里的其他同学来说","d":"来说，大家有了榜样，日后都会变得像米琦一样主动做好事，主动为班级做一些力所能及的事，也会变得更加有责任和担当。③。"},{"t":"对王老师来说","d":"一次偶然的照相活动，让她关注到了米琦同学，而后又开展了一系列主题班会活动，达到了王老师对米琦、对其他同学的教育目的，有利于整个班集体形成良好的氛围。36.。"}]}],"id":"柯虎6-35"},{"num":36,"title":"36 教原·高频","subject":"教原","blocks":[{"t":"（1）依据艾里克森的发展理论","items":[{"t":"案例中反映了青少年的自我同一性（或自我认同）发展问题","d":"自我同一性（或自我认同）发展问题。艾里克森认为青少年阶段的发展冲突是角色同一性对角色混乱，发展任务是建立同一性。青少年在复杂的社会条件下经历同一性危机，这是青少年在确立自己的价值观和目标之前进行尝试的一段痛苦的时期。（2）青少年在这一发展阶段的发展问题容易受到家庭、社会环境、个人特点等多方面因素的影响。个体方面的因素包括个体的认知水平、人格特点等，而环境方面的因素则包括同伴互动、亲子关系（教养方式）、学校和社区提供的探索机会，以及社会文化等因素。这些因素共同影响着青少年的自我认同发展，塑造着他们对未来道路的思考和选择。在案例中，乙受父母设计的大学专业和职业规划影响，缺乏自主选择意识；丙通过自我。"}]},{"t":"（2）结合案例","items":[{"t":"个体方面的因素包括个体的认知水平、人格特点等","d":"体的认知水平、人格特点等，而环境方面的因素则包括同伴互动、亲子关系（教养方式）、学校和社区提供的探索机会，以及社会文化等因素。这些因素共同影响着青少年的自我认同发展，塑造着他们对未来道路的思考和选择。"},{"t":"在案例中，乙受父母设计的大学专业和职业规划影响，缺乏自主选择意识","d":"计的大学专业和职业规划影响，缺乏自主选择意识；丙通过自我探索和咨询表哥选择专业，展现了积极的自我认同探索；而丁则表现出对未来迷茫和不愿意思考的态度，可能受到环境中缺乏引导和支持的影响。"}]}],"id":"柯虎6-36"}],"id":"柯虎6"},{"name":"柯虎7","questions":[{"num":31,"title":"31 《中国教育史》近代癸卯学制·高频","subject":"中教史","blocks":[{"t":"新的部分","items":[{"t":"学制的系统：仿照三级学制系统模式分为初等、中等、高等三级。","d":"仿照三级学制系统模式分为初等、中等、高等三级。②。"},{"t":"学制的目的：规划了义务教育的目标，确立了德、智、体三方面协调发展的“三育”模式。","d":"规划了义务教育的目标，确立了德、智、体三方面协调发展的“三育”模式。③。"},{"t":"学制内容：设置了众多实业学堂，以适应和推动近代资本主义工商业的发展，重视师范教育。","d":"设置了众多实业学堂，以适应和推动近代资本主义工商业的发展，重视师范教育。④。"},{"t":"学制的组织管理：将分年课程规划、班级授课制作为基本的教学管理和教学组织形式。","d":"将分年课程规划、班级授课制作为基本的教学管理和教学组织形式。⑤。"},{"t":"对待儿童：要求尊重儿童个性，禁止体罚。","d":"要求尊重儿童个性，禁止体罚。⑥课程比重：西学占主导。（2）旧的部分①学制的指导思想：仍然是洋务教育“中学为体，西学为用”的延续，首要任务是培养学生效忠封建王朝。②学制的课程内容：“读经讲经”课比重大。③学制的等级性：进入学堂需要有保人，客观上限制了普通民众进入高等教育；广大妇女被排斥在学校教育之外。④学制的管理：规定了许多旨在维护封建统治秩序的禁令，并根据学生的表现和学业程度奖励相应的功名。癸卯学制包含了资本主义因素和封建性因素，是传统性和近代性的综合产物，具有新旧杂糅的特点。32.。"}]},{"t":"旧的部分","items":[{"t":"学制的指导思想：仍然是洋务教育“中学为体","d":"仍然是洋务教育“中学为体，西学为用”的延续，首要任务是培养学生效忠封建王朝。②。"},{"t":"学制的课程内容：“读经讲经”课比重大。"},{"t":"学制的等级性：进入学堂需要有保人，客观上限制了普通民众进入高等教育","d":"进入学堂需要有保人，客观上限制了普通民众进入高等教育；广大妇女被排斥在学校教育之外。④。"},{"t":"学制的管理：规定了许多旨在维护封建统治秩序的禁令","d":"规定了许多旨在维护封建统治秩序的禁令，并根据学生的表现和学业程度奖励相应的功名。癸卯学制包含了资本主义因素和封建性因素，是传统性和近代性的综合产物，具有新旧杂糅的特点。32.。"}]}],"id":"柯虎7-31"},{"num":32,"title":"32 《外国教育学》新教主义思潮·低频","subject":"教原","blocks":[{"t":"新传统主义教育思潮的主要观点","items":[{"t":"要素主义教育思潮主张把人类文化的“共同要素”传给下一代","d":"把人类文化的“共同要素”传给下一代、教学过程必须是一个训练智慧的过程、强调教师在教育和教学中的核心地位、强调学生在学习上必须努力和专心、重视学业考核和天才教育。必须划定标准，对学生予以考核。"},{"t":"永恒主义教育主张教育的性质永恒不变","d":"的性质永恒不变，教育的目的是要引出人类天性中共同的要素——理性，永恒的古典学科应在学校课程中占有中心地位，学生通过教师的教学进行学习。"},{"t":"新托马斯主义教育是以托马斯主义为理论基础，大力主张宗教教育的一种教育理论","d":"托马斯主义为理论基础，大力主张宗教教育的一种教育理论。"},{"t":"新传统主义教育思潮重视学科知识的系统性和内在联系","d":"视学科知识的系统性和内在联系、强调教育的整体性和个性化、注重传统文化的传承、重视教育与社会的联系、强调教育活动中教师的作用。（2）新传统主义教育思潮对教育的影响主要体现在以下几个方面：①把教育放在了更广泛的社会背景下进行研究，这对于强化教育与社会之间的联系，推进教育社会化具有重要意义。②建立了教师的权威性。新传统主义教育思潮加强了教师在教育活动中的地位，使教师成为占主导地位的教育者，从而增强了教育的效果。③重视传统文化的传承。新传统主义教育思潮的出现和传播对于弘扬传统文化、恢复传统文化对教育价值的探讨都起到了积极的促进作用。总的来说，新传统主义教育思潮通过回归传统，使得教育更加贴近现实生活和社。"}]},{"t":"新传统主义教育思潮对教育的影响主要体现在以下几个方面：","items":[{"t":"把教育放在了更广泛的社会背景下进行研究","d":"社会背景下进行研究，这对于强化教育与社会之间的联系，推进教育社会化具有重要意义。②。"},{"t":"建立了教师的权威性","d":"新传统主义教育思潮加强了教师在教育活动中的地位，使教师成为占主导地位的教育者，从而增强了教育的效果。③。"},{"t":"重视传统文化的传承","d":"新传统主义教育思潮的出现和传播对于弘扬传统文化、恢复传统文化对教育价值的探讨都起到了积极的促进作用。总的来说，新传统主义教育思潮通过回归传统，使得教育更加贴近现实生活和社会问题，对于适应当时的教育需求起到了积极的作用。"}]}],"id":"柯虎7-32"},{"num":33,"title":"33 教学评价的相关知识·高频","subject":"教原","blocks":[{"t":"（1）阐述教学评价在教学中的作用。","items":[{"t":"诊断教学问题：通过评价教学目标的达成程度","d":"通过评价教学目标的达成程度，教师可以得知教学目标的设置是否合理，教学方法与手段的运用是否得当，教学的重难点是否解决，也可以了解学生在知识技能、过程方法和情感态度价值观等方面的现有水平与存在的问题。②。"},{"t":"提供反馈信息：教学评价的结果可以为教师判定教学现状并及时作出调整提供大量的反馈信息","d":"教学评价的结果可以为教师判定教学现状并及时作出调整提供大量的反馈信息，也可以为学生了解自己学习效果的优劣提供直接的反馈信息。③。"},{"t":"调控教学方向：如果教学评价的标准和内容能够全面地反映人才培养的需要","d":"如果教学评价的标准和内容能够全面地反映人才培养的需要，充分体现全面发展的发展方向，那么，教学评价便能够发挥积极的导向作用，有利于学生的学习。反之，则有可能使得教学活动偏离正确的方向。④。"},{"t":"检验教学效果：在教学活动中","d":"在教学活动中，教师的教学水平和教学效果如何，学生是否掌握了必备的基础知识和基本技能，预定的教学目标是否实现，这些都必须通过教学评价加以检查和验证。（2）不当的教学评价会使得教学活动的实施与开展偏离正确的方向，影响人才培养的质量与效果，在宏观与微观层面上的负面影响具体表现为：①宏观层面：我国的教育目的在于培养德、智、体、美、劳全面发展的社会主义建设者和接班人。不当的教学评价会使我国教育偏离立德树人的根本目标。基础教育中会存在“五育缺失”疏德、偏智、弱体、抑美、缺劳）的问题，“唯分数、唯升学”的指挥棒使得素质教育的推进陷入困境。“唯分数”的量化评价方式不变，造成了校内减负校外增负的结果，导致“影。"}]},{"t":"（2）结合材料","items":[{"t":"宏观层面：我国的教育目的在于培养德、智、体、美、劳全面发展的社会主义建设者和接班人","d":"我国的教育目的在于培养德、智、体、美、劳全面发展的社会主义建设者和接班人。不当的教学评价会使我国教育偏离立德树人的根本目标。基础教育中会存在“五育缺失”疏德、偏智、弱体、抑美、缺劳）的问题，“唯分数、唯升学”的指挥棒使得素质教育的推进陷入困境。“唯分数”的量化评价方式不变，造成了校内减负校外增负的结果，导致“影子教育”的盛行，不利于培养当代社会所需的人才。②。"},{"t":"微观层面：","d":"（2）不当的教学评价会使得教学活动的实施与开展偏离正确的方向，影响人才培养的质量与效果，在宏观与微观层面上的负面影响具体表现为：。"},{"t":"加剧人与人之间的竞争","d":"减少合作机会：过于标准化与高利害的评价方式会使得班级同学将彼此视作“假想敌”，加剧班级中的紧张竞争氛围，不利于小组讨论等合作学习形式的开展。"},{"t":"千人一面，不利于学生独立个性的培养与身心的全面发展","d":"独立个性的培养与身心的全面发展。限制教师的教学选择：僵化的教学评价会使得教师不得不为适应现有评价方式而选择知识性教学内容，这在一定程度上限制了教师的教学选择。事实上，教师的教学自主性和自由应该获得支持，只有保障专业自主权，才能激励有能力的教育工作者继续从事这一职业，并吸纳有能力和积极性的个人进入这一行业。（3）为使教学评价正确发挥效用，现代教育亟须转变评价方式，以使之适应社会所需，具体表现为：①由过去主要评价教师的“教”向重点评价学生的“学”转变。②由过去注重“双基”和“学科能力”目标落实的评价，向既注重“双基”和“学科能力”的形成，也注重学生在学习过程中情感、态度的发展的评价转变。③由注重教。"}]},{"t":"（3）为使教学评价正确发挥效用，现代教育应该怎么做？","items":[{"t":"由过去主要评价教师的“教”向重点评价学生的“学”转变。","d":"教”向重点评价学生的“学”转变。②。"},{"t":"由过去注重“双基”和“学科能力”目标落实的评价","d":"学科能力”目标落实的评价，向既注重“双基”和“学科能力”的形成，也注重学生在学习过程中情感、态度的发展的评价转变。③。"},{"t":"由注重教师对教材的使用和教学方法的选择的评价","d":"用和教学方法的选择的评价，向注重学生学习方法的指导和教学媒体的有效利用的评价转变。④。"},{"t":"注重发挥教学评价的发展性功能","d":"展性功能，即淡化评比和奖惩，突出其发展性价值，发挥其提高课堂教学质量和促进任课教师专业成长的功能。⑤。"},{"t":"构建新的课堂教学评价标准","d":"标准。体现在：关注学生的全面发展；注重教师角色的转变，发展新型的师生关系；倡导自主、探究、合作的学习方式；关注个体差异，满足不同学生的需要等。⑥注重教师的自我评价和教学反思，是当前课堂教学改革的一个普遍趋势。34.。"}]}],"id":"柯虎7-33"},{"num":34,"title":"34 教原·高频","subject":"教原","blocks":[{"t":"（1）阅读材料，概括心理健康问题带来的危害。","items":[{"t":"信任对怀疑（0~1.5岁）：如果婴儿得到了较好的抚养并与父母建立了良好的亲子关系","d":"5岁）：如果婴儿得到了较好的抚养并与父母建立了良好的亲子关系，婴儿将对周围世界产生信任感，否则将产生怀疑和不安的心理问题。"},{"t":"自主对羞怯（1.5~3岁）：这一阶段的儿童开始表现出自我控制的需要与倾向","d":"3岁）：这一阶段的儿童开始表现出自我控制的需要与倾向，渴望自主，如果无法顺利过渡的话，可能出现容易羞怯的心理问题。"},{"t":"主动对内疚（3~6岁）：这一阶段儿童的活动范围逐渐超出家庭的圈子","d":"）：这一阶段儿童的活动范围逐渐超出家庭的圈子，他们想象自己正在扮演成年人的角色，并因能从事成年人的活动和胜任这些活动而体验一种愉快的情绪。"},{"t":"如果无法顺利过渡的话，可能出现容易内疚的心理问题","d":"可能出现容易内疚的心理问题。勤奋感对自卑感（6~12岁）：本阶段的儿童开始进入学校学习，面临来自家庭、学校以及同伴的各种要求和挑战，他们力求保持一种平衡，以至于形成一种压力。如果无法顺利过渡的话，可能出现容易自卑的心理问题。角色同一性对角色混乱（12~18岁）：这一阶段大体相当于少年期和青春初期。个体此时开始体会到自我概念问题的困扰，即开始考虑“我是谁”这一问题，体验着同一性与角色混乱的冲突。如果无法顺利过渡的话，可能出现同一性混乱的心理问题。②。"},{"t":"在信任对怀疑、自主对羞怯、主动对内疚的阶段，儿童的成长环境主要是家庭","d":"羞怯、主动对内疚的阶段，儿童的成长环境主要是家庭。这一时期，家长应明确家庭教育的职责，关注孩子心理健康，树立科学养育观念，尊重孩子心理发展规律，理性确定孩子成长预期，积极开展亲子活动，保障孩子充足睡眠。在勤奋感对自卑感、角色同一性对角色混乱的阶段，个体的成长环境主要是学校和家庭，也在逐步接触社会。教育应该培养个体应对危机并且提高发展的能力，尊重不同年龄阶段儿童的心理特征，提倡学生的自主性。小学阶段充分地给予儿童尊重。初高中阶段侧重于维护学生的自尊，家校、社会应共同关注个体的心理健康，建立协同育人的新育人格局。35.。"}]}],"id":"柯虎7-34"},{"num":35,"title":"35 德育问题·高频","subject":"教原","blocks":[{"t":"（1）上述案例反映了德育中的什么问题？","items":[{"t":"虽然学生在课堂上能够正确回答老师的问题","d":"正确回答老师的问题，并且在讨论中能够找出符合道德规范的答案，但在实际生活中，他们并没有将这些道德知识付诸实践。例如，学生在回答分享梨的问题时表现出慷慨精神，但在实际生活中却为争抢皮球而吵架；学生在讨论教室用电问题时能够发现错误，但在实际生活中却没有意识到教室里不需要开灯。这反映出学生在道德教育中存在认知和行为脱节的问题。（2）材料中教师主要运用了说服教育法对学生进行道德教育，主要培养了学生的道德认知。在实际德育过程中还应运用实践锻炼、情感陶冶、品德评价等方法帮助学生将道德认知转化为道德行为。①实践锻炼法是有目的、有计划地组织学生参加各种实践活动，以培养他们形成良好品德、良好行为习惯的德育方法。"}]},{"t":"（2）结合德育方法，谈谈如何尽量避免上述问题的出现？","items":[{"t":"在实际德育过程中还应运用实践锻炼","d":"运用实践锻炼、情感陶冶、品德评价等方法帮助学生将道德认知转化为道德行为。①。"},{"t":"实践锻炼法是有目的、有计划地组织学生参加各种实践活动","d":"有计划地组织学生参加各种实践活动，以培养他们形成良好品德、良好行为习惯的德育方法。教师可以向学生布置具体的任务，在过程中适当指导，调动学生的主动性和积极性，帮助学生形成良好的行为习惯。②。"},{"t":"情感陶冶法是通过创设良好的环境","d":"良好的环境，对学生进行积极感化和熏陶，潜移默化地培养学生品德的德育方法。教师可以创设良好的情景，引导学生积极参与情境创设，帮助学生树立正确的道德情感。③。"},{"t":"品德评价法是根据德育目标的要求","d":"目标的要求，对学生的品德水平给予肯定或否定的评价，以促进学生发扬优点、克服缺点，逐步培养其良好品德的德育方法。教师可以根据学生的日常行为表现设置奖赏制度，激励学生将道德认知转化为实际的道德行为。④。"},{"t":"榜样示范法是以他人的高尚思想","d":"高尚思想、模范行为和卓越成就来影响和引导学生以培养其良好品德的德育方法。教师可通过设置“进步之星”“模范之星”的方式，为学生树立榜样，引导学生用榜样提高自身修养。36.。"}]}],"id":"柯虎7-35"},{"num":36,"title":"36 《教育心理学》的道德行为发展理论·中频","subject":"教心","blocks":[{"t":"班杜拉提出观察学习的理论","items":[{"t":"材料可见，平平通过母亲的教导，得知了抢夺别人的东西是不对的","d":"亲的教导，得知了抢夺别人的东西是不对的。然后在下一次见到丽丽吃石榴时，他也就没有做出任何行为。但是通过观察丽丽的母亲呈现出的亲社会行为（分享），从而产生了这一经验，而这一经验又反过来影响了他之后的行为，所以产生了后面将自己存的零花钱买了玩具，捐给福利院的小朋友这一事件。这说明他已经习得了“分享”这一概念。（2）皮亚杰的道德认知发展理论认为儿童的道德发展分为无律、他律、自律三个阶段。在无律道德阶段，年幼的儿童对引起事情的原因只有模糊的了解，他们的行为直接受行为的结果所支配，因而这个年龄阶段的儿童既不是道德的，也不是非道德的。平平在看到乐乐玩玩具时直接抢过来玩，说明此年龄阶段的儿童无法判断自己行为。"}]}],"id":"柯虎7-36"}],"id":"柯虎7"},{"id":"紫薯1","name":"紫薯1","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 新文化运动的教育变革","subject":"中教史","blocks":[{"t":"教育观念的变革","items":[{"t":"个性化：强调个人价值，主张人人都有受教育机会","d":"强调个人价值，主张人人都有接受教育的机会；要求在教育中尊重个人，“以儿童为中心”；发挥每个人的长处，替社会做最有效率的事业；学校教育忌“随便教育”，教师要因材施教，学生要主动学习。②教育的。"},{"t":"平民化：坚持庶民方向，打破贵贱上下与劳心劳力的阶级教育","d":"教育必须坚持“庶民”方向，打破以往社会有贵贱上下、劳心与劳力、治人与被治种种差别的阶级教育；既然以平民为教育对象，这种教育就不应限于学校范围，无论是形式还是内容都要考虑其生产、生活和环境改造的需要。③教育的。"},{"t":"实用化：注重生活能力培养，解决生计问题，学校与社会相联系","d":"一方面，教育要注重对个人生活能力的培养，解决生计问题，促进社会生产的发展；另一方面，学校内部必须进行全面改革，强调教育与生活、学校与社会相联系。④教育的。"},{"t":"科学化：崇尚科学知识、科学方法与科学精神，三者相辅相成","d":"提倡学习科学的知识，追求科学的方法和坚持科学的精神。科学方法的运用重于科学知识的获得，而科学方法的运用又是为了科学精神的养成，三者是相辅相成的。（2）教育实践的变革。在新教育观念的指引下，新文化运动时期的教育实践也发生了深刻变革。①废除读经，恢复民国初年的教育宗旨。1916年，袁世凯倒台，其所颁布的教育纲要和教育要旨被撤销；1919年，教育部恢复了“养成健全人格，发展共和精神”的国民教育宗旨。②教育普及有所发展。在民主思想的推动下，平民教育呼声强烈，义务教育得到提倡，办学规模迅速扩大，学生数量迅速增加。中等教育在此时期也有所发展。③改革学校教学内容。在学校教育中大力推行白话文和国语；中等教育。"}]},{"t":"教育实践的变革","items":[{"t":"废除读经，恢复民国初年教育宗旨：1919年恢复国民教育宗旨","d":"年的教育宗旨。1916年，袁世凯倒台，其所颁布的教育纲要和教育要旨被撤销；1919年，教育部恢复了“养成健全人格，发展共和精神”的国民教育宗旨。②。"},{"t":"教育普及有所发展：提倡义务教育，办学规模与学生数量迅速增加","d":"在民主思想的推动下，平民教育呼声强烈，义务教育得到提倡，办学规模迅速扩大，学生数量迅速增加。中等教育在此时期也有所发展。③。"},{"t":"改革学校教学内容：推行白话文和国语，中等教育注意实用","d":"在学校教育中大力推行白话文和国语；中等教育开始注意“实用”，教学内容更加贴近社会实际需求。④。"},{"t":"改革师范教育和大学：筹划六大师范区，蔡元培改革北大","d":"1912年，教育部调整全国师范教育布局，筹划了六大师范区，于每区中心城市设一所高等师范学校。蔡元培对北大的改革是民国高等教育的一场革命，这场改革突破封建教育的束缚，高扬民主与科学精神，成为大学改革的先导和示范。先是北京专门以上学校纷纷仿效这一改革，其后全国各大学也逐渐参照北大制度推行改革。32.。"}]}],"id":"紫薯1-31"},{"num":32,"title":"32 中世纪大学的兴起与特征","subject":"外教史","blocks":[{"t":"中世纪大学的兴起","items":[{"t":"12世纪前后在西欧城市兴起的新型教育机构","d":"市兴起的新型教育机构，以意大利的萨莱诺大学和波隆那大学、法国的巴黎大学、英国的牛津大学和剑桥大学等为代表，是近代大学的直接源头。（1）中世纪大学的产生原因：①政治经济条件：西欧封建制度进入发展的鼎盛时期，王权日渐强固，社会趋于稳定，农业生产稳定上升，手工业逐渐成为专门的职业。②阶级条件：新兴的城市市民阶层成为推动社会向前发展的主要力量，他们提出了新的政治、经济和文化要求。③文化条件：战争使许多已经销声匿迹的古希腊、古罗马时期的经典著作重新被发现，加强了不同文化的交流。在这种情况下，传统的宫廷学校和骑士教育已经不能满足大众崇尚文化的需要，新的教育机构和形式开始出现。（2）中世纪大学的特征：①性质。"},{"t":"以萨莱诺、波隆那、巴黎、牛津和剑桥为代表，是近代大学直接源头","d":"大学、法国的巴黎大学、英国的牛津大学和剑桥大学等为代表，是近代大学的直接源头。"}]},{"t":"产生原因","items":[{"t":"政治经济条件：王权日渐强固，社会趋于稳定，手工业成为专门职业","d":"西欧封建制度进入发展的鼎盛时期，王权日渐强固，社会趋于稳定，农业生产稳定上升，手工业逐渐成为专门的职业。②。"},{"t":"阶级条件：新兴城市市民阶层提出新的政治、经济和文化要求","d":"新兴的城市市民阶层成为推动社会向前发展的主要力量，他们提出了新的政治、经济和文化要求。③。"},{"t":"文化条件：古希腊、古罗马经典著作重新被发现，加强文化交流","d":"战争使许多已经销声匿迹的古希腊、古罗马时期的经典著作重新被发现，加强了不同文化的交流。在这种情况下，传统的宫廷学校和骑士教育已经不能满足大众崇尚文化的需要，新的教育机构和形式开始出现。（2）中世纪大学的特征：①性质：一种自治的教授和学习中心。②目的：进行职业训练，培养社会所需要的专业人才。③体制：按领导体制可分为“学生”大学和“先生”大学两种。④课程：大学课程一开始并不固定，后趋向统一，应社会需要分文、法、神、医四科。⑤制度：已有学位制度，学生修毕大学课程，经考试合格，可得“硕士”“博士”学位。⑥教学方法：演讲和辩论。⑦享有的一些特权：大学自治，大学师生免税、免服兵役，大学有权设立特别法庭处。"}]},{"t":"性质与体制","items":[{"t":"性质：一种自治的教授和学习中心"},{"t":"目的：进行职业训练，培养社会所需要的专业人才","d":"进行职业训练，培养社会所需要的专业人才。③。"},{"t":"体制：按领导体制分为‘学生’大学和‘先生’大学两种","d":"按领导体制可分为“学生”大学和“先生”大学两种。④课程：大学课程一开始并不固定，后趋向统一，应社会需要分文、法、神、医四科。⑤制度：已有学位制度，学生修毕大学课程，经考试合格，可得“硕士”“博士”学位。⑥教学方法：演讲和辩论。⑦享有的一些特权：大学自治，大学师生免税、免服兵役，大学有权设立特别法庭处理大学师生与外人之间发生的诉讼，大学有集体迁移的自由、有颁发教师许可证的特权，等等。综上所述，中世纪大学是西欧社会经济、政治和文化发展到特定阶段的产物。它以培养专业人才为目标，以自治为核心特征，以分科课程和学位制度为基本框架，形成了近代高等教育制度的雏形。"}]},{"t":"课程、学位与教学","items":[{"t":"课程：应社会需要分文、法、神、医四科","d":"大学课程一开始并不固定，后趋向统一，应社会需要分文、法、神、医四科。⑤。"},{"t":"制度：已有学位制度，考试合格可得‘硕士’‘博士’学位","d":"已有学位制度，学生修毕大学课程，经考试合格，可得“硕士”“博士”学位。⑥。"},{"t":"教学方法：演讲和辩论","d":"演讲和辩论。⑦享有的一些特权：大学自治，大学师生免税、免服兵役，大学有权设立特别法庭处理大学师生与外人之间发生的诉讼，大学有集体迁移的自由、有颁发教师许可证的特权，等等。综上所述，中世纪大学是西欧社会经济、政治和文化发展到特定阶段的产物。它以培养专业人才为目标，以自治为核心特征，以分科课程和学位制度为基本框架，形成了近代高等教育制度的雏形。"}]},{"t":"享有的特权","items":[{"t":"大学自治，大学师生免税、免服兵役","d":"税、免服兵役，大学有权设立特别法庭处理大学师生与外人之间发生的诉讼，大学有集体迁移的自由、有颁发教师许可证的特权，等等。综上所述，中世纪大学是西欧社会经济、政治和文化发展到特定阶段的产物。它以培养专业人才为目标，以自治为核心特征，以分科课程和学位制度为基本框架，形成了近代高等教育制度的雏形。"},{"t":"设立特别法庭，处理大学师生与外人之间发生的诉讼","d":"处理大学师生与外人之间发生的诉讼，大学有集体迁移的自由、有颁发教师许可证的特权，等等。综上所述，中世纪大学是西欧社会经济、政治和文化发展到特定阶段的产物。它以培养专业人才为目标，以自治为核心特征，以分科课程和学位制度为基本框架，形成了近代高等教育制度的雏形。"},{"t":"有集体迁移的自由，享有颁发教师资格证的特权","d":"有颁发教师许可证的特权，等等。综上所述，中世纪大学是西欧社会经济、政治和文化发展到特定阶段的产物。它以培养专业人才为目标，以自治为核心特征，以分科课程和学位制度为基本框架，形成了近代高等教育制度的雏形。"}]}],"id":"紫薯1-32"},{"num":33,"title":"33 学校消亡论与AI时代教师角色","subject":"教原","blocks":[{"t":"‘学校消亡论’评析","items":[{"t":"合理之处：AI拓宽学习渠道，可替代部分基础性教学工作","d":"人工智能拓宽了学习者的学习渠道，在一定程度上可以替代知识讲授、作业批改等部分基础性教学工作，并催生了泛在学习、个性化学习等新型教育形态，客观反映了技术驱动教育变革的发展趋势。②学校的。"},{"t":"催生泛在学习、个性化学习等新型形态，反映技术驱动趋势"},{"t":"不可替代性：学校保障教育质量与公平，是学生社会化重要场所","d":"学校是有目的、有计划、有组织地培养人的专门机构，能够系统保障教育质量与教育公平；学校是学生社会化的重要场所，班级集体生活、同伴互动交往是学生健全人格发展的必要环节；学校还承担着立德树人、价值引领、品德培育的核心教育功能，这是人工智能技术无法替代的。（2）人工智能时代教师角色的“变”与“不变”：①“变”：人工智能可以辅助承担作业批改、学情统计等重复性教学事务，教师将从单纯的知识传授者转变为学习活动的设计者和引导者；教师需要熟练运用智能教育工具，将更多精力用于培养学生创新思维、批判性思维等高阶素养。②“不变”：教书育人的根本任务不变，立德树人始终是教师的主要职责；以情育人、以理服人的教育内核不变。"},{"t":"核心功能：承担立德树人、价值引领、品德培育，AI无法替代","d":"品德培育的核心教育功能，这是人工智能技术无法替代的。"}]},{"t":"教师角色的‘变’","items":[{"t":"AI承担作业批改、学情统计等重复性事务，教师转向学习设计者"},{"t":"教师需熟练运用智能教育工具，聚焦创新思维、批判性思维培养"}]},{"t":"教师角色的‘不变’","items":[{"t":"教书育人的根本任务不变，立德树人始终是教师的主要职责","d":"变，立德树人始终是教师的主要职责。"},{"t":"以情育人、以理服人的教育内核不变，情感关怀不可替代","d":"教育内核不变，情感关怀与价值引领是人工智能无法替代的；因材施教的基本原则不变，教师基于对学生的深入了解开展个性化指导，是单纯的数据统计难以实现的。（3）教师始终“在场”的原因：①教育本质的要求：教育是有目的地培养人的社会活动，其本质是人与人之间的精神交往与价值引导。人工智能不具备真实情感和自主价值判断能力，只能作为辅助工具，无法独立承担育人使命。②学生成长的需要：学生成长涵盖品德养成、心理发展和社会性发展。学生在面对成长过程中的困惑与价值选择时，需要教师依托专业经验和人文关怀给予针对性引导。③时代发展的需要：人工智能时代信息纷繁复杂、价值多元，学生更需要教师做好价值引领，帮助其树立正确的世界观。"},{"t":"因材施教原则不变，个性化指导难以由数据统计实现"}]},{"t":"教师始终‘在场’的原因","items":[{"t":"教育本质的要求：教育是人与人之间的精神交往与价值引导","d":"教育是有目的地培养人的社会活动，其本质是人与人之间的精神交往与价值引导。人工智能不具备真实情感和自主价值判断能力，只能作为辅助工具，无法独立承担育人使命。②。"},{"t":"学生成长的需要：品德养成、心理发展与社会性发展需针对性引导","d":"学生成长涵盖品德养成、心理发展和社会性发展。学生在面对成长过程中的困惑与价值选择时，需要教师依托专业经验和人文关怀给予针对性引导。③。"},{"t":"时代发展的需要：信息纷繁、价值多元，更需教师做好价值引领","d":"人工智能时代信息纷繁复杂、价值多元，学生更需要教师做好价值引领，帮助其树立正确的世界观、人生观、价值观，落实立德树人的根本任务。34.。"}]}],"id":"紫薯1-33"},{"num":34,"title":"34 儿童认知发展规律与教学启示","subject":"教心","blocks":[{"t":"前运算阶段（3~6岁）","items":[{"t":"思维具有不可逆性和刻板性，尚未获得守恒概念","d":"板性，该阶段儿童尚未获得守恒概念，因而处于前运算阶段。材料中，3～6岁的儿童仅依据水位高低这一单一维度做出判断，得出“细高杯子中的水更多”的结论，体现其不具备守恒概念。该阶段的主要特点有：a.开始能够运用表象、语言或较为抽象的符号来代表自己经历过的事物；b.。"},{"t":"能运用表象、语言或抽象符号代表自己经历过的事物"},{"t":"言语和概念快速发展，但概括性和一般性掌握不足","d":"但还不能很好地掌握概念的概括性和一般性；c.具有泛灵论倾向；d.出现集体独白现象；e.思维具有不可逆性、刻板性，存在自我中心主义（集中化），尚未获得守恒概念。②7岁以上儿童的思维具有可逆性，该阶段儿童获得了守恒概念，因而处于具体运算阶段。材料中，7岁以上的儿童能够同时关注杯子的高度和粗细两个维度，正确判断出水量没有发生改变，说明其已经掌握守恒概念。该阶段的主要特点有：a.可以进行逻辑思维，但仍需具体事物的支持；b.已能理解原则和规则，但在实际生活中只能刻板地遵守规则；c.思维具有可逆性、去自我中心主义（去集中化）；d.越来越以社会为中心，日益关注别人的看法。（2）该实验揭示了儿童认知发展的基本。"},{"t":"具有泛灵论倾向，出现集体独白现象","d":"d.出现集体独白现象；e.思维具有不可逆性、刻板性，存在自我中心主义（集中化），尚未获得守恒概念。"},{"t":"存在自我中心主义（集中化），思维刻板"}]},{"t":"具体运算阶段（7岁以上）","items":[{"t":"思维具有可逆性，已获得守恒概念","d":"该阶段儿童获得了守恒概念，因而处于具体运算阶段。材料中，7岁以上的儿童能够同时关注杯子的高度和粗细两个维度，正确判断出水量没有发生改变，说明其已经掌握守恒概念。该阶段的主要特点有：a.可以进行逻辑思维，但仍需具体事物的支持；b.已能理解原则和规则，但在实际生活中只能刻板地遵守规则；c.思维具有可逆性、去自我中心主义（去集中化）；d.越来越以社会为中心，日益关注别人的看法。"},{"t":"可进行逻辑思维，但仍需具体事物的支持","d":"b.已能理解原则和规则，但在实际生活中只能刻板地遵守规则；c.思维具有可逆性、去自我中心主义（去集中化）；d.越来越以社会为中心，日益关注别人的看法。"},{"t":"能理解原则和规则，但在实际生活中只能刻板遵守","d":"在实际生活中只能刻板地遵守规则；c.思维具有可逆性、去自我中心主义（去集中化）；d.。"},{"t":"思维具有可逆性，去自我中心主义（去集中化）","d":"该阶段儿童获得了守恒概念，因而处于具体运算阶段。材料中，7岁以上的儿童能够同时关注杯子的高度和粗细两个维度，正确判断出水量没有发生改变，说明其已经掌握守恒概念。该阶段的主要特点有：a.可以进行逻辑思维，但仍需具体事物的支持；b.已能理解原则和规则，但在实际生活中只能刻板地遵守规则；c.思维具有可逆性、去自我中心主义（去集中化）；d.越来越以社会为中心，日益关注别人的看法。"},{"t":"越来越以社会为中心，日益关注别人的看法","d":"日益关注别人的看法。（2）该实验揭示了儿童认知发展的基本规律，结合皮亚杰同化、顺应、平衡化的认知建构机制可得出以下启示：①教学应当遵循儿童认知发展的阶段性规律，切忌超前施教。前运算阶段的儿童尚未掌握守恒概念、难以理解抽象逻辑，教学应采用实物、模型等直观教学手段，避免生硬灌输抽象知识；进入具体运算阶段后，学生可依托具体事物开展逻辑学习与思维训练，促进认知循序渐进发展。教师需根据学生所处的认知发展阶段，匹配适宜的教学内容与教学方法，开展与学生认知水平相适配的教学。②依托同化与顺应机制，引导学生主动建构认知结构。同化是将新信息纳入已有认知结构，顺应是调整原有认知结构以适配新情境，二者是学生建构认知结。"}]},{"t":"对教学的启示","items":[{"t":"遵循儿童认知发展的阶段性规律，切忌超前施教","d":"段性规律，切忌超前施教。前运算阶段的儿童尚未掌握守恒概念、难以理解抽象逻辑，教学应采用实物、模型等直观教学手段，避免生硬灌输抽象知识；进入具体运算阶段后，学生可依托具体事物开展逻辑学习与思维训练，促进认知循序渐进发展。教师需根据学生所处的认知发展阶段，匹配适宜的教学内容与教学方法，开展与学生认知水平相适配的教学。②。"},{"t":"依托同化与顺应机制，引导学生主动建构认知结构","d":"引导学生主动建构认知结构。同化是将新信息纳入已有认知结构，顺应是调整原有认知结构以适配新情境，二者是学生建构认知结构的两种方式。教学应立足学生已有生活经验，设计动手操作类探究任务，引导学生在实践中完成认知的同化或顺应，主动建立守恒、分类等核心概念。③。"},{"t":"创设认知冲突情境，通过平衡化推动认知发展","d":"过平衡化推动认知发展。平衡化是认知发展的内在动力。当已有认知无法解释新现象时，个体会产生认知不平衡，进而推动认知结构优化升级。在教学中，教师可参照守恒实验创设问题情境，引发学生的认知冲突，引导其主动思考、修正原有认知，实现认知水平的自主提升。35.。"}]}],"id":"紫薯1-34"},{"num":35,"title":"35 活动课程的特点与评价原则","subject":"教原","blocks":[{"t":"活动课程的主要特点","items":[{"t":"以直接经验为核心载体，通过实践活动获取直接经验","d":"活动课程强调通过实践活动获取直接经验，以弥补学科课程偏重间接知识传授的局限。案例中，该课程以校园科技节的真实活动筹备为载体，引导学生完整经历调研策划、组织准备、实践执行、反思总结的全过程，使学生在亲身参与中获得直接经验。②突出学生的主体性。活动课程主张以学生的活动为中心，强调学生在学习过程中的主体地位。案例中，学生兼具设计者、组织者、参与者三重身份，自主主导活动全流程，分工协作完成方案设计、场地布置、活动运营等各项任务，充分发挥了主观能动性。③具有综合性与开放性。活动课程打破学科壁垒，强调知识的综合运用与开放探究。案例中，学生综合运用语文、数学、美术、信息技术等多学科知识解决实际问题，在真实。"},{"t":"突出学生的主体性，学生自主主导活动全流程","d":"活动课程主张以学生的活动为中心，强调学生在学习过程中的主体地位。案例中，学生兼具设计者、组织者、参与者三重身份，自主主导活动全流程，分工协作完成方案设计、场地布置、活动运营等各项任务，充分发挥了主观能动性。"},{"t":"具有综合性与开放性，打破学科壁垒，强调知识综合运用","d":"活动课程打破学科壁垒，强调知识的综合运用与开放探究。案例中，学生综合运用语文、数学、美术、信息技术等多学科知识解决实际问题，在真实的问题解决中激发自身的探究意识与创新思维。"},{"t":"聚焦实践能力的培养，在真实情境中提升解决问题能力","d":"活动课程注重在真实情境中提升学生解决实际问题的能力。案例中，该课程立足真实的校园活动场景，让学生在方案设计、场地布置、活动运营等实践过程中同步提升问题解决能力、协作能力，增强责任意识，最终实现价值体认、责任担当、问题解决、创意物化的育人目标。"}]},{"t":"直接经验与间接经验相统一","items":[{"t":"教学以间接经验为主，为实践提供理论支撑","d":"该课程要求学生综合运用已学的多学科知识来解决实际问题，为实践提供理论支撑，有效避免了活动因脱离知识体系而沦为无意义的玩乐。"},{"t":"教学以直接经验为辅，抽象知识需依托实践体验才能真正理解","d":"抽象的书本知识需要依托实践体验才能真正被学生理解和掌握。该课程以校园科技节的真实活动筹备为载体，引导学生完整经历调研策划、组织准备、实践执行、反思总结的全过程，使学生在实践中将知识转化为解决问题的能力，深化了对知识的理解。"},{"t":"将学科知识与实践活动有机结合，实现二者互补统一","d":"有机结合，实现了间接经验与直接经验的互补统一，有效避免了理论与实践相脱节。（3）实施该课程应遵循如下评价原则：①发展性评价原则。发展性评价以促进学生全面发展为核心目的，弱化甄别选拔功能，聚焦学生在活动中的成长与进步，充分发挥评价的激励与引导作用。案例中，该课程旨在实现价值体认、责任担当、问题解决、创意物化的综合育人目标，契合发展性评价关注学生综合素养提升的导向。②过程性评价原则。过程性评价强调覆盖活动全流程，既关注最终成果，也重视学生在过程中的参与度、协作表现与思维成长。案例中，该课程引导学生完整经历调研策划、组织准备、实践执行、反思总结的全过程，因此评价应当贯穿活动始终，以全面反映学生在各环。"}]},{"t":"实施该课程的评价原则","items":[{"t":"发展性评价原则：以促进学生全面发展为核心目的","d":"发展性评价以促进学生全面发展为核心目的，弱化甄别选拔功能，聚焦学生在活动中的成长与进步，充分发挥评价的激励与引导作用。案例中，该课程旨在实现价值体认、责任担当、问题解决、创意物化的综合育人目标，契合发展性评价关注学生综合素养提升的导向。②。"},{"t":"过程性评价原则：覆盖活动全流程，关注参与度与思维成长","d":"过程性评价强调覆盖活动全流程，既关注最终成果，也重视学生在过程中的参与度、协作表现与思维成长。案例中，该课程引导学生完整经历调研策划、组织准备、实践执行、反思总结的全过程，因此评价应当贯穿活动始终，以全面反映学生在各环节的实践表现与能力发展。③。"},{"t":"多元化评价原则：学生自评、组内互评、教师评价相结合","d":"多元化评价主张采用学生自评、组内互评、教师评价等多种评价方式，结合质性描述与量化记录，全面评估学生的综合素养发展。案例中，学生兼具设计者、组织者、参与者三重身份，分工协作完成各项任务，对此评价应综合多方视角，全面衡量学生的责任担当、协作能力与创意物化水平。36.。"}]}],"id":"紫薯1-35"},{"num":36,"title":"36 创造性培养的教学策略","subject":"教心","blocks":[{"t":"教学行为的积极价值","items":[{"t":"营造安全、包容的课堂心理环境，消除创造性表达的心理顾虑","d":"教师并未否定“方苹果”这一非常规创作，而是耐心倾听学生对创意的阐述。此举避免了学生因标新立异遭受批评，消除了学生进行创造性表达的心理顾虑。"},{"t":"保护并强化学生的创造动机，通过激励性评价激发创新意愿"},{"t":"尊重学生的个性化思维成果，不设标准答案","d":"成果。教师创设“苹果园”展示区，接纳学生形态各异的苹果作品，不设标准答案，认可学生的差异化表达，为学生创造性思维的发展提供了充足空间。（2）教师在课堂教学中有效培养学生的创造性，可以从以下方面着手：①创设支持创造性发展的课堂环境。教师应构建宽松、民主、包容的课堂氛围，不轻易否定学生的非常规想法，消除学生怕出错的心理顾虑。案例中，教师不仅没有批评“方形苹果”这一非常规画法，反而主动追问学生这样画的原因，体现了教师对学生独特想法的接纳与尊重。同时，教师应给予学生自主探索的空间，减少统一标准的束缚，鼓励多元表达，正如案例中的教师让学生自由创作并展示所有作品，为创造性思维的萌发提供了安全、开放的环境。"}]},{"t":"有效培养创造性的途径","items":[{"t":"创设支持创造性发展的课堂环境：宽松、民主、包容","d":"课堂环境。教师应构建宽松、民主、包容的课堂氛围，不轻易否定学生的非常规想法，消除学生怕出错的心理顾虑。案例中，教师不仅没有批评“方形苹果”这一非常规画法，反而主动追问学生这样画的原因，体现了教师对学生独特想法的接纳与尊重。同时，教师应给予学生自主探索的空间，减少统一标准的束缚，鼓励多元表达，正如案例中的教师让学生自由创作并展示所有作品，为创造性思维的萌发提供了安全、开放的环境。②。"},{"t":"培养学生的创造性个性品质：保护好奇心与求知欲，鼓励独立思考","d":"品质。教师首先要保护学生的好奇心与求知欲，对于学生的奇思妙想给予及时、正向的反馈，以激发其内在创造动力。案例中，教师听完男孩的解释后给予肯定和鼓励，正是对其创新动机的强化。其次，教师要鼓励学生独立思考、发扬创新精神，尊重学生的个性化见解，避免用标准化答案限制学生的思维。最重要的是，教师要引导学生将想象与生活经验相结合，培养学生将创意转化为实际价值的意识。案例中的男孩正是基于“苹果易滚落、装箱占空间”的生活痛点，才萌生了“方苹果”的创意，这种从生活中发现问题的能力正是创造性思维的重要源泉。③。"},{"t":"教授创造性思维训练策略：发散思维、头脑风暴、探究式学习","d":"略。教师可通过多种方法系统训练学生的创造性思维：一是开展发散思维训练，引导学生突破常规，从多角度、多方向思考问题，寻求多种可能的解决方案；二是运用头脑风暴法等集体讨论形式，激发观点碰撞，集思广益，在交流中拓展思路；三是结合真实问题开展探究式学习，引导学生运用创意解决实际问题，在实践中提升学生的创造性思维。"}]}],"id":"紫薯1-36"}]},{"id":"紫薯2","name":"紫薯2","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 《学记》的教育贡献","subject":"中教史","blocks":[{"t":"教育管理方面的贡献","items":[{"t":"重视大学开学和入学教育：天子率百官亲临学宫，定期视察学宫","d":"育。开学这天，天子率百官亲临学宫，参加开学典礼，祭祀“先圣先师”。天子还定期视察学宫，体现国家对教育的重视。②。"},{"t":"重视学业的训诫仪式：使学生明确‘为日后从政而学习’的目的","d":"为了使学生明确“为日后从政而学习”的目的，学校设立了一系列学业训诫仪式。③。"},{"t":"重视考核：每隔一年考查一次，内容包括学业成绩和道德品行","d":"学习过程中，规定每隔一年考查一次，以表示这一阶段学业的完成。考查常由主管学校的官员亲临主持。考查内容包括学业成绩和道德品行，不同的年级有不同的要求。（2）在教学论方面的贡献。①《学记》总结出一系列系统而深刻的教育教学原则。在启发诱导原则方面，它提出“道而弗牵，强而弗抑，开而弗达”，倡导启发学生自主思考，避免强制灌输。同时，它系统概括了预防性原则、及时施教原则、循序渐进原则、学习观摩原则、长善救失原则、藏息相辅原则。这些教育教学原则源自先秦教育实践，揭示了教学的普遍规律，对今天的教学活动仍有重要的借鉴价值。②《学记》对讲解法、问答法、练习法等教学方法做出了精当阐述。书中点明各类教学方法的运用要。"}]},{"t":"教育教学原则","items":[{"t":"启发诱导：‘道而弗牵，强而弗抑，开而弗达’，倡导自主思考","d":"原则方面，它提出“道而弗牵，强而弗抑，开而弗达”，倡导启发学生自主思考，避免强制灌输。同时，它系统概括了预防性原则、及时施教原则、循序渐进原则、学习观摩原则、长善救失原则、藏息相辅原则。这些教育教学原则源自先秦教育实践，揭示了教学的普遍规律，对今天的教学活动仍有重要的借鉴价值。②《学记》对讲解法、问答法、练习法等教学方法做出了精当阐述。书中点明各类教学方法的运用要点，提醒教师要结合学生情况灵活施教，切忌机械固化地开展教学。这些教学方法契合教学规律，经过长期实践检验并沿用至今，可见《学记》具有十分重要的价值。32.。"},{"t":"系统概括预防性、及时施教、循序渐进、学习观摩等原则","d":"原则、循序渐进原则、学习观摩原则、长善救失原则、藏息相辅原则。这些教育教学原则源自先秦教育实践，揭示了教学的普遍规律，对今天的教学活动仍有重要的借鉴价值。"},{"t":"长善救失、藏息相辅，揭示教学的普遍规律","d":"原则、藏息相辅原则。这些教育教学原则源自先秦教育实践，揭示了教学的普遍规律，对今天的教学活动仍有重要的借鉴价值。"}]},{"t":"教学方法的阐述","items":[{"t":"对讲解法、问答法、练习法等做出精当阐述","d":"习法等教学方法做出了精当阐述。书中点明各类教学方法的运用要点，提醒教师要结合学生情况灵活施教，切忌机械固化地开展教学。这些教学方法契合教学规律，经过长期实践检验并沿用至今，可见《学记》具有十分重要的价值。32.。"},{"t":"提醒教师结合学生情况灵活施教，切忌机械固化","d":"地开展教学。这些教学方法契合教学规律，经过长期实践检验并沿用至今，可见《学记》具有十分重要的价值。【答案要点】20世纪30年代欧美新传统教育派教育思潮主要包括要素主义教育、永恒主义教育和新托马斯主义教育。"}]}],"id":"紫薯2-31"},{"num":32,"title":"32 新传统教育派教育思潮","subject":"外教史","blocks":[{"t":"要素主义教育","items":[{"t":"1938年《要素主义者促进美国教育的纲领》发表，代表人物巴格莱"},{"t":"课程核心是人类文化遗产的共同要素，教材按知识逻辑系统编写"},{"t":"教学过程是严格的训练智慧的过程，学生必须刻苦和专心"},{"t":"教师应是整个教育过程中的权威人物"}]},{"t":"永恒主义教育","items":[{"t":"提倡复古，代表人物赫钦斯、艾德勒、利文斯通、阿兰","d":"的教育理论，其代表人物为美国的赫钦斯、艾德勒，英国的利文斯通和法国的阿兰。主要观点：教育的性质是永恒不变的；教育的主要目的是培养永恒的理性；永恒的古典学科应该在学校课程中占有中心地位；学生通过教师的教学进行学习；倡导实施全民的自由教育。"},{"t":"教育的性质永恒不变，主要目的是培养永恒的理性","d":"永恒的古典学科应该在学校课程中占有中心地位；学生通过教师的教学进行学习；倡导实施全民的自由教育。"},{"t":"永恒的古典学科应在学校课程中占中心地位","d":"该在学校课程中占有中心地位；学生通过教师的教学进行学习；倡导实施全民的自由教育。"},{"t":"倡导实施全民的自由教育","d":"育。③新托马斯主义教育。新托马斯主义教育是一种提倡宗教教育的理论，20世纪30年代产生于意大利、法国等国家，第二次世界大战后也曾在美国流行，其代表人物为法国神学家、教育家马利坦。主要观点：教育应以宗教为基础；教育的目的是培养真正的基督教徒和有用的公民；学校课程应以基督教精神为基础；教育应处在教会的严密控制之下。（2）新传统教育派教育思潮的影响。①要素主义教育的影响。要素主义教育对美国20世纪50—60年代的教育改革产生了重要影响；要素主义教育家提出的教育主张和观点受到政府重视，有些被采纳为国家的教育政策。但是，要素主义教育存在较少考虑学生的个别差异和能力水平、忽视学生的动机和情感、所编教材脱离。"}]},{"t":"新托马斯主义教育","items":[{"t":"提倡宗教教育，代表人物为法国神学家、教育家马利坦","d":"的理论，20世纪30年代产生于意大利、法国等国家，第二次世界大战后也曾在美国流行，其代表人物为法国神学家、教育家马利坦。主要观点：教育应以宗教为基础；教育的目的是培养真正的基督教徒和有用的公民；学校课程应以基督教精神为基础；教育应处在教会的严密控制之下。"},{"t":"教育应以宗教为基础，培养真正的基督教徒和有用的公民","d":"教育的目的是培养真正的基督教徒和有用的公民；学校课程应以基督教精神为基础；教育应处在教会的严密控制之下。"},{"t":"学校课程应以基督教精神为基础，教育处于教会控制之下","d":"神为基础；教育应处在教会的严密控制之下。（2）新传统教育派教育思潮的影响。①要素主义教育的影响。要素主义教育对美国20世纪50—60年代的教育改革产生了重要影响；要素主义教育家提出的教育主张和观点受到政府重视，有些被采纳为国家的教育政策。但是，要素主义教育存在较少考虑学生的个别差异和能力水平、忽视学生的动机和情感、所编教材脱离学校教育实际等问题，因而受到一些社会和教育人士的抨击。②永恒主义教育的影响。作为一种教育哲学思想，永恒主义教育在教育理论上有一定的影响，但在教育实践中的影响范围并不大，主要限于大学和上层知识界中的少数人。特别是它秉持复古态度，主张把学生的学习局限于古典著作，因此遭到许多人。"}]},{"t":"三种思潮的影响","items":[{"t":"要素主义影响美国20世纪50—60年代教育改革，主张被纳入政策"},{"t":"永恒主义在教育理论上有影响，实践影响限于大学和上层知识界"},{"t":"新托马斯主义曾在欧美教会学校产生影响，但存在内在矛盾"}]}],"id":"紫薯2-32"},{"num":33,"title":"33 立德树人与德育贯穿五育","subject":"教原","blocks":[{"t":"立德树人是根本任务的原因","items":[{"t":"遵循人才成长规律：德是首要、是方向，德行统领才干","d":"材料指出，德是首要、是方向，德行统领才干。育人重在立德，只有引导人明大德、守公德、严私德，方能使人尽其才、服务社会。②。"},{"t":"契合我国教育本质：坚持德育为先，坚守正确政治方向","d":"我国教育坚持以习近平新时代中国特
