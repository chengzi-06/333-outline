免习得性无助"}]}],"id":"紫薯5-34"},{"num":35,"title":"35 教学原则、评价与师生关系","subject":"教原","blocks":[{"t":"运用的教学原则","items":[{"t":"因材施教：针对基础差异设计分层任务，有的放矢、扬长避短","d":"原则：教师要从学生的实际情况和个性特点出发，有的放矢地进行差异化教学，使每个学生都能扬长避短，获得最佳发展。案例中，李老师针对学生学习基础差异设计分层任务，分别设置字词学习、段落分析、拓展创作三类学习要求，做到有的放矢，促使每位学生都能在自身原有水平上获得发展，体现了因材施教原则。"},{"t":"启发性：不直接讲答案，以问题链引导思考、组织分组讨论","d":"原则：教师要对学生进行启发，而不是告诉学生现成的答案，这有利于调动学生的主动性，促使学生在教师的引导下积极思考，自觉地掌握科学知识，提高分析问题和解决问题的能力。案例中，李老师很少直接讲解答案，而是通过一连串的问题引导学生思考，组织学生分组讨论，充分调动了学生的主动性，符合启发性原则的核心要求。"}]},{"t":"体现的教学评价类型","items":[{"t":"形成性评价：贯穿教学全程，即时反馈、优化学习","d":"贯穿教学全过程，核心是即时反馈、优化学习。案例中，李老师通过课堂点评、作文批改等方式，给予学生具体的修改建议，关注学生点滴进步，体现了形成性评价即时性、指导性与激励性的特点。"},{"t":"总结性评价：学期末全面评定学业成效，全面性、综合性","d":"在学期教学结束后实施，用于全面评定学生的学习成效。案例中，李老师撰写涵盖学业成绩、课堂表现、学习习惯、人际交往等多个维度的个性化评语，综合评判学生整体发展状况，体现了总结性评价全面性、综合性的特点。"}]},{"t":"新型良好师生关系","items":[{"t":"民主平等：尊重个体差异，不以统一标准要求所有学生","d":"尊师爱生、教学相长、心理相容的新型良好师生关系。"},{"t":"尊师爱生：耐心引导、正向激励，学生主动请教、彼此关爱"},{"t":"教学相长：设问启发助力成长，学生生活分享丰富教学素材","d":"李老师通过设问启发学生思考，助力学生成长；学生的真实生活分享为教学提供了丰富素材，师生在互动交流中相互促进、共同提升。"},{"t":"心理相容：关系融洽、彼此信任，情感上相互接纳、产生共鸣","d":"师生关系融洽，彼此信任。厌学学生在李老师正向评价的鼓舞下重拾学习兴趣，这体现出师生在情感上相互接纳、产生共鸣。【答案要点】（1）该案例体现了学习动机的强化理论、期望一价值理论（成就动机理论）、自我效能感理论和成败归因理论。"}]}],"id":"紫薯5-35"},{"num":36,"title":"36 学习动机理论与作用","subject":"教心","blocks":[{"t":"案例体现的学习动机理论","items":[{"t":"强化理论：正强化增强正确回答倾向，正向反馈减少挫败感","d":"期望一价值理论（成就动机理论）、自我效能感理论和成败归因理论。"},{"t":"期望—价值理论：按成就动机类型匹配任务难度与评分标准"},{"t":"自我效能感理论：替代性经验与言语说服提升自我效能感","d":"班杜拉认为，自我效能感是个体对自己能否成功完成某一行为的主观判断，其来源包括言语说服、替代性经验等。案例中，焦老师“向学生讲述与他们学习基础相近的学长学姐在学业上取得成就的经历”，为学生提供了可参照的替代性经验，增强学生“学长学姐能做到，我也能做到”的信念；同时通过课堂上的及时鼓励与耐心引导，以言语说服的方式提升学生的自我效能感。"},{"t":"成败归因理论：成功归因于努力，失败归因于策略不当等","d":"个体对成败的归因方式会直接影响其后续的情绪与行为动机。案例中，焦老师“注重引导学生对自身学业成败进行正确归因，帮助学生形成积极的自我认知”，引导学生将成功更多归因于努力这类可控因素，将失败归因于策略不当、努力不足等可调节因素，尽量避免将失败归因于能力不足，从而帮助学生保持积极的学习心态，避免习得性无助。"}]},{"t":"学习动机的含义与作用","items":[{"t":"含义：引起和维持学习活动、朝向学习目标的内部心理状态"},{"t":"引发作用：学习需要引发内驱力，唤起激动状态与学习行为","d":"当学生对某些知识或技能产生迫切的学习需要时，就会引发学习内驱力，唤起内部的激动状态，产生焦急、渴求等心理体验，并最终引发一定的学习行为。"},{"t":"定向作用：以学习需要和期待为出发点，指向一定学习目标","d":"学习动机以学习需要和学习期待为出发点，使学生的学习行为在初始状态时就指向一定的学习目标，并推动学生为达到这一目标而努力。"},{"t":"维持作用：动机水平高者能持久坚持，低者缺乏稳定性","d":"学习动机水平高的学生能在长时间的学习活动中保持认真的态度和坚持完成学习任务的毅力，而学习动机水平低的学生则缺乏学习行为的稳定性和持久性。"},{"t":"调节作用：调节学习行为的强度、时间和方向","d":"学习动机调节学习行为的强度、时间和方向。如果行为活动未达到既定目标，学习动机还将驱使学生转换行为活动方向以达到既定目标。"}]}],"id":"紫薯5-36"}]},{"id":"紫薯6","name":"紫薯6","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 宋代书院的特点","subject":"中教史","blocks":[{"t":"书院概况","items":[{"t":"中国古代特有的教育组织形式，形成和兴盛于宋代","d":"宋代书院提倡自由讲学，在功能上集教学、研究、藏书及祭祀于一身，成为独立于官学与私学之外的重要教育机构。它在教学与管理层面形成了独具特色的制度，具体论述如下：。"},{"t":"提倡自由讲学，集教学、研究、藏书及祭祀于一身","d":"在功能上集教学、研究、藏书及祭祀于一身，成为独立于官学与私学之外的重要教育机构。它在教学与管理层面形成了独具特色的制度，具体论述如下：。"},{"t":"独立于官学与私学之外的重要教育机构","d":"之外的重要教育机构。它在教学与管理层面形成了独具特色的制度，具体论述如下：。"}]},{"t":"教学层面的基本特点","items":[{"t":"明确培养实用人才的教学目的，培养博学多闻、胸怀天下之人","d":"书院旨在培养博学多闻、有道德、有理想、胸怀天下的实用人才。"},{"t":"教学内容以儒家经典为主，兼采理学家著作作为教材","d":"书院主要传授儒家所宣扬的人伦道德之道和治国安邦之术，大多选用儒家经典和理学家的著作作为教材。"},{"t":"教学与研究相结合，逐步形成讲会制度","d":"的教学组织形式。书院将教学与学术研究紧密结合，逐步形成了讲会制度，该制度与近代的学会相似。"},{"t":"教学方法注重集中讲授与自学讨论相结合","d":"讲授与自学讨论相结合。书院的课堂教学以集中讲授为主，同时高度重视学生的自学与讨论。"},{"t":"师生关系融洽、平等，倡导自由平等的交往","d":"平等。书院内部师生关系融洽，倡导师生之间自由平等的交往。"}]},{"t":"管理层面的基本特点","items":[{"t":"实行山长负责制，山长（洞主）全面负责组织管理与教学","d":"书院的主持者称为山长或洞主，全面负责书院的组织管理与教育教学工作。"},{"t":"生徒来源广泛且有选拔机制，以官学私学各级学生为主","d":"生徒以官学、私学各级学校的学生为主，其中的优秀者可通过考试选拔进入书院学习。"},{"t":"制定明确学规，《白鹿洞书院揭示》为教学总方针"},{"t":"经费从自筹逐渐走向官助，出现官办与私办官助形式","d":"书院初期以自筹经费为主，之后逐渐出现了官办和私办官助等形式。官方资助主要有拨划学田、赠赐房屋等形式。"},{"t":"书院发展呈现官学化倾向，逐步成为科举的附庸","d":"自南宋起，书院出现官学化倾向，政府加强对书院的控制，书院陆续被纳入官学体系，逐步成为科举的附庸。【答案要点】赞科夫是苏联著名的心理学家和教育家，其发展性教学理论主要处理的是教育与人的发展关系问题。（0.5分）（1）教育目的：赞科夫认为“教学要在学生的一般发展上取得尽可能大的效果”，目的是促进学生“理想的一般发展”，这就是发展性教学的思想。"}]}],"id":"紫薯6-31"},{"num":32,"title":"32 赞科夫发展性教学理论","subject":"外教史","blocks":[{"t":"教育目的与一般发展","items":[{"t":"教学要在学生的一般发展上取得尽可能大的效果","d":"般发展上取得尽可能大的效果”，目的是促进学生“理想的一般发展”，这就是发展性教学的思想。"},{"t":"一般发展包括智力、道德情感、意志、身体发育等方面","d":"的发展、道德情感的发展、意志的发展、身体的发育等各个方面。"}]},{"t":"发展性教学的教学原则","items":[{"t":"以高难度进行教学：难度限定在最近发展区内","d":"的原则：这里的“难度”有两层含义，一是指学习材料有一定的难度，二是指学习内容需要经过学生的努力才能掌握，难度限定在最近发展区内。"},{"t":"以高速度进行教学：不断引导学生向前发展、启迪智慧","d":"的原则：教学要不断引导学生向前发展，不断启迪学生的智慧，使学生能深刻理解所学知识。速度的把握是根据是否能促进学生的一般发展来决定的。"},{"t":"理论知识起主导作用：掌握课程知识结构，融会贯通","d":"的原则：理论知识是指一门课程的知识结构，掌握课程的知识结构的目的是让学生能融会贯通所学知识，能举一反三。"},{"t":"使学生理解学习过程：掌握获得知识的方法与途径","d":"的原则：让学生通过自己的智力活动去探索获得知识的方法和途径，掌握学习过程的特点和规律。"},{"t":"使班上全体学生（包括最差学生）获得一般发展"}]},{"t":"评价","items":[{"t":"首创苏联发展性教学的第一例完整体系，揭示因果联系"},{"t":"把新体系与传统教学论截然对立、以革新派自居，做法欠妥"}]}],"id":"紫薯6-32"},{"num":33,"title":"33 课程目标的功能与落实","subject":"教原","blocks":[{"t":"课程目标的基本功能","items":[{"t":"导向功能：为课程内容取舍、教学活动设计指明方向","d":"为课程内容取舍、教学活动设计指明方向。该校围绕三大课程目标开发特色课程、打造活力课堂，锚定育人方向，体现了导向功能。"},{"t":"调控功能：作为教学实施参照标准，及时调整策略与节奏","d":"作为教学实施的参照标准，可及时调整教学策略与节奏，保障育人过程不偏离核心目标。该校围绕课程目标融入“活力思维”育人框架，规范课程实施，体现了调控功能。"},{"t":"评价功能：检验课程实施效果，评判课程目标的达成度","d":"检验课程实施效果的核心标尺。该校通过学生通用核心素养及特色素养的发展情况，评判课程目标的达成度，体现了评价功能。"}]},{"t":"课程目标的设计依据","items":[{"t":"立足学习者成长需求：遵循身心发展规律，尊重个体差异","d":"满足学生个性化成长需求。该校围绕学生的成长需求设计课程，提出培养学生的生长力、绽放力与创新力，注重培养学生的个性素养，致力于让每个孩子都能发挥自身优势、绽放独有光彩，充分体现了对学生个体差异与发展需求的尊重与回应。"},{"t":"顺应社会发展时代要求：兼顾通用核心素养与特色素养"},{"t":"契合学科知识育人逻辑：以学科知识体系为载体","d":"发挥学科育人价值。该校课程目标不仅覆盖文化基础等通用核心素养，夯实学生的学科根基，还通过特色课程、活力课堂，将知识学习延伸至能力拓展与品格涵养层面，实现知识学习与育人目标的有机统一。"}]},{"t":"落实课程目标的路径","items":[{"t":"细化目标层级，将课程目标转化为可操作的教学目标","d":"将课程目标转化为可操作的教学目标。依据新课改的要求，教师要将该校“培养学生的生长力、绽放力与创新力”的课程总目标，拆解为单元目标与课时教学目标，把“活力思维”育人框架融入日常教学设计，结合学情分层落实，使宏观的课程目标转化为具体可落地的课堂教学要求。"},{"t":"转变教学方式，创设自主、合作、探究的学习情境","d":"践行新课改育人理念。教师应创设自主、合作、探究的学习情境，打造活力课堂，在知识传授的同时，兼顾学生通用核心素养和特色素养的培育，实现知识学习与素养培育的统一。"},{"t":"优化教学评价，实施过程性评价与多元化评价","d":"方式，发挥评价的导向与激励功能。遵循新课改发展性评价理念，以课程目标为评价依据，实施过程性评价与多元化评价，既关注学生的学习结果，也重视学生的成长过程，全面衡量学生素养发展水平，坚持以评促教，保障课程目标有效达成。【答案要点】（1）对该校做法的分析：元认知策略强调学习者对自己认知过程的计划、监控和调节能力，包括计划策略、监控策略、调节策略。该校实施的“学习成长手册”体现了上述三种策略的有效融合。"}]}],"id":"紫薯6-33"},{"num":34,"title":"34 元认知策略与培养方法","subject":"教心","blocks":[{"t":"元认知策略的含义","items":[{"t":"强调学习者对认知过程的计划、监控和调节能力","d":"包括计划策略、监控策略、调节策略。该校实施的“学习成长手册”体现了上述三种策略的有效融合。"},{"t":"包括计划策略、监控策略、调节策略三类，手册体现三者融合","d":"监控策略、调节策略。该校实施的“学习成长手册”体现了上述三种策略的有效融合。"}]},{"t":"三种策略的具体体现","items":[{"t":"计划策略：记录“我下周的学习计划”，设定目标与学习重点","d":"监控策略、调节策略。该校实施的“学习成长手册”体现了上述三种策略的有效融合。"},{"t":"监控策略：以“我掌握了什么”反思自检，识别已未掌握内容","d":"调节策略。该校实施的“学习成长手册”体现了上述三种策略的有效融合。"},{"t":"调节策略：依据反思结果调整学习计划，修正不合理方式","d":"该校实施的“学习成长手册”体现了上述三种策略的有效融合。"}]},{"t":"培养元认知能力的方法","items":[{"t":"强化元认知意识，丰富元认知知识","d":"丰富元认知知识。教师应向学生阐明元认知策略的意义和作用，如通过具体实例讲解“学习计划如何影响学习效果”“自我检测如何发现知识盲点”等，引发学生对自身学习过程的关注。"},{"t":"指导目标设定与计划制订，提供分阶段学习建议","d":"教师应引导学生制订具体、可操作的学习目标，并根据实际情况提供分阶段的学习建议，如利用阶段测验结果，引导学生反思学习进度，修订学习方案。"},{"t":"培养自我监控习惯：以学习日志、课堂回顾记录梳理"},{"t":"促进自我调节与自我评价：自我评价表、学习进展记录图","d":"教师可提供“自我评价表”或设计“学习进展记录图”，引导学生主动检查学习成效，识别自身不足并调整学习方式；也可组织开展同伴互评，进一步强化学生的反思意识与调节能力。【答案要点】（1）案例中小组合作学习流于形式的原因是违背了两条教学过程的基本规律：。"}]}],"id":"紫薯6-34"},{"num":35,"title":"35 小组合作学习与讨论法","subject":"教原","blocks":[{"t":"合作学习流于形式的原因","items":[{"t":"违背教师主导与学生主体相统一：缺乏分工指导与监控","d":"的规律。教学既要充分发挥学生的主观能动性，也不能忽视教师的组织、引导与调控。案例中，肖老师仅布置合作学习任务，却未对小组分工、讨论过程进行有效指导与监控，也未针对学生差异实施分层引导，导致教师主导作用发挥不足；学生因缺乏有效引导而参与动力不足，主体性未能充分发挥，引发相互推诿、参与不均等问题。"},{"t":"违背掌握知识与发展能力相统一：讨论偏离主题，无实效","d":"的规律。教学应在传授知识的同时发展学生的智力与综合能力。案例中，小组讨论偏离教学主题，汇报难以产出有效观点，既没有促成学生对知识的深度理解，也未能借助合作探究发展学生协作交流、问题探究的能力，使得小组合作学习徒有形式，没有实效。"}]},{"t":"运用讨论法的基本要求","items":[{"t":"讨论前充分准备：明确主题任务，合理分组分工"},{"t":"讨论中引导调控：巡视纠偏，避免少数优等生垄断发言","d":"案例中，肖老师全程缺位，直接导致学生参与度两极分化，讨论偏离教学主题。"},{"t":"讨论后总结提升：梳理讨论成果，深化对核心问题认知"}]},{"t":"优化学习方式的路径","items":[{"t":"锚定育人目标，杜绝形式主义，紧扣教学目标开展活动","d":"杜绝形式主义。以核心素养培育为导向设计学习任务，紧扣教学目标开展合作、探究活动，避免“为合作而合作”的表演式学习，破解案例中课堂气氛看似活跃却无实质性探究的问题。"},{"t":"融合多元学习方式：自主学习为基础、合作与探究为核心","d":"形成协同效应。以自主学习为基础、合作学习为载体、探究学习为核心，实现三者有机衔接、层层递进，而非孤立使用单一学习方式。开展合作交流前，要预留独立思考的时间，确保学生带着个人见解参与讨论，防止出现案例中学困生被动旁观、讨论缺乏深度等问题。"},{"t":"完善配套支撑：分组规则、任务分工与过程性评价机制","d":"保障实施成效。建立科学的分组规则、明确的任务分工以及多元化的过程性评价机制，为学习方式变革提供制度支撑，切实提升育人质量。【答案要点】（1）小雨最初的学习方式存在的问题：死记硬背，对知识缺乏意义理解；不善于建构知识结构；缺乏对知识的主动加工与应用，容易出现知识遗忘较快、知识迁移困难等问题。案例中，三种教学建议对应的学习策略及各学习策略的作用：。"}]}],"id":"紫薯6-35"},{"num":36,"title":"36 学习策略与学习效果","subject":"教心","blocks":[{"t":"原有学习方式的问题","items":[{"t":"死记硬背，对知识缺乏意义理解","d":"对知识缺乏意义理解；不善于建构知识结构；缺乏对知识的主动加工与应用，容易出现知识遗忘较快、知识迁移困难等问题。案例中，三种教学建议对应的学习策略及各学习策略的作用：。"},{"t":"不善于建构知识结构","d":"缺乏对知识的主动加工与应用，容易出现知识遗忘较快、知识迁移困难等问题。案例中，三种教学建议对应的学习策略及各学习策略的作用：。"},{"t":"缺乏对知识的主动加工与应用，遗忘快、迁移困难","d":"容易出现知识遗忘较快、知识迁移困难等问题。案例中，三种教学建议对应的学习策略及各学习策略的作用：。"}]},{"t":"三种学习策略及作用","items":[{"t":"复述策略：用自己的语言复述或向同学讲解，推动长时记忆","d":"班主任鼓励小雨用自己的语言复述重点内容或向同学讲解所学知识，属于复述策略的运用。该策略通过对学习材料进行重复加工，维持工作记忆中的信息，推动信息向长时记忆转化。"},{"t":"组织策略：借助图表、知识框架梳理笔记，提高提取效率","d":"班主任指导小雨借助图表、知识框架梳理笔记、厘清知识点关联，属于组织策略的运用。该策略通过对信息归类整合、建构知识结构，帮助学生厘清知识间内在关联，提高信息的提取效率。"},{"t":"精细加工策略：用类比法结合生活实例，促进深层理解","d":"班主任运用类比法，结合拉窗帘、爬坡等生活实例帮助小雨理解抽象概念，属于精细加工策略的运用。该策略通过将新学知识与个体已有经验建立联结，促进学生对概念的深层加工和理解。"}]},{"t":"学习策略的提升机制","items":[{"t":"优化认知编码，改善知识存储，减少遗忘","d":"改善知识存储。复述策略能强化信息在工作记忆中的加工，精细加工策略能在新旧知识之间建立联系，组织策略帮助建构知识网络。三种策略共同实现了对知识的深层意义编码，将信息更有效地转入长时记忆，从而提升记忆的牢固程度，减少遗忘，改变小雨机械记忆的学习方式。"},{"t":"提高知识的迁移能力与应用能力，摆脱情境依赖","d":"组织策略厘清概念之间的逻辑关系，精细加工策略借助生活实例理解抽象原理，帮助小雨更好地将抽象知识迁移到实际问题情境中，提高其解题的灵活性，摆脱题目情境发生变化便无从作答的困境。"}]}],"id":"紫薯6-36"}]},{"id":"紫薯7","name":"紫薯7","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 隋唐教育管理制度","subject":"中教史","blocks":[{"t":"改革背景","items":[{"t":"隋唐是我国封建社会高度繁荣的阶段"},{"t":"为加强对教育事业的统一管理，选拔符合统治阶级需求的人才","d":"隋唐两代在中央教育管理机构与官学内部管理制度方面进行了系统性的改革，建立了一套完备的教育管理机制，对后世产生了深远影响。具体论述如下：。"},{"t":"在中央教育管理机构与官学内部管理制度上进行系统性改革","d":"构与官学内部管理制度方面进行了系统性的改革，建立了一套完备的教育管理机制，对后世产生了深远影响。具体论述如下：。"}]},{"t":"中央教育管理机构的演变","items":[{"t":"隋文帝设国子寺，内设国子祭酒，首次设立专门管理教育的政府机构","d":"一人，总管教育事业。国子寺及国子祭酒的设置是我国历史上第一次设立专门管理教育的政府机构和设置专门教育行政长官的开始，标志着我国古代封建教育已经发展到了能独立于其他部门的时代，这在中国古代教育史上具有重大意义。"},{"t":"国子寺脱离太常寺独立发展并改称国子学，隋炀帝时改称国子监"},{"t":"唐初精简行政机构，国子学附设于太常寺，管理国子学、太学、四门学","d":"主要学习儒家经典，律学主要学习唐代律令。各类学校的课程均规定了修业期限。"},{"t":"贞观元年唐太宗令国子学脱离太常寺改称国子监，成为与太常寺平行的独立机构","d":"国子监既是中央政府教育行政机构，也是国家最高学府，它的设立标志着我国学校管理走向专门化。此后虽有改朝换代，但国子监仍然长期延续，直到清末学部成立为止。"},{"t":"国子监既是中央教育行政机构又是最高学府，标志学校管理走向专门化"}]},{"t":"入学与学礼制度","items":[{"t":"实行等级入学制度：贵族、官僚子弟享有优先入学特权；广文生不受年龄限制","d":"唐代中央官学实行等级入学制度，贵族、官僚子弟享有优先入学的特权。凡申请入国子监的学生，均有一定的年龄限制。唯有广文生不受年龄限制。"},{"t":"确立定期学礼制度：束脩之礼、国学释奠礼、贡士谒见及使者观礼","d":"主要包括束修之礼、国学释奠礼、贡士谒见及使者观礼。这类定期性的隆重礼仪活动对学生进行崇儒尊师、登科从政的教育，起到思想熏陶的作用。"},{"t":"学礼活动使学生受崇儒尊师、登科从政教育，起到思想熏陶作用"}]},{"t":"教学、考核与休假制度","items":[{"t":"设定各类学校教学制度：儒经与律令各有侧重，课程规定修业期限"},{"t":"建立系列化考核制度：旬试、月试、季试等，形成完整考试体系"},{"t":"严格执行惩罚制度：国子监主簿执行学规，惩罚不率师教、学业无成者","d":"国子监主簿负责执行学规，督促学生勤学，维护国子监的教学和生活秩序，对不率师教、学业无成、假违程限、作乐杂戏的学生予以惩罚。"},{"t":"制定合理休假制度：旬假、田假、授衣假，兼顾学生身心发展需求","d":"等常规假期。【答案要点】福禄培尔是19世纪德国著名的教育家、幼儿园的创立者、近代学前教育理论的奠基人，被誉为“幼儿教育之父”。蒙台梭利是20世纪意大利著名的幼儿教育家，创办了“儿童之家”，形成了著名的蒙台梭利教学法，推动了新教育运动及儿童教育运动的发展。两位幼儿教育家的教育思想既有相同点，也有不同点。"}]}],"id":"紫薯7-31"},{"num":32,"title":"32 福禄培尔与蒙台梭利","subject":"外教史","blocks":[{"t":"两位幼儿教育家","items":[{"t":"福禄培尔：19世纪德国教育家，幼儿园创立者，被誉为“幼儿教育之父”","d":"是19世纪德国著名的教育家、幼儿园的创立者、近代学前教育理论的奠基人，被誉为“幼儿教育之父”。蒙台梭利是20世纪意大利著名的幼儿教育家，创办了“儿童之家”，形成了著名的蒙台梭利教学法，推动了新教育运动及儿童教育运动的发展。两位幼儿教育家的教育思想既有相同点，也有不同点。"},{"t":"蒙台梭利：20世纪意大利幼儿教育家，创办“儿童之家”，形成蒙台梭利教学法","d":"是20世纪意大利著名的幼儿教育家，创办了“儿童之家”，形成了著名的蒙台梭利教学法，推动了新教育运动及儿童教育运动的发展。两位幼儿教育家的教育思想既有相同点，也有不同点。"}]},{"t":"相同点","items":[{"t":"在儿童地位上都反对传统教育对儿童身心的束缚和压迫，主张以儿童为本位"},{"t":"在理论与实践上都建立了幼儿教育理论体系和专门的幼儿教育机构"},{"t":"在影响上都对世界各国幼儿教育的发展产生了深远影响"}]},{"t":"不同点","items":[{"t":"教育方法：福禄培尔主张自我活动与游戏；蒙台梭利以“工作”结合“纪律”与“自由”","d":"尔关于幼儿园教育方法的基本原理是自我活动或自动性，他认为游戏是儿童内在本质向外的自发表现，强调应通过游戏来发展儿童的想象力和创造力；蒙台梭利主张让儿童通过“工作”的中介作用把“纪律”与“自由”有机地联系与统一起来。"},{"t":"组织形式：福禄培尔主张集体教学与集体游戏；蒙台梭利主张个别活动","d":"福禄培尔要求组织集体教学，进行集体游戏，让儿童通过社会参与复演家庭和邻里生活；蒙台梭利主张个别活动、单独学习。"},{"t":"教育内容：福禄培尔以活动与游戏为主的课程；蒙台梭利重感官训练与读写算","d":"尔建立了一个以活动和游戏为主要特征的幼儿园课程体系，包括游戏和歌谣、恩物、手工作业、运动游戏、自然研究等；蒙台梭利儿童教育的内容则包括感官训练，读、写、算的练习，以及实际生活训练。"},{"t":"教师作用：福禄培尔主张教师为引导者、组织者；蒙台梭利主张为观察者、指导者","d":"福禄培尔主张教师应该是儿童学习的引导者和组织者，通过讲解、演示和引导等方式，帮助儿童掌握知识和技能；蒙台梭利主张教师应该是儿童学习的观察者和指导者，为儿童提供有准备的环境，帮助儿童自主学习和发展。"}]}],"id":"紫薯7-32"},{"num":33,"title":"33 制度化教育与个体发展","subject":"教原","blocks":[{"t":"教育对个体的双重功能","items":[{"t":"正向个体功能：教育积极促进个体发展，学校制度化生活帮助儿童适应社会","d":"与负向个体功能，即教育对个体发展兼具促进与阻碍的双重作用。"},{"t":"负向个体功能：制度化教育割裂学习生活与本真生活，压抑儿童天性","d":"即教育对个体发展兼具促进与阻碍的双重作用。"}]},{"t":"功能性质的判定","items":[{"t":"对儿童天性的压抑属于非预期的负向隐性功能"},{"t":"个体社会化则属于教育的正向显性功能","d":"教育的正向显性功能。所以，回答负向隐性功能与正向显性功能均可酌情给分。）（2）制度化教育的优势与局限：制度化教育是指由专门的教育人员、机构及其运行机制所构成的教育形态。"}]},{"t":"制度化教育的优势与局限","items":[{"t":"制度化教育指由专门的教育人员、机构及其运行机制所构成的教育形态"},{"t":"优势：组织性与系统性较强，利于提高教学效率、保障教学质量"},{"t":"局限：高度制度化、规范化易压抑学生天性，造成儿童人格分裂","d":"规范化的教育容易压抑学生天性，弱化儿童的主体地位，造成儿童人格分裂，进而抑制其个性发展。"}]},{"t":"教育制度改进建议","items":[{"t":"尊重儿童主体地位与本真生活，避免制度对儿童生活强制改造"},{"t":"构建开放型教育系统，推动办学体制多样化，推行学分制、选课制","d":"推行学分制、选课制，给予学生更多自主选择空间，尊重学生个性发展，激发学生学习主动性。"},{"t":"兼顾制度化与非制度化教育，打通学校、家庭、社会教育壁垒，面向终身教育","d":"打通学校、家庭、社会教育之间的壁垒，吸收非制度化教育的优势，同时面向不同群体发展终身教育体系，以满足多元的教育需求。【答案要点】（1）骑自行车属于操作技能。操作技能的特点如下：。"}]}],"id":"紫薯7-33"},{"num":34,"title":"34 操作技能的形成与指导","subject":"教心","blocks":[{"t":"技能类型判定","items":[{"t":"骑自行车属于操作技能"},{"t":"指导与示范属于操作技能形成的认知阶段","d":"作技能形成的认知阶段，在该阶段，指导者需要帮助学习者理解操作技能，明确学习任务，形成作业期望，并获得一定的完成任务的学习策略。该阶段的教学要求如下：。"}]},{"t":"操作技能的特点","items":[{"t":"活动对象是物质的、具体的客体或肌肉，具有客观性"},{"t":"动作执行通过外显的肌肉运动实现，具有外显性"},{"t":"各动作不能合并、省略，必须完整展开，具有展开性"}]},{"t":"认知阶段及其教学要求","items":[{"t":"指导者需帮助学习者理解操作技能、明确学习任务、形成作业期望与学习策略","d":"形成作业期望，并获得一定的完成任务的学习策略。该阶段的教学要求如下：。"},{"t":"掌握相关知识：先讲解骑行安全知识与自行车构造，奠定知识基础"},{"t":"明确练习目的和要求：介绍日常通行路段路况，明了实际要求","d":"只有学习者明确所学技能的目的和要求，他们才能自觉地组织自己的行动来掌握这种技能。材料中，小林的父母向他介绍日常通行路段的路况，让小林明白现实骑行的实际要求，便于他更好地开展骑行练习。"},{"t":"形成正确的动作映象：父亲示范启动、平衡、转弯、停车等动作","d":"在学习者对所学的操作技能进行练习之前或在练习过程中，指导者应通过自己的动作示范帮助学习者在头脑中形成正确的动作映象。材料中，小林的父亲系统演示了启动车辆、维持身体平衡、转弯、停车等一系列骑行动作，帮助小林在头脑中形成骑行的正确动作映象。"},{"t":"获得一定的学习策略：边示范边讲解平衡技巧，掌握关键动作要领","d":"操作技能的学习也包含学习策略或者窍门问题。一旦学习者利用外加的策略有效地完成任务后，这些策略就会成为学习者的经验，并有可能自发地在后继学习中加以运用。材料中，小林的父亲边示范边讲解维持平衡的技巧，使小林掌握骑行的关键动作要领。【答案要点】（1）案例中课例设计的特点：。"}]}],"id":"紫薯7-34"},{"num":35,"title":"35 课例设计特点与教师素养","subject":"教原","blocks":[{"t":"课例设计的特点","items":[{"t":"生活性：课例贴近学生生活实际，依托已有生活经验开展教学","d":"（现实性）。案例中，数学教师的课例设计贴近学生的生活实际，依托学生已有的生活经验开展教学，体现了课例设计的生活性。"},{"t":"综合性：将数学知识与中华优秀传统文化、十二生肖文化相融合","d":"数学教师将数学知识与中华优秀传统文化相结合，将十二生肖文化有机融入数学课堂，体现了课例设计的综合性。"},{"t":"探究性：设计开放性问题，激发学生思考、探索与质疑","d":"数学教师设计的问题具有一定的开放性，能够激发学生思考、探索与质疑，体现了课例设计的探究性。"},{"t":"趣味性：营造轻松活跃的课堂氛围，调动学生学习兴趣","d":"数学教师的课例设计让教室变成了欢乐的海洋，营造出轻松活跃的课堂氛围，充分调动了学生的学习兴趣，体现了课例设计的趣味性。"}]},{"t":"教学方法：讨论法","items":[{"t":"讨论法是学生在教师指导下为解决某问题而探讨、评析，以明辨是非、获取真知","d":"获取真知、锻炼思维和培养独立思考能力的方法。案例中，数学教师设置根据属相推算年龄的问题，引发学生的积极思考。学生在课堂上相互质疑、争辩，在集体讨论中逐步深化对生肖与年龄关系的理解，充分体现了讨论法的运用。"},{"t":"案例中教师以属相推算年龄问题引发思考，学生相互质疑争辩、集体讨论深化理解"}]},{"t":"新时代教师应具备的素养","items":[{"t":"高尚的师德：热爱教育事业、关爱学生、严于律己","d":"教师要热爱教育事业、关爱学生、严于律己。案例中，数学教师留心观察学生学情，积极思考教学问题，主动优化教学设计，体现了其对教育事业的热情和对学生发展的关注。"},{"t":"宽厚的文化素养：广博的文化知识与深厚的学科底蕴","d":"教师应具备广博的文化知识和深厚的学科底蕴。案例中，数学教师为帮助学生真正理解生肖与年龄的关系，主动查阅大量生肖相关书籍，丰富自身知识储备，并将传统文化与数学教学有机融合，体现了宽厚的文化素养。"},{"t":"专门的教育素养：教育理论素养、教育能力素养、教育研究素养","d":"包括教育理论素养、教育能力素养、教育研究素养。案例中，数学教师善于发现学生的学习问题，发挥创造性，自主设计融合传统文化的开放性课例，组织课堂讨论，依靠扎实的教育能力开展教学，体现了良好的专门教育素养。【答案要点】（1）案例中体现的学习迁移类型：。"}]}],"id":"紫薯7-35"},{"num":36,"title":"36 学习迁移类型与促进","subject":"教心","blocks":[{"t":"案例体现的学习迁移类型","items":[{"t":"顺向迁移：先前学习对后继学习的影响，物理“平衡”概念影响化学、生物学习","d":"先前学习对后继学习产生的影响。案例中，学生先在物理课上学习了“平衡”的概念与共性逻辑，并以此为认知基础，影响了后续化学、生物等学科中有关平衡内容的学习，体现了顺向迁移。"},{"t":"正迁移：一种学习对另一种学习的积极促进作用，借平衡逻辑理解溶解平衡","d":"一种学习对另一种学习产生的积极促进作用。案例中，学生借助物理课习得的平衡逻辑，快速理解了化学溶解平衡、生物生态平衡的规律，以及运用平衡思路调节自身学习状态，体现了正迁移。"},{"t":"负迁移：一种学习对另一种学习的消极阻碍作用，机械套用静态思维造成认知偏差","d":"一种学习对另一种学习产生的消极阻碍作用。案例中，部分学生生硬套用物理的静态思维来理解道德与法治课中的供需平衡，造成认知偏差，体现了负迁移。"},{"t":"一般迁移：将习得的一般原理、思维方法迁移到其他具体学习情境","d":"将习得的一般原理、思维方法迁移到其他具体学习情境中。案例中，学生将物理课上提炼出的“平衡是多方制衡下的整体稳定”这一共性思考逻辑迁移至多学科学习与日常生活中，体现了一般迁移。"}]},{"t":"影响学习迁移的主要因素","items":[{"t":"学习材料的相似性：共同要素越多越易迁移，静态与动态平衡存在本质差异","d":"两种学习之间的共同要素越多，越容易产生迁移。物理、化学、生物中的“平衡”概念均围绕“稳定状态”展开，相似性较高，因此学生能顺利实现正迁移；而道德与法治中的供需平衡是动态变化的，与物理静态平衡存在本质差异，学生机械套用原有经验，从而产生了负迁移。"},{"t":"原有经验的概括水平：概括水平越高，迁移的适用范围越广","d":"个体对原有知识经验的概括水平越高，迁移的适用范围越广。物理教师引导学生提炼出“平衡是多方制衡下的整体稳定”的共性逻辑，提高了知识的概括程度，使学生能够将该逻辑迁移至多个学科的学习当中。"},{"t":"心理定势的作用：定势对学习迁移兼具促进与阻碍的双重作用","d":"定势对学习迁移兼具促进与阻碍的双重作用。学生形成的“平衡即静态对等”的思维定势，在理科同类概念的学习中可以加快理解速度，但将其套用到动态的供需平衡概念时，则会引发认知偏差。"},{"t":"教师的教学指导：清晰的教学引导能有效促进学习迁移","d":"清晰的教学引导能有效促进学习迁移。物理教师主动带领学生提炼共性思考逻辑，为学生的跨学科迁移搭建了支架，提升了迁移效果。"}]},{"t":"促进有效迁移的教学措施","items":[{"t":"整合学科内容：合理编排教学内容，关注学科间的横向关联与共通规律","d":"教师应合理编排教学内容，关注不同学科之间的横向关联，挖掘知识间的共通规律，引导学生将某一学科习得的知识与方法，迁移运用到其他学科的学习中。案例中，学生能将物理课习得的“平衡”逻辑，顺利迁移运用到化学、生物等同类概念的学习中，正是得益于学科间内容的有机整合。"},{"t":"加强新旧知识联系：通过课堂提问、适度引导，搭建新旧知识的联结桥梁","d":"教师应合理安排教学程序，通过课堂提问、适度引导等方式，帮助学生依托已有认知理解新知识，搭建新旧知识之间的联结桥梁，促进新旧知识之间的纵向迁移。案例中，学生在学习化学溶解平衡、生物生态平衡时，借助之前物理课所学知识快速理解内在规律。这一过程体现了新旧知识有效联系的重要性。"},{"t":"强调概括总结：启发学生自主概括原理，厘清概念内涵与适用边界","d":"教师应启发学生自主概括所学原理，结合具体实例厘清概念的内涵与适用边界，提升知识经验的概括水平，为广泛迁移奠定基础。案例中，物理教师引导学生提炼出“平衡是多方制衡下的整体稳定”这一共性思考逻辑，正是通过概括总结促进迁移的典型做法。"},{"t":"重视学习策略，培养迁移意识：引导学生反思知识适用场景，主动迁移","d":"教师应向学生传授基本的认知策略与学习方法，引导学生主动反思知识的适用场景，使其逐步形成主动迁移的意识，最终实现学习能力的广泛迁移。案例中，部分学生将平衡的思路迁移至日常学习生活中，通过均衡分配各科学习时间、调整作息节奏缓解考前焦虑，体现了迁移意识的积极效果。"}]}],"id":"紫薯7-36"}]},{"id":"紫薯8","name":"紫薯8","brand":"紫薯","series":"模考卷","questions":[{"num":31,"title":"31 儒家与墨家教育思想","subject":"中教史","blocks":[{"t":"儒家学派概述","items":[{"t":"儒家是春秋战国时期的重要学派，创始人为孔子（孔丘）","d":"创始人为孔子（孔丘）。孔子之后，儒家逐步分化出思孟学派与荀子学派两大主要分支。思孟学派继承孔子的仁学思想，形成了重视人的主观能动性的教育观。荀子学派倡导礼治，主张维护等级秩序，提出“性恶论”，并以此作为其外铄论教育思想的理论基础。墨家是与儒家相对立的学派，由墨子（墨翟）创立，代表小生产者的利益。墨家反对贵族特权，追求社会平等，讲求社会实效；在教育上重视经验与实践，注重逻辑思维训练，充分肯定科学技术知识的价值。与儒家相比，墨家在教育方法上具有如下特点：。"},{"t":"孔子之后儒家分化为思孟学派与荀子学派两大分支"},{"t":"思孟学派继承仁学思想，形成重视人的主观能动性的教育观"},{"t":"荀子学派倡导礼治、维护等级秩序，提出“性恶论”并以外铄论为理论基础","d":"主张维护等级秩序，提出“性恶论”，并以此作为其外铄论教育思想的理论基础。墨家是与儒家相对立的学派，由墨子（墨翟）创立，代表小生产者的利益。墨家反对贵族特权，追求社会平等，讲求社会实效；在教育上重视经验与实践，注重逻辑思维训练，充分肯定科学技术知识的价值。与儒家相比，墨家在教育方法上具有如下特点：。"}]},{"t":"墨家学派概述","items":[{"t":"墨家与儒家相对立，由墨子（墨翟）创立，代表小生产者利益"},{"t":"反对贵族特权，追求社会平等，讲求社会实效","d":"追求社会平等，讲求社会实效；在教育上重视经验与实践，注重逻辑思维训练，充分肯定科学技术知识的价值。与儒家相比，墨家在教育方法上具有如下特点：。"},{"t":"教育上重视经验与实践，注重逻辑思维训练，充分肯定科学技术知识的价值","d":"注重逻辑思维训练，充分肯定科学技术知识的价值。与儒家相比，墨家在教育方法上具有如下特点：。"}]},{"t":"墨家教育方法的特点","items":[{"t":"主动：反对儒家“叩则鸣，不叩则不鸣”的被动施教，主张“强说人”的主动精神","d":"不叩则不鸣”的被动施教态度，主张“虽不叩必鸣”的“强说人”精神，即使人们不来请教，教育者也应该主动施教。"},{"t":"创造：批评儒家“述而不作”，主张“述作结合”，既传承优秀文化又创造新事物","d":"主张“述作结合”。他认为人们既要传承古代优秀文化，也要创造新的事物。这体现了墨子对待文化遗产的态度，也反映出其重视创造的教育理念。"},{"t":"实践：提出“合其志功而观焉”，结合动机与效果评价行为，重生产、军事、科技实践","d":"主张结合动机与效果评价人的行为。墨家的实践除道德与社会政治实践外，还有生产、军事和科技实践。"},{"t":"量力：最早明确提出“量力”，一是学生精力有限不能同时学习几方面，二是量力而教","d":"教育方法的教育家。“量力”具有两层含义，一是就学生的精力而言，学生不能同时进行几方面的学习；二是就学生的知识水平而言，应当量力而教。【答案要点】赫尔巴特是19世纪德国哲学家、心理学家、教育家，被誉为“现代教育学之父”。他提出把教育学建成一门独立学科的设想，并构建了较为完整的教育理论体系。其教育代表作主要有《普通教育学》《教育学讲授纲要》。"}]}],"id":"紫薯8-31"},{"num":32,"title":"32 赫尔巴特的兴趣观","subject":"外教史","blocks":[{"t":"赫尔巴特及其理论体系","items":[{"t":"19世纪德国哲学家、心理学家、教育家，被誉为“现代教育学之父”","d":"心理学家、教育家，被誉为“现代教育学之父”。他提出把教育学建成一门独立学科的设想，并构建了较为完整的教育理论体系。其教育代表作主要有《普通教育学》《教育学讲授纲要》。"},{"t":"提出把教育学建成一门独立学科的设想，构建了较为完整的教育理论体系","d":"其教育代表作主要有《普通教育学》《教育学讲授纲要》。"},{"t":"教育代表作主要有《普通教育学》《教育学讲授纲要》"}]},{"t":"兴趣观","items":[{"t":"兴趣的含义：将思维的对象保留在意识中的内心力量，是智力活动的特性，具有道德的力量","d":"赫尔巴特认为，兴趣是一种将思维的对象保留在意识中的内心力量，是一种智力活动的特性，并具有道德的力量。"},{"t":"兴趣的地位：既是统觉的前提条件，也是课程与教学的基本依据","d":"兴趣不仅是统觉的前提条件，还是课程与教学的基本依据。"},{"t":"兴趣类型：经验兴趣含经验、思辨、审美；同情兴趣含同情、社会、宗教"},{"t":"兴趣活动的过程：划分为注意、期待、要求和行动四个阶段","d":"赫尔巴特把兴趣活动划分为四个阶段，即注意、期待、要求和行动。"}]},{"t":"兴趣观在教育理论体系中的作用","items":[{"t":"教育目的论：提出可能的目的与必要的目的，培养多方面兴趣是直接的、近期的目的","d":"中，赫尔巴特提出可能的目的和必要的目的。培养儿童具有多方面的兴趣是赫尔巴特为教学所确立的直接的、近期的目的，也就是可能的目的，与儿童未来所从事的职业有关。"},{"t":"课程理论：课程内容选择与儿童经验和兴趣相一致，据经验兴趣与同情兴趣分别设置课程","d":"中，赫尔巴特提出经验、兴趣与课程，主张课程内容的选择与儿童的经验和兴趣相一致。根据经验的兴趣设置自然、物理、化学、地理等课程；根据同情的兴趣设置外国语、本国语等课程。"},{"t":"教学形式阶段理论：兴趣观是重要依据，注意—明了、期待—联想、要求—系统、行动—方法","d":"中，赫尔巴特提出兴趣观是确立教学形式阶段的重要依据。赫尔巴特把兴趣分为注意、期待、要求、行动四个阶段，在此基础上提出教学形式阶段理论。在教学的明了阶段，学生的兴趣表现为注意；在教学的联想阶段，学生的兴趣表现为获得新观念前的期待；在教学的系统阶段，学生的兴趣表现为要求；在教学的方法阶段，学生的兴趣表现为行动。"}]}],"id":"紫薯8-32"},{"num":33,"title":"33 教师专业成长与队伍建设","subject":"教原","blocks":[{"t":"教师专业成长阶段判定","items":[{"t":"材料中的“我”处于教师专业成长的关注情境阶段","d":"于教师专业成长的关注情境阶段。福勒和布朗根据教师不同时期的关注焦点，将教师专业成长划分为关注生存、关注情境、关注学生三个阶段。其中，处于关注情境阶段的教师已平稳度过岗位适应期，不再重点关注自身的生存适应问题，而是将注意力转向教学工作的质量与成效，重点关注学生学业成绩、教学任务完成、班级建设等与教学情境相关的内容。"},{"t":"福勒和布朗将教师专业成长划分为关注生存、关注情境、关注学生三个阶段","d":"阶段。福勒和布朗根据教师不同时期的关注焦点，将教师专业成长划分为关注生存、关注情境、关注学生三个阶段。其中，处于关注情境阶段的教师已平稳度过岗位适应期，不再重点关注自身的生存适应问题，而是将注意力转向教学工作的质量与成效，重点关注学生学业成绩、教学任务完成、班级建设等与教学情境相关的内容。"},{"t":"关注情境阶段的教师已平稳度过岗位适应期，注意力转向教学质量与学生学业成绩","d":"师已平稳度过岗位适应期，不再重点关注自身的生存适应问题，而是将注意力转向教学工作的质量与成效，重点关注学生学业成绩、教学任务完成、班级建设等与教学情境相关的内容。"}]},{"t":"判断依据","items":[{"t":"已有六年教学经验，能快速融入新学校人际环境，不存在岗位生存的焦虑"},{"t":"主要精力集中于打磨教学内容、提升班级成绩、推进教研，符合关注情境阶段特征","d":"推进教研工作上，以提高教学质量、提升学生成绩为工作目标，符合关注情境阶段的特征；面对学困生，材料中的“我”受客观条件限制，在教学中只能采用统一大班补差的方式，尚未充分关注学生的个体差异，没有做到因材施教，因此还未进入关注学生阶段。"},{"t":"对学困生仅采用统一大班补差，未关注个体差异，尚未进入关注学生阶段"}]},{"t":"教师队伍建设存在的主要问题","items":[{"t":"教研活动难以落地，同伴互助氛围薄弱，尚未形成常态化的教研合作机制","d":"同伴互助氛围薄弱。材料中，张磊提议每周开展集体备课，但仅有两位年轻教师参与，多数老教师教学观念固化、参与意愿低。这说明该校尚未形成常态化的教研合作机制，教师之间缺乏有效的交流与专业互助平台。"},{"t":"在职培训针对性不足、实效性偏弱，多为师德、安全类通识内容，缺少学科专项研修","d":"实效性偏弱。材料中，该校每季度的培训多为师德、安全类的通识内容，缺少学科教学类的专项研修，无法解决教师教学中的实际困惑，难以有效支撑教师专业能力的持续提升。"},{"t":"师资配置紧张，教师教学负担过重，缺少时间开展教学反思与自主研修","d":"教师教学负担过重。材料中，该校师资存在明显缺口，教师课务排得很满，这导致教师既没有精力为学困生制订个性化辅导方案，也缺少时间开展教学反思与自主研修，严重压缩了其专业成长的空间。"},{"t":"轮岗教师缺少适配支持，教学方法出现“水土不服”，专业价值未充分发挥","d":"教学方法出现“水土不服”。材料中，该校未对交流轮岗的教师配套校情、学情指导，致使城区成熟的教学方法难以适配乡村学情，轮岗教师的专业价值未能得到充分发挥。"}]},{"t":"教育公平与教师队伍建设","items":[{"t":"教育公平包含起点公平、过程公平、结果公平三个层次，加强教师队伍建设是重要抓手","d":"过程公平、结果公平三个主要层次，加强教师队伍建设是实现教育公平的重要抓手。"},{"t":"保障起点公平：优化城乡与校际师资配置，健全交流轮岗机制，补齐乡村师资短板"},{"t":"推进过程公平：提升乡村教师整体专业素养，为乡村学生提供高质量、适配学情的教学"},{"t":"夯实结果公平：整体提升乡村学校育人质量，助力各类学生充分发展","d":"助力各类学生充分发展，缩小学生群体的发展差距，推动教育结果公平的最终实现。【答案要点】（1）科尔伯格将个体的道德发展划分为前习俗水平、习俗水平、后习俗水平三个水平，每个水平包含两个阶段。对材料中学生的不同观点所体现的道德发展阶段及其特征分析如下：。"}]}],"id":"紫薯8-33"},{"num":34,"title":"34 科尔伯格与道德两难","subject":"教心","blocks":[{"t":"材料观点的阶段判定","items":[{"t":"习俗水平·维护权威或秩序的定向：以维护社会秩序为核心，依据是否符合社会秩序准则判断对错","d":"认为法律和社会规范具有权威性，每个人应当承担社会义务与责任，并依据行为是否符合维护社会秩序准则判断行为对错。"},{"t":"后习俗水平·普遍道德原则的定向：是非善恶有独立价值标准，法律与生命冲突时坚守生命至上"},{"t":"后习俗水平·社会契约的定向：契约和法律并非绝对，法律不能实现公平正义时理应修正"}]},{"t":"科尔伯格道德发展理论要点","items":[{"t":"将个体道德发展划分为前习俗、习俗、后习俗三个水平，每个水平包含两个阶段","d":"对材料中学生的不同观点所体现的道德发展阶段及其特征分析如下：。"},{"t":"后习俗水平是道德发展的最高阶段，道德原则已内化为学生的自觉追求"}]},{"t":"道德两难故事促进认知发展的办法","items":[{"t":"设置启发性问题，制造道德认知冲突，引导反思道德选择背后的依据","d":"制造道德认知冲突。教师选取适宜的道德两难情境，设计层层递进的问题，引导学生主动思考不同道德选择背后的依据，促使学生开展自我反思，突破单一的道德判断思维，形成更加理性的道德判断。"},{"t":"组织小组讨论，促进观点交流碰撞，在对比多元观点中提升道德判断水平","d":"促进观点交流碰撞。教师组织学生分组研讨，鼓励大家发表不同看法。学生在交流中对比多元观点，发现自身认知局限，逐步提升道德判断水平。"},{"t":"创设开放包容的课堂氛围，尊重学生独立思考，发展辩证思维与批判意识","d":"尊重学生独立思考。教师营造宽松平等的讨论环境，鼓励学生自由表达观点，发展学生的辩证思维与批判意识。"},{"t":"结合生活实际开展德育，赋予故事现实意义，实现知行合一与道德认知内化","d":"实现知行合一。教师联系学生日常学习生活中真实的道德与法治冲突情境开展教学，赋予道德两难故事现实意义，引导学生将道德认知运用到现实生活中，真正实现道德认知的内化与提升。【答案要点】（1）备课是教师上好课的前提，案例中该教师的备课工作体现了以下基本要求：。"}]}],"id":"紫薯8-34"},{"num":35,"title":"35 备课要求与立德树人","subject":"教原","blocks":[{"t":"备课工作的基本要求","items":[{"t":"备教材（钻研教学内容）：确立三维教学目标，厘清重难点，兼顾知识教学与价值育人","d":"厘清教学重难点，明确本节课的知识传授、能力培养与德育任务，精准把握教学核心内容，兼顾知识教学与价值育人。"},{"t":"备学生（深入了解学生）：摸清学情、家庭情况、生活经历与认知特点，因材施教","d":"生活经历与认知特点，并结合当地灾后重建背景设计教学，使教学内容贴合学生实际，贯彻了因材施教的教学原则。"},{"t":"备教法（合理设计教学）：统筹课堂安排，预设教学情境，融入多元育人元素","d":"预设教学情境，主动思考课堂育人价值，在教学中融入多元育人元素，兼顾知识讲授与价值引领。"}]},{"t":"掌握知识与培养思想品德相统一","items":[{"t":"掌握知识是培养学生思想品德的基础，依托学科内容开展德育，避免空洞说教","d":"使价值观引导有了坚实的知识依托，避免了空洞说教。"},{"t":"思想品德的提高能够推动知识学习，调动学生学习主动性","d":"促使学生积极投入“解决连乘问题”的数学学习与应用。"},{"t":"教学必须坚持知识传授与思想品德教育相统一，实现教书与育人的有机统一","d":"传授与思想品德教育相统一。案例中，该教师没有局限于数学知识的单一讲授，而是在备课阶段主动挖掘课堂多元育人价值，实现了教书与育人的有机统一，充分践行了这一规律的内在要求。"}]},{"t":"学科教学落实立德树人的路径","items":[{"t":"深挖学科内在德育元素，将价值引领融入知识讲授过程","d":"教师要充分挖掘学科蕴含的育人价值，将价值引领融入知识讲授的过程中。如案例中教师借助数学教学渗透爱的教育，实现润物无声的育人效果。"},{"t":"整合多元育人资源，融入中华优秀传统文化、规则意识、哲思启迪与科学精神","d":"教师要打破单一知识传授的局限，主动在教学设计中融入中华优秀传统文化、规则意识、哲思启迪与科学精神等多元要素，丰富课堂育人内涵，拓展育人维度，促进学生全面发展。"},{"t":"立足学情设计德育活动，结合学生生活经历与认知特点创设教学情境","d":"教师要结合学生的生活经历与认知特点创设教学情境，让德育内容贴近学生实际、引发情感共鸣，切实提升育人实效性。如案例中教师结合当地灾后重建背景开展学情分析，为情境育人做好准备。"},{"t":"树立全人育人理念，摒弃知识本位思维，将立德树人贯穿教学全过程","d":"教师要摒弃知识本位思维，主动思考学科课堂的深层育人价值，将立德树人贯穿教学全过程。【答案要点】（1）班杜拉提出的社会（观察）学习理论认为，个体可通过观察他人（榜样）的行为及行为结果进行学习。观察学习包含注意、保持、复制、动机四个过程。小乐的行为转变正是经由这四个过程逐步发生的，具体心理机制如下：。"}]}],"id":"紫薯8-35"},{"num":36,"title":"36 观察学习与自我效能感","subject":"教心","blocks":[{"t":"观察学习的过程机制","items":[{"t":"注意过程：成绩优异且乐于助人的小宇成为同桌，小乐观察到其积极参与、分享思路","d":"教师安排数学成绩优异且乐于助人的小宇与小乐成为同桌，使小宇成为小乐直接观察的榜样。小乐通过日常观察，注意到了小宇积极参与课堂、思考解题、分享思路的学习行为，从而启动了对榜样行为的关注。"},{"t":"保持过程：将观察到的解题方法与学习策略以表象或语言表征形式储存在头脑中","d":"小乐在观察小宇解题过程的基础上，将所观察到的解题方法与学习策略以表象或语言表征的形式储存在头脑中，为后续的行为再现提供了认知基础。"},{"t":"复制过程：在同伴帮助与教师引导下模仿学习方式，独立讲解练习题并转化为实际行动","d":"在同伴帮助与教师引导下，小乐开始模仿小宇的学习方式，尝试解答难度较低的习题；后续独立讲解练习题，成功将习得的行为转化为实际行动。"},{"t":"动机过程：榜样获教师肯定产生替代性强化，自身获表扬与掌声产生直接强化","d":"小宇展示解题思路获得教师肯定，使小乐受到替代性强化；小乐讲解练习题获得教师的肯定与全班同学的掌声，受到了直接强化。因此，小乐表现出更多积极的课堂学习行为。"}]},{"t":"自我效能感的提升路径","items":[{"t":"直接经验：从难度较低的习题入手，小测取得进步并独立讲解，打破“我不行”定势","d":"教师循序渐进引导小乐学习，让其从解答难度较低的习题入手，逐步在数学小测中取得进步，最终独立讲解练习题并获得认可。这一系列成功的亲身体验有效打破了小乐“我不行”的消极心理定势，显著增强了其自我效能感。"},{"t":"替代经验：安排优秀且乐于助人的同桌近距离示范，打破“我数学就是差”的固化认知","d":"教师安排优秀且乐于助人的小宇与小乐成为同桌，让小乐近距离观察小宇积极思考、主动分享解题思路的良好学习表现。通过榜样的正向示范，打破了小乐“我数学就是差”的消极固化认知，使其认可自身的学习潜力。"},{"t":"言语说服：持续鼓励，引导参与小组讨论并给予积极反馈，帮助树立学习信心","d":"教师持续鼓励小乐，引导他参与小组讨论并给予积极反馈，帮助小乐树立学习信心，提升其自我效能感。"}]},{"t":"促进积极学习的三条教学策略","items":[{"t":"树立适宜榜样，发挥观察学习的促进作用，激发学生模仿意愿与学习动力","d":"发挥观察学习的促进作用。教师应在班级选出优秀学生榜样，鼓励榜样展示解题思路与学习方法，引导其他学生观察模仿，从而激发学生的模仿意愿与学习动力。"},{"t":"综合运用多种强化手段：利用替代性强化肯定榜样，及时直接强化正向行为","d":"教师应合理利用替代性强化，对榜样的积极行为予以肯定；同时运用直接强化，及时表扬学生表现出的正向学习行为，持续强化学生积极学习动机。"},{"t":"多措并举增强自我效能感：设计分层任务积累成功体验，设置合理目标并持续鼓励"}]}],"id":"紫薯8-36"}]}];

const $ = id => document.getElementById(id);
const selSet = $("selSet"), listEl = $("list");
let recite = false;

function curSet(){ return SETS[ST.cur] || SETS[0]; }
function setKey(){ return curSet().name; }

function fillSets(){
  selSet.innerHTML = "";
  const groups = {};
  SETS.forEach((s, i) => {
    const brand = s.brand || (s.name.indexOf("柯虎") === 0 ? "柯虎" : s.name.indexOf("紫薯") === 0 ? "紫薯" : "迪雯多");
    (groups[brand] = groups[brand] || []).push([i, s]);
  });
  Object.keys(groups).forEach(b => {
    const og = document.createElement("optgroup");
    og.label = b;
    groups[b].forEach(([i, s]) => {
      const o = document.createElement("option");
      o.value = i; o.textContent = s.name + "（" + s.questions.length + "）";
      og.appendChild(o);
    });
    selSet.appendChild(og);
  });
  selSet.value = ST.cur;
}
selSet.onchange = () => { ST.cur = +selSet.value; save(); render(); };

function render(){
  const set = curSet();
  listEl.innerHTML = "";
  let total = 0, got = 0;
  set.questions.forEach(q => {
    const qEl = document.createElement("div");
    qEl.className = "q";
    const qh = document.createElement("div");
    qh.className = "qh";
    const hot = HOT[q.id] && HOT[q.id][0];
    qh.innerHTML = '<span class="num">' + q.num + '</span><span>' + q.title.replace(/^\d+\s*/, '') + '</span>'
      + (hot ? '<span class="badge">★' + hot[1] + '</span>' : '')
      + '<span class="sub">' + q.subject + ' · ' + q.blocks.length + '块</span>';
    qEl.appendChild(qh);

    q.blocks.forEach((b, bi) => {
      const bEl = document.createElement("div");
      bEl.className = "b";
      const bd = ST.collapsed[q.id + "-" + bi] === false ? "open" : "";
      bEl.className = "b " + bd;
      const bh = document.createElement("div");
      bh.className = "bh";
      bh.innerHTML = '<span>' + b.t + '</span><span class="cnt">' + b.items.length + '</span><span class="arrow">▸</span>';
      bh.onclick = () => {
        const nowOpen = !bEl.classList.contains("open");
        bEl.classList.toggle("open", nowOpen);
        ST.collapsed[q.id + "-" + bi] = !nowOpen;
        save();
      };
      bEl.appendChild(bh);

      const items = document.createElement("div");
      items.className = "items";
      b.items.forEach((it, ii) => {
        const id = q.id + "-" + bi + "-" + ii;
        const txt = (typeof it === "object") ? it.t : it;
        const det = (typeof it === "object") ? it.d : null;
        total++;
        if ((ST.status[id] || 0) === 2) got++;
        const itEl = document.createElement("div");
        itEl.className = "it";
        itEl.dataset.id = id;
        itEl.innerHTML = '<div class="row"><span class="dot" data-s="' + (ST.status[id] || 0) + '"></span><span class="tx">' + txt + '</span></div>';
        if (det) {
          const dEl = document.createElement("div");
          dEl.className = "dt";
          dEl.textContent = det;
          itEl.appendChild(dEl);
        }
        itEl.querySelector(".dot").onclick = e => {
          e.stopPropagation();
          ST.status[id] = ((ST.status[id] || 0) + 1) % 3;
          itEl.querySelector(".dot").dataset.s = ST.status[id];
          save(); updateStat();
        };
        itEl.querySelector(".tx").onclick = e => {
          e.stopPropagation();
          if (recite) { itEl.classList.toggle("peek"); return; }
          if (det) itEl.classList.toggle("open");
        };
        items.appendChild(itEl);
      });
      bEl.appendChild(items);
      qEl.appendChild(bEl);
    });
    listEl.appendChild(qEl);
  });
  $("pg").textContent = got; $("pgAll").textContent = total;
  updateStat();
  if (recite) listEl.classList.add("blur");
}

function updateStat(){
  let total = 0, got = 0;
  curSet().questions.forEach(q => q.blocks.forEach(b => b.items.forEach(() => { total++; })));
  listEl.querySelectorAll(".it .dot").forEach(d => { if (d.dataset.s === "2") got++; });
  $("pg").textContent = got; $("pgAll").textContent = total || $("pgAll").textContent;
}

$("prev").onclick = () => { ST.cur = Math.max(0, ST.cur - 1); selSet.value = ST.cur; save(); render(); };
$("next").onclick = () => { ST.cur = Math.min(SETS.length - 1, ST.cur + 1); selSet.value = ST.cur; save(); render(); };
$("btnRecite").onclick = e => {
  recite = !recite;
  e.target.classList.toggle("on", recite);
  listEl.classList.toggle("blur", recite);
  if (!recite) listEl.querySelectorAll(".peek").forEach(x => x.classList.remove("peek"));
};
$("btnExpand").onclick = () => { listEl.querySelectorAll(".b").forEach(b => b.classList.add("open")); };
$("btnCollapse").onclick = () => { listEl.querySelectorAll(".b").forEach(b => b.classList.remove("open")); };

    const c = document.createElement("div");
    c.className = "sh-cell" + (v ? "" : " empty") + (SH.sel === i ? " sel" : "");
    if (v && ST.graded[SH.set]) c.classList.add(v === key[i-1] ? "right" : "wrong");
    c.innerHTML = '<div class="no">' + i + '</div><div class="k">' + (v || "·") + '</div>';
    c.onclick = () => {
      if (SH.sel === i) {
        const order = ["A","B","C","D",""];
        const cur = d[i] || "";
        d[i] = order[(order.indexOf(cur) + 1) % 5];
        if (!d[i]) delete d[i];
      } else SH.sel = i;
      save(); drawSheet();
    };
    shGrid.appendChild(c);
  }
  const answered = Object.keys(d).length;
  shRes.innerHTML = "已填 " + answered + " / 30";
}
$("btnSheet").onclick = () => { sheetEl.hidden = false; drawSheet(); };
$("shClose").onclick = () => { sheetEl.hidden = true; };
$("shGrade").onclick = () => {
  const d = sheetData(), key = SHEET[SH.set] || "";
  ST.graded[SH.set] = true; save();
  const nums = Object.keys(d).map(Number).sort((a,b)=>a-b);
  const wrong = nums.filter(n => d[n] !== key[n-1]);
  const right = nums.length - wrong.length;
  shRes.innerHTML = "得分 <b>" + (right*2) + "</b> / 60　对 " + right + " · 错 " + wrong.length +
    (wrong.length ? "<br>红题号：" + wrong.join("、") : "");
  drawSheet();
};

fillSets();
render();
</script>
</body>
</html>
