条件与操作之间的对应关系；自动化阶段则是操作所需的认知投入显著减少，能够快速准确地执行。以下运用该理论分析小唐和小冯的现象。小唐“说得好但写不好”的成因分析：小唐能够在小组讨论中说清楚解题思路，说明他在认知阶段的表现较好——他能够理解问题的结构，明确解题的目标和基本步骤，形成了初步的问题表征。在讨论情境中，口语表达的外部支持帮助他组织和呈现思路，这种“说”的过程本身就是对认知阶段信息的加工和组织。然而，“说得好。"}]},{"t":"（3）结合心智技能的培养方法","items":[{"t":"条件化知识的形成应由学生在问题解决中主动建构，而非由教师直接“给”口诀","d":"学生在问题解决中主动建构，而非由教师直接“给”口诀。心智技能形成的关键是把所学知识与该知识应用的“触发”条件结合起来。赵老师的口诀是教师归纳好的，学生记住的是语言的表面形式，而非条件与操作之间的内在逻辑关系。小郭“看到‘照这样计算’就套归一”的表现，正是条件化知识形同虚设的体现——学生记住了触发词，却不理解触发条件背后的结构含义，因此面对复合条件时无法灵活调整。第二，练习的设计缺乏科学梯度。科学练习要求从易到难、从简单到复杂，并适时引入变式以促进产生式的泛化和分化。赵老师布置的20道题都是例题的同类复制，没有设计条件变化、结构变化的变式题，导致学生的技能。"},{"t":"练习的设计缺乏科学梯度","d":"度。科学练习要求从易到难、从简单到复杂，并适时引入变式以促进产生式的泛化和分化。赵老师布置的20道题都是例题的同类复制，没有设计条件变化、结构变化的变式题，导致学生的技能被固化在狭窄的情境中，一旦条件改变，产生式无法匹配。第三，教学中缺少言语表达训练。心智技能的培养方法强调加强学生的言语表达训练，因为言语活动能引发执行的控制加工，使注意集中于问题的关键因素。赵老师课堂上学生主要在“听”和“做”，没有机会“说”。小唐在小组讨论中说得好但独立书写困难，正是言语训练与书面操作训练脱节的体现；小冯会做却说不清意义，则是长期缺少言语表达训练的必然结果。第四，赵老师。"},{"t":"教学中缺少言语表达训练","d":"练。心智技能的培养方法强调加强学生的言语表达训练，因为言语活动能引发执行的控制加工，使注意集中于问题的关键因素。赵老师课堂上学生主要在“听”和“做”，没有机会“说”。小唐在小组讨论中说得好但独立书写困难，正是言语训练与书面操作训练脱节的体现；小冯会做却说不清意义，则是长期缺少言语表达训练的必然结果。第四，赵老师未能分阶段诊断学生的发展水平。小唐的问题在联结不足，小冯的问题在认知基础薄弱，小郭的问题在条件识别混乱，三人的缺陷各不相同，但赵老师的教学以统一的节奏推进，未能针对不同学生的发展阶段提供差异化支持。综上，赵老师的教学方式有助于技能的浅层熟练，但无法。"},{"t":"赵老师未能分阶段诊断学生的发展水平","d":"学生的发展水平。小唐的问题在联结不足，小冯的问题在认知基础薄弱，小郭的问题在条件识别混乱，三人的缺陷各不相同，但赵老师的教学以统一的节奏推进，未能针对不同学生的发展阶段提供差异化支持。综上，赵老师的教学方式有助于技能的浅层熟练，但无法保障心智技能的深度建构和灵活迁移。改进的方向应当是：让学生在具体情境中自己尝试归纳解题方法，教师通过追问和讨论帮助学生把操作与意义结合起来；设计有梯度的变式练习，逐步扩展产生式的适用条件；在教学中持续嵌入言语表达与书面操作的双重训练，并根据学生的阶段特征进行有针对性的指导。##第十套###选择题。"}]}]}]},{"id":"模拟10-10","name":"模拟10","questions":[{"id":"模拟10-10-31","num":31,"title":"31 清末新政","subject":"中教史","blocks":[{"t":"清末新政时期的主要教育改革举措","items":[{"t":"制定并推行近代学制体系，构建分层教育格局","d":"系，构建分层教育格局清末新政先后出台两部全国性学制章程，奠定了中国近代学校教育制度的基础。1902年，张百熙主持拟定《钦定学堂章程》，史称壬寅学制，是中国近代第一部由中央政府颁布的全国性学制系统，首次规划了初等、中等、高等三级衔接的教育体系。但因制定仓促、争议较多，该学制最终未能正式实施。1904年，清政府修订出台《奏定学堂章程》，即癸卯学制，成为中国近代首部正式落地施行的法定学制。该学制体系完备、层级清晰，纵向分为三段七级，涵盖蒙养院、初等小学、高等小学、中学堂、高等学堂、大学堂与通儒院，将学前教育正式纳入国家教育规划，明确初等小学为强迫义务教育阶段。"},{"t":"彻底废除科举制度，扫清新式教育障碍","d":"清新式教育障碍科举制度是传统封建教育的核心支柱，严重制约新式学堂发展。清末新政期间，清政府逐步推进科举改革，先废除八股文考试程式，改试经世策论，打破空疏的经学考试传统；随后采取递减科举中额的方式，压缩科举取士规模。1905年，在张之洞、袁世凯等封疆大吏的奏请下，清政府正式下诏废除科举，终结了延续一千三百余年的科举取士制度。科举的废止，彻底打破了传统士人“学而优则仕”的固有路径，迫使全社会转向新式学堂求学，直接掀起了全国兴办学堂、研习新学的热潮，为近代教育普及扫清了最核心的制度障碍。"},{"t":"革新教育行政体制，建立专业化管理体系","d":"立专业化管理体系为适配新式学制的推行与大规模兴学需求，清政府重构了全国教育行政体系。1905年，中央设立学部，作为统辖全国教育的最高行政机关，将传统国子监并入学部，实现了教育管理的专门化、独立化。1906年，地方配套设立省级提学使司、府县劝学所，构建起从中央到地方层级清晰、权责明确的垂直教育管理体系。这套近代教育行政体制，摆脱了传统教育依附于礼部、行政与教育混杂的弊端，实现了教育治理的近代化转型。"},{"t":"确立近代官方教育宗旨，规范育人目标","d":"规范育人目标1906年，清政府学部正式拟定“忠君、尊孔、尚公、尚武、尚实”五项教育宗旨，这是中国近代史上第一个官方正式颁布的教育育人纲领。其中“忠君、尊孔”延续封建伦理核心，坚守传统统治根基，“尚公、尚武、尚实”则针对性弥补国民素质短板，倡导公共意识、强健体魄与务实学风，适配近代社会发展需求，标志着近代教育育人目标从单一经学教化转向德智体综合发展。"},{"t":"推广新式留学教育，拓宽人才培养渠道","d":"宽人才培养渠道清末新政大力扶持海外留学教育，形成两大主流留学体系。一是大规模留日热潮，依托中日地缘相近、文字相通、费用低廉的优势，加之科举废除后士人寻求新出路，清政府出台功名奖励政策鼓励留学，留日学生数量激增，广泛学习日本近代军政、实业、教育制度。二是庚款留美教育，20世纪初美国退还部分庚子赔款，专项用于中国留美教育，清政府专门设立游美学务处与海外监督机构，规范化选拔派遣留美学生，扭转了留学单一流向，构建起多元化的海外人才培养格局。"}]},{"t":"清末新政教育变革的整体影响与历史局限","items":[{"t":"积极历史影响","d":"第一，终结封建传统教育体系，实现教育制度近代化。癸卯学制的推行、科举制度的废除，彻底瓦解了以经学、科举、书院为核心的传统封建教育体制，建立起贴合近代世界的三级学制、班级授课制、义务教育制度，标志着中国教育正式迈入制度化、体系化的近代发展阶段，为后世民国教育体系奠定了制度基础。第二，推动新式教育普及，重塑社会求学风气。科举废除彻底打破了传统教育的垄断格局，新式学堂数量激增，西学自然科学、实业技术、社会科学知识广泛传播，教育内容从空疏经学转向经世实学，极大开阔了国民视野，推动社会思想解放。第三，培育近代新式人才，助力社会近代化转型。新式学堂与海外留学教育，培。"},{"t":"终结封建传统教育体系，实现教育制度近代化","d":"实现教育制度近代化。癸卯学制的推行、科举制度的废除，彻底瓦解了以经学、科举、书院为核心的传统封建教育体制，建立起贴合近代世界的三级学制、班级授课制、义务教育制度，标志着中国教育正式迈入制度化、体系化的近代发展阶段，为后世民国教育体系奠定了制度基础。第二，推动新式教育普及，重塑社会求学风气。科举废除彻底打破了传统教育的垄断格局，新式学堂数量激增，西学自然科学、实业技术、社会科学知识广泛传播，教育内容从空疏经学转向经世实学，极大开阔了国民视野，推动社会思想解放。第三，培育近代新式人才，助力社会近代化转型。新式学堂与海外留学教育，培养了大批教育、实业、军政、外。"},{"t":"推动新式教育普及，重塑社会求学风气","d":"塑社会求学风气。科举废除彻底打破了传统教育的垄断格局，新式学堂数量激增，西学自然科学、实业技术、社会科学知识广泛传播，教育内容从空疏经学转向经世实学，极大开阔了国民视野，推动社会思想解放。第三，培育近代新式人才，助力社会近代化转型。新式学堂与海外留学教育，培养了大批教育、实业、军政、外交领域的近代人才，不仅推动了近代工商业、军事、教育事业的发展，更催生了新式知识分子群体，成为后续辛亥革命、新文化运动的核心力量，深刻推动了社会变革。第四，完善近代教育配套体系。专业化教育行政体制、官方教育宗旨、师范与实业教育体系的建立，填补了中国近代教育的制度空白，初步实现。"},{"t":"培育近代新式人才，助力社会近代化转型","d":"力社会近代化转型。新式学堂与海外留学教育，培养了大批教育、实业、军政、外交领域的近代人才，不仅推动了近代工商业、军事、教育事业的发展，更催生了新式知识分子群体，成为后续辛亥革命、新文化运动的核心力量，深刻推动了社会变革。第四，完善近代教育配套体系。专业化教育行政体制、官方教育宗旨、师范与实业教育体系的建立，填补了中国近代教育的制度空白，初步实现了教育管理、育人目标、人才培养的规范化、专业化。"},{"t":"完善近代教育配套体系","d":"专业化教育行政体制、官方教育宗旨、师范与实业教育体系的建立，填补了中国近代教育的制度空白，初步实现了教育管理、育人目标、人才培养的规范化、专业化。"}]}]},{"id":"模拟10-10-32","num":32,"title":"32 现代教育制度","subject":"外教史","blocks":[{"t":"19世纪德、英、法三国现代教育制度奠基的标志性举措","items":[{"t":"德国：以新大学运动与柏林大学创办为核心标志","d":"柏林大学创办为核心标志。在基础教育层面，泛爱主义教育运动推动了初等教育的世俗化与普及化，为国民教育奠定了基础；在高等教育层面，1810年创办的柏林大学确立了“教学与科研统一”“学术自由”的核心办学原则，以习明纳、教授治校为核心制度，颠覆了传统大学仅传授知识的定位，成为现代研究型大学的范式标杆，推动德国高等教育率先完成现代化转型。-英国：以《初等教育法》（福斯特法案）颁布为制度节点。早期通过贝尔—兰开斯特制扩大了初等教育覆盖面，公学则长期维持着精英中等教育的传统；1870年《初等教育法》确立了公立初等学校的合法地位，规定5-12岁儿童接受初等义务教育，形成。"},{"t":"英国：以《初等教育法》（福斯特法案）颁布为制度节点","d":"》（福斯特法案）颁布为制度节点。早期通过贝尔—兰开斯特制扩大了初等教育覆盖面，公学则长期维持着精英中等教育的传统；1870年《初等教育法》确立了公立初等学校的合法地位，规定5-12岁儿童接受初等义务教育，形成公立与教会学校并存的双轨格局，标志着英国国民教育制度正式形成；同期兴起的新大学运动与大学推广运动，打破了古典大学的垄断，推动高等教育向世俗化、大众化方向拓展。-法国：以《费里教育法》颁布为体系成熟标志。拿破仑时期建立的帝国大学体制，确立了中央集权的教育管理模式，为全国统一教育体系搭建了制度框架；19世纪80年代《费里教育法》明确了初等教育“免费、义务。"},{"t":"法国：以《费里教育法》颁布为体系成熟标志","d":"》颁布为体系成熟标志。拿破仑时期建立的帝国大学体制，确立了中央集权的教育管理模式，为全国统一教育体系搭建了制度框架；19世纪80年代《费里教育法》明确了初等教育“免费、义务、世俗化”三大原则，废除公立学校宗教课程、改设公民道德课，彻底完成了公立教育的世俗化转型，奠定了法国国民教育体系的核心框架。"}]},{"t":"美国与日本教育国家化的路径差异及社会根源","items":[{"t":"推进动力与治理模式不同","d":"同。美国走自下而上的地方自治路径：以公立学校运动为核心，由贺拉斯・曼等教育家、地方工商业群体推动，以州级政府为办学主体，联邦政府仅通过《莫雷尔法案》等法案间接引导，教育管理高度分权；体系延伸上，初等公立学校普及后，逐步通过初级学院运动、八年研究等拓展中高等教育，形成自下而上的生长逻辑。日本走自上而下的中央集权路径：以明治维新教育改革为核心，由中央政府统一设计学制、颁布法令、调配资源，以国家强制力快速推进从初等到高等的全体系建设，教育管理高度集权，改革节奏与内容完全服务于国家战略。第二，价值导向与内容逻辑不同。美国以民主平等为核心导向，教育被视为公民基本权。"},{"t":"价值导向与内容逻辑不同","d":"同。美国以民主平等为核心导向，教育被视为公民基本权利，内容兼顾实用知识、公民素养与地方需求，目标是培养民主社会的合格公民；日本以富国强兵为核心导向，教育被视为国家崛起的工具，内容奉行“和魂洋才”，既引入西方科学技术，也强化忠孝伦理与国家意识，目标是培养效忠国家的臣民。"}]},{"t":"20世纪现代教育制度发展的共同趋势","items":[{"t":"教育公平持续深化，义务教育向全学段延伸","d":"务教育向全学段延伸。各国均在初等普及的基础上，推动义务教育向中等教育延伸，打破阶级分层壁垒。英国《哈多报告》确立初等教育后分流制度，《1944年教育法》将义务教育延长至15岁，搭建起连贯的公共教育体系；苏联《统一劳动学校规程》废除等级学制，建立统一劳动学校，实现教育的全民化；日本战后《教育基本法》《学校教育法》确立六三三学制，保障教育机会均等。教育公平逐步从“机会公平”向“过程公平”深化。第二，质量成为改革核心，课程与评价体系不断规范。普及目标达成后，各国普遍转向质量提升。美国《国防教育法》强化“新三艺”教学，《国家处在危机之中》提出提高学业标准、强化核。"},{"t":"质量成为改革核心，课程与评价体系不断规范","d":"程与评价体系不断规范。普及目标达成后，各国普遍转向质量提升。美国《国防教育法》强化“新三艺”教学，《国家处在危机之中》提出提高学业标准、强化核心课程；英国《1988年教育改革法》推行全国统一课程与标准化考试，建立统一质量评价体系；苏联《关于小学和中学的决定》纠正20年代学制的弊端，强化系统科学知识教学；德国《汉堡协定》统一各州义务教育学制与质量标准。质量提升成为各国教育改革的长期主线。第三，管理体制动态调整，集权与分权趋向平衡。各国均在探索统一规范与办学活力的平衡点：分权制国家逐步强化中央统筹，如美国通过联邦经费引导教育改革，英国通过系列法案收束教育管理。"},{"t":"管理体制动态调整，集权与分权趋向平衡","d":"权与分权趋向平衡。各国均在探索统一规范与办学活力的平衡点：分权制国家逐步强化中央统筹，如美国通过联邦经费引导教育改革，英国通过系列法案收束教育管理权；集权制国家适度下放权限，如法国《郎之万-瓦隆教育改革方案》提出教育民主化、地方自主的改革方向。收放平衡成为现代教育管理的普遍调整逻辑。第四，教育的国家战略地位持续强化，与社会发展深度绑定。各国均将教育视为综合国力竞争的核心支撑：美国将教育改革上升到国防安全与科技竞争高度，《史密斯-休斯法案》确立职业教育体系服务产业发展；英国罗宾斯原则推动高等教育大众化，适配国家人才需求；日本战后将教育作为经济复兴的核心抓手。"},{"t":"教育的国家战略地位持续强化，与社会发展深度绑定","d":"续强化，与社会发展深度绑定。各国均将教育视为综合国力竞争的核心支撑：美国将教育改革上升到国防安全与科技竞争高度，《史密斯-休斯法案》确立职业教育体系服务产业发展；英国罗宾斯原则推动高等教育大众化，适配国家人才需求；日本战后将教育作为经济复兴的核心抓手。教育从社会配套事业转变为国家发展的核心战略支撑，成为现代教育制度的核心定位。###材料分析题####33.阅读材料，回答问题。#####（1）运用教学工作基本环节原理，阐释该区教学常规提质行动的设计逻辑，分析实践中面临的深层矛盾。【解析】教学工作是由多个相互衔接、相互支撑的核心环节构成的有机系统，涵盖备课、。"}]}]},{"id":"模拟10-10-33","num":33,"title":"33 教学环节与班级授课制","subject":"教原","blocks":[{"t":"（1）运用教学工作基本环节原理","items":[{"t":"提质行动的设计逻辑：全环节系统优化，构建教学质量闭环","d":"#####（1）运用教学工作基本环节原理，阐释该区教学常规提质行动的设计逻辑，分析实践中面临的深层矛盾。【解析】教学工作是由多个相互衔接、相互支撑的核心环节构成的有机系统，涵盖备课、上课、作业布置与批改、课外辅导、学业考评五大基本环节，各环节的质量共同决定教学的整体成效。该区的教学常规提质行动正是紧扣教学工作的全环节逻辑系统设计，构建了从标准到实施、从过程到评价的完整质量链条，但实践中也暴露出标准化建设与个性化需求之间的深层张力。"},{"t":"实践中的深层矛盾：标准化与个性化的固有张力","d":"标准化与个性化的固有张力尽管提质行动进行了系统的设计，但半年后依然存在学业分化突出、分层覆盖有限等问题，本质上反映了教学标准化建设与学生个性化需求之间的深层矛盾，也是班级授课制下的长期难题。第一，统一进度要求与分层发展需求的矛盾。统一教学目标与进度保障了教学的基本标准与校际公平，但也客观上限制了分层教学的灵活度。学困生跟不上整体进度的问题，根源在于统一进度与个体学习速度的差异，单纯的课后辅导难以从根本上弥补课堂进度差，因此学业分化依然突出。这是集体教学模式下的固有矛盾，常规层面的优化难以彻底破解。第二，个性化教学需求与师资资源供给的矛盾。梯度任务、分层支。"}]},{"t":"（2）结合班级授课制理论内核","items":[{"t":"行政班保留为基本单元，班级授课制的组织基础没有动摇","d":"班级授课制的组织基础没有动摇班级授课制的首要特征是固定的班级组织，班级不仅是教学单位，也是学生管理、德育开展、集体生活的基本单元。该校在改革中明确保留行政班作为日常管理与德育的基本单元，语文、历史等学科仍以行政班为单位开展教学，说明班级授课制的核心组织形态并未被否定。分层走班仅针对数学、英语等学科差异较大的科目，是局部的教学组织调整，而非整体上替代班级授课制。行政班的保留，保障了集体教育的德育功能、管理功能与社会化功能，守住了班级授课制的基本价值。"},{"t":"分层走班是对“因材施教不足”局限的修正，而非否定集体教学","d":"教不足”局限的修正，而非否定集体教学班级授课制最大的固有局限，是统一进度、统一要求的集体教学难以照顾学生的个体差异，容易导致学业分化。该校针对数学、英语学科，打破行政班界限，按学业水平与学习意愿分为三个层级教学班，各层级在教学深度、节奏、难度上各有侧重，并且每学期可动态调整。这一改革精准瞄准了班级授课制的核心短板，通过“同层集体”替代“混层集体”，让不同水平的学生都能获得适配的教学节奏与难度，是对班级授课制因材施教不足的针对性修正。但这种修正并未超越班级授课的本质：分层教学班本质上依然是集体教学，依然遵循班级授课的基本逻辑，有固定的学生组成、统一的教学进。"},{"t":"小组合作学习是教学方式的优化，丰富班级授课的育人形态","d":"式的优化，丰富班级授课的育人形态针对班级授课制中学生主体性不足、实践能力薄弱的局限，该校在课堂推行4—6人混合编组的项目式学习，围绕真实问题开展探究。这是在班级授课的框架内，对教学方式的丰富与优化，通过小组合作弥补集体讲授的不足，提升学生的参与度、探究能力与合作能力。这种调整是班级内部教学方法的创新，而非对班级授课制的替代，最终服务于提升集体教学的育人效果，让班级授课制能够更好地培养学生的综合能力。"},{"t":"智慧教学系统是技术赋能，升级班级授课的精准度","d":"能，升级班级授课的精准度该校引入智慧教学系统辅助教师调整教学策略，本质上是用数字化技术为班级授课制赋能。通过智慧系统的学情数据采集、精准分析，教师能够更及时地把握学生的学习状况，调整教学策略，让集体教学更具针对性。技术手段的融入，破解了传统班级授课制难以精准掌握每个学生状态的难题，提升了集体教学的精准度，是对班级授课制的技术升级，而非颠覆其形态。综上，该校的改革始终在班级授课制的框架内推进，保留了集体教学的核心优势，同时针对其局限进行了多维度的修正与优化，本质是班级授课制的适应性改良，而非超越性的替代。#####（3）基础教育优质均衡背景下，有观点认为“。"}]},{"t":"（3）基础教育优质均衡背景下","items":[{"t":"对观点的辩证评析","d":"第一，观点的合理内核：精准指向班级授课制的个性化困境。班级授课制以统一的进度、内容、要求开展集体教学，天然难以充分兼顾每个学生的学习速度、能力基础与兴趣特长，容易出现“优生吃不饱、后进生跟不上”的分化问题，也不利于学生个性与创造力的充分发展。材料中学业分化突出、个性化需求难以满足等问题，正是这一局限的现实体现。从这个角度看，该观点反映了教育改革的现实诉求，具有一定的针对性。第二，观点的核心误区：否定班级授课制的不可替代性。班级授课制作为现代教育的标志性成果，是人类教育普及与质量提升的核心支撑，具有不可替代的核心优势。其一，效率优势：它能够系统、高效地向大。"},{"t":"观点的合理内核：精准指向班级授课制的个性化困境","d":"政府前瞻性规划是职业教育改革的重要推动力量该观点准确捕捉到了现代教育发展中政府治理的能动作用，看到了政策规划对职业教育改革的直接推动效应。作为具有相对独立性的社会事业，教育发展并非完全被动地跟随经济波动，政府可以基于对经济发展趋势的预判，主动进行顶层设计，集中资源推进教育改革，发挥制度优势。材料中S省面对产业转型压力，主动出台《关于推进职业教育与重点产业深度融合的实施方案》，系统性布局专业调整、产业学院建设、实训基地共建、双师型教师培养等改革举措，在短时间内完成了职业教育体系的系统性重塑，快速缩小了重点产业技能人才缺口。这种高效的改革推进，离不开地方政府。"},{"t":"数字化时代班级授课制的升级方向","d":"#####（3）基础教育优质均衡背景下，有观点认为“班级授课制无法适配个性化需求，应当逐步被替代”。结合材料与所学，谈谈你对这一观点的认识，说明数字化时代班级授课制的升级方向。【解析】“班级授课制无法适配个性化需求，应当逐步被替代”的观点，敏锐捕捉到了班级授课制的固有局限，具有一定的现实批判性，但整体上夸大了其局限性，否定了班级授课制的核心价值与自我革新能力。在基础教育优质均衡的背景下，班级授课制依然是不可替代的基本教学组织形式，其发展方向不是被替代，而是通过改革与技术赋能实现升级。"}]}]},{"id":"模拟10-10-34","num":34,"title":"34 操作技能","subject":"教心","blocks":[{"t":"（1）结合小陈、小刘、小赵的表现","items":[{"t":"小陈：处于认知阶段，动作映象尚未稳固，错误多、控制弱","d":"动作映象尚未稳固，错误多、控制弱认知阶段是操作技能形成的起始阶段，学习者的核心任务是通过观察与讲解，在头脑中形成动作技能的整体映象，初步把握动作的基本要求与步骤。这一阶段的典型特征是：学习者对动作的内在逻辑理解不深，动作映象模糊且不稳定，难以自主察觉动作错误，整体动作呆板、迟滞、协调性差，多余动作多，心理紧张度高，高度依赖视觉控制与外部纠正。小陈的表现完全契合认知阶段的特征：其一，动作错误频发且难以自我修正，握刀姿势错误，经老师纠正后仍重复出现，说明其头脑中尚未形成正确、稳定的动作映象，无法通过自我觉察调整动作；其二，整体动作僵硬、经常遗忘步骤，说明动作。"},{"t":"小刘：处于联系形成阶段，动作步骤初步衔接，整合度不足","d":"段，动作步骤初步衔接，整合度不足联系形成阶段是操作技能的过渡阶段，核心任务是将认知阶段习得的单个独立动作进行合并、组块，形成更大的动作单元，逐步实现动作序列的连贯。这一阶段的典型特征是：单个动作已经能够完成，视觉控制逐步让位于动觉控制，动作间的干扰减少，紧张度有所下降，但动作的连贯性依然不足，经常出现停顿、顾此失彼的现象，仍需要意识参与调控动作衔接。小刘的表现精准对应联系形成阶段的特点：其一，能够按照示范完成基本操作，说明单个动作的认知已经建立，具备了动作执行的基础；其二，动作不连贯，经常停顿思考，说明动作之间尚未形成流畅的连锁，每完成一个动作都需要意识。"},{"t":"小赵：处于自动化阶段，动作系统整合完善，适应性强","d":"动作系统整合完善，适应性强自动化阶段是操作技能形成的高级阶段，核心特征是动作序列已经整合为有机的整体，各个动作高度自动化，几乎不需要意识的刻意控制，能够根据情境变化灵活调整动作，紧张感与多余动作完全消失。小赵的表现符合自动化阶段的核心特征：其一，动作流畅自然，说明烹饪操作的各个步骤已经形成连贯的自动化序列，不需要意识刻意控制动作衔接，整体一气呵成；其二，能够灵活调整火候、翻炒节奏，说明动作技能已经脱离了固定的程序模板，能够根据具体情境的变化动态调整，具备了高度的适应性；其三，凭感觉操作，说明动觉控制已经占据主导地位，视觉监控与意识参与大幅减少，动作技能已。"}]},{"t":"（2）运用冯忠良操作技能形成四阶段模型","items":[{"t":"王老师教学模式存在的系统性问题","d":"系统性问题第一，操作定向阶段：定向映象窄化，重动作示范轻原理讲解。操作定向阶段的核心任务是让学生了解操作活动的结构与要求，形成全面、准确的定向映象，不仅包括“怎么做”的动作程序，更包括“为什么这么做”的操作原理。王老师以“西红柿炒鸡蛋”为唯一载体，只示范具体的操作步骤，没有讲解食材处理的基本原则、油温判断的通用标准、火候调整的内在逻辑、调味的基本规律等原理性内容。学生头脑中形成的只是“西红柿炒鸡蛋”这道菜的具体动作映象，而非烹饪技能的一般性认知，定向映象的狭隘性从根源上限制了技能的迁移性。第二，操作模仿阶段：机械模仿动作，缺乏意义理解。操作模仿阶段是将头。"},{"t":"操作定向阶段：定向映象窄化，重动作示范轻原理讲解","d":"定向映象窄化，重动作示范轻原理讲解。操作定向阶段的核心任务是让学生了解操作活动的结构与要求，形成全面、准确的定向映象，不仅包括“怎么做”的动作程序，更包括“为什么这么做”的操作原理。王老师以“西红柿炒鸡蛋”为唯一载体，只示范具体的操作步骤，没有讲解食材处理的基本原则、油温判断的通用标准、火候调整的内在逻辑、调味的基本规律等原理性内容。学生头脑中形成的只是“西红柿炒鸡蛋”这道菜的具体动作映象，而非烹饪技能的一般性认知，定向映象的狭隘性从根源上限制了技能的迁移性。第二，操作模仿阶段：机械模仿动作，缺乏意义理解。操作模仿阶段是将头脑中的定向映象转化为外显动作的。"},{"t":"“换一道菜就不会做”的深层原因","d":"#####（2）运用冯忠良操作技能形成四阶段模型，分析王老师“示范—模仿—反复练习”模式存在的问题，说明学生“换一道菜就不会做”的原因。【解析】冯忠良的操作技能四阶段模型将操作技能的形成划分为操作定向、操作模仿、操作整合、操作熟练四个逐级递进的阶段，每个阶段有不同的发展任务与培养重点。王老师“示范—模仿—反复练习”的教学模式，只覆盖了前两个半阶段的基础训练，没有完成完整的技能建构，最终导致学生只能掌握特定菜品的固定动作，无法实现技能的灵活迁移。"}]},{"t":"（3）结合操作技能训练要求","items":[{"t":"对两种观点的辩证评析：第一种观点“操作技能靠反复练习","d":"第一种观点“学生需要外部压力，考试排名是必要驱动力”，看到了外部动机的维持功能，具有现实合理性，但过度强调外部压力，忽视了动机内化的长远价值。对于自我调节能力尚不足的中小学生，适度的外部压力与评价确实能够维持基本的学习行为，保障基本的教学秩序。考试排名作为一种外部评价机制，能够在一定程度上激发学生的竞争动力，维持学习投入，这是其不可否认的现实意义。但这种观点的局限也十分明显：过度依赖外部压力，会让学生的动机始终停留在外部调节层面，无法实现深度内化，甚至会削弱内在动机，加剧“无排名不学习”的依赖症。长期来看，不利于培养学生自主学习的能力与终身学习的意识，也。"},{"t":"促进操作技能灵活迁移的实践路径","d":"的实践路径结合操作技能形成的阶段规律与训练要求，教师应当构建“定向筑基—模仿练形—整合建系—熟练迁移”的阶梯式训练体系，实现练习与理解的协同推进，最终帮助学生实现从“会一道菜”到“会做菜”的跨越。第一，优化定向阶段：示范与讲解结合，建立全面准确的定向映象。在技能学习初期，不仅要完整示范动作步骤，还要系统讲解操作的内在原理、适用条件与核心规律。比如烹饪教学中，不仅示范切菜、翻炒的动作，还要讲解食材处理的基本原则、油温判断的通用标准、火候与食材的匹配规律、调味的基本逻辑，让学生既知道“怎么做”，也知道“为什么这么做”，形成兼具动作程序与原理逻辑的定向映象，为。"}]}]},{"id":"模拟10-10-35","num":35,"title":"35 德育模式","subject":"教原","blocks":[{"t":"（1）中王老师的德育实践","items":[{"t":"创设道德两难情境，激活认知冲突，搭建道德发展的载体","d":"活认知冲突，搭建道德发展的载体王老师呈现“好友作弊，上报则破坏友谊、不上报则违背诚信职责”的两难情境，本质上是道德两难故事法的课堂应用。这一情境没有绝对正确的标准答案，嵌入了“人际情感”与“规则诚信”两种价值的深层冲突，能够打破学生原有的道德认知平衡，让学生陷入困惑与思考，产生认知层面的失衡感。根据道德认知发展理论，认知冲突是道德发展的核心动力，只有当个体原有的道德认知无法应对新的价值矛盾时，才会主动反思、调整自身的判断标准，推动道德阶段升级。这一环节跳出了传统德育“直接讲规则、定对错”的模式，为学生的主动道德建构提供了情境载体。"},{"t":"组织民主讨论对话，引导自主建构，尊重道德发展的主体性","d":"导自主建构，尊重道德发展的主体性王老师没有直接评判对错、输出标准答案，而是组织学生展开讨论，引导学生自主思考道德判断的标准，这充分体现了对学生道德建构主体性的尊重。道德认知发展理论认为，道德不是外部灌输的产物，而是个体在人际互动与思想碰撞中主动建构的结果。在讨论过程中，不同学生基于自身的道德水平提出不同的判断依据，观点的碰撞会不断冲击学生原有的认知框架，促使学生重新审视自身的判断逻辑，修正片面的道德认知。这一过程中，教师的角色是引导者而非灌输者，通过适时的追问与点拨，推动学生的道德思考从表面走向深入，从他律走向自律。"},{"t":"形成班级诚信公约，实现团体公正，完成道德规则的内化","d":"现团体公正，完成道德规则的内化课后引导学生共同制定班级诚信公约，是团体公正法在班级德育中的具体实践。道德认知发展模式认为，由学生集体民主讨论、共同制定的规则，比教师自上而下强加的规则更具内在约束力。学生在参与制定公约的过程中，不仅能够深化对诚信原则的理解，更能够产生对规则的认同感与责任感，从“被动遵守他人制定的规则”转向“主动践行自己认同的准则”，实现道德规则的内化。这一环节将道德认知与道德实践衔接起来，让抽象的道德判断转化为具体的行为准则，完成了从认知到行为的落地。综上，道德认知发展模式的德育实施遵循“情境引入—冲突激发—对话建构—规则内化”的基本路径。"}]},{"t":"（2）中李老师的做法及学校“三全育人”理念","items":[{"t":"体谅模式的核心主张","d":"#####（2）结合材料二中李老师的做法及学校“三全育人”理念，阐述体谅模式的核心主张及其对学校德育的启示。【解析】体谅模式是以道德情感为核心的人本主义德育范式，其核心主张围绕“学会关心、学会体谅”展开，认为人际关怀是人的基本需要，道德教育的本质是在人际互动与情感体验中培养学生的关怀品质，而非理性化的规则灌输。材料二中李老师的日常育人实践与学校“三全育人”理念，与体谅模式的核心主张高度契合，为新时代学校德育提供了重要启示。"},{"t":"人际关怀是人的基本需要，是道德发展的前提","d":"体谅模式是以道德情感为核心的人本主义德育范式，其核心主张围绕“学会关心、学会体谅”展开，认为人际关怀是人的基本需要，道德教育的本质是在人际互动与情感体验中培养学生的关怀品质，而非理性化的规则灌输。材料二中李老师的日常育人实践与学校“三全育人”理念，与体谅模式的核心主张高度契合，为新时代学校德育提供了重要启示。"},{"t":"对学校德育的启示：结合李老师的实践与“全员、全过程、全方位”三全育人理念","d":"#####（2）结合材料二中李老师的做法及学校“三全育人”理念，阐述体谅模式的核心主张及其对学校德育的启示。【解析】体谅模式是以道德情感为核心的人本主义德育范式，其核心主张围绕“学会关心、学会体谅”展开，认为人际关怀是人的基本需要，道德教育的本质是在人际互动与情感体验中培养学生的关怀品质，而非理性化的规则灌输。材料二中李老师的日常育人实践与学校“三全育人”理念，与体谅模式的核心主张高度契合，为新时代学校德育提供了重要启示。"}]},{"t":"（3）结合新时代中小学“立德树人”根本要求","items":[{"t":"两种模式的核心差异","d":"第一，理论基础不同：认知理性与情感关怀的分野。道德认知发展模式以皮亚杰、科尔伯格的认知建构理论为根基，属于认知主义的德育范式，认为道德发展本质上是道德认知与判断能力的发展，遵循认知发展的阶段规律；体谅模式以人本主义的人际需要理论为根基，属于情感主义的德育范式，认为道德发展本质上是道德情感与人际关怀的发展，遵循情感发展的体验逻辑。第二，德育目标不同：判断提升与品质培养的侧重。道德认知发展模式的核心目标是提升学生的道德认知发展阶段，培养道德推理、价值判断与自主选择的能力，最终形成基于普遍道德原则的自律人格；体谅模式的核心目标是培养学生的人际关怀能力，形成同理。"},{"t":"理论基础不同：认知理性与情感关怀的分野","d":"认知理性与情感关怀的分野。道德认知发展模式以皮亚杰、科尔伯格的认知建构理论为根基，属于认知主义的德育范式，认为道德发展本质上是道德认知与判断能力的发展，遵循认知发展的阶段规律；体谅模式以人本主义的人际需要理论为根基，属于情感主义的德育范式，认为道德发展本质上是道德情感与人际关怀的发展，遵循情感发展的体验逻辑。第二，德育目标不同：判断提升与品质培养的侧重。道德认知发展模式的核心目标是提升学生的道德认知发展阶段，培养道德推理、价值判断与自主选择的能力，最终形成基于普遍道德原则的自律人格；体谅模式的核心目标是培养学生的人际关怀能力，形成同理心、责任感与关爱品质。"},{"t":"对我国中小学德育改革的共同借鉴意义","d":"#####（3）结合新时代中小学“立德树人”根本要求，论述道德认知发展模式与体谅模式在德育目标、方法、理论基础等方面的差异，分析两种模式对我国中小学德育改革的共同借鉴意义。【解析】道德认知发展模式与体谅模式分别从认知理性与情感体验两个维度探索德育规律，二者在理论基础、德育目标、实践方法上存在明显差异，但也具有内在的互补性。结合新时代立德树人的根本要求，吸收两种模式的合理内核，对推动中小学德育改革具有重要意义。"}]}]},{"id":"模拟10-10-36","num":36,"title":"36 认知策略","subject":"教心","blocks":[{"t":"（1）结合小郑和小唐的表现","items":[{"t":"小郑：复述策略机械浅层，注意策略缺乏选择","d":"层，注意策略缺乏选择第一，复述停留在被动机械重复层面，缺乏主动深度加工。有效的复述策略依赖主动回忆、尝试背诵、及时巩固等深度加工形式，而非被动的机械通读。小郑通读课本五遍，本质上是对文字的浅层感知重复，信息仅停留在短时记忆的感觉层面，没有通过合书回忆、自主背诵等主动复述环节完成深度编码，无法进入长时记忆，因此“合书就记不清”。同时，他的复述没有重点区分，对所有内容平均分配精力，核心知识没有得到强化加工，记忆的精准度自然不足。第二，注意缺失选择性，无法区分核心与次要信息。选择性注意是注意策略的核心功能，学习者需要主动筛选学习材料中的关键信息，将有限的认知资。"},{"t":"复述停留在被动机械重复层面，缺乏主动深度加工","d":"复层面，缺乏主动深度加工。有效的复述策略依赖主动回忆、尝试背诵、及时巩固等深度加工形式，而非被动的机械通读。小郑通读课本五遍，本质上是对文字的浅层感知重复，信息仅停留在短时记忆的感觉层面，没有通过合书回忆、自主背诵等主动复述环节完成深度编码，无法进入长时记忆，因此“合书就记不清”。同时，他的复述没有重点区分，对所有内容平均分配精力，核心知识没有得到强化加工，记忆的精准度自然不足。第二，注意缺失选择性，无法区分核心与次要信息。选择性注意是注意策略的核心功能，学习者需要主动筛选学习材料中的关键信息，将有限的认知资源集中于重点内容。小郑做笔记全抄板书，没有对信。"},{"t":"小唐：注意维持与选择双重失效，复述策略完全缺位","d":"双重失效，复述策略完全缺位第一，注意的稳定性与选择性双重不足。注意策略不仅要求精准筛选重要信息，还要求能够维持注意力的持续集中。小唐上课常走神、注意力难维持，说明其注意的稳定性不足，无法长时间将认知资源锚定在学习内容上，信息输入断断续续，难以形成连贯的记忆痕迹。同时，课本盲目划线、分不清重点，说明其选择性注意能力薄弱，无法识别核心信息，注意力被无关细节分散，导致信息加工抓不住本质。第二，复述环节完全缺位，缺乏主动记忆巩固。复述是将输入信息转化为持久记忆的必经环节，小唐只是被动听课、随意划线，既没有课堂中的即时复述巩固，也没有课后的系统复习，信息在短时记忆。"},{"t":"注意的稳定性与选择性双重不足","d":"双重不足。注意策略不仅要求精准筛选重要信息，还要求能够维持注意力的持续集中。小唐上课常走神、注意力难维持，说明其注意的稳定性不足，无法长时间将认知资源锚定在学习内容上，信息输入断断续续，难以形成连贯的记忆痕迹。同时，课本盲目划线、分不清重点，说明其选择性注意能力薄弱，无法识别核心信息，注意力被无关细节分散，导致信息加工抓不住本质。第二，复述环节完全缺位，缺乏主动记忆巩固。复述是将输入信息转化为持久记忆的必经环节，小唐只是被动听课、随意划线，既没有课堂中的即时复述巩固，也没有课后的系统复习，信息在短时记忆中停留短暂，很快就会发生遗忘，自然学习效果不佳。##。"}]},{"t":"（2）结合小何和小方的表现","items":[{"t":"小何：精细加工策略的适用边界与效果分化","d":"适用边界与效果分化精细加工策略的核心是对学习材料进行意义添加、联想建构，将新知识与个体原有经验建立联系，从而降低记忆难度、提升保持效果，谐音联想法、口诀法、编故事等都属于典型的记忆术类精细加工。这类策略适合处理零散、无意义、难识记的知识点，通过人为赋予意义降低记忆负荷。第一，适配场景下的正向效果：用谐音编口诀记元素符号效果显著，正是因为元素符号本身是无意义的字母组合，属于机械识记内容，谐音口诀为其赋予了熟悉的意义联想与记忆线索，大幅提升了记忆效率，体现了精细加工策略对零散识记内容的独特价值。第二，超范围使用的负面效果：用编故事法记元素性质递变规律，出现“。"},{"t":"小方：组织策略的价值与局限","d":"与局限组织策略的核心是对分散、孤立的知识进行整合归类，梳理内在逻辑联系，形成系统化的知识结构，概念关系图是典型的组织策略形式。这类策略适合处理体系性强、逻辑关联紧密的知识，通过构建结构减轻记忆负担，提升信息检索效率。第一，适配学科的显著效果：生物学科知识具有强关联性、体系性，概念关系图能够清晰梳理知识点之间的内在逻辑，将零散的概念整合成系统的知识网络，不仅大幅提升复习效率，也促进了知识的深层理解，体现了组织策略对体系化知识的核心价值。第二，应用场景的固有局限：“耗时久，难适用于所有学科”，反映了组织策略的应用边界。一方面，构建概念关系图需要花费大量时间梳。"},{"t":"两类策略的效果差异总结：从效果周期看","d":"结从效果周期看，精细加工策略短期记忆提升明显，适合快速识记零散知识点，但深度不足、迁移性弱、保持时间短；组织策略建构深层知识结构，长期保持效果好、迁移性强，但前期投入大、耗时久。从适用条件看，精细加工更适合机械识记类内容，对能力要求低、易上手；组织策略更适合体系性知识，对归纳能力要求高、需系统训练。#####（3）结合认知策略的教学要求，评析教研会上两位教师的观点，阐述教师应如何有效指导学生运用认知策略。【解析】教研会上的两种观点，分别从个体差异与学习动机两个视角看待学习策略问题，各有其现实合理性，但都走向了极端，忽视了认知策略本身的科学性与教师的专业指。"}]},{"t":"（3）结合认知策略的教学要求","items":[{"t":"对两种观点的辩证评析：第一种观点“方法无好坏","d":"第一种观点“学生需要外部压力，考试排名是必要驱动力”，看到了外部动机的维持功能，具有现实合理性，但过度强调外部压力，忽视了动机内化的长远价值。对于自我调节能力尚不足的中小学生，适度的外部压力与评价确实能够维持基本的学习行为，保障基本的教学秩序。考试排名作为一种外部评价机制，能够在一定程度上激发学生的竞争动力，维持学习投入，这是其不可否认的现实意义。但这种观点的局限也十分明显：过度依赖外部压力，会让学生的动机始终停留在外部调节层面，无法实现深度内化，甚至会削弱内在动机，加剧“无排名不学习”的依赖症。长期来看，不利于培养学生自主学习的能力与终身学习的意识，也。"},{"t":"教师有效指导学生运用认知策略的实践路径","d":"认知策略的实践路径第一，系统教授策略知识，分类开展方法指导。教师要结合学科教学，系统向学生传授各类认知策略的具体操作方法：针对注意策略，教授关键词标注、重点筛选、目标引导法，提升选择性注意与持续注意能力；针对复述策略，教授尝试回忆、及时复习、分散复习、自问自答等方法，推动从机械复述向深度复述转型；针对精细加工策略，教授意义联想、新旧知识对接、本质理解式加工等方法，避免表层无效加工；针对组织策略，教授列提纲、画概念图、做对比表格等方法，构建结构化知识体系。第二，尊重个体差异，引导策略优化升级。不搞“一刀切”的策略统一，承认学生的风格差异，同时针对学生的策略。"},{"t":"系统教授策略知识，分类开展方法指导","d":"类开展方法指导。教师要结合学科教学，系统向学生传授各类认知策略的具体操作方法：针对注意策略，教授关键词标注、重点筛选、目标引导法，提升选择性注意与持续注意能力；针对复述策略，教授尝试回忆、及时复习、分散复习、自问自答等方法，推动从机械复述向深度复述转型；针对精细加工策略，教授意义联想、新旧知识对接、本质理解式加工等方法，避免表层无效加工；针对组织策略，教授列提纲、画概念图、做对比表格等方法，构建结构化知识体系。第二，尊重个体差异，引导策略优化升级。不搞“一刀切”的策略统一，承认学生的风格差异，同时针对学生的策略缺陷进行个性化指导。比如帮助小郑从“全抄通读。"}]}]}]},{"id":"预测6-1","name":"预测1","questions":[{"id":"预测6-1-31","num":31,"title":"31 董颜韩·汉唐儒学","subject":"中教史","blocks":[{"t":"董仲舒：汉代儒学官方化的教育体系构建","items":[{"t":"三大文教政策奠定儒学正统格局","d":"正统格局董仲舒在贤良对策中提出的三大文教主张，成为汉武帝时期文教制度的核心依据。一是独尊儒术，以思想统一服务于政治大一统，将儒学确立为国家正统意识形态，终结了汉初百家并存的思想格局；二是兴太学，设立中央官学作为培养统治人才的核心机构，以儒家经典为核心教学内容，建立官方化的人才培养体系；三是重选举，将儒学素养作为人才选拔的核心标准，推动选官制度与儒学教育深度绑定。三大政策共同构建了儒学与国家权力结合的制度基础，使儒学教育从民间学说上升为国家主导的教育体系。"},{"t":"性三品说与教育的双重作用","d":"作用董仲舒提出“性三品”的人性论，将人性划分为三个等级：圣人之性、中民之性、斗筲之性。圣人能够自觉节制欲望，天生向善；斗筲之人欲望强烈且难以自我约束，趋向为恶，只能依靠刑罚约束；中民之性是大多数人的本性，也是教育的主要对象。在教育作用上，对个体而言，“性非教化不成”，教育能够引导中民之性向善发展，完成人性的塑造；对社会而言，教育是治国的根本，一方面能够培养合格的统治人才，另一方面能够推行社会教化，维护社会秩序。这一理论打破了先秦平等的人性论，为封建等级制度与教育的阶级性提供了理论支撑。"},{"t":"三纲五常为核心的道德教育","d":"教育董仲舒将道德教育视为立政之本，主张德主刑辅，以道德教化为实现仁政的核心手段。在德育内容上，他系统提出“三纲五常”体系：“君为臣纲、父为子纲、夫为妻纲”确立了封建社会的基本伦理秩序，“仁、义、礼、智、信”构成了个体道德修养的核心准则。纲常体系的建立，使道德教育有了明确的标准，成为中国封建社会道德教育的核心内容。在德育原则与方法上，他提出重义轻利的价值追求，主张“正其谊不谋其利，明其道不计其功”；强调“以仁安人，以义正我”，兼顾对他人的尊重与个体的社会责任；主张道德修养中仁智统一、知行合一，同时重视道德情感的培养，激发人性中善的一面。"}]},{"t":"颜之推：魏晋乱世中的家庭教育传承","items":[{"t":"士大夫教育的价值定位：颜之推从士族阶层的立场出发，系统论证了士大夫重视教育的必要性","d":"颜之推从士族阶层的立场出发，系统论证了士大夫重视教育的必要性。从人性论角度，他延续了性三品的观点，认为士族子弟多属中庸之人，必须通过教育才能获得知识、完善品性；从阶层维持角度，士大夫要保持自身的社会地位，必须通过教育掌握专门知识，以知识作为身份与地位的支撑；从现实生存角度，知识本身也是一种谋生手段，能够保障家族在乱世中的存续。"},{"t":"德艺周厚的教育内容：颜之推提出教育的目标是培养对国家有实际效用的治国人才","d":"颜之推提出教育的目标是培养对国家有实际效用的治国人才，主张人才应当专精一职，因此教育内容必须兼顾“德”与“艺”两个方面。德育居于根本地位，以儒家孝悌仁义为核心，树立仁义信念、践行仁义道德是德育的最终目标；艺的内容涵盖广泛，既包括经史百家等书本知识，也包括琴、棋、书、画、数、医、射、投壶等士大夫社会生活必备的“杂艺”。此外，他还特别提出士大夫应当了解农业生产知识，知晓稼穑之艰难，避免脱离实际。"},{"t":"系统的家庭教育原则：颜之推系统总结了家庭教育的实践经验，提出了一系列具体的教育原则","d":"颜之推系统总结了家庭教育的实践经验，提出了一系列具体的教育原则。一是及早施教，认为幼年是奠定人生基础的关键阶段，教育应当尽早开始，甚至可以从胎教做起；二是严慈相济，主张将慈爱与严格要求相结合，反对无原则的溺爱，认为严格教育才能收到实效；三是均爱原则，强调对所有子女一视同仁，避免偏宠带来的教育不公与家庭矛盾；四是重视语言教育，强调儿童语言学习要规范，注重通用语言的培养，反对方言的片面强调；五是重视品德教育，一方面主张以“风化”的方式，通过长辈的道德示范对儿童进行潜移默化的熏陶，另一方面强调立志教育，引导子弟树立家国志向、注重气节修养。"}]},{"t":"韩愈：唐代儒学复兴中的教育重建","items":[{"t":"道统说与儒学正统的重建：韩愈在思想文化领域提出“道统说”","d":"建韩愈在思想文化领域提出“道统说”，将仁义道德视为儒家历代圣人相传的核心精神，梳理出儒家圣人的传承谱系，以此证明儒学的源远流长与正统地位，抗衡佛教的传法世系。他发出“尊孔孟、排异端”的号召，主张以孔孟之道作为国家统一的思想支柱，服务于维护中央集权、反对藩镇割据的政治需求。道统说的提出，强化了儒学的文化主体意识，为儒学教育的复兴提供了思想依据。"},{"t":"性三品论与教育的边界：韩愈继承并发展了性三品说","d":"韩愈继承并发展了性三品说，从天命论出发将人性划分为上、中、下三品，同时区分了“性”与“情”：性是天生的，内含仁、义、礼、智、信五种道德要素，是善的；情是后天习染的，是恶的来源。基于这一人性论，教育的作用呈现出层级差异：上品之人的善性能够通过教育得到充分发扬；中品之人具备可改造性，是教育的主要对象，通过教育可以引导其向上品靠拢；下品之人天性恶劣，无法接受教育，只能依靠刑罚约束其行为。与之对应，教育权利也与人性等级匹配，统治阶级享有受教育权，被统治阶级则以刑罚管控，教育内容以儒家五常与五经为核心。这一理论既肯定了教育的教化作用，也划定了教育的边界，为封建等级。"},{"t":"师道运动与师生关系的重构","d":"重构韩愈最具代表性的教育贡献是倡导师道运动，其《师说》系统阐述了尊师重道的教育思想。首先，他从“人非生而知之”的认识论出发，提出“学者必有师”，肯定了教师在学习中的必要性与社会价值；其次，明确教师的基本任务是“传道、授业、解惑”，其中传道是核心，授业与解惑都服务于儒家仁义之道的传承；再次，确立了“道之所存，师之所存”的求师标准，主张学无常师，不以年龄、地位为评判标准，只要有道就可为师；最后，提出了民主性的师生关系，认为“弟子不必不如师，师不必贤于弟子”，师生之间可以相互学习、教学相长。这一思想打破了门第与身份的限制，重构了儒家的师生伦理。"},{"t":"人才培养与科举批判：韩愈认为治国人才必须依靠教育培养，主张将教育作为首要的政治工具","d":"韩愈认为治国人才必须依靠教育培养，主张将教育作为首要的政治工具。他提出学校既是宣扬封建道德的中心，也是训练官吏的机构，应当重视学校建设，整顿国子监的招生与学官选任制度，恢复正常教学秩序；同时主张发展地方学校，肯定乡校在基层教化中的作用。针对当时科举制度的弊端，他结合自身经历批判科举考试内容不合理、选拔标准僵化，认为科举难以选拔真正的治国大才，主张统治者爱惜人才，不拘一格选拔人才，扩大教育与选拔的范围。"}]},{"t":"汉唐儒学教育的演变脉络","items":[{"t":"教育载体从官方垄断走向家族承接再到官方与民间互动","d":"向家族承接再到官方与民间互动。汉代通过独尊儒术与兴太学，建立了以官学为核心的官方教育体系，儒学教育完全服务于国家政治；魏晋南北朝社会动荡，官学体系崩坏，儒学教育退入家族内部，以家训、家学为主要载体，承担起文化传承的功能；唐代在重建官学体系的同时，韩愈倡导师道运动，推动民间讲学与师道传承，形成了官学与私学互动的格局。第二，教育功能从政治伦理建构转向家族秩序维系再到文化道统复兴。汉代教育的核心功能是构建国家层面的纲常伦理，服务于大一统政治；魏晋时期教育的重心下沉到家族内部，核心功能是维系家族门第、培养子弟安身立命的能力；唐代教育则回归文化本位，以复兴儒道、重。"},{"t":"教育功能从政治伦理建构转向家族秩序维系再到文化道统复兴","d":"构转向家族秩序维系再到文化道统复兴。汉代教育的核心功能是构建国家层面的纲常伦理，服务于大一统政治；魏晋时期教育的重心下沉到家族内部，核心功能是维系家族门第、培养子弟安身立命的能力；唐代教育则回归文化本位，以复兴儒道、重建文化正统为核心目标，重新确立儒学的文化主导地位。第三，教育精神从神学附会走向现实实用再到人文回归。汉代儒学掺杂天人感应的神学色彩，教育带有强烈的神学目的论倾向；魏晋南北朝的家学教育更注重现实生存，教育内容兼顾道德与实用技艺，贴近士大夫的生活实际；唐代韩愈的教育思想剥离了神学附会，回归儒家的人文精神，强调人的道德自觉与师道传承，推动儒学教育。"},{"t":"教育精神从神学附会走向现实实用再到人文回归","d":"向现实实用再到人文回归。汉代儒学掺杂天人感应的神学色彩，教育带有强烈的神学目的论倾向；魏晋南北朝的家学教育更注重现实生存，教育内容兼顾道德与实用技艺，贴近士大夫的生活实际；唐代韩愈的教育思想剥离了神学附会，回归儒家的人文精神，强调人的道德自觉与师道传承，推动儒学教育向理性化、人文化的方向发展，为宋明理学教育的兴起奠定了思想基础。####32.请简述马恩核心教育思想，对比马卡连柯与苏霍姆林斯基关于集体教育与个性发展的思想差异及时代背景，结合赞科夫教学理论总结苏联马克思主义教育思想的演进特征与现实启示。【解析】马克思、恩格斯立足辩证唯物主义与历史唯物主义，结。"}]}]},{"id":"预测6-1-32","num":32,"title":"32 马恩与苏联教育","subject":"外教史","blocks":[{"t":"马克思、恩格斯教育思想的核心理论内核","items":[{"t":"教育的社会本质与发展规律","d":"规律马克思、恩格斯明确提出，教育具有鲜明的历史性与阶级性，教育的发展形态、性质、功能由社会关系与生产力水平决定，随社会制度变革而迭代更新。同时教育具备相对独立性，存在自身发展规律与历史继承性，并非完全被动依附于社会发展。二者打破空想社会主义抽象人性论的认知误区，指出资本主义教育的弊端根源在于私有制与阶级剥削，而非单纯的人性缺失，唯有变革社会制度，才能从根本上实现教育公平与人的解放。"},{"t":"教育与生产劳动相结合的核心论断","d":"的核心论断在批判继承空想社会主义思想的基础上，马、恩科学论证了教育与生产劳动结合的历史必然性。机器大工业生产要求劳动者具备多元素养、适配职业迭代，为教劳结合提供了物质基础与现实需求。二者明确，教育与生产劳动相结合是提高社会生产力、改造社会、造就全面发展人才的唯一根本方法，依托综合技术教育搭建理论与实践的桥梁，实现脑力劳动与体力劳动的有机统一。"},{"t":"人的全面发展的终极教育目标","d":"育目标人的全面发展是马恩教育思想的核心内核。其核心内涵是摆脱旧式分工造成的人的片面、畸形发展，实现人的体力、智力、道德、个性、审美等全方位、自由充分的发展，最终实现人的彻底解放。这一目标的实现以高度发达的生产力、废除私有制、消灭阶级差异为社会基础，依托德育、智育、体育、综合技术教育协同推进，是社会主义教育的终极价值追求。"},{"t":"人的发展的辩证规律：马、恩辩证阐释了遗传、环境、教育与主观能动性的关系","d":"马、恩辩证阐释了遗传、环境、教育与主观能动性的关系，否定旧唯物主义将人视为环境被动产物的片面观点。认为遗传是人发展的生理前提，社会环境与教育主导人的社会化发展，而人能够通过社会实践能动地改造环境、重塑自我，凸显了实践在人的个性形成与素养发展中的核心作用。"}]},{"t":"马卡连柯与苏霍姆林斯基对集体教育与个性发展的差异化理解及时代…","items":[{"t":"二者核心思想的差异化理解","d":"理解1\\.马卡连柯：集体优先，在集体规范中发展个性马卡连柯严格承袭马克思主义集体主义与人的社会性发展理论，核心主张“在集体中、通过集体、为了集体”开展教育。他认为个人无法脱离社会集体独立发展，集体是个人成长的载体与归宿，教育的首要任务是培育集体主义者。其理论突出集体的规范性、纪律性与社会性，提出平行教育影响、前景教育、尊重与严格要求相结合等原则，强调通过统一的集体目标、严格的纪律制度、规范的集体舆论塑造学生品格。在集体与个性的关系中，他坚持集体利益高于个人利益，个性发展必须服从集体发展需求，杜绝极端个人主义，个性发展是集体规范框架内的差异化成长，侧重通过。"},{"t":"差异化思想的时代成因：1\\.马卡连柯思想的时代背景：马卡连柯活跃于苏联建国初期","d":"1\\.马卡连柯思想的时代背景：马卡连柯活跃于苏联建国初期，社会动荡、百废待兴，大量流浪儿童、问题青少年亟待改造，社会秩序与集体意识亟待重建。此时苏联教育的核心任务是凝聚社会力量、改造落后国民、培育社会主义建设者与守护者，亟需通过严格的集体教育、纪律教育、劳动教育规整个体行为、树立集体观念、稳固新生政权。特殊的社会重建需求，决定了其教育思想以集体规范、纪律约束、社会改造为核心。2\\.苏霍姆林斯基思想的时代背景：苏霍姆林斯基处于二战后苏联稳定发展时期，社会经济、教育体系日趋完善，大规模社会改造任务完成。此时苏联教育摆脱了初创期的功利化、规范化需求，不再单纯追。"}]},{"t":"苏联马克思主义教育思想的整体演进特征（结合赞科夫发展性教学理…","items":[{"t":"价值取向：从社会本位向社会与个体双向统一演进","d":"【解析】配齐体美劳教师、落实五育并举，体现全面发展价值取向；推进城乡办学共同体、缩小校际差距，体现教育公平；规范办学、减轻学生课业负担，体现减负提质；推行分层个性化作业、适配学生学情，体现因材施教。因此依次为全面发展、教育公平、减负提质、因材施教，选B。"},{"t":"实践范式：从纪律规训向科学发展、人文育人转型","d":"从纪律规训向科学发展、人文育人转型苏联早期教育侧重制度规范、纪律约束、劳动改造，具备较强的工具性；苏霍姆林斯基融入人文关怀，构建五育融合的和谐教育体系；赞科夫以科学教学规律为支撑，打破传统机械教学模式，倡导发展性、启发性教学，推动社会主义教育从经验化、工具化走向科学化、人本化。"},{"t":"目标定位：从片面育才向人的完整全面发展深化","d":"从片面育才向人的完整全面发展深化马卡连柯侧重培育具备集体意识、劳动能力的合格建设者；苏霍姆林斯基追求个体德智体美劳全面和谐发展；赞科夫突破单一智育局限，关注学生综合心理素养与终身发展能力，层层递进践行马克思主义人的全面发展理论，不断夯实社会主义教育的核心目标。"}]},{"t":"苏联马克思主义教育思想的现实启示","items":[{"t":"坚守教育的社会性与人民性，坚持立德树人根本任务","d":"民性，坚持立德树人根本任务。教育必须贴合社会发展需求，立足国家建设与时代发展培育人才，同时始终以人的全面发展为终极目标，实现育才与育人、社会发展与个体成长的统一。第二，统筹集体教育与个性发展，构建和谐育人体系。既要重视集体意识、团队精神、社会责任的培育，杜绝极端个人主义；又要尊重学生个体差异，因材施教，保护学生个性天赋与创新能力，避免机械同质化教育。第三，坚持教学与发展相统一，深化课堂教学改革。借鉴赞科夫发展性教学理论，立足学生身心发展规律，合理设置教学难度与进度，注重启发学生思维、掌握学习方法，实现知识传授与能力发展同步推进。第四，坚守教劳结合、五育融。"},{"t":"统筹集体教育与个性发展，构建和谐育人体系","d":"展，构建和谐育人体系。既要重视集体意识、团队精神、社会责任的培育，杜绝极端个人主义；又要尊重学生个体差异，因材施教，保护学生个性天赋与创新能力，避免机械同质化教育。第三，坚持教学与发展相统一，深化课堂教学改革。借鉴赞科夫发展性教学理论，立足学生身心发展规律，合理设置教学难度与进度，注重启发学生思维、掌握学习方法，实现知识传授与能力发展同步推进。第四，坚守教劳结合、五育融合的育人路径。承袭马恩教劳结合核心思想，融合苏联教育家实践经验，推动德育、智育、体育、美育、劳动教育协同发展，克服片面育人弊端，培育全面发展的时代新人。###材料分析题####33.阅读材。"},{"t":"坚持教学与发展相统一，深化课堂教学改革","d":"深化课堂教学改革。借鉴赞科夫发展性教学理论，立足学生身心发展规律，合理设置教学难度与进度，注重启发学生思维、掌握学习方法，实现知识传授与能力发展同步推进。第四，坚守教劳结合、五育融合的育人路径。承袭马恩教劳结合核心思想，融合苏联教育家实践经验，推动德育、智育、体育、美育、劳动教育协同发展，克服片面育人弊端，培育全面发展的时代新人。###材料分析题####33.阅读材料，回答问题。#####（1）结合材料二，运用马克思主义人的全面发展学说，分析该校全面发展教育的问题与实质。【解析】。"},{"t":"坚守教劳结合、五育融合的育人路径","d":"合的育人路径。承袭马恩教劳结合核心思想，融合苏联教育家实践经验，推动德育、智育、体育、美育、劳动教育协同发展，克服片面育人弊端，培育全面发展的时代新人。###材料分析题####33.阅读材料，回答问题。#####（1）结合材料二，运用马克思主义人的全面发展学说，分析该校全面发展教育的问题与实质。【解析】马克思主义人的全面发展学说认为，人的发展本质是智力与体力、思想与道德、个性与社会性的多维度、自由而充分的发展，最终实现脑力劳动与体力劳动相结合、个体发展与社会发展相统一，这是社会主义教育的根本理论遵循。对照这一理论，该校在推进全面发展教育中的实践偏差本质上。"}]}]},{"id":"预测6-1-33","num":33,"title":"33 全面发展学说·教育目的","subject":"教原","blocks":[{"t":"（1）运用马克思主义人的全面发展学说","items":[{"t":"发展维度片面化：重智育轻体美劳，割裂人的全面发展的整体性","d":"重智育轻体美劳，割裂人的全面发展的整体性马克思主义人的全面发展首先强调智力与体力的协调发展，同时涵盖道德、审美、劳动能力等多维度的素养提升，各维度发展相互支撑、有机统一。该校的办学实践呈现明显的“智育中心”倾向，直接割裂了发展的整体性。其一，体育发展被弱化：期中期末复习期间常态化挤占体育课，恶劣天气直接将体育课改为自习课，学生日常锻炼时长得不到制度性保障，身体素质发展被彻底边缘化，违背了体力发展是智力发展的物质基础的基本规律。其二，美育发展形式化：美育教学停留在理论宣讲、视频观看层面，缺乏动手创作、审美体验、场景感知等实践性环节，学生的审美感知、艺术表达。"},{"t":"育人实践表面化：重知识轻实践，背离理论与实践结合的发展路径","d":"重知识轻实践，背离理论与实践结合的发展路径人的全面发展是认知与实践、知识与能力的统一，必须在真实的实践活动中实现能力的提升与人格的完善。该校的体美劳教育普遍存在“重形式轻实质、重知识轻实践”的问题，使得全面发展沦为表面功夫。体育只重课时完成率，不重锻炼实效与体能提升；美育只重理论传递，不重审美体验与情感熏陶；劳动教育更是缺乏真实的劳动场景与岗位体验。学生的学习停留在间接的符号认知层面，没有通过亲身实践转化为内在的能力与素养。这种“纸上谈兵”的全面发展，违背了马克思主义“理论与实践相结合是人的全面发展最好途径”的核心论断，无法真正实现人的能力的全面提升。"},{"t":"评价导向功利化：重分数轻素养，将人异化为应试竞争的工具","d":"重分数轻素养，将人异化为应试竞争的工具马克思主义认为，人的全面发展的核心是人的自由发展，教育的价值在于促进每个社会成员的充分成长，而非将人作为实现外在目标的工具。该校的办学实践被升学竞争与分数导向主导，综合素质评价流于形式，多为期末集中补档、内容空洞，本质上是“唯分数、唯升学”的评价体系在发挥作用。在这种导向下，体美劳课程因为不直接计入升学分数，就被边缘化、形式化；学生的价值被简化为分数高低，人的全面发展被窄化为升学成绩的提升。这种模式将教育异化为应试竞争的工具，将学生异化为分数的载体，违背了“人的自由而全面发展”的根本价值追求，也偏离了社会主义教育的育。"},{"t":"问题的实质：应试教育逻辑下的发展异化","d":"应试教育逻辑下的发展异化该校出现的种种问题，表面上是课程落实不到位、育人形式主义严重，本质上是应试教育的办学逻辑与全面发展的育人目标的深层冲突。在升学竞争的压力下，学校和家长都将分数提升作为核心目标，人的全面发展让位于应试功利，最终导致人的发展的片面化、表面化与工具化，是对马克思主义人的全面发展学说的根本背离。#####（2）结合我国教育目的精神实质，评析该校教育实践偏差，说明正确教育质量观的核心要求。【解析】我国教育目的的精神实质是坚持社会主义办学方向，以培养德智体美劳全面发展的社会主义建设者和接班人为根本目标，以提高全民素质为宗旨，注重培养学生的独立。"}]},{"t":"（2）结合我国教育目的精神实质","items":[{"t":"对该校教育实践偏差的评析","d":"评析第一，偏离了“培养社会主义建设者和接班人”的总目标。社会主义教育的根本任务是培养合格的劳动者与建设者，要求人才具备思想政治素质、科学文化素质、健康体魄、审美素养与劳动能力的综合素养。该校将办学重心完全倾斜到文化课应试上，体美劳教育边缘化、形式化，培养出来的学生只能是“应试型选手”，而非能够承担建设使命的时代新人。只重智力发展、忽视综合素养的培养模式，不符合社会主义劳动者的全面素质要求，也偏离了为党育人、为国育才的根本方向。第二，偏离了德智体美劳全面发展的质量标准。我国教育目的明确将德、智、体、美、劳全面发展作为人才培养的质量标准，五育并举是社会主义教。"},{"t":"偏离了“培养社会主义建设者和接班人”的总目标","d":"建设者和接班人”的总目标。社会主义教育的根本任务是培养合格的劳动者与建设者，要求人才具备思想政治素质、科学文化素质、健康体魄、审美素养与劳动能力的综合素养。该校将办学重心完全倾斜到文化课应试上，体美劳教育边缘化、形式化，培养出来的学生只能是“应试型选手”，而非能够承担建设使命的时代新人。只重智力发展、忽视综合素养的培养模式，不符合社会主义劳动者的全面素质要求，也偏离了为党育人、为国育才的根本方向。第二，偏离了德智体美劳全面发展的质量标准。我国教育目的明确将德、智、体、美、劳全面发展作为人才培养的质量标准，五育并举是社会主义教育的核心育人方针。该校在实践中。"},{"t":"正确教育质量观的核心要求","d":"#####（2）结合我国教育目的精神实质，评析该校教育实践偏差，说明正确教育质量观的核心要求。【解析】我国教育目的的精神实质是坚持社会主义办学方向，以培养德智体美劳全面发展的社会主义建设者和接班人为根本目标，以提高全民素质为宗旨，注重培养学生的独立个性与创造精神。该校的教育实践在多个维度偏离了我国教育目的的精神实质，亟需树立科学的教育质量观。"}]},{"t":"（3）结合两则材料","items":[{"t":"人的全面发展学说对我国教育目的的指导意义","d":"#####（3）结合两则材料，论述人的全面发展学说对我国教育目的的指导意义，分析新时代基础教育落实全面发展教育的实践路径。【解析】马克思主义人的全面发展学说是我国教育目的的理论基石，为新时代基础教育改革指明了根本方向，对落实五育并举、推进健康学校建设、破解综合育人弱化难题具有根本性的指导意义。"},{"t":"确立了科学的人的发展观，为教育目的奠定了理论根基","d":"观，为教育目的奠定了理论根基。人的全面发展学说从人的本质与社会发展规律出发，揭示了人的发展是多维度、整体性、历史性的过程，打破了片面的“知识本位”“分数本位”发展观，为我国确立“培养德智体美劳全面发展的社会主义建设者和接班人”的教育目的提供了根本的理论遵循。材料中教育部印发健康学校建设指导意见，提出五育并举、全面发展，正是这一理论在新时代教育领域的具体体现。第二，指明了教育的根本价值方向，坚持育人为本的本质立场。该学说强调人是教育的目的而非工具，人的自由而全面的发展是教育的终极价值，从根本上纠正了“教育为升学服务、人为分数服务”的异化导向，为新时代基础教。"},{"t":"新时代基础教育落实全面发展教育的实践路径","d":"#####（3）结合两则材料，论述人的全面发展学说对我国教育目的的指导意义，分析新时代基础教育落实全面发展教育的实践路径。【解析】马克思主义人的全面发展学说是我国教育目的的理论基石，为新时代基础教育改革指明了根本方向，对落实五育并举、推进健康学校建设、破解综合育人弱化难题具有根本性的指导意义。"}]}]},{"id":"预测6-1-34","num":34,"title":"34 皮亚杰·维果茨基","subject":"教心","blocks":[{"t":"（1）依据皮亚杰认知发展理论","items":[{"t":"小明：处于前运算阶段，尚未形成守恒认知","d":"尚未形成守恒认知小明仅依托直观视觉表象判断物体状态，认为橡皮泥形态改变会导致重量、体积发生变化，完全符合前运算阶段的认知特征。第一，思维受直观表象主导，未获得守恒概念。前运算阶段的儿童认知活动高度依赖具体的视觉感知，难以透过现象把握事物的本质属性，因此会被物体形态的外在变化干扰，无法认识到质量、重量等内在属性的恒定性。小明判断的依据完全是橡皮泥外形的视觉变化，没有意识到材质与总量的恒定，正是质量、重量守恒概念尚未建立的典型表现，这是前运算阶段最核心的认知局限。第二，思维具有单维度性与刻板性，缺乏可逆与补偿运算。前运算阶段的儿童思考问题时往往只能聚焦于事物。"},{"t":"小红：处于具体运算阶段初期，初步获得守恒认知","d":"段初期，初步获得守恒认知小红坚持物体材质恒定，外形变化不会改变物体本身的质量与重量，说明其认知发展已经迈入具体运算阶段的初期，具备了具体运算的核心特征。第一，初步形成守恒认知，把握事物的本质属性。守恒性是具体运算阶段的根本标志，指个体能够认识到物体的总量不因形态、位置、外观的变化而改变。小红能够脱离外形变化的干扰，抓住材质不变这一核心前提，判断质量与重量恒定，说明其已经初步建立了质量守恒的认知结构，能够透过现象把握本质，这是具体运算阶段的核心成就。第二，思维具备可逆性与补偿性的萌芽，能够进行多维度思考。具体运算阶段的思维不再刻板单维，能够同时关注事物的多。"}]},{"t":"（2）结合维果茨基最近发展区理论","items":[{"t":"教师教学行为的合理性与价值","d":"与价值第一，趣味探究活动的设计，锚定学生现有发展水平。教师结合低年级学生具象思维为主的认知特点，设计“橡皮泥沉浮探秘”的动手探究课堂，用真实的操作、直观的现象承载科学知识，符合低年级学生的认知发展水平，为学生搭建了从具象感知走向抽象认知的桥梁，保障了探究活动在学生可及的范围内展开，是最近发展区教学的基础前提。第二，统一提供支架支持，降低探究的入门门槛。教师为学生统一配备实验器材与记录表单，相当于为学生的探究提供了工具支架与方法支架，避免了学生因器材、方法障碍而无法开展探究，让学生能够将精力集中在探究本身，支持学生在现有水平基础上完成探究任务，体现了支架式。"},{"t":"趣味探究活动的设计，锚定学生现有发展水平","d":"锚定学生现有发展水平。教师结合低年级学生具象思维为主的认知特点，设计“橡皮泥沉浮探秘”的动手探究课堂，用真实的操作、直观的现象承载科学知识，符合低年级学生的认知发展水平，为学生搭建了从具象感知走向抽象认知的桥梁，保障了探究活动在学生可及的范围内展开，是最近发展区教学的基础前提。第二，统一提供支架支持，降低探究的入门门槛。教师为学生统一配备实验器材与记录表单，相当于为学生的探究提供了工具支架与方法支架，避免了学生因器材、方法障碍而无法开展探究，让学生能够将精力集中在探究本身，支持学生在现有水平基础上完成探究任务，体现了支架式教学的核心思路。第三，利用认知冲。"},{"t":"教师教学行为的局限与不足","d":"不足第一，统一任务设计，未兼顾学生的最近发展区差异。教师采用统一的器材、统一的记录表单、统一的探究流程，没有考虑到不同学生的认知发展差异。小明还处于前运算阶段，现有水平较低，统一的探究任务对他而言可能挑战过大；小红已经初步具备守恒认知，统一任务又可能挑战性不足。一刀切的任务设计，无法让每个学生都在自己的最近发展区内获得最优发展。第二，同伴互动的价值未充分挖掘，合作支架作用发挥不足。两名学生的认知分歧本身是宝贵的合作学习资源，但教师没有引导学生通过同伴讨论、互助验证解决分歧，更多是通过教师引导与集体实验推进探究，没有充分发挥异质同伴互动对认知发展的促进作用。"},{"t":"统一任务设计，未兼顾学生的最近发展区差异","d":"学生的最近发展区差异。教师采用统一的器材、统一的记录表单、统一的探究流程，没有考虑到不同学生的认知发展差异。小明还处于前运算阶段，现有水平较低，统一的探究任务对他而言可能挑战过大；小红已经初步具备守恒认知，统一任务又可能挑战性不足。一刀切的任务设计，无法让每个学生都在自己的最近发展区内获得最优发展。第二，同伴互动的价值未充分挖掘，合作支架作用发挥不足。两名学生的认知分歧本身是宝贵的合作学习资源，但教师没有引导学生通过同伴讨论、互助验证解决分歧，更多是通过教师引导与集体实验推进探究，没有充分发挥异质同伴互动对认知发展的促进作用，也没有让学生在合作中实现能力。"},{"t":"合作学习赋能认知发展的优化建议","d":"#####（2）结合维果茨基最近发展区理论，评析教师教学行为，提出合作学习赋能认知发展的优化建议。【解析】维果茨基的最近发展区理论认为，儿童的发展存在两个水平：一是独立解决问题的现有发展水平，二是在成人帮助、同伴合作下能够达到的潜在发展水平，二者的差距就是最近发展区。教学应当走在发展的前面，落在最近发展区内，通过支架支持、合作互动，引导学生跨越发展差距，实现认知进阶。材料中教师的教学行为整体契合最近发展区的核心逻辑，但也存在一定的优化空间。"}]},{"t":"（3）对比皮亚杰与维果茨基认知理论差异","items":[{"t":"皮亚杰与维果茨基认知理论的核心差异","d":"#####（3）对比皮亚杰与维果茨基认知理论差异，阐述二者对探究式教学的启示。【解析】皮亚杰的认知建构理论与维果茨基的文化历史理论，分别从个体内部建构与社会文化驱动两个维度揭示了儿童认知发展的规律，二者在发展动力、阶段特征、教育作用等方面存在核心差异，也从不同层面为探究式教学提供了理论指引，二者互补共同构成科学探究教学的理论基础。"},{"t":"发展的动力与本质不同：个体自主建构vs社会文化驱动","d":"个体自主建构vs社会文化驱动。皮亚杰认为，认知发展本质上是个体通过同化、顺应不断实现认知平衡的主动建构过程，动力源于个体内部的认知失衡，是个体成熟与物理经验共同作用的结果，社会经验只是影响因素之一。维果茨基则认为，认知发展本质上是社会文化经验内化的过程，高级心理机能的发展依赖于语言、符号等精神工具的中介，源于个体与社会的互动，社会文化与教育是认知发展的核心驱动力。第二，发展的阶段与路径不同：普遍阶段vs文化差异。皮亚杰提出了具有普遍性的四阶段发展模型，认为所有儿童的认知发展都遵循相同的顺序，阶段有明确的年龄边界，发展路径具有普遍性。维果茨基不认同固定的发。"},{"t":"对探究式教学的启示：两种理论从不同维度为探究式教学提供了理论支撑","d":"#####（3）对比皮亚杰与维果茨基认知理论差异，阐述二者对探究式教学的启示。【解析】皮亚杰的认知建构理论与维果茨基的文化历史理论，分别从个体内部建构与社会文化驱动两个维度揭示了儿童认知发展的规律，二者在发展动力、阶段特征、教育作用等方面存在核心差异，也从不同层面为探究式教学提供了理论指引，二者互补共同构成科学探究教学的理论基础。"},{"t":"皮亚杰理论的启示：遵循发展规律，突出自主建构","d":"遵循发展规律，突出自主建构第一，探究设计要适配认知阶段，贴合学生思维特点。探究式教学不能脱离学生的认知发展水平，低年级科学探究必须坚持具象化、操作化的原则，以直观实验、动手操作为核心，避免过早的抽象概念灌输与符号运算。正如材料中的“橡皮泥沉浮探秘”，通过真实的物体操作承载科学概念，符合低年级学生具体形象思维的特点，是适宜的探究形式。第二，重视认知冲突的价值，激发主动建构动力。认知失衡是认知发展的内在动力，探究教学要善于创设问题情境，制造认知冲突，让学生在“现有认知无法解释新现象”的失衡感中，主动调整认知结构，实现知识的主动建构。材料中学生的观点分歧本身就。"},{"t":"探究设计要适配认知阶段，贴合学生思维特点","d":"段，贴合学生思维特点。探究式教学不能脱离学生的认知发展水平，低年级科学探究必须坚持具象化、操作化的原则，以直观实验、动手操作为核心，避免过早的抽象概念灌输与符号运算。正如材料中的“橡皮泥沉浮探秘”，通过真实的物体操作承载科学概念，符合低年级学生具体形象思维的特点，是适宜的探究形式。第二，重视认知冲突的价值，激发主动建构动力。认知失衡是认知发展的内在动力，探究教学要善于创设问题情境，制造认知冲突，让学生在“现有认知无法解释新现象”的失衡感中，主动调整认知结构，实现知识的主动建构。材料中学生的观点分歧本身就是宝贵的教学资源，教师要充分利用这种冲突，激发学生的。"}]}]},{"id":"预测6-1-35","num":35,"title":"35 五育并举·立德树人","subject":"教原","blocks":[{"t":"（1）分析五育的核心育人价值","items":[{"t":"五育的核心育人价值：五育构成了完整的育人体系，每个维度都承载着独特的育人功能，缺一不可","d":"#####（1）结合材料，分析五育的核心育人价值，指出当前中小学五育落实的认知偏差。【解析】全面发展教育是我国教育方针的核心组成部分，由德育、智育、体育、美育、劳动教育五个维度构成，五育各有其不可替代的育人定位与功能价值，共同支撑着培养德智体美劳全面发展的社会主义建设者和接班人的根本目标。当前基层中小学五育落实不均衡、形式化等问题，本质上是对五育的价值定位、相互关系与实践逻辑存在认知偏差，偏离了全面育人的本质要求。"},{"t":"德育：灵魂统帅，锚定育人根本方向","d":"育人根本方向。德育是引导学生树立正确价值观念、涵养道德品质、厚植家国情怀的教育，在五育中居于引领地位，集中体现了我国教育的社会主义性质与价值取向。它不仅为学生的人生发展指明正确方向，也为其他各育提供价值引领与精神动力，确保教育始终沿着为党育人、为国育才的轨道推进。离开了德育的引领，教育就会迷失方向，沦为单纯的知识传授与技能训练。"},{"t":"智育：知识基础，提供核心能力支撑","d":"核心能力支撑。智育是系统传授科学文化知识、发展学生智力与思维能力的教育，是学生认识世界、提升实践本领的核心载体。它既帮助学生掌握自然规律与社会规律，提升分析和解决问题的能力，也为其他各育的实施提供认知基础与智力支持，是学生发展不可或缺的核心组成部分。"},{"t":"体育：生理根基，保障育人物质前提","d":"育人物质前提。体育是传授健身知识技能、增强学生体质、锻炼意志品质的教育。强健的体魄是学生学习、生活、社会实践的物质基础，也是各育实施的机体保障。同时，体育锻炼还能培养规则意识、合作精神与抗挫能力，发挥综合性的育人价值，是学生全面发展的物质基础。"},{"t":"美育：精神涵养，发挥协调润色功能","d":"协调润色功能。美育是培养学生审美感知、审美鉴赏与审美创造能力的教育，能够净化心灵、陶冶情操、激发对美好生活的向往。美育不仅自身是全面发展的重要维度，还能够协调、渗透于其他各育之中：提升德育的感染力、智育的创造力、体育的表现力，是育人体系中不可或缺的润色与动力。"}]},{"t":"（2）运用全面发展教育内部关系理论","items":[{"t":"对该校实施困境的评析：该校全面推进五育并举改革","d":"该校全面推进五育并举改革，契合新时代基础教育改革的方向，抓住了全面育人的核心要求，具有重要的现实必要性与正确性。但改革过程中出现文化课成绩波动、家长质疑的困境，折射出深层的认知与实践问题。第一，困境的核心是“五育对立”的认知误区。部分家长乃至部分教育者认为，强化体美劳必然挤压智育资源、拉低学业成绩，将五育视为零和博弈。这种认知违背了五育相互促进的内在规律。从短期来看，改革调整了传统的教学时间分配与教学模式，学生适应新体系需要过程，可能出现成绩的暂时波动，这是改革转型的正常阵痛，而非五育本身的负面效果。第二，实践中五育融合不足，协同效应尚未显现。该校的五育。"},{"t":"突破困境的实践路径：遵循全面发展教育的内部关系规律","d":"遵循全面发展教育的内部关系规律，该校需要从协同、融合、沟通、提质四个维度系统推进，实现五育的良性互动。"},{"t":"把握整体性规律，构建五育协同育人体系","d":"五育协同育人体系。打破“各育分开、各自为政”的思维，推动五育相互渗透、相互支撑。将德育融入学科教学，实现课程思政；将美育融入知识学习，提升思维的创造性；将体育锻炼与学习节奏结合，提升学习精力与效率；将劳动教育与知识应用结合，提升实践能力。通过协同融合，让五育共同服务于学生的能力提升，形成“五育共进、相互赋能”的格局，从长期看反而会促进学业质量的深层提升。"},{"t":"挖掘相互促进价值，破解“对立”认知误区","d":"解“对立”认知误区。主动向家长与社会传递五育的内在逻辑：体育能够增强体质、提升注意力持久性与思维活力，为智育提供身体支撑；美育能够培养想象力、创造力与审美感知，提升学科学习的思维品质；劳动教育能够促进知识的应用与内化，深化对知识的理解；德育能够激发学习动机与责任意识，提供学习的精神动力。五育不仅不影响智育，反而会从不同维度支撑智育的高质量发展。"},{"t":"优化实践质量，避免形式化提升育人实效","d":"式化提升育人实效。破解形式化困境，让各育真正落地生根：德育要贴近学生生活，在日常管理、班级活动中渗透，而非空泛宣讲；体育要保障锻炼实效，提升运动技能与体质；美育要强化动手创作与审美体验，而非被动观看；劳动教育要结合真实劳动场景，培养劳动能力与观念。通过提升各育的质量，真正实现全面育人，让家长看到学生综合能力的提升，化解焦虑。"}]},{"t":"（3）阐释立德树人背景下五育并举与德育为先的内在关系","items":[{"t":"五育并举与德育为先的内在关系","d":"#####（3）阐释立德树人背景下五育并举与德育为先的内在关系，论述中小学落实立德树人的实践路径。【解析】立德树人是我国教育的根本任务，五育并举与德育为先是落实立德树人的核心遵循，二者具有内在的统一性，共同服务于培养担当民族复兴大任的时代新人的根本目标。"},{"t":"德育为先是五育并举的灵魂统帅","d":"灵魂统帅。立德树人，立德为先，德育在五育中居于引领地位，决定着整个教育的价值方向与根本性质。坚持德育为先，才能保证五育并举始终沿着培养社会主义建设者和接班人的正确方向推进，避免育人的功利化、工具化偏差。德育不是孤立存在的，而是贯穿于其他各育之中：智育有价值方向，体育有意志品质，美育有道德情操，劳动有思想觉悟，都是德育的具体体现。"},{"t":"五育并举是立德树人的全面载体","d":"全面载体。立德树人的目标是培养德智体美劳全面发展的时代新人，这一目标必须通过五育并举的完整育人体系来实现。立德树人不是单纯的德育工作，而是要通过德育、智育、体育、美育、劳动教育的协同推进，全面提升学生的思想道德、科学文化、健康体魄、审美素养与劳动能力，让学生成为有理想、有本领、有担当的人。五育并举从不同维度支撑着树人的目标，是立德树人的实践载体。"},{"t":"二者统一于人的全面发展的根本目标","d":"展的根本目标。德育为先是方向保障，解决“培养什么人、怎样培养人”的根本问题；五育并举是路径支撑，解决“全面培养、系统育人”的实践问题。二者共同服务于“培养全面发展的社会主义建设者和接班人”的根本目标，共同落实为党育人、为国育才的使命。"},{"t":"中小学落实立德树人的实践路径","d":"#####（3）阐释立德树人背景下五育并举与德育为先的内在关系，论述中小学落实立德树人的实践路径。【解析】立德树人是我国教育的根本任务，五育并举与德育为先是落实立德树人的核心遵循，二者具有内在的统一性，共同服务于培养担当民族复兴大任的时代新人的根本目标。"}]}]},{"id":"预测6-1-36","num":36,"title":"36 观察学习","subject":"教心","blocks":[{"t":"（1）依托班杜拉观察学习理论","items":[{"t":"不良行为的习得过程：从注意到复制的间接学习链条","d":"从注意到复制的间接学习链条观察学习的核心特征是“间接习得”，学生不需要亲自尝试行为后果，仅通过观察就能完成行为模式的记忆与掌握，这也是短视频不良行为能够快速蔓延的心理基础。"},{"t":"注意过程：不良榜样的强吸引力触发选择性注意","d":"不良榜样的强吸引力触发选择性注意。注意是观察学习的起始环节，决定了个体筛选、接收哪些行为信息。短视频中的低俗言行之所以能精准抓住初中生的注意力，是多重因素共同作用的结果。其一，榜样行为的显著性与新奇性。网红的低俗言行往往夸张搞怪、具有强烈的感官刺激性，与平淡的日常校园生活形成鲜明反差，新奇感极强，很容易突破学生的注意筛选。其二，呈现方式的高频性与渗透性。短视频平台基于算法的碎片化、高频次推送，让学生在刷视频的过程中反复接触同类内容，不断强化注意的深度。其三，观察者自身的发展特点。初中生正处于青春期，好奇心旺盛、渴望同伴认同、追求标新立异，低俗新奇的言行恰。"},{"t":"保持过程：重复暴露强化记忆表征","d":"重复暴露强化记忆表征。保持过程是将观察到的行为以心理表象、符号编码的形式储存在大脑中，为后续的行为复制提供记忆基础。学生频繁刷短视频的过程，就是对不良行为的反复观察过程，重复的视觉刺激让这些行为模式以生动的表象形式深度储存在记忆中，保持效果极强。同时，低俗言行大多简单直白、标签性强，容易以符号化的方式被学生提炼记忆，进一步提升了保持的牢固程度。这也是为什么学生即使被批评后，依然能在私下场景准确复现相关行为的原因——行为模式已经完成记忆储存，不会因为外部惩罚就凭空消失。"},{"t":"复制过程：低门槛行为实现快速模仿","d":"低门槛行为实现快速模仿。复制过程是个体将记忆中的行为表征转化为外显行为的过程，也就是模仿的实施环节。网红的低俗言行大多是口头禅、简单肢体动作，技术门槛低、易于复制，初中生的行为能力完全可以轻松复现。同时，班级群体的跟风效应进一步降低了模仿的心理门槛：第一个学生模仿后获得同伴关注，其他学生就会纷纷效仿，形成行为传播的连锁反应，最终演变为班级不良风气。"},{"t":"不良行为的表现过程：动机过程的调节作用","d":"动机过程的调节作用行为的习得不等于行为的表现，个体是否将已经习得的行为展现出来，核心取决于动机过程的调节。动机过程受到直接强化、替代性强化与自我强化的共同影响，决定了行为表现的场景、频率与强度。"}]},{"t":"（2）运用直接强化与替代强化理论","items":[{"t":"批评违纪学生：直接惩罚的短期效果与深层局限","d":"#####（2）运用直接强化与替代强化理论，评析批评违纪学生、树立正向榜样两种育人方式的效果差异。【解析】直接强化与替代强化是调节个体行为动机的两种核心机制：直接强化是个体自身行为受到奖励或惩罚，从而调节行为频率；替代强化是个体通过观察榜样行为的后果，调整自身的行为倾向。批评违纪学生与树立正向榜样两种育人方式，分别对应直接惩罚与替代强化两种机制，在作用逻辑、效果层面、持续时效上存在显著差异。"},{"t":"积极效果：快速遏制公开不良行为","d":"快速遏制公开不良行为。直接惩罚的作用直接、见效快，能够迅速改变行为的后果预期。学生明确感知到公开模仿不良言行会带来批评、扣分等负面结果，出于对惩罚的规避，会快速停止公开场合的违规模仿。材料中“有效杜绝了学生公开违规模仿的行为”，正是直接惩罚的短期效果体现，对于快速遏制不良风气的蔓延具有立竿见影的作用，适合紧急情况下的行为管控。"},{"t":"核心局限：治标不治本，难以根除问题","d":"治标不治本，难以根除问题。首先，只抑制行为表现，不消除行为习得。根据观察学习理论，惩罚只会影响行为的表现动机，不会抹去已经习得的行为模式。学生只是为了避免惩罚而隐藏行为，一旦脱离惩罚场景，行为就会再次出现。材料中学生在隐蔽场景私下模仿，正是这一局限的直接体现。其次，只破不立，没有提供替代性行为。批评只是告诉学生“不能做什么”，没有告诉学生“应该做什么”，学生寻求关注、展现自我的心理需求没有得到正向满足，就会通过隐蔽的方式继续寻求满足，无法从根源上解决问题。最后，容易引发逆反心理，削弱师生信任。公开的刚性批评容易伤害学生的自尊，引发抵触情绪，反而弱化教育的。"},{"t":"树立正向榜样：替代强化的深层价值与长效效果","d":"#####（2）运用直接强化与替代强化理论，评析批评违纪学生、树立正向榜样两种育人方式的效果差异。【解析】直接强化与替代强化是调节个体行为动机的两种核心机制：直接强化是个体自身行为受到奖励或惩罚，从而调节行为频率；替代强化是个体通过观察榜样行为的后果，调整自身的行为倾向。批评违纪学生与树立正向榜样两种育人方式，分别对应直接惩罚与替代强化两种机制，在作用逻辑、效果层面、持续时效上存在显著差异。"},{"t":"积极效果：标本兼治，实现深层引导","d":"快速遏制公开不良行为。直接惩罚的作用直接、见效快，能够迅速改变行为的后果预期。学生明确感知到公开模仿不良言行会带来批评、扣分等负面结果，出于对惩罚的规避，会快速停止公开场合的违规模仿。材料中“有效杜绝了学生公开违规模仿的行为”，正是直接惩罚的短期效果体现，对于快速遏制不良风气的蔓延具有立竿见影的作用，适合紧急情况下的行为管控。"}]},{"t":"（3）结合观察学习规律","items":[{"t":"优化班级榜样教育、提升德育实效的方法","d":"#####（3）结合观察学习规律，说明优化班级榜样教育、提升德育实效的方法，分析短视频环境下榜样育人的挑战与应对策略。【解析】观察学习的规律揭示了榜样育人的核心逻辑：行为的习得与表现，始于注意、成于保持、落于复制、定于动机。优化班级榜样教育，必须遵循这一规律系统设计；面对短视频环境的冲击，也需要从观察学习的各个环节精准施策，主动应对。"},{"t":"精准选树榜样，提升注意效果","d":"意效果。注意过程是榜样教育的起点，榜样的吸引力直接决定教育效果。首先，坚持“贴近性”原则，优先选树学生身边的榜样。同班的优秀学生、同校的优秀毕业生，在年龄、经历、生活环境上与学生高度相似，更容易被学生关注与认同，远比遥不可及的名人榜样效果好。其次，突出榜样的行为细节而非仅仅是荣誉标签。不仅宣传榜样的荣誉，更要展现榜样的行为过程、成长故事、遇到的困难与应对方法，让榜样的行为可感知、可学习。最后，丰富榜样类型，覆盖多元成长维度。不仅有学习榜样，也要有品德榜样、自律榜样、劳动榜样等，适配不同学生的发展需求，让每个学生都能找到适合自己的参照。"},{"t":"清晰呈现行为，强化保持效果","d":"持效果。保持过程是榜样行为转化为学生记忆表征的关键环节。首先，系统呈现榜样的行为逻辑，而不是碎片化的事迹。比如优秀毕业生分享自律成长经验，要完整呈现“如何抵制网络诱惑、如何规划时间、如何克服困难”的完整过程，让学生能够形成清晰的行为序列记忆，而不是模糊的印象。其次，多样化呈现方式，强化记忆编码。结合故事分享、现场互动、事迹展示等多种形式，让学生从听觉、视觉等多通道接收榜样信息，提升记忆保持的牢固程度。"},{"t":"搭建实践载体，促进复制落地","d":"制落地。复制过程是榜样行为转化为学生自身行为的中间环节。首先，设置阶梯式的实践任务，让学生从易到难模仿榜样行为。比如针对自律榜样，先从“每天按时完成作业”的小目标开始，逐步提升自律要求，让学生在逐步实践中掌握行为方法。其次，搭建同伴互助的平台。以榜样学生为核心组建学习小组、互助小组，让学生在日常互动中近距离观察、模仿榜样的行为，提升复制的准确性。"},{"t":"强化正向激励，激活内在动机","d":"在动机。动机过程是榜样行为持续表现的根本保障。首先，及时肯定学生的正向模仿行为。当学生表现出榜样的积极行为时，及时给予表扬、认可，通过直接强化巩固行为动机。其次，引导学生自我强化。引导学生以榜样为参照，制定自我成长目标，进行自我监督、自我评价，将外部的榜样要求转化为内在的自我追求，最终实现行为的自觉自律。"}]}]}]},{"id":"预测6-2","name":"预测2","questions":[{"id":"预测6-2-31","num":31,"title":"31 朱熹·理学教育","subject":"中教史","blocks":[{"t":"教育的本质与核心目的","items":[{"t":"朱熹的教育思想以“性即理”的理学哲学为根基，明确了教育的本质作用与根本目标","d":"即理”的理学哲学为根基，明确了教育的本质作用与根本目标。他将人性划分为“天命之性”与“气质之性”两个层面：天命之性禀受天理而生，内含仁、义、礼、智等道德内核，是纯粹至善的；气质之性是理与气相杂的产物，有善有恶，清明中正者契合天理，昏浊偏私者流于人欲。教育的核心作用就在于“变化气质”，通过教化去除物欲的蒙蔽，显现并扩充气质中本有的善性，最终实现“明天理、灭人欲”的根本任务。在此哲学基础上，朱熹提出学校教育的根本目的是“明人伦”。在他看来，克服气质之偏、革除物欲之蔽，最终要落实到人伦秩序的践行上。教育就是要使人人明晰父子有亲、君臣有义、夫妇有别、长幼有序、朋。"}]},{"t":"分段教育体系：小学与大学的递进衔接","items":[{"t":"小学教育：铸就圣贤坯璞：小学阶段对应8至15岁","d":"铸就圣贤坯璞小学阶段对应8至15岁，核心任务是培养“圣贤坯璞”，为后续的大学教育筑牢根基。在教学理念上，朱熹提出“教事”为主的原则，即通过具体的日常行事，让儿童感知基本的伦理道德规范，养成良好的行为习惯，掌握初步的文化知识技能。教学内容力求浅近具体，让儿童在洒扫应对、进退周旋的具体行为中体悟伦理秩序，做到“知之浅而行之小者”。在教育方法上，朱熹强调三点：一是先入为主、及早施教，重视童年启蒙的关键价值，主张在儿童心智尚未定型时施以正向引导；二是教学形象生动，契合儿童的认知特点，借助故事、格言等形式激发学习兴趣；三是首创以《童蒙须知》《训学斋规》等行为规范文。"},{"t":"大学教育：精研义理成才：大学阶段从15岁开始","d":"小学阶段对应8至15岁，核心任务是培养“圣贤坯璞”，为后续的大学教育筑牢根基。在教学理念上，朱熹提出“教事”为主的原则，即通过具体的日常行事，让儿童感知基本的伦理道德规范，养成良好的行为习惯，掌握初步的文化知识技能。教学内容力求浅近具体，让儿童在洒扫应对、进退周旋的具体行为中体悟伦理秩序，做到“知之浅而行之小者”。在教育方法上，朱熹强调三点：一是先入为主、及早施教，重视童年启蒙的关键价值，主张在儿童心智尚未定型时施以正向引导；二是教学形象生动，契合儿童的认知特点，借助故事、格言等形式激发学习兴趣；三是首创以《童蒙须知》《训学斋规》等行为规范文本，系统规定。"}]},{"t":"朱子读书法：古代读书方法论的集大成","items":[{"t":"朱熹在总结自身读书经验与前人治学传统的基础上","d":"验与前人治学传统的基础上，提出了系统的读书方法论，被后世称为“朱子读书法”，包含六大基本原则，是古代读书治学经验的高度凝练。一是循序渐进。读书需遵循典籍的内在逻辑次序，不可颠倒逾越；要结合自身的学力水平制定读书计划，扎实推进，切忌囫囵吞枣、急于求成，在打好基础的前提下逐步深入。二是熟读精思。读书既要熟读成诵，夯实文本记忆基础，更要精于思考，经历从无疑到生疑再到解疑的完整思维过程，在质疑与探究中把握经典的深层义理。三是虚心涵泳。读书需秉持虚怀若谷的心态，静心思虑，仔细体会文本本意，不可先入为主、牵强附会；要反复咀嚼、细心玩味，沉潜于文本之中体悟深意。四是切。"}]},{"t":"道德教育思想：内外兼修的修养体系","items":[{"t":"朱熹构建了一套从内在信念到外在践行的完整道德修养体系","d":"信念到外在践行的完整道德修养体系，将道德教育贯穿教育的全过程，形成了五个层层递进的修养环节。其一，立志。朱熹认为志向是人心的根本方向，对个体成长至关重要，学者首要之事便是树立远大的道德志向，以成圣成贤为终身追求，为道德修养提供根本动力。其二，居敬。要求内心专心致志、谨慎敬畏，一方面自觉抑制人欲诱惑，恪守封建伦理规范；另一方面外在仪容举止、言语态度都符合礼制要求，做到内外兼修、表里如一。其三，存养。即“存心养性”，每个人都有先天的善性，但易被气质之偏与物欲所遮蔽，需要通过存养的功夫，涵养本心、发显善性，守护内在的道德本源。其四，省察。强调时时处处进行自我反。"}]},{"t":"历史影响与时代局限","items":[{"t":"深远的历史影响","d":"第一，构建了理学教育的经典体系。朱熹编定的《四书章句集注》，自元代起成为科举考试的标准答案与各级学校的核心教材，地位超越五经，主导了宋元明清近八百年的教育内容，统一了传统教育的思想内核。第二，确立了书院教育的办学范式。《白鹿洞书院揭示》是中国书院史上第一个纲领性学规，明确了书院的教育宗旨、为学路径与行为准则，成为后世书院与官学办学的范本，推动了古代书院教育的制度化发展。第三，完善了古代教育的分段体系。小学与大学的分段设计，契合个体的认知发展规律，细化了人才培养的阶段目标与方法，丰富了中国古代的教育理论。第四，奠定了传统治学方法的基础。朱子读书法系统总结了。"},{"t":"构建了理学教育的经典体系","d":"体系。朱熹编定的《四书章句集注》，自元代起成为科举考试的标准答案与各级学校的核心教材，地位超越五经，主导了宋元明清近八百年的教育内容，统一了传统教育的思想内核。第二，确立了书院教育的办学范式。《白鹿洞书院揭示》是中国书院史上第一个纲领性学规，明确了书院的教育宗旨、为学路径与行为准则，成为后世书院与官学办学的范本，推动了古代书院教育的制度化发展。第三，完善了古代教育的分段体系。小学与大学的分段设计，契合个体的认知发展规律，细化了人才培养的阶段目标与方法，丰富了中国古代的教育理论。第四，奠定了传统治学方法的基础。朱子读书法系统总结了古代读书治学的经验，成为后。"},{"t":"确立了书院教育的办学范式","d":"范式。《白鹿洞书院揭示》是中国书院史上第一个纲领性学规，明确了书院的教育宗旨、为学路径与行为准则，成为后世书院与官学办学的范本，推动了古代书院教育的制度化发展。第三，完善了古代教育的分段体系。小学与大学的分段设计，契合个体的认知发展规律，细化了人才培养的阶段目标与方法，丰富了中国古代的教育理论。第四，奠定了传统治学方法的基础。朱子读书法系统总结了古代读书治学的经验，成为后世士人的基本治学准则，深刻影响了中国古代的学风与士人精神。"},{"t":"完善了古代教育的分段体系","d":"体系。小学与大学的分段设计，契合个体的认知发展规律，细化了人才培养的阶段目标与方法，丰富了中国古代的教育理论。第四，奠定了传统治学方法的基础。朱子读书法系统总结了古代读书治学的经验，成为后世士人的基本治学准则，深刻影响了中国古代的学风与士人精神。"},{"t":"奠定了传统治学方法的基础","d":"基础。朱子读书法系统总结了古代读书治学的经验，成为后世士人的基本治学准则，深刻影响了中国古代的学风与士人精神。"}]}]},{"id":"预测6-2-32","num":32,"title":"32 三大教育力量","subject":"外教史","blocks":[{"t":"三大教育力量的核心办学实践形态","items":[{"t":"人文主义教育：世俗精英教育的兴起","d":"14至17世纪，伴随文艺复兴的思想解放与宗教改革的社会变革，欧洲教育彻底打破中世纪天主教会的单一垄断格局，逐步形成人文主义教育、新教教育与天主教教育三大力量并行发展的多元态势。三者基于不同的立场与目标开展办学实践，既相互竞争又相互影响，共同推动欧洲教育从中世纪传统形态向近代形态转型。"},{"t":"新教教育：教派化国民教育的探索","d":"14至17世纪，伴随文艺复兴的思想解放与宗教改革的社会变革，欧洲教育彻底打破中世纪天主教会的单一垄断格局，逐步形成人文主义教育、新教教育与天主教教育三大力量并行发展的多元态势。三者基于不同的立场与目标开展办学实践，既相互竞争又相互影响，共同推动欧洲教育从中世纪传统形态向近代形态转型。"},{"t":"天主教教育：反宗教改革下的教会教育革新","d":"14至17世纪，伴随文艺复兴的思想解放与宗教改革的社会变革，欧洲教育彻底打破中世纪天主教会的单一垄断格局，逐步形成人文主义教育、新教教育与天主教教育三大力量并行发展的多元态势。三者基于不同的立场与目标开展办学实践，既相互竞争又相互影响，共同推动欧洲教育从中世纪传统形态向近代形态转型。"}]},{"t":"三者在教育价值取向与课程内容上的异同","items":[{"t":"共通之处","d":"第一，均重视古典文化的传承与价值。三大教育力量都将古希腊罗马的古典语言、文学、哲学作为重要教学内容，突破了中世纪经院哲学的知识局限，共同延续了欧洲古典文化脉络，也丰富了教育的知识体系。第二，均保留宗教信仰的教育维度。人文主义教育家普遍信仰上帝，仅反对教会的腐朽专制与思想禁锢，并未否定宗教本身；新教与天主教教育更是以宗教信仰为核心目标，只是教派立场与教义阐释不同。第三，均冲击了中世纪僵化的教育传统。三者都不同程度反对经院教育的教条主义、死记硬背与体罚陋习，开始关注儿童的身心特点，改进教学组织与方法，推动教育从纯宗教教化向更丰富的形态发展。"},{"t":"均重视古典文化的传承与价值","d":"与价值。三大教育力量都将古希腊罗马的古典语言、文学、哲学作为重要教学内容，突破了中世纪经院哲学的知识局限，共同延续了欧洲古典文化脉络，也丰富了教育的知识体系。第二，均保留宗教信仰的教育维度。人文主义教育家普遍信仰上帝，仅反对教会的腐朽专制与思想禁锢，并未否定宗教本身；新教与天主教教育更是以宗教信仰为核心目标，只是教派立场与教义阐释不同。第三，均冲击了中世纪僵化的教育传统。三者都不同程度反对经院教育的教条主义、死记硬背与体罚陋习，开始关注儿童的身心特点，改进教学组织与方法，推动教育从纯宗教教化向更丰富的形态发展。"},{"t":"均保留宗教信仰的教育维度","d":"维度。人文主义教育家普遍信仰上帝，仅反对教会的腐朽专制与思想禁锢，并未否定宗教本身；新教与天主教教育更是以宗教信仰为核心目标，只是教派立场与教义阐释不同。第三，均冲击了中世纪僵化的教育传统。三者都不同程度反对经院教育的教条主义、死记硬背与体罚陋习，开始关注儿童的身心特点，改进教学组织与方法，推动教育从纯宗教教化向更丰富的形态发展。"},{"t":"均冲击了中世纪僵化的教育传统","d":"教育传统。三者都不同程度反对经院教育的教条主义、死记硬背与体罚陋习，开始关注儿童的身心特点，改进教学组织与方法，推动教育从纯宗教教化向更丰富的形态发展。"},{"t":"核心差异","d":"皮亚杰的认知建构理论与维果茨基的文化历史理论，分别从个体内部建构与社会文化驱动两个维度揭示了儿童认知发展的规律，二者在发展动力、阶段特征、教育作用等方面存在核心差异，也从不同层面为探究式教学提供了理论指引，二者互补共同构成科学探究教学的理论基础。"}]},{"t":"三者对欧洲近代教育转型的共同历史作用","items":[{"t":"打破教会教育垄断，推动教育格局多元化","d":"动教育格局多元化。中世纪欧洲教育完全由天主教会掌控，三大教育力量的兴起形成了世俗人文教育、新教国家教育、天主教教会教育三足鼎立的格局。教育的举办主体从单一教会扩展到世俗政权、人文学者、不同教派，教育形态从单一教会教育转向精英教育、国民教育、宗教教育多元并存，开启了欧洲教育近代化的多元格局。第二，推动教育国家化与世俗化转型。新教教育首次将教育权纳入国家公共职能，开创了国家办学、义务教育的制度传统，推动教育从教会私属事务向国家公共事业转变；人文主义教育拓展了世俗知识的边界，将人的发展、世俗生活纳入教育目标，削弱了教育的宗教附庸地位；天主教教育的规范化实践也客。"},{"t":"推动教育国家化与世俗化转型","d":"化转型。新教教育首次将教育权纳入国家公共职能，开创了国家办学、义务教育的制度传统，推动教育从教会私属事务向国家公共事业转变；人文主义教育拓展了世俗知识的边界，将人的发展、世俗生活纳入教育目标，削弱了教育的宗教附庸地位；天主教教育的规范化实践也客观上推动了学校制度的成熟。三者共同发力，推动欧洲教育逐步摆脱宗教的绝对控制，向近代国家公共教育体系转型。第三，奠定国民普及教育的思想与实践基础。新教教派提出的全民教育、义务教育、免费教育理念，突破了中世纪精英教育的阶层壁垒，将教育普及到普通民众层面，尤其是加尔文在日内瓦的普及教育实践，为近代国民教育体系的形成提供了。"},{"t":"奠定国民普及教育的思想与实践基础","d":"想与实践基础。新教教派提出的全民教育、义务教育、免费教育理念，突破了中世纪精英教育的阶层壁垒，将教育普及到普通民众层面，尤其是加尔文在日内瓦的普及教育实践，为近代国民教育体系的形成提供了最早的实践样本，深刻影响了后世欧美公共教育制度的建立。第四，丰富教育内容与教学方法，推动教育走向规范化。人文主义教育拓展了人文学科、体育、美育的教育维度，确立了尊重儿童、因材施教的教学传统；新教教育开创本族语教学，丰富了实用课程体系；耶稣会学校建立了系统的班级授课制、分级学制与严格的师资培训制度。三者共同推动教育从中世纪零散、教条、体罚为主的落后模式，向系统、规范、关注人。"},{"t":"丰富教育内容与教学方法，推动教育走向规范化","d":"法，推动教育走向规范化。人文主义教育拓展了人文学科、体育、美育的教育维度，确立了尊重儿童、因材施教的教学传统；新教教育开创本族语教学，丰富了实用课程体系；耶稣会学校建立了系统的班级授课制、分级学制与严格的师资培训制度。三者共同推动教育从中世纪零散、教条、体罚为主的落后模式，向系统、规范、关注人的发展的近代教育模式演进。第五，搭建中世纪教育向近代教育过渡的桥梁。三大教育力量虽立场各异，但共同继承了欧洲古典文化遗产，在保留宗教文化传统的同时，注入了人文精神、国家意识、普及理念、科学方法等近代教育因子。它们的探索与实践，为夸美纽斯泛智教育、洛克绅士教育等近代教。"},{"t":"搭建中世纪教育向近代教育过渡的桥梁","d":"教育过渡的桥梁。三大教育力量虽立场各异，但共同继承了欧洲古典文化遗产，在保留宗教文化传统的同时，注入了人文精神、国家意识、普及理念、科学方法等近代教育因子。它们的探索与实践，为夸美纽斯泛智教育、洛克绅士教育等近代教育思想的形成，以及近代学校制度的最终确立积累了宝贵经验，是欧洲教育从中世纪走向近代不可或缺的过渡环节。###材料分析题####33.阅读材料，回答问题。#####（1）结合材料，运用个体主观能动性理论，分析双减后学生分化的原因及教育启示。【解析】个体主观能动性是人的身心发展的内在决定性因素，指个体在与环境的互动中主动进行自我认识、自我规划、自我。"}]}]},{"id":"预测6-2-33","num":33,"title":"33 主观能动性·学校主导","subject":"教原","blocks":[{"t":"（1）运用个体主观能动性理论","items":[{"t":"双减后学生分化的深层原因：主观能动性的差异决定环境作用的效度","d":"原因：主观能动性的差异决定环境作用的效度同样是减少书面作业与考试、释放课后时间的外部环境变化，对不同学生产生了完全相反的影响，其核心逻辑在于：外部环境的价值必须通过个体的主动选择与内化才能转化为发展成果，主观能动性的水平直接决定了个体对环境资源的利用方向与利用效率。第一，高主观能动性学生：减负释放发展空间，主动建构实现多元成长。对于自我意识、自我控制能力较强的学生而言，过重的作业负担原本是束缚其自主发展的外部压力，减负本质上是移除了发展的阻碍，释放出可自主支配的时间与精力。这类学生能够主动规划学习节奏、自主安排课余生活，将释放出的时间用于阅读、锻炼、发展。"},{"t":"对教育的实践启示：减负不是教育的终点，而是教育转型的起点","d":"减负不是教育的终点，而是教育转型的起点。教育不能只做“减负担”的减法，更要做“提能力”的加法，把激发学生的主观能动性作为提质的核心。第一，减负与赋能并行，培养自主学习与自我管理能力。不能简单减少作业数量，要同步配套学习方法指导、时间管理训练，帮助学生学会规划学习、管理时间，让学生在减负后有能力掌控自己的学习与生活，避免出现“一放就乱”的问题。第二，激发内在学习动机，从外部驱动转向内在自觉。改变过去靠作业、考试压力驱动学习的模式，通过丰富的课程、多元的活动、深度的引导，激发学生的学习兴趣与成长渴望，让学习成为学生的内在需求，从根本上解决“没有压力就不学习”"}]},{"t":"（2）说明该校实践如何体现学校教育在人的身心发展中的主导作…","items":[{"t":"有目的的系统育人设计，引领学生发展方向","d":"引领学生发展方向学校教育的主导性首先体现在其明确的育人目标与系统的培养方案，能够规定人的发展方向，对学生施加全面、系统、深刻的影响。该校针对减负后可能出现的自主学习不足问题，主动构建了“学习指导+导师引领+社团拓展+家校协同”的完整育人体系，不是被动应对减负，而是主动设计学生的发展路径。第一，学习能力的系统培养。建立学习指导中心，专门开设学习方法与自我管理课程，指导学生制定学习计划，从能力层面解决学生“不会自主规划”的问题，将减负释放的时间转化为自主发展的能力，而非放任自流。这体现了学校教育有计划地提升学生的主体能力，引领学生从被动学习走向自主学习。第二。"},{"t":"专业教师的教育引领，发挥专业育人价值","d":"发挥专业育人价值学校教育由专门培训的教师实施，教师的专业引领是学校教育主导作用的重要支撑。该校的导师制、学习方法课程、社团指导，都是教师专业作用的体现。第一，教师从知识的传授者转变为学习的引导者。教师不再只是布置作业、批改作业，而是通过学习诊断、个别交流，帮助学生发现问题、掌握方法、规划发展，发挥专业的教育引领作用。第二，针对学生的发展困境提供专业支持。针对学生自主学习能力不足的问题，教师不是简单批评或放任，而是通过专门的课程与指导，系统培养学生的自我管理能力，体现了教育的专业性与引领性，这是家庭、社会环境无法替代的。"},{"t":"整合多方育人资源，优化学生发展环境","d":"化学生发展环境学校教育能够在一定程度上控制、协调影响学生发展的各种因素，整合学校、家庭、社会的资源，为学生营造最佳的发展环境。第一，家校协同，激活家庭育人功能。学校开设家长学校，指导家庭营造学习环境，将家庭从教育的旁观者转变为合作者，提升家庭的育人能力，形成家校育人合力。第二，社校联动，拓展社会育人空间。联动社区开放场馆作为课外实践空间，将社会资源转化为育人资源，拓展了学校教育的边界，为学生提供了更广阔的发展平台。通过整合校内外资源，学校将自身的主导作用延伸到家庭与社会，协调各方因素共同服务于学生发展，体现了学校教育在育人体系中的核心枢纽地位。"},{"t":"促进个性化与社会化的统一，实现全面育人","d":"统一，实现全面育人学校教育的主导作用还体现在促进个体个性化与社会化的双重发展。一方面，促进个体个性化。自主选课、导师个别指导、多元社团，尊重了学生的个体差异，充分挖掘学生的内在潜力，促进学生的主体意识形成与个性发展，让每个学生都能成长为独特的个体。另一方面，促进个体社会化。社团活动、成果展示、集体学习，让学生在互动中学会交往、合作、展示，促进学生的行为社会化与能力社会化，帮助学生更好地适应社会发展。#####（3）结合材料一中课后服务形式单一、家庭学习氛围薄弱等现象及材料二中校长的反思，从内部因素与外部因素两个维度，论述学校教育有效发挥主导作用的前提条件。"}]},{"t":"（3）中课后服务形式单一、家庭学习氛围薄弱等现象及材料二中…","items":[{"t":"内部前提条件：学校教育主导作用的内在基础","d":"学校教育主导作用的内在基础内部因素是学校主导作用发挥的根本依据，决定了教育本身的能力与效度。第一，受教育者的主观能动性是主导作用发挥的核心前提。学校教育只是个体发展的外部条件，必须通过个体的主观能动性才能内化为人的发展。如果学生缺乏主观能动性，没有自我发展的意愿与自我管理的能力，再好的学校教育、再多的资源投入，都无法转化为学生的成长成果。材料一中，减负后部分学生因缺乏内驱力而沉迷手机、成绩下滑，本质上就是学生主观能动性不足，导致学校的减负政策无法发挥正向作用，反而出现负面效果。这说明，学校教育的主导作用，最终要落脚到激发学生的主观能动性上，没有学生的主动。"},{"t":"外部前提条件：学校教育主导作用的环境支撑","d":"学校教育主导作用的环境支撑外部因素是学校主导作用发挥的必要保障，学校教育无法脱离家庭与社会环境独立发挥作用。第一，家庭环境的协同配合是重要基础。家庭是学生成长的首要环境，家校配合程度直接影响学校教育的效果。家庭的经济条件、家长的文化水平、教育理念与重视程度，都会制约学校教育作用的发挥。材料一中，家长反映孩子回家无学习规划、家庭学习氛围不足，就是家庭环境支撑不足，直接削弱了学校教育的效果，学生在校的教育成果无法在家庭中得到巩固与延伸。材料二中，家长支持度高的班级学生进步明显，而外来务工家庭配合难度大，也直接印证了家庭环境的重要性：家长的理念认同、时间投入、。"},{"t":"实践启示：内外协同构建育人合力","d":"减负不是教育的终点，而是教育转型的起点。教育不能只做“减负担”的减法，更要做“提能力”的加法，把激发学生的主观能动性作为提质的核心。第一，减负与赋能并行，培养自主学习与自我管理能力。不能简单减少作业数量，要同步配套学习方法指导、时间管理训练，帮助学生学会规划学习、管理时间，让学生在减负后有能力掌控自己的学习与生活，避免出现“一放就乱”的问题。第二，激发内在学习动机，从外部驱动转向内在自觉。改变过去靠作业、考试压力驱动学习的模式，通过丰富的课程、多元的活动、深度的引导，激发学生的学习兴趣与成长渴望，让学习成为学生的内在需求，从根本上解决“没有压力就不学习”"}]}]},{"id":"预测6-2-34","num":34,"title":"34 布鲁纳·奥苏伯尔","subject":"教心","blocks":[{"t":"（1）结合布鲁纳认知—发现说，评析张老师探究教学的优缺点。","items":[{"t":"探究式教学的优势：契合主动建构规律，凸显过程育人价值","d":"契合主动建构规律，凸显过程育人价值第一，遵循学习的主动建构本质，充分激发学生的学习主体性。布鲁纳指出，学习不是被动接受信息的过程，而是学习者主动将新知识与原有认知结构建立联系，进而重组编码系统、建构认知体系的过程。张老师没有直接向学生灌输三角形内角和定理，而是为每组准备不同类型的三角形纸片，组织学生以小组为单位，通过量角器测量、剪拼拼接、折叠验证等多种方式自主探究规律。整个过程中，学生是知识的主动发现者，而非被动接收者，动手参与积极、课堂氛围活跃，充分体现了学习的主动性，有效激发了学生的探究热情。第二，匹配认知表征发展规律，搭建直观到抽象的阶梯。布鲁纳将。"},{"t":"遵循学习的主动建构本质，充分激发学生的学习主体性","d":"质，充分激发学生的学习主体性。布鲁纳指出，学习不是被动接受信息的过程，而是学习者主动将新知识与原有认知结构建立联系，进而重组编码系统、建构认知体系的过程。张老师没有直接向学生灌输三角形内角和定理，而是为每组准备不同类型的三角形纸片，组织学生以小组为单位，通过量角器测量、剪拼拼接、折叠验证等多种方式自主探究规律。整个过程中，学生是知识的主动发现者，而非被动接收者，动手参与积极、课堂氛围活跃，充分体现了学习的主动性，有效激发了学生的探究热情。第二，匹配认知表征发展规律，搭建直观到抽象的阶梯。布鲁纳将个体的认知表征划分为动作表征、映象表征与符号表征三个由低到高。"},{"t":"探究式教学的局限：知识建构深度不足，效率与落实存短板","d":"知识建构深度不足，效率与落实存短板第一，学科基本结构落实不到位，认知建构缺乏精准性与系统性。布鲁纳强调，教学的核心目标是让学生掌握学科的基本结构，形成系统的认知结构，这是知识迁移的基础。张老师的课堂将大量时间用于动手操作，在定理归纳提升环节，多数小组只能描述直观的操作现象，难以用规范的数学语言概括结论，也无法自主完成严谨的逻辑推导，最终由教师梳理总结定理内容。这说明学生的认知建构停留在直观经验层面，没有形成精准、系统的符号化知识结构，学科基本结构的掌握不够扎实，影响了知识的迁移应用。第二，学习效率偏低，知识应用能力培养不足。发现学习本身具有耗时耗力的天然。"},{"t":"学科基本结构落实不到位，认知建构缺乏精准性与系统性","d":"位，认知建构缺乏精准性与系统性。布鲁纳强调，教学的核心目标是让学生掌握学科的基本结构，形成系统的认知结构，这是知识迁移的基础。张老师的课堂将大量时间用于动手操作，在定理归纳提升环节，多数小组只能描述直观的操作现象，难以用规范的数学语言概括结论，也无法自主完成严谨的逻辑推导，最终由教师梳理总结定理内容。这说明学生的认知建构停留在直观经验层面，没有形成精准、系统的符号化知识结构，学科基本结构的掌握不够扎实，影响了知识的迁移应用。第二，学习效率偏低，知识应用能力培养不足。发现学习本身具有耗时耗力的天然局限，难以在有限的课堂时间内系统传授大量知识，也难以快速完成。"}]},{"t":"（2）依据奥苏伯尔有意义接受说","items":[{"t":"李老师的讲授教学属于有意义学习的判断依据","d":"有意义学习的判断依据判断一种学习是否为有意义学习，核心看是否满足“材料有逻辑意义、学习者有意义学习心向、认知结构有固着观念、主动开展意义同化”四个核心条件，李老师的课堂完全符合这些要求。第一，学习材料具有严密的逻辑意义，满足有意义学习的外部条件。有意义学习的首要前提是学习材料本身能够与学习者的认知结构建立实质性的、非人为的联系，而非孤立的符号。三角形内角和定理是数学几何体系中的核心命题，与平角定义、平行线同位角性质等知识存在天然的逻辑关联，本身具有严密的逻辑意义。李老师的教学从已有知识出发，逐步推导定理，完整呈现知识的逻辑链条，教学内容系统连贯，为有意义。"},{"t":"运用先行组织者策略优化教学的具体路径","d":"化教学的具体路径先行组织者是先于学习任务呈现的引导性材料，其抽象、概括水平高于学习任务，能够在新旧知识之间架设认知桥梁，增强新旧知识的可辨别性，促进有意义学习的深入。李老师的教学虽然已有旧知识复习环节，但可以通过先行组织者策略进一步系统化、精准化优化。第一，课前设计陈述性先行组织者，明确学习框架与知识关联。在正式开启定理学习前，呈现一段高度概括的引导性陈述，作为陈述性组织者。比如：“我们已经掌握了平角的度数特征与平行线的角度性质，这是我们研究几何角度关系的核心工具。本节课我们将借助这些工具，探究三角形三个内角之间的固定规律——三角形内角和定理，并学会运用。"}]},{"t":"（3）比较布鲁纳与奥苏伯尔学习理论差异","items":[{"t":"布鲁纳与奥苏伯尔学习理论的核心差异","d":"#####（3）比较布鲁纳与奥苏伯尔学习理论差异，阐述对双减背景课堂改革的启示。【解析】布鲁纳的认知—发现说与奥苏伯尔的有意义接受说，是现代认知学习理论的两大核心流派，二者分别从主动发现与意义同化两个维度揭示了学习的本质规律，在学习本质、教学模式、价值取向、效率特征等方面存在显著差异。二者并非对立的两极，而是互补的关系，对双减背景下的课堂提质增效改革具有重要的指导意义。"},{"t":"学习本质的认知差异：主动发现建构与意义接受同化","d":"主动发现建构与意义接受同化。布鲁纳认为，学习的本质是学习者主动获得知识、转化信息、评价结果，进而重组自身认知结构的过程，核心是“做中学”，强调个体的主动探索与认知重构。奥苏伯尔则认为，学习的本质是新知识与认知结构中已有的适当观念建立非人为的、实质性的联系，实现知识的意义同化，核心是“理解中学”，强调个体对知识的主动理解与系统内化。前者侧重认知结构的动态重组，后者侧重认知结构的有序扩充。第二，教学模式的路径差异：发现式探究与接受式讲授。在教学路径上，布鲁纳倡导发现学习模式，主张教师创设问题情境，引导学生亲自经历知识的发现过程，教师的角色是引导者与促进者。奥。"},{"t":"对双减背景下课堂改革的实践启示","d":"的实践启示双减政策的核心目标是减轻学生过重作业负担与校外培训负担，提升课堂教学质量，推动核心素养落地。这就要求课堂改革必须走出“要么满堂灌、要么伪探究”的两极误区，吸收两种理论的合理内核，实现提质增效。第一，坚持模式融合互补，实现过程与结果的统一。两种教学模式并非非此即彼，而是各有优势，课堂改革要避免走极端，推动发现学习与接受学习的深度融合。对于三角形内角和定理这类兼具探究性与严谨性的知识，可以采用“直观探究—系统讲授—应用巩固”的三阶模式：先通过动手探究让学生获得直观感知、形成猜想，发挥发现学习的动机激发与体验育人价值；再通过教师系统的逻辑推导，帮助学。"}]}]},{"id":"预测6-2-35","num":35,"title":"35 三级课程·课改·课程创生","subject":"教原","blocks":[{"t":"（1）说明国家、地方、校本课程各自定位与三者关系。","items":[{"t":"三类课程的核心定位：1\\.国家课程","d":"1\\.国家课程：育人主体、基础核心、规范底线国家课程由中央教育行政部门统一编制、实施与评价，是面向全国中小学生的统一性、强制性课程，在基础教育课程体系中占据绝对主体地位，是落实立德树人根本任务、保障全国基础教育育人质量统一标准的核心载体。从属性来看，国家课程具备极强的权威性、规范性与通用性，严格依据国家课程方案和新课标标准制定，明确各学段、各学科的课程目标、教学内容、学业要求与育人标准，规定了基础教育的基本育人底线与人才培养规格。其核心价值在于保障全国义务教育的公平性、基础性与统一性，杜绝区域、校际育人标准的大幅偏差，为所有学生提供平等、全面的基础学科教。"},{"t":"三类课程的内在辩证关系：首先，三者主次分明、层级清晰，坚守统一育人底线","d":"系首先，三者主次分明、层级清晰，坚守统一育人底线。国家课程是根本主体，决定基础教育的育人方向、核心内容与质量标准，是地方课程、校本课程开发实施的前提与基础，任何地方与校本课程的建设，都必须服从国家课程的育人要求，不得偏离国家教育方针、降低基础育人标准。这也契合材料中学校的办学理念，即在凸显课程特色的同时，坚守统一育人标准，杜绝盲目追求特色而弱化基础育人质量。地方课程与校本课程属于辅助补充，始终围绕国家课程的核心目标开展建设，是对国家课程的延伸与丰富，而非替代与颠覆。其次，三者相互补充、协同赋能，实现育人全覆盖。国家课程侧重通用知识、核心素养的标准化培育，。"}]},{"t":"（2）阐述我国基础教育课程改革核心理念","items":[{"t":"基础教育课程改革的核心核心理念","d":"心核心理念第一，坚持育人本位，落实素养导向育人目标。新课改彻底摒弃传统课程重知识传授、轻素养培育的弊端，立足学生终身发展需求，构建三维目标体系并进一步升级为核心素养育人体系，强调在传授基础知识、基本技能的同时，培育学生正确价值观、必备品格与关键能力，实现知识学习、能力提升、价值塑造的统一。摒弃应试化、功利化的育人导向，突出课程的育人价值，推动课程从“知识本位”向“素养本位”转型，让课程服务于学生全面、可持续发展。第二，优化课程结构，构建均衡多元课程体系。新课改打破传统课程学科本位、科目割裂、结构单一的局限，推行国家、地方、校本三级课程管理模式，强化课程的。"},{"t":"坚持育人本位，落实素养导向育人目标","d":"养导向育人目标。新课改彻底摒弃传统课程重知识传授、轻素养培育的弊端，立足学生终身发展需求，构建三维目标体系并进一步升级为核心素养育人体系，强调在传授基础知识、基本技能的同时，培育学生正确价值观、必备品格与关键能力，实现知识学习、能力提升、价值塑造的统一。摒弃应试化、功利化的育人导向，突出课程的育人价值，推动课程从“知识本位”向“素养本位”转型，让课程服务于学生全面、可持续发展。第二，优化课程结构，构建均衡多元课程体系。新课改打破传统课程学科本位、科目割裂、结构单一的局限，推行国家、地方、校本三级课程管理模式，强化课程的均衡性、综合性与选择性。既坚守国家课。"},{"t":"优化课程结构，构建均衡多元课程体系","d":"衡多元课程体系。新课改打破传统课程学科本位、科目割裂、结构单一的局限，推行国家、地方、校本三级课程管理模式，强化课程的均衡性、综合性与选择性。既坚守国家课程的基础性与统一性，保障基础教育公平与质量底线，又通过地方课程凸显地域特色、校本课程适配学生个性，丰富课程供给形态，破解传统课程同质化、固化化的问题，实现“统一规范与多元特色”的有机平衡。同时大力推进课程综合化、实践化，强化跨学科学习、探究性学习与社会实践育人。第三，变革实施方式，凸显学生主体发展地位。新课改倡导自主、合作、探究的新型学习方式，摒弃被动接受、机械训练的传统教学模式，强调立足学生生活经验、。"},{"t":"变革实施方式，凸显学生主体发展地位","d":"生主体发展地位。新课改倡导自主、合作、探究的新型学习方式，摒弃被动接受、机械训练的传统教学模式，强调立足学生生活经验、兴趣需求设计课程活动，鼓励学生主动参与、动手实践、深度探究，培养学生问题解决能力、创新能力与合作能力，充分尊重学生的主体性与差异性，适配不同学生的发展节奏与特长需求。第四，完善管理评价，推动课程动态提质升级。新课改下放课程管理权限，赋予地方、学校课程开发自主权，激发基层办学活力；同时建立发展性课程评价体系，打破单一的甄别选拔评价模式，通过多元评价、动态反馈、持续修订，推动课程、教师、学生的全方位发展，实现课程建设的动态优化、迭代升级。"},{"t":"完善管理评价，推动课程动态提质升级","d":"程动态提质升级。新课改下放课程管理权限，赋予地方、学校课程开发自主权，激发基层办学活力；同时建立发展性课程评价体系，打破单一的甄别选拔评价模式，通过多元评价、动态反馈、持续修订，推动课程、教师、学生的全方位发展，实现课程建设的动态优化、迭代升级。"}]},{"t":"（3）论述教师在课改中的角色定位","items":[{"t":"新课改背景下教师的多元角色定位","d":"元角色定位1\\.从教材执行者转变为课程自主开发者与建设者传统应试教育模式下，教师的核心工作是严格依照教材、教案开展教学，被动完成既定授课任务，缺乏课程自主话语权。而新课改下放课程管理自主权，赋予学校、教师课程开发的合法权利，教师不再是单纯的“教书匠”。材料中该校教师打破固有认知，主动参与校本课程研发，语文、数理科学教师结合自身专业优势开发特色课程，充分体现了教师课程开发者的角色。教师能够立足学科专业、结合学情需求、依托校内外资源，自主设计、开发、优化特色课程，是三级课程体系落地、校本课程提质的核心力量。2\\.从知识传授者转变为素养培育的引导者与实践者新课。"},{"t":"教师实现课程创生的核心实践路径","d":"心实践路径1\\.更新教育理念，树立课程创生意识课程创生的前提是理念革新，教师首先要彻底摒弃“课程开发是专家专属工作、教师只需授课”的固化认知，树立全员课程建设、全程课程创生的全新理念。主动对接新课改素养导向、三级课程管理的核心要求，明确自身在课程开发、实施、优化中的主体责任，认识到课程不是静态固定的文本，而是在师生互动、实践探索中动态生成的育人载体。学校可通过专题培训、教研研讨、课改分享等方式，帮助教师转变认知，激发教师课程研发的主动性与积极性，为课程创生奠定思想基础。2\\.立足学情调研，精准锚定课程创生方向课程创生的核心目标是服务学生发展，脱离学情的课。"}]}]},{"id":"预测6-2-36","num":36,"title":"36 建构主义","subject":"教心","blocks":[{"t":"（1）依据建构主义知识观、学生观","items":[{"t":"对三组差异化绿化方案的处理：契合知识本质规律，尊重学生经验差异","d":"的处理：契合知识本质规律，尊重学生经验差异从建构主义知识观来看，知识并不是对客观现实绝对无误的终极答案，只是人们对各类现象形成的暂时性解释与假设，具备动态性、情境性与主观性。知识无法脱离具体场景直接套用，不存在放之四海而皆准的标准化方案，需要结合具体情境进行再创造。校园绿化优化本身就是典型的情境化实践问题，需要兼顾场地条件、植物习性、景观需求、养护成本、生态价值等多重维度，不存在唯一绝对正确的设计方案。三组学生分别从景观美学、环境适配、本土生态三个角度形成设计思路，正是知识主观性与情境性的体现——不同学习者基于自身的观察视角、知识储备与思考逻辑，会对同一。"},{"t":"对学生片面认知的处理：遵循认知建构规律，留白激发自主探究","d":"遵循认知建构规律，留白激发自主探究针对第三组学生提出的“种树越多校园越干燥”的片面观点，教师没有当场直接否定纠错，而是顺势引导学生课后自主查阅资料、下节课深度研讨，这一做法同样符合建构主义的核心逻辑。从知识观层面，关于植物蒸腾作用与校园微气候的关联，本身就不是单一、静态的结论，需要结合植物种类、数量、空气流通、土壤条件等多重变量综合分析，具备典型的情境性。学生基于有限的观察经验推导出片面结论，本质上是形成了一个待验证的假设，而不是绝对的错误。建构主义认为知识本身就是在假设、验证、修正的过程中不断发展的，给学生留出探究空间，让学生自主检验假设，正是尊重知识。"}]},{"t":"（2）结合建构主义学习观、教学观","items":[{"t":"项目式学习实践的优势：深度契合建构主义育人逻辑","d":"深度契合建构主义育人逻辑第一，创设真实问题情境，落实学习的情境性。教师选取校园绿化优化这一学生身边的真实问题作为探究主题，打破教室边界，组织学生实地勘察校园绿植分布、光照条件、土壤状况，让生物知识学习嵌入真实的校园改造场景。这一设计完全符合情境性学习的要求，为学生提供了解决现实问题的原型，让学生在真实任务中感知知识的应用价值，避免了书本知识与现实生活割裂的问题。第二，突出学生主体地位，激发学习的主动建构性。教师没有按传统模式逐点讲授植物生长习性、蒸腾作用等知识点，而是提前布置探究任务，由学生分组自主调研、查阅资料、整合数据、设计绿化方案。整个过程中，学生。"},{"t":"创设真实问题情境，落实学习的情境性","d":"实学习的情境性。教师选取校园绿化优化这一学生身边的真实问题作为探究主题，打破教室边界，组织学生实地勘察校园绿植分布、光照条件、土壤状况，让生物知识学习嵌入真实的校园改造场景。这一设计完全符合情境性学习的要求，为学生提供了解决现实问题的原型，让学生在真实任务中感知知识的应用价值，避免了书本知识与现实生活割裂的问题。第二，突出学生主体地位，激发学习的主动建构性。教师没有按传统模式逐点讲授植物生长习性、蒸腾作用等知识点，而是提前布置探究任务，由学生分组自主调研、查阅资料、整合数据、设计绿化方案。整个过程中，学生不再是被动的知识接收者，而是主动的问题解决者，需要。"},{"t":"突出学生主体地位，激发学习的主动建构性","d":"发学习的主动建构性。教师没有按传统模式逐点讲授植物生长习性、蒸腾作用等知识点，而是提前布置探究任务，由学生分组自主调研、查阅资料、整合数据、设计绿化方案。整个过程中，学生不再是被动的知识接收者，而是主动的问题解决者，需要自主调动原有生物知识，加工处理调研信息，形成自己的设计思路。这种模式充分尊重了学习的主动建构属性，让学生在解决问题的过程中完成对新知识的意义建构。第三，搭建学习共同体平台，发挥学习的社会互动性。教师以小组为单位组织探究，课堂设置成果展示、小组互评、质疑辩论环节，构建了多向交流的学习共同体。小组内部成员分工协作、共享信息，共同完成项目任务；。"},{"t":"搭建学习共同体平台，发挥学习的社会互动性","d":"发挥学习的社会互动性。教师以小组为单位组织探究，课堂设置成果展示、小组互评、质疑辩论环节，构建了多向交流的学习共同体。小组内部成员分工协作、共享信息，共同完成项目任务；班级层面不同小组相互质疑、补充观点，在观点碰撞中完善认知。这种模式充分利用了学生的经验差异，将个体的思考转化为共同体的共享资源，体现了建构主义对社会性相互作用的重视。第四，转变教学育人功能，促进知识经验的生长。教师没有将教学等同于传递确定的客观知识，而是将重心放在激发学生探究、推动学生经验生长上。面对学生的片面认知，教师没有直接灌输标准答案，而是将其转化为新的探究课题，引导学生进一步搜集信。"},{"t":"转变教学育人功能，促进知识经验的生长","d":"进知识经验的生长。教师没有将教学等同于传递确定的客观知识，而是将重心放在激发学生探究、推动学生经验生长上。面对学生的片面认知，教师没有直接灌输标准答案，而是将其转化为新的探究课题，引导学生进一步搜集信息、反思原有认知，推动学生对自身的知识经验进行改组、转换与改造。这种定位符合建构主义教学观的核心主张，将教学从“知识传递”转向了“促进知识生长”。"}]},{"t":"（3）运用建构主义理论","items":[{"t":"核心素养导向下教师的角色转型","d":"角色转型第一，从知识讲授者转向真实问题情境的创设者。建构主义教学观强调情境性学习，知识的意义生成于真实的问题场景。教师不再直接罗列知识点、讲解例题，而是挖掘生活中与学科知识紧密关联的真实任务，创设能够引发学生认知冲突、激发探究兴趣的学习情境。就像材料中的生物教师，以校园绿化优化为项目主题，把课堂延伸到真实的校园环境，创设出需要运用生物知识解决的现实问题，为学生的知识建构搭建了真实的场景载体。第二，从内容传递者转向学习支架的搭建者。建构主义认为学生依托原有经验生长新知识，但学生的原有经验与认知能力存在局限，在复杂探究任务中容易遇到障碍。教师的核心任务不再是。"},{"t":"从知识讲授者转向真实问题情境的创设者","d":"问题情境的创设者。建构主义教学观强调情境性学习，知识的意义生成于真实的问题场景。教师不再直接罗列知识点、讲解例题，而是挖掘生活中与学科知识紧密关联的真实任务，创设能够引发学生认知冲突、激发探究兴趣的学习情境。就像材料中的生物教师，以校园绿化优化为项目主题，把课堂延伸到真实的校园环境，创设出需要运用生物知识解决的现实问题，为学生的知识建构搭建了真实的场景载体。第二，从内容传递者转向学习支架的搭建者。建构主义认为学生依托原有经验生长新知识，但学生的原有经验与认知能力存在局限，在复杂探究任务中容易遇到障碍。教师的核心任务不再是给出标准答案，而是根据学生的认知水。"},{"t":"从内容传递者转向学习支架的搭建者","d":"支架的搭建者。建构主义认为学生依托原有经验生长新知识，但学生的原有经验与认知能力存在局限，在复杂探究任务中容易遇到障碍。教师的核心任务不再是给出标准答案，而是根据学生的认知水平提供启发性问题、资料线索、方法指引等各类支架，帮助学生跨越认知瓶颈，支撑学生自主完成知识建构。当学生出现认知误区时，教师不直接否定，而是搭建探究支架，引导学生自主查阅资料、开展研讨，自主完成认知修正，并随着学生能力提升逐步撤去支架，培养学生的独立探究能力。第三，从课堂管理者转向学习共同体的组织者。建构主义重视学习的社会互动性，学生之间的经验差异是宝贵的学习资源。教师需要打破单向讲授。"},{"t":"从课堂管理者转向学习共同体的组织者","d":"共同体的组织者。建构主义重视学习的社会互动性，学生之间的经验差异是宝贵的学习资源。教师需要打破单向讲授的课堂结构，组织小组合作探究，搭建课堂交流、互评、辩论的平台，引导学生开展平等对话，鼓励学生表达不同观点，引导学生尊重不同想法，在观点碰撞中完善认知。教师不再是课堂的唯一权威，而是研讨秩序的维护者、对话方向的引导者，推动学习共同体内部的经验共享与思想碰撞。第四，从教学执行者转向学生认知发展的引导者。教学的核心目标是促进学生原有经验的改组与重建，教师需要敏锐捕捉学生的前概念、认知误区，利用认知冲突激发学生的反思意愿。通过启发性提问，引导学生反思自身观点的局。"},{"t":"从教学执行者转向学生认知发展的引导者","d":"认知发展的引导者。教学的核心目标是促进学生原有经验的改组与重建，教师需要敏锐捕捉学生的前概念、认知误区，利用认知冲突激发学生的反思意愿。通过启发性提问，引导学生反思自身观点的局限，推动学生主动检验假设、完成认知重构。教师需要持续观察学生的建构过程，及时发现学生知识碎片化、理论实践脱节等问题，调整教学安排，引导学生梳理整合知识体系，推动认知向纵深发展。第五，从经验型教师转向教学实践的反思研究者。建构主义视角下的教学不是固定不变的标准化流程，教师需要持续观察学生的学习过程，收集学习反馈，反思教学设计的不足。针对项目学习后学生暴露出的理论基础薄弱、知识碎片化等。"}]}]}]},{"id":"预测6-3","name":"预测3","questions":[{"id":"预测6-3-31","num":31,"title":"31 王守仁/王夫之","subject":"中教史","blocks":[{"t":"王守仁的核心教育主张","items":[{"t":"教育目的：致良知与复明本心","d":"【解析】国家文件以培育学生积极心理品质、促进身心健康发展为导向，属于国家层面教育目的的具体体现；分学段设置育人重点，属于不同学段的培养目标；学校依托学段目标设计主题活动，属于课程目标层面的安排；教师将目标转化为可观测、可评价的课堂表现，属于教学目标。因此依次为教育目的、培养目标、课程目标、教学目标，选A。"},{"t":"道德修养：知行合一的实践路径","d":"董仲舒将道德教育视为立政之本，主张德主刑辅，以道德教化为实现仁政的核心手段。在德育内容上，他系统提出“三纲五常”体系：“君为臣纲、父为子纲、夫为妻纲”确立了封建社会的基本伦理秩序，“仁、义、礼、智、信”构成了个体道德修养的核心准则。纲常体系的建立，使道德教育有了明确的标准，成为中国封建社会道德教育的核心内容。在德育原则与方法上，他提出重义轻利的价值追求，主张“正其谊不谋其利，明其道不计其功”；强调“以仁安人，以义正我”，兼顾对他人的尊重与个体的社会责任；主张道德修养中仁智统一、知行合一，同时重视道德情感的培养，激发人性中善的一面。"},{"t":"儿童教育：顺应性情的自然教育","d":"####31.请论述王守仁在教育目的、道德修养、儿童教育方面的主张，分析王夫之在人性论、学习观、教育作用方面的思想特点，比较二人教育思想的异同，并评析明清之际教育思想的启蒙特征。【解析】明代中期以降，程朱理学逐渐僵化教条，教育领域陷入空疏支离的困境。王守仁承陆九渊心学余绪，以“致良知”“知行合一”重构儒家教育的内在逻辑，从心性层面突破程朱理学的束缚；明清之际的王夫之则以唯物主义气学为根基，批判总结宋明理学，提出“性日生日成”等具有启蒙色彩的命题，从实学层面推动传统教育的反思。二人虽分属心学与实学两大路径，却共同推动了中国古代教育思想从中世向近世的转型。"}]},{"t":"王夫之教育思想的核心特点","items":[{"t":"人性论基础：性日生日成的后天建构","d":"性日生日成的后天建构王夫之提出“性日生日成”的著名命题，打破了传统人性论的先验论。他认为人性并非天生固定、一成不变，而是在后天的生长变化过程中逐渐形成的，是环境与教育共同作用的结果。与之对应，教育对人的发展具有双重核心作用：一是“继善成性”，引导人继承善的禀赋、形成完善的道德品性；二是“改恶为善”，矫正青少年时期因失教而形成的恶习。这一人性论将教育从“复性”的框架中解放出来，转向“成性”的后天建构，为教育的价值提供了更具现实性的哲学基础。"},{"t":"学习观：有序、因人与学思并重","d":"学思并重王夫之系统论述了教学过程的规律，形成了辩证的学习方法论。其一，施之有序，认为人的能力是逐步发展的，教学应当遵循由粗到精、由小到大、由事到理的顺序，循序渐进，逐步提升，是对传统循序渐进原则的深化发展。其二，因人而进，强调教学要针对学生的实际情况有的放矢，教师需通过考察品质、询问志向、观察行为了解学生特点，采用差异化的教学方法。其三，学思相资以为功，提出学与思是相辅相成的两条求知路径：学习要虚心吸纳前人经验，拓宽学识基础；思考要突破成规，发挥独立思考能力。“学愈博则思愈远”“思之困则学必勤”，深刻揭示了学与思的辩证关系。"},{"t":"教育作用：治国与育人的双重价值","d":"董仲舒提出“性三品”的人性论，将人性划分为三个等级：圣人之性、中民之性、斗筲之性。圣人能够自觉节制欲望，天生向善；斗筲之人欲望强烈且难以自我约束，趋向为恶，只能依靠刑罚约束；中民之性是大多数人的本性，也是教育的主要对象。在教育作用上，对个体而言，“性非教化不成”，教育能够引导中民之性向善发展，完成人性的塑造；对社会而言，教育是治国的根本，一方面能够培养合格的统治人才，另一方面能够推行社会教化，维护社会秩序。这一理论打破了先秦平等的人性论，为封建等级制度与教育的阶级性提供了理论支撑。"}]},{"t":"二人教育思想的异同比较","items":[{"t":"共通的思想内核：王守仁与王夫之的教育思想都扎根于儒家教育传统，具有诸多共通之处","d":"王守仁与王夫之的教育思想都扎根于儒家教育传统，具有诸多共通之处。其一，都以道德教育为教育的核心，将完善人格、成就圣贤作为教育的终极目标；其二，都强调知行统一，重视道德实践的价值，反对空疏的书本记诵；其三，都尊重教育的个体差异，主张因材施教、循序渐进，契合人的发展规律；其四，都批判程朱理学教育的僵化弊病，致力于打破教条、重构教育的内在活力。"},{"t":"核心的路径分野：二者的思想分歧本质上是心学与气学、唯心与唯物的哲学分野在教育领域的体现","d":"二者的思想分歧本质上是心学与气学、唯心与唯物的哲学分野在教育领域的体现。第一，人性论与教育逻辑不同。王守仁持先验的良知论，认为善性本具，教育是去除遮蔽、复明本心的过程；王夫之持后天的成性论，认为人性日生日成，教育是建构品性、养成人格的过程。第二，理欲观与价值导向不同。王守仁延续“存天理、灭人欲”的核心立场，教育以克制人欲为路径；王夫之主张理欲统一，以节欲代灭欲，肯定了人的合理欲望，更具人文启蒙色彩。第三，求知路径与教育侧重不同。王守仁主张向内求心，通过体悟本心获得真理，教育重心性修养；王夫之主张向外格物，通过学习、思考与实践获得知识，教育重经世致用。第四。"}]},{"t":"明清之际教育思想的启蒙特征","items":[{"t":"从王守仁到王夫之","d":"明清教育思想的演进呈现出鲜明的早期启蒙特征，开启了对传统教育的深度反思。首先，对理学教条的突破与思想解放。王守仁的心学打破了程朱理学的思想垄断，将真理的标准从外在经典转向内在本心，极大地解放了士人的思想；王夫之则从唯物主义立场全面批判宋明理学的空疏与独断，推动思想向实学、实证方向转型。其次，人的主体性的彰显。王守仁强调人人皆有良知、人人可成圣贤，肯定了个体的道德自主性；王夫之强调学思结合、自得力行，凸显了个体在学习与修养中的能动性。二者都从不同维度提升了人的主体地位，蕴含着人本主义的萌芽。再次，教育的实践转向与经世品格。针对传统教育空疏无用的弊病，二人都。"}]}]},{"id":"预测6-3-32","num":32,"title":"32 自然主义三人","subject":"外教史","blocks":[{"t":"三位教育家的核心教育主张","items":[{"t":"夸美纽斯：自然主义教育的制度奠基","d":"第五，搭建中世纪教育向近代教育过渡的桥梁。三大教育力量虽立场各异，但共同继承了欧洲古典文化遗产，在保留宗教文化传统的同时，注入了人文精神、国家意识、普及理念、科学方法等近代教育因子。它们的探索与实践，为夸美纽斯泛智教育、洛克绅士教育等近代教育思想的形成，以及近代学校制度的最终确立积累了宝贵经验，是欧洲教育从中世纪走向近代不可或缺的过渡环节。###材料分析题####33.阅读材料，回答问题。#####（1）结合材料，运用个体主观能动性理论，分析双减后学生分化的原因及教育启示。【解析】个体主观能动性是人的身心发展的内在决定性因素，指个体在与环境的互动中主动进。"},{"t":"卢梭：自然主义教育的思想体系化","d":"思想体系化卢梭是18世纪法国启蒙运动的核心思想家，其教育著作《爱弥儿》被称为教育史上的“哥白尼式革命”。他以性善论与感觉论为哲学基础，构建了完整的自然教育理论体系。卢梭提出教育的核心是“回归自然”，认为人性本善，唯有远离城市喧嚣、遵循自然天性的教育，才能守护儿童的善良本性，培养独立自主、自由平等的“自然人”。在教育原则上，倡导“消极教育”，反对成人对儿童的强制灌输与过度干预，认为教师的职责是创造适宜的学习环境、防范不良影响，而非主动说教；提出“自然后果律”，让儿童从自身行为的自然结果中获得经验教训，而非接受成人的惩罚；强调因材施教，尊重儿童的个体差异，依。"},{"t":"裴斯泰洛齐：自然主义教育的实践科学化","d":"17至19世纪，欧洲教育在启蒙思想与社会变革的推动下，逐步挣脱中世纪宗教神学与经院教育的桎梏，形成了以“教育遵循自然”为核心的自然主义教育发展脉络。夸美纽斯、卢梭、裴斯泰洛齐是这一脉络中三座里程碑式的人物，三者立足不同时代背景，依次推动自然主义教育从制度奠基、思想体系化走向实践科学化，共同驱动了西方教育从传统形态向近代科学形态的深刻转型。"}]},{"t":"三者在自然主义教育思想上的继承与发展关系","items":[{"t":"共同的思想根基：三者都站在新兴资产阶级的立场上","d":"三者都站在新兴资产阶级的立场上，批判中世纪经院教育脱离现实、压抑天性、死记硬背的弊端，反对教会对教育的垄断控制；都主张教育必须遵循自然规律，尊重儿童的本性与身心发展特点，强调人的全面发展；都具有鲜明的人文主义与民主主义色彩，倡导教育普及与教育平等，推动教育从贵族特权向大众权利转变。"},{"t":"递进式的发展脉络"},{"t":"夸美纽斯：自然主义的系统化奠基","d":"第五，搭建中世纪教育向近代教育过渡的桥梁。三大教育力量虽立场各异，但共同继承了欧洲古典文化遗产，在保留宗教文化传统的同时，注入了人文精神、国家意识、普及理念、科学方法等近代教育因子。它们的探索与实践，为夸美纽斯泛智教育、洛克绅士教育等近代教育思想的形成，以及近代学校制度的最终确立积累了宝贵经验，是欧洲教育从中世纪走向近代不可或缺的过渡环节。###材料分析题####33.阅读材料，回答问题。#####（1）结合材料，运用个体主观能动性理论，分析双减后学生分化的原因及教育启示。【解析】个体主观能动性是人的身心发展的内在决定性因素，指个体在与环境的互动中主动进。"},{"t":"卢梭：自然主义的本体化转向","d":"化转向。卢梭继承并深化了“教育适应自然”的理念，实现了自然主义的核心转向——从关注“外在自然规律”转向关注“儿童内在天性”。他彻底打破了传统教育以成人、书本、宗教为中心的逻辑，真正确立了儿童的教育主体地位，赋予自然主义反封建、反专制的启蒙精神，构建了从教育目的、原则到阶段划分的完整思想体系。但卢梭的思想带有浓厚的哲学思辨色彩，理想化程度较高，缺乏系统的实践路径。"},{"t":"裴斯泰洛齐：自然主义的科学化实践","d":"17至19世纪，欧洲教育在启蒙思想与社会变革的推动下，逐步挣脱中世纪宗教神学与经院教育的桎梏，形成了以“教育遵循自然”为核心的自然主义教育发展脉络。夸美纽斯、卢梭、裴斯泰洛齐是这一脉络中三座里程碑式的人物，三者立足不同时代背景，依次推动自然主义教育从制度奠基、思想体系化走向实践科学化，共同驱动了西方教育从传统形态向近代科学形态的深刻转型。"}]},{"t":"自然主义教育演进对近代教育科学化转型的历史意义","items":[{"t":"推动教育的世俗化转型，打破宗教神学的教育垄断","d":"打破宗教神学的教育垄断。自然主义教育逐步削弱了教育的宗教属性：夸美纽斯将大量世俗自然知识纳入泛智课程，卢梭反对过早的宗教灌输与教会的思想控制，裴斯泰洛齐面向平民的世俗国民教育实践，共同推动教育从培养神职人员的工具，转变为培养世俗公民、促进人的发展的社会事业，为近代公共教育制度的建立扫清了思想障碍。第二，确立儿童的教育主体地位，奠定现代教育的人文内核。自然主义教育颠覆了传统教育中教师绝对权威、儿童被动接受的格局，将儿童从教育的客体转变为教育的中心。尊重天性、因材施教、顺应发展规律等理念，逐步成为教育的基本共识，推动教育从“以教为中心”转向“以学为中心”，为。"},{"t":"确立儿童的教育主体地位，奠定现代教育的人文内核","d":"位，奠定现代教育的人文内核。自然主义教育颠覆了传统教育中教师绝对权威、儿童被动接受的格局，将儿童从教育的客体转变为教育的中心。尊重天性、因材施教、顺应发展规律等理念，逐步成为教育的基本共识，推动教育从“以教为中心”转向“以学为中心”，为现代教育的人文性奠定了思想基础。第三，推动教育学从经验思辨走向独立科学，开启教育科学化进程。夸美纽斯首次构建了系统的教育理论体系，让教育学从哲学与神学中独立出来；卢梭提供了儿童本位的哲学基础，拓展了教育研究的核心维度；裴斯泰洛齐提出“教育心理学化”，将心理学引入教育研究，为后来赫尔巴特教育理论、实验教育学思潮的兴起奠定了基。"},{"t":"推动教育学从经验思辨走向独立科学，开启教育科学化进程","d":"裴斯泰洛齐是19世纪瑞士著名教育家，被称为“国民教育之父”，他毕生致力于贫苦儿童教育，将自然主义教育思想转化为系统的实践体系，推动教育向科学化方向发展。裴斯泰洛齐提出和谐教育论，认为教育的终极目的是发展人的天赋内在力量，实现德、智、体全面和谐的发展，人人都有权获得符合自身天性的教育。其最核心的创见是要素教育论，主张任何学科的教学都应从最简单、最基本的要素开始，由简到繁、循序渐进地促进儿童发展：德育的基本要素是亲子之爱，由爱家人逐步扩展到爱全人类；智育的基本要素是数目、形状与语言，通过计算、测量、言语训练发展认知能力；体育的基本要素是关节活动，从基础动作逐。"},{"t":"构建近代学校教育的制度与实践框架","d":"度与实践框架。夸美纽斯创立的班级授课制、学年制、统一学制，成为近代各国学校制度的标准模式，极大提升了教育普及的效率；裴斯泰洛齐的要素教学法、各科教学法，奠定了近代初等教育的教学实践范式；普及教育、国民教育的思想，推动了近代公共教育体系的建立，为教育的规模化、规范化发展提供了制度支撑。当然，这一时期的自然主义教育也存在时代局限，如夸美纽斯思想中的宗教残余、卢梭自然教育的理想化色彩、裴斯泰洛齐要素教育的机械主义倾向等。但整体而言，这一思想演进脉络从根本上改变了西方教育的发展方向，为近代教育的科学化、民主化、世俗化奠定了坚实基础，其核心理念至今仍是世界教育发展。"}]}]},{"id":"预测6-3-33","num":33,"title":"33 教学目标与评价","subject":"教原","blocks":[{"t":"（1）结合布卢姆教育目标分类学（修订版）","items":[{"t":"语文教师修改后教学目标的认知层次定位","d":"标的认知层次定位修订后的语文教学目标摆脱了“体会父爱”的空泛表述，转向可操作、可观测的具体要求，对应认知领域从基础到高阶的多个层级，形成了递进式的认知目标体系。第一，记忆与理解层：锚定文本基础，筑牢认知底层支撑。目标要求“结合文中父亲买橘子、车站送别时的动作、语言细节语句”开展分析，其前提是学生能够准确回忆、识别文本中的关键细节，读懂语句的表层含义，这对应认知领域的记忆与理解层次。记忆是对文本信息的回忆与再认，理解是对文本内容的解释与说明，二者是开展深度解读的基础。修改后的目标将分析建立在文本细节的基础上，避免了空泛的情感空谈，符合语文阅读“言有据”的基。"},{"t":"数学教师教学目标设计的合理性与实施问题","d":"的合理性与实施问题数学教师针对函数专题设计三级分层目标，整体符合布卢姆教育目标分类的核心逻辑，具有明显的合理性，但教学实施环节存在明显的目标与实践脱节问题。从目标设计的合理性来看，其一，分层递进，符合认知发展规律。三级目标从“说出定义关键词”到“结合生活实例举例”再到“规范画出图像”，遵循了从简单到复杂、从识记到应用的认知发展顺序，对应认知领域的记忆、理解、应用层次，同时涵盖动作技能领域的操作与准确层次，目标梯度清晰，符合学生的认知进阶规律。其二，具体可测，避免空泛虚化。每一级目标都有明确的行为表现与评价标准，“准确说出”“举例说明”“规范画出”都是可观。"}]},{"t":"（2）分析该校课程资源开发存在的不足，提出优化路径","items":[{"t":"该校课程资源开发的突出不足","d":"出不足第一，资源开发意识薄弱，校内资源挖掘不足，校外资源闲置浪费。多数教师缺乏课程资源开发意识，将课程资源窄化为教材、教参等校内文本资源，没有主动挖掘校内的环境、设施、文化等隐性资源，更没有意识到周边丰富的社会资源的育人价值。学校周边的区科技馆、城市博物馆等优质社会资源长期闲置，没有与学科教学建立有机联系，资源优势没有转化为育人优势。第二，校外资源利用形式化，缺乏目标锚定与任务设计。学校组织的校外参观活动往往停留在“走马观花”的层面，缺少与学科教学对应的明确学习任务，也没有配套的评价要求。学生参观完科技馆、博物馆，只是获得了零散的感官体验，没有带着学科问。"},{"t":"资源开发意识薄弱，校内资源挖掘不足，校外资源闲置浪费","d":"内资源挖掘不足，校外资源闲置浪费。多数教师缺乏课程资源开发意识，将课程资源窄化为教材、教参等校内文本资源，没有主动挖掘校内的环境、设施、文化等隐性资源，更没有意识到周边丰富的社会资源的育人价值。学校周边的区科技馆、城市博物馆等优质社会资源长期闲置，没有与学科教学建立有机联系，资源优势没有转化为育人优势。第二，校外资源利用形式化，缺乏目标锚定与任务设计。学校组织的校外参观活动往往停留在“走马观花”的层面，缺少与学科教学对应的明确学习任务，也没有配套的评价要求。学生参观完科技馆、博物馆，只是获得了零散的感官体验，没有带着学科问题开展探究，校外资源没有真正服务。"},{"t":"课程资源开发的优化路径","d":"径第一，强化资源开发意识，构建校内外资源整合格局。引导教师树立大课程资源观，打破“教材即唯一资源”的认知局限，系统梳理校内校外各类育人资源，建立资源清单，明确不同资源的育人价值与适用场景。主动对接周边科技馆、博物馆、企业、社区等校外主体，建立稳定的校外资源合作机制，将社会资源转化为课程育人载体。第二，锚定教学目标设计资源活动，破解形式化困境。所有校外资源的利用，都必须紧扣课时教学目标，设计明确的学习任务与探究问题，让学生带着任务走进校外场景。比如参观科技馆前，明确对应学科知识点的探究任务，让学生在参观中带着问题观察、思考、记录，避免无目的的参观。同时配套。"},{"t":"强化资源开发意识，构建校内外资源整合格局","d":"建校内外资源整合格局。引导教师树立大课程资源观，打破“教材即唯一资源”的认知局限，系统梳理校内校外各类育人资源，建立资源清单，明确不同资源的育人价值与适用场景。主动对接周边科技馆、博物馆、企业、社区等校外主体，建立稳定的校外资源合作机制，将社会资源转化为课程育人载体。第二，锚定教学目标设计资源活动，破解形式化困境。所有校外资源的利用，都必须紧扣课时教学目标，设计明确的学习任务与探究问题，让学生带着任务走进校外场景。比如参观科技馆前，明确对应学科知识点的探究任务，让学生在参观中带着问题观察、思考、记录，避免无目的的参观。同时配套设计评价任务，检验资源利用的。"},{"t":"利用校外资源时三大领域学习目标的设计","d":"域学习目标的设计利用校外资源开展教学，必须对应认知、情感、动作技能三大领域的目标层级，实现资源价值的最大化。在认知领域，要对应从记忆到创造的层级设计目标。比如利用科技馆资源，可设计：记忆层，能准确说出3件以上展品对应的科学原理名称；理解层，能解释核心展品的基本工作逻辑；应用层，能将展品的原理与课本中的知识点建立对应联系；分析层，能分析展品的设计思路与技术优势；评价层，能对展品的改进方向提出自己的判断；创造层，能设计一个简单的同类原理小发明。通过分层目标，让校外资源服务于认知的逐级进阶。在情感领域，要对应价值内化的层级设计目标。比如利用博物馆资源，可设计：。"}]},{"t":"（3）“教—学—评不一致”的问题","items":[{"t":"布卢姆目标分类理论对教学设计的实践价值","d":"#####（3）针对“教—学—评不一致”的问题，论述布卢姆目标分类理论对教学设计的实践价值，以及应用时需要注意的问题。【解析】“教—学—评不一致”是当前中小学课堂教学的突出问题，本质上是目标、教学、评价三者脱节，教学缺乏清晰的目标锚定与闭环设计。布卢姆教育目标分类理论为破解这一问题提供了系统的理论工具，对教学设计具有重要的实践价值；但在应用过程中也需要避免机械化、碎片化等误区，确保理论落地不走样。"},{"t":"推动教学目标精准化，破解目标空泛虚化难题","d":"破解目标空泛虚化难题。布卢姆理论将笼统的育人目标拆解为三大领域、多层级的具体目标，用可观测、可测量的行为动词表述教学目标，让教学从“模糊的感觉”走向“精准的设计”。材料中语文教师将“体会父爱”细化为结合细节分析情感、清晰表达感悟的具体目标，数学教师设计三级分层目标，正是目标精准化的体现。清晰的目标为教学活动指明了方向，避免了教学活动的随意性与碎片化，从源头上为教-学-评一致奠定了基础。第二，指引教学活动系统化，促进教学与目标的匹配。布卢姆的目标层级逻辑，为教学活动的设计提供了清晰的参照。教师可以根据不同层级的目标，匹配对应的教学活动：记忆层目标对应知识回。"},{"t":"应用布卢姆目标分类理论的注意事项","d":"论的注意事项第一，避免目标碎片化，保持育人目标的整体性。布卢姆理论将目标划分为不同领域、不同层级，是为了精准设计，而非割裂育人目标。在应用中不能机械地将目标拆分为孤立的碎片，忽视三者之间的内在关联。比如语文教学不能只设计认知目标，还要同步设计情感目标，实现文以载道、情理交融；数学教学不能只关注认知与技能，还要培养学生的科学精神与探究兴趣。要始终把握育人的整体性，让不同领域、不同层级的目标相互支撑、协同发力。第二，避免机械化套用，保留教学的灵活性与创造性。布卢姆目标分类提供的是框架参考，而非固定的模板。不同学科、不同课型、不同学情的目标设计应当灵活调整，不。"},{"t":"避免目标碎片化，保持育人目标的整体性","d":"育人目标的整体性。布卢姆理论将目标划分为不同领域、不同层级，是为了精准设计，而非割裂育人目标。在应用中不能机械地将目标拆分为孤立的碎片，忽视三者之间的内在关联。比如语文教学不能只设计认知目标，还要同步设计情感目标，实现文以载道、情理交融；数学教学不能只关注认知与技能，还要培养学生的科学精神与探究兴趣。要始终把握育人的整体性，让不同领域、不同层级的目标相互支撑、协同发力。第二，避免机械化套用，保留教学的灵活性与创造性。布卢姆目标分类提供的是框架参考，而非固定的模板。不同学科、不同课型、不同学情的目标设计应当灵活调整，不能生硬套用层级标签。教师要结合学科特点。"}]}]},{"id":"预测6-3-34","num":34,"title":"34 唤醒·归因·习得性无助","subject":"教心","blocks":[{"t":"（1）结合耶克斯—多德森定律","items":[{"t":"小宇考试发挥失常的深层原因","d":"层原因第一，目标单一化导致动机过载，突破最佳区间。小宇将考入重点高中作为初三阶段唯一的学习目标，将单次期中考试的重要性过度放大，使得考试动机强度过高，远远超出了最佳水平。过高的动机强度会引发过度的焦虑与紧张，大量占用认知资源，干扰思维过程的正常运转：考试时遇到稍难的题目就心跳加速、注意力难以集中，大脑的算力被焦虑情绪消耗，无法集中在题目分析与思路推导上。同时，过度紧张引发了不自信与强迫性行为，让他反复回头检查基础题的计算结果，看似谨慎，实则浪费了大量答题时间，最终导致后面的综合大题作答时间严重不足，成绩大幅下滑。这完全符合倒U型曲线的规律：动机超过临界点。"},{"t":"目标单一化导致动机过载，突破最佳区间","d":"载，突破最佳区间。小宇将考入重点高中作为初三阶段唯一的学习目标，将单次期中考试的重要性过度放大，使得考试动机强度过高，远远超出了最佳水平。过高的动机强度会引发过度的焦虑与紧张，大量占用认知资源，干扰思维过程的正常运转：考试时遇到稍难的题目就心跳加速、注意力难以集中，大脑的算力被焦虑情绪消耗，无法集中在题目分析与思路推导上。同时，过度紧张引发了不自信与强迫性行为，让他反复回头检查基础题的计算结果，看似谨慎，实则浪费了大量答题时间，最终导致后面的综合大题作答时间严重不足，成绩大幅下滑。这完全符合倒U型曲线的规律：动机超过临界点后，强度越高，行为表现越差。第二。"},{"t":"班主任引导全班调整考试动机的实施路径","d":"试动机的实施路径第一，引导理性看待考试，适度降低动机预期。通过主题班会、小组讨论、个别谈心等多层方式，引导学生正确认识考试的功能定位：考试只是阶段学习的检测工具，目的是诊断知识漏洞、优化后续学习，而非决定未来的终极审判，弱化单次考试与升学目标的强绑定。帮助学生建立多元的学习目标体系，将“考高分、升名校”的单一远期目标，拆解为“掌握核心知识点、提升解题速度、积累应试经验”等多层近期目标，避免将所有压力集中在单次分数排名上，让整体动机强度逐步回归最佳区间。第二，结合任务难度匹配动机，分层调节备考状态。引导学生建立“任务难度—动机强度”的匹配意识：对于基础题，。"},{"t":"引导理性看待考试，适度降低动机预期","d":"度降低动机预期。通过主题班会、小组讨论、个别谈心等多层方式，引导学生正确认识考试的功能定位：考试只是阶段学习的检测工具，目的是诊断知识漏洞、优化后续学习，而非决定未来的终极审判，弱化单次考试与升学目标的强绑定。帮助学生建立多元的学习目标体系，将“考高分、升名校”的单一远期目标，拆解为“掌握核心知识点、提升解题速度、积累应试经验”等多层近期目标，避免将所有压力集中在单次分数排名上，让整体动机强度逐步回归最佳区间。第二，结合任务难度匹配动机，分层调节备考状态。引导学生建立“任务难度—动机强度”的匹配意识：对于基础题，保持适度的紧张感，保障细心程度；对于难题与。"}]},{"t":"（2）运用韦纳成败归因理论","items":[{"t":"小宇的归因类型与动机影响","d":"影响小宇的归因呈现出混合特征，但核心是消极的不可控归因，容易引发自我否定与动机衰退。第一，核心归因：能力归因（内部、稳定、不可控）。小宇成绩下滑后认为“自己根本不适合学数学”，这是将失败归因为自身能力不足，属于内部、稳定、不可控的归因。从控制点维度看，归因为内部因素会引发羞愧、自我否定的负面情绪；从稳定性维度看，能力是相对稳定的因素，会让学生形成“自己现在学不好，未来也学不好”的消极预期；从可控性维度看，能力是个人意志无法改变的，会让学生产生强烈的无力感，觉得再努力也无法改变现状。这种归因模式是所有归因中最容易削弱学习动机的类型。第二，辅助归因：任务难度。"},{"t":"小浩的归因类型与动机影响","d":"影响小浩将成绩下滑归结为“课后习题训练量不足、解题熟练度不够”，属于典型的努力归因，是内部、不稳定、可控的归因类型。从控制点维度看，努力属于内部因素，将失败归因为努力不足，不会从根本上否定自身能力，不会引发深度的自我否定与价值感崩塌；从稳定性维度看，努力程度是不稳定的，可以通过自身行动快速调整，学生相信只要增加训练量、提升熟练度，成绩就能回升，对未来的成绩提升抱有积极预期；从可控性维度看，努力是个人意志可以控制的因素，失败后不会产生无力感，反而会立刻激发行动动力，主动调整学习策略，针对性查漏补缺。这种归因模式对学习动机有显著的强化作用：一方面，保护了学习。"},{"t":"两种归因的动机影响对比","d":"比第一，自我认知影响不同：小宇的能力归因打击自我效能感，小浩的努力归因保护自我价值感。同样是考试失败，小宇否定了自己的数学学习能力，自我认知走向消极，甚至产生自我怀疑；小浩认为只是训练量与熟练度不足，没有否定自身潜力，自我认知保持积极稳定。第二，后续行为不同：小宇的不可控归因会导致回避与放弃，小浩的可控归因会激发主动行动。小宇会因为觉得“不适合学数学”而逃避数学学习，减少在数学学科的精力投入，甚至产生畏难情绪；小浩会立刻制定学习计划，增加专项习题训练，主动查漏补缺，用实际行动改变现状。第三，长期发展不同：小宇的稳定消极归因容易形成习得性无助，小浩的可控归。"},{"t":"自我认知影响不同：小宇的能力归因打击自我效能感，小浩的努力归因保护自我价值感","d":"小宇的能力归因打击自我效能感，小浩的努力归因保护自我价值感。同样是考试失败，小宇否定了自己的数学学习能力，自我认知走向消极，甚至产生自我怀疑；小浩认为只是训练量与熟练度不足，没有否定自身潜力，自我认知保持积极稳定。第二，后续行为不同：小宇的不可控归因会导致回避与放弃，小浩的可控归因会激发主动行动。小宇会因为觉得“不适合学数学”而逃避数学学习，减少在数学学科的精力投入，甚至产生畏难情绪；小浩会立刻制定学习计划，增加专项习题训练，主动查漏补缺，用实际行动改变现状。第三，长期发展不同：小宇的稳定消极归因容易形成习得性无助，小浩的可控归因形成良性循环。长期将失败。"}]},{"t":"（3）设计本次主题班会的教育要点","items":[{"t":"主题班会的核心教育要点","d":"点第一，认知重构：正确认识考试的价值与成败的意义。班会开篇通过问题引导、案例讨论，带领学生跳出“考试定终身”的认知误区，明确考试是阶段学习的诊断工具，核心价值是发现知识漏洞、优化后续学习，而非评判个人能力与未来的标尺。通过“考试的意义”小组分享，让学生明白一次考试的成败不代表整体的学习能力，更不决定未来的发展高度，弱化考试的功利属性，降低不必要的动机过载。同时引导学生转换视角看待失败：失败的考试比成功的考试更有成长价值，因为它能精准暴露自己的知识盲区与策略问题，为后续提升指明方向。第二，归因引导：学习积极归因的方法与思维。设置“归因卡片辨析”活动，带领学。"},{"t":"认知重构：正确认识考试的价值与成败的意义","d":"第一，学习本质的认知差异：主动发现建构与意义接受同化。布鲁纳认为，学习的本质是学习者主动获得知识、转化信息、评价结果，进而重组自身认知结构的过程，核心是“做中学”，强调个体的主动探索与认知重构。奥苏伯尔则认为，学习的本质是新知识与认知结构中已有的适当观念建立非人为的、实质性的联系，实现知识的意义同化，核心是“理解中学”，强调个体对知识的主动理解与系统内化。前者侧重认知结构的动态重组，后者侧重认知结构的有序扩充。第二，教学模式的路径差异：发现式探究与接受式讲授。在教学路径上，布鲁纳倡导发现学习模式，主张教师创设问题情境，引导学生亲自经历知识的发现过程，教师。"},{"t":"引导积极归因、预防习得性无助的长效路径","d":"得性无助的长效路径习得性无助是个体在多次受挫后，将失败归因为稳定、不可控的内部因素，产生的“再努力也没用”的放弃心态。预防习得性无助，需要从归因引导、成功体验、评价方式、支持系统四个维度系统发力。第一，强化努力与策略归因，弱化能力归因的负面效应。在日常教学与评价中，教师要多肯定学生的努力、方法、进步，少用“聪明”“笨”等能力标签评价学生。学生取得进步时，强调“这是你认真复习、方法得当的结果”；学生遇到挫折时，引导学生分析“是不是努力方向不对、解题方法有问题”，将失败引向可控的因素，避免学生形成“我不行”的能力否定。第二，创造阶梯式成功体验，积累自我效能感。"}]}]},{"id":"预测6-3-35","num":35,"title":"35 教学模式","subject":"教原","blocks":[{"t":"（1）阐释逆向设计教学模式与问题教学模式的内涵","items":[{"t":"两种教学模式的核心内涵：逆向设计教学模式是典型的“以终为始”的教学设计范式","d":"涵逆向设计教学模式是典型的“以终为始”的教学设计范式，核心逻辑是先确定学习结束后学生应当达成的最终预期成果，再制定可衡量、可观测的评价量规，最后反向设计具体的学习任务与教学活动，所有教学环节都指向最终成果的达成。其核心特征是评价前置、目标引领，教学活动不再是盲目的知识传递，而是有明确方向的能力建构。这种模式适合知识结论相对明确、同时又需要锻炼学生逆向推理与成果意识的内容，能够有效激发学生的学习目标感，锻炼学生的逆向思维与整体规划能力。问题教学模式是以问题为核心驱动的教学范式，核心逻辑是教师围绕教学目标设计贴近学生生活的真实问题，以问题激发学生的探究兴趣，。"},{"t":"张老师逆向设计教学实践的评析","d":"践的评析张老师采用逆向设计模式，先确定单元最终学习成果，制定详细评价量规，再反向安排学习任务与课时，整体设计符合逆向设计的核心理念，具有突出的优势。其一，目标导向清晰，教学针对性强。以最终成果为起点反向设计教学，所有学习任务都指向明确的能力目标，避免了传统教学“走一步看一步”的盲目性，也让学生清晰知晓学习的终点要求，提升学习的目标感与主动性。其二，评价前置，实现教-学-评一致性。提前制定评价量规，让学生清楚成果的评价标准，能够引导学生自主对照标准调整学习过程，也为教学评价提供了明确依据，有利于形成教学闭环。其三，锻炼逆向思维与整体规划能力。从最终成果倒推。"},{"t":"李老师问题教学模式实践的评析","d":"践的评析李老师采用问题教学模式，借助春游租车费用预算的真实生活问题引入一元一次不等式的学习，引导学生在解决实际问题中自主归纳解法，整体践行了问题教学的核心逻辑，育人价值突出。其一，真实问题驱动，激发内在学习动机。租车预算是学生生活中真实可感的场景，打破了数学知识的抽象感，让学生感受到知识的应用价值，有效激发探究兴趣，避免了传统数学教学的枯燥感。其二，做中学建构知识，培养问题解决能力。学生在解决预算问题的过程中，自主调动已有知识，尝试、调整、归纳不等式的解法，知识不是教师灌输的，而是学生在问题解决中自主建构的，同时也培养了分析问题、解决实际问题的能力。其三。"}]},{"t":"（2）分析项目探究教学、STEM教学实施过程中的共同现实挑…","items":[{"t":"两类模式实施的共同现实挑战","d":"实挑战第一，教师端：备课负担大幅增加，专业能力面临挑战。两类模式都不再是传统的“教教材”，而是需要教师自主开发课程、设计项目、整合资源、设计评价体系。比如学校科学组开发校园生态改造、智能灌溉等STEM主题课程，需要教师跨学科整合科学、数学、工程、技术等多领域知识，还要设计项目流程、准备实践材料、设计评价方案，工作量远大于传统教学，导致教师备课压力大。同时，传统分科培养背景下的教师大多只精通单一学科，跨学科知识储备不足，项目设计与引导能力参差不齐，容易导致项目教学质量参差不齐。第二，效率端：课时占用多，系统知识覆盖不足。项目探究与STEM教学都需要大量的时。"},{"t":"教师端：备课负担大幅增加，专业能力面临挑战","d":"增加，专业能力面临挑战。两类模式都不再是传统的“教教材”，而是需要教师自主开发课程、设计项目、整合资源、设计评价体系。比如学校科学组开发校园生态改造、智能灌溉等STEM主题课程，需要教师跨学科整合科学、数学、工程、技术等多领域知识，还要设计项目流程、准备实践材料、设计评价方案，工作量远大于传统教学，导致教师备课压力大。同时，传统分科培养背景下的教师大多只精通单一学科，跨学科知识储备不足，项目设计与引导能力参差不齐，容易导致项目教学质量参差不齐。第二，效率端：课时占用多，系统知识覆盖不足。项目探究与STEM教学都需要大量的时间开展实践、探究、制作、交流，课。"},{"t":"效率端：课时占用多，系统知识覆盖不足","d":"系统知识覆盖不足。项目探究与STEM教学都需要大量的时间开展实践、探究、制作、交流，课时安排紧张。相比传统讲授式单位时间内的知识传递量，两类模式下学生获得的系统知识点相对较少，容易出现知识碎片化的问题。材料中提到的“系统知识点覆盖不足”，正是这类模式的普遍问题：学生参与度高、兴趣浓，但知识体系不够完整，学科逻辑的系统性不足，长期来看可能影响学生的知识基础扎实度，也与应试评价体系存在一定的张力。第三，学生端：能力分层加剧，学困生适配困难。两类模式都对学生的自主探究能力、知识基础、思维水平有较高要求，学生之间的能力差异会被放大。基础扎实、思维活跃的学生能在项。"},{"t":"学生端：能力分层加剧，学困生适配困难","d":"学困生适配困难。两类模式都对学生的自主探究能力、知识基础、思维水平有较高要求，学生之间的能力差异会被放大。基础扎实、思维活跃的学生能在项目中充分锻炼能力、快速成长；而基础薄弱、自主学习能力弱的学生，容易在自主探究中迷失方向，跟不上进度，出现“优生更优、学困生更困”的两极分化现象。这与逆向设计、问题教学中出现的问题本质一致，是所有高自主性教学模式共同面临的学情挑战。第四，适配端：内容适配性有限，并非所有内容都适合。两类模式都有其适用边界，不是所有教学内容都适合用项目或STEM的方式开展。比如基础概念、定义定理、系统的知识体系，用讲授式效率更高；如果盲目将所。"},{"t":"适配端：内容适配性有限，并非所有内容都适合","d":"限，并非所有内容都适合。两类模式都有其适用边界，不是所有教学内容都适合用项目或STEM的方式开展。比如基础概念、定义定理、系统的知识体系，用讲授式效率更高；如果盲目将所有内容都项目化，不仅效率低下，还容易出现内容理解肤浅、基础不牢的问题。材料中提到“并非所有的教学内容都适合采用项目式学习的方式开展”，正是对这一适配边界的清醒认知。"}]},{"t":"（3）论述教师选择教学模式的主要依据","items":[{"t":"教师选择教学模式的主要依据","d":"#####（3）论述教师选择教学模式的主要依据，说明如何避免教学模式运用的形式化倾向。【解析】教学模式没有绝对的优劣之分，只有适不适合的区别。教师选择教学模式，必须立足教学目标、教学内容、学生学情、教学条件等多重依据，理性选择、灵活运用，才能避免为了创新而创新的形式化倾向，真正发挥模式的育人价值。"},{"t":"依据教学目标的定位选择模式","d":"择模式。教学模式是服务于育人目标的工具，选择的根本依据是教学目标。如果教学目标是系统传授基础知识、夯实学科基础，那么高效的讲授式教学更合适；如果目标是培养学生的问题意识与应用能力，适合采用问题教学模式；如果目标是强化成果意识、锻炼逆向思维与任务规划能力，适合采用逆向设计模式；如果目标是培养跨学科综合素养、实践创新能力，适合采用项目探究与STEM教学模式。不能脱离目标谈模式创新，否则就会本末倒置。第二，依据教学内容的特点匹配模式。不同的教学内容有不同的属性，适配的模式也不同。对于基础概念、抽象定义、系统的学科原理，讲授式效率更高，能够快速帮助学生建立知识框。"},{"t":"依据教学内容的特点匹配模式","d":"配模式。不同的教学内容有不同的属性，适配的模式也不同。对于基础概念、抽象定义、系统的学科原理，讲授式效率更高，能够快速帮助学生建立知识框架；对于应用性强、与生活联系紧密的内容，适合用问题教学，让学生在应用中理解知识；对于有明确成果标准、强调能力落地的内容，适合逆向设计；对于综合性强、跨学科的实践主题，适合项目探究与STEM模式。比如数学中的基础概念学习，不适合全程用项目式，而应用类内容则适合结合生活问题展开。第三，依据学生的学情特点调整模式。学生的年龄阶段、认知水平、知识基础、能力结构，直接决定模式的适配性。低年级、基础薄弱的学生，需要更多的引导与小步子。"},{"t":"依据学生的学情特点调整模式","d":"整模式。学生的年龄阶段、认知水平、知识基础、能力结构，直接决定模式的适配性。低年级、基础薄弱的学生，需要更多的引导与小步子教学，不宜采用自主性太强、难度太高的探究模式；高年级、基础扎实、思维活跃的学生，可以给予更多的自主探究空间，更多采用项目式、问题式教学。同时要考虑班级的整体水平与分层差异，避免一刀切的模式套用。第四，依据教学的资源条件适配模式。教学模式的落地需要课时、场地、资源、师资等条件支撑。课时充足、实践资源丰富、师资能力强的学校，可以更多开展项目探究与STEM教学；课时紧张、资源有限、师资不足的情况下，要优先保障基础教学的效率，适度开展探究活动。"},{"t":"依据教学的资源条件适配模式","d":"配模式。教学模式的落地需要课时、场地、资源、师资等条件支撑。课时充足、实践资源丰富、师资能力强的学校，可以更多开展项目探究与STEM教学；课时紧张、资源有限、师资不足的情况下，要优先保障基础教学的效率，适度开展探究活动。不能脱离实际条件盲目照搬先进模式，否则只会流于形式。"}]}]},{"id":"预测6-3-36","num":36,"title":"36 自我效能·目标定向","subject":"教心","blocks":[{"t":"（1）自我效能感理论","items":[{"t":"三名学生的自我效能感水平及对学习行为的影响","d":"水平及对学习行为的影响第一，小陈：自我效能感中等偏上但稳定性弱，呈现“结果依赖性”特征。小陈数学基础较好，说明其具备一定的成功经验支撑，对熟悉、有把握的题目有较高的效能感；但他的自我效能感高度绑定考试分数与班级排名，缺乏稳定的内在支撑。一旦成绩下滑，就快速陷入自我否定，效能感断崖式下降。对学习行为的影响体现在三个层面：其一，任务选择保守，回避挑战，答题时只敢回答自己有把握的题目，不敢尝试不确定的难题，限制了能力提升的空间；其二，抗挫能力弱，成绩出现波动就自我怀疑，无法理性分析问题原因；其三，情绪唤醒过度，考前极度焦虑，考试中大量认知资源被情绪消耗，影响正。"},{"t":"小陈：自我效能感中等偏上但稳定性弱，呈现“结果依赖性”特征","d":"偏上但稳定性弱，呈现“结果依赖性”特征。小陈数学基础较好，说明其具备一定的成功经验支撑，对熟悉、有把握的题目有较高的效能感；但他的自我效能感高度绑定考试分数与班级排名，缺乏稳定的内在支撑。一旦成绩下滑，就快速陷入自我否定，效能感断崖式下降。对学习行为的影响体现在三个层面：其一，任务选择保守，回避挑战，答题时只敢回答自己有把握的题目，不敢尝试不确定的难题，限制了能力提升的空间；其二，抗挫能力弱，成绩出现波动就自我怀疑，无法理性分析问题原因；其三，情绪唤醒过度，考前极度焦虑，考试中大量认知资源被情绪消耗，影响正常发挥，形成“越想考好越考不好”的恶性循环。第二。"},{"t":"小林：高且稳定的自我效能感，呈现“能力成长性”特征","d":"效能感，呈现“能力成长性”特征。小林对自身的学习能力有积极稳定的判断，相信通过努力可以提升水平、解决问题。对学习行为的影响十分积极：其一，主动选择挑战性任务，乐于主动挑战综合性难题，不畏惧失败；其二，挫折坚持性强，考试失利后不会自我否定，而是主动查找知识漏洞，整理错题本、总结解题方法，将失败转化为提升的契机；其三，行为持续性好，坚持用方法优化学习，数学成绩稳步提升，形成“挑战—总结—提升”的良性循环；其四，情绪状态稳定，不会因为单次考试波动否定自身，学习的内在动力充足。第三，小周：低自我效能感，呈现“能力固化”特征。小周坚信自己天生学不好数学，对自身完成。"},{"t":"小周：低自我效能感，呈现“能力固化”特征","d":"呈现“能力固化”特征。小周坚信自己天生学不好数学，对自身完成数学学习任务的能力持完全否定的判断，效能感处于极低水平。对学习行为的影响完全是负面的：其一，主动回避学习任务，上课状态消极、课后作业敷衍，不再主动参与学习任务；其二，自我设限保护自尊，为了避免努力后依然失败的尴尬，索性放弃努力，用“不努力”为自己的差成绩找借口，避免暴露“能力不足”；其三，行为陷入恶性循环，越不努力成绩越差，成绩越差越不相信自己能学好，最终彻底放弃。"},{"t":"影响自我效能感形成的主要因素","d":"#####（1）根据自我效能感理论，分析小陈、小林、小周三人的自我效能感水平及其对学习行为的影响，并说明影响自我效能感形成的主要因素。【解析】自我效能感是个体对自身能否成功完成特定任务的主观判断，直接影响个体对任务的选择、努力程度、坚持性与情绪状态，是驱动学习行为的重要内在变量。三名学生在数学学习中的行为差异，本质上是自我效能感水平与稳定性的显著差异。"}]},{"t":"（2）运用自我价值理论","items":[{"t":"类型判断与依据：小周属于低趋高避型（逃避失败者）","d":"小周属于低趋高避型（逃避失败者），核心特征是对成功的趋近动机弱，对失败的回避动机强，学习的核心动力不是追求成功，而是避免失败带来的自我价值伤害。判断依据体现在两个维度：其一，低趋：对学习成功没有主动追求的欲望，上课状态消极、课后作业敷衍，不主动参与学习任务，不期待通过努力获得好成绩，对学业进步没有向往。其二，高避：高度恐惧失败对自尊的打击，认为自己天生学不好数学，为了保护自己的自尊，索性选择放弃努力。这种选择本质上是一种自我防御：如果努力了还是学不好，就等于证明自己能力差，会彻底摧毁自我价值；而不努力的话，失败就可以归因于“没好好学”，而非能力不足，从而。"},{"t":"行为背后的心理机制：自我价值理论认为","d":"#####（2）运用自我价值理论，判断小周属于四种动机类型中的哪一种，并结合其学习表现说明判断依据，分析其行为背后的心理机制，并为王老师提出转化小周的教育建议。【解析】自我价值理论从自尊保护的视角解释学生的学习动机，认为学生的核心动机是维护自我价值感，能力、成功、自我价值三者形成连锁关系。基于对成功的趋近与对失败的回避两个维度，学生可分为高趋低避、高趋高避、低趋高避、低趋低避四种类型，小周属于典型的低趋高避型，即逃避失败者。"},{"t":"转化小周的教育建议","d":"#####（2）运用自我价值理论，判断小周属于四种动机类型中的哪一种，并结合其学习表现说明判断依据，分析其行为背后的心理机制，并为王老师提出转化小周的教育建议。【解析】自我价值理论从自尊保护的视角解释学生的学习动机，认为学生的核心动机是维护自我价值感，能力、成功、自我价值三者形成连锁关系。基于对成功的趋近与对失败的回避两个维度，学生可分为高趋低避、高趋高避、低趋高避、低趋低避四种类型，小周属于典型的低趋高避型，即逃避失败者。"},{"t":"创设低风险成功情境，阶梯式积累成功经验","d":"阶梯式积累成功经验。降低任务难度，为小周设计符合其水平的阶梯式学习任务，从最基础的题目入手，让他在不断完成小任务的过程中获得成功体验，逐步打破“自己学不好”的认知。每次成功都及时肯定，让他感受到努力带来的进步，逐步建立“努力就能进步”的联结，而不是用难题反复打击其信心。第二，引导正确归因，剥离能力与自我价值的绑定。通过归因训练，引导小周将成绩好坏归因为努力程度、解题方法、练习量等可控、可改变的因素，而非天生能力。比如考得不好时，引导他分析是哪些知识点没掌握、哪种题型不熟练，而不是归因为“自己笨”。同时强调能力的成长性，让他明白数学能力可以通过练习逐步提升。"},{"t":"引导正确归因，剥离能力与自我价值的绑定","d":"力与自我价值的绑定。通过归因训练，引导小周将成绩好坏归因为努力程度、解题方法、练习量等可控、可改变的因素，而非天生能力。比如考得不好时，引导他分析是哪些知识点没掌握、哪种题型不熟练，而不是归因为“自己笨”。同时强调能力的成长性，让他明白数学能力可以通过练习逐步提升，不是天生固定的，打破“能力天生决定论”的认知。第三，改革评价方式，弱化能力评价，强化过程评价。改变以分数、排名评价学生的方式，更多关注学生的努力程度、进步幅度、方法优化。评价时对事不对人，肯定具体的努力与改进，不贴“聪明”“笨”的标签。比如肯定小周作业中完成的部分，肯定他的点滴进步，让他感受到。"}]},{"t":"（3）结合目标定向理论","items":[{"t":"小陈与小林的目标定向类型与行为差异","d":"#####（3）结合目标定向理论，比较小陈与小林的目标定向类型及其学习行为差异，并结合《关于做好2026年普通高校招生工作的通知》的要求，阐述教师应如何引导学生形成积极的成就目标定向。【解析】目标定向理论基于个体的能力内隐观，将成就目标分为表现目标与掌握目标两类：持能力实体观的个体倾向于表现目标，核心是证明能力；持能力增长观的个体倾向于掌握目标，核心是提升能力。小陈与小林恰好对应两种典型的目标定向，在学习行为、挫折反应、发展路径上呈现显著差异。结合教育部相关通知中加强学业指导、关注心理健康的要求，教师需要系统引导学生形成积极的掌握目标定向。"},{"t":"小陈：表现目标定向，持能力实体观","d":"持能力实体观。小陈默认能力是固定的、天生的，学习的核心目的是通过好分数、好排名向他人证明自己的能力，获得正面评价。其行为差异体现在：其一，任务选择保守，回避可能暴露能力不足的挑战性任务，只敢做有把握的题目，避免挑战失败影响“聪明”的形象；其二，价值绑定分数，过度看重班级排名与分数高低，将成绩等同于自身能力与价值；其三，挫折承受力弱，成绩下滑就陷入自我否定，把失败归因为能力不足，容易产生自我怀疑；其四，情绪压力大，考试过度焦虑，担心考不好证明自己能力差，大量认知资源被情绪消耗，影响发挥。第二，小林：掌握目标定向，持能力增长观。小林认为能力是可以通过努力、练。"},{"t":"小林：掌握目标定向，持能力增长观","d":"持能力增长观。小林认为能力是可以通过努力、练习不断提升的，学习的核心目的是掌握知识、提升技能、发展自身能力，而非向他人证明。其行为差异体现在：其一，主动选择挑战，乐于攻克综合性难题，把挑战当作提升能力的机会，不畏惧失败；其二，关注自身成长，不纠结分数排名，更关注自己有没有掌握方法、弥补漏洞；其三，挫折适应性强，考试失利后不会自我否定，而是主动查找知识漏洞，整理错题、总结方法，把失败当作学习的契机；其四，发展持续性强，通过持续的方法优化与努力，实现成绩稳步提升，形成良性循环。"},{"t":"引导学生形成积极成就目标定向的实践路径","d":"目标定向的实践路径教育部相关通知明确要求加强学生学业发展指导、关注学习心理健康，引导学生形成积极的成就目标定向，是落实这一要求的核心抓手，具体可从以下方面推进：第一，传递能力增长观，重塑学生的能力认知。通过课堂渗透、主题班会、榜样分享等多种方式，向学生传递“能力可塑、努力提升”的成长型思维。结合学科学习规律，让学生明白知识可以积累、技能可以训练、方法可以优化，成绩提升的本质是能力的成长，而非天生智力的证明。比如用学生进步的真实案例，说明努力带来的能力变化，打破“能力天生固定”的实体观。第二，优化教学目标设计，突出掌握导向。将教学目标从“考高分”转向“掌握。"},{"t":"传递能力增长观，重塑学生的能力认知","d":"学生的能力认知。通过课堂渗透、主题班会、榜样分享等多种方式，向学生传递“能力可塑、努力提升”的成长型思维。结合学科学习规律，让学生明白知识可以积累、技能可以训练、方法可以优化，成绩提升的本质是能力的成长，而非天生智力的证明。比如用学生进步的真实案例，说明努力带来的能力变化，打破“能力天生固定”的实体观。第二，优化教学目标设计，突出掌握导向。将教学目标从“考高分”转向“掌握知识、提升能力”，每节课明确学生需要掌握的核心方法、需要提升的关键能力，让学生的注意力聚焦在自身成长，而非和他人比较。比如数学课堂的目标设定为“掌握不等式的三种解法”“提升几何证明的逻辑。"}]}]}]},{"id":"预测6-4","name":"预测4","questions":[{"id":"预测6-4-31","num":31,"title":"31 杨贤江/黄炎培","subject":"中教史","blocks":[{"t":"杨贤江与黄炎培教育思想的共通之处","items":[{"t":"立足救亡语境，回应时代需求","d":"代需求二者都诞生于民族危机深重的近代中国，将教育改革与国家命运深度绑定，都以破解传统教育空疏无用的积弊、培养适配时代需求的人才为出发点。面对近代中国内忧外患的社会局面，二人都拒绝脱离现实的书院式教育，主张教育必须回应社会转型的迫切需要，将教育视为挽救民族危亡、推动社会进步的重要力量，共同呼应了救亡图存的时代主题。"},{"t":"批判传统教育，主张面向实际",
